			<h1>Front-End Guidelines: JavaScript</h1>
			<p><em>This is a series of guidelines written for my team.<br />
As they are work-in-progress, feel free to comment and make suggestions!</em></p>
<h2>General conventions</h2>
<h3>Validating, minifying and annotating JavaScript</h3>
<ul>
<li>Use <a href="http://jshint.com/" target="_blank">JSHint</a> for validating your code. Also available as a plugin for multiple text-editors, such as Notepad++ and Sublime Text.</li>
<li>Use <a href="http://closure-compiler.appspot.com/home" target="_blank">Google Closure</a> for minifying your JavaScript.</li>
<li>Use <a href="http://usejsdoc.org" target="_blank">JSDoc</a> to annotate your JavaScript with tags, recognizable by Google Closure and others. Google Closure has <a href="https://developers.google.com/closure/compiler/docs/js-for-compiler" target="_blank">additional JSDoc-documentation</a>.</li>
<li>JSHint has built-in &#8220;use strict&#8221; when validating code. If JSHint isn&#8217;t used, use &#8220;use strict&#8221; either globally or per function.</li>
</ul>
<h3>Why JSDoc?</h3>
<ul>
<li>If all variables and arguments are annotated with JSDoc-syntax, type-safe validation and minification can be applied.</li>
<li>If comments are in JSDoc-syntax as well, there are tools to extract all the JSDoc-syntax to create documentation automatically.</li>
<li>And finally: With proper JSDoc-syntax it&#8217;s just <em>so much easier</em> for new developers to understand the code.</li>
</ul>
<h3>Case</h3>
<ul>
<li>Use camelCase for function- and variable-names.</li>
<li>Use TitleCase for module-like Objects.</li>
<li>Use UPPERCASE for consts and global variables.</li>
</ul>
<h3>Brackets and semicolons</h3>
<p>Although brackets and semicolons are optional in many scenarios, it&#8217;s advised always to use them — as most JavaScript compilers and minifiers require them.</p>
<ul>
<li>Apply semicolons after all statements.</li>
<li><strong>Do not</strong>, however, apply semicolons after curly brackets, except when defining a new object, like:
<pre class="brush: jscript; title: ; notranslate" title="">
var oPerson = {};
</pre>
</li>
<li>Use curly brackets for all conditionals and loops, the only exception being very short conditionals, like:
<pre class="brush: jscript; title: ; notranslate" title="">
if (a) b = true;
</pre>
</li>
</ul>
<h3>Indentation and readability</h3>
<ul>
<li>Use tabs or spaces (either 2 or 4 spaces) for indentation. Not both. One or the other.</li>
<li>Apply a line-break (as well as indentation) after opening curly brackets.</li>
</ul>
<p><strong>Example:</strong></p>
<pre class="brush: jscript; title: ; notranslate" title="">
if (a &gt; 2) {
  for (i = l; l--;) {
    console.log(a[l]);
  }
} 
else {
  console.log(&quot;none&quot;);
}
</pre>
<p>—Will be compiled in Google Closure to:</p>
<pre class="brush: jscript; title: ; notranslate" title="">
if(2&lt;a)for(i=l;l--;)console.log(a[l]);else console.log(&quot;none&quot;);
</pre>
<h2>Variables</h2>
<ul>
<li>Variables should be declared at the <strong>highest point of their scope</strong> (i.e at the top of a function), not &#8220;as you go along&#8221;.</li>
<li><strong>Do not</strong> declare global variables, as this might interfere with —or break— other code.</li>
<li>Always declare variables within an object-scope or a function.</li>
<li>It&#8217;s not recommended to use <em>const </em>and <em>let</em> yet, as they&#8217;re only supported in a limited group of browsers.</li>
</ul>
<p>Variables should be prefixed with a letter or short string indicating their type, so either prefix like this:</p>
<ul>
<li>a = Array</li>
<li>b = Boolean</li>
<li>d = Date</li>
<li>e = Event</li>
<li>f = Function (When used as parameter)</li>
<li>i, j, k = Iterators</li>
<li>n = Number</li>
<li>o = Object</li>
<li>r = RegExp</li>
<li>s = String</li>
<li>v = Variable**)</li>
<li>y = Symbol</li>
</ul>
<p>— Or this:</p>
<ul>
<li>arr = Array</li>
<li>bln = Boolean</li>
<li>dte = Date</li>
<li>err = Error</li>
<li>evt = Event</li>
<li>fnc = Function</li>
<li>num = Number*)</li>
<li>obj = Object</li>
<li>rxp = RegExp</li>
<li>str = String</li>
<li>sym = Symbol</li>
<li>var = Variable</li>
</ul>
<p>*) When using this format, subtypes like &#8220;dbl&#8221; (Double), &#8220;int&#8221; (Integer) or &#8220;flt&#8221; (Float) can also be used.<br />
**) Variable data-type, for scenarios where the variable can be one of multiple types.</p>
<p><strong>Annotate variables in JSDoc-format:</strong><br />
The format consists of a tag (const, constructur, type etc.), a value in curly brackets, the variable name itself (in optional, square brackets) — and a short, optional description.</p>
<p><em>Example:</em></p>
<pre class="brush: jscript; title: ; notranslate" title="">
/** @type {Array} aNames -- An array of names.   */
</pre>
<h3>DOM elements</h3>
<p>When referring to a DOM-element more than once, create a variable pointing to the DOM-element instead.</p>
<p><em>Consider this:</em></p>
<pre class="brush: jscript; title: ; notranslate" title="">
var oParent = document.querySelectorAll(&quot;.myParentNode&quot;);
for (i = 0; i &lt; oParent.length; i++) { etc...
</pre>
<p>This loop will contact the DOM with each iteration (number of total elements).<br />
A much more efficient way of doing the same loop would be:</p>
<pre class="brush: jscript; title: ; notranslate" title="">
var oParent = document.querySelectorAll(&quot;.myParentNode&quot;),
    nLength = oParent.length;
for (i = nLength; i--;) { etc...
</pre>
<p>The length of the nodelist is stored in the variable <em>nLength</em>, thus avoiding contacting the DOM for each iteration.</p>
<p>If the order of the loop is irrelevant, a negative loop is approx. 30% faster.</p>
<h2>Functions</h2>
<p>A function&#8217;s arguments should also be annotated in JSDoc-format.<br />
<strong>Example:</strong></p>
<pre class="brush: jscript; title: ; notranslate" title="">
/**
* xhrJSON --- Fires a XMLHttpRequest, the onreadystate-function parses JSON and runs a callback-function.
* @param {string} sURI -- The URI of the request.
* @param {Function} fCallBack -- An optional callback-function.
* @param {Object} [oArgs] -- Callback-arguments.
*/
</pre>
<p>To indicate that an argument is optional, wrap it&#8217;s name in <em>square brackets</em>:</p>
<pre class="brush: jscript; title: ; notranslate" title="">
/**
* xhrJSON --- Fires a XMLHttpRequest, the onreadystate-function parses JSON and runs an optional callback-function.
* @param {string} sURI -- The URI of the request.
* @param {Function} [fCallBack] -- An optional callback-function.
* @param {?} [oArgs] Optional callback-arguments. Can either be the arguments-object or an array.
*/
</pre>
<p>Note the {?} to indicate unknown or multiple types.</p>
<h3>Anonymous / Self-executing functions</h3>
<p>There&#8217;s a slight overhead performance-wise when using unnamed, anonymous functions.<br />
A normal function with parameters is always faster.</p>
<p><strong>Example from <a href="http://jsperf.com/anonymous-function-overhead" target="_blank">jsPerf</a>:</strong></p>
<pre class="brush: jscript; title: ; notranslate" title="">
var fn = function(j) { return j;}
    
for (var i = 0; i &lt; 10000; i++) {
  var result = fn(i);
}
</pre>
<p>—Executes significantly faster (more than 80%) than:</p>
<pre class="brush: jscript; title: ; notranslate" title="">
for (var i = 0; i &lt; 10000; i++) {
    var result = (function() { return i; })();
}
</pre>
<p>&mdash;It&#8217;s not only in loops. Anonymous/Self-executing functions benefit from regular, named functions with parameters, in all cases.</p>
<p><strong>Example from <a href="http://jsperf.com/try-catch-test-with-anonymous-functions" target="_blank">jsPerf</a>:</strong></p>
<pre class="brush: jscript; title: ; notranslate" title="">
try {
  var v = test(-1);
  test(v);
} catch (e) {
  console.log(e);
}
</pre>
<p>—Executes significantly faster than:</p>
<pre class="brush: jscript; title: ; notranslate" title="">
function
try {
  (function() {
    var v = test(-1);
    test(v);
  })();
} catch (e) {
  (function() {
    console.log(e);
  })();
}
</pre>
<h2>Coercion</h2>
<ul>
<li>Use strict coercion, where both value and type are compared, as in:
<pre class="brush: jscript; title: ; notranslate" title="">
a === b
a !== b
</pre>
<li>Use loose coercion <strong>only</strong> if that&#8217;s <em>specifically</em> what you want to achieve:
<pre class="brush: jscript; title: ; notranslate" title="">
var a = 42;
var b = &quot;42&quot;;
a === b; // false
a == b; // true
</pre>
</li>
</ul>
<h2>Events</h2>
<ul>
<li>Add events with <em>addEventListener</em>.</li>
<li>Remove events with <em>removeEventListener</em>.</li>
<li>Create events with <em>new Event(evtname)</em>.</li>
<li>Dispatch events with <em>dispatchEvent</em>:
<pre class="brush: jscript; title: ; notranslate" title="">
eTrigger = new Event(&quot;myEvent);
document.body.dispatchEvent(eTrigger);
</pre>
</li>
<li>In some scenarios it makes sense to use the classic way of assigning events, like <em>onclick</em> and <em>onchange</em> &mdash; and dispatch them with <em>element.eventType()</em>.<br />
The danger here is, that these events could be overwritten by precisely <em>addEventListener</em>. Handle with care.</li>
</ul>
<h3>Debouncing</h3>
<ul>
<li>Debounce events when triggered repeatedly, by wrapping the event-function in a timeout:
<pre class="brush: jscript; title: ; notranslate" title="">
var myFunction = debounce(function() {
	// Code here ...
}, 250); 

element.addEventListener(&quot;eventType&quot;, myFunction);
</pre>
<p>&mdash;Where <em>debounce</em> could be <a href="http://davidwalsh.name/javascript-debounce-function" target="_blank">this</a> or <a href="https://remysharp.com/2010/07/21/throttling-function-calls" target="_blank">this</a>.
</li>
</ul>
<h2>this, call and apply</h2>
<p><em>this</em> in JavaScript refers to the <em>scope</em> in which a function is executed. Hence <em>this</em> changes relatively to where it&#8217;s executed. When used correctly, <em>this</em> can save a lot of extra code by re-using functionality.</p>
<p><em>Consider this code:</em></p>
<pre class="brush: jscript; title: ; notranslate" title="">
function testThis(num) {
  console.log( &quot;num: &quot; + num );
  this.count++;
}
</pre>
<p>&mdash;When executed like this, it will return <em>undefined</em> &#8211; but when it&#8217;s executed with an <em>object</em> (the &#8220;this&#8221;, which in this case requires the property &#8220;count&#8221;):</p>
<pre class="brush: jscript; title: ; notranslate" title="">
var data = {
  count: 5
}

for (i = 0; i &lt; 10; i++) {
  testThis.call(data, i);
}
</pre>
<p>&mdash;<em>data.count</em> will be 15 as expected.</p>
<ul>
<li>Use <em>call</em> to run a function with a specific scope (this) with a single argument.</li>
<li>Use <em>apply</em> to run a function with a specific scope (this) with an array of arguments.</li>
</ul>
