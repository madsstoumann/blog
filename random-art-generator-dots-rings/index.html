			<h1>Random Art Generator: Dots &amp; Rings</h1>
			<p>If you like random art, I've just released a new tool for generating random rings and dots (in <code>&lt;svg&gt;</code>).</p>

<p>With the editor, you can tweak a lot of parameters (Click the “Random!”-button to get started):</p>

<p><a href="assets/701816/10cbb469.jpg" class="article-body-image-wrapper"><img src="assets/701816/10cbb469.jpg" alt="Editor" loading="lazy" width="630" height="1268"></a></p>

<p>And render art like these examples: </p>

<p><a href="assets/701816/75a51ed0.jpg" class="article-body-image-wrapper"><img src="assets/701816/75a51ed0.jpg" alt="image1" loading="lazy" width="800" height="800"></a></p>

<p><a href="assets/701816/7219fb79.jpg" class="article-body-image-wrapper"><img src="assets/701816/7219fb79.jpg" alt="image2" loading="lazy" width="709" height="706"></a></p>

<p><a href="assets/701816/210154bf.jpg" class="article-body-image-wrapper"><img src="assets/701816/210154bf.jpg" alt="image3" loading="lazy" width="800" height="802"></a></p>

<p><a href="assets/701816/70b63584.jpg" class="article-body-image-wrapper"><img src="assets/701816/70b63584.jpg" alt="image4" loading="lazy" width="800" height="801"></a></p>

<p>When you've made a piece you'd like to save, click on “Export", chose a file format, then click on “Save to Image”.</p>

</p>
