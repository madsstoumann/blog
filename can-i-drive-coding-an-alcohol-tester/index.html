			<h1>Can I Drive? Coding an Alcohol Tester</h1>
			<p>In Denmark, where I live, we unfortunately hold a record within Europe: our kids are the heaviest drinkers of alcohol on the continent. Because of this, there’s a strong focus on reducing youth alcohol consumption and educating kids about the effects of alcohol.</p>

<p>I put together an alcohol calculator in HTML and JavaScript for our local school to show students how alcohol affects the body and how blood alcohol content (BAC) is calculated.</p>

<h2>
  <a name="how-is-bac-calculated" href="#how-is-bac-calculated">
  </a>
  How is BAC Calculated?
</h2>

<p>To estimate BAC or "promille," you need a few key pieces of information:</p>

<ul>
<li>
<strong>Your body weight</strong> – since a larger body can dilute alcohol more than a smaller one.</li>
<li>
<strong>Biological gender</strong> – due to different body water content levels, which affect alcohol distribution in the body.</li>
<li>
<strong>The number of alcohol units consumed</strong> – because each type of drink has a different alcohol concentration.</li>
</ul>

<h2>
  <a name="calculating-alcohol-units" href="#calculating-alcohol-units">
  </a>
  Calculating Alcohol Units
</h2>

<p>Different drinks contribute different amounts of alcohol to your bloodstream, depending on their volume and alcohol concentration. To standardize this, the unit of alcohol calculation is typically done as follows:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight plaintext"><code>volume (cl) * alcohol percentage * 0.8 / 120
</code></pre>

<h2>
  <a name="structure" href="#structure">
  </a>
  Structure
</h2>

<p>The entire "app" is structured as a <code>&lt;form&gt;</code> with organized fieldsets and named controls, making it easy to extract the necessary elements with:<br>
</p>

<p>Since <strong>BAC limits</strong> vary by region, we need to first select a region, adjust the <code>weight</code> slider, and choose a biological gender:</p>

<p><a href="assets/2090550/67568d96.jpg" class="article-body-image-wrapper"><img src="assets/2090550/67568d96.jpg" alt="Profile Details" loading="lazy" width="800" height="372"></a></p>


<hr>

<p>Next, we can start adding beverages:</p>

<p><a href="assets/2090550/a3cc12f3.jpg" class="article-body-image-wrapper"><img src="assets/2090550/a3cc12f3.jpg" alt="Add beverages" loading="lazy" width="800" height="265"></a></p>

<p>This is a simple <code>&lt;fieldset&gt;</code>, where the individual fields for units, volume and alcohol percentage are <code>disabled</code> (and hidden via CSS), until you make a selection from the beverage-selector:</p>

<p><a href="assets/2090550/e1f30da4.jpg" class="article-body-image-wrapper"><img src="assets/2090550/e1f30da4.jpg" alt="Add beverages, details" loading="lazy" width="800" height="642"></a></p>

<p>The visibility of these fields is controlled from a <code>enableElements</code>-function:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="p">[</span><span class="nx">percentage</span><span class="p">,</span> <span class="nx">units</span><span class="p">,</span> <span class="nx">volume</span><span class="p">].</span><span class="nf">forEach</span><span class="p">(</span><span class="nx">el</span> <span class="o">=&gt;</span> <span class="nx">el</span><span class="p">.</span><span class="nx">disabled</span> <span class="o">=</span> <span class="o">!</span><span class="nx">bool</span><span class="p">);</span>
</code></pre>

<p>When we then <em>add</em> the beverage, a list of consumed beverages is created, and the BAC, estimated hours to sober up, etc., are calculated:</p>

<p><a href="assets/2090550/c830ee25.jpg" class="article-body-image-wrapper"><img src="assets/2090550/c830ee25.jpg" alt="Consumed beverages" loading="lazy" width="800" height="218"></a></p>

<p>You can then continue to add <strong>more</strong> beverages, and the BAC updates accordingly:</p>

<p><a href="assets/2090550/5dd4bbd9.jpg" class="article-body-image-wrapper"><img src="assets/2090550/5dd4bbd9.jpg" alt="More beverages" loading="lazy" width="800" height="270"></a></p>

<p>It was <strong>very</strong> surprising for me to learn, that the legal BAC in the U.S. is 4x greater than that of Sweden or Norway!</p>

<p>In other words, in Sweden, you could <strong>lose your license</strong> for drinking an amount that would be legally permissible in the U.S.</p>


<hr>

<h2>
  <a name="breaking-down-the-bac-calculation" href="#breaking-down-the-bac-calculation">
  </a>
  Breaking Down the BAC Calculation
</h2>

<p>The core calculation for BAC is handled in the <code>calculateAnswer</code> function:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">function</span> <span class="nf">calculateAnswer</span><span class="p">()</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">alcoholMetabolismRate</span> <span class="o">=</span> <span class="mf">0.015</span><span class="p">;</span>
  <span class="kd">const</span> <span class="nx">currentBAC</span> <span class="o">=</span>
    <span class="p">((</span><span class="nx">total</span> <span class="o">*</span> <span class="mi">10</span><span class="p">)</span> <span class="o">/</span>
      <span class="p">(</span><span class="nx">weight</span><span class="p">.</span><span class="nx">valueAsNumber</span> <span class="o">*</span>
        <span class="mi">1000</span> <span class="o">*</span>
        <span class="nf">parseFloat</span><span class="p">(</span><span class="nx">bodywater</span><span class="p">.</span><span class="nx">value</span><span class="p">)))</span> <span class="o">*</span>
    <span class="mi">100</span><span class="p">;</span>
  <span class="kd">const</span> <span class="nx">hoursToSober</span> <span class="o">=</span> <span class="p">(</span>
    <span class="nx">currentBAC</span> <span class="o">/</span> <span class="nx">alcoholMetabolismRate</span>
  <span class="p">).</span><span class="nf">toFixed</span><span class="p">(</span><span class="mi">1</span><span class="p">);</span>
  <span class="kd">const</span> <span class="nx">canDrive</span> <span class="o">=</span>
    <span class="nx">currentBAC</span> <span class="o">&lt;=</span> <span class="nf">parseFloat</span><span class="p">(</span><span class="nx">limit</span><span class="p">.</span><span class="nx">value</span><span class="p">);</span>
  <span class="nx">answer</span><span class="p">.</span><span class="nx">value</span> <span class="o">=</span> <span class="s2">`Current BAC: </span><span class="p">${</span><span class="nx">currentBAC</span><span class="p">.</span><span class="nf">toFixed</span><span class="p">(</span><span class="mi">2</span><span class="p">)}</span><span class="s2">%. 
  Time to sober: </span><span class="p">${</span><span class="nx">hoursToSober</span><span class="p">}</span><span class="s2"> hours. </span><span class="p">${</span>
    <span class="nx">canDrive</span>
      <span class="p">?</span> <span class="dl">"</span><span class="s2">You are fit to drive.</span><span class="dl">"</span>
      <span class="p">:</span> <span class="dl">"</span><span class="s2">You are NOT fit to drive.</span><span class="dl">"</span>
  <span class="p">}</span><span class="s2">`</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

</svg>

</div>
</div>
</div>



<p>Let’s break it down:</p>

<ol>
<li>
<p><strong>Alcohol Metabolism Rate</strong>: <code>alcoholMetabolismRate = 0.015</code></p>

<ul>
<li>This value represents the average rate at which the body reduces BAC per hour (approximately 0.015%).</li>
</ul>
</li>
<li>
<p><strong>Calculating Current BAC</strong>: <code>currentBAC = ((total * 10) / ((weight.valueAsNumber * 1000) * parseFloat(bodywater.value))) * 100</code></p>

<ul>
<li>
<strong><code>total * 10</code></strong>: This converts the total alcohol units consumed into grams (since one unit equals about 10 grams of pure alcohol).</li>
<li>
<strong><code>weight.valueAsNumber * 1000</code></strong>: Converts body weight from kilograms to grams for calculation purposes.</li>
<li>
<strong><code>bodywater.value</code></strong>: A decimal factor based on biological gender, affecting how alcohol distributes in the body (e.g., 0.58 for males, 0.49 for females).</li>
<li>The result is then multiplied by 100 to convert BAC to a percentage.</li>
</ul>
</li>
<li>
<p><strong>Estimating Hours to Sober</strong>: <code>hoursToSober = (currentBAC / alcoholMetabolismRate).toFixed(1);</code></p>

<ul>
<li>Divides the <code>currentBAC</code> by the metabolism rate to estimate the time needed for BAC to reach zero.</li>
</ul>
</li>
<li>
<p><strong>Determining Legal Driving Status</strong>: <code>canDrive = currentBAC &lt;= parseFloat(limit.value);</code></p>

<ul>
<li>Compares <code>currentBAC</code> to the selected legal BAC limit. If the current BAC is within the limit, the user is considered "fit to drive"; otherwise, they are not.</li>
</ul>
</li>
</ol>

<p>The <code>calculateAnswer</code> function then combines these values into a message that shows the current BAC, hours until sober, and whether the user is fit to drive.</p>


<hr>

<p>… And that concludes this tutorial. Feel free to experiment with the CodePen if you’d like — perhaps by creating a more child-friendly UX. Just remember, this tool provides an estimate and doesn’t account for factors like the time you consumed each beverage. And keep in mind, it will most likely be used by sober people!</p>
