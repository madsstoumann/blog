		<article>
			<h1>Getting Creative with CSS Grid</h1>
			<p>Grids don't have to be boring! You can easily spice up a classic 12x12 grid with <strong>very</strong> few lines of CSS — it's time to master <code>grid-area</code>!</p>

<p>First, let's create a <code>&lt;figure&gt;</code>-tag with a class:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;figure</span> <span class="na">class=</span><span class="s">"ui-bubble-grid"</span><span class="nt">&gt;</span>
 <span class="c">&lt;!--IMAGES--&gt;</span>
<span class="nt">&lt;/figure&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Within that tag, add images — I'm using:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;img</span> <span class="na">src=</span><span class="s">"https://source.unsplash.com/random/300x300?sig=1"</span> 
<span class="na">alt=</span><span class="s">"TEXT"</span> <span class="na">width=</span><span class="s">"300"</span> <span class="na">height=</span><span class="s">"300"</span><span class="nt">&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Replace the <code>sig=1</code> with <code>sig=2</code> etc. for more random images.</p>

<p>Next, let's add a simple 12x12 grid in CSS:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:where</span><span class="o">(</span><span class="nc">.ui-bubble-grid</span><span class="o">)</span> <span class="p">{</span>
  <span class="nl">all</span><span class="p">:</span> <span class="n">unset</span><span class="p">;</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">grid</span><span class="p">;</span>
  <span class="py">grid-template-columns</span><span class="p">:</span> <span class="nb">repeat</span><span class="p">(</span><span class="m">12</span><span class="p">,</span> <span class="m">1</span><span class="n">fr</span><span class="p">);</span>
  <span class="py">grid-template-rows</span><span class="p">:</span> <span class="nb">repeat</span><span class="p">(</span><span class="m">12</span><span class="p">,</span> <span class="m">1</span><span class="n">fr</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Let's also add some nested default styles for images:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">img</span> <span class="p">{</span>
  <span class="nl">background</span><span class="p">:</span> <span class="m">#CCC</span><span class="p">;</span>
  <span class="nl">height</span><span class="p">:</span> <span class="nb">auto</span><span class="p">;</span>
  <span class="nl">object-fit</span><span class="p">:</span> <span class="n">cover</span><span class="p">;</span>
  <span class="nl">width</span><span class="p">:</span> <span class="m">100%</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>This will ensure the images take up all of the assigned "grid-space".</p>

<p>Let's see what we have:</p>

<p><a href="assets/1863603/330354d5.jpg" class="article-body-image-wrapper"><img src="assets/1863603/330354d5.jpg" alt="Initial" loading="lazy" width="800" height="799"></a></p>

<blockquote>
<p><strong>Note:</strong> For the grid-view, select the <code>&lt;figure&gt;</code>-tag in Dev Tools, and click on the "grid"-button:</p>
</blockquote>

<p><a href="assets/1863603/1a6fbb57.jpg" class="article-body-image-wrapper"><img src="assets/1863603/1a6fbb57.jpg" alt="Dev Tools" loading="lazy" width="259" height="16"></a></p>


<hr>

<p>OK, so not much going on yet. Each image automatically fills up one grid-cell.</p>

<p>Let's change that with <code>grid-area</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">&amp;</span><span class="nd">:nth-child</span><span class="o">(</span><span class="err">1</span><span class="o">)</span> <span class="p">{</span> <span class="py">grid-area</span><span class="p">:</span> <span class="m">1</span> <span class="p">/</span> <span class="m">1</span> <span class="p">/</span> <span class="m">7</span> <span class="p">/</span> <span class="m">7</span><span class="p">;</span> <span class="p">}</span>
<span class="o">&amp;</span><span class="nd">:nth-child</span><span class="o">(</span><span class="err">2</span><span class="o">)</span> <span class="p">{</span> <span class="py">grid-area</span><span class="p">:</span> <span class="m">5</span> <span class="p">/</span> <span class="m">5</span> <span class="p">/</span> <span class="m">11</span> <span class="p">/</span> <span class="m">11</span><span class="p">;</span> <span class="p">}</span>
<span class="o">&amp;</span><span class="nd">:nth-child</span><span class="o">(</span><span class="err">3</span><span class="o">)</span> <span class="p">{</span> <span class="py">grid-area</span><span class="p">:</span> <span class="m">9</span> <span class="p">/</span> <span class="m">3</span> <span class="p">/</span> <span class="m">13</span> <span class="p">/</span> <span class="m">7</span><span class="p">;</span> <span class="p">}</span>
<span class="o">&amp;</span><span class="nd">:nth-child</span><span class="o">(</span><span class="err">4</span><span class="o">)</span> <span class="p">{</span> <span class="py">grid-area</span><span class="p">:</span> <span class="m">3</span> <span class="p">/</span> <span class="m">9</span> <span class="p">/</span> <span class="m">7</span> <span class="p">/</span> <span class="m">13</span><span class="p">;</span> <span class="p">}</span>
<span class="o">&amp;</span><span class="nd">:nth-child</span><span class="o">(</span><span class="err">5</span><span class="o">)</span> <span class="p">{</span> <span class="py">grid-area</span><span class="p">:</span> <span class="m">8</span> <span class="p">/</span> <span class="m">1</span> <span class="p">/</span> <span class="m">11</span> <span class="p">/</span> <span class="m">4</span><span class="p">;</span> <span class="p">}</span>
<span class="o">&amp;</span><span class="nd">:nth-child</span><span class="o">(</span><span class="err">6</span><span class="o">)</span> <span class="p">{</span> <span class="py">grid-area</span><span class="p">:</span> <span class="m">2</span> <span class="p">/</span> <span class="m">8</span> <span class="p">/</span> <span class="m">4</span> <span class="p">/</span> <span class="m">10</span><span class="p">;</span> <span class="p">}</span>
<span class="o">&amp;</span><span class="nd">:nth-child</span><span class="o">(</span><span class="err">7</span><span class="o">)</span> <span class="p">{</span> <span class="py">grid-area</span><span class="p">:</span> <span class="m">10</span> <span class="p">/</span> <span class="m">10</span> <span class="p">/</span> <span class="m">13</span> <span class="p">/</span> <span class="m">13</span><span class="p">;</span> <span class="p">}</span>
<span class="o">&amp;</span><span class="nd">:nth-child</span><span class="o">(</span><span class="err">8</span><span class="o">)</span> <span class="p">{</span> <span class="py">grid-area</span><span class="p">:</span> <span class="m">1</span> <span class="p">/</span> <span class="m">11</span> <span class="p">/</span> <span class="m">3</span> <span class="p">/</span> <span class="m">13</span><span class="p">;</span> <span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>… and we get:</p>

<p><a href="assets/1863603/18ac5a3b.jpg" class="article-body-image-wrapper"><img src="assets/1863603/18ac5a3b.jpg" alt="Grid Area" loading="lazy" width="800" height="803"></a></p>

<p><strong>Wait! What?</strong> Let's dive into that! <code>grid-area</code> is short for:</p>

<ul>
<li>grid-row-start</li>
<li>grid-column-start</li>
<li>grid-row-end</li>
<li>grid-column-end</li>
</ul>

<blockquote>
<p><strong>Note:</strong> If you find <code>grid-area</code> hard to read, you can use <code>grid-column</code> and <code>grid-row</code> instead.</p>
</blockquote>

<p>Now, if we look at the first image, it has this code:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight plaintext"><code>{ grid-area: 1 / 1 / 7 / 7; }
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>We start at the <strong>first row</strong> (1) and the <strong>first column</strong> (1). </p>

<p>We want the image to take up 6x6 cells, so the <strong>end row</strong> and <strong>end column</strong> are 7, as <code>7 - 1 = 6</code>.</p>

<p>For the next image, we want to layer it on top of the first image (bottom right) with a slight offset. Looking at the grid, that'll be <strong>column 5</strong> and <strong>row 5</strong>. As we also want the next image to be 6x6, the CSS is:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight plaintext"><code>{ grid-area: 5 / 5 / 11 / 11; }
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Now, I encourage you to study the other <code>grid-area</code>-parts I made. Play around with them, move stuff around: make your own grid!</p>

<p>When you're ready, let's add a <code>border-radius: 50%</code> to the <code>img</code> in CSS, and we get:</p>

<p><a href="assets/1863603/29582b5c.jpg" class="article-body-image-wrapper"><img src="assets/1863603/29582b5c.jpg" alt="Border Radius" loading="lazy" width="800" height="796"></a></p>

<p>Nice! Now, let's de-select the grid-preview in Dev Tools and see what we've created:</p>

<p><a href="assets/1863603/a6bc736e.jpg" class="article-body-image-wrapper"><img src="assets/1863603/a6bc736e.jpg" alt="Bubble Grid" loading="lazy" width="800" height="773"></a></p>

<p>I like it! But what happens if you add <strong>more</strong> images than you created <code>grid-area</code>-parts for? </p>

<p>CSS grid will just find the first empty grid-cell, then the next etc.:</p>

<p><a href="assets/1863603/90bb43f9.jpg" class="article-body-image-wrapper"><img src="assets/1863603/90bb43f9.jpg" alt="More images" loading="lazy" width="800" height="796"></a></p>


<hr>

<p>What about responsiveness? The grid is resizable, but some of the images might get <strong>too</strong> small on phones. If you want — add a <code>@media</code> or <code>@container</code>-query, and then simply change the <code>grid-area</code>-parts for that breakpoint.</p>

<p>By removing the <code>border-radius</code> from <code>img</code>, adjusting the <code>grid-area</code>-parts  and adding a <code>clip-path</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight plaintext"><code>clip-path: polygon(-50% 50%, 50% 100%, 150% 50%, 50% 0);
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>— you can create a hexagonal grid, with adjustable <code>gap</code>:</p>

<p><a href="assets/1863603/2ad09cdf.jpg" class="article-body-image-wrapper"><img src="assets/1863603/2ad09cdf.jpg" alt="Hex Grid" loading="lazy" width="800" height="759"></a></p>
