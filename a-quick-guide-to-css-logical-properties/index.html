		<article>
			<h1>A Quick Guide To CSS Logical Properties</h1>
			<p>This is a post about <em>CSS Logical Properties</em>, with basic and advanced usage examples. If you think you don't need <em>CSS Logical Properties</em>, think again!</p>


<hr>

<p>If you've ever worked on a website for a global client, you'd come across the terms “left-to-right” (<code>ltr</code>) and “right-to-left” (<code>rtl</code>).</p>

<p>“left-to-right”-languages include most Western languages, like English or French, while “right-to-left”-languages include Arabic, Farsi and Hebrew.</p>

<p>On a website, you switch the (language)-direction by using <code>dir="ltr"</code> (or <code>rtl</code>) in HTML, or by using the <code>direction</code>-property in CSS.</p>

<p>So which properties will be affected, when you switch direction?<br>
Basically all properties, that include the words <code>left</code> or <code>right</code>.</p>

<p>To get a quick overview, paste this in your <code>console</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">logical</span> <span class="o">=</span> <span class="p">[</span><span class="dl">'</span><span class="s1">right</span><span class="dl">'</span><span class="p">,</span> <span class="dl">'</span><span class="s1">left</span><span class="dl">'</span><span class="p">];</span>
<span class="kd">const</span> <span class="nx">props</span> <span class="o">=</span> <span class="p">[...</span><span class="nf">getComputedStyle</span><span class="p">(</span><span class="nb">document</span><span class="p">.</span><span class="nx">body</span><span class="p">)].</span><span class="nf">filter</span><span class="p">(</span><span class="nx">entry</span> <span class="o">=&gt;</span> <span class="nx">logical</span><span class="p">.</span><span class="nf">some</span><span class="p">(</span><span class="nx">key</span> <span class="o">=&gt;</span> <span class="nx">entry</span><span class="p">.</span><span class="nf">includes</span><span class="p">(</span><span class="s2">`-</span><span class="p">${</span><span class="nx">key</span><span class="p">}</span><span class="s2">`</span><span class="p">)));</span>
<span class="nx">console</span><span class="p">.</span><span class="nf">table</span><span class="p">(</span><span class="nx">props</span><span class="p">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>But that's not all! Some languages are written <em>vertically</em>, using the CSS <code>writing-mode</code>-property. That means we need to include <code>top</code> and <code>bottom</code> to our snippet as well:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">logical</span> <span class="o">=</span> <span class="p">[</span><span class="dl">'</span><span class="s1">top</span><span class="dl">'</span><span class="p">,</span> <span class="dl">'</span><span class="s1">right</span><span class="dl">'</span><span class="p">,</span> <span class="dl">'</span><span class="s1">bottom</span><span class="dl">'</span><span class="p">,</span> <span class="dl">'</span><span class="s1">left</span><span class="dl">'</span><span class="p">];</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><strong>As well as</strong> most properties containing the words <code>height</code> or <code>width</code>.</p>

<p>If you position an element with <code>position: absolute;</code> and <code>left: 0;</code>, that will <strong>not work</strong> when you change the direction — or: it will work, but not as intended — since the element will stay <code>left</code>, while all the other content change direction.</p>

<p>To fix it, you <em>could</em> write some extra CSS for <code>rtl</code>, like:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">[</span><span class="nt">dir</span><span class="o">=</span><span class="s1">"rtl"</span><span class="o">]</span> <span class="nc">.selector</span> <span class="p">{</span>
  <span class="nl">left</span><span class="p">:</span> <span class="nb">auto</span><span class="p">;</span>
  <span class="nl">right</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>But … that would be <em>way</em> too much work for a website with many components, and just add a lot of unnessecary CSS to the solution.</p>

<p>Luckily, there's a smarter way. </p>


<hr>

<h2>
  <a name="css-logical-properties" href="#css-logical-properties">
  </a>
  CSS Logical Properties
</h2>

<p><em>From MDN</em>:</p>

<blockquote>
<p>CSS Logical Properties and Values is a module of CSS introducing logical properties and values that provide the ability to control layout through logical, rather than physical, direction and dimension mappings</p>
</blockquote>

<p>With <em>Logical Properties</em>, <code>left</code> and <code>right</code> are <code>inline</code>, while <code>top</code> and <code>bottom</code> are <code>block</code>. </p>

<p>To indicate direction within this “box”, we use the words <code>start</code> and <code>end</code>. </p>

<p>So, for positioning, the new values are:</p>

<div class="table-wrapper-paragraph"><table>
<thead>
<tr>
<th>Value</th>
<th>Logical Value</th>
</tr>
</thead>
<tbody>
<tr>
<td>left</td>
<td>inset-inline-start</td>
</tr>
<tr>
<td>right</td>
<td>inset-inline-end</td>
</tr>
<tr>
<td>top</td>
<td>inset-block-start</td>
</tr>
<tr>
<td>bottom</td>
<td>inset-block-end</td>
</tr>
</tbody>
</table></div>

<p>With logical properties, you can also set all of them in one go, something that was not possible before:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.before</span> <span class="p">{</span>
  <span class="nl">position</span><span class="p">:</span> <span class="nb">fixed</span><span class="p">;</span>
  <span class="nl">top</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="nl">right</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="nl">bottom</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="nl">left</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
<span class="p">}</span>
<span class="nc">.after</span> <span class="p">{</span>
  <span class="nl">position</span><span class="p">:</span> <span class="nb">fixed</span><span class="p">;</span>
  <span class="py">inset</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><code>margin-top</code> becomes <code>margin-block-start</code>, while <code>margin-bottom</code> becomes <code>margin-block-end</code>.</p>

<p><code>margin-left</code> becomes <code>margin-inline-start</code>, and <code>margin-right</code> becomes <code>margin-inline-end</code>.</p>

<p>Etcetera: <code>border-block</code>, <code>border-inline</code>, <code>padding-block</code> … </p>

<p>The only properties that deviate from this format, are the “border-radii”:</p>

<div class="table-wrapper-paragraph"><table>
<thead>
<tr>
<th>Value</th>
<th>Logical Value</th>
</tr>
</thead>
<tbody>
<tr>
<td>border-top-left-radius</td>
<td>border-start-start-radius</td>
</tr>
<tr>
<td>border-top-right-radius</td>
<td>border-start-end-radius</td>
</tr>
<tr>
<td>border-bottom-left-radius</td>
<td>border-end-start-radius</td>
</tr>
<tr>
<td>border-bottom-right-radius</td>
<td>border-end-end-radius</td>
</tr>
</tbody>
</table></div>

<p>But enough talking. The <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Logical_Properties" target="_blank" rel="noopener noreferrer">documentation is here</a>, now, let's look at some examples!</p>


<hr>

<h2>
  <a name="examples" href="#examples">
  </a>
  Examples
</h2>

<p>Here's a product-card, with a <code>dir="ltr"</code>:<br>
<a href="assets/728693/bc07cfb9.jpg" class="article-body-image-wrapper"><img src="assets/728693/bc07cfb9.jpg" alt="01-ltr" loading="lazy" width="400" height="575"></a></p>

<p>Here's the same card, but with <code>dir="rtl"</code>:<br>
<a href="assets/728693/da2543ac.jpg" class="article-body-image-wrapper"><img src="assets/728693/da2543ac.jpg" alt="02-rtl" loading="lazy" width="400" height="575"></a></p>

<p>Hmm, that “Best value”-caption is placed with <code>position: absolute</code> and <code>left: 0;</code>, and it will stay there, even if we change the direction.</p>

<p>Let's change that to:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.caption</span> <span class="p">{</span>
  <span class="py">inset-inline-start</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="nl">position</span><span class="p">:</span> <span class="nb">absolute</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><a href="assets/728693/1209d6db.jpg" class="article-body-image-wrapper"><img src="assets/728693/1209d6db.jpg" alt="03-rtlfix" loading="lazy" width="400" height="224"></a></p>

<p>Much better! Now, let's add a <em>splash</em> with <code>inset-inline-end: 0</code>:</p>

<p><a href="assets/728693/1fabc35c.jpg" class="article-body-image-wrapper"><img src="assets/728693/1fabc35c.jpg" alt="04-splash-ltr" loading="lazy" width="400" height="225"></a></p>

<p>Looks good, but it could do with some spacing. Let's not hardcode the spacing, as an editor might want to position this <em>splash</em> as s/he wants, using <em>Custom Properties</em> <code>translate-x: var(--S-tx, -10%)</code> and <code>translate-y: var(--S-ty, 10%)</code>:</p>

<p><a href="assets/728693/457acd74.jpg" class="article-body-image-wrapper"><img src="assets/728693/457acd74.jpg" alt="05-splash-txltr" loading="lazy" width="415" height="236"></a></p>

<p>Now, what happens when we switch direction?</p>

<p><a href="assets/728693/372b6fb8.jpg" class="article-body-image-wrapper"><img src="assets/728693/372b6fb8.jpg" alt="06-splash-txrtl" loading="lazy" width="400" height="225"></a></p>

<p>Hmm, not good - the translated values persist. And — as I mentioned — if the editors can dynamically change the position, we <strong>cannot</strong> hardcode the values. </p>

<p>Unfortunately, <code>translate-inline</code> or <code>translate-block</code> does not exist, so let's add a property for <code>scaleX</code>, <code>--S-sx</code>, with a default value of <code>1</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.splash</span> <span class="p">{</span>
  <span class="nl">transform</span><span class="p">:</span>
    <span class="n">scaleX</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--S-sx</span><span class="p">,</span> <span class="m">1</span><span class="p">))</span>
    <span class="n">translateX</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--S-tx</span><span class="p">,</span> <span class="m">0%</span><span class="p">))</span>
    <span class="n">translateY</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--S-ty</span><span class="p">,</span> <span class="m">0%</span><span class="p">))</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Then, with <code>dir="rtl"</code>, we can simply update that property:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">[</span><span class="nt">dir</span><span class="o">=</span><span class="s1">"rtl"</span><span class="o">]</span> <span class="nc">.splash</span> <span class="p">{</span> <span class="py">--S-sx</span><span class="p">:</span> <span class="m">-1</span><span class="p">;</span> <span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>That works! <code>scaleX(1)</code> becomes <code>scaleX(-1)</code> — but it will also flip the text-lines! To fix this, we'll add a wrapper around the text-lines, and flip that too:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">[</span><span class="nt">dir</span><span class="o">=</span><span class="s1">"rtl"</span><span class="o">]</span> <span class="nc">.splash-lines</span> <span class="p">{</span> <span class="nl">transform</span><span class="p">:</span> <span class="n">scaleX</span><span class="p">(</span><span class="m">-1</span><span class="p">)</span> <span class="n">translateX</span><span class="p">(</span><span class="m">-100%</span><span class="p">);</span> <span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><a href="assets/728693/9f042223.jpg" class="article-body-image-wrapper"><img src="assets/728693/9f042223.jpg" alt="07-splashtxrtlfix" loading="lazy" width="423" height="238"></a></p>

<p>In this example, you could also have used <code>margin-inline-end: -10%;</code> and <code>margin-block-start: 10%;</code> — but I use the <code>translate</code> and <code>scaleX</code>- method, so the <em>splash</em> can have different shapes, that will then be flipped:</p>

<p>Here's another example in <code>ltr</code>:<br>
<a href="assets/728693/bd9f9e59.jpg" class="article-body-image-wrapper"><img src="assets/728693/bd9f9e59.jpg" alt="12-splashshape1" loading="lazy" width="429" height="239"></a></p>

<p>And <code>rtl</code>:<br>
<a href="assets/728693/7b9c38b4.jpg" class="article-body-image-wrapper"><img src="assets/728693/7b9c38b4.jpg" alt="13-splashshape2" loading="lazy" width="433" height="241"></a></p>

<p>As a final example, let's add an image (and a wrapper) using:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.image</span> <span class="p">{</span>
  <span class="nl">transform</span><span class="p">:</span>
    <span class="n">scaleX</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--I-sx</span><span class="p">,</span> <span class="m">1</span><span class="p">))</span>
    <span class="n">translateX</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--I-tx</span><span class="p">,</span> <span class="m">0</span><span class="p">))</span>
    <span class="n">translateY</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--I-ty</span><span class="p">,</span> <span class="m">0</span><span class="p">));</span>
<span class="p">}</span>
<span class="nc">.image-wrapper</span> <span class="p">{</span>
  <span class="py">inset-block-end</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="py">inset-inline-end</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="nl">transform</span><span class="p">:</span> <span class="n">scaleX</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--IW-sx</span><span class="p">,</span> <span class="m">1</span><span class="p">))</span> <span class="n">translateX</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--IW-tx</span><span class="p">,</span> <span class="m">0</span><span class="p">));</span>
<span class="p">}</span>
</code></pre>

<p>We'll translate it like the splash, and add a <code>drop-shadow</code>:</p>

<p><a href="assets/728693/baa2515f.jpg" class="article-body-image-wrapper"><img src="assets/728693/baa2515f.jpg" alt="08-imgltr" loading="lazy" width="400" height="259"></a></p>

<p>Using the same principle as before, but using a variable from the <code>.image</code> in a <code>calc()</code>-ulated property on the <code>.image-wrapper</code>, we can flip and adjust the position like this:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">[</span><span class="nt">dir</span><span class="o">=</span><span class="s1">"rtl"</span><span class="o">]</span> <span class="nc">.image</span> <span class="p">{</span> <span class="py">--I-sx</span><span class="p">:</span> <span class="m">-1</span><span class="p">;</span> <span class="p">}</span>
<span class="o">[</span><span class="nt">dir</span><span class="o">=</span><span class="s1">"rtl"</span><span class="o">]</span> <span class="nc">.image-wrapper</span> <span class="p">{</span> <span class="py">--IW-sx</span><span class="p">:</span> <span class="m">-1</span><span class="p">;</span> <span class="py">--IW-tx</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">-1%</span> <span class="err">*</span> <span class="n">var</span><span class="p">(</span><span class="n">--I-tx</span><span class="p">));</span> <span class="p">}</span>
</code></pre>

<p><a href="assets/728693/d34ce1d8.jpg" class="article-body-image-wrapper"><img src="assets/728693/d34ce1d8.jpg" alt="09-imgrtl" loading="lazy" width="400" height="260"></a></p>

<p>If we add a <code>perspective</code>-variable and a <code>rotateY</code>-variable, we can go even further:</p>

<p><a href="assets/728693/f14e279d.jpg" class="article-body-image-wrapper"><img src="assets/728693/f14e279d.jpg" alt="10-imgrotate" loading="lazy" width="400" height="257"></a></p>

<p>And then just update the variables for <code>rtl</code>:</p>

<p><a href="assets/728693/c5bdd1f4.jpg" class="article-body-image-wrapper"><img src="assets/728693/c5bdd1f4.jpg" alt="11-imgrotatertl" loading="lazy" width="400" height="260"></a></p>

<h2>
  <a name="conclusion" href="#conclusion">
  </a>
  Conclusion
</h2>

<p>Should you use <em>CSS Logical Properties</em> even though your website is only <code>ltr</code> now? Yes! You have nothing to lose, and your website is future-proof if you want to add international support later.</p>

<p>Thanks for reading!</p>
