			<h1>The Unofficial Dev.To Embed Web Component</h1>
			<p>The other day, I re-discovered the dev.to API and found out that it can be used <em>without</em> an API key. That’s really great if you want to embed your articles anywhere — maybe on a personal blog — without the hassle of protecting secret keys. You can fetch a list of articles by a given author or a specific article. </p>

<p>So, I coded a web component that lets you grab either a list of articles <em>or</em> a specific one. Let’s start with the “list mode”:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;dev-to</span>
  <span class="na">author=</span><span class="s">"madsstoumann"</span>
  <span class="na">theme=</span><span class="s">"classic"</span>
  <span class="na">itemsperpage=</span><span class="s">"10"</span>
  <span class="na">links=</span><span class="s">"internal"</span><span class="nt">&gt;</span>
<span class="nt">&lt;/dev-to&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Here’s what we get:<br>
<a href="assets/2270859/fe6fd933.jpg" class="article-body-image-wrapper"><img src="assets/2270859/fe6fd933.jpg" alt="List" loading="lazy" width="672" height="889"></a></p>

<p>Notice the <code>theme</code> and <code>links</code> attributes.</p>

<p>I’ve added 3 themes to choose from (but you can easily add your own):</p>

<ul>
<li>brutalist</li>
<li>classic</li>
<li>modern</li>
</ul>

<p><code>links</code> can be either “internal” or “external”. The first opens the article directly within the web component, while the latter opens the article on dev.to in a new tab.</p>

<p>Now, let’s click on “The Golden Ratio in CSS”.</p>

<p><a href="assets/2270859/0118f641.jpg" class="article-body-image-wrapper"><img src="assets/2270859/0118f641.jpg" alt="Classic Theme" loading="lazy" width="800" height="1261"></a></p>

<p>Very posh, classic theme, isn’t it?! </p>

<p>If you just want to show the article directly, without showing the list first, you can use the component in “article mode”:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;dev-to</span> <span class="na">article=</span><span class="s">"2014104"</span> <span class="na">theme=</span><span class="s">"classic"</span><span class="nt">&gt;&lt;/dev-to&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

<p>Let’s change the theme to “modern”:</p>

<p><a href="assets/2270859/ef278ca7.jpg" class="article-body-image-wrapper"><img src="assets/2270859/ef278ca7.jpg" alt="Modern" loading="lazy" width="800" height="1084"></a></p>

<p>... or how about “brutalist”, for that raw, industrial look?</p>

<p><a href="assets/2270859/9ad2f625.jpg" class="article-body-image-wrapper"><img src="assets/2270859/9ad2f625.jpg" alt="Brutalist" loading="lazy" width="800" height="1049"></a></p>

<h2>
  <a name="internationalization" href="#internationalization">
  </a>
  Internationalization
</h2>

<p>If you want to display dates and UI text in your local language, the component supports i18n this way:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;dev-to</span> 
  <span class="na">author=</span><span class="s">"madsstoumann"</span>
  <span class="na">lang=</span><span class="s">"es"</span>
  <span class="na">i18n=</span><span class="s">'{"es":{"more":"Más...","reactions":"reacciones"}}'</span><span class="nt">&gt;</span>
<span class="nt">&lt;/dev-to&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>

<h2>
  <a name="customization" href="#customization">
  </a>
  Customization
</h2>

<p>The component exposes several parts that you can style using CSS <code>::part()</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">dev-to</span><span class="nd">::part</span><span class="o">(</span><span class="nt">avatar</span><span class="o">)</span> <span class="p">{</span>
  <span class="nl">border-radius</span><span class="p">:</span> <span class="m">50%</span><span class="p">;</span>
  <span class="nl">border</span><span class="p">:</span> <span class="m">2px</span> <span class="nb">solid</span> <span class="n">currentColor</span><span class="p">;</span>
<span class="p">}</span>

<span class="nt">dev-to</span><span class="nd">::part</span><span class="o">(</span><span class="nt">cover</span><span class="o">)</span> <span class="p">{</span>
  <span class="nl">filter</span><span class="p">:</span> <span class="n">sepia</span><span class="p">(</span><span class="m">0.3</span><span class="p">);</span>
<span class="p">}</span>

<span class="nt">dev-to</span><span class="nd">::part</span><span class="o">(</span><span class="nt">more</span><span class="o">)</span> <span class="p">{</span>
  <span class="nl">background</span><span class="p">:</span> <span class="m">#ff00ff</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>

</svg>

<h2>
  <a name="shadow-dom-or-not" href="#shadow-dom-or-not">
  </a>
  Shadow DOM or Not?
</h2>

<p>If you need to style the component directly (without shadowDOM and parts), just add the <code>noshadow</code> attribute:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;dev-to</span> <span class="na">author=</span><span class="s">"madsstoumann"</span> <span class="na">noshadow</span><span class="nt">&gt;&lt;/dev-to&gt;</span>
</code></pre>
