			<h1>Why “dark mode” is more energy-efficient: How to calculate image energy-cost</h1>
			<p>When I read Tom Greenfords execellent book <a href="https://abookapart.com/products/sustainable-web-design" target="_blank" rel="noopener noreferrer">Sustainable Web Design</a>, there was one fact that stuck with me in particular:</p>

<blockquote>
<p>Running Google Maps in night mode reduced screen power draw by 63 percent.</p>
</blockquote>

<p>Why is that?</p>

<p>When you think about it, it's quite simple:</p>

<blockquote>
<p>Black is the most efficient color for OLED screens as the pixels are switched off, and white is the most energy intensive</p>
</blockquote>

<p>So images use different amounts of energy, depending on the intensity of the <code>red</code>, <code>green</code> and <code>blue</code> lights in the pixel.</p>

<p>Tom goes on to show two examples of his website <strong>before</strong> and <strong>after</strong> an update:</p>

<p><strong>Before:</strong><br>
<a href="assets/671379/991b8e00.jpg" class="article-body-image-wrapper"><img src="assets/671379/991b8e00.jpg" alt="Before" loading="lazy" width="584" height="1495"></a></p>

<p><strong>After:</strong><br>
<a href="assets/671379/9ebcc205.jpg" class="article-body-image-wrapper"><img src="assets/671379/9ebcc205.jpg" alt="After" loading="lazy" width="566" height="1495"></a></p>

<p>The latter use almost half the energy of the first one! </p>

<p>Unebelievable, right?</p>

<p>So – I sat out to create a small tool for calculating the energy-intensity of an image!</p>

<hr>
<h2>
  <a name="draw-the-image-onto-a-raw-ltcanvasgt-endraw-" href="#draw-the-image-onto-a-raw-ltcanvasgt-endraw-">
  </a>
  Draw the image onto a <code>&lt;canvas&gt;</code>
</h2>

<p>The <code>&lt;canvas&gt;</code>-tag has a really useful method: <code>getImageData()</code>, which will return a (very large!) array of all the pixels in an image – in chunks of 4: <code>red</code>, <code>green</code>, <code>blue</code> and <code>alpha</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">imgData</span> <span class="o">=</span> <span class="nx">ctx</span><span class="p">.</span><span class="nf">getImageData</span><span class="p">(</span><span class="mi">0</span><span class="p">,</span> <span class="mi">0</span><span class="p">,</span> <span class="nx">width</span><span class="p">,</span> <span class="nx">height</span><span class="p">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>With this array, we can iterate and return an array of percentages:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">len</span> <span class="o">=</span> <span class="nx">imgData</span><span class="p">.</span><span class="nx">data</span><span class="p">.</span><span class="nx">length</span> <span class="o">/</span> <span class="mi">4</span><span class="p">;</span>

<span class="kd">let</span> <span class="nx">r</span> <span class="o">=</span> <span class="mi">0</span><span class="p">,</span> <span class="nx">g</span> <span class="o">=</span> <span class="mi">0</span><span class="p">,</span> <span class="nx">b</span> <span class="o">=</span> <span class="mi">0</span><span class="p">,</span> <span class="nx">a</span> <span class="o">=</span> <span class="mi">0</span><span class="p">;</span>
<span class="k">for </span><span class="p">(</span><span class="kd">let</span> <span class="nx">i</span> <span class="o">=</span> <span class="mi">0</span><span class="p">;</span> <span class="nx">i</span> <span class="o">&lt;</span> <span class="nx">imgData</span><span class="p">.</span><span class="nx">data</span><span class="p">.</span><span class="nx">length</span><span class="p">;</span> <span class="nx">i</span> <span class="o">+=</span> <span class="mi">4</span><span class="p">)</span> <span class="p">{</span>
  <span class="nx">a</span> <span class="o">=</span> <span class="mi">255</span> <span class="o">/</span> <span class="nx">imgData</span><span class="p">.</span><span class="nx">data</span><span class="p">[</span><span class="nx">i</span> <span class="o">+</span> <span class="mi">3</span><span class="p">];</span>
  <span class="nx">r</span><span class="o">+=</span> <span class="nx">imgData</span><span class="p">.</span><span class="nx">data</span><span class="p">[</span><span class="nx">i</span><span class="p">]</span> <span class="o">/</span> <span class="mi">255</span> <span class="o">/</span> <span class="nx">a</span><span class="p">;</span>
  <span class="nx">g</span><span class="o">+=</span> <span class="nx">imgData</span><span class="p">.</span><span class="nx">data</span><span class="p">[</span><span class="nx">i</span> <span class="o">+</span> <span class="mi">1</span><span class="p">]</span> <span class="o">/</span> <span class="mi">255</span> <span class="o">/</span> <span class="nx">a</span><span class="p">;</span>
  <span class="nx">b</span><span class="o">+=</span> <span class="nx">imgData</span><span class="p">.</span><span class="nx">data</span><span class="p">[</span><span class="nx">i</span> <span class="o">+</span> <span class="mi">2</span><span class="p">]</span> <span class="o">/</span> <span class="mi">255</span> <span class="o">/</span> <span class="nx">a</span><span class="p">;</span>
<span class="p">}</span>
<span class="nx">r</span> <span class="o">=</span> <span class="nb">Math</span><span class="p">.</span><span class="nf">floor</span><span class="p">((</span><span class="nx">r</span><span class="o">/</span><span class="nx">len</span><span class="p">)</span> <span class="o">*</span> <span class="mi">100</span><span class="p">);</span>
<span class="nx">g</span> <span class="o">=</span> <span class="nb">Math</span><span class="p">.</span><span class="nf">floor</span><span class="p">((</span><span class="nx">g</span><span class="o">/</span><span class="nx">len</span><span class="p">)</span> <span class="o">*</span> <span class="mi">100</span><span class="p">);</span>
<span class="nx">b</span> <span class="o">=</span> <span class="nb">Math</span><span class="p">.</span><span class="nf">floor</span><span class="p">((</span><span class="nx">b</span><span class="o">/</span><span class="nx">len</span><span class="p">)</span> <span class="o">*</span> <span class="mi">100</span><span class="p">);</span>

<span class="k">return</span> <span class="p">[</span><span class="nx">r</span><span class="p">,</span> <span class="nx">g</span><span class="p">,</span> <span class="nx">b</span><span class="p">];</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

</svg>

<p>To get the average:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">avg</span> <span class="o">=</span> <span class="nb">Math</span><span class="p">.</span><span class="nf">ceil</span><span class="p">((</span><span class="nx">r</span><span class="o">+</span><span class="nx">g</span><span class="o">+</span><span class="nx">b</span><span class="p">)</span> <span class="o">/</span> <span class="mi">3</span><span class="p">);</span>
</code></pre>

<hr>

<h2>
  <a name="but-its-not-so-simple" href="#but-its-not-so-simple">
  </a>
  But … It's Not So Simple
</h2>

<p>While this tool will give you a hint about the energy-usage of an image, it's much more complex than that.</p>

<p>The <a href="https://en.wikipedia.org/wiki/Visible_spectrum" target="_blank" rel="noopener noreferrer">photon energy</a> differs for different wavelengths, with red being lowest and violet being highest.</p>

<p>A pixel contains approx. 10.000 photons, so I assume it's possible to calculate the <strong>eV</strong> cost of an image in a particular resolution – and then convert that number to <strong>Watt</strong> – but it's beyond my skills!</p>

<h2>
  <a name="conclusion" href="#conclusion">
  </a>
  Conclusion
</h2>

<p>It would be nice, if a tool like <em>Lighthouse</em> could calculate the energy-effectiveness of a website – perhaps compared to a list of how much energy popular devices use, when all pixels are either black or white.</p>

<p>This way you could test how much <em>battery drain</em> you could prevent by designing darker websites!</p>

<p>Thanks for reading!</p>
