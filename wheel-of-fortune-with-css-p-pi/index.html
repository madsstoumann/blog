		<article>
			<h1>Wheel of Fortune with CSS</h1>
			<p>A "Wheel of Fortune" component just popped up in my feed. I always spin, but never win! Anyway, this type of component is often built with <code>&lt;canvas&gt;</code>, so I thought I'd write a tutorial on how to make it in CSS. For the interactivity, you still have to use JavaScript.</p>

<p>Here's what we'll be building:</p>

<p><a href="assets/1862499/b32df640.jpg" class="article-body-image-wrapper"><img src="assets/1862499/b32df640.jpg" alt="Wheel Of Fortune" loading="lazy" width="800" height="800"></a></p>

<h2>
  <a name="the-markup" href="#the-markup">
  </a>
  The markup
</h2>

<p>For the wedges, we'll be using a simple list:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;ul</span> <span class="na">class=</span><span class="s">"wheel-of-fortune"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;li&gt;</span>$1000<span class="nt">&lt;/li&gt;</span>
  <span class="nt">&lt;li&gt;</span>$2000<span class="nt">&lt;/li&gt;</span>
  <span class="nt">&lt;li&gt;</span>$3000<span class="nt">&lt;/li&gt;</span>
  <span class="nt">&lt;li&gt;</span>$4000<span class="nt">&lt;/li&gt;</span>
  <span class="nt">&lt;li&gt;</span>$5000<span class="nt">&lt;/li&gt;</span>
  <span class="nt">&lt;li&gt;</span>$6000<span class="nt">&lt;/li&gt;</span>
  <span class="nt">&lt;li&gt;</span>$7000<span class="nt">&lt;/li&gt;</span>
  <span class="nt">&lt;li&gt;</span>$8000<span class="nt">&lt;/li&gt;</span>
  <span class="nt">&lt;li&gt;</span>$9000<span class="nt">&lt;/li&gt;</span>
  <span class="nt">&lt;li&gt;</span>$10000<span class="nt">&lt;/li&gt;</span>
  <span class="nt">&lt;li&gt;</span>$11000<span class="nt">&lt;/li&gt;</span>
  <span class="nt">&lt;li&gt;</span>$12000<span class="nt">&lt;/li&gt;</span>
<span class="nt">&lt;/ul&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>OK, so we have a list of numbers. Now, let's set some initial styles:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:where</span><span class="o">(</span><span class="nc">.ui-wheel-of-fortune</span><span class="o">)</span> <span class="p">{</span>
  <span class="py">--_items</span><span class="p">:</span> <span class="m">12</span><span class="p">;</span>
  <span class="nl">all</span><span class="p">:</span> <span class="n">unset</span><span class="p">;</span>
  <span class="py">aspect-ratio</span><span class="p">:</span> <span class="m">1</span> <span class="p">/</span> <span class="m">1</span><span class="p">;</span>
  <span class="nl">background</span><span class="p">:</span> <span class="no">crimson</span><span class="p">;</span>
  <span class="py">container-type</span><span class="p">:</span> <span class="n">inline-size</span><span class="p">;</span>
  <span class="nl">direction</span><span class="p">:</span> <span class="nb">ltr</span><span class="p">;</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">grid</span><span class="p">;</span>
  <span class="py">place-content</span><span class="p">:</span> <span class="nb">center</span> <span class="n">start</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>First is a variable we'll be using to control the amount of items. As the list has 12 items, we set <code>--_items: 12;</code>.</p>

<p>I set the <code>container-type</code> so we can use container-query units (more on that later), then a grid with content placed "left center". This gives us:</p>

<p><a href="assets/1862499/933df86d.jpg" class="article-body-image-wrapper"><img src="assets/1862499/933df86d.jpg" alt="Initial" loading="lazy" width="800" height="800"></a></p>

<p>OK, doesn't look like much, let's look into the wedges:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">li</span> <span class="p">{</span>
  <span class="nl">align-content</span><span class="p">:</span> <span class="nb">center</span><span class="p">;</span>
  <span class="nl">background</span><span class="p">:</span> <span class="no">deepskyblue</span><span class="p">;</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">grid</span><span class="p">;</span>
  <span class="nl">font-size</span><span class="p">:</span> <span class="m">5</span><span class="n">cqi</span><span class="p">;</span>
  <span class="py">grid-area</span><span class="p">:</span> <span class="m">1</span> <span class="p">/</span> <span class="m">-1</span><span class="p">;</span>
  <span class="nl">list-style</span><span class="p">:</span> <span class="nb">none</span><span class="p">;</span>
  <span class="nl">padding-left</span><span class="p">:</span> <span class="m">1ch</span><span class="p">;</span>
  <span class="nl">transform-origin</span><span class="p">:</span> <span class="nb">center</span> <span class="nb">right</span><span class="p">;</span>
  <span class="nl">width</span><span class="p">:</span> <span class="m">50</span><span class="n">cqi</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Instead of <code>position: absolute</code> we "stack" all the <code>&lt;li&gt;</code> in the same place in the grid using <code>grid-area: 1 / -1</code>. We set the <code>transform-origin</code> to <code>center right</code>, meaning we'll rotate the wedge around that axis.</p>

<p>So, now we have:</p>

<p><a href="assets/1862499/9f2c57da.jpg" class="article-body-image-wrapper"><img src="assets/1862499/9f2c57da.jpg" alt="With items" loading="lazy" width="800" height="800"></a></p>

<p>Because all the elements are stacked, we can only see the last.</p>

<p>Let's do something about that. First, we'll add an index variable to each wedge:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">li</span> <span class="p">{</span>
  <span class="err">&amp;:nth-of-type(1)</span> <span class="err">{</span> <span class="py">--_idx</span><span class="p">:</span> <span class="m">1</span><span class="p">;</span> <span class="p">}</span>
  <span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">2</span><span class="o">)</span> <span class="p">{</span> <span class="py">--_idx</span><span class="p">:</span> <span class="m">2</span><span class="p">;</span> <span class="p">}</span>
  <span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">3</span><span class="o">)</span> <span class="p">{</span> <span class="py">--_idx</span><span class="p">:</span> <span class="m">3</span><span class="p">;</span> <span class="p">}</span>
  <span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">4</span><span class="o">)</span> <span class="p">{</span> <span class="py">--_idx</span><span class="p">:</span> <span class="m">4</span><span class="p">;</span> <span class="p">}</span>
  <span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">5</span><span class="o">)</span> <span class="p">{</span> <span class="py">--_idx</span><span class="p">:</span> <span class="m">5</span><span class="p">;</span> <span class="p">}</span>
  <span class="c">/* etc. */</span>
<span class="err">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>With that we only need to add one more line of CSS:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">li</span> <span class="p">{</span>
  <span class="py">rotate</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">360deg</span> <span class="p">/</span> <span class="n">var</span><span class="p">(</span><span class="n">--_items</span><span class="p">)</span> <span class="err">*</span> <span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--_idx</span><span class="p">)</span> <span class="n">-</span> <span class="m">1</span><span class="p">));</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><a href="assets/1862499/2967a340.jpg" class="article-body-image-wrapper"><img src="assets/1862499/2967a340.jpg" alt="With rotate" loading="lazy" width="800" height="800"></a></p>

<p>Getting there! Let's use the same variables to create some color variations:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">li</span> <span class="p">{</span>
  <span class="nl">background</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="n">calc</span><span class="p">(</span><span class="m">360deg</span> <span class="p">/</span> <span class="n">var</span><span class="p">(</span><span class="n">--_items</span><span class="p">)</span> <span class="err">*</span>
  <span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--_idx</span><span class="p">))),</span> <span class="m">100%</span><span class="p">,</span> <span class="m">75%</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><a href="assets/1862499/7000db5a.jpg" class="article-body-image-wrapper"><img src="assets/1862499/7000db5a.jpg" alt="Color Variations" loading="lazy" width="800" height="800"></a></p>


<hr>

<h2>
  <a name="a-slice-of-%CF%80" href="#a-slice-of-%CF%80">
  </a>
  A Slice of π
</h2>

<p>For the <strong>height</strong> of the wedges we need the circumference of the circle divided by the amount of items. As you might recall from school, the circumference of a circle is:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight plaintext"><code>C=2πr
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Because we're using container-units, the <strong>radius</strong> is <code>50cqi</code>, so the formula we need in CSS is:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">li</span> <span class="p">{</span>
  <span class="nl">height</span><span class="p">:</span> <span class="n">calc</span><span class="p">((</span><span class="m">2</span> <span class="err">*</span> <span class="n">pi</span> <span class="err">*</span> <span class="m">50</span><span class="n">cqi</span><span class="p">)</span> <span class="p">/</span> <span class="n">var</span><span class="p">(</span><span class="n">--_items</span><span class="p">));</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Isn't it just cool that we have <strong>pi</strong> in CSS now?!</p>

<p><a href="assets/1862499/c66650e6.jpg" class="article-body-image-wrapper"><img src="assets/1862499/c66650e6.jpg" alt="With pi for height" loading="lazy" width="800" height="800"></a></p>

<p>Now, let's add a simple <code>clip-path</code> to each wedge. We'll start at the top left corner, move to the right center, then back to left bottom:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">li</span> <span class="p">{</span>
  <span class="nl">clip-path</span><span class="p">:</span> <span class="n">polygon</span><span class="p">(</span><span class="m">0%</span> <span class="m">0%</span><span class="p">,</span> <span class="m">100%</span> <span class="m">50%</span><span class="p">,</span> <span class="m">0%</span> <span class="m">100%</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><a href="assets/1862499/0baa4c47.jpg" class="article-body-image-wrapper"><img src="assets/1862499/0baa4c47.jpg" alt="With clip-path" loading="lazy" width="800" height="800"></a></p>

<p>Let's deduct a little from the edges:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">li</span> <span class="p">{</span>
  <span class="nl">clip-path</span><span class="p">:</span> <span class="n">polygon</span><span class="p">(</span><span class="m">0%</span> <span class="m">-2%</span><span class="p">,</span> <span class="m">100%</span> <span class="m">50%</span><span class="p">,</span> <span class="m">0%</span> <span class="m">102%</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>

<p>Not sure, if there's a mathematical <em>correct</em> way to do this?</p>

<p>Anyway, now we just need to add <code>border-radius: 50%</code> to the wrapper:</p>

<p><a href="assets/1862499/5924db78.jpg" class="article-body-image-wrapper"><img src="assets/1862499/5924db78.jpg" alt="With border-radius" loading="lazy" width="800" height="800"></a></p>

<p>Hmm, not good. Let's use a <code>clip-path</code> instead, with <code>inset</code> and <code>round</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.wheel-of-fortune</span> <span class="p">{</span>
  <span class="nl">clip-path</span><span class="p">:</span> <span class="nb">inset</span><span class="p">(</span><span class="m">0</span> <span class="m">0</span> <span class="m">0</span> <span class="m">0</span> <span class="n">round</span> <span class="m">50%</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>

</svg>

</div>
</div>



<p>Much better:</p>

<p><a href="assets/1862499/aef17d4a.jpg" class="article-body-image-wrapper"><img src="assets/1862499/aef17d4a.jpg" alt="Wheel Of Fortune, Final" loading="lazy" width="800" height="800"></a></p>

<p>And because we used container-units for the wedges <strong>and</strong> the <code>font-size</code>, it's fully responsive!</p>


<hr>

<h2>
  <a name="make-it-spin" href="#make-it-spin">
  </a>
  Make it spin
</h2>

<p>Now, let's add a spin-<code>&lt;button&gt;</code> (see CSS in code-example below) and trigger a spin using JavaScript:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">function</span> <span class="nf">wheelOfFortune</span><span class="p">(</span><span class="nx">selector</span><span class="p">)</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">node</span> <span class="o">=</span> <span class="nb">document</span><span class="p">.</span><span class="nf">querySelector</span><span class="p">(</span><span class="nx">selector</span><span class="p">);</span>
  <span class="k">if </span><span class="p">(</span><span class="o">!</span><span class="nx">node</span><span class="p">)</span> <span class="k">return</span><span class="p">;</span>

  <span class="kd">const</span> <span class="nx">spin</span> <span class="o">=</span> <span class="nx">node</span><span class="p">.</span><span class="nf">querySelector</span><span class="p">(</span><span class="dl">'</span><span class="s1">button</span><span class="dl">'</span><span class="p">);</span>
  <span class="kd">const</span> <span class="nx">wheel</span> <span class="o">=</span> <span class="nx">node</span><span class="p">.</span><span class="nf">querySelector</span><span class="p">(</span><span class="dl">'</span><span class="s1">ul</span><span class="dl">'</span><span class="p">);</span>
  <span class="kd">let</span> <span class="nx">animation</span><span class="p">;</span>
  <span class="kd">let</span> <span class="nx">previousEndDegree</span> <span class="o">=</span> <span class="mi">0</span><span class="p">;</span>

  <span class="nx">spin</span><span class="p">.</span><span class="nf">addEventListener</span><span class="p">(</span><span class="dl">'</span><span class="s1">click</span><span class="dl">'</span><span class="p">,</span> <span class="p">()</span> <span class="o">=&gt;</span> <span class="p">{</span>
    <span class="k">if </span><span class="p">(</span><span class="nx">animation</span><span class="p">)</span> <span class="p">{</span>
      <span class="nx">animation</span><span class="p">.</span><span class="nf">cancel</span><span class="p">();</span> <span class="c1">// Reset the animation if it already exists</span>
    <span class="p">}</span>

    <span class="kd">const</span> <span class="nx">randomAdditionalDegrees</span> <span class="o">=</span> <span class="nb">Math</span><span class="p">.</span><span class="nf">random</span><span class="p">()</span> <span class="o">*</span> <span class="mi">360</span> <span class="o">+</span> <span class="mi">1800</span><span class="p">;</span>
    <span class="kd">const</span> <span class="nx">newEndDegree</span> <span class="o">=</span> <span class="nx">previousEndDegree</span> <span class="o">+</span> <span class="nx">randomAdditionalDegrees</span><span class="p">;</span>

    <span class="nx">animation</span> <span class="o">=</span> <span class="nx">wheel</span><span class="p">.</span><span class="nf">animate</span><span class="p">([</span>
      <span class="p">{</span> <span class="na">transform</span><span class="p">:</span> <span class="s2">`rotate(</span><span class="p">${</span><span class="nx">previousEndDegree</span><span class="p">}</span><span class="s2">deg)`</span> <span class="p">},</span>
      <span class="p">{</span> <span class="na">transform</span><span class="p">:</span> <span class="s2">`rotate(</span><span class="p">${</span><span class="nx">newEndDegree</span><span class="p">}</span><span class="s2">deg)`</span> <span class="p">}</span>
    <span class="p">],</span> <span class="p">{</span>
      <span class="na">duration</span><span class="p">:</span> <span class="mi">4000</span><span class="p">,</span>
      <span class="na">direction</span><span class="p">:</span> <span class="dl">'</span><span class="s1">normal</span><span class="dl">'</span><span class="p">,</span>
      <span class="na">easing</span><span class="p">:</span> <span class="dl">'</span><span class="s1">cubic-bezier(0.440, -0.205, 0.000, 1.130)</span><span class="dl">'</span><span class="p">,</span>
      <span class="na">fill</span><span class="p">:</span> <span class="dl">'</span><span class="s1">forwards</span><span class="dl">'</span><span class="p">,</span>
      <span class="na">iterations</span><span class="p">:</span> <span class="mi">1</span>
    <span class="p">});</span>

    <span class="nx">previousEndDegree</span> <span class="o">=</span> <span class="nx">newEndDegree</span><span class="p">;</span>
  <span class="p">});</span>
<span class="p">}</span>
</code></pre>
