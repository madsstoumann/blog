		<article>
			<h1>Mobile-to-Desktop Menu in 2 Lines of CSS</h1>
			<p>As a frontend developer, I've created numerous menus over the years. These menus have typically been the most intricate element of a website, incorporating mobile interactions, desktop transitions, item reordering, and more. In one instance, I built a mega-menu for a client that was so expansive, users mistook it for an entire webpage due to its full-page coverage. </p>

<p>However, in my most recent project, I aimed for <strong>simplicity</strong> by utilizing some of the latest and greatest CSS features available.</p>

<p>Let's dive in!</p>


<hr>

<h2>
  <a name="structure" href="#structure">
  </a>
  Structure
</h2>

<p>For the markup, the simplest structure I could come up with, that still supported the flexibility needed to go from a mobile flyout to a desktop-menu, was this:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;header&gt;</span>
  <span class="nt">&lt;a</span> <span class="na">href=</span><span class="s">"/"</span><span class="nt">&gt;</span>LOGO<span class="nt">&lt;/a&gt;</span>
  <span class="nt">&lt;label&gt;</span>
    <span class="nt">&lt;input</span> <span class="na">type=</span><span class="s">"checkbox"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;/label&gt;</span>
  <span class="nt">&lt;div</span> <span class="na">class=</span><span class="s">"menu-flyout"</span><span class="nt">&gt;</span>
    <span class="nt">&lt;nav</span> <span class="na">class=</span><span class="s">"menu-main"</span><span class="nt">&gt;</span>
      <span class="nt">&lt;a</span> <span class="na">href=</span><span class="s">"#"</span><span class="nt">&gt;</span>...<span class="nt">&lt;/a&gt;</span>
      <span class="nt">&lt;a</span> <span class="na">href=</span><span class="s">"#"</span><span class="nt">&gt;</span>...<span class="nt">&lt;/a&gt;</span>
    <span class="nt">&lt;/nav&gt;</span>
    <span class="nt">&lt;nav</span> <span class="na">class=</span><span class="s">"menu-cta"</span><span class="nt">&gt;</span>
      <span class="nt">&lt;a</span> <span class="na">href=</span><span class="s">"#"</span><span class="nt">&gt;</span>CTA<span class="nt">&lt;/a&gt;</span>
      <span class="nt">&lt;a</span> <span class="na">href=</span><span class="s">"#"</span><span class="nt">&gt;</span>CTA<span class="nt">&lt;/a&gt;</span>
    <span class="nt">&lt;/nav&gt;</span>
  <span class="nt">&lt;/div&gt;</span>
<span class="nt">&lt;/header&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>We'll add more classes and stuff later, but this is the basic structure. This version will work <strong>without any JavaScript</strong>, but has an accessibility-issue, we'll look into later as well.</p>

<p>The main element, <code>&lt;header&gt;</code> is a <code>flex</code>-container, using <code>justify-content: space-between</code> to place the logo left and the toggler right:</p>

<p><a href="assets/1466162/1d976f7f.jpg" class="article-body-image-wrapper"><img src="assets/1466162/1d976f7f.jpg" alt="Mobile Menu Collapsed" loading="lazy" width="800" height="89"></a></p>

<p><code>.menu-flyout</code> is the container for two navigation-blocks: one with the main menu-items, and one with CTA's (call-to-actions).</p>

<p>The flyout will cover the whole screen when visible, but otherwise be placed off-screen:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.menu-flyout</span> <span class="p">{</span>
  <span class="py">inset</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="nl">position</span><span class="p">:</span> <span class="nb">fixed</span><span class="p">;</span>
  <span class="py">translate</span><span class="p">:</span> <span class="m">-100vw</span> <span class="m">0</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The navigation blocks are both <code>flex</code>-containers with <code>flex-direction</code> set to a custom property:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">flex-direction</span><span class="o">:</span> <span class="nt">var</span><span class="o">(</span><span class="nt">--menu-flyout-dir</span><span class="o">,</span> <span class="nt">column</span><span class="o">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The second navigation block is placed at the bottom, using <code>justify-content: end</code>:</p>

<p><a href="assets/1466162/9121515c.jpg" class="article-body-image-wrapper"><img src="assets/1466162/9121515c.jpg" alt="Flyout" loading="lazy" width="800" height="1733"></a></p>


<hr>

<p>The toggler is just a styled <code>&lt;input type="checkbox"&gt;</code>. We can use this to reveal the flyout when clicked:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">header</span><span class="nd">:has</span><span class="o">(</span><span class="nt">input</span><span class="nd">:checked</span><span class="o">)</span> <span class="nc">.menu-flyout</span> <span class="p">{</span>
  <span class="py">translate</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><a href="assets/1466162/754e89e9.jpg" class="article-body-image-wrapper"><img src="assets/1466162/754e89e9.jpg" alt="Flyout" loading="lazy" width="800" height="1731"></a></p>

<p>Since the toggler is wrapped in a label, we can use this to hide it on desktop:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="k">@media</span> <span class="p">(</span><span class="n">min-width</span><span class="p">:</span> <span class="m">768px</span><span class="p">)</span> <span class="p">{</span>
  <span class="nt">label</span> <span class="p">{</span> <span class="nl">display</span><span class="p">:</span> <span class="nb">none</span><span class="p">;</span> <span class="p">}</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<blockquote>
<p><strong>NOTE:</strong> Don't worry, everything will have classes in the final examples, it's just to simplify the examples, that I use plain tags!</p>
</blockquote>


<hr>

<p>So far, so good. When we resize the screen to desktop, we get:</p>

<p><a href="assets/1466162/d0d93a82.jpg" class="article-body-image-wrapper"><img src="assets/1466162/d0d93a82.jpg" alt="Desktop" loading="lazy" width="800" height="43"></a></p>

<p>OK, so the <code>&lt;label&gt;</code> with the toggler is hidden as expected, the <code>&lt;header&gt;</code> is still a <code>flex</code>-container, the flyout is still placed off-screen, but is now <em>gigantic</em>, taking up the whole screen real-estate.</p>

<p>Let's fix that with <strong>two lines of CSS:</strong><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="k">@media</span> <span class="p">(</span><span class="n">min-width</span><span class="p">:</span> <span class="m">768px</span><span class="p">)</span> <span class="p">{</span>
  <span class="nc">.menu-flyout</span> <span class="p">{</span>
    <span class="py">--menu-flyout-dir</span><span class="p">:</span> <span class="n">row</span><span class="p">;</span>
    <span class="nl">display</span><span class="p">:</span> <span class="n">contents</span><span class="p">;</span>
  <span class="p">}</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Which results in:</p>

<p><a href="assets/1466162/9b1f37a4.jpg" class="article-body-image-wrapper"><img src="assets/1466162/9b1f37a4.jpg" alt="Desktop menu" loading="lazy" width="800" height="40"></a></p>

<p><strong>Yay!</strong> If we inspect that, we'll see that the two navgation blocks are now "direct" items in our main <code>flex</code>-container, and <code>.menu-flyout</code> seems to have disappeared:</p>

<p><a href="assets/1466162/7b4ce399.jpg" class="article-body-image-wrapper"><img src="assets/1466162/7b4ce399.jpg" alt="Flex container" loading="lazy" width="800" height="44"></a></p>

<p><strong>So what's going on?</strong></p>

<p><code>display: contents</code> is the same as saying to an element: "Forget your own box, just display your child-nodes". Or in formal MDN-lingo: </p>

<blockquote>
<p>These elements don't produce a specific box by themselves. They are replaced by their pseudo-box and their child boxes.</p>
</blockquote>

<p>We change the flex-direction for both navigation-blocks, by updating the custom property, we declared earlier, <code>--menu-flyout-dir</code>.</p>


<hr>

<p>We now have a working, mobile-to-desktop menu using <strong>very little</strong> HTML and CSS and <strong>no JavaScript</strong> at all. </p>

<p>Let's see what else we can do. I've set the desktop max-width to <code>1200px</code>, but would like to "stretch" the <code>background-color</code> to the edge of the screen. </p>

<p>This used to require an extra element around the menu, but can now be done with a very large <code>border-image</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">border-image</span><span class="o">:</span> <span class="nt">conic-gradient</span><span class="o">(</span>
  <span class="nt">hsl</span><span class="o">(</span><span class="err">240</span><span class="o">,</span> <span class="err">10</span><span class="o">%,</span> <span class="err">20</span><span class="o">%)</span> <span class="err">0</span> <span class="err">0</span><span class="o">)</span>
  <span class="nt">fill</span> <span class="err">0</span><span class="o">//</span><span class="err">100</span><span class="nt">vw</span><span class="o">;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>OK ... this will actually cover the <strong>whole</strong> screen. </p>

<p>Let's add a <code>clip-path</code>to fix that:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">clip-path</span><span class="o">:</span> <span class="nt">polygon</span><span class="o">(</span>
  <span class="nt">-100vw</span> <span class="err">0</span><span class="o">,</span>
  <span class="err">100</span><span class="nt">vw</span> <span class="err">0</span><span class="o">,</span>
  <span class="err">100</span><span class="nt">vw</span> <span class="err">100</span><span class="o">%,</span>
  <span class="nt">-100vw</span> <span class="err">100</span><span class="o">%</span>
<span class="o">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Now, even on very large desktops, the background will stretch to the edge of the screen (you probably need to zoom-in to see it!):</p>

<p><a href="assets/1466162/9216f8f7.jpg" class="article-body-image-wrapper"><img src="assets/1466162/9216f8f7.jpg" alt="Large Desktop" loading="lazy" width="800" height="19"></a></p>


<hr>

<h2>
  <a name="mobile-fixes" href="#mobile-fixes">
  </a>
  Mobile fixes
</h2>

<p>On mobile, we can use <code>:has</code> to detect when the toggler is checked, even from the <code>&lt;body&gt;</code>-element. We can utilize this to prevent overflow/scrolling, when the flyout is visible:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="k">@media</span> <span class="p">(</span><span class="n">max-width</span><span class="p">:</span> <span class="m">767px</span><span class="p">)</span> <span class="p">{</span>
  <span class="py">body</span><span class="p">:</span><span class="n">has</span><span class="p">(.</span><span class="n">menu-toggle</span><span class="p">:</span><span class="n">checked</span><span class="p">)</span> <span class="err">{</span>
    <span class="n">overflow</span><span class="p">:</span> <span class="nb">hidden</span><span class="p">;</span>
  <span class="p">}</span>
<span class="err">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>




<hr>

<p>If you rotate your (large) phone, the menu will switch to the desktop-version.</p>

<p>If you have an iPhone with a "notch", the menu will "go into" that notch. We can fix this with the <code>env()</code>-function and <code>safe-area-inset</code>. First, we create two variables with block- and inline-padding:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">header</span> <span class="p">{</span>
  <span class="py">--menu-pb</span><span class="p">:</span> <span class="m">.75em</span><span class="p">;</span>
  <span class="py">--menu-pi</span><span class="p">:</span> <span class="m">1.5em</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

<p>... and later on, we'll define the padding:<br>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">header</span> <span class="p">{</span>
  <span class="nl">padding</span><span class="p">:</span>
    <span class="n">var</span><span class="p">(</span><span class="n">--menu-pb</span><span class="p">)</span>
    <span class="n">calc</span><span class="p">(</span><span class="n">env</span><span class="p">(</span><span class="n">safe-area-inset-right</span><span class="p">)</span> 
    <span class="err">+</span> <span class="n">var</span><span class="p">(</span><span class="n">--menu-pi</span><span class="p">))</span>
    <span class="n">var</span><span class="p">(</span><span class="n">--menu-pb</span><span class="p">)</span>
    <span class="n">calc</span><span class="p">(</span><span class="n">env</span><span class="p">(</span><span class="n">safe-area-inset-left</span><span class="p">)</span>
    <span class="err">+</span> <span class="n">var</span><span class="p">(</span><span class="n">--menu-pi</span><span class="p">));</span>
<span class="p">}</span>
</code></pre>

<h2>
  <a name="accessibility-concerns" href="#accessibility-concerns">
  </a>
  Accessibility Concerns
</h2>

<p>While the menu above works fine <strong>without any JavaScript</strong>, the toggle-button-checkbox is a hack, not working well with screen-readers. </p>

<p>Let's add an <code>id</code> to the flyout, and replace the <code>&lt;label&gt;</code> with:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;button</span>
  <span class="na">class=</span><span class="s">"menu-toggle"</span>
  <span class="na">aria-label=</span><span class="s">"Toggle flyout menu"</span>
  <span class="na">aria-expanded=</span><span class="s">"false"</span>
  <span class="na">aria-controls=</span><span class="s">"flyout-menu"</span><span class="nt">&gt;</span>
<span class="nt">&lt;/button&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Then add a small JS-snippet:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">toggle</span> <span class="o">=</span> <span class="nb">document</span><span class="p">.</span><span class="nf">querySelector</span><span class="p">(</span>
  <span class="dl">'</span><span class="s1">.menu-toggle</span><span class="dl">'</span><span class="p">);</span>
<span class="nx">toggle</span><span class="p">.</span><span class="nf">addEventListener</span><span class="p">(</span><span class="dl">'</span><span class="s1">click</span><span class="dl">'</span><span class="p">,</span> <span class="p">()</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="nx">toggle</span><span class="p">.</span><span class="nf">setAttribute</span><span class="p">(</span>
    <span class="dl">'</span><span class="s1">aria-expanded</span><span class="dl">'</span><span class="p">,</span> <span class="nb">document</span><span class="p">.</span><span class="nx">body</span>
    <span class="p">.</span><span class="nx">classList</span><span class="p">.</span><span class="nf">toggle</span><span class="p">(</span><span class="dl">'</span><span class="s1">menu-open</span><span class="dl">'</span><span class="p">)</span>
    <span class="p">);</span>
<span class="p">})</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>This snippets toggles a class, <code>menu-open</code> on the body-element. We'll use the status, whether the class is set or not, for the <code>aria-pressed</code>-attribute.</p>

<p>All the places we used <code>:checked</code> before, we should now use <code>menu-open</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.menu-open</span> <span class="nc">.menu-flyout</span> <span class="p">{</span> <span class="py">translate</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span> <span class="p">}</span>
</code></pre>
