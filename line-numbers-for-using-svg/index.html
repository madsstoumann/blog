		<article>
			<h1>Line Numbers for &lt;textarea&gt; using SVG</h1>
			<p>The other day I was working on a JSON Schema Generator, and wanted to display line numbers in a <code>&lt;textarea&gt;</code>. Nothing fancy, and not considering soft line-breaks or anything remotely complicated.</p>

<p>I did some research, and found multiple approaches:</p>

<ol>
<li>Using a <code>background-image</code> (TinyMCE does that, using a PNG)</li>
<li>Using an <code>&lt;ol&gt;</code> ordered list. </li>
</ol>

<p>I did not like any of them! The first one didn't look crisp — and didn't match the styles I already had in place for my <code>&lt;textarea&gt;</code>-elements.</p>

<p>The second one required a bunch of JavaScript to maintain that ordered list: adding/removing <code>&lt;li&gt;</code>-elements dynamically, syncing scroll-events and much more.</p>

<p>So I ended up creating a hybrid. </p>

<p>It's a dynamically generated SVG, stored as a <em>CSS Custom Property</em> — and used as a <code>background-image</code>, inheriting the styles from it's parent <code>&lt;textarea&gt;</code>-element.</p>

<p><a href="assets/1964961/fa705c26.jpg" class="article-body-image-wrapper"><img src="assets/1964961/fa705c26.jpg" alt="Line Numbers" loading="lazy" width="701" height="244"></a></p>

<p>Let's dive in.</p>


<hr>

<h2>
  <a name="javascript" href="#javascript">
  </a>
  JavaScript
</h2>

<p>First, the main method:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nf">lineNumbers</span><span class="p">(</span><span class="nx">element</span><span class="p">,</span> <span class="nx">numLines</span> <span class="o">=</span> <span class="mi">50</span><span class="p">,</span> <span class="nx">inline</span> <span class="o">=</span> <span class="kc">false</span><span class="p">)</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><code>element</code> is the <code>&lt;textarea&gt;</code> element to use, <code>numLines</code> the number of lines to render, and <code>inline</code> indicates whether to store the generated image on <code>element</code> (true), or on <code>document.body</code> (false).</p>

<p>Next, we define a prefix for the custom property:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">prefix</span> <span class="o">=</span> <span class="dl">'</span><span class="s1">--linenum-</span><span class="dl">'</span><span class="p">;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Before we continue, we check whether to re-use any existing property:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="k">if </span><span class="p">(</span><span class="o">!</span><span class="nx">inline</span><span class="p">)</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">styleString</span> <span class="o">=</span> <span class="nb">document</span><span class="p">.</span><span class="nx">body</span><span class="p">.</span><span class="nf">getAttribute</span><span class="p">(</span><span class="dl">'</span><span class="s1">style</span><span class="dl">'</span><span class="p">)</span> <span class="o">||</span> <span class="dl">''</span><span class="p">;</span>
  <span class="kd">const</span> <span class="nx">regex</span> <span class="o">=</span> <span class="k">new</span> <span class="nc">RegExp</span><span class="p">(</span><span class="s2">`</span><span class="p">${</span><span class="nx">prefix</span><span class="p">}</span><span class="s2">[^:]*`</span><span class="p">,</span> <span class="dl">'</span><span class="s1">g</span><span class="dl">'</span><span class="p">);</span>
  <span class="kd">const</span> <span class="nx">match</span> <span class="o">=</span> <span class="nx">styleString</span><span class="p">.</span><span class="nf">match</span><span class="p">(</span><span class="nx">regex</span><span class="p">);</span>

  <span class="k">if </span><span class="p">(</span><span class="nx">match</span><span class="p">)</span> <span class="p">{</span>
    <span class="nx">element</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nx">backgroundImage</span> <span class="o">=</span> <span class="s2">`var(</span><span class="p">${</span><span class="nx">match</span><span class="p">[</span><span class="mi">0</span><span class="p">]}</span><span class="s2">)`</span><span class="p">;</span>
    <span class="k">return</span><span class="p">;</span>
  <span class="p">}</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Next, we <strong>extract</strong> styles from <code>element</code>, rendering the SVG with the same <code>font-family</code>, <code>font-size</code>, <code>line-height</code> etc. :<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">bgColor</span> <span class="o">=</span> <span class="nf">getComputedStyle</span><span class="p">(</span><span class="nx">element</span><span class="p">).</span><span class="nx">borderColor</span><span class="p">;</span>
<span class="kd">const</span> <span class="nx">fillColor</span> <span class="o">=</span> <span class="nf">getComputedStyle</span><span class="p">(</span><span class="nx">element</span><span class="p">).</span><span class="nx">color</span><span class="p">;</span>
<span class="kd">const</span> <span class="nx">fontFamily</span> <span class="o">=</span> <span class="nf">getComputedStyle</span><span class="p">(</span><span class="nx">element</span><span class="p">).</span><span class="nx">fontFamily</span><span class="p">;</span>
<span class="kd">const</span> <span class="nx">fontSize</span> <span class="o">=</span> <span class="nf">parseFloat</span><span class="p">(</span><span class="nf">getComputedStyle</span><span class="p">(</span><span class="nx">element</span><span class="p">).</span><span class="nx">fontSize</span><span class="p">);</span>
<span class="kd">const</span> <span class="nx">lineHeight</span> <span class="o">=</span> <span class="nf">parseFloat</span><span class="p">(</span><span class="nf">getComputedStyle</span><span class="p">(</span><span class="nx">element</span><span class="p">).</span><span class="nx">lineHeight</span><span class="p">)</span> <span class="o">/</span> <span class="nx">fontSize</span><span class="p">;</span>
<span class="kd">const</span> <span class="nx">paddingTop</span> <span class="o">=</span> <span class="nf">parseFloat</span><span class="p">(</span><span class="nf">getComputedStyle</span><span class="p">(</span><span class="nx">element</span><span class="p">).</span><span class="nx">paddingTop</span><span class="p">)</span> <span class="o">/</span> <span class="mi">2</span><span class="p">;</span>
<span class="kd">const</span> <span class="nx">translateY</span> <span class="o">=</span> <span class="p">(</span><span class="nx">fontSize</span> <span class="o">*</span> <span class="nx">lineHeight</span><span class="p">).</span><span class="nf">toFixed</span><span class="p">(</span><span class="mi">2</span><span class="p">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>We need a random id for our property as well:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">id</span> <span class="o">=</span> <span class="s2">`</span><span class="p">${</span><span class="nx">prefix</span><span class="p">}${</span><span class="nb">Math</span><span class="p">.</span><span class="nf">random</span><span class="p">().</span><span class="nf">toString</span><span class="p">(</span><span class="mi">36</span><span class="p">).</span><span class="nf">substr</span><span class="p">(</span><span class="mi">2</span><span class="p">,</span> <span class="mi">6</span><span class="p">)}</span><span class="s2">`</span><span class="p">;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And now it's time to render the SVG:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">svg</span> <span class="o">=</span> <span class="s2">`&lt;svg xmlns="http://www.w3.org/2000/svg"&gt;
  &lt;style&gt;
    svg { background: </span><span class="p">${</span><span class="nx">bgColor</span><span class="p">}</span><span class="s2">; }
    text {
      fill: hsl(from </span><span class="p">${</span><span class="nx">fillColor</span><span class="p">}</span><span class="s2"> h s l / 50%);
      font-family: </span><span class="p">${</span><span class="nx">fontFamily</span><span class="p">}</span><span class="s2">;
      font-size: </span><span class="p">${</span><span class="nx">fontSize</span><span class="p">}</span><span class="s2">px;
      line-height: </span><span class="p">${</span><span class="nx">lineHeight</span><span class="p">}</span><span class="s2">;
      text-anchor: end;
      translate: 0 calc((var(--n) * </span><span class="p">${</span><span class="nx">translateY</span><span class="p">}</span><span class="s2">px) + </span><span class="p">${</span><span class="nx">paddingTop</span><span class="p">}</span><span class="s2">px);
    }
  &lt;/style&gt;
  </span><span class="p">${</span><span class="nb">Array</span><span class="p">.</span><span class="k">from</span><span class="p">({</span> <span class="na">length</span><span class="p">:</span> <span class="nx">numLines</span> <span class="p">},</span> <span class="p">(</span><span class="nx">_</span><span class="p">,</span> <span class="nx">i</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="s2">`&lt;text x="90%" style="--n:</span><span class="p">${</span><span class="nx">i</span> <span class="o">+</span> <span class="mi">1</span><span class="p">}</span><span class="s2">;"&gt;</span><span class="p">${</span><span class="nx">i</span> <span class="o">+</span> <span class="mi">1</span><span class="p">}</span><span class="s2">&lt;/text&gt;`</span><span class="p">).</span><span class="nf">join</span><span class="p">(</span><span class="dl">""</span><span class="p">)}</span><span class="s2">
&lt;/svg&gt;`</span><span class="p">;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><strong>Let's break it down:</strong></p>

<p>In the <code>&lt;style&gt;</code>-section we simply set the styles we extracted from the <code>&lt;textarea&gt;</code> earlier. Instead of using <code>y</code> and <code>dy</code> attributes for the <code>&lt;text&gt;</code>-elements, we simply use a <code>--n</code>-property to translate the text-elements using CSS.</p>

<p>The last part iterates an array created from <code>numLines</code>, and appends the <code>&lt;text&gt;</code>-elements to the main SVG.</p>

<p>We're almost there!</p>


<hr>

<p>To use the generated SVG as a <code>url()</code>-property, we need to <strong>encode</strong> it:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">encodedURI</span> <span class="o">=</span> <span class="s2">`url("data:image/svg+xml,</span><span class="p">${</span><span class="nf">encodeURIComponent</span><span class="p">(</span><span class="nx">svg</span><span class="p">)}</span><span class="s2">")`</span><span class="p">;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And finally, we set that property on either <code>element</code> or <code>document-body</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">target</span> <span class="o">=</span> <span class="nx">inline</span> <span class="p">?</span> <span class="nx">element</span> <span class="p">:</span> <span class="nb">document</span><span class="p">.</span><span class="nx">body</span><span class="p">;</span>
<span class="nx">target</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nf">setProperty</span><span class="p">(</span><span class="nx">id</span><span class="p">,</span> <span class="nx">encodedURI</span><span class="p">);</span>
<span class="nx">element</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nx">backgroundImage</span> <span class="o">=</span> <span class="s2">`var(</span><span class="p">${</span><span class="nx">id</span><span class="p">}</span><span class="s2">)`</span><span class="p">;</span>
</code></pre>

<div class="highlight__panel-action js-fullscreen-code-action">

<h2>
  <a name="pros-and-cons" href="#pros-and-cons">
  </a>
  Pros and Cons
</h2>

<p>Are there pros and cons? Of course there are! </p>

<p>Personally — for my current project — I needed a simple, crisp way of adding line numbers to a JSON-preview within a <code>&lt;textarea&gt;</code>, and this method fits the bill.</p>

<h3>
  <a name="pros" href="#pros">
  </a>
  Pros
</h3>

<h4>
  <a name="reduced-dom-manipulation" href="#reduced-dom-manipulation">
  </a>
  Reduced DOM Manipulation
</h4>

<p>This method does not rely on manipulating the DOM. The line numbers are generated as a single SVG, stored within a CSS Custom Property.</p>

<h4>
  <a name="automatic-synchronization" href="#automatic-synchronization">
  </a>
  Automatic Synchronization
</h4>

<p>Since the line numbers are part of the background image, they automatically scroll with the text content, eliminating the need for manual synchronization logic.</p>

<h4>
  <a name="reusability-across-elements" href="#reusability-across-elements">
  </a>
  Reusability Across Elements
</h4>

<p>By storing the generated SVG in a CSS Custom Property, it can be reused across multiple elements. This means that if several elements require the same line numbers, they can all reference the same custom property, avoiding redundant SVG generation.</p>

<h4>
  <a name="scalability" href="#scalability">
  </a>
  Scalability
</h4>

<h2>
  <a name="the-vector-nature-of-svg-ensures-that-the-line-numbers-remain-crisp-and-clear-at-any-zoom-level" href="#the-vector-nature-of-svg-ensures-that-the-line-numbers-remain-crisp-and-clear-at-any-zoom-level">
  </a>
  The vector nature of SVG ensures that the line numbers remain crisp and clear at any zoom level.
</h2>

<h3>
  <a name="cons" href="#cons">
  </a>
  Cons
</h3>

<h4>
  <a name="accessibility" href="#accessibility">
  </a>
  Accessibility
</h4>

<p>Ordered lists are more accessible to screen readers and assistive technologies, while SVG-based line numbers might be ignored or misinterpreted.</p>

<h4>
  <a name="customization-complexity" href="#customization-complexity">
  </a>
  Customization Complexity
</h4>

<p>Styling and interacting with individual line numbers in an ordered list is straightforward. In contrast, the SVG approach makes it more difficult to customize or add interactivity to specific line numbers.</p>

<h4>
  <a name="browser-compatibility" href="#browser-compatibility">
  </a>
  Browser Compatibility
</h4>

<p>SVG and CSS custom properties might not render consistently across all browsers — the current implementation has issues with Safari, where we need to deduct <code>(paddingTop / 10)</code> from <code>translateY</code>.</p>

<h4>
  <a name="dynamic-content-handling" href="#dynamic-content-handling">
  </a>
  Dynamic Content Handling
</h4>

<p>Ordered lists can be more flexible for handling dynamic content updates, such as adding or removing lines, whereas the SVG approach might require regenerating and reapplying the entire background image.</p>
