		<article>
			<h1>How To Create Gauges in CSS</h1>
			<p>With modern CSS we can create beautiful gauges with ease. It involves a bunch of techniques, so let's break it down and get started!</p>

<p>First, we create a 3x3 grid. We then add an element that covers the entire grid and is a full circle:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">host</span><span class="nd">::part</span><span class="o">(</span><span class="nt">gauge</span><span class="o">)</span> <span class="p">{</span>
  <span class="nl">background</span><span class="p">:</span> <span class="n">background</span><span class="p">:</span> <span class="n">conic-gradient</span><span class="p">(</span><span class="c">/* colors */</span><span class="p">);</span>
  <span class="nl">border-radius</span><span class="p">:</span> <span class="m">50%</span><span class="p">;</span>
  <span class="py">grid-area</span><span class="p">:</span> <span class="m">1</span> <span class="p">/</span> <span class="m">1</span> <span class="p">/</span> <span class="m">4</span> <span class="p">/</span> <span class="m">4</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><a href="assets/2383490/04ece1e0.jpg" class="article-body-image-wrapper"><img src="assets/2383490/04ece1e0.jpg" alt="Full Circle" loading="lazy" width="558" height="556"></a></p>

<p>Next, we add a <em>starting degree</em> for the <code>min</code> position of the gauge, and how many degrees until the <code>max</code> position:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:host</span> <span class="p">{</span>
  <span class="py">--analog-gauge-start-angle</span><span class="p">:</span> <span class="m">235deg</span><span class="p">;</span>
  <span class="py">--analog-gauge-range</span><span class="p">:</span> <span class="m">250deg</span><span class="p">;</span> 
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Adding these to our <code>gauge</code>-part:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:host::part</span><span class="o">(</span><span class="nt">gauge</span><span class="o">)</span> <span class="p">{</span>
  <span class="py">--analog-gauge-bg</span><span class="p">:</span>
    <span class="m">#009</span><span class="p">,</span> <span class="m">#69f</span><span class="p">,</span> <span class="m">#ff0</span><span class="p">,</span> <span class="m">#f90</span><span class="p">,</span> <span class="m">#f00</span> <span class="n">var</span><span class="p">(</span><span class="n">--analog-gauge-range</span><span class="p">),</span>
    <span class="m">#0000</span> <span class="m">0</span> <span class="n">var</span><span class="p">(</span><span class="n">--analog-gauge-range</span><span class="p">);</span>

<span class="nl">background</span><span class="p">:</span>
  <span class="n">conic-gradient</span><span class="p">(</span><span class="n">from</span> <span class="n">var</span><span class="p">(</span><span class="n">--analog-gauge-start-angle</span><span class="p">,</span> <span class="m">235deg</span><span class="p">),</span> 
  <span class="n">var</span><span class="p">(</span><span class="n">--analog-gauge-bg</span><span class="p">));</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And we get:</p>

<p><a href="assets/2383490/db917670.jpg" class="article-body-image-wrapper"><img src="assets/2383490/db917670.jpg" alt="CutOff" loading="lazy" width="558" height="556"></a></p>

<p><strong>What just happened?</strong> We changed the starting point of the gradient to where we want to place the <code>min</code>-label. We then added the length of the range using <code>--analog-gauge-range)</code>, and after that point, we simply insert a transparent (<code>#0000</code>) color.</p>

<p>Next, let's add a circular mask to cut off the inner part of the circle — we control the width with a custom property, <code>--analog-gauge-bdw</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:host</span> <span class="p">{</span>
  <span class="py">--analog-gauge-mask-circle</span><span class="p">:</span>
    <span class="n">radial-gradient</span><span class="p">(</span><span class="nb">circle</span> <span class="n">at</span> <span class="m">50%</span> <span class="m">50%</span><span class="p">,</span>
    <span class="m">#0000</span> <span class="n">calc</span><span class="p">(</span><span class="m">50</span><span class="n">cqi</span> <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--analog-gauge-bdw</span><span class="p">,</span> <span class="m">10</span><span class="n">cqi</span><span class="p">)),</span>
    <span class="m">#000</span> <span class="m">0</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Let's add this to our <code>gauge</code>-part:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:host::part</span><span class="o">(</span><span class="nt">gauge</span><span class="o">)</span> <span class="p">{</span>
  <span class="nl">mask</span><span class="p">:</span>
    <span class="n">var</span><span class="p">(</span><span class="n">--analog-gauge-mask-circle</span><span class="p">),</span>
    <span class="n">var</span><span class="p">(</span><span class="n">--analog-gauge-mask-segment</span><span class="p">,</span> <span class="nb">none</span><span class="p">);</span>
  <span class="py">mask-composite</span><span class="p">:</span>
    <span class="n">var</span><span class="p">(</span><span class="n">--analog-gauge-mask-composite</span><span class="p">,</span> <span class="n">subtract</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>We'll get back to the segment-mask later! Now we have:</p>

<p><a href="assets/2383490/37cb82e6.jpg" class="article-body-image-wrapper"><img src="assets/2383490/37cb82e6.jpg" alt="Circle Mask" loading="lazy" width="558" height="556"></a></p>

<h2>
  <a name="needle-in-a-haystack" href="#needle-in-a-haystack">
  </a>
  Needle in a haystack
</h2>

<p>Next up is the gauge needle. It's two grid cells wide:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:host::part</span><span class="o">(</span><span class="nt">needle</span><span class="o">)</span> <span class="p">{</span>
  <span class="nl">align-self</span><span class="p">:</span> <span class="nb">center</span><span class="p">;</span>
  <span class="py">grid-area</span><span class="p">:</span> <span class="m">2</span> <span class="p">/</span> <span class="m">1</span> <span class="p">/</span> <span class="m">3</span> <span class="p">/</span> <span class="m">3</span><span class="p">;</span>
  <span class="nl">height</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--analog-gauge-needle-h</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><a href="assets/2383490/30f31ffe.jpg" class="article-body-image-wrapper"><img src="assets/2383490/30f31ffe.jpg" alt="Needle" loading="lazy" width="558" height="554"></a></p>

<p>Let's add a circular mask to the point in the needle matching the absolute middle of our grid, and adjust the <code>transform-origin</code> of the needle to match that:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:host</span> <span class="p">{</span>
  <span class="py">-_m</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">100</span><span class="n">cqi</span><span class="p">/</span><span class="m">6</span><span class="p">);</span>
<span class="p">}</span>
<span class="nd">:host::part</span><span class="o">(</span><span class="nt">needle</span><span class="o">)</span> <span class="p">{</span>
  <span class="nl">mask</span><span class="p">:</span>
    <span class="n">radial-gradient</span><span class="p">(</span><span class="nb">circle</span> <span class="n">at</span> <span class="n">calc</span><span class="p">(</span><span class="m">100%</span> <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--_m</span><span class="p">))</span> <span class="m">50%</span><span class="p">,</span>
    <span class="m">#0000</span> <span class="m">0</span> <span class="m">2.5</span><span class="n">cqi</span><span class="p">,</span> <span class="m">#FFF</span> <span class="m">2.5</span><span class="n">cqi</span><span class="p">);</span>
  <span class="nl">transform-origin</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">100%</span> <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--_m</span><span class="p">))</span> <span class="m">50%</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And we get:</p>

<p><a href="assets/2383490/1c076ae3.jpg" class="article-body-image-wrapper"><img src="assets/2383490/1c076ae3.jpg" alt="Needle mask" loading="lazy" width="558" height="560"></a></p>

<p>The <code>--_m</code> variable is 1/6th of the circle width (<code>100cqi</code>), and thus the middle of a grid cell.</p>

<p>Next, let's add a fancy clip-path to make it look like a gauge needle:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:host::part</span><span class="o">(</span><span class="nt">needle</span><span class="o">)</span> <span class="p">{</span>
  <span class="nl">clip-path</span><span class="p">:</span> <span class="n">polygon</span><span class="p">(</span><span class="m">7.5%</span> <span class="m">50%</span><span class="p">,</span><span class="m">78%</span> <span class="m">0%</span><span class="p">,</span><span class="m">83%</span> <span class="m">35%</span><span class="p">,</span><span class="m">83%</span> <span class="m">65%</span><span class="p">,</span><span class="m">78%</span> <span class="m">100%</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><a href="assets/2383490/32f7ede2.jpg" class="article-body-image-wrapper"><img src="assets/2383490/32f7ede2.jpg" alt="Needle clippath" loading="lazy" width="556" height="552"></a></p>

<p>I made a <a href="https://codepen.io/stoumann/pen/abZxoOM" target="_blank" rel="noopener noreferrer">clip-path editor</a> if you want to make your own needle!</p>

<h2>
  <a name="labels" href="#labels">
  </a>
  Labels
</h2>

<p>The labels are added in the last row of grid cells, and are again placed using <code>grid-area</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:host::part</span><span class="o">(</span><span class="nt">label-min</span><span class="o">)</span> <span class="p">{</span>
  <span class="py">grid-area</span><span class="p">:</span> <span class="m">3</span> <span class="p">/</span> <span class="m">1</span> <span class="p">/</span> <span class="m">4</span> <span class="p">/</span> <span class="m">2</span><span class="p">;</span>
<span class="p">}</span>
<span class="nd">:host::part</span><span class="o">(</span><span class="nt">label-max</span><span class="o">)</span> <span class="p">{</span>
  <span class="py">grid-area</span><span class="p">:</span> <span class="m">3</span> <span class="p">/</span> <span class="m">3</span> <span class="p">/</span> <span class="m">4</span> <span class="p">/</span> <span class="m">4</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

</svg>

</div>
</div>

<p><a href="assets/2383490/fe260286.jpg" class="article-body-image-wrapper"><img src="assets/2383490/fe260286.jpg" alt="Labels" loading="lazy" width="560" height="558"></a></p>

<h2>
  <a name="value-marks" href="#value-marks">
  </a>
  Value Marks
</h2>

<p>For the value marks, we add an inner circle. This circle is the full width of the main circle <strong>minus</strong> the width of the gauge:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:host::part</span><span class="o">(</span><span class="nt">value-marks</span><span class="o">)</span> <span class="p">{</span>
  <span class="py">aspect-ratio</span><span class="p">:</span> <span class="m">1</span><span class="p">;</span>
  <span class="nl">border-radius</span><span class="p">:</span> <span class="m">50%</span><span class="p">;</span>
  <span class="py">grid-area</span><span class="p">:</span> <span class="m">1</span> <span class="p">/</span> <span class="m">1</span> <span class="p">/</span> <span class="m">4</span> <span class="p">/</span> <span class="m">4</span><span class="p">;</span>
  <span class="py">place-self</span><span class="p">:</span> <span class="nb">center</span><span class="p">;</span>
  <span class="nl">width</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">100</span><span class="n">cqi</span> <span class="n">-</span> <span class="p">(</span><span class="m">2</span> <span class="err">*</span> 
    <span class="n">var</span><span class="p">(</span><span class="n">--analog-gauge-bdw</span><span class="p">,</span> <span class="m">10</span><span class="n">cqi</span><span class="p">)));</span>
<span class="p">}</span>
</code></pre>

<h2>
  <a name="segments" href="#segments">
  </a>
  Segments
</h2>

<p>Remember the empty segment-mask we added earlier? Let's add that so we have an easy way to segmentize the gauge-gradient:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:host</span> <span class="p">{</span>
  <span class="py">--analog-gauge-segments</span><span class="p">:</span> <span class="m">10</span><span class="p">;</span>
  <span class="py">--analog-gauge-mask-segment</span><span class="p">:</span>
    <span class="n">repeating-conic-gradient</span><span class="p">(</span>
      <span class="n">from</span> <span class="n">var</span><span class="p">(</span><span class="n">--analog-gauge-start-angle</span><span class="p">,</span> <span class="m">235deg</span><span class="p">)</span> <span class="n">at</span> <span class="m">50%</span> <span class="m">50%</span><span class="p">,</span>
      <span class="m">#000</span> <span class="m">0</span> <span class="n">var</span><span class="p">(</span><span class="n">--analog-gauge-segments-w</span><span class="p">,</span> <span class="m">1deg</span><span class="p">),</span>
      <span class="m">#0000</span> <span class="m">0</span> <span class="n">calc</span><span class="p">((</span><span class="n">var</span><span class="p">(</span><span class="n">--analog-gauge-range</span><span class="p">,</span> <span class="m">250deg</span><span class="p">)</span> <span class="p">/</span>
      <span class="n">var</span><span class="p">(</span><span class="n">--analog-gauge-segments</span><span class="p">,</span> <span class="m">5</span><span class="p">))));</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Phew! That requires some explanation! Let's break it down:</p>

<ol>
<li>We create a mask at the same angle as the main gradient.</li>
<li>The <code>--analog-gauge-segments</code> variable sets how many segments to divide the gauge into (default is 10). Setting it to 1 gives us a single segment - returning to our original solid gradient.</li>
<li>The repeating pattern creates thin black lines (<code>#000</code>) with width of <code>--analog-gauge-segments-w</code> (default is 1deg).</li>
<li>Between these lines, we have transparent areas (<code>#0000</code>).</li>
<li>The size of each segment is calculated by dividing the total range (<code>--analog-gauge-range</code>) by the number of segments.</li>
<li>When combined with our previous mask using <code>mask-composite: subtract</code>, these black lines create visible separations in our gauge.</li>
</ol>

<p><a href="assets/2383490/3e535cf9.jpg" class="article-body-image-wrapper"><img src="assets/2383490/3e535cf9.jpg" alt="Segments" loading="lazy" width="560" height="562"></a></p>

<p>And ... we're done! Let's remove the grid-preview and see the final gauge:</p>

<h3>
  <a name="supported-attributes" href="#supported-attributes">
  </a>
  Supported Attributes
</h3>

<p>The component accepts these attributes:</p>

<ul>
<li>
<code>value</code>: Current value (number)</li>
<li>
<code>min</code>: Minimum value (default: 0)</li>
<li>
<code>max</code>: Maximum value (default: 100)</li>
<li>
<code>suffix</code>: Text to append after value (e.g., "%", "°")</li>
<li>
<code>label</code>: Main label text</li>
<li>
<code>min-label</code>: Label for minimum value</li>
<li>
<code>max-label</code>: Label for maximum value</li>
<li>
<code>values</code>: Specify value markers in two formats:

<ul>
<li>A single number (e.g., "11") to generate evenly spaced markers</li>
<li>A comma-separated list (e.g., "Low,Mid,High") for custom labels</li>
</ul>


</li>

</ul>
