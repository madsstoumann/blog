		<article>
			<h1>Nested border-radius Playground</h1>
			<p>When nesting elements with a <code>border-radius</code>, I found <a href="https://joshnh.com/weblog/getting-inner-border-radius-just-right/" target="_blank" rel="noopener noreferrer">this formula</a>, which I implemented in the Codepen below:</p>

<p><iframe height="600" src="https://codepen.io/stoumann/embed/RwgPyqw?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
</p>


<hr>

<p>Each “inner ring” multiplies the <code>--gap</code>, and deducts it from the border-radius: <code>--bdrs</code>:</p>

<p><code>calc(var(--bdrs) - (var(--gap) * 1))</code> etc.</p>

<p>It looks fine with larger border-radii, but when the gap increases, and you use smaller radii, you'll end up with <strong>negative</strong> radii (thus, not visible) in those inner rings, where the multiplied <code>--gap</code> ends up being larger than the radii.</p>

<p>I'll never use this irl, but – just out of curiosity – does anyone have a better formula, that'll work with infinite inner radii? Or maybe use something like <code>clamp()</code>?</p>


		</article>
