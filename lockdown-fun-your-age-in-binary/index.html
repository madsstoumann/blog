			<h1>Lockdown Fun: Your Age In Binary</h1>
			<p>Today I gave my son a piece of paper with this cryptic message: <code>00001100</code>. </p>

<p>“This is you”, I told him – “and <em>this</em> is your sister”: <code>00001111</code>.</p>

<p>“If you can work this out, I'll pay for your <em>v-bucks!</em>”</p>

<p>I gave him a single hint. The word “binary”.</p>

<p>Unfortunately, it only took him 5 minutes to Google the answers: <code>12</code> and <code>15</code>.</p>

<p>Nevertheless, I made the pen below, and we had a talk about what <em>binary numbers</em> are – and how computers work:</p>

<p><iframe height="600" src="https://codepen.io/stoumann/embed/MWJpxLy?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
</p>

<p>If you have kids, let them click on the circles until the sum equals their age (or their parents age!), and if they're curious – well, then you have an excuse to talk about programming and stuff 😁</p>

<p>Thanks for reading, and Happy Easter!</p>
