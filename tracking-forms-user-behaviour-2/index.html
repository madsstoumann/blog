			<h1>Tracking Forms &amp;amp; User Behaviour</h1>
			<p>Tracking valid form-submissions is pretty easy with Google Tag Manager — it&#8217;s Form-Submit-listener has a &#8220;Check Validation&#8221;-setting:</p>
<blockquote><p>Only fire tags if the form will successfully submit. If unselected, fire tags whenever a user tries to submit the form.</p></blockquote>
<p>Unfortunately, this will not work with back-end validated forms, unless the back-end provides information to Google Tag Managers <em>dataLayer</em> upon successful submission.</p>
<p>This is not very generic, and often requires extra back-end work per form — so let&#8217;s look at other ways to solve this problem in a more user-friendly and generic way.</p>
<p>In this blog-post, we&#8217;ll look into <strong>HTML5&#8217;s built-in form-validation</strong>.<br />
We&#8217;ll start with a basic sign-up form (<a title="Basic form example" href="http://www.stoumann.dk/examples/gtmform/basic.html" target="_blank">Online example here</a>).:</p>
<p><img src="assets/wp-323/1c450928.png" alt="Basic form example" /></p>
<p>In order to trigger the browser&#8217;s built-in, and thus client-side, form-validation — we need to add some HTML5-attributes to our form&#8217;s inputs:</p>
<p><strong>required</strong><br />
This boolean attribute tells the browser that the input-field is required. Some browsers will also match the input&#8217;s type upon validating, ie.: &#8220;date&#8221;, &#8220;email&#8221;, &#8220;number&#8221;, &#8220;text&#8221; etc.</p>
<p><strong>title</strong><br />
The <em>title</em>-attribute provides a tooltip for the input, but it will <em>also</em> be added to some browsers&#8217; validation-message if the input is empty or incorrect.</p>
<p><strong>pattern</strong><br />
The <em>pattern</em>-attribute acts as a <em>regular expression</em>-template for the given input, ie:</p>
<pre class="brush: xml; title: ; notranslate" title="">
&lt;input type=&quot;tel&quot; pattern=&quot;\d{8}&quot; /&gt;
</pre>
<p>— will match 8 digits.</p>
<p>Mission (almost) accomplished!</p>
<p>But HTML5 has more to offer us. By adding the <em>placeholder</em>-attribute, we can easily show the user how the value is supposed to look like.</p>
<p>And by adding the <em>title</em>-attribute to the input&#8217;s label for further information — and beef it up with a little CSS, the odds of the user submitting an incorrect filled-out form are low.</p>
<h2>CSS Pseudo-classes</h2>
<p>HTML5&#8217;s form validation also provides a range of CSS-pseudo-classes:</p>
<ul>
<li>valid</li>
<li>invalid</li>
<li>required</li>
<li>optional</li>
<li>in-range</li>
<li>out-of-range</li>
<li>read-only</li>
<li>read-write</li>
</ul>
<p>—Mixed with SVG background-images (for those wonderful retina-displays!) and an <em>autofocus</em>-attribute for the first input, the form now looks like this (<a title="HTML5 form example" href="http://www.stoumann.dk/examples/gtmform/h5form.html" target="_blank">Online example here</a>).:</p>
<p><img src="assets/wp-323/d5907dff.png" alt="Html5 form" /></p>
<p>—and that is <em>without</em> any JavaScript, just pure HTML5 and CSS3!</p>
<p>By checking the &#8220;Check Validation&#8221;-setting in Google Tag Manager, the form submit-event will now only be fired if the form passes the browser&#8217;s built-in validation.</p>
<h2>Tracking user behavior</h2>
<p>By hacking into the browsers built-in validation through JavaScript, we can track the users&#8217; behavior and thus gain insights into the form&#8217;s usability.<br />
Maybe the required password-strucure is too complex? Or something else?</p>
<p>By temporarily by-passing the browsers built-in validation, we will check the <em>validity</em>-object for <em>valid</em>; we&#8217;ll ignore empty inputs (<em>valueMissing</em>), but only track inputs that are incorrectly filled out.</p>
<p>Those values will be added to a custom event in Google Tag Manager (excerpt):</p>
<pre class="brush: jscript; title: ; notranslate" title="">
for (i = l; i--;) {
  oField = oForm.elements[i];
  if (oField.nodeName !== &quot;INPUT&quot; &amp;&amp; oField.nodeName !== &quot;TEXTAREA&quot; &amp;&amp; oField.nodeName !== &quot;SELECT&quot;) continue;
  if (typeof oField.willValidate !== &quot;undefined&quot;) oField.checkValidity();

  if (!oField.validity.valid) {
    // Do not track empty input-fields
    if (!oField.validity.valueMissing) {
      oEvent = 
      {
        &quot;event&quot;: &quot;setEvent&quot;,
        &quot;eventAction&quot;: &quot;formValidationError&quot;,
        &quot;eventCategory&quot;: oForm.name + &quot;_&quot; + (oField.name || oField.id),
        &quot;eventLabel&quot;:  oField.value
      };
      window.dataLayer.push(oEvent);
    }
    break;
  } 
}
</pre>
<p>—Now, going to Google Tag Manager&#8217;s &#8220;Behavior &gt; Events&#8221;-section, under &#8220;formValidationError&#8221;, we can look up our form and see precisely which inputs cause problems for the users!</p>
<h2>Final example</h2>
<p>The final example, including the tracking script is <a title="HTML5 form example" href="http://www.stoumann.dk/examples/gtmform/index.html" target="_blank">available here</a> (view source/inspect to see the HTML, CSS and JavaScript).</p>
<h2>Legacy browsers</h2>
<p>It&#8217;s only the so-called <em>evergreen</em>-browsers that supports HTML5 forms and it&#8217;s CSS pseudo-classes. The forms above will work in IE9 and below, but the validation and styling will be gone.</p>
<p>However, our focus was on enhancing existing (back-end-validated) forms — and by doing these small changes, the user-experience will be significantly better for at least 70% of the users.</p>
<p>But all is not lost for legacy browsers. The <a href="http:///github.com/ryanseddon/H5F" target="_blank">H5F-project </a>provides HTML5 form-validation for older browsers — but without behavior-tracking (this would require a customized, re-written version of the H5F-script).</p>
<p>Finally, one could also imagine a script that would add HTML5-validation to existing forms automatically, with a few customizations per client.</p>
