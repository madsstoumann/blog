			<h1>275 bytes BMI Calculator</h1>
			<p>You don't always need a large frontend framework for interactive components. </p>

<p>As an example, I've made a BMI Calculator, which is only 275 bytes, minified and gzipped.</p>

<p>I always wrap smaller, interactive components, in either a <code>&lt;form&gt;</code> or a <code>&lt;fieldset&gt;</code>-tag.<br>
Depending on the component, I add a single <code>eventListener</code>, either <code>onchange</code> or <code>oninput</code>.</p>

<p>This is a "catch all" for any input within the <code>&lt;form&gt;</code> or <code>&lt;fieldset&gt;</code>. If I need to know the specific element that changed, it's in the <code>event.target</code>.</p>

<p>Let's dissect the calculator. The <code>&lt;form&gt;</code> has two <code>&lt;input type="range"&gt;</code> (height, weight) and three <code>&lt;output&gt;</code>-tags (height info, weight info, bmi result).</p>

<p>Excerpt:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;input</span> <span class="na">type=</span><span class="s">"range"</span> <span class="na">name=</span><span class="s">"h"</span> <span class="na">min=</span><span class="s">"150"</span> <span class="na">max=</span><span class="s">"230"</span> <span class="na">step=</span><span class="s">"0.5"</span> <span class="na">value=</span><span class="s">"180"</span> <span class="nt">/&gt;</span>
<span class="nt">&lt;output</span> <span class="na">name=</span><span class="s">"ho"</span><span class="nt">&gt;&lt;output&gt;</span>
</code></pre>

<p>The un-minified JavaScript-code looks like this:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">function</span> <span class="nf">B</span><span class="p">()</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">groups</span> <span class="o">=</span> <span class="p">[[</span><span class="mi">0</span><span class="p">,</span><span class="mf">18.49</span><span class="p">],</span> <span class="p">[</span><span class="mf">18.5</span><span class="p">,</span><span class="mf">24.99</span><span class="p">],</span> <span class="p">[</span><span class="mi">25</span><span class="p">,</span><span class="mf">29.99</span><span class="p">],</span> <span class="p">[</span><span class="mi">30</span><span class="p">,</span><span class="mf">34.99</span><span class="p">],</span> <span class="p">[</span><span class="mi">35</span><span class="p">,</span><span class="mf">39.99</span><span class="p">],</span> <span class="p">[</span><span class="mi">40</span><span class="p">,</span><span class="mi">100</span><span class="p">]];</span>
  <span class="kd">const</span> <span class="nx">height</span> <span class="o">=</span> <span class="k">this</span><span class="p">.</span><span class="nx">h</span><span class="p">.</span><span class="nx">valueAsNumber</span><span class="p">;</span>
  <span class="kd">const</span> <span class="nx">weight</span> <span class="o">=</span> <span class="k">this</span><span class="p">.</span><span class="nx">w</span><span class="p">.</span><span class="nx">valueAsNumber</span><span class="p">;</span>
  <span class="kd">const</span> <span class="nx">bmi</span> <span class="o">=</span> <span class="nf">parseFloat</span><span class="p">(</span><span class="nx">weight</span> <span class="o">/</span> <span class="p">((</span><span class="nx">height</span> <span class="o">/</span> <span class="mi">100</span><span class="p">)</span> <span class="o">**</span> <span class="mi">2</span><span class="p">)).</span><span class="nf">toFixed</span><span class="p">(</span><span class="mi">2</span><span class="p">);</span>
  <span class="kd">const</span> <span class="nx">index</span> <span class="o">=</span> <span class="nx">groups</span><span class="p">.</span><span class="nf">findIndex</span><span class="p">(</span><span class="nx">arr</span> <span class="o">=&gt;</span> <span class="nx">arr</span><span class="p">[</span><span class="mi">0</span><span class="p">]</span> <span class="o">&lt;=</span> <span class="nx">bmi</span> <span class="o">&amp;&amp;</span> <span class="nx">bmi</span> <span class="o">&lt;</span> <span class="nx">arr</span><span class="p">[</span><span class="mi">1</span><span class="p">]);</span>
  <span class="kd">let</span> <span class="nx">inches</span> <span class="o">=</span> <span class="p">(</span><span class="nx">height</span><span class="o">*</span><span class="mf">0.393700787</span><span class="p">).</span><span class="nf">toFixed</span><span class="p">(</span><span class="mi">0</span><span class="p">);</span>
  <span class="k">this</span><span class="p">.</span><span class="nx">ho</span><span class="p">.</span><span class="nx">value</span> <span class="o">=</span> <span class="s2">`</span><span class="p">${</span><span class="nx">height</span><span class="p">}</span><span class="s2"> cm / </span><span class="p">${</span><span class="nb">Math</span><span class="p">.</span><span class="nf">floor</span><span class="p">(</span><span class="nx">inches</span> <span class="o">/</span> <span class="mi">12</span><span class="p">)}</span><span class="s2">' </span><span class="p">${</span><span class="nx">inches</span> <span class="o">%=</span> <span class="mi">12</span><span class="p">}</span><span class="s2">"`</span><span class="p">;</span>
  <span class="k">this</span><span class="p">.</span><span class="nx">wo</span><span class="p">.</span><span class="nx">value</span> <span class="o">=</span> <span class="s2">`</span><span class="p">${</span><span class="nx">weight</span><span class="p">}</span><span class="s2"> kg / </span><span class="p">${(</span><span class="nx">weight</span><span class="o">*</span><span class="mf">2.2046</span><span class="p">).</span><span class="nf">toFixed</span><span class="p">(</span><span class="mi">2</span><span class="p">)}</span><span class="s2"> lb`</span><span class="p">;</span>
  <span class="k">this</span><span class="p">.</span><span class="nx">g</span><span class="p">[</span><span class="nx">index</span><span class="p">].</span><span class="nx">checked</span> <span class="o">=</span> <span class="kc">true</span><span class="p">;</span>
  <span class="k">this</span><span class="p">.</span><span class="nx">r</span><span class="p">.</span><span class="nx">value</span> <span class="o">=</span> <span class="nx">bmi</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>

<p><code>groups</code> is an array of BMI-ranges, corresponding to the six BMI-groups (underweight, normal weight etc.).</p>

<p><code>height</code> and <code>weight</code> are references to the range-input values.</p>

<p><code>bmi</code> is the formula for calculating a BMI using height and weight.</p>

<p><code>index</code> finds the index of the BMI-group, in which range the current <code>bmi</code> is found. This value is later used to set the current BMI-group (a radio-button-group):<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="k">this</span><span class="p">.</span><span class="nx">g</span><span class="p">[</span><span class="nx">index</span><span class="p">].</span><span class="nx">checked</span> <span class="o">=</span> <span class="kc">true</span><span class="p">;</span>
</code></pre>

<p>An <code>&lt;output&gt;</code>-tag can either be set using <code>.innerText</code> or <code>.value</code>. I prefer the latter, and that's how the labels are set, as an example:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="k">this</span><span class="p">.</span><span class="nx">r</span><span class="p">.</span><span class="nx">value</span> <span class="o">=</span> <span class="nx">bmi</span><span class="p">;</span>
</code></pre>

<p>The code itself is 381 bytes, gzipped approx. 275 bytes. <strong>However</strong>, if your modules are so small, there's no benefit in gzipping them, as the "un-gzipping" will take longer than the benefit of the smaller file-size.</p>
