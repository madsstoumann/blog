			<h1>The State of Front-End: Building Progressive Components</h1>
			<p>In the beginning, Tim Berners-Lee created HTML.<br />
Then Brendan Eich created JavaScript.<br />
And finally, Håkon Wium Lie created CSS.</p>
<p><a href="https://madsstoumann.wordpress.com/wp-content/uploads/2016/11/front-end-development.jpg"><img data-attachment-id="722" data-permalink="https://madsstoumann.wordpress.com/2016/11/10/what-is-a-front-end-developer/front-end-development/" data-orig-file="https://madsstoumann.wordpress.com/wp-content/uploads/2016/11/front-end-development.jpg" data-orig-size="980,460" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="front-end-development" data-image-description="" data-image-caption="" data-medium-file="https://madsstoumann.wordpress.com/wp-content/uploads/2016/11/front-end-development.jpg?w=300" data-large-file="https://madsstoumann.wordpress.com/wp-content/uploads/2016/11/front-end-development.jpg?w=980" loading="lazy" class="alignnone size-full wp-image-722" src="assets/wp-698/4f4df36f.jpg" alt="front-end-development" width="615" height="289" srcset="https://madsstoumann.wordpress.com/wp-content/uploads/2016/11/front-end-development.jpg?w=615&amp;h=289 615w, https://madsstoumann.wordpress.com/wp-content/uploads/2016/11/front-end-development.jpg?w=150&amp;h=70 150w, https://madsstoumann.wordpress.com/wp-content/uploads/2016/11/front-end-development.jpg?w=300&amp;h=141 300w, https://madsstoumann.wordpress.com/wp-content/uploads/2016/11/front-end-development.jpg?w=768&amp;h=360 768w, https://madsstoumann.wordpress.com/wp-content/uploads/2016/11/front-end-development.jpg 980w" sizes="(max-width: 615px) 100vw, 615px" /></a></p>
<p>This was — and still is — the Holy Trinity of Front End-development.<br />
This is how it worked then, and still works:</p>
<p>HTML = <em>Content</em><br />
CSS = <em>Styling</em> of content<br />
JavaScript: <em>Interaction</em> with content</p>
<p>Because JavaScript lacked an easy way to select and add events to elements,  jQuery came along. For many years JavaScript <em>became</em> jQuery — many developers didn&#8217;t even <em>know</em> how to write JavaScript without jQuery, so JavaScript were nicknamed <em>Vanilla JS</em>, to make it sound like a framework (or so I guess).</p>
<p>But JavaScript evolved, surpassed jQuery, and the site <a href="http://youmightnotneedjquery.com">You Might Not Need jQuery</a> was launched to demonstrate this. It created an outcry back then, but many developers switched to <em>Vanilla JS</em> and didn&#8217;t look back.</p>
<p>Today we have <em>loads</em> and <em>loads</em> of JavaScript frameworks and they all have the same thing in common: They&#8217;re built with <em>Vanilla JS</em>.</p>
<p>For CSS, we can paint a similar picture: Today we can write/compile our CSS in SASS/SCSS, LESS, postCSS etc., but they all output the same thing: <strong>CSS</strong> (or maybe we should nickname it <em>Vanilla CSS?</em>).</p>
<p>All 3 languages have evolved tremendously during the years, but they&#8217;re all built with exactly the same structure/mindset as in 1989, 1995 and 1996 when the initial versions were launched.</p>
<p>About a month ago, a new site, <a href="http://youmightnotneedjavascript.com">You Might Not Need JavaScript</a>, were launched.<br />
Of course it created an outcry, and I can understand why:</p>
<p><em><strong>How can you have interaction without JavaScript?</strong></em></p>
<p>After all, that&#8217;s it&#8217;s role in the Holy Trinity!</p>
<p>Interaction can, in many cases, be simplified to this: <em>state</em>.<br />
Is the element <em>Selected? Unselected? Hovered? Focused?</em></p>
<p>So much logic, on any website, is based on adding or removing style-classes from an element based on <em>state</em>.</p>
<p>JavaScript <em>does not</em> have monopoly on setting state. In fact, HTML has <em>always</em> had <em>state</em>, it might just not be that obvious.</p>
<p>Any &lt;input&gt;-element has <em>state</em>. Whatever you do to an input will be preserved if you navigate away from the given page and then use your browser&#8217;s <em>Back-button</em> to go back to that page. Only a page-reload or JavaScript (or setting the <em>value</em> or <em>autocomplete</em> attributes) can change this default behaviour.</p>
<p>When a form is processed, you can almost <em>feel</em> the state/logic:</p>
<p><strong>IF</strong> this is checked <strong>THEN</strong> do something <strong>AND</strong> <strong>IF</strong> radio-button-group is this <strong>OR</strong> that <strong>OR</strong> that <strong>THEN</strong> do something.</p>
<p>This same logic can, by the use of &lt;input&gt;-checkboxes and radio-buttons, be used for controlling <em>state</em> on not just forms, but other components as well. And — come to think of it — before CSS, that&#8217;s <em>exactly</em> how you would make users choose between various options on a webpage.</p>
<h2>Styling state</h2>
<p>With CSS3 it became possible to style the <em>:checked</em>-state of a radio-button or checkbox.<br />
For reasons unknown, it became known as <em>the checkbox hack</em>, when it really should be called: Styling the <em>:checked</em>-state of a radio-button or checkbox (!)</p>
<p>In addition to styling the <em>:checked</em>-state, CSS3 can also style these states:</p>
<p>:active<br />
:focus<br />
:hover<br />
:in-range<br />
:invalid*<br />
:out-of-range<br />
:target<br />
:valid*</p>
<h6>*) In conjunction with :optional and :required, these selectors can dynamically indicate valid and invalid form-fields without JavaScript. All selectors can also be used in conjunction with the :not()-selector.</h6>
<p>It&#8217;s important to notice, that the actual <em>state</em> is controlled by HTML, not CSS — CSS is only <em>styling</em> the <em>state, </em>so I have do disagree with Hugo Giraudel in <a href="http://hugogiraudel.com/2016/10/13/you-might-need-javascript/">this blog post</a> (this is the first time I disagree with him, he&#8217;s a front-end-superstar!)</p>
<h2>Benefits</h2>
<p>What are the benefits of using HTML state?</p>
<ul>
<li>Instant UI.</li>
<li>Preserves state.</li>
<li>Keyboard navigable. By default, radio-buttons in a radio-button-group can be selected with the arrow-keys and toggled with spacebar.</li>
<li><strong>Progressive Enhancement.</strong><br />
Make the component work <em>without</em> JavaScript for basic functionality and <em>then</em> add JavaScript for setting WAI-ARIA-states, JavaScript-based animations etc.<br />
If JavaScript fails/breaks (and this can be caused by loading external scripts you don&#8217;t control), the component <strong>will still work</strong>. Also, for users in third-world countries with slower devices running <em>Opera Mini </em>(according to Bruce Lawson, that&#8217;s a lot of users), JavaScript will be &#8220;cut off&#8221; after 5 seconds, so if your components are dependant on large JavaScript-frameworks, they might not work for these users.</li>
<li>Works in emails. Sort of &#8230; Google has just removed support for all CSS pseudo-selector-states except <em>:hover</em> in Gmail, but I suspect it will come back. I don&#8217;t have the current statistics, but the :checked-state used to work in more than 80% of email-clients. Take a look at <a href="http://litmus.com">Litmus.com</a> for more info on interactive emails.</li>
</ul>
<h2>Example: Accordion</h2>
<p>A couple of years ago, I was asked to do an accordion-component with the following specs:</p>
<ul>
<li>The accordion should toggle, meaning any selection would auto-collapse, when another was chosen.</li>
<li>Selections <em>within</em> the expanded content should toggle, but here, multiple selections were allowed.</li>
<li>All selections should be keyboard-navigable.</li>
<li>All states should be preserved upon navigation, meaning, that if you navigated <em>away</em> from the page and went back, everything should be &#8220;folded out&#8221; as when you left the page.</li>
</ul>
<p>Naturally, this required <em>a lot of JavaScript</em> and DOM-iterations for each selection (add &#8220;selected&#8221; class from active element, remove it from the others), keyboard-event listener, saving state to a cookie (or localStorage) etc. etc.</p>
<p>By using radio-buttons for the auto-collapse and checkboxes for the multiple selections, no JavaScript was necessary. <em>Keyboard-navigation</em> and remembering <em>state</em> upon navigation were thrown in for free.</p>
<h2>Even Apple does it &#8230;</h2>
<p>On Apples&#8217;s new website, checkboxes are used multiple places to toggle state.</p>
<h2>Upcoming</h2>
<p>In an upcoming post, I will demonstrate a true <em>progressive component</em> with state controlled by HTML, styled by CSS &#8211; and with JavaScript for adding WAI-ARIA-states.</p>
<p>Happy coding!</p>
