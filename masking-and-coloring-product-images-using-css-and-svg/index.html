			<h1>Masking and coloring product images using CSS and SVG</h1>
			<p>If you have a product that's available in several colors, it can be cumbersome and expensive to take pictures of each variant.</p>

<p>Luckily, we can use CSS and SVG to mask a single image. </p>

<p>In this tutorial, we'll create a mask for the "product"-part of an image, so we can replace it's color. We'll also remove the <em>background</em> of the image, so we can add our own.</p>


<hr>

<h2>
  <a name="initial-steps" href="#initial-steps">
  </a>
  Initial steps
</h2>

<p><strong>1.</strong> <br>
Find a useable image. I searched for "white t-shirt" on pexels.com, and found <a href="https://www.pexels.com/da-dk/foto/mode-person-model-blondine-1304647/" target="_blank" rel="noopener noreferrer">this image</a>:</p>

<p><a href="assets/1150105/ba756733.jpg" class="article-body-image-wrapper"><img src="assets/1150105/ba756733.jpg" alt="Person in a white t-shirt" loading="lazy" width="800" height="1366"></a></p>

<p><strong>2.</strong><br>
Then I removed the background using <a href="https://remove.bg" target="_blank" rel="noopener noreferrer">remove.bg</a> (you get 1 free credit per month, so use it wisely!)</p>

<p><strong>3.</strong><br>
I converted this image to webp, using an <a href="https://ezgif.com/jpg-to-web" target="_blank" rel="noopener noreferrer">online converter</a>.</p>

<p><strong>4.</strong><br>
Then I opened the converted image in <a href="https://www.vectornator.io/" target="_blank" rel="noopener noreferrer">Vectornator</a>, a great, <strong>free</strong> vector-editor – and added a path using the Pen tool (for clarity, I added a layer behind the image with a solid background-color):</p>

<p><a href="assets/1150105/265cc46f.jpg" class="article-body-image-wrapper"><img src="assets/1150105/265cc46f.jpg" alt="Path in Vectornator" loading="lazy" width="800" height="878"></a></p>

<p><strong>5.</strong><br>
Finally, I exported the mask to <code>svg</code>, and cleaned it up using <a href="https://jakearchibald.github.io/svgomg/" target="_blank" rel="noopener noreferrer">SVGOMG</a>.</p>

<p>Phew! A lot of steps, but the only time-consuming step is the "masking" in Vectornator. If you need to do this for a lot of products, consider hiring a specialist on <a href="https://fiverr.com/" target="_blank" rel="noopener noreferrer">Fiverr</a> or similar.</p>

<hr>

<p>Now for the fun part! First, we need some markup:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;figure&gt;</span>
  <span class="nt">&lt;img</span> <span class="na">src=</span><span class="s">"image.webp"</span> <span class="na">alt=</span><span class="s">"Text"</span> <span class="nt">/&gt;</span>
  <span class="nt">&lt;div&gt;&lt;/div&gt;</span>
<span class="nt">&lt;/figure&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>




<hr>

<p>For the <code>figure</code>-tag, we'll add a few CSS <em>Custom Properties</em>, to set the t-shirt-color in <code>hsl()</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight plaintext"><code>figure {
  --h: 168;
  --s: 40%;
  --l: 65%;
}
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>We want to set the background to the <strong>contrast-color</strong> of the t-shirt-color. That equals rotating the <strong>hue</strong> (<code>--h</code>) <strong>180 degrees</strong>. </p>

<p>To make it a bit more interesing, we create a gradient with subtracted saturation (20%) for the first color, and subtracted lightness (20%) for the second:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">figure</span> <span class="p">{</span>
<span class="py">--_bg</span><span class="p">:</span> <span class="n">linear-gradient</span><span class="p">(</span><span class="m">15deg</span><span class="p">,</span>
  <span class="n">hsl</span><span class="p">(</span><span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--h</span><span class="p">)</span> <span class="err">+</span> <span class="m">180</span><span class="p">),</span>
  <span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--s</span><span class="p">)</span> <span class="n">-</span> <span class="m">20%</span><span class="p">),</span>
  <span class="n">var</span><span class="p">(</span><span class="n">--l</span><span class="p">)),</span> 
  <span class="n">hsl</span><span class="p">(</span><span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--h</span><span class="p">)</span> <span class="err">+</span> <span class="m">180</span><span class="p">),</span>
  <span class="n">var</span><span class="p">(</span><span class="n">--s</span><span class="p">),</span>
  <span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--l</span><span class="p">)</span> <span class="n">-</span> <span class="m">20%</span><span class="p">)));</span>

  <span class="nl">background</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--_bg</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Let's try it out, with different <code>--h</code>-values:</p>

<p><a href="assets/1150105/a5841771.jpg" class="article-body-image-wrapper"><img src="assets/1150105/a5841771.jpg" alt="Colored background" loading="lazy" width="800" height="455"></a></p>

<p>Cool - now, let's color the t-shirt using a <code>mask</code>.</p>


<hr>

<h2>
  <a name="enabling-the-mask" href="#enabling-the-mask">
  </a>
  Enabling the mask
</h2>



<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">div</span> <span class="p">{</span>
  <span class="nl">background-color</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span>
    <span class="n">var</span><span class="p">(</span><span class="n">--h</span><span class="p">),</span>
    <span class="n">var</span><span class="p">(</span><span class="n">--s</span><span class="p">),</span>
    <span class="n">var</span><span class="p">(</span><span class="n">--l</span><span class="p">)</span>
  <span class="p">);</span>
  <span class="py">inset</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="py">mask-image</span><span class="p">:</span> <span class="sx">url('mask.svg')</span><span class="p">;</span>
  <span class="py">mask-position</span><span class="p">:</span> <span class="nb">center</span><span class="p">;</span>
  <span class="py">mask-repeat</span><span class="p">:</span> <span class="nb">no-repeat</span><span class="p">;</span>
  <span class="py">mask-size</span><span class="p">:</span> <span class="m">100%</span><span class="p">;</span>
  <span class="py">mix-blend-mode</span><span class="p">:</span> <span class="n">multiply</span><span class="p">;</span>
  <span class="nl">position</span><span class="p">:</span> <span class="nb">absolute</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<blockquote>
<p><strong>Note:</strong> For Chrome and Safari, you need to add <code>-webkit</code>-prefixes to all the <code>mask</code>-properties.</p>
</blockquote>

<p><a href="assets/1150105/5d073e84.jpg" class="article-body-image-wrapper"><img src="assets/1150105/5d073e84.jpg" alt="Final result" loading="lazy" width="800" height="444"></a></p>

<p>Cool! Play around in Dev Tools with the three colors variables: <code>--h</code>, <code>--s</code> and <code>--l</code>.</p>


<hr>

<h2>
  <a name="a-note-on-the-svgmask" href="#a-note-on-the-svgmask">
  </a>
  A note on the SVG-mask
</h2>

<p>To be honest, I'm not very good at masking – and I've only used Vectornator a couple of times. </p>

<p>To make up for my masking-skills, I decided to make the mask a bit blurry, by adding a <a href="https://en.wikipedia.org/wiki/Gaussian_blur" target="_blank" rel="noopener noreferrer">Gaussian blur</a> to the <code>svg</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight xml"><code><span class="nt">&lt;filter</span> <span class="na">id=</span><span class="s">"f1"</span> <span class="na">x=</span><span class="s">"0"</span> <span class="na">y=</span><span class="s">"0"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;feGaussianBlur</span>
    <span class="na">in=</span><span class="s">"SourceGraphic"</span>
    <span class="na">stdDeviation=</span><span class="s">"3"</span> <span class="nt">/&gt;</span>
<span class="nt">&lt;/filter&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And then, in the <code>path</code> itself:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight xml"><code><span class="nt">&lt;path</span> <span class="na">filter=</span><span class="s">"url(#f1)"</span> <span class="err">...</span><span class="nt">&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>
