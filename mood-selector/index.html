			<h1>Mood Selector Component</h1>
			<p>Throughout this week, the “Star (rating) Wars” have run here on dev.to.</p>

<p>With proposals by @inhuofficial, @lapstjup, <a class="mentioned-user" href="https://dev.to/link2twenty">@link2twenty</a> , <a class="mentioned-user" href="https://dev.to/afif">@afif</a>, <a class="mentioned-user" href="https://dev.to/siddharthshyniben">@siddharthshyniben</a> and possisble others – dev.to has been plastered in “Star Rating” components!</p>

<p>My proposal was <a href="https://dev.to/madsstoumann/star-rating-using-a-single-input-i0l">a single input solution</a>, allowing for any number of stars, also half- and quarter-stars – without adding extra markup.</p>

<p>All the other solutions use groups of <code>&lt;input type="radio"&gt;</code>-tags, so I decided to do a component with just that, but not with <strong>stars</strong>. </p>

<p>Instead, pick your mood after these dramatic days – no JavaScript required:</p>

</iframe>
</p>

<p>Thanks for reading 😁</p>
