			<h1>Layered Gradient Playground</h1>
			<p>A while ago, I saw <a href="https://twitter.com/argyleink/status/1233406753892515847" target="_blank" rel="noopener noreferrer">this tweet</a> by Adam Argyle. It's a clever way of layering gradients, using CSS <code>mask-image</code>. For a new project I'm working on, I want a timeline, where layered background-gradients will change the site’s “look and feel” during the day.</p>

<p>To help me create all these gradients, I built a small tool, based on Adam’s idea:</p>
