			<h1>And the Oscar Goes to … Coding a Chronology Component</h1>
			<p>Earlier this year, a friend of mine shared a massive poster he had been working on for the <em>Copenhell</em> festival in Copenhagen, Denmark. The poster, an impressive <strong>2 x 12 meters</strong>, showcased a detailed chronology of significant cultural events from the past 50 years, with a particular focus on heavy metal rock — fitting, as <em>Copenhell</em> is a festival dedicated to that genre!</p>

<p><a href="assets/1869451/205acf06.jpg" class="article-body-image-wrapper"><img src="assets/1869451/205acf06.jpg" alt="Copenhell" loading="lazy" width="800" height="600"></a></p>

<p>I <strong>really</strong> loved the design — which featured a unique "snake timeline" layout. Inspired by this, I decided to create my own version using HTML and CSS, but with a twist — focusing on the "Best Picture" Oscar winners from 1972 onwards… and yes, I've seen them all!</p>


<hr>

<p>Let's start by creating some semantic markup. This HTML will provide the structure for our timeline and will look good even without any CSS styling applied:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;ol&gt;</span>
  <span class="nt">&lt;li</span> <span class="na">value=</span><span class="s">"1972"</span><span class="nt">&gt;</span>
    <span class="nt">&lt;article&gt;</span>
      <span class="nt">&lt;img</span> <span class="na">src=</span><span class="s">"1972.jpg"</span> <span class="na">alt=</span><span class="s">"The Godfather"</span><span class="nt">&gt;</span>
      <span class="nt">&lt;h4&gt;</span>The Godfather<span class="nt">&lt;/h4&gt;</span>
      <span class="nt">&lt;small&gt;</span>A powerful crime saga following the Corleone family's rise and near fall within organized crime<span class="nt">&lt;/small&gt;</span>
    <span class="nt">&lt;/article&gt;</span>
  <span class="nt">&lt;/li&gt;</span>
<span class="nt">&lt;/ol&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>

</svg>

<p>... and we get:</p>

<p><a href="assets/1869451/77dd5331.jpg" class="article-body-image-wrapper"><img src="assets/1869451/77dd5331.jpg" alt="No style" loading="lazy" width="686" height="1058"></a></p>

<p>As you can see, the timeline looks quite presentable even with just the default browser styles!</p>

<blockquote>
<p><strong>Note:</strong> The <code>value</code>-attribute is only valid for <code>&lt;li&gt;</code>-tags when the parent is an <em>ordered list</em>, <code>&lt;ol&gt;</code>.</p>
</blockquote>

<p>We'll use ordered lists for each "column" in the timeline, and wrap those those in:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;div</span> <span class="na">class=</span><span class="s">"ui-chronology"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;ol&gt;</span>...<span class="nt">&lt;/ol&gt;</span>
<span class="nt">&lt;/div&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>

<hr>

<h2>
  <a name="styling-the-listitems" href="#styling-the-listitems">
  </a>
  Styling the list-items
</h2>

<p>Each list item is a <code>grid</code> with two columns. The black line and the year are represented by <code>::before</code> and <code>::after</code> pseudo-elements, respectively. Both pseudo-elements are placed in the same grid cell (first column) using a 'grid stack' technique (<code>grid-area: 1 / 1</code>), which allows multiple elements to overlap within the same grid area:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">li</span> <span class="p">{</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">grid</span><span class="p">;</span>
  <span class="py">grid-template-columns</span><span class="p">:</span> <span class="n">max-content</span> <span class="m">1</span><span class="n">fr</span><span class="p">;</span>

  <span class="err">&amp;::before</span> <span class="err">{</span> <span class="c">/* Vertical line */</span>
    <span class="nl">content</span><span class="p">:</span> <span class="s1">""</span><span class="p">;</span>
    <span class="nl">background</span><span class="p">:</span> <span class="m">#000</span><span class="p">;</span>
    <span class="py">grid-area</span><span class="p">:</span> <span class="m">1</span> <span class="p">/</span> <span class="m">1</span><span class="p">;</span>
    <span class="py">margin-inline</span><span class="p">:</span> <span class="nb">auto</span><span class="p">;</span>
    <span class="nl">width</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--bdw</span><span class="p">);</span>
  <span class="p">}</span>

  <span class="o">&amp;</span><span class="nd">::after</span> <span class="p">{</span> <span class="c">/* Year */</span>
    <span class="nl">align-self</span><span class="p">:</span> <span class="n">start</span><span class="p">;</span>
    <span class="nl">background-color</span><span class="p">:</span> <span class="m">#000</span><span class="p">;</span>
    <span class="nl">border-radius</span><span class="p">:</span> <span class="m">.175em</span><span class="p">;</span>
    <span class="nl">color</span><span class="p">:</span> <span class="m">#FFF</span><span class="p">;</span>
    <span class="nl">content</span><span class="p">:</span> <span class="n">attr</span><span class="p">(</span><span class="n">value</span><span class="p">);</span>
    <span class="nl">font-size</span><span class="p">:</span> <span class="n">clamp</span><span class="p">(</span><span class="m">1rem</span><span class="p">,</span> <span class="m">0.2857rem</span> <span class="err">+</span> <span class="m">2.2857vw</span><span class="p">,</span> <span class="m">2rem</span><span class="p">);</span>
    <span class="nl">font-weight</span><span class="p">:</span> <span class="m">900</span><span class="p">;</span>
    <span class="py">grid-area</span><span class="p">:</span> <span class="m">1</span> <span class="p">/</span> <span class="m">1</span><span class="p">;</span>
    <span class="py">padding-inline</span><span class="p">:</span> <span class="m">.5ch</span><span class="p">;</span>
    <span class="nl">width</span><span class="p">:</span> <span class="m">5ch</span><span class="p">;</span>
  <span class="p">}</span>
<span class="err">}</span>
</code></pre>

<div class="highlight__panel-action js-fullscreen-code-action">

</svg>

    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

<p>I'm gonna jump ahead a bit, and show how 3 <code>&lt;ol&gt;</code>-tags look next to each other. We're almost there:</p>

<p><a href="assets/1869451/b6d33d61.jpg" class="article-body-image-wrapper"><img src="assets/1869451/b6d33d61.jpg" alt="Left-to-right" loading="lazy" width="800" height="1520"></a></p>

<p>What we're missing, are the "wavy connectors". To create the 'wavy connectors' between timeline entries, I used a small 'hack' involving a 'dummy' <code>&lt;li&gt;</code> tag. This tag acts as a placeholder for the decorative connectors, ensuring they are positioned correctly without affecting the rest of the timeline’s structure:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;li</span> <span class="na">value=</span><span class="s">"0"</span> <span class="na">aria-hidden=</span><span class="s">"true"</span><span class="nt">&gt;&lt;i&gt;&lt;/i&gt;&lt;/li&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>These will be placed at the very top and bottom of each <code>&lt;ol&gt;</code>, and since they're for decorative purposes only, I added <code>aria-hidden="true"</code>.</p>

<p>Now, the CSS for the connectors is quite complex, so I'll just show the structure with a few inline comments below — see the final CodePen-demo at the end and dive into the code:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">ol</span> <span class="p">{</span>
  <span class="err">&amp;:nth-of-type(odd)</span> <span class="err">{</span>
    <span class="err">li[value="0"]</span> <span class="err">{</span>
      <span class="err">&amp;:last-of-type</span> <span class="err">{</span>
        <span class="c">/* Bottom Left Corner */</span>
        <span class="err">&amp;::before</span> <span class="err">{</span> <span class="p">}</span>
      <span class="err">}</span>
    <span class="err">}</span>
    <span class="c">/* FIRST COLUMN ONLY */</span>
    <span class="o">&amp;</span><span class="nd">:first-of-type</span> <span class="p">{</span>
      <span class="err">li[value="0"]:first-of-type</span> <span class="err">{</span>
        <span class="c">/* Hide Top Left Corner */</span>
        <span class="err">&amp;::before</span> <span class="err">{</span> <span class="nl">display</span><span class="p">:</span> <span class="nb">none</span><span class="p">;</span> <span class="p">}</span> 
      <span class="err">}</span>
    <span class="err">}</span>
    <span class="o">&amp;</span><span class="nd">:not</span><span class="o">(</span><span class="nd">:first-of-type</span><span class="o">)</span> <span class="p">{</span> 
      <span class="err">li[value="0"]</span> <span class="err">{</span>
        <span class="err">&amp;:first-of-type</span> <span class="err">{</span>
        <span class="c">/* Top Left Corner: Reverse */</span>
          <span class="err">&amp;::before</span> <span class="err">{</span> <span class="p">}</span>
        <span class="err">}</span>
      <span class="err">}</span>
    <span class="err">}</span>

    <span class="o">&amp;</span><span class="nd">:last-of-type</span> <span class="nt">li</span><span class="o">[</span><span class="nt">value</span><span class="o">=</span><span class="s1">"0"</span><span class="o">]</span><span class="nd">:last-of-type</span> <span class="nt">i</span> <span class="p">{</span>
      <span class="err">...</span>
    <span class="p">}</span>
    <span class="c">/* Round dot at the end of the last list */</span>
    <span class="o">&amp;</span><span class="nd">:last-of-type</span> <span class="nt">li</span><span class="o">[</span><span class="nt">value</span><span class="o">=</span><span class="s1">"0"</span><span class="o">]</span><span class="nd">:last-of-type</span> <span class="nt">i</span><span class="nd">::after</span> <span class="p">{</span> <span class="err">...</span> <span class="p">}</span>
  <span class="err">}</span>

  <span class="c">/* EVEN COLUMNS */</span>
  <span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="nt">even</span><span class="o">)</span> <span class="p">{</span>
    <span class="err">li[value="0"]</span> <span class="err">{</span>
      <span class="err">&amp;:first-of-type</span> <span class="err">{</span>
        <span class="c">/* Top Left Corner */</span>
        <span class="err">&amp;::before</span> <span class="err">{</span> <span class="err">...</span> <span class="p">}</span>
      <span class="err">}</span>
      <span class="o">&amp;</span><span class="nd">:last-of-type</span> <span class="p">{</span>
        <span class="c">/* Bottom Left Corner: Reverse */</span>
        <span class="err">&amp;::before</span> <span class="err">{</span> <span class="err">...</span> <span class="p">}</span>
      <span class="err">}</span>
    <span class="err">}</span>
  <span class="err">}</span>
<span class="err">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Phew! A lot of <code>:first-of-type</code> / <code>:last-of-type</code>-logic! </p>

<p>Additionally, all the CSS is also using <strong>logical properties</strong>, such as:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">border-block-width</span><span class="o">:</span> <span class="err">0</span> <span class="nt">var</span><span class="o">(</span><span class="nt">--bdw</span><span class="o">);</span>
<span class="nt">border-inline-width</span><span class="o">:</span> <span class="nt">var</span><span class="o">(</span><span class="nt">--bdw</span><span class="o">)</span> <span class="err">0</span><span class="o">;</span>
<span class="nt">border-end-start-radius</span><span class="o">:</span> <span class="nt">var</span><span class="o">(</span><span class="nt">--bdrs</span><span class="o">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><strong>Why is that?</strong> If you're working on a site with a <em>right-to-left</em> text-direction (<code>dir="rtl"</code>), everything will look weird, if you use properties that include <code>left</code> or <code>right</code> in the name (such as <code>padding-left</code>).</p>

<p>With logical properties, everything will look fine, when you switch text-direction:</p>

<p><a href="assets/1869451/93501da8.jpg" class="article-body-image-wrapper"><img src="assets/1869451/93501da8.jpg" alt="RTL" loading="lazy" width="800" height="1520"></a></p>

<p>How cool is that! Now, let's add some more columns:</p>

<p><a href="assets/1869451/6b5e4423.jpg" class="article-body-image-wrapper"><img src="assets/1869451/6b5e4423.jpg" alt="Full" loading="lazy" width="800" height="662"></a></p>

<p>Notice how the "final round dot" automatically moves to the last column!</p>

<p>And that wraps up this tutorial.</p>
