			<h1>Tetris Testimonial Quotes</h1>
			<p>Had a bit of fun last night with this week's <em>Codepen Challenge</em>.</p>

<p>I had no ideas for the topic — <em>Testimonial Quotes</em> — but then I noticed my wife playing Tetris on an ancient GameBoy, completely absorbed 😁</p>

<p>I fired up a <em>CSS Grid</em> with 7 columns and 14 rows. A real Tetris game has 10×20, but it would be too cramped on mobile devices.</p>

<p>I added colors, and a bunch of micro-classes that span columns and rows:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.cs1</span> <span class="p">{</span> <span class="nl">grid-column</span><span class="p">:</span> <span class="n">span</span> <span class="m">1</span><span class="p">;</span> <span class="p">}</span>
<span class="nc">.cs2</span> <span class="p">{</span> <span class="nl">grid-column</span><span class="p">:</span> <span class="n">span</span> <span class="m">2</span><span class="p">;</span> <span class="p">}</span>
<span class="nc">.cs3</span> <span class="p">{</span> <span class="nl">grid-column</span><span class="p">:</span> <span class="n">span</span> <span class="m">3</span><span class="p">;</span> <span class="p">}</span>
<span class="nc">.cs4</span> <span class="p">{</span> <span class="nl">grid-column</span><span class="p">:</span> <span class="n">span</span> <span class="m">4</span><span class="p">;</span> <span class="p">}</span>
<span class="nc">.rs2</span> <span class="p">{</span> <span class="nl">grid-row</span><span class="p">:</span> <span class="n">span</span> <span class="m">2</span><span class="p">;</span> <span class="p">}</span>
<span class="nc">.rs3</span> <span class="p">{</span> <span class="nl">grid-row</span><span class="p">:</span> <span class="n">span</span> <span class="m">3</span><span class="p">;</span> <span class="p">}</span>
<span class="nc">.rs4</span> <span class="p">{</span> <span class="nl">grid-row</span><span class="p">:</span> <span class="n">span</span> <span class="m">4</span><span class="p">;</span> <span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And then — in the markup — just a bunch of <code>&lt;b&gt;</code>-tags (for <strong>b</strong>lock!):<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;b</span> <span class="na">class=</span><span class="s">"rs4 blue"</span><span class="nt">&gt;&lt;/b&gt;</span>
<span class="nt">&lt;b</span> <span class="na">class=</span><span class="s">"rs3 cyan"</span><span class="nt">&gt;&lt;/b&gt;</span>
<span class="nt">&lt;b</span> <span class="na">class=</span><span class="s">"cs1 cyan"</span><span class="nt">&gt;&lt;/b&gt;</span>
<span class="nt">&lt;b</span> <span class="na">class=</span><span class="s">"cs4 yellow"</span><span class="nt">&gt;</span>
<span class="c">&lt;!-- etc. --&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>For the quotes, I used <code>&lt;q&gt;</code> and <code>&lt;cite&gt;</code>-tags, occasionally adding a different <code>writing-mode</code> for vertical text:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.vtxt</span> <span class="p">{</span>
  <span class="nl">text-orientation</span><span class="p">:</span> <span class="n">mixed</span><span class="p">;</span>
  <span class="nl">writing-mode</span><span class="p">:</span> <span class="n">vertical-rl</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>All <code>font-size</code>s are using <code>clamp</code>, so they scale nicely, as in:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">q</span> <span class="p">{</span>
  <span class="nl">font-size</span><span class="p">:</span> <span class="n">clamp</span><span class="p">(</span><span class="m">0.875rem</span><span class="p">,</span> <span class="m">-0.2045rem</span> <span class="err">+</span> <span class="m">5.3977vw</span><span class="p">,</span> <span class="m">3.25rem</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

<p>Another way of doing that, would be with one of the <code>container</code>-units, such as <code>cqi</code>.</p>
