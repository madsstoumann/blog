		<article>
			<h1>Table Designer</h1>
			<p>I've been working on a <em>Generic Table Designer</em>-tool on and off for almost a year. It's not something I've prioritized that much — a few hours per month. </p>

<p>I wanted to create a component, where the <em>configuration</em> is just a bunch of keywords in a <code>data-table</code>-attribute, <em>example:</em><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;table</span> <span class="na">data-table=</span><span class="s">"border col-lines row-zebra shadow editable etc."</span><span class="nt">&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Then, in CSS, I'll use the same list of attributes for styling, using the <em>contains</em>-selector:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">[</span><span class="nt">data-table</span><span class="o">*=</span><span class="s1">"row-zebra"</span><span class="o">]</span> <span class="nt">tr</span><span class="nd">:nth-child</span><span class="o">(</span><span class="nt">even</span><span class="o">)</span> <span class="nt">td</span> <span class="p">{</span>
  <span class="py">--td-bgc</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--zebra-row</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>In JavaScript, I use <code>includes()</code> to check for the keys needed, <em>example:</em><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">editable</span> <span class="o">=</span> <span class="nx">table</span><span class="p">.</span><span class="nx">dataset</span><span class="p">.</span><span class="nf">includes</span><span class="p">(</span><span class="dl">'</span><span class="s1">editable</span><span class="dl">'</span><span class="p">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The color-palette of a table is generated from a single custom property, <code>--h</code>, which is the <em>hue</em> in <code>hsl()</code>. Using different <em>saturation</em> and <em>lightness</em>-values to <em>shade</em> or <em>tint</em> the root color, we can easily create tables with different look'n'feel:</p>

<p><em>From this:</em><br>
<a href="assets/610806/890977ef.jpg" class="article-body-image-wrapper"><img src="assets/610806/890977ef.jpg" alt="127.0.0.1_5500_docs_table_index.html (3)" loading="lazy" width="800" height="340"></a></p>

<p><em>To this:</em><br>
<a href="assets/610806/012fb712.jpg" class="article-body-image-wrapper"><img src="assets/610806/012fb712.jpg" alt="127.0.0.1_5500_docs_table_index.html (2)" loading="lazy" width="800" height="344"></a></p>

<p><em>Or this:</em><br>
<a href="assets/610806/062d6d30.jpg" class="article-body-image-wrapper"><img src="assets/610806/062d6d30.jpg" alt="127.0.0.1_5500_docs_table_index.html (1)" loading="lazy" width="800" height="341"></a></p>

<hr>

<p>I'm not done with the JavaScript — I'm only working on this in my spare-time! — but when it's ready, it will add keyboard-navigation, sorting, <a href="https://codepen.io/stoumann/pen/poNjMJV" target="_blank" rel="noopener noreferrer">column resizing</a>, column toggle on/off, search/filtering, pagination, table-data from an endpoint, export to csv — and much more. It will also be possible to edit cells.</p>

<p>For now, the CSS-version is (almost) done. I've uploaded the initial version to Codepen, where you can play around with the various options, using a simple editor-interface. I've included some "presets" as well, to get you started.</p>

<p><a href="assets/610806/ad9538c0.jpg" class="article-body-image-wrapper"><img src="assets/610806/ad9538c0.jpg" alt="image" loading="lazy" width="800" height="445"></a></p>

</iframe>
</p>

<p>Let me know what you think! Should I create a repo for this? Any features missing?</p>

<p>Thanks for reading!</p>
