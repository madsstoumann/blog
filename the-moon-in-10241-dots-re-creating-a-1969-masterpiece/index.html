		<article>
			<h1>The Moon in 10241 Dots — Re-creating a 1969 Masterpiece</h1>
			<p>In 1969, German artist Max Ernst created a beautiful painting in celebration of the Moon-landing:</p>

<p><a href="assets/1536117/7f7566f1.jpg" class="article-body-image-wrapper"><img src="assets/1536117/7f7566f1.jpg" alt="Original Poster" loading="lazy" width="800" height="1120"></a></p>

<p>Entitled <em>Naissance d'une Galaxie</em> (Birth of a Galaxy), I can imagine it must've taken <strong>months</strong> to complete, using stencils for all the dots. </p>

<p>Luckily, we can code it much faster!</p>


<hr>

<h2>
  <a name="radial-gradient" href="#radial-gradient">
  </a>
  Radial Gradient
</h2>

<p>First, we need a background-layer with a radial background:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">main</span> <span class="p">{</span>
  <span class="nl">background</span><span class="p">:</span> <span class="m">#06101D</span> <span class="n">radial-gradient</span><span class="p">(</span>
    <span class="m">#245898</span><span class="p">,</span> 
    <span class="m">#2C67AB</span><span class="p">,</span> 
    <span class="m">#244D7A</span> <span class="m">15%</span><span class="p">,</span> 
    <span class="m">#475F66</span><span class="p">,</span> 
    <span class="m">#93A7A2</span> <span class="m">65%</span><span class="p">,</span> 
    <span class="m">#234E85</span> <span class="m">66%</span><span class="p">,</span> 
    <span class="m">#06101D</span> <span class="m">70%</span>
  <span class="p">)</span> <span class="nb">no-repeat</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>

</svg>

</div>
</div>
</div>



<p><a href="assets/1536117/ad5838ab.jpg" class="article-body-image-wrapper"><img src="assets/1536117/ad5838ab.jpg" alt="Radial Gradient" loading="lazy" width="800" height="802"></a></p>


<hr>

<h2>
  <a name="fluffy-clouds-filter" href="#fluffy-clouds-filter">
  </a>
  Fluffy Clouds Filter
</h2>

<p>We need some "fluffy clouds" to simulate the painted layers, so we'll use the "fluffy" filter from my CSS Filter Editor:</p>

<p><iframe height="600" src="https://codepen.io/stoumann/embed/MWeNmyb?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
</p>

<p>We add an <code>::after</code>-pseudo-element to the same layer as the radial background, inheriting that same background, but also using the "fluffy"-filter:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">main</span> <span class="p">{</span>
  <span class="err">&amp;::after</span> <span class="err">{</span>
    <span class="nl">background</span><span class="p">:</span> <span class="nb">inherit</span><span class="p">;</span>
    <span class="py">mix-blend-mode</span><span class="p">:</span> <span class="n">hard-light</span><span class="p">;</span>
    <span class="nl">content</span><span class="p">:</span> <span class="s1">""</span><span class="p">;</span>
    <span class="nl">display</span><span class="p">:</span> <span class="nb">block</span><span class="p">;</span>
    <span class="nl">filter</span><span class="p">:</span> <span class="sx">url(#fluffy)</span> <span class="n">blur</span><span class="p">(</span><span class="m">5px</span><span class="p">);</span> 
    <span class="py">inset</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
    <span class="nl">opacity</span><span class="p">:</span> <span class="m">0.33</span><span class="p">;</span>
    <span class="nl">position</span><span class="p">:</span> <span class="nb">absolute</span><span class="p">;</span>
  <span class="p">}</span>
<span class="err">}</span>
</code></pre>

<p>And now we have:</p>

<p><a href="assets/1536117/043ecccb.jpg" class="article-body-image-wrapper"><img src="assets/1536117/043ecccb.jpg" alt="Fluffy Filter" loading="lazy" width="800" height="802"></a></p>


<hr>

<h2>
  <a name="markup" href="#markup">
  </a>
  Markup
</h2>

<p>Before we continue with the dots, let's add an SVG-element in the markup — we'll add the <code>innerHTML</code> later:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;svg</span> <span class="na">viewBox=</span><span class="s">"0 0 1000 1000"</span> <span class="na">class=</span><span class="s">"moon"</span><span class="nt">&gt;&lt;/svg&gt;</span>
</code></pre>

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>

<hr>

<h2>
  <a name="dots" href="#dots">
  </a>
  Dots
</h2>

<p>To hardcode the dots would probably take as long time as the original painting, so let's use JavaScript and some Math to help us out!</p>

<p>To start with, we need a function, <code>dots()</code>, with a configuration-object:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">function</span> <span class="nf">dots</span><span class="p">(</span><span class="nx">config</span> <span class="o">=</span>
  <span class="p">{</span>
    <span class="na">dotsring</span><span class="p">:</span> <span class="mi">8</span><span class="p">,</span>
    <span class="na">dotsize</span><span class="p">:</span> <span class="mi">3</span><span class="p">,</span>
    <span class="na">radius</span><span class="p">:</span> <span class="mi">2</span><span class="p">,</span>
    <span class="na">rings</span><span class="p">:</span> <span class="mi">50</span><span class="p">,</span>
    <span class="na">rotate</span><span class="p">:</span> <span class="mi">6</span><span class="p">,</span>
    <span class="na">spread</span><span class="p">:</span> <span class="mi">10</span><span class="p">,</span>
    <span class="na">x</span><span class="p">:</span> <span class="mi">1000</span><span class="p">,</span>
    <span class="na">y</span><span class="p">:</span> <span class="mi">1000</span>
  <span class="p">})</span> <span class="p">{</span>
  <span class="p">...</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Explainer:</p>

<ul>
<li>
<strong>dotsring.</strong> Dots per ring. This number is added to each new ring.</li>
<li>
<strong>dotsize.</strong> The relative dotsize (see SVG <code>viewBox</code>)</li>
<li>
<strong>radius.</strong> The start radius-index. In this case, we want to skip the first one, creating a larger "hole" in the center of the moon.</li>
<li>
<strong>rings.</strong> The total amount of rings</li>
<li>
<strong>rotate.</strong> Amount to rotate each ring</li>
<li>
<strong>spread.</strong> The distance between the dots in a ring</li>
<li>
<strong>x.</strong> The <code>viewBox</code> x-width of the SVG.</li>
<li>
<strong>y.</strong> The <code>viewBox</code> y-width of the SVG.</li>
</ul>

<p>Next, we need arrays of coordinates for each ring. For that, we need a small helper-method:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">coords</span> <span class="o">=</span> <span class="p">(</span><span class="nx">number</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">frags</span> <span class="o">=</span> <span class="mi">360</span> <span class="o">/</span> <span class="nx">number</span>
  <span class="k">return</span> <span class="nb">Array</span><span class="p">.</span><span class="k">from</span><span class="p">({</span> <span class="na">length</span><span class="p">:</span> <span class="nx">number</span> <span class="o">+</span> <span class="mi">1</span> <span class="p">},</span> 
  <span class="p">(</span><span class="nx">_</span><span class="p">,</span> <span class="nx">i</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="p">(</span><span class="nx">frags</span> <span class="o">/</span> <span class="mi">180</span><span class="p">)</span> <span class="o">*</span> <span class="nx">i</span> <span class="o">*</span> <span class="nb">Math</span><span class="p">.</span><span class="nx">PI</span><span class="p">)</span>
<span class="p">}</span>
</code></pre>

</svg>

</div>

<hr>

<h3>
  <a name="fill" href="#fill">
  </a>
  Fill
</h3>

<p>If you inspect the original painting, you'll notice that most of the dots have the same, light-yellow color. A few, random dots are light blue or lavender. </p>

<p>To help us fill-in random dots with these values, we need a random-method:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">random</span> <span class="o">=</span> <span class="p">(</span><span class="nx">min</span><span class="p">,</span> <span class="nx">max</span><span class="p">)</span> <span class="o">=&gt;</span>
  <span class="nb">Math</span><span class="p">.</span><span class="nf">floor</span><span class="p">(</span><span class="nb">Math</span><span class="p">.</span><span class="nf">random</span><span class="p">()</span> <span class="o">*</span> <span class="p">(</span><span class="nx">max</span> <span class="o">-</span> <span class="nx">min</span><span class="p">)</span> <span class="o">+</span> <span class="nx">min</span><span class="p">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>

</svg>

</div>
</div>
</div>



<p>... and a <code>fill()</code>-method, where we parse-in the current dot-<code>index</code> as <code>number</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">fill</span> <span class="o">=</span> <span class="p">(</span><span class="nx">number</span><span class="p">)</span> <span class="o">=&gt;</span>
  <span class="p">[</span><span class="dl">'</span><span class="s1">#74BAA0</span><span class="dl">'</span><span class="p">,</span> <span class="dl">'</span><span class="s1">#B3A0C1</span><span class="dl">'</span><span class="p">][</span><span class="nx">number</span> <span class="o">%</span> <span class="nf">random</span><span class="p">(</span><span class="mi">1</span><span class="p">,</span> <span class="mi">100</span><span class="p">)]</span> <span class="o">||</span>
  <span class="dl">'</span><span class="s1">#BCD2A9</span><span class="dl">'</span><span class="p">;</span>
</code></pre>

<hr>

<h3>
  <a name="rendering-the-dots" href="#rendering-the-dots">
  </a>
  Rendering the dots
</h3>

<p>To render the dots, we need <strong>two</strong> loops: </p>

<ul>
<li><p>One for the rings. For each ring, we output a <code>&lt;g&gt;</code>-element, to <code>&lt;g&gt;</code>roup all the dots within a ring.</p></li>
<li><p>One for the dots <em>within</em> a single ring. In this inner loop, we calculate the <code>x</code> and <code>y</code> position of each dot from the coordinates we created using <code>coords()</code>. </p></li>
</ul>

<p>After that, we simply output a <code>&lt;circle&gt;</code> for each entry.<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">let</span> <span class="nx">s</span> <span class="o">=</span> <span class="dl">''</span><span class="p">;</span>
<span class="k">for </span><span class="p">(</span><span class="kd">let</span> <span class="nx">i</span> <span class="o">=</span> <span class="nx">config</span><span class="p">.</span><span class="nx">radius</span><span class="p">;</span> <span class="nx">i</span> <span class="o">&lt;=</span> <span class="nx">config</span><span class="p">.</span><span class="nx">rings</span><span class="p">;</span> <span class="nx">i</span><span class="o">++</span><span class="p">)</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">r</span> <span class="o">=</span> <span class="nx">config</span><span class="p">.</span><span class="nx">spread</span> <span class="o">*</span> <span class="nx">i</span><span class="p">;</span>
  <span class="kd">const</span> <span class="nx">ring</span> <span class="o">=</span> <span class="nf">coords</span><span class="p">(</span><span class="nx">config</span><span class="p">.</span><span class="nx">dotsring</span> <span class="o">*</span> <span class="nx">i</span><span class="p">);</span>
  <span class="nx">s</span> <span class="o">+=</span> <span class="s2">`&lt;g style="--r:</span><span class="p">${</span><span class="nx">i</span> <span class="o">*</span> <span class="nx">config</span><span class="p">.</span><span class="nx">rotate</span><span class="p">}</span><span class="s2">deg"&gt;</span><span class="p">${</span><span class="nx">ring</span>
    <span class="p">.</span><span class="nf">map</span><span class="p">((</span><span class="nx">value</span><span class="p">,</span> <span class="nx">index</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="p">{</span>
      <span class="kd">const</span> <span class="nx">x</span> <span class="o">=</span>
        <span class="nx">config</span><span class="p">.</span><span class="nx">x</span> <span class="o">/</span> <span class="mi">2</span> <span class="o">-</span> <span class="nb">Math</span><span class="p">.</span><span class="nf">round</span><span class="p">(</span><span class="nx">r</span> <span class="o">*</span> <span class="nb">Math</span><span class="p">.</span><span class="nf">cos</span><span class="p">(</span><span class="nx">value</span><span class="p">));</span>
      <span class="kd">const</span> <span class="nx">y</span> <span class="o">=</span>
        <span class="nx">config</span><span class="p">.</span><span class="nx">y</span> <span class="o">/</span> <span class="mi">2</span> <span class="o">-</span> <span class="nb">Math</span><span class="p">.</span><span class="nf">round</span><span class="p">(</span><span class="nx">r</span> <span class="o">*</span> <span class="nb">Math</span><span class="p">.</span><span class="nf">sin</span><span class="p">(</span><span class="nx">value</span><span class="p">));</span>
      <span class="k">return</span> <span class="s2">`&lt;circle cx="</span><span class="p">${</span><span class="nx">x</span><span class="p">}</span><span class="s2">" cy="</span><span class="p">${</span><span class="nx">y</span><span class="p">}</span><span class="s2">" r="</span><span class="p">${</span>
        <span class="nx">config</span><span class="p">.</span><span class="nx">dotsize</span>
      <span class="p">}</span><span class="s2">" fill="</span><span class="p">${</span><span class="nf">fill</span><span class="p">(</span><span class="nx">i</span> <span class="o">+</span> <span class="nx">index</span><span class="p">)}</span><span class="s2">" /&gt;`</span><span class="p">;</span>
    <span class="p">})</span>
    <span class="p">.</span><span class="nf">join</span><span class="p">(</span><span class="dl">''</span><span class="p">)}</span><span class="s2">&lt;/g&gt;`</span><span class="p">;</span>
<span class="p">}</span>
<span class="k">return</span> <span class="nx">s</span><span class="p">;</span>
</code></pre>

<p>Let's add that output to the SVG-element, we created earlier:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nb">document</span><span class="p">.</span><span class="nf">querySelector</span><span class="p">(</span><span class="dl">'</span><span class="s1">.moon</span><span class="dl">'</span><span class="p">).</span><span class="nx">innerHTML</span> <span class="o">=</span> <span class="nf">dots</span><span class="p">()</span>

<p>... and voilà:</p>

<p><a href="assets/1536117/77d6b609.jpg" class="article-body-image-wrapper"><img src="assets/1536117/77d6b609.jpg" alt="Dots" loading="lazy" width="800" height="802"></a></p>

<blockquote>
<p><strong>Could this be done in CSS instead of SVG?</strong>. <br>
Yes, using <code>sin()</code> and <code>cos()</code> in CSS, this is definitely possible. I just find it easier to work with SVG and it's <code>viewBox</code> when working with such large "datasets" as this.</p>
</blockquote>


<hr>

<h2>
  <a name="combining-the-layers" href="#combining-the-layers">
  </a>
  Combining the Layers
</h2>

<p>Let's combine the dots with the radial, fluffy-clouds-background:</p>

<p><a href="assets/1536117/731a13d7.jpg" class="article-body-image-wrapper"><img src="assets/1536117/731a13d7.jpg" alt="Combining" loading="lazy" width="800" height="802"></a></p>

<p>And we're done! ... but what about the lower part of the painting — below the Moon? </p>

<p>I tried using the <code>drops</code>-filter (from the CSS Filter Editor above) and a bunch of overlaying gradients, but simply couldn't get the right "look and feel". </p>


<hr>

<h2>
  <a name="adding-poster-texts" href="#adding-poster-texts">
  </a>
  Adding Poster Texts
</h2>

<p>Let's turn the painting into a poster, and add some texts.</p>

<p>We'll use <code>cqi</code>-units for the texts, so they scale nicely to the width of our poster:</p>

<p><a href="assets/1536117/e9820ed9.jpg" class="article-body-image-wrapper"><img src="assets/1536117/e9820ed9.jpg" alt="Poster Text" loading="lazy" width="800" height="918"></a></p>


<hr>

<h2>
  <a name="framing-the-poster" href="#framing-the-poster">
  </a>
  Framing the Poster
</h2>

<p>Posters look better in frames, so let's add a nice wooden frame! </p>

<p>CSS has a <code>border-style</code> called <code>ridge</code> which does the job — so with:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">body</span> <span class="p">{</span>
  <span class="nl">border</span><span class="p">:</span> <span class="m">1</span><span class="n">cqi</span> <span class="nb">ridge</span> <span class="m">#D39E85</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>— we get: </p>

<p><a href="assets/1536117/50b57ad0.jpg" class="article-body-image-wrapper"><img src="assets/1536117/50b57ad0.jpg" alt="Poster with frame" loading="lazy" width="800" height="928"></a></p>


<hr>

<h2>
  <a name="wallpaper" href="#wallpaper">
  </a>
  Wallpaper
</h2>

<p>Finally, it's time to hang our framed poster on a wall. </p>

<p>Let's add a wallpaper from <a href="https://css-pattern.com/" target="_blank" rel="noopener noreferrer">CSS Patterns</a> to the <code>&lt;html&gt;</code>-element — and a <code>box-shadow</code> to the <code>&lt;body&gt;</code>-element:</p>

<p><a href="assets/1536117/6b07773f.jpg" class="article-body-image-wrapper"><img src="assets/1536117/6b07773f.jpg" alt="Wallpaper" loading="lazy" width="800" height="1148"></a></p>

<p>Beautiful, isn't it? Hope your CPU could manage the 10241 dots!</p>
