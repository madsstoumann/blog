			<h1>Thinking in modules</h1>
			<p>I think, inheriting code from other developers, can be a struggle. There, I said it!<br />
That&#8217;s because not two developers think alike &mdash; everyone has his or hers way of doing things.</p>
<p>Having said that, here&#8217;s my personal take on how to tackle code-share between (front-end-) developers:</p>
<p><strong>Think in modules.</strong></p>
<p>No matter what you create on a site, being it an article, an accordion-, spot- or a video-block, think of it as an individual module, with it&#8217;s own version number and &#8220;module-like&#8221; structure:</p>
<pre class="brush: xml; title: ; notranslate" title="">
&lt;!-- Accordion Block. Version 1.2.5 --&gt;
&lt;section class=&quot;accordion&quot;&gt;
	&lt;h2 class=&quot;accordion-header&quot;&gt;
		Accordion header
	&lt;/h2&gt;
	
	&lt;div itemscope itemtype=&quot;http://schema.org/Question&quot;&gt;
		&lt;input type=&quot;radio&quot; class=&quot;state&quot; id=&quot;id1&quot; name=&quot;grp_accordion&quot; /&gt;
		&lt;label for=&quot;id1&quot; class=&quot;accordion-label&quot; itemprop=&quot;text&quot; accesskey=&quot;1&quot;&gt;
			&lt;span class=&quot;accordion-label-inner&quot;&gt;Question 1&lt;/span&gt;
		&lt;/label&gt;
		&lt;div class=&quot;accordion-panel&quot; itemprop=&quot;suggestedAnswer acceptedAnswer&quot; itemscope itemtype=&quot;http://schema.org/Answer&quot;&gt;
			&lt;div class=&quot;accordion-panel-text&quot; itemprop=&quot;text&quot;&gt;
				Text
			&lt;/div&gt;
		&lt;/div&gt;
	&lt;/div&gt;

	&lt;div itemscope itemtype=&quot;http://schema.org/Question&quot;&gt;
		&lt;input type=&quot;radio&quot; class=&quot;state&quot; id=&quot;id2&quot; name=&quot;grp_accordion&quot; /&gt;
		&lt;label for=&quot;id2&quot; class=&quot;accordion-label&quot; itemprop=&quot;text&quot; accesskey=&quot;2&quot;&gt;
			&lt;span class=&quot;accordion-label-inner&quot;&gt;Question 2&lt;/span&gt;
		&lt;/label&gt;
		&lt;div class=&quot;accordion-panel&quot; itemprop=&quot;suggestedAnswer acceptedAnswer&quot; itemscope itemtype=&quot;http://schema.org/Answer&quot;&gt;
			&lt;div class=&quot;accordion-panel-text&quot; itemprop=&quot;text&quot;&gt;
				Text
			&lt;/div&gt;
		&lt;/div&gt;
	&lt;/div&gt;
&lt;/section&gt;	
</pre>
<p>If any of the markup change, change the version-number, so you know which existing implementations of the module would have to be updated as well.</p>
<p>Use a <a href="https://css-tricks.com/snippets/sass/bem-mixins/" target="_blank">BEM</a>-like structure for the markup &mdash; there are various versions, I prefer the simple version, using hyphens for elements.</p>
<p>Assign classes to <em>everything!</em> Even though it may be cumbersome to add the class<em> accordion-header</em> to the <em>h2-element</em>, because you want all <em>h2</em>-elements on your site to be the same, do it anyway. It will save you a lot of headaches in the future (when the marketing-department want all h2&#8217;s in the accordion-block to be blue, and all h2&#8217;s in the video-block to be red!)!</p>
<p>Make sure that the HTML is rock-solid and <em>validates:</em> both the <a href="http://validator.w3.org/" target="_blank">HTML itself</a>, but also the <a href="https://developers.google.com/structured-data/testing-tool/" target="_blank">structured markup</a>.</p>
<p>Next, create a SASS mixin with the same (BEM-) structure as the HTML:</p>
<pre class="brush: css; title: ; notranslate" title="">
@mixin accordion($theme: $accordion) {
  &amp;-header {
    ...
  } 
  &amp;-label {
    ...
  }
</pre>
<p>Use <a href="http://sassdoc.com/" target="_blank">sassDOC</a> to document the mixin, provide version-number, examples etc:</p>
<pre class="brush: css; title: ; notranslate" title="">
/// Accordion-module, can either toggle (by using checkboxes in the HTML) or collapse (by using radio-buttons)
/// - Version 1.2.5
/// - Date last edited: 2016-04-07
/// @name accordion
/// @group blocks
/// @author Mads Stoumann
/// @param {String} $theme [$accordion]- The theme-map to use
/// @output class-module
/// @link http://www.stoumann.dk/blocks/accordion.html Demo
/// @example scss
///   .accordion ( @include accordion(); )
</pre>
<h2>Theme-maps</h2>
<p>Did you notice the default <strong>$theme</strong>-parameter in the mixin? In this case, it expects a theme-map called <em>$accordion</em>.</p>
<p>A theme-object could look like this:</p>
<pre class="brush: css; title: ; notranslate" title="">
$accordion: (
	&quot;border-color&quot;: #aaa,
	&quot;font-map&quot;: 0,
	&quot;label-background&quot;: linear-gradient(to bottom, #ddd, #eee),
	&quot;label-color&quot;: #333,
	&quot;label-font-size&quot;: 1.125em,
	&quot;padding&quot;: 1em,
	&quot;panel-max-height&quot;: 50em,
	&quot;text-background&quot;: &quot;#fff&quot;,
	&quot;text-color&quot;: &quot;#222&quot;,
	&quot;toggle-contract&quot;: &quot;\2212&quot;,
	&quot;toggle-expand&quot;: &quot;&#092;&#048;02B&quot;,
	&quot;toggle-font-family&quot;: &quot;Roboto, sans-serif&quot;,
	&quot;toggle-font-size&quot;: 2em,
	&quot;toggle-position&quot;: right
);
</pre>
<p>To access one of the values from the theme-map, use the <em>map-get</em> function:</p>
<pre class="brush: css; title: ; notranslate" title="">
  border: 1px solid map-get($theme, &quot;border-color&quot;);
  background: map-get($theme, &quot;label-background&quot;);
</pre>
<p>Create as many key/value-pairs as necessary for the theme-map, and finally, create a class that calls the mixin:</p>
<pre class="brush: css; title: ; notranslate" title="">
.accordion { @include accordion(); }
</pre>
<p>You can then experiment with an alternate theme-map, let&#8217;s call it <em>$custom-accordion</em>, and call it like this:</p>
<pre class="brush: css; title: ; notranslate" title="">
.accordion { @include accordion($custom-accordion); }
</pre>
<p>And if you want <em>both</em> versions on your site:</p>
<pre class="brush: css; title: ; notranslate" title="">
.accordion { 
  @include accordion();
  .custom-accordion &amp; { @include accordion($custom-accordion); }
}
</pre>
<p>In the HTML, prefix or suffix the first selector with the custom class:</p>
<pre class="brush: xml; title: ; notranslate" title="">
&lt;section class=&quot;accordion custom-accordion&quot;&gt; ...
</pre>
<h2>Font-maps</h2>
<p>To create even more flexible modules, use them with a <em>font-map</em>. </p>
<p>It&#8217;s basically which <em>root font-size</em> to use per <em>media query</em>.</p>
<p>If your breakpoints look like this:</p>
<pre class="brush: css; title: ; notranslate" title="">
/// @name breakpoints
/// @group config
$breakpoints: (
	&quot;phone&quot;			: 0,
	&quot;phablet&quot;		: 640px,
	&quot;tablet&quot;		: 768px,
	&quot;desktop&quot;		: 1024px,
	&quot;desktop-large&quot;	: 1280px,
	&quot;desktop-xlarge&quot;: 1600px
) !default;
</pre>
<p>&mdash; Your default font-map might look like this:</p>
<pre class="brush: css; title: ; notranslate" title="">
/// @name fontrootsizes
/// @group config
$fontrootsizes: (
	&quot;phone&quot;			: 13px,
	&quot;phablet&quot;		: 14px,
	&quot;tablet&quot;		: 15px,
	&quot;desktop&quot;		: 16px,
	&quot;desktop-large&quot;	: 17px,
	&quot;desktop-xlarge&quot;: 18px
) !default;
</pre>
<p>&mdash; so in &#8220;phone&#8221;-mode, in this case, the <em>root font-size</em> will be<strong> 13px</strong>.</p>
<p>Now, if you set your font-sizes in <em>em</em> within the mixin, let&#8217;s say the accordion-header:</p>
<pre class="brush: css; title: ; notranslate" title="">
...
&amp;-header { font-size: 2em; }
...
</pre>
<p>&mdash; The size will dynamically resize or shrink based on the root-sizes. In &#8220;phone-mode&#8221; it will be <strong>26px</strong>, in &#8220;tablet-mode&#8221; it will be <strong>30px</strong>.</p>
<h2>Finally &hellip;</h2>
<p>Now, when sending the code to other developers &mdash; <em>hopefully</em> &mdash; all they have to work on will be theme-maps!</p>
<p>But even if they <em>do</em> change the HTML or the associated mixin, it will be with a different version-number &mdash; but hopefully backwards-compatible with existing implementations.</p>
<p>I personally think, that if you <em>think in modules</em>, the code you create will be more re-usable and easier to read, because it forces you to approach the HTML and (S)CSS in a different way.</p>
<p>Happy coding!</p>
