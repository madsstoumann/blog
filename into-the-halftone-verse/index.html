			<h1>Into The Halftone-Verse</h1>
			<p>About a month ago, I finally watched “Spider-Man: Into The Spider-Verse” with my son (who had seen it multiple times). Wow! What a great new take on animation, and what a wild storyline.</p>

<p>A few days later, my son played around with a CSS <code>filter</code>-editor, I’d been working on (to use it, see it on Codepen in <a href="https://codepen.io/stoumann/full/MWeNmyb" target="_blank" rel="noopener noreferrer"><strong>Full Screen</strong></a>):</p>

<p><iframe height="600" src="https://codepen.io/stoumann/embed/MWeNmyb?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
</p>

<p>Especially the “hue”-rotate function grabbed his attention:<br>
“Wow, dad, if only you could have these big dots from Spider-Man as well!” </p>

<p>By “big dots” he meant halftones, and they’re used <strong>a lot</strong> in “Spider-Man: Into The Spider-Verse”, as well as any old comic-book you can get hold of. </p>

<p>When I was his age, I drew comics all the time. <br>
For shades, I’d use sheets of halftones with different dot-sizes and densities. I don’t think you can buy these anymore!</p>

<p>Later on, I published a fanzine about comics — and for the covers, I used halftones for generating colour-effects. As an example: For light green, you’d use solid cyan with halftones of yellow, turned x amount of degrees:</p>

<p><a href="assets/546368/d7e0e135.jpg" class="article-body-image-wrapper"><img src="assets/546368/d7e0e135.jpg" alt="Light green" loading="lazy" width="800" height="226"></a></p>

<p>As I recall, there were books with info about how you’d create most colours, using solids and halftones of different sizes and densities … and degrees.</p>

<p>For printing you used — and still use — Cyan, Magenta, Yellow and blacK, known as CMYK. <br>
The <em>order</em>, in which the colours are printed, is often YMCK (almost like the song), that is, the lighter colours first. </p>

<p>So … to give my son the “big dots”, I wasted one rainy Sunday creating a "Halftone Editor", allowing you to create comic-like patterns like these:</p>

<p><a href="assets/546368/c0bd24ac.jpg" class="article-body-image-wrapper"><img src="assets/546368/c0bd24ac.jpg" alt="Pattern 1!" loading="lazy" width="800" height="452"></a></p>

<p><a href="assets/546368/c98d992b.jpg" class="article-body-image-wrapper"><img src="assets/546368/c98d992b.jpg" alt="Pattern 2!" loading="lazy" width="800" height="475"></a></p>

<p><a href="assets/546368/c85a7a7c.jpg" class="article-body-image-wrapper"><img src="assets/546368/c85a7a7c.jpg" alt="Pattern 3" loading="lazy" width="800" height="448"></a></p>

<p>To try it/create your own patterns, follow this (full-screen!) <a href="https://codepen.io/stoumann/full/PoGPmPm" target="_blank" rel="noopener noreferrer">Codepen link</a>.</p>

<p>It’s how you used to create colours back in the days <em>before</em> digital … with a twist.</p>

<p>Thanks for reading!</p>
