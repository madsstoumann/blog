			<h1>Extending Emmet and VS Code — and discovering 415 CSS properties</h1>
			<p>I use Emmet everyday. You might too, without even knowing — it's built-in to VS Code!<br>
When you type <code>bdrs</code>, Emmet magically transforms that to <code>border-radius</code>. Etcetera.</p>

<p><strong>It saves you a lot of typing.</strong></p>

<p>But that’s not the only thing, I use Emmet for. I like to name my <em>custom properties</em> with <strong>component-name</strong> + <strong>emmet-abbrevaiation</strong>, so the property for <code>border-radius</code> for a component called “hero”, will be <code>--hero-bdrs</code>. It keeps the custom property-names short and concise.</p>

<p>Unforunately, Emmet isn't updated regularly — for instance, none of the <strong>logical properties</strong> that are now available in all browsers, are available in Emmet. </p>

<p>In fact, there are almost <strong>200 properties</strong> missing. Luckily, we can easily extend Emmet.</p>

<hr>
<h1>
  <a name="data" href="#data">
  </a>
  Data
</h1>

<p>First, we need some data. Grab Emmet's <a href="https://github.com/emmetio/emmet/blob/master/snippets/css.json" target="_blank" rel="noopener noreferrer">css.json</a>, and MDN's <a href="https://github.com/mdn/data/tree/main/css/properties.json" target="_blank" rel="noopener noreferrer">properties.json</a>.<br>
Place these files locally. We'll use a <code>Promise.all</code> to grab the array of files (we might need more later, so this is a safe way to do it):<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nb">Promise</span><span class="p">.</span><span class="nf">all</span><span class="p">(</span>
  <span class="nx">urls</span><span class="p">.</span><span class="nf">map</span><span class="p">((</span><span class="nx">url</span><span class="p">,</span> <span class="nx">index</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="nf">fetch</span><span class="p">(</span><span class="nx">url</span><span class="p">)</span>
    <span class="p">.</span><span class="nf">then</span><span class="p">(</span><span class="nx">r</span> <span class="o">=&gt;</span> <span class="nx">r</span><span class="p">.</span><span class="nf">json</span><span class="p">())</span>
    <span class="p">.</span><span class="nf">then</span><span class="p">(</span><span class="nx">json</span> <span class="o">=&gt;</span> <span class="p">{</span>
      <span class="kd">const</span> <span class="nx">key</span> <span class="o">=</span> <span class="nx">urls</span><span class="p">[</span><span class="nx">index</span><span class="p">].</span><span class="nf">split</span><span class="p">(</span><span class="dl">'</span><span class="s1">.</span><span class="dl">'</span><span class="p">)[</span><span class="mi">0</span><span class="p">];</span>
      <span class="nx">data</span><span class="p">[</span><span class="nx">key</span><span class="p">]</span> <span class="o">=</span> <span class="nx">json</span><span class="p">;</span>
    <span class="p">})</span>
    <span class="p">.</span><span class="k">catch</span><span class="p">(</span><span class="nx">error</span> <span class="o">=&gt;</span> <span class="p">({</span> <span class="nx">error</span><span class="p">,</span> <span class="nx">url</span> <span class="p">}))</span>
  <span class="p">)</span>
<span class="p">).</span><span class="nf">then</span><span class="p">(()</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="c1">// Stuff here ...</span>
<span class="p">})</span>
</code></pre>

<p>Now, we have access to the data as <code>data.emmet</code> and <code>data.properties</code>.<br>
The data in <code>data.properties</code> is our "master data", as this is a list of <strong>all</strong> CSS properties.<br>
For the Emmet-data, we need to filter out all the "extra stuff" that Emmet provides, and only treat the data which matches a CSS property directly. In other words: we need to filter the data <strong>and</strong> remove old, rendundant stuff like <code>border-bottom-image</code> and <code>overflow-style</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">emmetMap</span> <span class="o">=</span> <span class="k">new</span> <span class="nc">Map</span><span class="p">();</span>
<span class="k">for </span><span class="p">(</span><span class="kd">const</span> <span class="p">[</span><span class="nx">key</span><span class="p">,</span> <span class="nx">value</span><span class="p">]</span> <span class="k">of</span> <span class="nb">Object</span><span class="p">.</span><span class="nf">entries</span><span class="p">(</span><span class="nx">data</span><span class="p">.</span><span class="nx">emmet</span><span class="p">))</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="p">[</span><span class="nx">subkey</span><span class="p">,</span> <span class="nx">subvalue</span><span class="p">]</span> <span class="o">=</span> <span class="nx">value</span><span class="p">.</span><span class="nf">split</span><span class="p">(</span><span class="dl">'</span><span class="s1">:</span><span class="dl">'</span><span class="p">)</span>
  <span class="k">if </span><span class="p">(</span><span class="nx">data</span><span class="p">.</span><span class="nx">properties</span><span class="p">.</span><span class="nf">hasOwnProperty</span><span class="p">(</span><span class="nx">subkey</span><span class="p">))</span> <span class="p">{</span>
    <span class="k">if </span><span class="p">(</span><span class="o">!</span><span class="nx">emmetMap</span><span class="p">.</span><span class="nf">has</span><span class="p">(</span><span class="nx">subkey</span><span class="p">))</span> <span class="nx">emmetMap</span><span class="p">.</span><span class="nf">set</span><span class="p">(</span><span class="nx">subkey</span><span class="p">,</span> <span class="nx">key</span><span class="p">);</span>

  <span class="p">}</span>
  <span class="k">else</span> <span class="p">{</span>
    <span class="k">delete</span> <span class="nx">data</span><span class="p">.</span><span class="nx">emmet</span><span class="p">[</span><span class="nx">key</span><span class="p">];</span>
  <span class="p">}</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

<p>Next, we iterate all CSS properties, and check, if it has a matching Emmet-entry. If not, we'll create our own Emmet-abbreviation based on the property-name.</p>

<p>For that, we split the key by <code>-</code>, so <code>padding-inline-end</code> becomes:<br>
<code>['padding', 'inline', 'end']</code></p>

<p>If the array has a <code>length</code> greater than 0, we'll grab the first letter of each entry, so we'll end up with <code>pie</code>. Yummy, that's a good abbreviation for <code>padding-inline-end</code>!</p>

<p>If the array does <strong>not</strong> have a length, we'll use the 3 first chars instead:<br>
<code>key.slice(0, 3)</code></p>

<p>Before we use the new key, we'll have to check if it exists already:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">values</span> <span class="o">=</span> <span class="nb">Array</span><span class="p">.</span><span class="k">from</span><span class="p">(</span><span class="nx">emmetMap</span><span class="p">.</span><span class="nf">values</span><span class="p">());</span>
<span class="k">if </span><span class="p">(</span><span class="nx">values</span><span class="p">.</span><span class="nf">includes</span><span class="p">(</span><span class="nx">emmetKey</span><span class="p">))</span> <span class="p">{</span> <span class="p">...</span> <span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>

<p>If the key <strong>does</strong> exist already, we'll output it to the <code>console</code>. <br>
So ... we get 14 keys that exist already:</p>

<ul>
<li>
<strong>ac</strong> accent-color</li>
<li>
<strong>bdb</strong> box-decoration-break</li>
<li>
<strong>bd</strong> box-direction</li>
<li>
<strong>cp</strong> clip-path</li>
<li>
<strong>fs</strong> font-smooth</li>
<li>
<strong>fs</strong> font-synthesis</li>
<li>
<strong>mb</strong> margin-block</li>
<li>
<strong>mt</strong> margin-trim</li>
<li>
<strong>mb</strong> mask-border</li>
<li>
<strong>mr</strong> mask-repeat</li>
<li>
<strong>mt</strong> mask-type</li>
<li>
<strong>ml</strong> max-lines</li>
<li>
<strong>pb</strong> padding-block</li>
<li>
<strong>ta</strong> touch-action</li>
</ul>

<p>We <strong>could</strong> write some clever code to generate an alternative Emmet-key, but for such small amount, let's just change them manually, and add them to <code>emmet.json</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="dl">"</span><span class="s2">acc</span><span class="dl">"</span><span class="p">:</span> <span class="dl">"</span><span class="s2">accent-color</span><span class="dl">"</span><span class="p">,</span>
<span class="dl">"</span><span class="s2">bodb</span><span class="dl">"</span><span class="p">:</span> <span class="dl">"</span><span class="s2">box-decoration-break</span><span class="dl">"</span><span class="p">,</span>
<span class="dl">"</span><span class="s2">bxd</span><span class="dl">"</span><span class="p">:</span> <span class="dl">"</span><span class="s2">box-direction</span><span class="dl">"</span><span class="p">,</span>
<span class="dl">"</span><span class="s2">clp</span><span class="dl">"</span><span class="p">:</span> <span class="dl">"</span><span class="s2">clip-path</span><span class="dl">"</span><span class="p">,</span>
<span class="dl">"</span><span class="s2">fsmo</span><span class="dl">"</span><span class="p">:</span> <span class="dl">"</span><span class="s2">font-smooth</span><span class="dl">"</span><span class="p">,</span>
<span class="dl">"</span><span class="s2">fsy</span><span class="dl">"</span><span class="p">:</span> <span class="dl">"</span><span class="s2">font-synthesis</span><span class="dl">"</span><span class="p">,</span>
<span class="dl">"</span><span class="s2">mab</span><span class="dl">"</span><span class="p">:</span> <span class="dl">"</span><span class="s2">margin-block</span><span class="dl">"</span><span class="p">,</span>
<span class="dl">"</span><span class="s2">mat</span><span class="dl">"</span><span class="p">:</span> <span class="dl">"</span><span class="s2">margin-trim</span><span class="dl">"</span><span class="p">,</span>
<span class="dl">"</span><span class="s2">msb</span><span class="dl">"</span><span class="p">:</span> <span class="dl">"</span><span class="s2">mask-border</span><span class="dl">"</span><span class="p">,</span>
<span class="dl">"</span><span class="s2">msr</span><span class="dl">"</span><span class="p">:</span> <span class="dl">"</span><span class="s2">mask-repeat</span><span class="dl">"</span><span class="p">,</span>
<span class="dl">"</span><span class="s2">mty</span><span class="dl">"</span><span class="p">:</span> <span class="dl">"</span><span class="s2">mask-type</span><span class="dl">"</span><span class="p">,</span>
<span class="dl">"</span><span class="s2">mal</span><span class="dl">"</span><span class="p">:</span> <span class="dl">"</span><span class="s2">max-lines</span><span class="dl">"</span><span class="p">,</span>
<span class="dl">"</span><span class="s2">pab</span><span class="dl">"</span><span class="p">:</span> <span class="dl">"</span><span class="s2">padding-block</span><span class="dl">"</span><span class="p">,</span>
<span class="dl">"</span><span class="s2">toa</span><span class="dl">"</span><span class="p">:</span> <span class="dl">"</span><span class="s2">touch-action</span><span class="dl">"</span>
</code></pre>

<p>Let's run the code again, making sure there are <strong>no unknown keys</strong>.<br>
Finally, if it's a <strong>new</strong> Emmet-key, we'll update <code>data.emmet</code> with the new entry:</p>

<p><code>data.emmet[emmetKey] = key</code></p>

<p>And in <code>data.properties</code>, we add a new <code>emmet</code>-entry per property:</p>

<p><code>data.properties[key].emmet = emmetKey</code></p>

<p>Now, just right-click on the object in Dev Tools, and chose "Copy object". You can also use a <a href="https://codepo8.github.io/dearconsole/" target="_blank" rel="noopener noreferrer">console-script</a> to accomplish this. Paste it in your favourite editor (probably VS Code!) and save it.</p>


<hr>

<h2>
  <a name="extending-vs-code" href="#extending-vs-code">
  </a>
  Extending VS Code
</h2>

<p>… And speaking of VS Code. Let’s look into how we can extend the <a href="https://code.visualstudio.com/docs/editor/emmet" target="_blank" rel="noopener noreferrer">Emmet-implementation</a>, so it can use all the new abbreviations, we've created.</p>

<p>Rename the file to <code>snippets.json</code> and add some wrapper objects around the list of properties:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight plaintext"><code>{
  "css": {
    "snippets": {
      "at": "animation-timeline",
      "all": "all",
      "ar": "aspect-ratio",
... etc ...
</code></pre>

<p>I had to add some entries to <code>settings.json</code> in VS Code, in order for it to recognize the new Emmet-snippets:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="dl">"</span><span class="s2">emmet.triggerExpansionOnTab</span><span class="dl">"</span><span class="p">:</span> <span class="kc">true</span><span class="p">,</span>
<span class="dl">"</span><span class="s2">files.associations</span><span class="dl">"</span><span class="p">:</span> <span class="p">{</span><span class="dl">"</span><span class="s2">*css</span><span class="dl">"</span><span class="p">:</span> <span class="dl">"</span><span class="s2">css</span><span class="dl">"</span><span class="p">},</span>
<span class="dl">"</span><span class="s2">emmet.useInlineCompletions</span><span class="dl">"</span><span class="p">:</span> <span class="kc">true</span><span class="p">,</span>
<span class="dl">"</span><span class="s2">emmet.extensionsPath</span><span class="dl">"</span><span class="p">:</span> <span class="p">[</span>
  <span class="dl">"</span><span class="s2">path-to-snippets.json</span><span class="dl">"</span>
<span class="p">]</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
