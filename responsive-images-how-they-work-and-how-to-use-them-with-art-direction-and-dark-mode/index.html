			<h1>Responsive images: How they work – and how to use them with “Art Direction” and “Dark Mode”</h1>
			<p>To create a fast and sustainable website, the top priority is to minimize the amount of assets, mainly images. But responsive images can be tricky, and the syntax complicated. This post will hopefully help you understand them better.</p>


<hr>

<p>On a project I worked on recently, I had the following conversation with a content-editor:  </p>

<p>— “Why can't I change the image [for a component/article] for a given breakpoint?” <br>
— “Oh, but we <em>do</em> already scale the images server-side, and send different resolutions to the client!“<br>
— “No, I want to change to a <em>completely</em> different image!” <br>
— “Ah, you mean ‘Art Direction’. Sorry … we can’t do that in the [current] solution.</p>

<p>Later, a designer on the same project asked me:<br><br>
— “Can I change the image [for a component/article], if the user has ‘dark mode’?”</p>

<p>And I replied:<br><br>
— “Ha ha! And you probably <em>also</em> want to change that image to a <em>completely</em> different image for a given breakpoint? <em>And</em> server-side-scale all the images in-between?” </p>

<p>To which he replied:<br><br>
— “Yes, of course!”</p>

<p>So this is what the clients want — or at least what <em>that</em> particular client wants.<br><br>
Is it doable? Yes, but not in an easy, CMS-editor-friendly way.</p>

<p>But before we go there, let's look at some examples, and the standard way to do <em>responsive images,</em> using either the <code>&lt;img&gt;</code>-tag stand-alone, or within the <code>&lt;picture&gt;</code>-tag.</p>

<hr>
<h2>
  <a name="usecase-drdk" href="#usecase-drdk">
  </a>
  Use-case: dr.dk
</h2>

<p>One of the most popular sites in Denmark is that of the national television, <a href="https://dr.dk" target="_blank" rel="noopener noreferrer">dr.dk</a>. <br>
They use the <code>&lt;picture&gt;</code>-tag for responsive images, with multiple <code>&lt;source&gt;</code>-tags for the media-queries and logic.</p>

<p>To keep it simple, I’m going to use a <em>device-pixel-ratio (DPR)</em> set to 1. Different devices have different DPR’s (some, newer phones have a DPR of 3), but most desktop PC screens have a DPR of 1.</p>

<p>The first example uses this little teaser-block from dr.dk:</p>

<p><a href="assets/597730/0759703a.jpg" class="article-body-image-wrapper"><img src="assets/597730/0759703a.jpg" alt="drdk1" loading="lazy" width="800" height="133"></a> </p>

<p>The image is displayed at <code>160x90px</code>, but I took a look at its intrinsic size.<br>
To see which image-src is currently used, open <em>Dev Tools</em>, select the image in "Elements", then open the <code>console</code>-drawer — and type:</p>

<p><code>$0.currentSrc</code></p>

<p>With a DPR of 1, the intrinsic size was <code>336x189px</code> , almost double of what it needs to be.<br>
With a DPR of 2, the size was <code>671x378px</code> - again, more than double of what it needs to be.</p>

<p>Here’s another example:</p>

<p><a href="assets/597730/4824a52a.jpg" class="article-body-image-wrapper"><img src="assets/597730/4824a52a.jpg" alt="drdk2" loading="lazy" width="800" height="198"></a> </p>

<p>The image is scaled up, until the max-width of <code>373px</code> is reached. However, the intrinsic image is based on the <strong>viewport</strong>-width, so with a browser-window-width of <code>2000px</code>, the loaded image is actually <code>1080x698px</code>. </p>

<p>This, large image is <code>53kb</code>, but could/should be just <code>17kb</code>.<br>
If a modern format like <code>webp</code> is used, the final size is less than <code>13kb</code> — almost 1/4th of the actual size. </p>

<p>The markup for the <code>&lt;picture&gt;</code>-tag in this particular case, is a whopping <strong>11kb!</strong></p>

<p>That’s <em>almost</em> the same size as the largest image itself, if <code>webp</code> had been used with correct scaling. It makes you wonder whether responsive images are always necessary?</p>

<p>It’s the same when you use SVG’s with <code>&lt;use&gt;</code> - sometimes the link to the SVG is longer than the SVG-code itself.<br>
Should we have a threshold?</p>

<p>If you have a hero-image which is <code>100%</code> wide, there’s no doubt: you <em>need</em> to use responsive images. But in a case like this, where the difference between the minimum and maximum display sizes is minuscule, I don’t think it makes <em>any</em> sense — especially, when the markup-size almost exceeds the image-size <em>before</em> the image has even been loaded.</p>

<hr>
<h2>
  <a name="-raw-sizes-endraw-to-the-rescue" href="#-raw-sizes-endraw-to-the-rescue">
  </a>
  <code>sizes</code> to the rescue
</h2>

<p>The key to loading images in the correct display-size is the <code>sizes</code>-attribute.</p>

<p>In some of the code I inspected at dr.dk, I noticed this:<br>
<code>&lt;source media="(min-width: 720px)" sizes="650px" srcset="..."&gt;</code></p>

<p>Here, they <em>do</em> have the <code>sizes</code>-attribute, but used in a way, so it <em>always</em> returns the <code>650px</code> image, when the <code>min-width</code> is larger than <code>720px</code>, or until you add another <code>&lt;source&gt;</code>-tag.</p>

<p>However, for a simple case like this, there’s no need to use the <code>&lt;picture&gt;</code>- and multiple <code>&lt;source&gt;</code>-tags (I’ll use these for ‘art direction’ and ‘dark mode’ later):<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;img</span> <span class="na">alt=</span><span class="s">"alt text"</span> <span class="na">src=</span><span class="s">"https://some.cdn/img/test.webp"</span> <span class="na">loading=</span><span class="s">"lazy"</span> <span class="na">srcset=</span><span class="s">"
  https://some.cdn/img/test.webp?w=250 250w,
  https://some.cdn/img/test.webp?w=450 450w,
  https://some.cdn/img/test.webp?w=650 650w,
  https://some.cdn/img/test.webp?w=850 850w,
  https://some.cdn/img/test.webp?w=1050 1050w,
  https://some.cdn/img/test.webp?w=1250 1250w,
  https://some.cdn/img/test.webp?w=1450 1450w,
  https://some.cdn/img/test.webp?w=1650 1650w,
  https://some.cdn/img/test.webp?w=1850 1850w"</span>
<span class="na">sizes=</span><span class="s">"(min-width: 768px) and (max-width: 1199px) 50vw,
(min-width: 1200px) 33vw,
100vw"</span> <span class="nt">/&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>This code will display the image at <code>100vw</code> by default, but when the viewport-width is between <code>768px</code> and <code>1199px</code>, a size of <code>50vw</code> will be used — and finally, when the viewport-width is larger than <code>1200px</code>, the image will be <code>33vw</code>. </p>

<p>The <code>srcset</code> is rendered from an array of breakpoints: <br>
<code>[250,450,650,850,1050,1250,1450,1650,1850]</code> </p>

<p>… and requires a server-side scaler-function, which most of the CMS-platforms I’ve worked with has (or has available as a plugin). Another option is to use an image delivery service like Cloudflare, Akamai or Imgix. These tend to have premium caching, http2/http3 out-of-the-box, and the ability to return an image in the best suitable format, based on the capabilities of the user’s browser. </p>

<p><em>For example:</em><br>
An editor uploads an image in the best possible quality, a 20MB jpeg-file. <br>
The rendered markup will point to the jpeg:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code>https://some.cdn/img/image.jpeg?w=250 250w
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>But the <em>actual</em> image returned by the image delivery service, will be an optimised <code>webp</code>-file.</p>

<p>So, an <code>&lt;img&gt;</code> -tag with <code>srcset</code> and <code>sizes</code> configured correctly, works just fine <strong>if the editor knows the final display-size</strong>. How likely is that? Before I try to answer <em>that</em> question, let’s continue with ‘art direction’ and ‘dark mode’.</p>


<hr>

<h2>
  <a name="art-direction-switching-images" href="#art-direction-switching-images">
  </a>
  Art Direction: Switching images
</h2>

<p>Using the <code>&lt;picture&gt;</code>-tag with one or more <code>&lt;source&gt;</code>-tags, it’s possible to switch to <em>another</em> image when a specified <em>condition</em> is met. This is known as ‘art direction’ and can be any @media-rule, like (<code>min-width: 768px)</code> or <code>prefers-color-sheme: dark)</code>, or even <code>(prefers-contrast: high)</code></p>

<p>Example, switching from <code>small.jpg</code> to <code>big.jpg</code>, when the viewport-width is minimum <code>768px</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code>    <span class="nt">&lt;picture&gt;</span>
  <span class="nt">&lt;source</span>
    <span class="na">media=</span><span class="s">"(max-width: 767px)"</span>  
    <span class="na">srcset=</span><span class="s">"
      https://some.cdn/img/small.jpg?w=250 250w,
      https://some.cdn/img/small.jpg?w=450 450w"</span> <span class="err">...</span><span class="na">etc</span> 
    <span class="na">sizes=</span><span class="s">"(min-width: 768px) and (max-width: 1199px) 50vw,
    (min-width: 1200px) 33vw,
  100vw"</span><span class="nt">&gt;</span>

  <span class="nt">&lt;source</span>
    <span class="na">media=</span><span class="s">"(min-width: 768px)"</span>  
    <span class="na">srcset=</span><span class="s">"
      https://some.cdn/img/big.jpg?w=250 250w,
      https://some.cdn/img/big.jpg?w=450 450w"</span> <span class="err">...</span><span class="na">etc</span>
    <span class="na">sizes=</span><span class="s">"(min-width: 768px) and (max-width: 1199px) 50vw,
    (min-width: 1200px) 33vw,
  100vw"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;img</span> <span class="na">alt=</span><span class="s">"alt text"</span> <span class="na">src=</span><span class="s">"https://some.cdn/img/small.jpg"</span> <span class="na">loading=</span><span class="s">"lazy"</span> <span class="nt">/&gt;</span>
<span class="nt">&lt;/picture&gt;</span>
</code></pre>

<h2>
  <a name="dark-mode" href="#dark-mode">
  </a>
  Dark Mode
</h2>

<p>Instead of using <code>media="(min-width: 768px)"</code> to switch to another image, we can use <em>another</em> type of media-query, <code>media="(prefers-color-scheme: ...)"</code>.</p>

<p>Example, switching from <code>light.jpg</code> to <code>dark.jpg</code>, depending on which color-scheme the user prefers:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;picture&gt;</span>
  <span class="nt">&lt;source</span>
    <span class="na">media=</span><span class="s">"(prefers-color-scheme: light)"</span>  
    <span class="na">srcset=</span><span class="s">"
      https://some.cdn/img/light.jpg?w=250 250w,
      https://some.cdn/img/light.jpg?w=450 450w"</span> <span class="err">...</span><span class="na">etc</span> 
    <span class="na">sizes=</span><span class="s">"(min-width: 768px) and (max-width: 1199px) 50vw,
    (min-width: 1200px) 33vw,
  100vw"</span><span class="nt">&gt;</span>

  <span class="nt">&lt;source</span>
    <span class="na">media=</span><span class="s">"(prefers-color-scheme: dark)"</span>  
    <span class="na">srcset=</span><span class="s">"
      https://some.cdn/img/dark.jpg?w=250 250w,
      https://some.cdn/img/dark.jpg?w=450 450w"</span> <span class="err">...</span><span class="na">etc</span> 
    <span class="na">sizes=</span><span class="s">"(min-width: 768px) and (max-width: 1199px) 50vw,
    (min-width: 1200px) 33vw,
  100vw"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;img</span> <span class="na">alt=</span><span class="s">"alt text"</span> <span class="na">src=</span><span class="s">"https://some.cdn/img/light.jpg"</span> <span class="na">loading=</span><span class="s">"lazy"</span> <span class="nt">/&gt;</span>
<span class="nt">&lt;/picture&gt;</span>
</code></pre>

<div class="highlight__panel-action js-fullscreen-code-action">

<p>We can also <em>combine</em> these two:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;picture&gt;</span>
  <span class="nt">&lt;source</span>
    <span class="na">media=</span><span class="s">"(max-width: 767px) and (prefers-color-scheme: light)"</span>  
    <span class="na">srcset=</span><span class="s">"
      https://some.cdn/img/light-small.jpg?w=250 250w,
      https://some.cdn/img/light-small.jpg?w=450 450w"</span> <span class="err">...</span><span class="na">etc</span> 
    <span class="na">sizes=</span><span class="s">"(min-width: 768px) and (max-width: 1199px) 50vw,
    (min-width: 1200px) 33vw,
  100vw"</span><span class="nt">&gt;</span>

  <span class="nt">&lt;source</span>
    <span class="na">media=</span><span class="s">"(min-width: 768px) and (prefers-color-scheme: light)"</span>  
    <span class="na">srcset=</span><span class="s">"
      https://some.cdn/img/light-large.jpg?w=250 250w,
      https://some.cdn/img/light-large.jpg?w=450 450w"</span> <span class="err">...</span><span class="na">etc</span> 
    <span class="na">sizes=</span><span class="s">"(min-width: 768px) and (max-width: 1199px) 50vw,
    (min-width: 1200px) 33vw,
  100vw"</span><span class="nt">&gt;</span>

  <span class="nt">&lt;source</span>
    <span class="na">media=</span><span class="s">"(max-width: 767px) and (prefers-color-scheme: dark)"</span>  
    <span class="na">srcset=</span><span class="s">"
      https://some.cdn/img/dark-small.jpg?w=250 250w,
      https://some.cdn/img/dark-small.jpg?w=450 450w"</span> <span class="err">...</span><span class="na">etc</span> 
    <span class="na">sizes=</span><span class="s">"(min-width: 768px) and (max-width: 1199px) 50vw,

  <span class="nt">&lt;source</span>
    <span class="na">media=</span><span class="s">"(min-width: 768px) and (prefers-color-scheme: dark)"</span>  
    <span class="na">srcset=</span><span class="s">"
      https://some.cdn/img/dark-large.jpg?w=250 250w,
      https://some.cdn/img/dark-large.jpg?w=450 450w"</span> <span class="err">...</span><span class="na">etc</span> 
    <span class="na">sizes=</span><span class="s">"(min-width: 768px) and (max-width: 1199px) 50vw,
    (min-width: 1200px) 33vw,
  100vw"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;img</span> <span class="na">alt=</span><span class="s">"alt text"</span> <span class="na">src=</span><span class="s">"https://some.cdn/img/light-small.jpg"</span> <span class="na">loading=</span><span class="s">"lazy"</span> <span class="nt">/&gt;</span>

<blockquote>
<p><strong>Note:</strong> To toggle between <code>light</code> and <code>dark</code>, you can either use your <em>OS System Settings</em> or <em>Chrome Dev Tools:</em></p>
</blockquote>

<h2>
  <a name="keeping-the-aspectratio" href="#keeping-the-aspectratio">
  </a>
  Keeping the aspect-ratio
</h2>

<p>When switching between multiple images, there’s a risk some of these images will not have <em>exactly</em> the same height and width (unless the server/image delivery service force it).</p>

<p>For these cases, I use a small ‘hack’ (until native <code>aspect-ratio</code> has landed in all browsers):<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;picture</span> <span class="na">style=</span><span class="s">"--h:9;--w:16;"</span><span class="nt">&gt;</span>
</code></pre>

</svg>

<span class="nt">picture</span><span class="nd">::before</span> <span class="p">{</span>

<span class="p">}</span>
<span class="nt">picture</span> <span class="nt">img</span> <span class="p">{</span>

  <span class="nl">object-fit</span><span class="p">:</span> <span class="n">cover</span><span class="p">;</span>
  <span class="nl">position</span><span class="p">:</span> <span class="nb">absolute</span><span class="p">;</span>
  <span class="nl">top</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>

<h2>
  <a name="making-it-generic" href="#making-it-generic">
  </a>
  Making it generic
</h2>

<p>Now, back to the question “Does the editor know the final display-size?”</p>

<p>Of course not. This should be defined in the grid/content-block-setup by devs. </p>

<p>So if an editor drags "component X" into area "Y", devs should know how to display that image.</p>

<p>That’s all fine, but we typically tend to code functionality like this on a <em>per component</em> basis.</p>

<p>I’d like a <strong>generic</strong> <em>Image Component</em>, that can be used standalone or within other components. Through a configuration-interface, a developer (or editor!), should be able to create a unique configuration, that can be stored as JSON (or some other data-format, the server can render markup from).</p>

<p>I've been working on one, and the initial version is on Codepen:</p>

</iframe>

<p>The goal is to have a component, where a developer (or editor!) picks a configuration (preset) from a drop-down, for instance “Art Direction with Dark Mode”. This particular configuration requires four images, so the component should display four image-placeholders/fields for images.</p>

<p>Time will tell if some clever backend-developer can create such an interface — until then, I’ll use the tool to create the static markup I need for my components ;-)</p>

<hr>

<h2>
  <a name="dpr" href="#dpr">
  </a>
  DPR
</h2>

<p>You might have noticed, I didn’t add any DPR-related media-queries to the tool. In all my tests, I didn't have to. It seems modern browsers switch to a higher resolution image, when you use a device with a DPR greater than 1. So: if the image returned should normally (DPR1) be approx. 768px, a DPR2-device will recieve an image closer to 1536px.</p>


<hr>

<h2>
  <a name="conclusion" href="#conclusion">
  </a>
  Conclusion
</h2>

<p>It’s rarely you see a site that does responsive images correctly.<br><br>
And that, unfortunately, includes most of the projects I've been working on myself. </p>

<p>Why is that?<br>
Short answer: <strong>It's difficult!</strong></p>

<p>Hopefully, this tutorial and the tool I’ve created, will make it easier for you to deal with in your next project. </p>

<p>Thanks for reading!</p>
