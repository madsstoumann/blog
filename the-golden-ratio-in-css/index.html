			<h1>The Golden Ratio in CSS</h1>
			<p>The golden ratio, also called the golden number, golden proportion, or even the divine proportion, is a special relationship between two numbers that equals approximately 1.618. It’s often symbolized by the Greek letter "phi." What’s fascinating is how closely this ratio is tied to the Fibonacci sequence—a series of numbers where each number is the sum of the two before it. The Fibonacci sequence starts with 0, 1, and then continues: 1, 2, 3, 5, 8, 13, 21, and so on. As you move further along in the sequence, the ratio between each number and the one before it gets closer and closer to 1.618, or phi. This unique ratio shows up in nature, art, and architecture, making it both mathematically intriguing and visually pleasing!</p>

<p>In this tutorial, we'll re-create the <em>Golden Ratio Diagram</em> in CSS, using a few grid-declarations and some additional tricks.</p>

<p>Let's get started!</p>


<hr>

<p>We'll use this part of the Fibonacci-sequence:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight shell"><code>1, 1, 2, 3, 5, 8, 13, 21
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>That’s 8 digits, so our markup will consist of an <code>&lt;ol&gt;</code> with 8 <code>&lt;li&gt;</code> elements.</p>

<p>In CSS grid, we'll create a canvas with the dimensions derived from the sum of the last two digits, <code>13 + 21 = 34</code>, for the width, and the largest digit, <code>21</code>, for the height:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">ol</span> <span class="p">{</span>
  <span class="nl">all</span><span class="p">:</span> <span class="n">unset</span><span class="p">;</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">grid</span><span class="p">;</span>
  <span class="py">grid-template-columns</span><span class="p">:</span> <span class="nb">repeat</span><span class="p">(</span><span class="m">34</span><span class="p">,</span> <span class="m">1</span><span class="n">fr</span><span class="p">);</span>
  <span class="py">grid-template-rows</span><span class="p">:</span> <span class="nb">repeat</span><span class="p">(</span><span class="m">21</span><span class="p">,</span> <span class="m">1</span><span class="n">fr</span><span class="p">);</span>
  <span class="nl">list-style</span><span class="p">:</span> <span class="nb">none</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

</svg>

</div>
</div>
</div>



<p>Not much to see yet, but if we enable Dev Tool´s <em>Grid Inspector</em>, we can see the grid:</p>

<p><a href="assets/2014104/966975ac.jpg" class="article-body-image-wrapper"><img src="assets/2014104/966975ac.jpg" alt="Grid inspector" loading="lazy" width="800" height="499"></a></p>

<p>Next, we'll add some common styles for the <code>&lt;li&gt;</code>-elements:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code>  <span class="nt">li</span> <span class="p">{</span>
    <span class="py">aspect-ratio</span><span class="p">:</span> <span class="m">1</span> <span class="p">/</span> <span class="m">1</span><span class="p">;</span>
    <span class="nl">background</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--bg</span><span class="p">);</span>
    <span class="py">grid-area</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--ga</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>

</svg>

</div>
</div>
</div>



<p>Still nothing to see, so let's fill out the <code>--bg</code> (<code>background-color</code>) and <code>--ga</code> (<code>grid-area</code>) variables with some content:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">1</span><span class="o">)</span> <span class="p">{</span>
  <span class="py">--bg</span><span class="p">:</span> <span class="m">#e47a2c</span><span class="p">;</span>
  <span class="py">--ga</span><span class="p">:</span> <span class="m">1</span> <span class="p">/</span> <span class="m">1</span> <span class="p">/</span> <span class="m">22</span> <span class="p">/</span> <span class="m">22</span><span class="p">;</span>
<span class="p">}</span>
<span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">2</span><span class="o">)</span> <span class="p">{</span>
  <span class="py">--bg</span><span class="p">:</span> <span class="m">#baccc0</span> <span class="p">;</span>
  <span class="py">--ga</span><span class="p">:</span> <span class="m">1</span> <span class="p">/</span> <span class="m">22</span> <span class="p">/</span> <span class="m">23</span> <span class="p">/</span> <span class="m">35</span><span class="p">;</span>
<span class="p">}</span>
<span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">3</span><span class="o">)</span> <span class="p">{</span>
  <span class="py">--bg</span><span class="p">:</span> <span class="m">#6c958f</span><span class="p">;</span>
  <span class="py">--ga</span><span class="p">:</span> <span class="m">14</span> <span class="p">/</span> <span class="m">27</span> <span class="p">/</span> <span class="m">22</span> <span class="p">/</span> <span class="m">35</span><span class="p">;</span>
<span class="p">}</span>
<span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">4</span><span class="o">)</span> <span class="p">{</span>
  <span class="py">--bg</span><span class="p">:</span> <span class="m">#40363f</span><span class="p">;</span>
  <span class="py">--ga</span><span class="p">:</span> <span class="m">17</span> <span class="p">/</span> <span class="m">22</span> <span class="p">/</span> <span class="m">22</span> <span class="p">/</span> <span class="m">27</span><span class="p">;</span>
<span class="p">}</span>
<span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">5</span><span class="o">)</span> <span class="p">{</span>
  <span class="py">--bg</span><span class="p">:</span> <span class="m">#d7a26c</span><span class="p">;</span>
  <span class="py">--ga</span><span class="p">:</span> <span class="m">14</span> <span class="p">/</span> <span class="m">22</span> <span class="p">/</span> <span class="m">17</span> <span class="p">/</span> <span class="m">25</span><span class="p">;</span>
<span class="p">}</span>
<span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">6</span><span class="o">)</span> <span class="p">{</span>
  <span class="py">--bg</span><span class="p">:</span> <span class="m">#ae4935</span><span class="p">;</span>
  <span class="py">--ga</span><span class="p">:</span> <span class="m">14</span> <span class="p">/</span> <span class="m">25</span> <span class="p">/</span> <span class="m">17</span> <span class="p">/</span> <span class="m">27</span><span class="p">;</span>
<span class="p">}</span>
<span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">7</span><span class="o">)</span> <span class="p">{</span>
  <span class="py">--bg</span><span class="p">:</span> <span class="m">#e47a2c</span><span class="p">;</span>
  <span class="py">--ga</span><span class="p">:</span> <span class="m">16</span> <span class="p">/</span> <span class="m">26</span> <span class="p">/</span> <span class="m">17</span> <span class="p">/</span> <span class="m">27</span><span class="p">;</span>
<span class="p">}</span>
<span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">8</span><span class="o">)</span> <span class="p">{</span>
  <span class="py">--bg</span><span class="p">:</span> <span class="m">#f7e6d4</span><span class="p">;</span>
  <span class="py">--ga</span><span class="p">:</span> <span class="m">16</span> <span class="p">/</span> <span class="m">25</span> <span class="p">/</span> <span class="m">17</span> <span class="p">/</span> <span class="m">26</span><span class="p">;</span>

<p>And now, we get this:</p>

<p><a href="assets/2014104/a1b302d0.jpg" class="article-body-image-wrapper"><img src="assets/2014104/a1b302d0.jpg" alt="Fibonacci" loading="lazy" width="800" height="493"></a></p>

<p>Cool! So what happened? We gave each <code>&lt;li&gt;</code> it's own <code>background-color</code> using the <code>--bg</code> custom property. Then we used <code>grid-area</code> to place and size the rectangles within the grid. <code>grid-area</code> is a shorthand for:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight shell"><code>row-start / col-start / row-end / col-end
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>

</svg>

</div>



<p>Now, how about creating the spiral effect? While CSS can’t directly draw spirals, we can fake it by adding circles as <code>::after</code> pseudo-elements on each <code>&lt;li&gt;</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">li</span> <span class="p">{</span>
  <span class="c">/* as before */</span>
  <span class="nl">overflow</span><span class="p">:</span> <span class="nb">hidden</span><span class="p">;</span>
  <span class="nl">position</span><span class="p">:</span> <span class="nb">relative</span><span class="p">;</span>

  <span class="err">&amp;::after</span> <span class="err">{</span>
    <span class="py">aspect-ratio</span><span class="p">:</span> <span class="m">1</span> <span class="p">/</span> <span class="m">1</span><span class="p">;</span>
    <span class="nl">background-color</span><span class="p">:</span> <span class="n">rgba</span><span class="p">(</span><span class="m">255</span><span class="p">,</span> <span class="m">255</span><span class="p">,</span> <span class="m">255</span><span class="p">,</span> <span class="m">.3</span><span class="p">);</span>
    <span class="nl">border-radius</span><span class="p">:</span> <span class="m">50%</span><span class="p">;</span>
    <span class="nl">content</span><span class="p">:</span> <span class="s2">''</span><span class="p">;</span>
    <span class="nl">display</span><span class="p">:</span> <span class="nb">block</span><span class="p">;</span>
    <span class="py">inset</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
    <span class="nl">position</span><span class="p">:</span> <span class="nb">absolute</span><span class="p">;</span>
  <span class="p">}</span>
<span class="err">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>

<p>This gives us:</p>

<p><a href="assets/2014104/3fc19d95.jpg" class="article-body-image-wrapper"><img src="assets/2014104/3fc19d95.jpg" alt="Circles" loading="lazy" width="800" height="493"></a></p>

<pre class="highlight plaintext"><code>&amp;::after {
  /* as before */

}

<p>However, not much changes until we update the <code>--tl</code> (translate) property for each <code>&lt;li&gt;</code>:<br>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">1</span><span class="o">)</span> <span class="p">{</span>
  <span class="py">--tl</span><span class="p">:</span> <span class="m">50%</span> <span class="m">50%</span><span class="p">;</span>
<span class="p">}</span>
<span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">2</span><span class="o">)</span> <span class="p">{</span>
  <span class="py">--tl</span><span class="p">:</span> <span class="m">-50%</span> <span class="m">50%</span><span class="p">;</span>

<p>Now we get this:</p>

<p><a href="assets/2014104/46edb8fe.jpg" class="article-body-image-wrapper"><img src="assets/2014104/46edb8fe.jpg" alt="Final" loading="lazy" width="800" height="493"></a></p>

<h3>
  <a name="what-happened-here" href="#what-happened-here">
  </a>
  What happened here?
</h3>

<p>We created a circle double the size of its element, then used translate to shift the circle in different directions to give the appearance of a continuous spiral. By adjusting the translation for each element, the circles "flow" into one another, mimicking a spiral.</p>

<p>Finally, because we added <code>overflow: hidden</code> to the <code>&lt;li&gt;</code> elements, the circles are "cut off" when they overflow their containers, giving us the illusion of a perfect spiral!</p>

</p>
