		<article>
			<h1>Using a Single Input for one-time-code</h1>
			<p>The other night I had a bit of fun trying to create a single-input <strong>one-time-code</strong>:</p>

<p><a href="assets/1500673/228eb4aa.jpg" class="article-body-image-wrapper"><img src="assets/1500673/228eb4aa.jpg" alt="One-Time-Code" loading="lazy" width="800" height="208"></a></p>

<p><strong>one-time-code</strong> is a valid <code>autocomplete</code>-value, and with a few lines of JS, it let's you fill out the field from a text-message (sms). </p>

<p>More often, it's called <strong>OTP</strong>, though.</p>

<p><em><a href="https://en.wikipedia.org/wiki/One-time_password" target="_blank" rel="noopener noreferrer">From Wikipedia:</a></em></p>

<blockquote>
<p>A one-time password (OTP), also known as a one-time PIN, one-time authorization code (OTAC) or dynamic password, is a password that is valid for only one login session or transaction, on a computer system or other digital device.</p>
</blockquote>


<hr>

<p>Back to my example. </p>

<p>It's using <em>very</em> simple markup:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;input</span>
  <span class="na">type=</span><span class="s">"text"</span>
  <span class="na">autocomplete=</span><span class="s">"one-time-code"</span>
  <span class="na">inputmode=</span><span class="s">"numeric"</span>
  <span class="na">maxlength=</span><span class="s">"6"</span>
  <span class="na">pattern=</span><span class="s">"\d{6}"</span>
<span class="nt">&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The CSS is a bit more complex:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:where</span><span class="o">([</span><span class="nt">autocomplete</span><span class="o">=</span><span class="nt">one-time-code</span><span class="o">])</span> <span class="p">{</span>
  <span class="py">--otp-digits</span><span class="p">:</span> <span class="m">6</span><span class="p">;</span> <span class="c">/* length */</span>
  <span class="py">--otc-ls</span><span class="p">:</span> <span class="m">2ch</span><span class="p">;</span>
  <span class="py">--otc-gap</span><span class="p">:</span> <span class="m">1.25</span><span class="p">;</span>
  <span class="c">/* private consts */</span>
  <span class="py">--_otp-bgsz</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--otc-ls</span><span class="p">)</span> <span class="err">+</span> <span class="m">1ch</span><span class="p">);</span>

  <span class="nl">all</span><span class="p">:</span> <span class="n">unset</span><span class="p">;</span>
  <span class="nl">background</span><span class="p">:</span> <span class="n">linear-gradient</span><span class="p">(</span><span class="m">90deg</span><span class="p">,</span> 
    <span class="n">var</span><span class="p">(</span><span class="n">--otc-bg</span><span class="p">,</span> <span class="m">#EEE</span><span class="p">)</span> <span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--otc-gap</span><span class="p">)</span> <span class="err">*</span> <span class="n">var</span><span class="p">(</span><span class="n">--otc-ls</span><span class="p">)),</span>
    <span class="nb">transparent</span> <span class="m">0</span>
  <span class="p">)</span> <span class="m">0</span> <span class="m">0</span> <span class="p">/</span> <span class="n">var</span><span class="p">(</span><span class="n">--_otp-bgsz</span><span class="p">)</span> <span class="m">100%</span><span class="p">;</span>
  <span class="py">caret-color</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--otc-cc</span><span class="p">,</span> <span class="m">#333</span><span class="p">);</span>
  <span class="nl">clip-path</span><span class="p">:</span> <span class="nb">inset</span><span class="p">(</span><span class="m">0%</span> <span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--otc-ls</span><span class="p">)</span> <span class="p">/</span> <span class="m">2</span><span class="p">)</span> <span class="m">0%</span> <span class="m">0%</span><span class="p">);</span>
  <span class="nl">font-family</span><span class="p">:</span> <span class="n">ui-monospace</span><span class="p">,</span> <span class="nb">monospace</span><span class="p">;</span>
  <span class="nl">font-size</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--otc-fz</span><span class="p">,</span> <span class="m">2.5em</span><span class="p">);</span>
  <span class="py">inline-size</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--otc-digits</span><span class="p">)</span> <span class="err">*</span> <span class="n">var</span><span class="p">(</span><span class="n">--_otp-bgsz</span><span class="p">));</span>
  <span class="nl">letter-spacing</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--otc-ls</span><span class="p">);</span>
  <span class="py">padding-block</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--otc-pb</span><span class="p">,</span> <span class="m">1ch</span><span class="p">);</span>
  <span class="py">padding-inline-start</span><span class="p">:</span> <span class="n">calc</span><span class="p">(((</span><span class="n">var</span><span class="p">(</span><span class="n">--otc-ls</span><span class="p">)</span> <span class="n">-</span> <span class="m">1ch</span><span class="p">)</span> <span class="p">/</span> <span class="m">2</span><span class="p">)</span> <span class="err">*</span> <span class="n">var</span><span class="p">(</span><span class="n">--otc-gap</span><span class="p">));</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>It's a bunch of stuff simulating 6 fields (from the property <code>--otc-digits</code>), while — in reality — it's just a single <code>&lt;input&gt;</code>. The spacing between the "fields" is due to <code>letter-spacing</code>, and the gray "boxes" are from a <code>linear-gradient</code>.</p>

<p>It has to use a monospace-font, so the <em>magic value</em> of <code>1ch</code> works — same applies to the <code>letter-spacing</code>. <code>1ch</code> equals the width of a zero.</p>


<hr>

<h2>
  <a name="but-why" href="#but-why">
  </a>
  But why?
</h2>

<p>Have you ever created a OTP-component before? </p>

<p>I'm writing "component", because it's typically a <code>&lt;fieldset&gt;</code> with six <code>&lt;input&gt;</code>s and a bunch of JavaScript to detect when you enter- or leave a field etc. </p>

<p>When you fill out the field from the <a href="https://web.dev/sms-otp-form/" target="_blank" rel="noopener noreferrer">Web OTP API</a>, you need to split the value, and fill-in six fields instead of one.</p>

<p>With a single input it's <strong>much</strong> <a href="https://web.dev/sms-otp-form/" target="_blank" rel="noopener noreferrer">simpler</a>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nb">navigator</span><span class="p">.</span><span class="nx">credentials</span><span class="p">.</span><span class="nf">get</span><span class="p">({</span>
  <span class="na">otp</span><span class="p">:</span> <span class="p">{</span><span class="na">transport</span><span class="p">:[</span><span class="dl">'</span><span class="s1">sms</span><span class="dl">'</span><span class="p">]}</span>
<span class="p">})</span>
<span class="p">.</span><span class="nf">then</span><span class="p">(</span><span class="nx">otp</span> <span class="o">=&gt;</span> <span class="nx">input</span><span class="p">.</span><span class="nx">value</span> <span class="o">=</span> <span class="nx">otp</span><span class="p">.</span><span class="nx">code</span><span class="p">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>




<hr>

<h2>
  <a name="highlightning-the-current-field" href="#highlightning-the-current-field">
  </a>
  Highlightning the current "field"
</h2>

<p>The single-input OTP is not perfect. When you move from "field" to "field", it would be a better user-experience, if the caret was a block:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.selector</span> <span class="p">{</span>
  <span class="py">caret-shape</span><span class="p">:</span> <span class="nb">block</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Unfortunately, no browsers support <code>caret-shape</code> yet.</p>


<hr>

<p>Another way, would be to add <em>another</em> <code>background-gradient</code>, but without repeating the pattern:</p>

<p><a href="assets/1500673/c97c0cb3.jpg" class="article-body-image-wrapper"><img src="assets/1500673/c97c0cb3.jpg" alt="Image description" loading="lazy" width="440" height="125"></a></p>

<p>And position it by multiplying the size-property — <code>--_otp-bgsz</code> — with the digit-number, <code>--_otp-digit</code>, as a custom property:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.selector</span> <span class="p">{</span>
  <span class="nl">background-position</span><span class="p">:</span> 
    <span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--_otp-digit</span><span class="p">,</span> <span class="m">0</span><span class="p">)</span> <span class="err">*</span> <span class="n">var</span><span class="p">(</span><span class="n">--_otp-bgsz</span><span class="p">))</span> <span class="m">0</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>This is not perfect, because we'd need to put the digit in a CSS Custom Property, and then update <em>that</em> with JavaScript:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nx">input</span><span class="p">.</span><span class="nf">addEventListener</span><span class="p">(</span><span class="dl">'</span><span class="s1">input</span><span class="dl">'</span><span class="p">,</span> <span class="p">()</span> <span class="o">=&gt;</span> 
  <span class="nx">input</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nf">setProperty</span><span class="p">(</span><span class="dl">'</span><span class="s1">--_otp-digit</span><span class="dl">'</span><span class="p">,</span> 
  <span class="nx">input</span><span class="p">.</span><span class="nx">selectionStart</span><span class="p">)</span>
<span class="p">)</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>

<p>Could this be done in an even simpler way? Other sugestions? Please use the comments!</p>
