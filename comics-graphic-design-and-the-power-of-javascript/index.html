			<h1>Comics, Graphic Design — and the Power of JavaScript</h1>
			<p>In January 2007, I was asked to do the impossible: Layout, letter and produce a boxset with seven hardcover comic books, each 136 pages – in just two weeks! I knew I could do it, because I had a secret weapon, that none of the other <em>Graphic Designers</em> I knew used: JavaScript!</p>


<hr>

<p>February 2007 marked the 40th anniversary of the “Gaston Lagaffe” comic (“Vakse Viggo” in danish). Multiple publishers around the world were publishing commemorate anniversary-editions, but the danish publisher had decided <strong>not</strong> to mark the anniversary. </p>

<p>Then they had a sudden change of heart – and the boxset had to be ready in record time, in order to co-print with other countries.</p>

<p>It ended up looking like this (it's rare, and sold out today!):</p>

<p><a href="assets/754012/fe5026cb.jpg" class="article-body-image-wrapper"><img src="assets/754012/fe5026cb.jpg" alt="Viggo_boksen_ryg_indhold" loading="lazy" width="595" height="748"></a></p>

<p>But how on earth could JavaScript help me create seven comic books in record time?</p>


<hr>

<h2>
  <a name="the-power-of-javascript" href="#the-power-of-javascript">
  </a>
  The Power of JavaScript
</h2>

<p>As web developers we often forget, that JavaScript can be used in <strong>many other places</strong> than websites and web apps. One such place is <em>Adobe InDesign</em>, a popular desktop publishing application. Using it's <em>Script Panel</em>, you can write small helper-scripts or even extend the UI (with small popup forms) using JavaScript.</p>

<p>In <em>Adobe InDesign</em>, you simply create a reference to the active document in a plain <code>.js</code>-file:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">doc</span> <span class="o">=</span> <span class="nx">app</span><span class="p">.</span><span class="nx">activeDocument</span>
</code></pre>

<p>… and then you can do all sorts of things! Read the <a href="https://helpx.adobe.com/indesign/using/scripting.html" target="_blank" rel="noopener noreferrer">documentation</a> and try some of the sample scripts. If you know JavaScript, it's straightforward. You can also write  scripts for <em>Adobe Photoshop</em> and other Adobe applications.</p>


<hr>

<h2>
  <a name="the-secret-weapon" href="#the-secret-weapon">
  </a>
  The Secret Weapon
</h2>

<p>My “Secret Weapon” were a bunch of scripts, each assigned to a function-key, that could help me:</p>

<ul>
<li>Import the complete text of a comic book (from a Word-document), split it into pages and then into multiple text-frames, that would be used for each “speech balloon”.</li>
</ul>

<p><em>Excerpt:</em><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="k">for </span><span class="p">(</span><span class="nx">i</span> <span class="o">=</span> <span class="mi">0</span><span class="p">;</span> <span class="nx">i</span> <span class="o">&lt;</span> <span class="nx">len</span><span class="p">;</span> <span class="nx">i</span><span class="o">++</span><span class="p">)</span> <span class="p">{</span>
  <span class="nx">height</span> <span class="o">=</span> <span class="p">((</span><span class="nx">HEIGHT</span> <span class="o">*</span> <span class="nx">len</span><span class="p">)</span> <span class="o">&gt;</span> <span class="nx">pageHeight</span><span class="p">)</span> <span class="p">?</span> <span class="p">(</span><span class="nx">HEIGHT</span> <span class="o">/</span> <span class="nx">len</span><span class="p">)</span> <span class="p">:</span> <span class="nx">HEIGHT</span><span class="p">;</span>
  <span class="nx">width</span> <span class="o">=</span> <span class="nx">WIDTH</span><span class="p">;</span> 
  <span class="nx">tmpFrame</span> <span class="o">=</span> <span class="nx">doc</span><span class="p">.</span><span class="nx">pages</span><span class="p">[</span><span class="nx">pageIndex</span><span class="p">].</span><span class="nx">textFrames</span><span class="p">.</span><span class="nf">add</span><span class="p">();</span>
  <span class="nx">tmpFrame</span><span class="p">.</span><span class="nx">geometricBounds</span> <span class="o">=</span> <span class="p">[</span><span class="mi">0</span><span class="p">,</span> <span class="mi">0</span><span class="p">,</span> <span class="nx">pageHeight</span><span class="p">,</span> <span class="nx">pageWidth</span><span class="p">];</span>
  <span class="nx">tmpFrame</span><span class="p">.</span><span class="nx">contents</span> <span class="o">=</span> <span class="nx">frames</span><span class="p">[</span><span class="nx">i</span><span class="p">];</span>
  <span class="nx">tmpFrame</span><span class="p">.</span><span class="nx">textFramePreferences</span><span class="p">.</span><span class="nx">insetSpacing</span> <span class="o">=</span> <span class="p">[</span><span class="mi">2</span><span class="p">,</span> <span class="mi">2</span><span class="p">,</span> <span class="mi">2</span><span class="p">,</span> <span class="mi">2</span><span class="p">];</span>
  <span class="nx">tmpFrame</span><span class="p">.</span><span class="nx">textFramePreferences</span><span class="p">.</span><span class="nx">verticalJustification</span> <span class="o">=</span> <span class="nx">VerticalJustification</span><span class="p">.</span><span class="nx">CENTER_ALIGN</span><span class="p">;</span>
  <span class="nx">tmpFrame</span><span class="p">.</span><span class="nx">geometricBounds</span> <span class="o">=</span> <span class="p">[</span><span class="mi">0</span><span class="p">,</span> <span class="mi">0</span><span class="p">,</span> <span class="nx">height</span><span class="p">,</span> <span class="nx">width</span><span class="p">];</span>
  <span class="nx">tmpFrame</span><span class="p">.</span><span class="nf">move</span><span class="p">(</span> <span class="p">[</span><span class="o">-</span><span class="nx">width</span><span class="p">,</span> <span class="nx">height</span> <span class="o">*</span> <span class="nx">i</span><span class="p">]</span> <span class="p">);</span>
<span class="p">}</span>
</code></pre>

<ul>
<li><p>Add “Word Effects”, for instance changing a line of text into ”wavy text” or text, where each letter grow or shrink in font-size (in comic books, these are <strong>KABOUM!</strong> and <strong>VROOOOMM!</strong> etc.!)</p></li>
<li><p>Change the language of all text-frames in a document</p></li>
<li><p>“Fit text to frame”, by growing or shrinking the font-size</p></li>
<li><p>Color layers with original lettering, so you could differentiate them from local language lettering</p></li>
</ul>

<p>… Sometimes, I'd just write a quick script to help me re-link artwork-files or similar:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nx">d</span><span class="o">=</span><span class="nx">app</span><span class="p">.</span><span class="nx">activeDocument</span><span class="p">;</span><span class="nx">l</span><span class="o">=</span><span class="nx">d</span><span class="p">.</span><span class="nx">links</span><span class="p">;</span>
<span class="k">for</span><span class="p">(</span><span class="nx">j</span><span class="o">=</span><span class="nx">l</span><span class="p">.</span><span class="nx">length</span><span class="o">-</span><span class="mi">1</span><span class="p">;</span><span class="nx">j</span><span class="o">&gt;=</span><span class="mi">0</span><span class="p">;</span><span class="nx">j</span><span class="o">--</span><span class="p">){</span>
  <span class="nx">n</span><span class="o">=</span><span class="nx">l</span><span class="p">[</span><span class="nx">j</span><span class="p">].</span><span class="nx">filePath</span><span class="p">.</span><span class="nf">replace</span><span class="p">(</span><span class="dl">'</span><span class="s1">TUNI_45</span><span class="dl">'</span><span class="p">,</span><span class="dl">'</span><span class="s1">TUNIQUES_50</span><span class="dl">'</span><span class="p">)</span><span class="o">+</span><span class="dl">'</span><span class="s1">.tif</span><span class="dl">'</span><span class="p">;</span>
  <span class="nx">nf</span> <span class="o">=</span> <span class="nc">File</span><span class="p">(</span><span class="nx">n</span><span class="p">.</span><span class="nf">replace</span><span class="p">(</span><span class="dl">"</span><span class="s2">C:</span><span class="se">\\</span><span class="s2">TB45</span><span class="se">\\</span><span class="s2">Tuniques Bleues 45 page 03_46</span><span class="se">\\</span><span class="s2">images</span><span class="dl">"</span><span class="p">,</span><span class="dl">"</span><span class="s2">D:</span><span class="se">\\</span><span class="s2">Download</span><span class="se">\\</span><span class="s2">TB_3</span><span class="se">\\</span><span class="s2">Natifs</span><span class="se">\\</span><span class="s2">Tuniques 50 page 03-46</span><span class="se">\\</span><span class="s2">images</span><span class="dl">"</span><span class="p">))</span>
  <span class="k">if</span><span class="p">(</span><span class="nx">nf</span><span class="p">.</span><span class="nx">exists</span><span class="p">){</span><span class="nx">l</span><span class="p">[</span><span class="nx">j</span><span class="p">].</span><span class="nf">relink</span><span class="p">(</span><span class="nx">nf</span><span class="p">);</span><span class="nx">l</span><span class="p">[</span><span class="nx">j</span><span class="p">].</span><span class="nf">update</span><span class="p">()}</span>
<span class="p">}</span>
</code></pre>

<hr>

<p>So – yes – JavaScript <strong>did</strong> really make it possible to create these comic books in record time! </p>

<p>At that time, the workflow of a typical “comic book letterer” was like this:</p>

<ul>
<li>Select the text of a single speech balloon in <em>Word</em>
</li>
<li>Copy the selected text</li>
<li>Create a new text-frame in <em>Adobe InDesign</em>
</li>
<li>Paste copied text</li>
<li>Adjust the size of the text-frame to fit the speech balloon</li>
<li>Re-format the text</li>
<li>Repeat for next speech balloon …</li>
</ul>

<p>Needless to say, by automating all this in JavaScript, I could letter the comics <strong>many</strong> times faster than my competitors.</p>

<p>As a result, I could lower my prices, and get even more work. </p>


<hr>

<h2>
  <a name="but-then-" href="#but-then-">
  </a>
  But then ...
</h2>

<p>In 2008, the financial crisis hit, and for the years to come, it impacted the Danish comic book-market badly. </p>

<p>Not only that, but my main line of work besides comic book-lettering, was layouting childrens magazines like “Hello Kitty”, “Spider-Man”, “Star Wars” and “Toy Story”.</p>

<p>As you might or might not know, childrens magazines faced a <strong>very</strong> hard time after the launch of the iPad in 2010! </p>

<p>A combination of the financial crisis and the launch of the iPad meant, that the company I worked for, went from 130 employees to just 5, in the span of a few years.</p>

<p>Luckily, graphic design was only <strong>half</strong> of my work-life, the other half being – you guessed it! – web development! In 2014, I “retired” as a graphic designer, and focused entirely on web- and app development.</p>


<hr>

<h2>
  <a name="final-thoughts" href="#final-thoughts">
  </a>
  Final Thoughts
</h2>

<p>So why this post? It's not only meant to show you how – as a Web Developer – you can use your JavaScript-skills outside the world of web development, but also:</p>

<blockquote>
<p>No matter <em>which field</em> you work in, it's all about <strong>improving and optimizing your workflow</strong>. If you have repetitive tasks, use your coding skills to remove them!</p>
</blockquote>

<p><em>… and, finally:</em></p>

<p>If you know a <em>Grahic Designer</em>, ask her/him if s/he has repetitive tasks. If yes, offer to help writing scripts – it can make a <strong>huge</strong> difference! </p>


<hr>

<h2>
  <a name="geeky-bonus-info" href="#geeky-bonus-info">
  </a>
  Geeky Bonus Info
</h2>

<p>The artist behind “Gaston Lagaffe” was called André Franquin (1924–1997), and I was lucky enough to meet him, when I was a 12-year old comic book geek:</p>

<p><a href="assets/754012/ae477766.jpg" class="article-body-image-wrapper"><img src="assets/754012/ae477766.jpg" alt="Franquin and I" loading="lazy" width="517" height="272"></a></p>

<p>When I did the lettering of “Gaston Lagaffe”, I wanted it to resemble the original as much as possible, so I scanned a bunch of pages with Franquin's original handwriting, traced them in <em>Adobe Illustrator</em>, and created two typefaces in <a href="https://www.high-logic.com/font-editor/fontcreator" target="_blank" rel="noopener noreferrer">FontCreator</a>, that were used in the publication:</p>

<p><a href="assets/754012/b2c2af5d.jpg" class="article-body-image-wrapper"><img src="assets/754012/b2c2af5d.jpg" alt="Gaston Typeface" loading="lazy" width="800" height="61"></a></p>
