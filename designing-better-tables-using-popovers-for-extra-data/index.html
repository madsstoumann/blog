			<h1>Designing Better Tables: Using Popovers for Extra Data</h1>
			<p>When working with large data tables, displaying all available information at once can often make the table overwhelming and hard to read. As a result, it’s common to hide secondary information and use a design pattern to reveal more details only when needed.</p>

<p>Data table design is central to good user experience (UX), especially when handling high-volume or complex data. According to articles like <a href="https://www.pencilandpaper.io/articles/ux-pattern-analysis-enterprise-data-tables" target="_blank" rel="noopener noreferrer">Why does table design UX matter?</a> and <a href="https://coyleandrew.medium.com/design-better-data-tables-4ecc99d23356" target="_blank" rel="noopener noreferrer">Design better data tables</a>, there’s a consensus on three main ways to manage these hidden details:</p>

<ul>
<li>
<strong>Expandable Rows</strong> – Expands table rows inline to reveal additional details.</li>
<li>
<strong>Modal Views</strong> – Opens a modal dialog with more in-depth information.</li>
<li>
<strong>Quick View (Sidebar)</strong> – Displays extra details in a sidebar that can slide in from the edge.</li>
</ul>

<p>In this article, I’ll show you how to set up these three options flexibly, so you can switch between them without needing to rewrite the table’s markup. </p>

<p>For this, we’ll use <strong>popovers</strong>, which are ideal for easily attaching information directly to specific rows.</p>


<hr>

<h2>
  <a name="setting-up-the-basic-table" href="#setting-up-the-basic-table">
  </a>
  Setting Up the Basic Table
</h2>

<p>To start, we’ll use the same markup and styles as in <a href="https://dev.to/madsstoumann/a-guide-to-styling-tables-28d2">A Guide to Styling Tables</a>:</p>

<p><a href="assets/2074710/f22a8864.jpg" class="article-body-image-wrapper"><img src="assets/2074710/f22a8864.jpg" alt="Basic Table" loading="lazy" width="800" height="222"></a></p>

<p>In the last cell, after the text content, we’ve added a simple button (the icon is from <a href="https://tabler.io/icons" target="_blank" rel="noopener noreferrer">tabler</a>), that will trigger a popover:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;button</span> <span class="na">type=</span><span class="s">"button"</span> <span class="na">popovertarget=</span><span class="s">"p1"</span><span class="nt">&gt;&lt;/button&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

</svg>

</div>
</div>

<p>Next, we <strong>add</strong> the popover somewhere in the document to display the additional content when triggered:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;div</span> <span class="na">id=</span><span class="s">"p1"</span> <span class="na">popover</span><span class="nt">&gt;</span>
  ... content ...   
<span class="nt">&lt;/div&gt;</span>
</code></pre>

<h2>
  <a name="styling-the-popover" href="#styling-the-popover">
  </a>
  Styling the Popover
</h2>

<p>For the popover styling, we’ll use the template from Adam Argyle’s <a href="https://nerdy.dev/steal-this-popover-starter-kit" target="_blank" rel="noopener noreferrer">Steal this popover code</a>. This template includes smooth transitions for the popover’s appearance and disappearance:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.selector</span> <span class="p">{</span>
  <span class="err">&amp;,</span> <span class="err">&amp;::backdrop</span> <span class="err">{</span>
    <span class="nl">transition</span><span class="p">:</span> 
      <span class="n">display</span> <span class="m">.5s</span> <span class="n">allow-discrete</span><span class="p">,</span> 
      <span class="n">overlay</span> <span class="m">.5s</span> <span class="n">allow-discrete</span><span class="p">,</span> 
      <span class="nb">inset</span> <span class="m">.5s</span><span class="p">,</span>
      <span class="n">scale</span> <span class="m">.5s</span><span class="p">,</span>
      <span class="n">opacity</span> <span class="m">.5s</span><span class="p">;</span>
    <span class="nl">opacity</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="p">}</span>

  <span class="o">&amp;</span><span class="nd">::backdrop</span> <span class="p">{</span>
    <span class="nl">background</span><span class="p">:</span> <span class="m">#0002</span><span class="p">;</span>
  <span class="p">}</span>

  <span class="o">&amp;</span><span class="nd">:popover-open</span> <span class="p">{</span>
    <span class="nl">opacity</span><span class="p">:</span> <span class="m">1</span><span class="p">;</span>
    <span class="err">&amp;::backdrop</span> <span class="err">{</span>
      <span class="nl">opacity</span><span class="p">:</span> <span class="m">0.5</span><span class="p">;</span>
    <span class="p">}</span>
  <span class="err">}</span>

  <span class="k">@starting-style</span> <span class="p">{</span>
    <span class="o">&amp;</span><span class="nd">:popover-open</span><span class="o">,</span>
    <span class="o">&amp;</span><span class="nd">:popover-open::backdrop</span> <span class="p">{</span>
      <span class="nl">opacity</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
    <span class="p">}</span>
  <span class="p">}</span>
<span class="err">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>

<h3>
  <a name="modal-view" href="#modal-view">
  </a>
  Modal View
</h3>

<p>For the modal layout, we’ll add a <code>--modal</code> modifier class to define the modal’s size and center it on the screen:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">&amp;</span><span class="nc">.--modal</span> <span class="p">{</span>
  <span class="py">block-size</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">100</span><span class="n">dvh</span> <span class="n">-</span> <span class="m">2em</span><span class="p">);</span>
  <span class="py">inline-size</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">100</span><span class="n">dvw</span> <span class="n">-</span> <span class="m">2em</span><span class="p">);</span>
  <span class="py">inset-block-start</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>
  <span class="py">inset-inline</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>
  <span class="nl">transform-origin</span><span class="p">:</span> <span class="m">50%</span> <span class="m">50%</span><span class="p">;</span>

  <span class="err">@starting-style</span> <span class="err">{</span>
    <span class="err">&amp;:popover-open{</span>
      <span class="py">scale</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
    <span class="p">}</span>
  <span class="err">}</span>
<span class="err">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>

<p><a href="assets/2074710/be19db24.jpg" class="article-body-image-wrapper"><img src="assets/2074710/be19db24.jpg" alt="Modal" loading="lazy" width="800" height="451"></a></p>


<hr>

<h3>
  <a name="quick-view-sidebar" href="#quick-view-sidebar">
  </a>
  Quick View (Sidebar)
</h3>

<p>To create a quick view sidebar, we'll add a new modifier class, <code>--inline-start</code>, to the popover. This sidebar slides in from the side of the viewport and can be closed with a smooth animation. Here’s the setup:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">&amp;</span><span class="nc">.--inline-start</span> <span class="p">{</span>
  <span class="py">--width</span><span class="p">:</span> <span class="n">clamp</span><span class="p">(</span><span class="m">220px</span><span class="p">,</span> <span class="m">33vw</span><span class="p">,</span> <span class="m">350px</span><span class="p">);</span>
  <span class="py">block-size</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">100</span><span class="n">dvh</span> <span class="n">-</span> <span class="m">2em</span><span class="p">);</span>
  <span class="py">inline-size</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--width</span><span class="p">);</span>
  <span class="py">inset-block-start</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>
  <span class="py">inset-inline</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>

  <span class="err">@starting-style</span> <span class="err">{</span>
    <span class="err">&amp;:popover-open</span> <span class="err">{</span>
      <span class="py">inset-inline</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">0px</span> <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--width</span><span class="p">));</span>
    <span class="p">}</span>
  <span class="err">}</span>
  <span class="o">&amp;[</span><span class="nt">popover</span><span class="o">]</span><span class="nd">:not</span><span class="o">(</span><span class="nd">:popover-open</span><span class="o">)</span> <span class="p">{</span> 
    <span class="py">inset-inline</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">0px</span> <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--ui-width</span><span class="p">));</span>
  <span class="p">}</span>
<span class="err">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>With this setup, the popover slides in from the left. The line <code>&amp;[popover]:not(:popover-open)</code> ensures that it slides back out when closed.</p>

<p><a href="assets/2074710/b5a5ff13.jpg" class="article-body-image-wrapper"><img src="assets/2074710/b5a5ff13.jpg" alt="Inline Start" loading="lazy" width="800" height="447"></a></p>

<p>We can apply similar adjustments to create slide-in effects from the right or from above and below:</p>

<h4>
  <a name="inline-end-raw-inlineend-endraw-" href="#inline-end-raw-inlineend-endraw-">
  </a>
  Inline End (<code>--inline-end</code>)
</h4>

<p><a href="assets/2074710/d167a605.jpg" class="article-body-image-wrapper"><img src="assets/2074710/d167a605.jpg" alt="Inline End" loading="lazy" width="800" height="448"></a></p>

<h4>
  <a name="block-end-raw-blockend-endraw-" href="#block-end-raw-blockend-endraw-">
  </a>
  Block End (<code>--block-end</code>)
</h4>

<p><a href="assets/2074710/8a13f735.jpg" class="article-body-image-wrapper"><img src="assets/2074710/8a13f735.jpg" alt="Block End" loading="lazy" width="800" height="448"></a></p>


<hr>

<h2>
  <a name="expandable-rows" href="#expandable-rows">
  </a>
  Expandable Rows
</h2>

<p>And finally, let’s look at <strong>expandable rows</strong>. Unlike modals and sidebars, expandable rows integrate directly within the table layout. Traditionally, this approach involves a hidden <code>&lt;tr&gt;</code> with a <code>&lt;td&gt;</code> spanning all columns, and a JavaScript function to toggle its visibility.</p>

<p>But can we reuse the existing popover to expand rows inline? Not directly — but we can <strong>fake it</strong> by positioning the popover to appear just below the row, creating a similar effect.</p>


<hr>

<p>First, we attach the popover to the bottom left of the table row by setting <code>anchor-name</code> on the <code>&lt;tr&gt;</code> and applying the following CSS:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.selector</span> <span class="p">{</span>
  <span class="py">inset-block</span><span class="p">:</span> <span class="nb">auto</span> <span class="n">anchor</span><span class="p">(</span><span class="nb">bottom</span><span class="p">);</span>
  <span class="py">inset-inline</span><span class="p">:</span> <span class="n">anchor</span><span class="p">(</span><span class="n">start</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Next, we need two features that, unfortunately, are currently <strong>Chrome-only</strong>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.selector</span> <span class="p">{</span>
  <span class="py">interpolate-size</span><span class="p">:</span> <span class="n">allow-keywords</span><span class="p">;</span>
  <span class="nl">width</span><span class="p">:</span> <span class="n">anchor-size</span><span class="p">(</span><span class="n">width</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The <code>interpolate-size</code> property allows the popover to animate smoothly to its final height, while <code>anchor-size</code> lets it match the row’s width (or height, using <code>anchor-size(height)</code>).</p>

<p><a href="assets/2074710/7c63eeaf.jpg" class="article-body-image-wrapper"><img src="assets/2074710/7c63eeaf.jpg" alt="Inline Expand" loading="lazy" width="800" height="254"></a></p>

<p>So far, so good — but the expanded row covers the next rows. </p>

<p>We can fix this by adding the <code>popover</code> height  to the <code>padding-block-end</code> of the table cells within the expanded row:</p>

<p><a href="assets/2074710/dffb5708.jpg" class="article-body-image-wrapper"><img src="assets/2074710/dffb5708.jpg" alt="Expandable" loading="lazy" width="800" height="409"></a></p>

<p>Cool. The illusion is complete!</p>

<p>To <strong>animate</strong> the height, we'll add a few extra declarations to the CSS:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.--expandable</span> <span class="p">{</span>
  <span class="nl">transition</span><span class="p">:</span> <span class="n">height</span> <span class="m">.25s</span><span class="p">;</span>
  <span class="err">@starting-style</span> <span class="err">{</span>
    <span class="err">&amp;:popover-open{</span>
      <span class="nl">height</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
    <span class="p">}</span>
  <span class="err">}</span>
  <span class="o">&amp;[</span><span class="nt">popover</span><span class="o">]</span><span class="nd">:not</span><span class="o">(</span><span class="nd">:popover-open</span><span class="o">)</span> <span class="p">{</span> 
    <span class="nl">height</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="p">}</span>
  <span class="o">&amp;</span><span class="nd">:popover-open</span> <span class="p">{</span>
    <span class="nl">height</span><span class="p">:</span> <span class="n">max-content</span><span class="p">;</span>
  <span class="p">}</span>
<span class="err">}</span>
</code></pre>

<h2>
  <a name="automating-the-padding-adjustment" href="#automating-the-padding-adjustment">
  </a>
  Automating the Padding Adjustment
</h2>

<p>To avoid manually updating padding, we can use a script that dynamically updates the padding based on the popover’s height:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nb">document</span>
  <span class="p">.</span><span class="nf">querySelectorAll</span><span class="p">(</span><span class="dl">"</span><span class="s2">.selector</span><span class="dl">"</span><span class="p">)</span>
  <span class="p">.</span><span class="nf">forEach</span><span class="p">((</span><span class="nx">popover</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="p">{</span>
    <span class="kd">const</span> <span class="nx">trigger</span> <span class="o">=</span> <span class="nb">document</span><span class="p">.</span><span class="nf">querySelector</span><span class="p">(</span>
      <span class="s2">`[popovertarget="</span><span class="p">${</span><span class="nx">popover</span><span class="p">.</span><span class="nx">id</span><span class="p">}</span><span class="s2">"]`</span>
    <span class="p">);</span>
    <span class="kd">const</span> <span class="nx">row</span> <span class="o">=</span> <span class="nx">trigger</span><span class="p">.</span><span class="nf">closest</span><span class="p">(</span><span class="dl">"</span><span class="s2">tr</span><span class="dl">"</span><span class="p">);</span>

    <span class="nx">row</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nx">anchorName</span> <span class="o">=</span> <span class="s2">`--</span><span class="p">${</span><span class="nx">popover</span><span class="p">.</span><span class="nx">id</span><span class="p">}</span><span class="s2">`</span><span class="p">;</span>
    <span class="nx">popover</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nx">positionAnchor</span> <span class="o">=</span> <span class="s2">`--</span><span class="p">${</span><span class="nx">popover</span><span class="p">.</span><span class="nx">id</span><span class="p">}</span><span class="s2">`</span><span class="p">;</span>

    <span class="kd">const</span> <span class="nx">initialPadding</span> <span class="o">=</span> <span class="nf">parseFloat</span><span class="p">(</span>
      <span class="nf">getComputedStyle</span><span class="p">(</span><span class="nx">row</span><span class="p">.</span><span class="nx">cells</span><span class="p">[</span><span class="mi">0</span><span class="p">]).</span><span class="nx">paddingBlockEnd</span>
    <span class="p">);</span>

    <span class="nx">popover</span><span class="p">.</span><span class="nf">addEventListener</span><span class="p">(</span><span class="dl">"</span><span class="s2">toggle</span><span class="dl">"</span><span class="p">,</span> <span class="p">(</span><span class="nx">event</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="p">{</span>
      <span class="kd">const</span> <span class="nx">rowHeight</span> <span class="o">=</span>
        <span class="nx">initialPadding</span> <span class="o">+</span>
        <span class="p">(</span><span class="nx">event</span><span class="p">.</span><span class="nx">newState</span> <span class="o">===</span> <span class="dl">"</span><span class="s2">open</span><span class="dl">"</span>
          <span class="p">?</span> <span class="nx">popover</span><span class="p">.</span><span class="nx">offsetHeight</span>
          <span class="p">:</span> <span class="mi">0</span><span class="p">);</span>
      <span class="nx">row</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nf">setProperty</span><span class="p">(</span><span class="dl">"</span><span class="s2">--row</span><span class="dl">"</span><span class="p">,</span> <span class="s2">`</span><span class="p">${</span><span class="nx">rowHeight</span><span class="p">}</span><span class="s2">px`</span><span class="p">);</span>
    <span class="p">});</span>
  <span class="p">});</span>
</code></pre>

<p>This script listens for the popover’s <code>toggle</code> event, dynamically updating a custom property, <code>--row</code>, to match the popover height when open.</p>
