			<h1>Frontend Security: npm-audit and Script integrity</h1>
			<p>A couple of years ago, thousands of websites globally were hijacked by code, which made computers run cryptocurrency mining software.</p>

<p><a href="https://scotthelme.co.uk/protect-site-from-cryptojacking-csp-sri/" target="_blank" rel="noopener noreferrer">Discovered by renowned security-expert Scott Helme</a>, the malicious code was injected into a 3rd party accessibility-script, “browsealoud” by a company called texthelp.</p>

<p>Among the hijacked sites were most UK government sites, the website of the swedish police, and many more.</p>

<p>There's no doubt about where the crimes of the future will take place, so it's surprising to see, how few websites take security seriously.</p>

<p>And I admit, it's a hard sell: Unlike new, cool UI-components, engaging animations, creative user-journeys etc., security isn't sexy — it's not even visible!</p>

<p>But it will be the day, a security flaw scrapes important data, or otherwise ruins revenue.</p>

<p>Security should be an ongoing strategy for any company, but <strong>who</strong> should maintain it? Some of it is clearly front-end related.</p>


<hr>

<h2>
  <a name="npmaudit" href="#npmaudit">
  </a>
  npm-audit
</h2>

<p>The first line of defense is fixing frontend-assets. If your site use <code>node_modules</code>, test for vulnerabilities by running <a href="https://docs.npmjs.com/cli/v6/commands/npm-audit" target="_blank" rel="noopener noreferrer">npm-audit</a>:<br>
<code>$ npm run audit</code>, optionally with the <code>--fix</code> parameter.<br>
The latter will try to fix vulnerabilities, as well as give you a report with further steps to take. Yes, some projects contains 500MB+ of <code>node_modules</code>, but it has to be done.</p>

<hr>
<h2>
  <a name="3rd-party-scripts-and-raw-integrity-endraw-" href="#3rd-party-scripts-and-raw-integrity-endraw-">
  </a>
  3rd party scripts and <code>integrity</code>
</h2>

<p>I have a project where I'm using <strong>unpkg</strong> to deliver a script.<br><br>
<strong>unpkg</strong> is a fast, global content delivery network for everything on npm.<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="o">&lt;</span><span class="nx">script</span> <span class="nx">defer</span>
  <span class="nx">src</span><span class="o">=</span><span class="dl">"</span><span class="s2">https://unpkg.com/smoothscroll-polyfill@0.4.4/dist/smoothscroll.min.js</span><span class="dl">"</span><span class="o">&gt;</span>
<span class="o">&lt;</span><span class="sr">/script</span><span class="err">&gt;
</span></code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Now, if <strong>unpkg</strong> gets hacked, my site will get the hacked script.</p>

<p>Luckily, there's an attribute called <code>integrity</code>, which we can add to <code>&lt;script&gt;</code>-tags. It's a SHA-key, generated from the (unhacked) script-source. If the script is hacked, the key will not match anymore, and the script will <em>not</em> load. The hack I mentioned at the beginning of this post could have been prevented, if the affected sites had used the <code>integrity</code>-attribute.</p>

<p>For <strong>unpkg</strong>-scripts, append <code>?meta</code> to the end of the url:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code>https://unpkg.com/smoothscroll-polyfill@0.4.4/dist/smoothscroll.min.js?meta
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>This will return a json-string/object:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight json"><code><span class="p">{</span><span class="w">
  </span><span class="nl">"path"</span><span class="p">:</span><span class="s2">"/dist/smoothscroll.min.js"</span><span class="p">,</span><span class="w">
  </span><span class="nl">"type"</span><span class="p">:</span><span class="s2">"file"</span><span class="p">,</span><span class="s2">"
  contentType"</span><span class="err">:</span><span class="s2">"application/javascript"</span><span class="p">,</span><span class="w">
  </span><span class="nl">"integrity"</span><span class="p">:</span><span class="s2">"sha384-EYn4rWu1DHvYD0sSSSbMEtXQmMl58CFJd897806+RT1jJVYbhuZlZMN6yG9nCyFa"</span><span class="p">,</span><span class="w">
  </span><span class="nl">"lastModified"</span><span class="p">:</span><span class="s2">"Tue, 26 Mar 2019 18:21:19 GMT"</span><span class="p">,</span><span class="w">
  </span><span class="nl">"size"</span><span class="p">:</span><span class="mi">3968</span><span class="w">
</span><span class="p">}</span><span class="w">
</span></code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Take the <em>integrity</em>-part and add to your <code>&lt;script&gt;</code>-tag — and add a <code>crossorigin</code>-attribute as well:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="o">&lt;</span><span class="nx">script</span> <span class="nx">defer</span>
  <span class="nx">src</span><span class="o">=</span><span class="dl">"</span><span class="s2">https://unpkg.com/smoothscroll-polyfill@0.4.4/dist/smoothscroll.min.js</span><span class="dl">"</span>
  <span class="nx">integrity</span><span class="o">=</span><span class="dl">"</span><span class="s2">sha384-EYn4rWu1DHvYD0sSSSbMEtXQmMl58CFJd897806+RT1jJVYbhuZlZMN6yG9nCyFa</span><span class="dl">"</span>
  <span class="nx">crossorigin</span><span class="o">=</span><span class="dl">"</span><span class="s2">anonymous</span><span class="dl">"</span><span class="o">&gt;</span>
<span class="o">&lt;</span><span class="sr">/script</span><span class="err">&gt;
</span></code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The official name is “Subresource Integrity”, and most of the large CDN's and script-delivery-services support it.  </p>

<p>Documentation is here:<br>
<a href="https://w3c.github.io/webappsec-subresource-integrity/" target="_blank" rel="noopener noreferrer">https://w3c.github.io/webappsec-subresource-integrity/</a></p>

<p>In an upcoming article, I'll focus on how to set up and configure a <em>Content Security Policy</em>.</p>

<p>Thanks for reading!</p>
