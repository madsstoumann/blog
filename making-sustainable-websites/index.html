			<h1>Making Sustainable Websites</h1>
			<p>We've all heard about the Paris-agreement.<br><br>
We've all seen Greta Thunberg, fighting for climate-change, week after week.<br><br>
We've all seen the devastating forest-fires and how climate-change is ruining our home-planet.</p>

<p>But what does that have to do with web development?</p>

<p>Should <strong>you</strong> as a web developer do anything, apart from putting your PC/Mac to sleep, when you leave it for lunch?</p>

<p>Well, it's relevant for <em>everyone</em>, but it's actually <em>really</em> important for web developers, because we develop websites for the internet — <strong>that currently consumes 416.2TWh annually</strong>. </p>

<p>That's more energy than the entire UK! </p>

<p>According to <a href="https://websitecarbon.com" target="_blank" rel="noopener noreferrer">Website Carbon</a>:</p>

<blockquote>
<p>The average web page tested produces 1.76 grams CO2 per page view. For a website with 10,000 monthly page views, that's 211 kg CO2 per year.</p>
</blockquote>

<p>This is an important and complex topic, and there's no easy way or checklist with "just do this and you'll be fine". </p>

<p>But let's have a look at some of the things we <em>can</em> easily do:</p>

<ol>
<li>Choose a green hosting provider</li>
<li>Choose a green CDN</li>
<li>Prevent battery-drain</li>
<li>Reduce network-traffic</li>
<li>Simplify the user-journey</li>
</ol>

<hr>
<h2>
  <a name="choose-a-green-hosting-provider" href="#choose-a-green-hosting-provider">
  </a>
  Choose a green hosting provider
</h2>

<p>Are you using a green hosting provider with a strong environmental policy?</p>

<p>That's a tough one - how would you know?</p>

<p>Luckily, <a href="https://www.thegreenwebfoundation.org/" target="_blank" rel="noopener noreferrer">The Green Web Foundation</a> knows, and you can check your site there.</p>

<p>If your site is green, the even give you a nice badge (!):</p>

<p><a href="assets/597452/32376b99.jpg" class="article-body-image-wrapper"><img src="assets/597452/32376b99.jpg" alt="This website is hosted Green - checked by thegreenwebfoundation.org" loading="lazy" width="300" height="135"></a></p>

<p>In their <a href="https://www.thegreenwebfoundation.org/directory/" target="_blank" rel="noopener noreferrer">direcory</a> you can find a list of hosts in countries all over the world. If your host is not in the list, you should contact your host and ask them if they have an environmental policy and/or is doing anything to lower their carbon emissions.</p>

<p>At <a href="https://sustainablewebdesign.org/category/hosting/" target="_blank" rel="noopener noreferrer">Sustainable Web Design</a> you can find a list of relevant questions to ask, when chosing a hosting provider.</p>

<p>One that I find particular interesting is:</p>

<blockquote>
<p>Is the hosting located as close as possible to the core user base? </p>
</blockquote>

<p>Why is this relevant? To transfer data consumes electricity, so the shorter the distance, the lower the cost.</p>

<hr>
<h2>
  <a name="choose-a-green-cdn" href="#choose-a-green-cdn">
  </a>
  Choose a green CDN
</h2>

<p>For CDN's, almost the same principles apply, as when choosing a hosting provider. </p>

<p>You shouldn't have to worry about the location of the CDN, as most of them have locations all over the world, and thus will place your data close to it's core user base.</p>

<p>If you do <strong>not</strong> have a CDN, it might be beneficial for your site, depending on the number of assets your site has. Big CMS-systems like Sitecore and EPiServer are not always very good at handling large amounts of assets / streaming content.</p>

<p>The advantages of using CDN's (although there <strong>is</strong> an extra cost) are:</p>

<ul>
<li>Returns latest image formats, even if an editor uploads an image in an "old" format</li>
<li>You can query an image with a <code>w</code>-descriptor for responsive images (more on that later)</li>
<li>You can stream inline html <code>&lt;video&gt;</code>s. Most servers are <strong>not</strong> streaming servers and will download an entire video before playing it.</li>
</ul>

<hr>
<h2>
  <a name="prevent-battery-drain" href="#prevent-battery-drain">
  </a>
  Prevent Battery Drain
</h2>

<p>And now for the stuff that we developers <strong>can</strong> actually do something about!</p>

<p>JavaScript- and assets-heavy sites drain device-batteries faster than <a href="https://www.theregister.com/2019/08/29/webkit_power_usage/" target="_blank" rel="noopener noreferrer">super-slim and fast-loading sites</a>.</p>

<p>JavaScript have a suite of Observers that can greatly affect the performance of your site.  </p>

<ul>
<li>
<code>InterscetionObserver</code> can replace scroll-scripts in many cases</li>
<li>
<code>MutationObserver</code> can greatly minimize DOM-related work</li>
<li>
<code>ResizeObserver</code> can achieve much better performance than <code>window.onresize</code>
</li>
<li>
<code>PerformanceObserver</code> can help you measure any of these scenarios</li>
</ul>

<p>I love JavaScript. But I only use it when it's absolutely necessary. </p>

<p>A <strong>lot</strong> of the components you see around the web use JavaScript unnecessarily. </p>

<p>The same components can be achieved with just HTML and CSS.</p>

<p>Tags like <a href="https://codepen.io/stoumann/pen/NWRGavM" target="_blank" rel="noopener noreferrer"><code>&lt;details&gt;</code></a> and <a href="https://codepen.io/stoumann/pen/VwKgJNv" target="_blank" rel="noopener noreferrer"><code>&lt;input type="range"&gt;</code></a> can, with very little styling and/or minimal scripting, be used for really engaging UX.</p>

<hr>
<h2>
  <a name="reduce-networktraffic" href="#reduce-networktraffic">
  </a>
  Reduce network-traffic
</h2>

<p>The <strong>most important</strong> thing you can do to lower your website carbon emissions, is by reducing the network-traffic on your site.</p>
<h3>
  <a name="add-lazyloading" href="#add-lazyloading">
  </a>
  Add lazy-loading
</h3>

<p>A quick win-win is by adding <code>loading="lazy"</code> to all your <code>&lt;img&gt;</code>-tags.  </p>

<p>If a user only sees the top half of your site before clicking on another page, why load all the images below-the-fold?</p>

<hr>
<h3>
  <a name="use-responsive-images-correctly" href="#use-responsive-images-correctly">
  </a>
  Use Responsive Images Correctly
</h3>

<p>Responsive images are tricky, and many sites are not using them correctly. That's partly because many CMS's have just <em>one</em> way of returning an image, unless it's a custom built component.</p>

<p>First, you need to be enable to ask the server for a specific width, using the <code>w</code>-descriptor:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;img</span> <span class="na">alt=</span><span class="s">"alt text"</span> <span class="na">src=</span><span class="s">"https://your.cdn/img/IMAGE.jpg"</span> <span class="na">crossorigin=</span><span class="s">"anonymous"</span> <span class="na">decoding=</span><span class="s">"async"</span> <span class="na">loading=</span><span class="s">"lazy"</span>
<span class="na">srcset=</span><span class="s">"
    https://your.cdn/img/IMAGE.jpg?w=250 250w,
    https://your.cdn/img/IMAGE.jpg?w=450 450w,
    https://your.cdn/img/IMAGE.jpg?w=650 650w,
    https://your.cdn/img/IMAGE.jpg?w=850 850w,
    https://your.cdn/img/IMAGE.jpg?w=1050 1050w,
    https://your.cdn/img/IMAGE.jpg?w=1250 1250w,
    https://your.cdn/img/IMAGE.jpg?w=1450 1450w,
    https://your.cdn/img/IMAGE.jpg?w=1650 1650w,
    https://your.cdn/img/IMAGE.jpg?w=1850 1850w"</span>
<span class="na">sizes=</span><span class="s">"100vw"</span> <span class="nt">/&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>But that's just part of the puzzle, because the code above assumes the image will always be as wide as the screen: <code>sizes="100vw"</code></p>

<p>So, if your screen is minimum <code>1850px</code> wide, you'll get the <code>1850w</code>-image.</p>

<p>If it's a hero-banner, that's probably fine. But if it's an article-image, shown in a 25%-width grid, it's 4 times larger than needed!</p>

<p>Remember to use the <code>sizes</code>-attribute correctly — as an example:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;img</span> <span class="na">alt=</span><span class="s">"alt text"</span> <span class="na">src=</span><span class="s">"../assets/img/IMAGE.jpg"</span> <span class="na">crossorigin=</span><span class="s">"anonymous"</span> <span class="na">decoding=</span><span class="s">"async"</span> <span class="na">loading=</span><span class="s">"lazy"</span>
<span class="na">srcset=</span><span class="s">"
    ../assets/img/IMAGE.jpg?w=250 250w,
    ../assets/img/IMAGE.jpg?w=450 450w,
    ../assets/img/IMAGE.jpg?w=650 650w,
    ../assets/img/IMAGE.jpg?w=850 850w,
    ../assets/img/IMAGE.jpg?w=1050 1050w,
    ../assets/img/IMAGE.jpg?w=1250 1250w,
    ../assets/img/IMAGE.jpg?w=1450 1450w,
    ../assets/img/IMAGE.jpg?w=1650 1650w,
    ../assets/img/IMAGE.jpg?w=1850 1850w"</span>
<span class="na">sizes=</span><span class="s">"(min-width: 768px) and (max-width: 1199px) 50vw,
(min-width: 1200px) 33vw,
100vw"</span> <span class="nt">/&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>In this example, the browser will find the image that's closest to the matching media-query in the <code>sizes</code>-attribute. On smaller devices, it will find the image closest to the actual device-width (<code>100vw</code>), while on devices between <code>768px</code> and <code>1199px</code>, it will find the image closest to <em>half of that:</em> <code>50vw</code>.</p>


<hr>

<h3>
  <a name="videos" href="#videos">
  </a>
  Videos
</h3>

<p>Like images, there's no need to load a video if it's "below the fold", and the user never watches it.  </p>

<p>Videos need to lazy-load as well. Iframe-based videos (like YouTube or Vimeo) can use <code>loading="lazy"</code> like images, while HTML <code>&lt;video&gt;</code>s need to have <code>preload="none"</code>.</p>

<p>If the user has <code>Save-Data</code> enabled, do <strong>not</strong> autoplay videos.  </p>

<p>A video needs to pause when:</p>

<ol>
<li>You click on <em>another</em> video</li>
<li>Another video within the viewport has <code>autoplay</code> enabled</li>
<li>The video leaves the viewport</li>
<li>You go to another browser-tab</li>
</ol>


<hr>

<h3>
  <a name="cache" href="#cache">
  </a>
  Cache
</h3>

<p>The more you cache, the less network-traffic. Simple as that!</p>

<p>A CDN like Cloudflare has excellent caching, and you can control what to cache and for how long.</p>

<p>But you can also cache assets that do not change often with a <em>Service Worker</em>.</p>

<p>And while you're at it, make an <strong>offline</strong> version of your site as well!</p>


<hr>

<h2>
  <a name="simplify-the-userjourney" href="#simplify-the-userjourney">
  </a>
  Simplify the user-journey
</h2>

<p>My former colleague, Tim Benniks, has written an <a href="https://www.valtech.com/insights/make-the-web-greener-luxury-edition/" target="_blank" rel="noopener noreferrer">excellent article</a> on sustainability, and one of his key points is:</p>

<blockquote>
<p>We [normally] want visitors to explore the brand, linger and become influenced by the product story. They should become lifelong customers. Sadly, this goes against what is best practice for websites with a low carbon footprint.</p>
</blockquote>

<p>So, we <strong>don't want users to spend too much time on a website!</strong></p>

<p>Instead, we should focus on <strong>simplifying the user-journey</strong>.</p>

<p>I think everyone have tried to look for "shipping cost" on an ecommerce-site, and, not being able to find any relevant information, added an item to the basket. </p>

<p>With <em>still</em> no info on "shipping-cost", I've personally then filled out dummy contact-details until I <em>finally</em> reached a page with the calculated shipping-cost — which were then too high, and I abandoned the site!</p>

<p>I've no idea what the carbon emission footprint is for all these sites with miserable user-journeys, but I assume it's a lot!</p>


<hr>

<p>Yesterday, <em>A Book Apart</em>, published a new book on the topic:</p>

<blockquote>
<p>In <a href="https://abookapart.com/products/sustainable-web-design" target="_blank" rel="noopener noreferrer">Sustainable Web Design</a>, Tom Greenwood offers a practical path to faster, more carbon-efficient websites that are not only better for the planet, but better for our users.</p>
</blockquote>

<p>I've only started reading it, but so far it's <strong>excellent!</strong></p>

<p>Thanks for reading!</p>
