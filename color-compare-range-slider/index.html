			<h1>Color Compare Range Slider</h1>
			<p>For this week's Codepen Challenge, I did a <strong>Color Compare Range Slider</strong>. It's using an <code>&lt;input type="range"&gt;</code> to switch between two selectable colors of your own choice.</p>

<p>A Codepen-user asked this:</p>

<blockquote>
<p>How did you do this?</p>
</blockquote>

<p>It's not super complex, but requires a lot of visuals to explain, so let's dive in!</p>


<hr>

<p>First, you need an image where all the pixels you <strong>do not</strong> want to color, are transparent:</p>

<p><a href="assets/1502868/73f555ab.jpg" class="article-body-image-wrapper"><img src="assets/1502868/73f555ab.jpg" alt="Image of a car" loading="lazy" width="800" height="450"></a></p>

<p>The same image will be used <strong>twice:</strong> Once as a regular image in an <code>&lt;img&gt;</code>-tag, and as a custom property: <code>--cc-mask:url(path-to-image)</code>.</p>


<hr>

<p>Then you style an <code>&lt;input type="range"&gt;</code>:</p>

<p><a href="assets/1502868/b9c30d2d.jpg" class="article-body-image-wrapper"><img src="assets/1502868/b9c30d2d.jpg" alt="Range Slider Basic" loading="lazy" width="800" height="450"></a></p>

<p>The background is a <code>linear-gradient</code> with a hard stop-point behind the thumb (the grey bar):<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.selector</span> <span class="p">{</span>
  <span class="nl">background-image</span><span class="p">:</span> <span class="n">linear-gradient</span><span class="p">(</span>
    <span class="n">to</span> <span class="nb">right</span><span class="p">,</span>
    <span class="n">var</span><span class="p">(</span><span class="n">--_c1</span><span class="p">)</span> <span class="m">0</span> <span class="n">var</span><span class="p">(</span><span class="n">--_x</span><span class="p">),</span>
    <span class="n">var</span><span class="p">(</span><span class="n">--_c2</span><span class="p">)</span> <span class="m">0</span> <span class="n">var</span><span class="p">(</span><span class="n">--_x</span><span class="p">)</span>
  <span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><code>--_c1</code> and <code>--_c2</code> are the colors. These are updated from JavaScript, when you select a different color. The <code>--_x</code> is the current <strong>value</strong> of the range-slider.</p>

<p>Then you add the image as a <code>mask</code> and set <code>mix-blend-mode</code> to <code>multiply</code>:</p>

<p><a href="assets/1502868/03d97c61.jpg" class="article-body-image-wrapper"><img src="assets/1502868/03d97c61.jpg" alt="Mask" loading="lazy" width="800" height="450"></a></p>

<p>You then add the <code>&lt;img&gt;</code> <strong>behind</strong> the range-slider, and we're almost there:</p>

<p><a href="assets/1502868/8ea7dfd7.jpg" class="article-body-image-wrapper"><img src="assets/1502868/8ea7dfd7.jpg" loading="lazy" width="800" height="450"></a></p>

<p>Finally, we'll add two <code>&lt;input type="color"&gt;</code>.</p>

<p>I'm using two small helper-scripts, one for setting the scope of a CSS Custom Property and one for setting the property (see the code in the Codepen below).</p>

<p>On the wrapper, <code>&lt;fieldset&gt;</code>, we add an <code>eventListener</code>, that'll update the three CSS Custom Properties we're using:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nx">fieldset</span><span class="p">.</span><span class="nf">addEventListener</span><span class="p">(</span><span class="dl">'</span><span class="s1">input</span><span class="dl">'</span><span class="p">,</span>
  <span class="nx">event</span> <span class="o">=&gt;</span> <span class="nf">property</span><span class="p">(</span><span class="nx">event</span><span class="p">.</span><span class="nx">target</span><span class="p">))</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And that's it — hope it makes sense!</p>
