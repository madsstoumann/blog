			<h1>Weather Widgets</h1>
			<p>Everyone talks about it — but no one does anything about it. What? The weather, of course! So, at this year's <em>Developer Day</em> at AKQA Denmark, we decided to do something about it.</p>

<p>Developers were asked to use AI to create movie-inspired weather widgets. The results were amazing! A Ghostbuster-themed New York forecast; the weather in Rome set in a Gladiator-inspired arena; a futuristic, gloomy Bladerunner L.A. forecast. The exercise was fun for both backend- and frontend developers alike, using Claude Code, Vercel v0 and more.</p>

<p>Afterwards, I decided to recreate the <strong>Apple Weather Widgets</strong> using a single baseline weather widget web component. Most of the widgets are using <strong>other</strong> components I've created recently (and written about here on dev.to), so there wasn't that much to code!</p>

<h2>
  <a name="data" href="#data">
  </a>
  Data
</h2>

<p>Data is coming from WeatherAPI.com. They have a bunch of APIs, all with a generous free tier. For this project, I used the <strong>forecast API</strong>:<br>
</p>

  <span class="nx">key</span><span class="o">=</span><span class="nx">$</span><span class="p">{</span><span class="nx">env</span><span class="p">.</span><span class="nx">WEATHER_API_KEY</span><span class="p">}</span><span class="o">&amp;</span>

<p>Since I also use data from OpenStreetMap (with local country- and city-names), I created a Cloudflare Worker (using the KV store for API keys), filtering the merged data to only return what I need.</p>

<p>For these demos however, in order not to spend my free API calls at WeatherAPI, we use a static JSON file.</p>


<hr>

<h2>
  <a name="baseline" href="#baseline">
  </a>
  Baseline
</h2>

<p>The baseline component is mostly handling locales and units. In the weather-data we get both celsius, fahrenheit, miles, kilometers etc., so the component is handling <code>lang</code> and <code>locale</code> for us, so the user — depending on these — see the correct values.</p>


<hr>

<h2>
  <a name="widgets" href="#widgets">
  </a>
  Widgets
</h2>

<p>But let's take a look at the individual widgets — there are 13 of them! <strong>Note</strong>, that most of the widgets are using container queries, changing layout depending on their width.</p>

<h2>
  <a name="an-even-greater-overview" href="#an-even-greater-overview">
  </a>
  An even greater overview
</h2>

<p>I love Apple's Weather Widgets - and on MacOS you get a complete overview including <strong>all</strong> the widgets. I had to do that one as well — and it's here, you can see the power of container queries, as the widgets "morph" themselves depending on screen width.</p>

<p>Container queries allow each widget to respond to its own width rather than the viewport width. This means a widget can be compact when placed in a narrow column, showing just essential data, then automatically expand to reveal charts, graphs, and additional details when given more space. This self-contained responsiveness is what makes the widgets truly reusable across different layouts.</p>

<p>I urge you to open this one in a new window and resize your browser!</p>

</iframe>
</p>
