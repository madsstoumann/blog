			<h1>Accessible Circular Sliders</h1>
			<p>Just a few years ago, it was almost impossible to create range sliders without <em>a lot</em> of JavaScript. Thankfully, in modern browsers, it's super-easy to style range sliders, using CSS only. If the browser supports <em>CSS Custom Properties</em>, it's even possible to use the same styles for a wide range of different styles, just by updating a few properties.</p>

<p>I created these sliders recently, using only CSS:</p>

<p><a href="assets/546651/f221d3bf.jpg" class="article-body-image-wrapper"><img src="assets/546651/f221d3bf.jpg" alt="Range Sliders" loading="lazy" width="800" height="587"></a></p>

<p>JavaScript is only used to set the <code>value</code> of the slider as a <em>custom property</em>, that then is used in a CSS <code>linear-gradient</code> to create the "fill".</p>

<p>Accessibility is "built-in": you can <code>:focus</code>, and use <code>arrow</code>-keys for navigation.</p>

<h2>
  <a name="but-what-about-circular-sliders" href="#but-what-about-circular-sliders">
  </a>
  But what about <em>Circular Sliders?</em>
</h2>

<p>I've always had a soft spot for circular sliders — don't know why, really. So I tried to style the <code>&lt;input type="range" /&gt;</code> as a circle, and the <code>thumb</code>-shadow-element as a draggable, smaller circle.</p>

<p>Visually, it was possible using only CSS:</p>

<p><a href="assets/546651/58e2d7c0.jpg" class="article-body-image-wrapper"><img src="assets/546651/58e2d7c0.jpg" alt="Circular Range" loading="lazy" width="286" height="304"></a></p>

<p>But the movement of the thumb-circle was still <em>horizontal</em>. <br>
I then tried to update a custom property with the <code>value</code> of the <code>&lt;input&gt;</code>, and used that in a <code>transform</code>, rotating the <code>track</code> of the <code>&lt;input&gt;</code> and a negative <code>margin-left</code> to position the thumb.</p>

<p>But, alas, although it <em>was</em> possible to move the thumb along the edges of the circle using arrow-keys, it didn't really work using pointer-devices.</p>

<p>So in the end, I had to call my father, a retired maths teacher, to brush up my trigonometry and understanding of arctangents, in order to create these accessible, circular sliders:</p>

<p><iframe height="600" src="https://codepen.io/stoumann/embed/mdrEEMw?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
</p>

<p>They are <code>:focus</code>'able, and use the same <code>arrow</code>-keys as regular range-sliders. The <code>fill</code> is a CSS <code>conic-gradient</code>.</p>

<p>Thanks for reading!</p>
