			<h1>When Lighthouse Itself Causes Issues</h1>
			<p>I was re-inspecting my homepage after some edits earlier today, and discovered — to my horror 😱 — that my perfect score was not so perfect anymore.</p>

<p>The <em>Best Practices</em> were down to 93%. Why?</p>

<p>After some digging, I found this post:<br>
<a href="https://github.com/GoogleChrome/lighthouse/issues/11862" target="_blank" rel="noopener noreferrer">Lighthouse Complaining About CSP Violation</a></p>

<p>And ... it's right! If I add the <strong>unsafe-inline</strong>-entry to the <strong>styles-src</strong> of my <em>content-security-policy</em>, it's back at 100%.</p>

<p>I won't do that, of course — but interesting to notice, that Lighthouse itself can cause issues!</p>
