			<h1>Liquorice Allsorts</h1>
			<p><em>This is a submission for DEV Challenge v24.03.20, CSS Art: Favorite Snack.</em></p>

<h2>
  <a name="inspiration" href="#inspiration">
  </a>
  Inspiration
</h2>

<p>Liquorice allsorts — my favourite snack, although not good for my blood pressure 😁</p>

<h2>
  <a name="demo" href="#demo">
  </a>
  Demo
</h2>

<p><iframe height="600" src="https://codepen.io/stoumann/embed/LYMKNRq?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
</p>

<h2>
  <a name="journey" href="#journey">
  </a>
  Journey
</h2>

<p>Each delicious piece is a <code>&lt;ul&gt;</code>-tag with a <code>&lt;li&gt;</code> for each "layer":</p>

<p><a href="assets/1797046/68355a48.jpg" class="article-body-image-wrapper"><img src="assets/1797046/68355a48.jpg" alt="Layers" loading="lazy" width="276" height="261"></a><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;ul&gt;</span>
  <span class="nt">&lt;li</span> <span class="na">style=</span><span class="s">"--bg:#61442c"</span><span class="nt">&gt;&lt;/li&gt;</span>
  <span class="nt">&lt;li</span> <span class="na">style=</span><span class="s">"--bg:#262626"</span><span class="nt">&gt;&lt;/li&gt;</span>
  <span class="nt">&lt;li</span> <span class="na">style=</span><span class="s">"--bg:#61442c"</span><span class="nt">&gt;&lt;/li&gt;</span>
  <span class="nt">&lt;li</span> <span class="na">style=</span><span class="s">"--bg:#262626"</span><span class="nt">&gt;&lt;/li&gt;</span>
  <span class="nt">&lt;li</span> <span class="na">style=</span><span class="s">"--bg:#61442c"</span><span class="nt">&gt;&lt;/li&gt;</span>
<span class="nt">&lt;/ul&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>

</svg>

    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>

<p>And CSS:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">li</span> <span class="p">{</span>
  <span class="py">--h</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--w</span><span class="p">)</span> <span class="p">/</span> <span class="m">6</span><span class="p">);</span>
  <span class="nl">background</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--bg</span><span class="p">);</span>
  <span class="py">grid-area</span><span class="p">:</span> <span class="m">1</span> <span class="p">/</span> <span class="m">1</span><span class="p">;</span>
  <span class="nl">height</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--w</span><span class="p">);</span>
  <span class="nl">list-style</span><span class="p">:</span> <span class="nb">none</span><span class="p">;</span>
  <span class="nl">width</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--w</span><span class="p">);</span>
  <span class="nl">position</span><span class="p">:</span> <span class="nb">relative</span><span class="p">;</span>
<span class="p">}</span>

<span class="nt">ul</span> <span class="p">{</span>
  <span class="nl">all</span><span class="p">:</span> <span class="n">unset</span><span class="p">;</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">grid</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>To position the layers with an offset, <code>--h</code> (a sixth of the width), I use:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code>  <span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">1</span><span class="o">)</span> <span class="p">{</span>
    <span class="nl">left</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">0px</span> <span class="n">-</span> <span class="p">(</span><span class="m">2</span> <span class="err">*</span> <span class="n">var</span><span class="p">(</span><span class="n">--h</span><span class="p">)));</span>
    <span class="nl">top</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">0px</span> <span class="n">-</span> <span class="p">(</span><span class="m">2</span> <span class="err">*</span> <span class="n">var</span><span class="p">(</span><span class="n">--h</span><span class="p">)));</span>
  <span class="p">}</span>
  <span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">2</span><span class="o">)</span> <span class="p">{</span>
    <span class="nl">left</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">0px</span> <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--h</span><span class="p">));</span>
    <span class="nl">top</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">0px</span> <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--h</span><span class="p">));</span>
  <span class="p">}</span>
  <span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">4</span><span class="o">)</span> <span class="p">{</span>
    <span class="nl">left</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">0px</span> <span class="n">-</span> <span class="p">(</span><span class="m">-1</span> <span class="err">*</span> <span class="n">var</span><span class="p">(</span><span class="n">--h</span><span class="p">)));</span>
    <span class="nl">top</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">0px</span> <span class="n">-</span> <span class="p">(</span><span class="m">-1</span> <span class="err">*</span> <span class="n">var</span><span class="p">(</span><span class="n">--h</span><span class="p">)));</span>
  <span class="p">}</span>
  <span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">5</span><span class="o">)</span> <span class="p">{</span>
    <span class="nl">left</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">0px</span> <span class="n">-</span> <span class="p">(</span><span class="m">-2</span> <span class="err">*</span> <span class="n">var</span><span class="p">(</span><span class="n">--h</span><span class="p">)));</span>
    <span class="nl">top</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">0px</span> <span class="n">-</span> <span class="p">(</span><span class="m">-2</span> <span class="err">*</span> <span class="n">var</span><span class="p">(</span><span class="n">--h</span><span class="p">)));</span>
  <span class="p">}</span>
</code></pre>

<p>Next, apply <code>transform: skewX(-20deg)</code> to the <code>&lt;ul&gt;</code>:</p>

<p><a href="assets/1797046/e172ae42.jpg" class="article-body-image-wrapper"><img src="assets/1797046/e172ae42.jpg" alt="Skew" loading="lazy" width="293" height="272"></a></p>

<p>Add small "triangles" to the edges with <code>::before</code> and <code>::after</code> pseudo-elements — using <code>clip-path</code> for the triangles:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">li</span> <span class="p">{</span>
  <span class="err">&amp;::after,</span> <span class="err">&amp;::before</span> <span class="err">{</span>
    <span class="nl">background</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--bg</span><span class="p">);</span>
    <span class="nl">content</span><span class="p">:</span> <span class="s2">''</span><span class="p">;</span>
    <span class="nl">height</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--h</span><span class="p">);</span>
    <span class="nl">position</span><span class="p">:</span> <span class="nb">absolute</span><span class="p">;</span>
    <span class="nl">width</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--h</span><span class="p">);</span>
  <span class="p">}</span>
  <span class="o">&amp;</span><span class="nd">::after</span> <span class="p">{</span>
    <span class="nl">clip-path</span><span class="p">:</span> <span class="n">polygon</span><span class="p">(</span><span class="m">0</span> <span class="m">0</span><span class="p">,</span> <span class="m">0</span> <span class="m">100%</span><span class="p">,</span> <span class="m">100%</span> <span class="m">100%</span><span class="p">);</span>
    <span class="nl">right</span><span class="p">:</span> <span class="m">1px</span><span class="p">;</span>
    <span class="nl">top</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">1px</span> <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--h</span><span class="p">));</span>
  <span class="p">}</span>
  <span class="o">&amp;</span><span class="nd">::before</span> <span class="p">{</span>
    <span class="nl">bottom</span><span class="p">:</span> <span class="m">1px</span><span class="p">;</span>
    <span class="nl">clip-path</span><span class="p">:</span> <span class="n">polygon</span><span class="p">(</span><span class="m">0</span> <span class="m">0</span><span class="p">,</span> <span class="m">100%</span> <span class="m">0</span><span class="p">,</span> <span class="m">100%</span> <span class="m">100%</span><span class="p">);</span>
    <span class="nl">left</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">1px</span> <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--h</span><span class="p">));</span>
  <span class="p">}</span>
<span class="err">}</span>
</code></pre>

<div class="highlight__panel-action js-fullscreen-code-action">

    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><a href="assets/1797046/02501adb.jpg" class="article-body-image-wrapper"><img src="assets/1797046/02501adb.jpg" alt="Before and after" loading="lazy" width="308" height="292"></a></p>

<p>… and finally, apply a <code>box-shadow</code> to each <code>&lt;li&gt;</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">li</span> <span class="p">{</span>
   <span class="nl">box-shadow</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">0px</span> <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--h</span><span class="p">))</span> <span class="n">calc</span><span class="p">(</span><span class="m">0px</span> <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--h</span><span class="p">))</span> <span class="m">0</span> <span class="m">0px</span> <span class="n">var</span><span class="p">(</span><span class="n">--bg</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><a href="assets/1797046/748e090d.jpg" class="article-body-image-wrapper"><img src="assets/1797046/748e090d.jpg" alt="Box Shadow" loading="lazy" width="310" height="287"></a></p>

<p>And that's it! All there's left to do is to add or remove layers, change colors (yellow, orange, pink, white) — and rotate them:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="k">@keyframes</span> <span class="n">rotate</span> <span class="p">{</span>
  <span class="err">0</span><span class="o">%</span> <span class="p">{</span> <span class="py">rotate</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--d</span><span class="p">);</span> <span class="p">}</span>
  <span class="err">100</span><span class="o">%</span> <span class="p">{</span> <span class="py">rotate</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">360deg</span> <span class="err">+</span> <span class="n">var</span><span class="p">(</span><span class="n">--d</span><span class="p">));</span> <span class="p">}</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>— where <code>--d</code> is a rotation angle set on each <code>&lt;ul&gt;</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;ul</span> <span class="na">style=</span><span class="s">"--d:91deg;"</span><span class="nt">&gt;</span> ... <span class="nt">&lt;/ul&gt;</span>
</code></pre>

</svg>

</svg>

</div>
</div>
</div>



<p>Enjoy your snack!</p>
