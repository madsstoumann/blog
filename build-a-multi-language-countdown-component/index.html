		<article>
			<h1>Build a Multi-Language Countdown Component</h1>
			<p>Some years ago, I built a countdown component with support for multiple languages. Editors had to fill in labels like "days", "hours" and "minutes" for each language — in both singular and plural versions. Luckily, things have greatly improved since then!</p>

<p>In this tutorial, we'll be building a vanilla countdown component that'll work with <strong>all languages</strong> — without having to fill out any labels per language.</p>

<p>We'll be using the <code>Intl.RelativeTimeFormat</code> and <code>Intl.NumberFormat</code> API's to build a countdown component like this:</p>

<p><a href="assets/1165782/e41666bd.jpg" class="article-body-image-wrapper"><img src="assets/1165782/e41666bd.jpg" alt="Countdown" loading="lazy" width="494" height="167"></a></p>

<p>Then, by simply changing the <code>lang</code>-attribute, we'll create variations like these:<br>
</p>

<pre class="highlight html"><code>lang="fa-IR"
</code></pre>

<p>Cool, right? Let's get started!</p>


<hr>

<h2>
  <a name="html" href="#html">
  </a>
  HTML
</h2>

<p>We'll be using the <code>&lt;time&gt;</code>-tag, with the end-date set in the <code>datetime</code>-property:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;time</span> <span class="na">datetime=</span><span class="s">"2023-01-01"</span><span class="nt">&gt;&lt;/time&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>If you want your countdown to end at a specific <strong>time</strong> also, add that to the string:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;time</span> <span class="na">datetime=</span><span class="s">"2022-08-12T09:30:00+02:00"</span><span class="nt">&gt;&lt;/time&gt;</span> 
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<blockquote>
<p><strong>NOTE:</strong> Remember to add the <strong>timezone offset</strong> of the location, where the countdown expires. This shouldn't be the server-time, as your location might be in central Europe, while your server/CDN is in the US. In the example above, the offset is <code>+02:00</code>.</p>
</blockquote>


<hr>

<h2>
  <a name="javascript" href="#javascript">
  </a>
  JavaScript
</h2>

<p>We'll create a new function with a single argument, <code>element</code>, which is a reference to the main element (<code>&lt;time&gt;</code>):<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">function</span> <span class="nf">countDown</span><span class="p">(</span><span class="nx">element</span><span class="p">)</span> <span class="p">{</span> <span class="p">...</span> <span class="p">}</span>
</code></pre>

</svg>

</div>
</div>
</div>



<p>Next, we'll set up some consts and defaults:</p>

<h3>
  <a name="locale" href="#locale">
  </a>
  Locale
</h3>

<p>The locale is the most important part. This code will look for a <code>lang</code>-attribute on the main element, then — if not found — on the page itself, and finally return a fallback,  using <code>en-US</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">locale</span> <span class="o">=</span> <span class="nx">element</span><span class="p">.</span><span class="nx">lang</span> <span class="o">||</span> <span class="nb">document</span><span class="p">.</span><span class="nx">documentElement</span><span class="p">.</span><span class="nf">getAttribute</span><span class="p">(</span><span class="dl">'</span><span class="s1">lang</span><span class="dl">'</span><span class="p">)</span> <span class="o">||</span> <span class="dl">'</span><span class="s1">en-US</span><span class="dl">'</span><span class="p">;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>

</svg>

</div>
</div>
</div>



<h3>
  <a name="enddatetime" href="#enddatetime">
  </a>
  End-date/time
</h3>

<p>The end-time is the <code>datetime</code>-attribute from the main element, converted to time:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">endTime</span> <span class="o">=</span> <span class="k">new</span> <span class="nc">Date</span><span class="p">(</span><span class="nx">element</span><span class="p">.</span><span class="nf">getAttribute</span><span class="p">(</span><span class="dl">'</span><span class="s1">datetime</span><span class="dl">'</span><span class="p">)).</span><span class="nf">getTime</span><span class="p">();</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

<h3>
  <a name="apis" href="#apis">
  </a>
  API's
</h3>

<p>Finally, we create an instance of <code>Intl.RelativeTimeFormat</code> — as well as storing a const with the locale-value of zero (more on that later!):<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">rtf</span> <span class="o">=</span> <span class="k">new</span> <span class="nx">Intl</span><span class="p">.</span><span class="nc">RelativeTimeFormat</span><span class="p">(</span><span class="nx">locale</span><span class="p">,</span> <span class="p">{</span> <span class="na">numeric</span><span class="p">:</span> <span class="dl">"</span><span class="s2">auto</span><span class="dl">"</span> <span class="p">});</span>
<span class="kd">const</span> <span class="nx">zero</span> <span class="o">=</span> <span class="k">new</span> <span class="nx">Intl</span><span class="p">.</span><span class="nc">NumberFormat</span><span class="p">(</span><span class="nx">locale</span><span class="p">).</span><span class="nf">format</span><span class="p">(</span><span class="mi">0</span><span class="p">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>




<hr>

<h2>
  <a name="showing-time" href="#showing-time">
  </a>
  Showing Time
</h2>

<p>Now, for the code that returns and formats the time and it's sub-parts:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">showTime</span> <span class="o">=</span> <span class="p">()</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">remainingTime</span> <span class="o">=</span> <span class="nf">getRemainingTime</span><span class="p">(</span><span class="nx">endTime</span><span class="p">);</span>
  <span class="nx">element</span><span class="p">.</span><span class="nx">innerHTML</span> <span class="o">=</span> 
    <span class="nf">timePart</span><span class="p">(</span><span class="nb">Math</span><span class="p">.</span><span class="nf">floor</span><span class="p">(</span><span class="nx">remainingTime</span> <span class="o">/</span> <span class="p">(</span><span class="mi">24</span> <span class="o">*</span> <span class="mi">60</span> <span class="o">*</span> <span class="mi">60</span> <span class="o">*</span> <span class="mi">1000</span><span class="p">)),</span> <span class="dl">'</span><span class="s1">day</span><span class="dl">'</span><span class="p">)</span> <span class="o">+</span>
    <span class="nf">timePart</span><span class="p">(</span><span class="nb">Math</span><span class="p">.</span><span class="nf">floor</span><span class="p">((</span><span class="nx">remainingTime</span> <span class="o">/</span> <span class="p">(</span><span class="mi">60</span> <span class="o">*</span> <span class="mi">60</span> <span class="o">*</span> <span class="mi">1000</span><span class="p">))</span> <span class="o">%</span> <span class="mi">24</span><span class="p">),</span> <span class="dl">'</span><span class="s1">hour</span><span class="dl">'</span><span class="p">)</span> <span class="o">+</span>
    <span class="nf">timePart</span><span class="p">(</span><span class="nb">Math</span><span class="p">.</span><span class="nf">floor</span><span class="p">((</span><span class="nx">remainingTime</span> <span class="o">/</span> <span class="p">(</span><span class="mi">60</span> <span class="o">*</span> <span class="mi">1000</span><span class="p">))</span> <span class="o">%</span> <span class="mi">60</span><span class="p">),</span> <span class="dl">'</span><span class="s1">minute</span><span class="dl">'</span><span class="p">)</span> <span class="o">+</span>
    <span class="nf">timePart</span><span class="p">(</span><span class="nb">Math</span><span class="p">.</span><span class="nf">floor</span><span class="p">((</span><span class="nx">remainingTime</span> <span class="o">/</span> <span class="mi">1000</span><span class="p">)</span> <span class="o">%</span> <span class="mi">60</span><span class="p">),</span> <span class="dl">'</span><span class="s1">second</span><span class="dl">'</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>

<p>The function calls a helper-method, that deduct the current time from 'end-time':<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">getRemainingTime</span> <span class="o">=</span> <span class="p">(</span><span class="nx">endTime</span><span class="p">,</span> <span class="nx">currentTime</span> <span class="o">=</span> <span class="k">new</span> <span class="nc">Date</span><span class="p">().</span><span class="nf">getTime</span><span class="p">())</span> <span class="o">=&gt;</span> <span class="nx">endTime</span> <span class="o">-</span> <span class="nx">currentTime</span><span class="p">;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>

</svg>

<p>... as well as <code>timePart</code>, the <strong>most important</strong> function, that returns locale-formatted time:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">timePart</span> <span class="o">=</span> <span class="p">(</span><span class="nx">part</span><span class="p">,</span> <span class="nx">type</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">parts</span> <span class="o">=</span> <span class="nx">rtf</span><span class="p">.</span><span class="nf">formatToParts</span><span class="p">(</span><span class="nx">part</span> <span class="o">===</span> <span class="mi">0</span> <span class="p">?</span> <span class="mi">2</span> <span class="p">:</span> <span class="nx">part</span><span class="p">,</span> <span class="nx">type</span><span class="p">);</span>
  <span class="k">if </span><span class="p">(</span><span class="nx">parts</span> <span class="o">&amp;&amp;</span> <span class="nx">parts</span><span class="p">.</span><span class="nx">length</span> <span class="o">===</span> <span class="mi">3</span><span class="p">)</span> <span class="nx">parts</span><span class="p">.</span><span class="nf">shift</span><span class="p">();</span>
  <span class="kd">const</span> <span class="p">[</span><span class="nx">unit</span><span class="p">,</span> <span class="nx">label</span><span class="p">]</span> <span class="o">=</span> <span class="nx">parts</span><span class="p">;</span> 
  <span class="k">return</span> <span class="s2">`&lt;span&gt;&lt;strong&gt;</span><span class="p">${</span><span class="nx">part</span> <span class="o">===</span> <span class="mi">0</span> <span class="p">?</span> <span class="nx">zero</span> <span class="p">:</span> <span class="nx">unit</span><span class="p">.</span><span class="nx">value</span><span class="p">}</span><span class="s2">&lt;/strong&gt;&lt;small&gt;</span><span class="p">${</span><span class="nx">label</span><span class="p">.</span><span class="nx">value</span><span class="p">}</span><span class="s2">&lt;/small&gt;&lt;/span&gt;`</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>

</svg>

</div>
</div>
</div>



<p><code>formatToParts</code> returns an array of time-units and labels in the locale-language. We spread these into <code>unit</code> and <code>label</code>, and output them in <code>strong&gt;</code> and <code>&lt;small&gt;</code>-tags (feel free to replace with whatever tags you want!).</p>

<h3>
  <a name="requestanimationframe" href="#requestanimationframe">
  </a>
  requestAnimationFrame
</h3>

<p>The <code>showTime</code>-function need to call itself continuously, for which we use <code>requestAnimationFrame</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="k">if </span><span class="p">(</span><span class="nx">remainingTime</span> <span class="o">&gt;=</span> <span class="mi">1000</span><span class="p">)</span> <span class="nf">requestAnimationFrame</span><span class="p">(</span><span class="nx">showTime</span><span class="p">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>




<hr>

<h2>
  <a name="zero-is-plural" href="#zero-is-plural">
  </a>
  Zero is Plural
</h2>

<p>Now, you might wonder why I call <code>formatToParts</code> with <code>2</code>, if the value itself is <code>0</code> (zero). That's because <code>Intl.RelativeTimeFormat</code> will return the string "now" (in the locale-language), if the value is zero — and <strong>no</strong> label (for some reason). </p>

<p>We don't want that, but neither do we want to show the english zero in languages that have their own zero!</p>

<p>That's why, in the beginning, we declared this:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">zero</span> <span class="o">=</span> <span class="k">new</span> <span class="nx">Intl</span><span class="p">.</span><span class="nc">NumberFormat</span><span class="p">(</span><span class="nx">locale</span><span class="p">).</span><span class="nf">format</span><span class="p">(</span><span class="mi">0</span><span class="p">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>For the label, we need a value larger than <code>1</code>. If we use "seconds" as an example, the value <code>1</code>, will return the label "second", while the value <code>2</code> will return "seconds". Zero is plural (you say "zero seconds", not "zero second"), hence the <code>2</code> 😄</p>

<p>Confused? So was I!</p>


<hr>

<p>Finally, to initialize and run it:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nf">requestAnimationFrame</span><span class="p">(</span><span class="nx">showTime</span><span class="p">);</span>
</code></pre>

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>

<p>Phew! A lot of code, but only approx. <strong>400 bytes</strong> when minified and gzipped!</p>

<h2>
  <a name="css" href="#css">
  </a>
  CSS
</h2>

<p>The CSS is simply a grid, see the demo below for details. I like to use CSS Custom Props for the parts of a component, that can have variations. The format I prefer is [component]-[part]-[emmet abbrevation of property], so:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.variant</span> <span class="p">{</span>
<span class="py">--countdown-bgc</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="m">0</span><span class="p">,</span> <span class="m">35%</span><span class="p">,</span> <span class="m">45%</span><span class="p">);</span>
<span class="py">--countdown-time-bgc</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="m">0</span><span class="p">,</span> <span class="m">35%</span><span class="p">,</span> <span class="m">80%</span><span class="p">);</span>
<span class="py">--countdown-time-lbl-c</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="m">0</span><span class="p">,</span> <span class="m">35%</span><span class="p">,</span> <span class="m">15%</span><span class="p">);</span>
<span class="py">--countdown-time-val-c</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="m">0</span><span class="p">,</span> <span class="m">35%</span><span class="p">,</span> <span class="m">25%</span><span class="p">);</span>
<span class="p">}</span>
