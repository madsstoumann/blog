			<h1>Accessible Color Pickers</h1>
			<p>Most of the Color Pickers I've seen and used, haven't been accessible. They've been touch-friendly, but not keyboard-friendly.</p>

<p>So, I set out to create a Color Picker with range-sliders, which are both touch- <strong>and</strong> keyboard-friendly (using arrow-keys).</p>

<p>For that, the <strong>hsl-format</strong> (hue, saturation, lightness) is perfect. "Hue" is the recognisable "rainbow", also often seen as a color wheel. </p>

<p>"Saturation" and "Lightness" are normally "merged" into two overlapping gradients with a single x/y-selector. </p>

<p>Here, they appear as two individual sliders:</p>

<p><a href="assets/544006/3360999c.jpg" class="article-body-image-wrapper"><img src="assets/544006/3360999c.jpg" alt="full" loading="lazy" width="800" height="444"></a></p>

<p><strong>Implementaion</strong></p>

<p>I recommend using an <code>&lt;input type="text"&gt;</code>, since the <code>value</code> of this type supports any string. <code>&lt;input type="color"&gt;</code> only supports a 7-char hex-code.</p>

<p>The Color Picker can be configured with some options as well:</p>

<p><strong>Output-formats</strong></p>

<ul>
<li>cmyk</li>
<li>hex (default)</li>
<li>hsl</li>
<li>rgb</li>
</ul>

<p><strong>Size</strong></p>

<ul>
<li>full (default)</li>
<li>micro (no alpha-channel, use for <code>&lt;input type="color"&gt;</code> ):</li>
</ul>

<p><a href="assets/544006/b18333bd.jpg" class="article-body-image-wrapper"><img src="assets/544006/b18333bd.jpg" alt="micro" loading="lazy" width="528" height="236"></a></p>

<ul>
<li>mini:</li>
</ul>

<p><a href="assets/544006/30423e26.jpg" class="article-body-image-wrapper"><img src="assets/544006/30423e26.jpg" alt="mini" loading="lazy" width="528" height="324"></a></p>

<p>And, if you want to use the trigger (the <code>&lt;input&gt;</code> itself) as preview, the value "update" will hide the preview of the Color Picker:</p>

<p><a href="assets/544006/e67181c0.jpg" class="article-body-image-wrapper"><img src="assets/544006/e67181c0.jpg" alt="mini-update" loading="lazy" width="528" height="300"></a></p>

<p><strong>Examples:</strong><br>
<code>&lt;input type="text" data-colorpicker="rgb mini"&gt;</code><br>
<code>&lt;input type="text" data-colorpicker="hsl micro update"&gt;</code></p>

<p><strong>Keyboard Shortcuts:</strong></p>

<p><code>&lt;input&gt;</code>-trigger:</p>

<ul>
<li>
<code>ArrowDown</code> : Open ColorPicker.</li>
<li>
<code>Escape</code> : Close ColorPicker.</li>
</ul>

<p>ColorPicker:</p>

<ul>
<li>
<code>Arrow Keys</code> : Change value on selected input.</li>
<li>
<code>Enter</code> : Close ColorPicker, set value.</li>
<li>
<code>Escape</code> : Close ColorPicker, do <strong>not</strong> set value.</li>
<li>
<code>Tab</code> : Go to next element.  When tabbing away from last input, the ColorPicker wll close and re-focus on the input/trigger.</li>
</ul>
