<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Mads Stoumann's blog about web development, CSS, JavaScript, and frontend technologies">
	<base href="/">
	<title>Mads Stoumann's Blog</title>
	<style>
		body {
			background: canvas;
			color: canvastext;
			color-scheme: light dark;
			margin: 0;
		}
	</style>
	<script>
		// Restore slug path from 404.html redirect
		const redirectPath = sessionStorage.getItem('redirect');
		if (redirectPath) {
			sessionStorage.removeItem('redirect');
			history.replaceState(null, '', redirectPath);
		}
	</script>
</head>
<body>
	<dev-to
		author="madsstoumann"
		baseurl="./data"
		theme="classic"
		itemsperpage="10">
		<h1 slot="headline">Mads Stoumann's Blog</h1>
  	<p slot="description">Articles about CSS, JavaScript, and web development.</p>
	</dev-to>
	<script type="module">
		import 'https://browser.style/ui/dev-to/index.js';
	</script>
</body>
</html>
