			<h1>:target the dialog!</h1>
			<p>Here&#8217;s a small <abbr title="Cascading Style Sheet">CSS</abbr>-hack I came up with while working with the UI for <a href="http://demo.logifront.com/minify.html" target="_blank">LogiFront 2.0</a>:</p>
<p>Use the CSS <strong>:target</strong> pseudo-selector for dialogs/popups, until the &lt;dialog&gt;-tag has better browser-support.</p>
<p>Here&#8217;s the idea, simplified:</p>
<pre class="brush: xml; title: ; notranslate" title="">
&lt;a href=&quot;#myDialog&quot;&gt;Open dialog&lt;/a&gt;

&lt;dialog id=&quot;myDialog&quot;&gt;
  &lt;h2&gt;Hello world!&lt;/h2&gt;
  &lt;a href=&quot;#&quot;&gt;Close dialog&lt;/a&gt;
&lt;/dialog&gt;

</pre>
<p>And the CSS:</p>
<pre class="brush: css; title: ; notranslate" title="">
dialog {display: none;}
dialog:target {display: block;}
</pre>
<h3>LogiFront 2.0 UI</h3>
<p>Go to <a href="http://demo.logifront.com/minify.html" target="_blank">demo.logifront.com</a> to view extended examples.<br />
All the links at the left sidebar (&#8220;Controls&#8221;) are using dialog/target.<br />
LogiFront is an online tool for building apps and forms &#8211; <a href="http://www.youtube.com/watch?v=vJMvLUxJw4s" target="_blank">watch the introduction video here!</a></p>
