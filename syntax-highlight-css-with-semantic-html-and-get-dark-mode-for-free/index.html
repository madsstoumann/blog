		<article>
			<h1>Syntax-Highlight CSS with Semantic HTML — and get Dark Mode for free</h1>
			<p>When we syntax highlight CSS-code, we typically use a JavaScript library, that turns the CSS into a bunch of <code>&lt;span&gt;</code>-tags with different <code>class</code>’es.</p>

<p>I thought it could be fun to <code>HTML</code>’ify the CSS and turn it into meaningful semantics. But which tags should represent a CSS rule? </p>

<p>CSS is written as <strong>rules</strong>, which consist of a <strong>selector group</strong> and a <strong>declaration block</strong>.</p>

<p>The latter contains one or more <strong>property/value</strong>-pairs.</p>

<p><em>Example:</em><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.selector</span> <span class="p">{</span>
  <span class="c">/* declaration block */</span>
  <span class="py">property</span><span class="p">:</span> <span class="n">value</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>A stylesheet — at least to me — is like an unordered list (<code>&lt;ul&gt;</code>), with each item (<code>&lt;li&gt;</code>) representing a <strong>rule</strong>. </p>

<p>Any heading tag (<code>&lt;h2&gt;, &lt;h3&gt;</code> etc.) will work as the <strong>selector group</strong> — and a <a href="https://developer.mozilla.org/en-US/docs/Web/HTML/Element/dl" target="_blank" rel="noopener noreferrer">description list</a> (<code>&lt;dl&gt;</code>) is the perfect candidate for the <strong>declaration block</strong>.</p>

<p>A CSS property will be a <em>term</em>, using the <code>&lt;dt&gt;</code>-tag, and each CSS value will be a <em>description</em>, using the <code>&lt;dd&gt;</code>-tag.</p>

<p>The <code>&lt;var&gt;</code>-tag will be used for <em>CSS Custom Properties.</em></p>

<p><em>Example:</em><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;ul&gt;</span>
  <span class="nt">&lt;li&gt;</span>
    <span class="nt">&lt;h3&gt;</span>body<span class="nt">&lt;/h3&gt;</span>
    <span class="nt">&lt;dl&gt;</span>
      <span class="nt">&lt;dt&gt;</span>accent-color<span class="nt">&lt;/dt&gt;</span>
      <span class="nt">&lt;dd&gt;&lt;var&gt;</span>AccentColor<span class="nt">&lt;/var&gt;&lt;/dd&gt;</span>
      <span class="nt">&lt;dt&gt;</span>background-color<span class="nt">&lt;/dt&gt;</span>
      <span class="nt">&lt;dd&gt;</span>Canvas<span class="nt">&lt;/dd&gt;</span>
      <span class="nt">&lt;dt&gt;</span>color<span class="nt">&lt;/dt&gt;</span>
      <span class="nt">&lt;dd&gt;&lt;var&gt;</span>ColorGray-80<span class="nt">&lt;/var&gt;&lt;/dd&gt;</span>
      <span class="nt">&lt;dt&gt;</span>color-scheme<span class="nt">&lt;/dt&gt;</span>
      <span class="nt">&lt;dd&gt;</span>light dark<span class="nt">&lt;/dd&gt;</span>
      <span class="nt">&lt;dt&gt;</span>font-family<span class="nt">&lt;/dt&gt;</span>
      <span class="nt">&lt;dd&gt;&lt;var&gt;</span>ff-sans<span class="nt">&lt;/var&gt;&lt;/dd&gt;</span>
      <span class="nt">&lt;dt&gt;</span>font-size<span class="nt">&lt;/dt&gt;</span>
      <span class="nt">&lt;dd&gt;</span>clamp(1rem, 0.8661rem + 0.4286vw, 1.1875rem)<span class="nt">&lt;/dd&gt;</span>
      <span class="nt">&lt;dt&gt;</span>line-height<span class="nt">&lt;/dt&gt;</span>
      <span class="nt">&lt;dd&gt;</span>1.5<span class="nt">&lt;/dd&gt;</span>
      <span class="nt">&lt;dt&gt;</span>margin-inline<span class="nt">&lt;/dt&gt;</span>
      <span class="nt">&lt;dd&gt;</span>auto<span class="nt">&lt;/dd&gt;</span>
      <span class="nt">&lt;dt&gt;</span>max-inline-size<span class="nt">&lt;/dt&gt;</span>
      <span class="nt">&lt;dd&gt;</span>70ch<span class="nt">&lt;/dd&gt;</span>
      <span class="nt">&lt;dt&gt;</span>padding-inline<span class="nt">&lt;/dt&gt;</span>
      <span class="nt">&lt;dd&gt;</span>2ch<span class="nt">&lt;/dd&gt;</span>
    <span class="nt">&lt;/dl&gt;</span>
  <span class="nt">&lt;/li&gt;</span>
  <span class="nt">&lt;li&gt;</span>
    <span class="nt">&lt;h3&gt;</span>img<span class="nt">&lt;/h3&gt;</span>
    <span class="nt">&lt;dl&gt;</span>
      <span class="nt">&lt;dt&gt;</span>height<span class="nt">&lt;/dt&gt;</span>
      <span class="nt">&lt;dd&gt;</span>auto<span class="nt">&lt;/dd&gt;</span>

      <span class="nt">&lt;dd&gt;</span>100%<span class="nt">&lt;/dd&gt;</span>
  <span class="nt">&lt;/li&gt;</span>
  <span class="nt">&lt;li&gt;</span>
    <span class="nt">&lt;h3&gt;</span>td<span class="nt">&lt;/h3&gt;</span>
    <span class="nt">&lt;dl&gt;</span>
      <span class="nt">&lt;dt&gt;</span>border<span class="nt">&lt;/dt&gt;</span>
      <span class="nt">&lt;dd&gt;</span>1px solid<span class="nt">&lt;/dd&gt;</span>
      <span class="nt">&lt;dt&gt;</span>font-size<span class="nt">&lt;/dt&gt;</span>
      <span class="nt">&lt;dd&gt;</span>smaller<span class="nt">&lt;/dd&gt;</span>
      <span class="nt">&lt;dt&gt;</span>padding<span class="nt">&lt;/dt&gt;</span>
      <span class="nt">&lt;dd&gt;</span>1ch<span class="nt">&lt;/dd&gt;</span>
  <span class="nt">&lt;/li&gt;</span>
<span class="nt">&lt;/ul&gt;</span>
</code></pre>

<p>Out-of-the-box this doesn't look particularly great:</p>

<p><a href="assets/1566563/05e594f8.jpg" class="article-body-image-wrapper"><img src="assets/1566563/05e594f8.jpg" alt="Syntax Highlight without styles" loading="lazy" width="426" height="707"></a></p>

<p>However, with very few lines of CSS, we can turn that into:</p>

<p><a href="assets/1566563/3e8edc87.jpg" class="article-body-image-wrapper"><img src="assets/1566563/3e8edc87.jpg" alt="Syntax Highlight Light Mode" loading="lazy" width="732" height="637"></a></p>

<p>... and by adding just <strong>one</strong> CSS-declaration:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.dark</span> <span class="p">{</span>
  <span class="py">color-scheme</span><span class="p">:</span> <span class="n">dark</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>— we get:</p>

<p><a href="assets/1566563/78425d05.jpg" class="article-body-image-wrapper"><img src="assets/1566563/78425d05.jpg" alt="Syntax Highlight Dark Mode" loading="lazy" width="732" height="637"></a></p>


<hr>

<h2>
  <a name="styling-the-syntax-highlight" href="#styling-the-syntax-highlight">
  </a>
  Styling the syntax highlight
</h2>

<p>First, we need some variables for the colors and basic CSS for the list itself:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">ul</span> <span class="p">{</span>
  <span class="py">--_property</span><span class="p">:</span> <span class="n">color-mix</span><span class="p">(</span><span class="n">in</span> <span class="n">srgb</span><span class="p">,</span> <span class="n">HighLight</span><span class="p">,</span> <span class="n">CanvasText</span> <span class="m">30%</span><span class="p">);</span> 
  <span class="py">--_selector</span><span class="p">:</span> <span class="no">cornflowerblue</span><span class="p">;</span>
  <span class="py">--_value</span><span class="p">:</span> <span class="no">orange</span><span class="p">;</span>

  <span class="nl">background</span><span class="p">:</span> <span class="n">color-mix</span><span class="p">(</span><span class="n">in</span> <span class="n">srgb</span><span class="p">,</span> <span class="n">Canvas</span> <span class="m">95%</span><span class="p">,</span> <span class="n">CanvasText</span> <span class="m">5%</span><span class="p">);</span>
  <span class="nl">font-family</span><span class="p">:</span> <span class="n">ui-monospace</span><span class="p">,</span>  <span class="nb">monospace</span><span class="p">;</span>
  <span class="nl">list-style</span><span class="p">:</span> <span class="nb">none</span><span class="p">;</span>
  <span class="nl">margin</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="nl">overflow</span><span class="p">:</span> <span class="nb">auto</span><span class="p">;</span>
  <span class="nl">padding</span><span class="p">:</span> <span class="m">2ch</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The <code>color-mix</code>-method is used here with <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/system-color" target="_blank" rel="noopener noreferrer">system colors</a>. These will automatically change in <a href="https://dev.to/madsstoumann/dark-mode-in-3-lines-of-css-and-other-adventures-1ljj">dark mode</a> — more on that later.</p>

<p>Next, using native CSS nesting, we make sure that all the child-tags behave as we want:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">ul</span> <span class="p">{</span>
  <span class="err">&amp;</span> <span class="err">*</span> <span class="err">{</span>
    <span class="nl">font-size</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>
    <span class="nl">font-style</span><span class="p">:</span> <span class="nb">normal</span><span class="p">;</span>
    <span class="nl">font-weight</span><span class="p">:</span> <span class="m">400</span><span class="p">;</span>
    <span class="nl">margin</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
    <span class="nl">white-space</span><span class="p">:</span> <span class="nb">nowrap</span><span class="p">;</span>
  <span class="p">}</span>
<span class="err">}</span>  
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>For the <em>selector</em>, we allow <code>&lt;em&gt;</code>, <code>&lt;strong&gt;</code> or any <code>&lt;h&gt;</code>eading-tag. We add a <code>{</code>-char after, and after each <em>rule</em> (<code>&lt;li&gt;</code>), we add <code>}</code> and a line-break:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">ul</span> <span class="p">{</span>
  <span class="err">&amp;</span> <span class="err">:is(em,</span> <span class="err">h2,</span> <span class="err">h3,</span> <span class="err">h4,</span> <span class="err">h5,</span> <span class="err">h6,</span> <span class="err">strong)</span> <span class="err">{</span>
    <span class="nl">color</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--_selector</span><span class="p">);</span>
    <span class="err">&amp;::after</span> <span class="err">{</span> <span class="nl">content</span><span class="p">:</span> <span class="s1">" {"</span><span class="p">;</span> <span class="p">}</span>
  <span class="err">}</span>
  <span class="o">&amp;</span> <span class="nt">li</span><span class="nd">::after</span> <span class="p">{</span>
    <span class="nl">color</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--_selector</span><span class="p">);</span>
    <span class="nl">content</span><span class="p">:</span> <span class="s1">"}\a"</span><span class="p">;</span> <span class="nl">white-space</span><span class="p">:</span> <span class="n">pre</span><span class="p">;</span>
  <span class="p">}</span>
<span class="err">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>For the <code>&lt;var&gt;</code>iables, we add:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">ul</span> <span class="p">{</span>
  <span class="err">&amp;</span> <span class="err">var</span> <span class="err">{</span>
    <span class="err">&amp;::before</span> <span class="err">{</span> <span class="nl">content</span><span class="p">:</span> <span class="s1">"var(--"</span><span class="p">;</span> <span class="p">}</span>
    <span class="o">&amp;</span><span class="nd">::after</span> <span class="p">{</span> <span class="nl">content</span><span class="p">:</span> <span class="s1">")"</span><span class="p">;</span> <span class="p">}</span>
  <span class="err">}</span>
<span class="err">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>

<p>We want to display the property/value-pairs as <code>inline</code>, so they don't break to separate lines. We add the <code>:</code>-char after each <em>property</em> — and for the <em>value</em>, we want to end the line with a <code>;</code>-char and a line-break:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">ul</span> <span class="p">{</span>
  <span class="err">&amp;</span> <span class="err">dd,</span> <span class="err">&amp;</span> <span class="err">dt</span> <span class="err">{</span> <span class="nl">display</span><span class="p">:</span> <span class="nb">inline</span><span class="p">;</span> <span class="p">}</span>
  <span class="o">&amp;</span> <span class="nt">dd</span> <span class="p">{</span>
    <span class="nl">color</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--_value</span><span class="p">);</span>
    <span class="err">&amp;::after</span> <span class="err">{</span>
      <span class="nl">content</span><span class="p">:</span> <span class="s1">";\a"</span><span class="p">;</span>
      <span class="nl">white-space</span><span class="p">:</span> <span class="n">pre</span><span class="p">;</span>
    <span class="p">}</span>
  <span class="err">}</span>
  <span class="o">&amp;</span> <span class="nt">dl</span> <span class="p">{</span> <span class="nl">margin</span><span class="p">:</span> <span class="m">0</span> <span class="m">0</span> <span class="m">0</span> <span class="m">2ch</span><span class="p">;</span> <span class="p">}</span>

<h2>
  <a name="dark-mode-for-free" href="#dark-mode-for-free">
  </a>
  Dark Mode for free
</h2>

<p>Because we used <em>system colors</em>, we get dark mode for free. </p>

<p>Add <code>color-scheme: light dark;</code> to your <code>body</code>-styles, and change your OS to either light or dark mode, and you should see the syntax-styles update.</p>

<p>The great thing about <code>color-scheme</code>, is that you can <strong>force</strong> it to one or the other, even if your OS is set to the opposite. </p>

<p>If your OS is set to "light mode" and you set <code>color-scheme: dark</code> on the <code>&lt;ul&gt;</code>-tag, it'll render as "dark mode", even if the rest of the page is in "light mode".</p>


<hr>
