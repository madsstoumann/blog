			<h1>Accessible, Resizable Table-Columns</h1>
			<p>I love using the <code>&lt;input type="range"&gt;</code>. It's an interactive control with touch-support, and you get accessibility baked-in for free!</p>

<p>After I finished the <a href="https://dev.to/madsstoumann/accessible-image-compare-one-line-of-javascript-3gn4">Accessible Image Compare</a> a while ago, I thought about other use-cases.</p>

<p>One obvious candidate is resizable table columns. You'll find plenty of examples and libraries out there — but they often lack accessibility. None of the ones I found supported resizing with arrow-keys (they must be out there, I just couldn't find any).</p>

<p>This is a bit more complex than the <em>Accessible Image Compare</em>; you need an <code>&lt;input type="range"&gt;</code> for all columns except the last. </p>

<p>Without styling, it looks like this:</p>

<p><a href="assets/592005/d950916e.jpg" class="article-body-image-wrapper"><img src="assets/592005/d950916e.jpg" alt="a11yTableUnstyled" loading="lazy" width="800" height="231"></a></p>

<p>Each <code>&lt;input type="range"&gt;</code> will update <strong>two</strong> custom properties, holding the widths of the cells to the left and the right of the input.</p>

<p>In CSS, we need to stack them all on top, using <code>position: absolute</code>, the range-height must be set to the lowest value possible (<code>1px</code>), while the draggable thumb must be the full height of the table. This is to avoid "collisions" between the ranges.</p>

<p>It now looks like this:</p>

<p><a href="assets/592005/709d2239.jpg" class="article-body-image-wrapper"><img src="assets/592005/709d2239.jpg" alt="a11yTableColor" loading="lazy" width="800" height="174"></a></p>

<p>The draggable thumb should be invisible, so we'll set that to <code>transparent</code>, and the cursor should change to <code>ew-resize</code> when hovering:</p>

<p><a href="assets/592005/34ae7254.jpg" class="article-body-image-wrapper"><img src="assets/592005/34ae7254.jpg" alt="a11yTableResize" loading="lazy" width="800" height="46"></a></p>

<p>Then, when using keyboard-navigation, <code>:focus-visible</code> is used to show the thumb, styled like this:</p>

<p><a href="assets/592005/796bd0e1.jpg" class="article-body-image-wrapper"><img src="assets/592005/796bd0e1.jpg" alt="a11yTable" loading="lazy" width="800" height="176"></a></p>

<p>And because it's <code>&lt;input type="range"&gt;</code>, you can use arrow-keys to de/increase the column widths! The widths are stored as <em>CSS Custom Properties</em> on the table:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">--c0</span><span class="o">:</span><span class="err">23</span><span class="o">;</span> <span class="nt">--c1</span><span class="o">:</span><span class="err">26</span><span class="o">;</span> <span class="nt">--c2</span><span class="o">:</span><span class="err">25</span><span class="o">;</span> <span class="nt">--c3</span><span class="o">:</span><span class="err">26</span><span class="o">;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>These are then used on the <code>thead th</code>-cells:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;th</span> <span class="na">style=</span><span class="s">"width: calc(1% * var(--c0));"</span><span class="nt">&gt;</span>ID<span class="nt">&lt;/th&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>I've made a JavaScript, you can add to any table — but beware(!) : I haven't used it in production yet - it might need tweaks and fixes. </p>

<p>You can grab both CSS and JS from <a href="https://codepen.io/stoumann/pen/poNjMJV" target="_blank" rel="noopener noreferrer">this Pen</a>.</p>

<blockquote>
<p><strong>NOTE:</strong> This is a proof-of-concept. It's to show how we get a lot "out-of-the-box" when using native HTML-controls vs. writing loads of JavaScript. If you refine the code / come up with ways to make it better, please fork the Pen, and paste the link in the comments below.</p>
</blockquote>

<p>Thanks for reading!</p>
