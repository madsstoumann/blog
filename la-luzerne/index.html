		<article>
			<h1>La Luzerne</h1>
			<p><em>This is a submission for <a href="https://dev.to/challenges/frontend-2024-05-29">Frontend Challenge v24.04.17</a>, CSS Art: June.</em></p>

<h2>
  <a name="inspiration" href="#inspiration">
  </a>
  Inspiration
</h2>

<p>"La Luzerne — Saint-Denis" by Georges Seurat:</p>

<p><a href="assets/1869503/b37678a6.jpg" class="article-body-image-wrapper"><img src="assets/1869503/b37678a6.jpg" alt="La Luzerne" loading="lazy" width="800" height="635"></a></p>

<p>This is a great example of pointillism, for which I wanted to create a pure CSS <strong>interpretation</strong>, not a 1:1 replica.</p>

<h2>
  <a name="demo" href="#demo">
  </a>
  Demo
</h2>

<p><iframe height="600" src="https://codepen.io/stoumann/embed/zYQoZjN?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
</p>

<h2>
  <a name="journey" href="#journey">
  </a>
  Journey
</h2>

<p>The CSS for this contains a bunch of custom properties, that are all set with a bit of <strong>randomness</strong> in JavaScript. Thus, you get a fresh, unique version of the painting everytime you refresh!<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.luzerne</span> <span class="p">{</span>
  <span class="nl">background-color</span><span class="p">:</span> <span class="nb">rgb</span><span class="p">(</span><span class="m">243</span><span class="p">,</span> <span class="m">221</span><span class="p">,</span> <span class="m">44</span><span class="p">);</span>
  <span class="nl">border</span><span class="p">:</span> <span class="n">clamp</span><span class="p">(</span><span class="m">0.375rem</span><span class="p">,</span> <span class="m">0.0575rem</span> <span class="err">+</span> <span class="m">1.5873vw</span><span class="p">,</span> <span class="m">1rem</span><span class="p">)</span> <span class="nb">ridge</span> <span class="nb">rgb</span><span class="p">(</span><span class="m">121</span><span class="p">,</span> <span class="m">85</span><span class="p">,</span> <span class="m">72</span><span class="p">,</span> <span class="m">.9</span><span class="p">);</span>
  <span class="py">container-type</span><span class="p">:</span> <span class="n">inline-size</span><span class="p">;</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">flex</span><span class="p">;</span>
  <span class="nl">filter</span><span class="p">:</span> <span class="sx">url('#grain')</span><span class="p">;</span>
  <span class="nl">flex-wrap</span><span class="p">:</span> <span class="n">wrap</span><span class="p">;</span>
  <span class="py">margin-inline</span><span class="p">:</span> <span class="nb">auto</span><span class="p">;</span>
  <span class="nl">max-width</span><span class="p">:</span> <span class="m">950px</span><span class="p">;</span>
  <span class="py">gap</span><span class="p">:</span> <span class="m">0px</span><span class="p">;</span>
  <span class="nl">overflow</span><span class="p">:</span> <span class="nb">visible</span><span class="p">;</span>
  <span class="err">b</span> <span class="err">{</span>
    <span class="py">aspect-ratio</span><span class="p">:</span> <span class="m">1</span> <span class="p">/</span> <span class="m">.95</span><span class="p">;</span>
    <span class="nl">background</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--c</span><span class="p">,</span> <span class="m">#0000</span><span class="p">);</span>
    <span class="nl">border-radius</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--a</span><span class="p">,</span> <span class="m">0</span><span class="p">);</span>
    <span class="nl">filter</span><span class="p">:</span> <span class="n">brightness</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--b</span><span class="p">,</span> <span class="m">1</span><span class="p">))</span> <span class="n">opacity</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--o</span><span class="p">,</span> <span class="m">1</span><span class="p">));</span>
    <span class="py">rotate</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--r</span><span class="p">,</span> <span class="m">0deg</span><span class="p">);</span>
    <span class="py">scale</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--s</span><span class="p">,</span> <span class="m">1</span><span class="p">);</span>
    <span class="nl">width</span><span class="p">:</span> <span class="m">2</span><span class="n">cqi</span><span class="p">;</span>
  <span class="p">}</span>
<span class="err">}</span>
</code></pre>

<p>I wrote a small JavaScript to render the random properties:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">colors</span> <span class="o">=</span> <span class="p">[</span><span class="nx">array</span><span class="o">-</span><span class="k">of</span><span class="o">-</span><span class="nx">colors</span><span class="p">];</span>
<span class="kd">const</span> <span class="nx">R</span> <span class="o">=</span> <span class="p">(</span><span class="nx">min</span><span class="p">,</span> <span class="nx">max</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="nb">Math</span><span class="p">.</span><span class="nf">random</span><span class="p">()</span> <span class="o">*</span> <span class="p">(</span><span class="nx">max</span> <span class="o">-</span> <span class="nx">min</span><span class="p">)</span> <span class="o">+</span> <span class="nx">min</span><span class="p">;</span>
<span class="nx">app</span><span class="p">.</span><span class="nx">innerHTML</span> <span class="o">=</span> <span class="k">new</span> <span class="nc">Array</span><span class="p">(</span><span class="mi">1150</span><span class="p">).</span><span class="nf">fill</span><span class="p">().</span><span class="nf">map</span><span class="p">(()</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">c</span> <span class="o">=</span> <span class="nx">colors</span><span class="p">[</span><span class="nb">Math</span><span class="p">.</span><span class="nf">floor</span><span class="p">(</span><span class="nb">Math</span><span class="p">.</span><span class="nf">random</span><span class="p">()</span> <span class="o">*</span> <span class="nx">colors</span><span class="p">.</span><span class="nx">length</span><span class="p">)];</span>
  <span class="kd">const</span> <span class="nx">s</span> <span class="o">=</span> <span class="nc">R</span><span class="p">(</span><span class="mi">1</span><span class="p">,</span> <span class="mf">1.5</span><span class="p">).</span><span class="nf">toFixed</span><span class="p">(</span><span class="mi">5</span><span class="p">);</span>
  <span class="kd">const</span> <span class="nx">r</span> <span class="o">=</span> <span class="nc">R</span><span class="p">(</span><span class="o">-</span><span class="mi">10</span><span class="p">,</span> <span class="mi">10</span><span class="p">).</span><span class="nf">toFixed</span><span class="p">(</span><span class="mi">2</span><span class="p">)</span> <span class="o">+</span> <span class="dl">'</span><span class="s1">deg</span><span class="dl">'</span><span class="p">;</span>
  <span class="kd">const</span> <span class="nx">a</span> <span class="o">=</span> <span class="nc">R</span><span class="p">(</span><span class="mi">5</span><span class="p">,</span> <span class="mi">20</span><span class="p">).</span><span class="nf">toFixed</span><span class="p">(</span><span class="mi">2</span><span class="p">)</span> <span class="o">+</span> <span class="dl">'</span><span class="s1">%</span><span class="dl">'</span><span class="p">;</span>
  <span class="kd">const</span> <span class="nx">b</span> <span class="o">=</span> <span class="nc">R</span><span class="p">(</span><span class="mi">1</span><span class="p">,</span> <span class="mf">1.3</span><span class="p">).</span><span class="nf">toFixed</span><span class="p">(</span><span class="mi">2</span><span class="p">);</span>
  <span class="kd">const</span> <span class="nx">o</span> <span class="o">=</span> <span class="nc">R</span><span class="p">(</span><span class="mf">0.75</span><span class="p">,</span> <span class="mi">1</span><span class="p">).</span><span class="nf">toFixed</span><span class="p">(</span><span class="mi">2</span><span class="p">);</span>
  <span class="k">return</span> <span class="s2">`&lt;b style="--c:</span><span class="p">${</span><span class="nx">c</span><span class="p">}</span><span class="s2">;--s:</span><span class="p">${</span><span class="nx">s</span><span class="p">}</span><span class="s2">;--r:</span><span class="p">${</span><span class="nx">r</span><span class="p">}</span><span class="s2">;--a:</span><span class="p">${</span><span class="nx">a</span><span class="p">}</span><span class="s2">;--b:</span><span class="p">${</span><span class="nx">b</span><span class="p">}</span><span class="s2">;--o:</span><span class="p">${</span><span class="nx">o</span><span class="p">}</span><span class="s2">"&gt;&lt;/b&gt;`</span><span class="p">;</span>
<span class="p">}).</span><span class="nf">join</span><span class="p">(</span><span class="dl">''</span><span class="p">);</span>
</code></pre>

<h2>
  <a name="grainy-texture" href="#grainy-texture">
  </a>
  Grainy texture
</h2>

<p>The old and worn, grainy look, is an <code>SVG</code>-filter (see the demo above). The wooden frame is simply a <code>border-type: ridge</code>.</p>
