		<article>
			<h1>Populate a drop-down with function-names from external module</h1>
			<p>The use-case for this is probably <em>very</em> limited, but I found it useful, when I had to add a drop-down with <em>easing-functions</em> to a small app.</p>

<p>The easing-functions are in an external module called <em>easings.mjs</em>, and is a bunch of timing functions for animations, example:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="k">export</span> <span class="kd">function</span> <span class="nf">linear</span><span class="p">(</span><span class="nx">t</span><span class="p">)</span> <span class="p">{</span> <span class="k">return</span> <span class="nx">t</span><span class="p">;</span> <span class="p">}</span>
<span class="k">export</span> <span class="kd">function</span> <span class="nf">easeIn</span><span class="p">(</span><span class="nx">t</span><span class="p">)</span> <span class="p">{</span> <span class="k">return</span> <span class="nx">t</span><span class="o">*</span><span class="nx">t</span><span class="p">;</span> <span class="p">}</span>
<span class="k">export</span> <span class="kd">function</span> <span class="nf">easeOut</span><span class="p">(</span><span class="nx">t</span><span class="p">)</span> <span class="p">{</span> <span class="k">return</span> <span class="nx">t</span><span class="o">*</span><span class="p">(</span><span class="mi">2</span><span class="o">-</span><span class="nx">t</span><span class="p">);</span> <span class="p">}</span>
<span class="nx">etc</span><span class="p">.</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>

</svg>

</div>
</div>
</div>



<p>To populate a drop-down (select) with options, we need to have that element in the DOM:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;select</span> <span class="na">id=</span><span class="s">"easingSelect"</span><span class="nt">&gt;&lt;/select&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And, finally, the script for dynamically importing the <em>easings.mjs</em> file and populate the drop-down is:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="cm">/* Create a locally scoped variable for the imported module */</span>
<span class="kd">let</span> <span class="nx">easingModule</span><span class="p">;</span>
<span class="kd">const</span> <span class="nx">easingSelect</span> <span class="o">=</span> <span class="nb">document</span><span class="p">.</span><span class="nf">getElementById</span><span class="p">(</span><span class="dl">'</span><span class="s1">easingSelect</span><span class="dl">'</span><span class="p">);</span>

<span class="k">import</span><span class="p">(</span><span class="dl">'</span><span class="s1">../assets/js/easing.mjs</span><span class="dl">'</span><span class="p">)</span>
<span class="p">.</span><span class="nf">then</span><span class="p">(</span><span class="nx">module</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="cm">/* If import is succesful, assign imported module to local variable */</span>
  <span class="nx">easingModule</span> <span class="o">=</span> <span class="nx">module</span><span class="p">;</span>
  <span class="k">for </span><span class="p">(</span><span class="kd">const</span> <span class="nx">func</span> <span class="k">in</span> <span class="nx">module</span><span class="p">)</span> <span class="p">{</span>
    <span class="cm">/*
    Iterate functions/methods in module.
    Add an option for each, assign innerText and value in one go
    */</span>
    <span class="kd">const</span> <span class="nx">option</span> <span class="o">=</span> <span class="nb">document</span><span class="p">.</span><span class="nf">createElement</span><span class="p">(</span><span class="dl">'</span><span class="s1">option</span><span class="dl">'</span><span class="p">);</span>
    <span class="nx">option</span><span class="p">.</span><span class="nx">innerText</span> <span class="o">=</span> <span class="nx">option</span><span class="p">.</span><span class="nx">value</span> <span class="o">=</span> <span class="nx">func</span><span class="p">.</span><span class="nf">toString</span><span class="p">();</span>
    <span class="nx">easingSelect</span><span class="p">.</span><span class="nf">appendChild</span><span class="p">(</span><span class="nx">option</span><span class="p">)</span>
  <span class="p">}</span>
<span class="p">});</span>
<span class="cm">/*
Add onChange-listener.
If selected value (function-name) exists in èasingModule`, run the function.
*/</span>
<span class="nx">easingSelect</span><span class="p">.</span><span class="nf">addEventListener</span><span class="p">(</span><span class="dl">'</span><span class="s1">change</span><span class="dl">'</span><span class="p">,</span> <span class="p">()</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">easingFunc</span> <span class="o">=</span> <span class="nx">easingModule</span><span class="p">[</span><span class="nx">easingSelect</span><span class="p">.</span><span class="nx">value</span><span class="p">];</span>
  <span class="k">if </span><span class="p">(</span><span class="k">typeof</span> <span class="nx">easingFunc</span> <span class="o">===</span> <span class="dl">'</span><span class="s1">function</span><span class="dl">'</span><span class="p">)</span> <span class="p">{</span>
    <span class="c1">// easingFunc();</span>
    <span class="nx">console</span><span class="p">.</span><span class="nf">log</span><span class="p">(</span><span class="s2">`Run: easingFunc() ⇒ </span><span class="p">${</span><span class="nx">easingSelect</span><span class="p">.</span><span class="nx">value</span><span class="p">}</span><span class="s2">()`</span><span class="p">);</span>
  <span class="p">}</span>
<span class="p">})</span>
</code></pre>

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Now, whenever I add a new easing-method to <em>easings.mjs</em>, the drop-down is automatically updated.</p>
