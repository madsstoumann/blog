		<article>
			<h1>Styling Checkboxes and Switches</h1>
			<p>I'm probably not the only developer who's frustrated about the browser's default <code>&lt;input type="checkbox"&gt;</code>. </p>

<p>First of all: <strong>it's not scalable.</strong> In this example, the font-size has been scaled up to <code>200%</code>, but the checkbox remains at it's root size, which is <code>13.333333px</code>:</p>

<p><a href="assets/1745796/c3389476.jpg" class="article-body-image-wrapper"><img src="assets/1745796/c3389476.jpg" alt="Default Checkbox" loading="lazy" width="326" height="52"></a></p>

<p>In this tutorial, we'll be dissecting the browser's default checkbox, and see, if we can do it better.</p>


<hr>

<p>First, we need to clear the default styling using <code>appearance:none</code> and set an initial size — which will be a relative unit, <code>em</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">[</span><span class="nt">type</span><span class="o">=</span><span class="nt">checkbox</span><span class="o">]</span> <span class="p">{</span>
  <span class="nl">appearance</span><span class="p">:</span> <span class="nb">none</span><span class="p">;</span>
  <span class="py">aspect-ratio</span><span class="p">:</span> <span class="m">1</span><span class="p">;</span>
  <span class="nl">box-sizing</span><span class="p">:</span> <span class="n">border-box</span><span class="p">;</span>
  <span class="nl">font-size</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>
  <span class="nl">width</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The <code>background-color</code> should adapt to dark mode, so we'll check if it matches any of the <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/system-color" target="_blank" rel="noopener noreferrer">system colors</a>. It seems to match the <code>Field</code> system-color, so let's use that.</p>

<p>For the border-color — in Chrome — it matches the system color <code>ButtonBorder</code>, but since Safari use a much <em>lighter</em> <code>ButtonBorder</code>, we'll use <code>GrayCanvas</code> which works in both browsers.</p>

<p>We'll add a few CSS Custom Properties, which we'll use to create variants later.</p>

<p>For <code>border-radius</code> and <code>margin</code>, we'll be using the default values, but convert them to the relative unit <code>em</code>.</p>

<p>The <code>border-width</code> seems to scale using this formula:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight plaintext"><code>(4/3) / root size
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Since root size is <code>13.333333px</code>, we now have:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">[</span><span class="nt">type</span><span class="o">=</span><span class="nt">checkbox</span><span class="o">]</span> <span class="p">{</span>
  <span class="py">--_bdw</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">1em</span> <span class="err">*</span> <span class="p">(</span><span class="m">4</span><span class="p">/</span><span class="m">3</span><span class="p">)</span> <span class="p">/</span> <span class="m">13.333333</span><span class="p">);</span>
  <span class="nl">appearance</span><span class="p">:</span> <span class="nb">none</span><span class="p">;</span>
  <span class="py">aspect-ratio</span><span class="p">:</span> <span class="m">1</span><span class="p">;</span>
  <span class="nl">background</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--_bg</span><span class="p">,</span> <span class="n">Field</span><span class="p">);</span>
  <span class="nl">border</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--_bdw</span><span class="p">)</span> <span class="nb">solid</span> <span class="n">var</span><span class="p">(</span><span class="n">--_bdc</span><span class="p">,</span> <span class="n">GrayText</span><span class="p">);</span>
  <span class="nl">border-radius</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--_bdrs</span><span class="p">,</span> <span class="m">.2em</span><span class="p">);</span>
  <span class="nl">box-sizing</span><span class="p">:</span> <span class="n">border-box</span><span class="p">;</span>
  <span class="nl">font-size</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>
  <span class="nl">margin</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--_m</span><span class="p">,</span> <span class="m">.1875em</span> <span class="m">.1875em</span> <span class="m">.1875em</span> <span class="m">.25em</span><span class="p">);</span>
  <span class="nl">position</span><span class="p">:</span> <span class="nb">relative</span><span class="p">;</span>
  <span class="nl">width</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Let's see if it's scalable:</p>

<p><a href="assets/1745796/4f8f6859.jpg" class="article-body-image-wrapper"><img src="assets/1745796/4f8f6859.jpg" alt="Scalable checkbox" loading="lazy" width="242" height="366"></a></p>

<p>Nice! What about dark mode?</p>

<p><a href="assets/1745796/d1d06bb2.jpg" class="article-body-image-wrapper"><img src="assets/1745796/d1d06bb2.jpg" alt="Dark mode" loading="lazy" width="244" height="363"></a></p>

<p>That's why I <strong>love</strong> system colors! Next, let's add the same hover-effect the browser uses on an <strong>unchecked</strong> checkbox.</p>

<p>We'll mix-in <code>CanvasText</code>, which is black in light mode, and white in dark mode, and simply update the <code>--_bdc</code>-property we added in the previous step:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="k">@media</span> <span class="p">(</span><span class="n">hover</span><span class="p">:</span> <span class="n">hover</span><span class="p">)</span> <span class="p">{</span>
  <span class="o">&amp;</span><span class="nd">:not</span><span class="o">(</span><span class="nd">:checked</span><span class="o">)</span><span class="nd">:hover</span> <span class="p">{</span>
    <span class="py">--_bdc</span><span class="p">:</span> <span class="n">color-mix</span><span class="p">(</span><span class="n">in</span> <span class="n">srgb</span><span class="p">,</span> <span class="n">GrayText</span> <span class="m">60%</span><span class="p">,</span> <span class="n">CanvasText</span> <span class="m">40%</span><span class="p">);</span>
  <span class="p">}</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>




<hr>

<h2>
  <a name="the-checkmark" href="#the-checkmark">
  </a>
  The Checkmark
</h2>

<p>And now for the checkmark. We <strong>could</strong> do it with a rotated CSS box in the <code>::after</code>-element:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">[</span><span class="nt">type</span><span class="o">=</span><span class="nt">checkbox</span><span class="o">]</span><span class="nd">::after</span> <span class="p">{</span>
  <span class="nl">border-color</span><span class="p">:</span> <span class="n">GrayText</span><span class="p">;</span>
  <span class="nl">border-style</span><span class="p">:</span> <span class="nb">solid</span><span class="p">;</span>
  <span class="nl">border-width</span><span class="p">:</span> <span class="m">0</span> <span class="m">0.15em</span> <span class="m">0.15em</span> <span class="m">0</span><span class="p">;</span>
  <span class="nl">box-sizing</span><span class="p">:</span> <span class="n">border-box</span><span class="p">;</span>
  <span class="nl">content</span><span class="p">:</span> <span class="s2">''</span><span class="p">;</span>
  <span class="py">aspect-ratio</span><span class="p">:</span> <span class="m">1</span> <span class="p">/</span> <span class="m">1.8</span><span class="p">;</span>
  <span class="py">rotate</span><span class="p">:</span> <span class="m">40deg</span><span class="p">;</span>
  <span class="nl">width</span><span class="p">:</span> <span class="m">0.375em</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><a href="assets/1745796/d6b3ca51.jpg" class="article-body-image-wrapper"><img src="assets/1745796/d6b3ca51.jpg" alt="Checkmark in CSS" loading="lazy" width="109" height="107"></a></p>

<p>While this works fine, I prefer to use an SVG in a mask, simply because it's more flexible. For that, we'll add a property fot the mask and another, <code>--_bga</code> for the background of the <code>::after</code>-element, which will be the <strong>color</strong> of the checkmark.<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">[</span><span class="nt">role</span><span class="o">=</span><span class="nt">checkbox</span><span class="o">]</span> <span class="p">{</span>
<span class="py">--_bga</span><span class="p">:</span> <span class="n">Field</span><span class="p">;</span>
<span class="py">--_mask</span><span class="p">:</span> <span class="sx">url('data:image/svg+xml,&lt;svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="3" stroke="%23000" fill="none" stroke-linecap="round" stroke-linejoin="round"&gt; &lt;path d="M5 12l5 5l10 -10"/&gt;&lt;/svg&gt;')</span><span class="p">;</span>

  <span class="err">&amp;::after</span> <span class="err">{</span>
    <span class="nl">background</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--_bga</span><span class="p">,</span> <span class="nb">transparent</span><span class="p">);</span>
    <span class="nl">content</span><span class="p">:</span> <span class="s1">""</span><span class="p">;</span>
    <span class="py">inset</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
    <span class="nl">position</span><span class="p">:</span> <span class="nb">absolute</span><span class="p">;</span>
    <span class="nl">mask</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--_mask</span><span class="p">)</span> <span class="nb">no-repeat</span> <span class="nb">center</span> <span class="p">/</span> <span class="n">contain</span><span class="p">;</span>
    <span class="nl">-webkit-mask</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--_mask</span><span class="p">)</span> <span class="nb">no-repeat</span> <span class="nb">center</span> <span class="p">/</span> <span class="n">contain</span><span class="p">;</span>
  <span class="p">}</span>
<span class="err">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>So, we <strong>do</strong> have a checkmark now, we just can't see it, as the mask-color is set to <code>transparent</code>.</p>

<p>Let's update the checkbox's color when clicked, using the <code>:checked</code>-state. But before that, we need to figure out <strong>which</strong> color!</p>

<p>Safari is the only browser that supports the system color <code>AccentColor</code>, so we need to create out own variable for that, <code>--_accent</code>, which on Mac corresponds to <code>#0075ff</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">[</span><span class="nt">type</span><span class="o">=</span><span class="nt">checkbox</span><span class="o">]</span> <span class="p">{</span>
  <span class="py">--_accent</span><span class="p">:</span> <span class="m">#0075ff</span><span class="p">;</span>
  <span class="err">&amp;:checked</span> <span class="err">{</span>
    <span class="py">--_bdc</span><span class="p">:</span> <span class="nb">transparent</span><span class="p">;</span>
    <span class="py">--_bg</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--_accent</span><span class="p">);</span>
    <span class="py">--_bga</span><span class="p">:</span> <span class="n">Field</span><span class="p">;</span>
  <span class="p">}</span>
<span class="err">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Let's see what we've built:</p>

<p><a href="assets/1745796/2ded97ee.jpg" class="article-body-image-wrapper"><img src="assets/1745796/2ded97ee.jpg" alt="Checkboxes styled" loading="lazy" width="224" height="365"></a></p>

<p>And dark mode? We need to update the <code>--_accent</code>-property first, since <code>AccentColor</code> isn't working in all browsers yet:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="k">@media</span> <span class="p">(</span><span class="n">prefers-color-scheme</span><span class="p">:</span> <span class="n">dark</span><span class="p">)</span> <span class="p">{</span>
  <span class="py">--_accent</span><span class="p">:</span> <span class="m">#99C8FF</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Let's check:</p>

<p><a href="assets/1745796/501a0d0d.jpg" class="article-body-image-wrapper"><img src="assets/1745796/501a0d0d.jpg" alt="Checkboxes dark mode" loading="lazy" width="233" height="363"></a></p>

<p>Cool! Now all we have to add is the <code>:checked:hover</code>-state, which is similar to the border-hover, we added earlier:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="k">@media</span> <span class="p">(</span><span class="n">hover</span><span class="p">:</span> <span class="n">hover</span><span class="p">)</span> <span class="p">{</span>
  <span class="o">&amp;</span><span class="nd">:checked:hover</span> <span class="p">{</span>
    <span class="py">--_bg</span><span class="p">:</span> <span class="n">color-mix</span><span class="p">(</span><span class="n">in</span> <span class="n">srgb</span><span class="p">,</span> <span class="n">var</span><span class="p">(</span><span class="n">--_accent</span><span class="p">)</span> <span class="m">60%</span><span class="p">,</span> <span class="n">CanvasText</span> <span class="m">40%</span><span class="p">);</span>
  <span class="p">}</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>

</svg>

</div>
</div>
</div>



<p>Let's compare how it looks in Chrome, Safari and Firefox:</p>

<p><a href="assets/1745796/19364698.jpg" class="article-body-image-wrapper"><img src="assets/1745796/19364698.jpg" alt="Browser Compare" loading="lazy" width="800" height="269"></a></p>

<p>Seems we passed the test!</p>

<h2>
  <a name="variants" href="#variants">
  </a>
  Variants
</h2>

<p>Creating variants is super-simple: you just need to update a few properties. Example:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.rounded</span> <span class="p">{</span> <span class="py">--_bdrs</span><span class="p">:</span> <span class="m">50%</span><span class="p">;</span> <span class="p">}</span>
<span class="nc">.square</span> <span class="p">{</span> <span class="py">--_bdrs</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span> <span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And then in HTML:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;input</span> <span class="na">type=</span><span class="s">"checkbox"</span> <span class="na">class=</span><span class="s">"rounded"</span><span class="nt">&gt;</span>
<span class="nt">&lt;input</span> <span class="na">type=</span><span class="s">"checkbox"</span> <span class="na">class=</span><span class="s">"square"</span><span class="nt">&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>

</svg>

</div>
</div>
</div>



<p><a href="assets/1745796/387fa6c5.jpg" class="article-body-image-wrapper"><img src="assets/1745796/387fa6c5.jpg" alt="Variants" loading="lazy" width="164" height="107"></a></p>

<p>— or go all-in and create <em>oldschool</em> checkboxes:</p>

<blockquote>
<p><strong>A note on round checkboxes:</strong> It's <em>bad</em> practice, as you can read in <a href="https://tonsky.me/blog/checkbox/" target="_blank" rel="noopener noreferrer">this wonderful article</a>. There are a few exceptions, though, as this "image selector":</p>

<p><a href="assets/1745796/ddac1d58.jpg" class="article-body-image-wrapper"><img src="assets/1745796/ddac1d58.jpg" alt="Rounded Image Select" loading="lazy" width="800" height="274"></a></p>

<h2>
  <a name="switches" href="#switches">
  </a>
  Switches
</h2>

<p>For switches, we'll add a <code>role="switch"</code>, so it's:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;input</span> <span class="na">type=</span><span class="s">"checkbox"</span> <span class="na">role=</span><span class="s">"switch"</span><span class="nt">&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Apple have recently added <a href="https://dev.to/madsstoumann/a-first-look-at-apples-new-switch-control-3pnd">their own switch-control</a>, but <code>role="switch"</code> is cross-browser. Again, we just need to update a lot of the properties, we created earlier:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">[</span><span class="nt">role</span><span class="o">=</span><span class="nt">switch</span><span class="o">]</span> <span class="p">{</span>
    <span class="py">--_bdc--hover</span><span class="p">:</span> <span class="nb">transparent</span><span class="p">;</span>
    <span class="py">--_bdrs</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>
    <span class="py">--_bg</span><span class="p">:</span> <span class="m">#d1d1d1</span><span class="p">;</span>
    <span class="py">--_bga</span><span class="p">:</span> <span class="n">Field</span><span class="p">;</span>
    <span class="py">--_mask</span><span class="p">:</span> <span class="nb">none</span><span class="p">;</span>
    <span class="py">aspect-ratio</span><span class="p">:</span> <span class="m">1.8</span> <span class="p">/</span> <span class="m">1</span><span class="p">;</span>
    <span class="nl">border</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
    <span class="nl">display</span><span class="p">:</span> <span class="n">grid</span><span class="p">;</span>
    <span class="nl">padding</span><span class="p">:</span> <span class="m">.125em</span><span class="p">;</span>
    <span class="py">place-content</span><span class="p">:</span> <span class="nb">center</span> <span class="n">start</span><span class="p">;</span>
    <span class="nl">width</span><span class="p">:</span> <span class="m">1.8em</span><span class="p">;</span>
    <span class="err">&amp;::after</span> <span class="err">{</span>
      <span class="nl">border-radius</span><span class="p">:</span> <span class="m">50%</span><span class="p">;</span>
      <span class="nl">height</span><span class="p">:</span> <span class="m">.75em</span><span class="p">;</span>
      <span class="py">inset</span><span class="p">:</span> <span class="n">unset</span><span class="p">;</span>
      <span class="nl">position</span><span class="p">:</span> <span class="nb">static</span><span class="p">;</span>
      <span class="nl">width</span><span class="p">:</span> <span class="m">.75em</span><span class="p">;</span>
    <span class="p">}</span>
    <span class="o">&amp;</span><span class="nd">:checked</span> <span class="p">{</span>
      <span class="py">--_bg</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--_bg--checked</span><span class="p">,</span> <span class="n">var</span><span class="p">(</span><span class="n">--_accent</span><span class="p">));</span>
      <span class="nl">justify-content</span><span class="p">:</span> <span class="n">end</span><span class="p">;</span>
    <span class="p">}</span>
  <span class="err">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>
