		<article>
			<h1>Charts in CSS</h1>
			<p>Charts have been done in CSS many times before — there's even a <a href="https://chartscss.org/" target="_blank" rel="noopener noreferrer">dedicated project</a>. So why this post? Because CSS evolves all the time — new, cool techniques emerge, allowing us to do things <em>simpler</em>, or add even more complicated new features. </p>

<p>Let's dive in!</p>

<h2>
  <a name="markup" href="#markup">
  </a>
  Markup
</h2>

<p>Like the <em>CSS Charts</em>-project, we'll use a <code>&lt;table&gt;</code> for our charts. It's accessible, simple and readable:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;table&gt;</span>
  <span class="nt">&lt;caption&gt;</span>Monthly Sales Figures ($)<span class="nt">&lt;/caption&gt;</span>
  <span class="nt">&lt;tbody&gt;</span>
    <span class="nt">&lt;tr&gt;</span>
      <span class="nt">&lt;th</span> <span class="na">scope=</span><span class="s">"row"</span><span class="nt">&gt;</span>January<span class="nt">&lt;/th&gt;</span>
      <span class="nt">&lt;td</span> <span class="na">data-value=</span><span class="s">"28500"</span><span class="nt">&gt;</span>$28,500<span class="nt">&lt;/td&gt;</span>
    <span class="nt">&lt;/tr&gt;</span>
    <span class="nt">&lt;tr&gt;</span>
      <span class="nt">&lt;th</span> <span class="na">scope=</span><span class="s">"row"</span><span class="nt">&gt;</span>February<span class="nt">&lt;/th&gt;</span>
      <span class="nt">&lt;td</span> <span class="na">data-value=</span><span class="s">"22300"</span><span class="nt">&gt;</span>$22,300<span class="nt">&lt;/td&gt;</span>
    <span class="nt">&lt;/tr&gt;</span>
    <span class="nt">&lt;tr&gt;</span>
      <span class="nt">&lt;th</span> <span class="na">scope=</span><span class="s">"row"</span><span class="nt">&gt;</span>March<span class="nt">&lt;/th&gt;</span>
      <span class="nt">&lt;td</span> <span class="na">data-value=</span><span class="s">"30100"</span><span class="nt">&gt;</span>$30,100<span class="nt">&lt;/td&gt;</span>
    <span class="nt">&lt;/tr&gt;</span>
<span class="c">&lt;!-- etc. --&gt;</span>
  <span class="nt">&lt;/tbody&gt;</span>
<span class="nt">&lt;/table&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Notice the <code>data-value</code>-attribute? We'll grab that with the new, typed <code>attr()</code> in CSS:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">--_v</span><span class="o">:</span> <span class="nt">attr</span><span class="o">(</span><span class="nt">data-value</span> <span class="nt">type</span><span class="o">(&lt;</span><span class="nt">number</span><span class="o">&gt;),</span> <span class="err">0</span><span class="o">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Before we continue, let's wrap the <code>&lt;table&gt;</code> in a custom element, allowing us to add a few custom attributes, as well as functioning as a <strong>container</strong>, we can use to make <strong>responsive charts</strong> (more on that later!):<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;data-chart</span>
  <span class="na">aria-label=</span><span class="s">"Annual Revenue Growth"</span>
  <span class="na">max=</span><span class="s">"50000"</span>
  <span class="na">min=</span><span class="s">"0"</span>
  <span class="na">role=</span><span class="s">"figure"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;table&gt;</span> ... <span class="nt">&lt;/table&gt;</span>
<span class="nt">&lt;/data-chart&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>We'll grab the <code>min</code> and <code>max</code> attributes with <code>attr()</code> as well, setting fallbacks to <code>0</code> and <code>100</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code>  <span class="nt">--_min</span><span class="o">:</span> <span class="nt">attr</span><span class="o">(</span><span class="nt">min</span> <span class="nt">type</span><span class="o">(&lt;</span><span class="nt">number</span><span class="o">&gt;),</span> <span class="err">0</span><span class="o">);</span>
  <span class="nt">--_max</span><span class="o">:</span> <span class="nt">attr</span><span class="o">(</span><span class="nt">max</span> <span class="nt">type</span><span class="o">(&lt;</span><span class="nt">number</span><span class="o">&gt;),</span> <span class="err">100</span><span class="o">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Next, we'll add a simple grid to the <code>&lt;table&gt;</code>, setting fixed heights for the caption and the label-area, and <code>1fr</code> for the chart itself:</p>

<p><a href="assets/2572592/44d6931e.jpg" class="article-body-image-wrapper"><img src="assets/2572592/44d6931e.jpg" alt="Simple Grid" loading="lazy" width="800" height="231"></a></p>

<h3>
  <a name="a-bit-of-math" href="#a-bit-of-math">
  </a>
  A bit of math
</h3>

<p>The first chart we'll build is a <em>Column Chart</em>. For that, we need to calculate the height of each column:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">td</span> <span class="p">{</span>
  <span class="nl">height</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span>
  <span class="p">((</span><span class="n">var</span><span class="p">(</span><span class="n">--_v</span><span class="p">)</span> <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--_min</span><span class="p">))</span> <span class="p">/</span> 
  <span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--_max</span><span class="p">)</span> <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--_min</span><span class="p">)))</span> 
  <span class="err">*</span> <span class="m">100</span><span class="n">cqb</span> <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--data-chart-label-h</span><span class="p">)</span>
  <span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><strong>So what's going on?</strong> We calculate the height based on <code>min</code> and <code>max</code> and the current value, then multiply by <code>100cqb</code>, which is the height of the "container" — finally, we deduct the height of the labels.</p>

<p>We'll skip the logic for colors (see final demo) — let's just add the <code>&lt;tbody&gt;</code>-part and see what we have so far:</p>

<p><a href="assets/2572592/38afb2b5.jpg" class="article-body-image-wrapper"><img src="assets/2572592/38afb2b5.jpg" alt="Table Data Added" loading="lazy" width="800" height="227"></a></p>

<p>Cool! Now, let's add some grid lines and numeric labels along the y-axis. Because it's a <code>&lt;table&gt;</code>, we can't just add any tag. Since we're not using <code>&lt;thead&gt;</code>, let's use that:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;thead</span> <span class="na">aria-hidden=</span><span class="s">"true"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;tr&gt;</span>
    <span class="nt">&lt;th</span> <span class="na">colspan=</span><span class="s">"2"</span><span class="nt">&gt;</span>50000<span class="nt">&lt;/th&gt;</span>
  <span class="nt">&lt;/tr&gt;</span>
  <span class="nt">&lt;tr&gt;</span>
    <span class="nt">&lt;th</span> <span class="na">colspan=</span><span class="s">"2"</span><span class="nt">&gt;&lt;/th&gt;</span>
  <span class="nt">&lt;/tr&gt;</span>
  <span class="nt">&lt;tr&gt;</span>
    <span class="nt">&lt;th</span> <span class="na">colspan=</span><span class="s">"2"</span><span class="nt">&gt;</span>40000<span class="nt">&lt;/th&gt;</span>
  <span class="nt">&lt;/tr&gt;</span>
  <span class="c">&lt;!-- etc. --&gt;</span>
<span class="nt">&lt;/thead&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>We need <code>aria-hidden</code>, so it's not picked up by screen readers. </p>

<p>This is styled like this:</p>

<p><a href="assets/2572592/1665eb8e.jpg" class="article-body-image-wrapper"><img src="assets/2572592/1665eb8e.jpg" alt="Thead Added" loading="lazy" width="800" height="232"></a></p>

<p>Let's see how <code>&lt;thead&gt;</code> and <code>&lt;tbody&gt;</code> look together without Dev Tool's grid inspector:</p>

<p><a href="assets/2572592/c543b7ed.jpg" class="article-body-image-wrapper"><img src="assets/2572592/c543b7ed.jpg" alt="Final Column Chart" loading="lazy" width="800" height="220"></a></p>

<p>Nice! Now, how about we create some variants?</p>

<h2>
  <a name="variants" href="#variants">
  </a>
  Variants
</h2>

<p>The variants will use the <strong>exact same markup</strong>, but because of some limitations, we have to add a few extra attributes (for now).</p>

<h3>
  <a name="area-chart" href="#area-chart">
  </a>
  Area Chart
</h3>

<p>For an <em>Area Chart</em>, we can re-use most of the <em>Column Chart</em>; we just need the value of the <em>previous</em> element for each table cell. Unfortunately, we can't grab the previous value with:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:nth-of-type</span><span class="o">(</span><span class="nt">calc</span><span class="o">(</span><span class="nt">sibling-index</span><span class="o">()</span> <span class="nt">-</span> <span class="err">1</span><span class="o">))</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>We <em>could</em> create a bunch of <code>:has(tr:nth-of-type(x))</code>-selectors to grab the value of the previous cell, but that would make the code a bit messy.</p>

<p>So — for now — we set the <em>previous value</em> on each <code>&lt;td&gt;</code> as <code>data-prev</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;tr&gt;</span>
  <span class="nt">&lt;th</span> <span class="na">scope=</span><span class="s">"row"</span><span class="nt">&gt;</span>January<span class="nt">&lt;/th&gt;</span>
  <span class="nt">&lt;td</span> <span class="na">data-value=</span><span class="s">"28500"</span> <span class="na">data-prev=</span><span class="s">"28500"</span><span class="nt">&gt;</span>$28,500<span class="nt">&lt;/td&gt;</span>
<span class="nt">&lt;/tr&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Next, we create a simple polygon <code>clip-path</code> that creates a diagonal line from the <em>previous value</em> to the <em>current value</em>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">clip-path</span><span class="o">:</span> <span class="nt">polygon</span><span class="o">(</span><span class="nt">-1</span><span class="o">%</span> <span class="err">100</span><span class="o">%,</span>
  <span class="nt">-1</span><span class="o">%</span> <span class="nt">calc</span><span class="o">(</span><span class="nt">var</span><span class="o">(</span><span class="nt">--_py</span><span class="o">)</span> <span class="o">*</span> <span class="err">100</span><span class="o">%),</span>
  <span class="err">101</span><span class="o">%</span> <span class="nt">calc</span><span class="o">(</span><span class="nt">var</span><span class="o">(</span><span class="nt">--_y</span><span class="o">)</span> <span class="o">*</span> <span class="err">100</span><span class="o">%),</span>
  <span class="err">101</span><span class="o">%</span> <span class="err">100</span><span class="o">%);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Let's not dive too deep into this, it's simply y-coordinates, calculated from <em>value</em> and <em>previous value</em>.</p>

<p><a href="assets/2572592/2483c3dd.jpg" class="article-body-image-wrapper"><img src="assets/2572592/2483c3dd.jpg" alt="Area Chart" loading="lazy" width="800" height="231"></a></p>

<p>OK, this is one of the cases where a single color looks better. Let's update <code>--data-chart-bar-bg</code>:</p>

<p><a href="assets/2572592/afb87792.jpg" class="article-body-image-wrapper"><img src="assets/2572592/afb87792.jpg" alt="Area Chart Single Color" loading="lazy" width="800" height="228"></a></p>

<h3>
  <a name="line-chart" href="#line-chart">
  </a>
  Line Chart
</h3>

<p>A line chart is <em>almost</em> the same as an area chart. We simply need to cut off the bottom part as well. That distance is the height of the line, which we define in <code>--line-chart-line-h</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">clip-path</span><span class="o">:</span> <span class="nt">polygon</span><span class="o">(</span><span class="nt">-1</span><span class="o">%</span> <span class="nt">calc</span><span class="o">(</span><span class="nt">var</span><span class="o">(</span><span class="nt">--_py</span><span class="o">)</span> <span class="o">*</span> <span class="err">100</span><span class="o">%</span> <span class="o">+</span> <span class="nt">var</span><span class="o">(</span><span class="nt">--line-chart-line-h</span><span class="o">)</span> <span class="o">/</span> <span class="err">2</span><span class="o">),</span>
  <span class="nt">-1</span><span class="o">%</span> <span class="nt">calc</span><span class="o">(</span><span class="nt">var</span><span class="o">(</span><span class="nt">--_py</span><span class="o">)</span> <span class="o">*</span> <span class="err">100</span><span class="o">%</span> <span class="nt">-</span> <span class="nt">var</span><span class="o">(</span><span class="nt">--line-chart-line-h</span><span class="o">)</span> <span class="o">/</span> <span class="err">2</span><span class="o">),</span>
  <span class="err">101</span><span class="o">%</span> <span class="nt">calc</span><span class="o">(</span><span class="nt">var</span><span class="o">(</span><span class="nt">--_y</span><span class="o">)</span> <span class="o">*</span> <span class="err">100</span><span class="o">%</span> <span class="nt">-</span> <span class="nt">var</span><span class="o">(</span><span class="nt">--line-chart-line-h</span><span class="o">)</span> <span class="o">/</span> <span class="err">2</span><span class="o">),</span>
  <span class="err">101</span><span class="o">%</span> <span class="nt">calc</span><span class="o">(</span><span class="nt">var</span><span class="o">(</span><span class="nt">--_y</span><span class="o">)</span> <span class="o">*</span> <span class="err">100</span><span class="o">%</span> <span class="o">+</span> <span class="nt">var</span><span class="o">(</span><span class="nt">--line-chart-line-h</span><span class="o">)</span> <span class="o">/</span> <span class="err">2</span><span class="o">));</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>

</svg>

</div>
</div>
</div>



<p>Now we get:</p>

<p><a href="assets/2572592/9a67c505.jpg" class="article-body-image-wrapper"><img src="assets/2572592/9a67c505.jpg" alt="Line Chart" loading="lazy" width="800" height="232"></a></p>

<h3>
  <a name="bar-chart" href="#bar-chart">
  </a>
  Bar Chart
</h3>

<p>The <em>Bar Chart</em> does not need the <code>data-prev</code>-attribute, but it <strong>does</strong> require a few style-changes. Let's not dive deep into these changes — instead, inspect the styles in the final demo.</p>

<p><a href="assets/2572592/26def999.jpg" class="article-body-image-wrapper"><img src="assets/2572592/26def999.jpg" alt="Bar Chart" loading="lazy" width="800" height="270"></a></p>

<h3>
  <a name="pie-chart" href="#pie-chart">
  </a>
  Pie Chart
</h3>

<p>The <em>Pie Chart</em> is a bit different! Here, we need to use <code>conic-gradient</code>s, where each gradient needs to start where the previous one ends. Thus, we need an accumulated value (<code>--_av</code>) and a <strong>total</strong> of all values (<code>--_t</code>):<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">tbody</span> <span class="p">{</span>
  <span class="py">--_t</span><span class="p">:</span> <span class="n">attr</span><span class="p">(</span><span class="n">data-t</span> <span class="n">type</span><span class="p">(</span><span class="err">&lt;</span><span class="n">number</span><span class="err">&gt;</span><span class="p">),</span> <span class="m">0</span><span class="p">);</span>
<span class="p">}</span>
<span class="nt">td</span> <span class="p">{</span>
  <span class="py">--_av</span><span class="p">:</span> <span class="n">attr</span><span class="p">(</span><span class="n">data-av</span> <span class="n">type</span><span class="p">(</span><span class="err">&lt;</span><span class="n">number</span><span class="err">&gt;</span><span class="p">),</span> <span class="m">0</span><span class="p">);</span>
  <span class="py">--_start</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span>
    <span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--_av</span><span class="p">)</span> <span class="p">/</span> <span class="n">var</span><span class="p">(</span><span class="n">--_t</span><span class="p">))</span> <span class="err">*</span> 
    <span class="m">360deg</span>
  <span class="p">);</span>
  <span class="py">--_end</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span>
    <span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--_v</span><span class="p">)</span> <span class="p">/</span> <span class="n">var</span><span class="p">(</span><span class="n">--_t</span><span class="p">))</span> <span class="err">*</span> 
    <span class="m">360deg</span>
  <span class="p">);</span>

  <span class="nl">background</span><span class="p">:</span> <span class="n">conic-gradient</span><span class="p">(</span>
    <span class="n">from</span> <span class="n">var</span><span class="p">(</span><span class="n">--_start</span><span class="p">),</span>
    <span class="n">var</span><span class="p">(</span><span class="n">--_bg</span><span class="p">)</span> <span class="m">0</span> <span class="n">var</span><span class="p">(</span><span class="n">--_end</span><span class="p">),</span>
    <span class="m">#0000</span> <span class="n">var</span><span class="p">(</span><span class="n">--_end</span><span class="p">)</span> 
    <span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--_start</span><span class="p">)</span> <span class="err">+</span> <span class="m">360deg</span><span class="p">)</span>
  <span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>This gives us:</p>

  <a name="donut-chart" href="#donut-chart">

  Donut Chart
</h3>

<p>A donut chart is the same as a pie chart, but with a "cut out", for which we use a simple CSS Mask:<br>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">tbody</span> <span class="p">{</span>
  <span class="nl">mask</span><span class="p">:</span> <span class="n">radial-gradient</span><span class="p">(</span><span class="nb">circle</span><span class="p">,</span> <span class="m">#0000</span> <span class="m">40%</span><span class="p">,</span> <span class="m">#000</span> <span class="m">40%</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

</svg>

  <a name="grouped-charts" href="#grouped-charts">

<p>Grouped charts are simply done with multiple cells per table row:<br>

  <span class="nt">&lt;td</span> <span class="na">data-value=</span><span class="s">"12500"</span><span class="nt">&gt;</span>12500<span class="nt">&lt;/td&gt;</span>
  <span class="nt">&lt;td</span> <span class="na">data-value=</span><span class="s">"9800"</span><span class="nt">&gt;</span>9800<span class="nt">&lt;/td&gt;</span>
  <span class="nt">&lt;td</span> <span class="na">data-value=</span><span class="s">"6200"</span><span class="nt">&gt;</span>6200<span class="nt">&lt;/td&gt;</span>
<span class="nt">&lt;/tr&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">

<h2>
  <a name="responsive-charts" href="#responsive-charts">
  </a>
  Responsive Charts
</h2>

<p>One cool thing about controlling charts in CSS, is how easily we can make them responsive. First, let's add two new attributes to our <code>&lt;data-chart&gt;</code>-component:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;data-chart</span>
  <span class="na">items-sm=</span><span class="s">"7"</span>
  <span class="na">items-xs=</span><span class="s">"4"</span>
<span class="nt">&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>These indicate how many columns we want to show per breakpoint, in this case "sm" (small) and "xs" (x-small). Add as many as you want, and control the breakpoint in a <code>@container</code>-query:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="k">@container</span> <span class="p">(</span><span class="n">max-width</span><span class="p">:</span> <span class="m">400px</span><span class="p">)</span> <span class="p">{</span>
  <span class="o">&amp;</span><span class="nd">:is</span><span class="o">([</span><span class="nt">type</span><span class="o">=</span><span class="s1">"area"</span><span class="o">],</span> <span class="o">[</span><span class="nt">type</span><span class="o">=</span><span class="s1">"column"</span><span class="o">],</span> <span class="o">[</span><span class="nt">type</span><span class="o">=</span><span class="s1">"line"</span><span class="o">])</span> <span class="p">{</span>
    <span class="err">&amp;[items-xs="1"]</span> <span class="err">tbody</span> <span class="py">tr</span><span class="p">:</span><span class="n">nth-of-type</span><span class="p">(</span><span class="n">n</span><span class="err">+</span><span class="m">2</span><span class="p">),</span>
    <span class="err">&amp;</span><span class="p">[</span><span class="n">items-xs</span><span class="err">=</span><span class="s1">"2"</span><span class="p">]</span> <span class="n">tbody</span> <span class="n">tr</span><span class="p">:</span><span class="n">nth-of-type</span><span class="p">(</span><span class="n">n</span><span class="err">+</span><span class="m">3</span><span class="p">)</span> <span class="err">{</span>
      <span class="n">display</span><span class="p">:</span> <span class="nb">none</span><span class="p">;</span>
    <span class="p">}</span>
  <span class="p">}</span>
<span class="err">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>So — in this case — if <code>items-sm="1"</code>, hide all items after <code>n+2</code> etc. Not rocket science, and hopefully something we can make more beautiful in the future.</p>
