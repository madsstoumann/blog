			<h1>How Google tracks with the ping-attribute</h1>
			<p>Have you heard about the <code>ping</code>-attribute?<br>
It's an attribute on the <code>&lt;a&gt;</code>nchor-tag, that most people haven't heard about.</p>

<p>Websites can use the <code>ping</code>-attribute to track clicks on hyperlinks.</p>

<p>You provide a space-separated list of URI's:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;a</span> <span class="na">ping=</span><span class="s">"/relativeuri https://not-so-relative-uri.com"</span><span class="nt">&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Each URI will receive a POST with the request payload 'PING'.</p>

<p>Google use this feature on their search-result-page.<br><br>
Here's an example if you search for "ping attribute":<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;a</span> <span class="na">href=</span><span class="s">"https://www.w3schools.com/tags/att_a_ping.asp"</span> <span class="na">ping=</span><span class="s">"/url?sa=t&amp;amp;source=web&amp;amp;rct=j&amp;amp;url=https://www.w3schools.com/tags/att_a_ping.asp&amp;amp;ved=2ahUKEwixrcD5g93mAhUqy8QBHRrVAN0QFjACegQIBBAB"</span><span class="nt">&gt;</span>...<span class="nt">&lt;/a&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>As a user, you will only see the content of the <code>href</code>-attribute when you hover the link. You will <em>not see</em> the list of URI's in the <code>ping</code>-attribute, that will be POST'ed if you follow the link.</p>

<p>This is against the official recommendation:</p>

<blockquote>
<p>When the <code>ping</code> attribute is present, user agents should clearly indicate to the user that following the hyperlink will also cause secondary requests to be sent in the background, possibly including listing the actual target URLs.</p>
</blockquote>


<hr>

<p>Google will 'PING', even if you don't allow cookies. You can check it by following these steps:</p>

<ol>
<li>Open an incognito window, and search for "ping attribute".</li>
<li>Inspect the markup and delete the Google popup, asking you to accept cookies.</li>
<li>Go to the Network-tab of Chrome DevTools and enable "Preserve Log".</li>
<li>Clear the current network-traffic.</li>
<li>Click on the first link (in my case, it's a w3schools-link).</li>
<li>Check the network-traffic. The first couple of entries are from the previous page (the Google result). </li>
</ol>

<p>One of them has a 'PING' payload.</p>

<p>If you study that request you'll see, that Google will have more than enough info about your browser and where you're browsing to, even though you never accepted cookies or any other tracking-agreement.</p>

<p>If you do the same in Firefox, the result will <em>not</em> have <code>ping</code>-attributes, as Firefox currently is the only browser that disables the <code>ping</code>-attribute by default. That's why <em>Google Search</em> use a JavaScript event handler in Firefox.</p>

<p>It's <a href="https://lapcatsoftware.com/articles/Safari-link-tracking.html" target="_blank" rel="noopener noreferrer">not possible</a> to disable it in Safari. </p>

<p>And in Chrome, the setting:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code>chrome://flags#disable-hyperlink-auditing
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>— has been removed. Even if you enable "Do Not Track*)", the <code>ping</code> URI's are still POST'ed.</p>


<hr>

<p>If you chose to disable JavaScript altogether, Google use redirects instead of direct links:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;a</span> <span class="na">href=</span><span class="s">"/url?q=https://www.w3schools.com/tags/att_a_ping.asp"</span> <span class="err">...</span> <span class="nt">&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>If you inspect the Network traffic once again, you'll see that when you land on the w3schools-page, it'a after a <code>HTTP 302: Redirect</code>.</p>


<hr>

<p>In these days of GDPR, it's surprising to see tracking-mechanisms that <em>cannot be disabled</em> or bypassed by the user.</p>

<h3>
  <a name="-do-not-track" href="#-do-not-track">
  </a>
  *) Do Not Track
</h3>

<p>"Do Not Track" (DNT) was a proposed HTTP header field, designed to allow internet users to opt-out of tracking by a website. It's still a setting (typically hidden away under "Advanced") in most browsers, but — alas — it doesn't have any effect, and DNT has been cancelled, which is a pity. </p>

<p>Thanks for reading!</p>
