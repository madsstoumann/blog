			<h1>Small Tips for Styling Card Components</h1>
			<p>The other day, I stumbled upon an "About Us"-page for an agency, I used to work for. Not only were the team member images in irregular and different sizes — the grid had unnecessary many levels of <code>&lt;div&gt;</code>-soup:</p>

<p><a href="assets/1816674/98896f4a.jpg" class="article-body-image-wrapper"><img src="assets/1816674/98896f4a.jpg" alt="DIV Soup" loading="lazy" width="800" height="345"></a></p>

<p>We can do better! A "team-member card" can be as simple as:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;div</span> <span class="na">class=</span><span class="s">"card"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;img</span> <span class="na">src=</span><span class="s">"srj.jpg"</span> <span class="na">alt=</span><span class="s">"Samantha Richardson-Jackson"</span> <span class="na">width=</span><span class="s">"200"</span> <span class="na">height=</span><span class="s">"200"</span> <span class="na">loading=</span><span class="s">"lazy"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;h2&gt;</span>Samantha Richardson-Jackson<span class="nt">&lt;/h2&gt;</span>
  <span class="nt">&lt;small&gt;</span>Senior Digital Program <span class="err">&amp;</span> Project Manager<span class="nt">&lt;/small&gt;</span>
<span class="nt">&lt;/div&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The CSS is a simple <code>grid</code>. We add a <code>row-gap</code>, align the content to <code>start</code>, and add an <code>aspect-ratio</code> to the image. </p>

<p>We then set a <code>background-color</code> on the image, so it looks nice while loading. I've chosen the system color <code>GrayText</code>, so it looks nice in <em>both</em> light and dark mode:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.card</span> <span class="p">{</span>
  <span class="nl">align-content</span><span class="p">:</span> <span class="n">start</span><span class="p">;</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">grid</span><span class="p">;</span>
  <span class="py">row-gap</span><span class="p">:</span> <span class="m">1ch</span><span class="p">;</span>
  <span class="err">&amp;</span> <span class="err">h2</span> <span class="err">{</span>
    <span class="nl">line-height</span><span class="p">:</span> <span class="m">1.3</span><span class="p">;</span>
    <span class="nl">margin</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
    <span class="nl">text-wrap</span><span class="p">:</span> <span class="n">pretty</span><span class="p">;</span>
  <span class="p">}</span>
  <span class="o">&amp;</span> <span class="nt">img</span> <span class="p">{</span>
    <span class="py">aspect-ratio</span><span class="p">:</span> <span class="m">1</span><span class="p">;</span>
    <span class="nl">background</span><span class="p">:</span> <span class="n">GrayText</span><span class="p">;</span>
    <span class="nl">height</span><span class="p">:</span> <span class="nb">auto</span><span class="p">;</span>
    <span class="nl">object-fit</span><span class="p">:</span> <span class="n">cover</span><span class="p">;</span>
    <span class="nl">width</span><span class="p">:</span> <span class="m">100%</span><span class="p">;</span>
  <span class="p">}</span>
<span class="err">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>For the name, <code>&lt;h2&gt;</code>, we use the new <code>text-wrap: pretty</code> — and we get:</p>

<p><a href="assets/1816674/6afc202e.jpg" class="article-body-image-wrapper"><img src="assets/1816674/6afc202e.jpg" alt="Simple Card" loading="lazy" width="440" height="718"></a></p>

<p>The job-title looks a bit <em>unbalanced</em>, let's add <code>text-wrap: balance</code> to it:</p>

<p><a href="assets/1816674/b77912d2.jpg" class="article-body-image-wrapper"><img src="assets/1816674/b77912d2.jpg" alt="Text Wrap Blance" loading="lazy" width="438" height="728"></a></p>

<p>Now, let's add a wrapper — <em>another grid</em> — with <code>auto-fill</code>, so we don't need to worry about breakpoints and responsive design:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.card-grid</span> <span class="p">{</span>
  <span class="nl">column-gap</span><span class="p">:</span> <span class="m">2em</span><span class="p">;</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">grid</span><span class="p">;</span>
  <span class="py">grid-template-columns</span><span class="p">:</span> <span class="nb">repeat</span><span class="p">(</span><span class="n">auto-fill</span><span class="p">,</span> <span class="n">minmax</span><span class="p">(</span><span class="m">200px</span><span class="p">,</span> <span class="m">1</span><span class="n">fr</span><span class="p">));</span>
  <span class="py">row-gap</span><span class="p">:</span> <span class="m">3em</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The grid will be filled with cards with a minimum width of <code>200px</code>, which will automatically break to a new line, when the space has been used up:</p>

<p><a href="assets/1816674/d1b62a75.jpg" class="article-body-image-wrapper"><img src="assets/1816674/d1b62a75.jpg" alt="Grid" loading="lazy" width="800" height="427"></a></p>


<hr>

<h2>
  <a name="using-subgrid" href="#using-subgrid">
  </a>
  Using subgrid
</h2>

<p>If you can live without the <code>auto-fill</code>, you can align the text in multiple cards using <code>subgrid</code>.</p>

<p>Add this to the <code>.card</code> CSS:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.card</span> <span class="p">{</span>
  <span class="nl">grid-row</span><span class="p">:</span> <span class="m">1</span> <span class="p">/</span> <span class="m">4</span><span class="p">;</span>
  <span class="py">grid-template-rows</span><span class="p">:</span> <span class="n">subgrid</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>… and — voilà — the name and job title align:</p>

<p><a href="assets/1816674/573a00be.jpg" class="article-body-image-wrapper"><img src="assets/1816674/573a00be.jpg" alt="Subgrid" loading="lazy" width="800" height="337"></a></p>


<hr>

<h2>
  <a name="adding-a-background-color" href="#adding-a-background-color">
  </a>
  Adding a background color
</h2>

<p>Without changing the markup, let's add a <code>background-color</code> and adjust the text accordingly:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.card</span> <span class="p">{</span>
  <span class="nl">background</span><span class="p">:</span> <span class="n">color-mix</span><span class="p">(</span><span class="n">in</span> <span class="n">srgb</span><span class="p">,</span> <span class="n">Canvas</span> <span class="m">90%</span><span class="p">,</span> <span class="n">CanvasText</span> <span class="m">10%</span><span class="p">);</span>
  <span class="err">&amp;</span> <span class="err">h2,</span> <span class="err">small</span> <span class="err">{</span> <span class="py">padding-inline</span><span class="p">:</span> <span class="m">.66rem</span><span class="p">;</span> <span class="p">}</span>
  <span class="o">&amp;</span> <span class="nt">small</span> <span class="p">{</span> <span class="py">padding-block-end</span><span class="p">:</span> <span class="m">1rem</span><span class="p">;</span> <span class="p">}</span>
<span class="err">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><a href="assets/1816674/11192356.jpg" class="article-body-image-wrapper"><img src="assets/1816674/11192356.jpg" alt="Background" loading="lazy" width="458" height="780"></a></p>

<p>The <code>color-mix</code> blends two <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/system-color" target="_blank" rel="noopener noreferrer">System Colors</a>, so we don't have to do anything about dark mode:</p>

<p><a href="assets/1816674/b0eb80a3.jpg" class="article-body-image-wrapper"><img src="assets/1816674/b0eb80a3.jpg" alt="Dark Mode" loading="lazy" width="538" height="856"></a></p>


<hr>

<h2>
  <a name="rounded" href="#rounded">
  </a>
  Rounded
</h2>

<p>If we want rounded borders, we can add <code>border-radius: .5em</code>:</p>

<p><a href="assets/1816674/e7ffb98f.jpg" class="article-body-image-wrapper"><img src="assets/1816674/e7ffb98f.jpg" alt="Border Radius" loading="lazy" width="466" height="778"></a></p>

<p>— But that doesn't seem to work for the image … we need to set:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.card</span> <span class="p">{</span>
  <span class="nl">border-radius</span><span class="p">:</span> <span class="m">.5em</span><span class="p">;</span>
  <span class="err">&amp;</span> <span class="err">img</span> <span class="err">{</span>
    <span class="py">border-start-start-radius</span><span class="p">:</span> <span class="nb">inherit</span><span class="p">;</span>
    <span class="py">border-start-end-radius</span><span class="p">:</span> <span class="nb">inherit</span><span class="p">;</span>
  <span class="p">}</span>
<span class="err">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>— <strong>OR</strong> we can use <code>clip-path</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.card</span> <span class="p">{</span>
  <span class="nl">clip-path</span><span class="p">:</span> <span class="nb">inset</span><span class="p">(</span><span class="m">0</span> <span class="n">round</span> <span class="m">.5em</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><a href="assets/1816674/2a4f0913.jpg" class="article-body-image-wrapper"><img src="assets/1816674/2a4f0913.jpg" alt="Border Radius and clippath" loading="lazy" width="460" height="778"></a></p>

<p>The result is the same, but <code>clip-path</code> will also cut off box-shadows and borders, should you need them.</p>

<p>And that concludes this tutorial! As you can see, a card-component can be <em>super simple</em>, with a <strong>lot</strong> of flexibility through the power of CSS grids.</p>
