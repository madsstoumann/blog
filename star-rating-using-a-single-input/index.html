		<article>
			<h1>Star-Rating Using A Single Input</h1>
			<p>Yesterday I read InhuOfficial's <a href="https://dev.to/inhuofficial/5-star-rating-system-actually-accessible-no-js-no-wai-aria-3idl">post about star-rating</a>, using a group of <code>&lt;input type="radio"&gt;</code>-controls. Go read that for some great accessibility-insights.</p>

<p>I did something similar a couple of years ago, also using radio-buttons, but with the <a href="https://css-tricks.com/examples/StarRating/" target="_blank" rel="noopener noreferrer">unicode:bidi / direction</a>-hack to select the previous elements on <code>:hover</code>.<br>
On Codepen, you'll find <a href="https://codepen.io/lsirivong/pen/ekBxI" target="_blank" rel="noopener noreferrer">more examples</a>.</p>

<p>But it made me think: Is there another, perhaps simpler way, to create a rating-control?</p>

<p>Earlier this year, I did this <a href="https://codepen.io/stoumann/pen/VwKgJNv" target="_blank" rel="noopener noreferrer">image compare</a>, where a single <code>&lt;input type="range"&gt;</code> controls two <code>clip-path</code>'s.</p>

<p>That would also work as a rating-control, where the “left” image is the “filled stars” and the “right” image is the “unfilled stars”.</p>

<p><strong>What are the advantages of using an <code>&lt;input type="range"&gt;</code>?</strong></p>

<ul>
<li>It's keyboard-accessible, can be controlled with all four arrow-keys</li>
<li>It's touch-friendly</li>
<li>It returns a <code>value</code> (and <code>valueAsNumber</code>in JavaScript), great for both visual browsers and screen-readers.</li>
</ul>

<p>Let's dive into how we can use an <code>&lt;input type="range"&gt;</code> for a rating-control. We'll make one, where you can easily add more stars, use half or even quarter-star rating, customize the star-colors etcetera.</p>

<hr>
<h2>
  <a name="the-html" href="#the-html">
  </a>
  The HTML
</h2>


<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;label</span> <span class="na">class=</span><span class="s">"rating-label"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;strong&gt;</span>Rating<span class="nt">&lt;/strong&gt;</span>
  <span class="nt">&lt;input</span>
    <span class="na">class=</span><span class="s">"rating"</span>
    <span class="na">max=</span><span class="s">"5"</span>
    <span class="na">oninput=</span><span class="s">"this.style.setProperty('--value', this.value)"</span>
    <span class="na">step=</span><span class="s">"0.5"</span>
    <span class="na">type=</span><span class="s">"range"</span>
    <span class="na">value=</span><span class="s">"1"</span><span class="nt">&gt;</span>
<span class="nt">&lt;/label&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>


<p>The <code>max</code> is used for ”how many stars”. The <code>step</code> is <code>1</code> by default, but in this case, it's been set to <code>0.5</code>, allowing “half stars”. The <code>oninput</code> can be moved to an <code>eventListener</code>, if you want. It returns the current <code>value</code> and sets it as a “CSS Custom Property”: <code>--value</code>.</p>

<hr>
<h2>
  <a name="the-css" href="#the-css">
  </a>
  The CSS
</h2>

<p>The first thing we need, is a star:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">--star</span><span class="o">:</span> <span class="nt">url</span><span class="o">(</span><span class="s2">'data:image/svg+xml,&lt;svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"&gt;&lt;path d="M12 17.25l-6.188 3.75 1.641-7.031-5.438-4.734 7.172-0.609 2.813-6.609 2.813 6.609 7.172 0.609-5.438 4.734 1.641 7.031z"/&gt;&lt;/svg&gt;'</span><span class="o">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>This is an SVG, used in a CSS <code>url()</code>, so we can use it as a <code>mask</code> in mutiple places.</p>

<p>The <code>fill</code> of the stars and the default background-fill (when a star is <strong>not</strong> selected) are set as properties too:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">--fill</span><span class="o">:</span> <span class="nt">gold</span><span class="o">;</span>
<span class="nt">--fillbg</span><span class="o">:</span> <span class="nt">rgba</span><span class="o">(</span><span class="err">100</span><span class="o">,</span> <span class="err">100</span><span class="o">,</span> <span class="err">100</span><span class="o">,</span> <span class="err">0</span><span class="o">.</span><span class="err">15</span><span class="o">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And finally, we need some default sizes and values:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">--dir</span><span class="o">:</span> <span class="nt">right</span><span class="o">;</span>
<span class="nt">--stars</span><span class="o">:</span> <span class="err">5</span><span class="o">;</span>
<span class="nt">--starsize</span><span class="o">:</span> <span class="err">3</span><span class="nt">rem</span><span class="o">;</span>
<span class="nt">--symbol</span><span class="o">:</span> <span class="nt">var</span><span class="o">(</span><span class="nt">--star</span><span class="o">);</span>
<span class="nt">--value</span><span class="o">:</span> <span class="err">1</span><span class="o">;</span>
<span class="nt">--x</span><span class="o">:</span> <span class="nt">calc</span><span class="o">(</span><span class="err">100</span><span class="o">%</span> <span class="o">*</span> <span class="o">(</span><span class="nt">var</span><span class="o">(</span><span class="nt">--value</span><span class="o">)</span> <span class="o">/</span> <span class="nt">var</span><span class="o">(</span><span class="nt">--stars</span><span class="o">)));</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The <code>--x</code> variable is essential, as this indicates the “cutting point” in the gradient, we'll use in the “track” of the range-slider:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.rating</span><span class="nd">::-webkit-slider-runnable-track</span> <span class="p">{</span>
  <span class="nl">background</span><span class="p">:</span> <span class="n">linear-gradient</span><span class="p">(</span><span class="n">to</span> <span class="n">var</span><span class="p">(</span><span class="n">--dir</span><span class="p">),</span> <span class="n">var</span><span class="p">(</span><span class="n">--fill</span><span class="p">)</span> <span class="m">0</span> <span class="n">var</span><span class="p">(</span><span class="n">--x</span><span class="p">),</span> <span class="n">var</span><span class="p">(</span><span class="n">--fillbg</span><span class="p">)</span> <span class="m">0</span> <span class="n">var</span><span class="p">(</span><span class="n">--x</span><span class="p">));</span>
  <span class="py">block-size</span><span class="p">:</span> <span class="m">100%</span><span class="p">;</span>
  <span class="nl">mask</span><span class="p">:</span> <span class="nb">repeat</span> <span class="nb">left</span> <span class="nb">center</span><span class="p">/</span><span class="n">var</span><span class="p">(</span><span class="n">--starsize</span><span class="p">)</span> <span class="n">var</span><span class="p">(</span><span class="n">--symbol</span><span class="p">);</span>
  <span class="nl">-webkit-mask</span><span class="p">:</span> <span class="nb">repeat</span> <span class="nb">left</span> <span class="nb">center</span><span class="p">/</span><span class="n">var</span><span class="p">(</span><span class="n">--starsize</span><span class="p">)</span> <span class="n">var</span><span class="p">(</span><span class="n">--symbol</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And that's basically it! The <code>linear-gradient</code> is “filling up” the stars with the <code>--fill</code>-color, while the <code>mask</code> is used to mask it as stars. </p>

<p>But why the <code>--dir</code>-property in the <code>linear-gradient</code>?</p>

<p>That's because we can't set a <em>logical direction</em> in CSS-gradients, for instance:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">linear-gradient</span><span class="o">(</span><span class="nt">to</span> <span class="nt">inline-end</span><span class="o">,</span> <span class="o">...)</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>… does <strong>not work</strong> (yet!). Therefore, in order to make it work with “right-to-left”-languages, we need the <code>--dir</code>-property:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">[</span><span class="nt">dir</span><span class="o">=</span><span class="s1">"rtl"</span><span class="o">]</span> <span class="nc">.rating</span> <span class="p">{</span>
  <span class="py">--dir</span><span class="p">:</span> <span class="nb">left</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>In this case, when the dir is <code>rtl</code>, the gradient will be “to left”.</p>

<p>Here's a Codepen demo – notice how easy it is to add more stars, and how you can “drag” it as a slider:</p>

<p><iframe height="600" src="https://codepen.io/stoumann/embed/yLbYOdz?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
</p>

<blockquote>
<p><strong>UPDATE:</strong> People have requested a non-JS version, although the JS is only 45 bytes. Chrome does not support <code>range-progress</code> (like Firefox), but a hack using <code>box-shadow</code> can be used. The example above has been updated to include both types. You can also set it to <code>readonly</code>, if you want to show an “average review rating” like the last of the examples above.</p>
</blockquote>
