			<h1>Lockdown Fun: Pascal's Triangle</h1>
			<p>About 7 or 8 years ago, there was a teachers-strike in Denmark, and I had to teach my daughter's class in Math. I made a lot of small "apps" and tasks, which I just uncovered from an old folder.</p>

<p>Here's an updated version of one: "Pascal's Triangle" — for kids of all ages in Lockdown. </p>

<p>Click on all numbers divisible by 5 to see the hidden pattern!</p>

<p>When viewed on larger screens, you can toggle on/off the row explanations and colors. You'll also see the sum of each row at the left side of the screen. This should be a recognizable pattern to developers — tell your kids about <a href="https://en.wikipedia.org/wiki/Power_of_two" target="_blank" rel="noopener noreferrer">the power of two</a>!</p>

<p><iframe height="600" src="https://codepen.io/stoumann/embed/dyOozQV?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
</p>

<p>If you have kids that are <em>really</em> bored — set the "rows" in the JavaScript-section of the Pen to more than 50 (requires a very large screen!), and have them click on <em>all</em> numbers divisible by 5!</p>

<p>Have a great weekend!</p>
