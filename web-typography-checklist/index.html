		<article>
			<h1>Web Typography Checklist</h1>
			<p>All websites need typography, but before picking a typeface for a website, there are <em>a lot of</em> things you need to consider, questions you need to ask yourself.</p>

<p>This post is a collection of such questions — along with suggestions and answers, for both designers and frontend developers.</p>

<h2>
  <a name="can-you-use-websafe-or-system-fonts" href="#can-you-use-websafe-or-system-fonts">
  </a>
  Can You Use Websafe Or System Fonts?
</h2>

<p>The best fonts are the ones you <strong>don't</strong> have to download — the fonts already on your system. Also known as <em>websafe fonts</em>, these include classic typefaces like "Times", "Georgia", "Arial" and "Impact".</p>

<p>These "classic websafe fonts" have been (mis-)used for so many years, so they don't stand out anymore. In CSS, the <em>generic family names</em> correspond to these:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">font-family</span><span class="o">:</span> <span class="nt">serif</span><span class="o">;</span> <span class="c">/* Times */</span>
<span class="nt">font-family</span><span class="o">:</span> <span class="nt">sans-serif</span><span class="o">;</span> <span class="c">/* Arial / Helvetica */</span>
<span class="nt">font-family</span><span class="o">:</span> <span class="nt">monospace</span><span class="o">;</span> <span class="c">/* Courier */</span>
<span class="nt">font-family</span><span class="o">:</span> <span class="nt">cursive</span><span class="o">;</span> <span class="c">/* Apple Chancery (Mac), Comic Sans (Windows) */</span>
<span class="nt">font-family</span><span class="o">:</span> <span class="nt">fantasy</span><span class="o">;</span> <span class="c">/* Papyrus (Mac), Impact (Windows) */</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

</svg>

</div>
</div>



<blockquote>
<p><strong>Bonus:</strong> SNL made a <a href="https://www.youtube.com/watch?v=jVhlJNJopOQ" target="_blank" rel="noopener noreferrer">really funny sketch</a> about <em>Papyrus</em>.</p>
</blockquote>

<p>The specs also supports these types:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">font-family</span><span class="o">:</span> <span class="nt">emoji</span><span class="o">;</span>
<span class="nt">font-family</span><span class="o">:</span> <span class="nt">math</span><span class="o">;</span>
<span class="nt">font-family</span><span class="o">:</span> <span class="nt">fangsong</span><span class="o">;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>— but there are no default font-fallbacks for any of these on either OSX or Windows.</p>

<h3>
  <a name="the-new-raw-ui-endraw-system-fonts" href="#the-new-raw-ui-endraw-system-fonts">
  </a>
  The New <code>ui-</code> System Fonts
</h3>



<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">font-family</span><span class="o">:</span> <span class="nt">system-ui</span><span class="o">;</span>
<span class="nt">font-family</span><span class="o">:</span> <span class="nt">ui-serif</span><span class="o">;</span>
<span class="nt">font-family</span><span class="o">:</span> <span class="nt">ui-sans-serif</span><span class="o">;</span>
<span class="nt">font-family</span><span class="o">:</span> <span class="nt">ui-monospace</span><span class="o">;</span>
<span class="nt">font-family</span><span class="o">:</span> <span class="nt">ui-rounded</span><span class="o">;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The <code>ui-</code>-fonts are the default <em>system fonts</em> of an operating system.<br><br>
On Windows, only <code>system-ui</code> is currently supported, which is the "Segoe UI"-font-family. </p>

<p>On OSX both <code>system-ui</code> and <code>ui-sans-serif</code> is the "SF Pro"-font, <code>ui-monospace</code> is "SF Mono", whereas the <code>ui-serif</code> is the beautiful "New York":</p>

<p><a href="assets/606234/efe280fb.jpg" class="article-body-image-wrapper"><img src="assets/606234/efe280fb.jpg" alt="image" loading="lazy" width="800" height="514"></a></p>

<p>While you're not allowed to distribute them as web-fonts, Apple provides these fonts as a <a href="https://developer.apple.com/fonts/" target="_blank" rel="noopener noreferrer">free download</a> for your (non-Apple) system.</p>

<p>Both dev.to and GitHub use system fonts, meaning these sites will look slightly different on a Mac, compared with a PC.<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">body</span> <span class="p">{</span>
  <span class="nl">font-family</span><span class="p">:</span> <span class="n">-apple-system</span><span class="p">,</span><span class="n">BlinkMacSystemFont</span><span class="p">,</span><span class="n">Segoe</span> <span class="n">UI</span><span class="p">,</span><span class="n">Helvetica</span><span class="p">,</span><span class="n">Arial</span><span class="p">,</span><span class="nb">sans-serif</span><span class="p">,</span><span class="n">Apple</span> <span class="n">Color</span> <span class="n">Emoji</span><span class="p">,</span><span class="n">Segoe</span> <span class="n">UI</span> <span class="n">Emoji</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>I prefer the simpler, new <code>ui-</code>-syntax with <code>system-ui</code>-fallback:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">body</span> <span class="p">{</span>
  <span class="nl">font-family</span><span class="p">:</span> <span class="n">ui-sans-serif</span><span class="p">,</span> <span class="n">system-ui</span><span class="p">,</span> <span class="nb">sans-serif</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<h3>
  <a name="pros" href="#pros">
  </a>
  Pros
</h3>

<p>System Fonts are available in <strong>all</strong> languages, and — especially on OSX — you get really beautiful, readable and variable fonts.</p>

<h3>
  <a name="cons" href="#cons">
  </a>
  Cons
</h3>

<p>Your website will either look like Microsoft on Windows-based browsers, or Apple on OSX-based browsers.</p>


<hr>

<h2>
  <a name="other-options" href="#other-options">
  </a>
  Other Options
</h2>

<p>If you're unable to use websafe- or system fonts, you need to consider these things, before choosing a font from a free font-service, or buying a licensed font:</p>

<h3>
  <a name="should-the-site-support-multiple-languages" href="#should-the-site-support-multiple-languages">
  </a>
  Should the site support multiple languages?
</h3>

<p>If yes, pick a font that supports all of them.</p>

<h3>
  <a name="do-you-need-multiple-weights-and-styles-bold-italic-etc" href="#do-you-need-multiple-weights-and-styles-bold-italic-etc">
  </a>
  Do you need multiple weights and styles <em>(bold, italic etc.)?</em>
</h3>

<p>If yes, consider using a <strong>variable font</strong>, as variable fonts in general saves a <strong>lot</strong> of space, compared with loading multiple weights and styles. One of the most popular variable fonts, is the <a href="https://rsms.me/inter/" target="_blank" rel="noopener noreferrer">Inter Font-Family</a>, which captures that classic Swiss-based typography in a single variable font.</p>

<p>If you do not load different weights or styles, yet write <code>font-weight: 700</code> or <code>font-style: italic</code> in your CSS-code, the browser will create <a href="https://alistapart.com/article/say-no-to-faux-bold/" target="_blank" rel="noopener noreferrer">faux bold or italic</a>:</p>

<blockquote>
<p><em>Browsers can do terrible things to type. If text is styled as bold or italic and the typeface family does not include a bold or italic font, browsers will compensate by trying to create bold and italic styles themselves. The results are an awkward mimicry of real type design.</em></p>
</blockquote>

<h3>
  <a name="should-the-site-work-in-china" href="#should-the-site-work-in-china">
  </a>
  Should the site work in China?
</h3>

<p>If yes, find a font you can host yourself, as Google's services are not always stable in China.</p>

<h3>
  <a name="should-the-website-work-offline" href="#should-the-website-work-offline">
  </a>
  Should the website work offline?
</h3>

<p>If you're caching you site with a <em>Service Worker</em>, you must find a font, where the licence permits the font to be downloaded to the user's device.</p>


<hr>

<h2>
  <a name="google-fonts" href="#google-fonts">
  </a>
  Google Fonts
</h2>

<p><a href="https://fonts.google.com/" target="_blank" rel="noopener noreferrer">Google Fonts</a> is a free font-service from Google, currently with 1035 font-families. Pick the font(s) you need, and you'll be guided as to how to implement and use them.</p>

<p>If you're using a <a href="https://dev.to/madsstoumann/frontend-security-content-security-policy-17dl">Content Security Policy</a> on your site, be sure to add the entries required for <em>Google Fonts.</em></p>

<h3>
  <a name="selfhosted-google-fonts" href="#selfhosted-google-fonts">
  </a>
  Self-hosted Google Fonts
</h3>

<p><em>Google Fonts</em> can slow down your site's performance, as it's a "high-traffic"-site. For better performance, host your Google Fonts yourself.</p>

<p><a href="https://google-webfonts-helper.herokuapp.com/fonts" target="_blank" rel="noopener noreferrer">Here's an excellent tool</a> that will help you download the correct files.</p>


<hr>

<h2>
  <a name="licenced-fonts" href="#licenced-fonts">
  </a>
  Licenced Fonts
</h2>

<p>There are <strong>many</strong> type-foundries online (my personal favorite is <a href="https://www.typography.com" target="_blank" rel="noopener noreferrer">typography.com</a>), and you often get top-notch quality fonts. </p>

<p>Quality comes at a price, though — but your site will stand out. Many licensed fonts include typographic features such as <em>real</em> <a href="https://www.typography.com/fonts/hoefler-text/overview" target="_blank" rel="noopener noreferrer">small caps and ligatures</a> and much more.</p>


<hr>

<h2>
  <a name="fallback-font" href="#fallback-font">
  </a>
  Fallback Font
</h2>

<p>When you've picked a font that is <strong>not</strong> a websafe- or system-font, you need to provide a generic fallback font-family. This is the one your browser will use until the real font has downloaded.</p>

<p><em>Example, using Google Fonts' Roboto:</em><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="k">@import</span> <span class="sx">url('https://fonts.googleapis.com/css2?family=Roboto&amp;display=swap')</span><span class="p">;</span>
<span class="nt">body</span> <span class="p">{</span>
  <span class="nl">font-family</span><span class="p">:</span> <span class="s2">'Roboto'</span><span class="p">,</span> <span class="nb">sans-serif</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Here, the generic font-family <code>sans-serif</code> is the fallback-font. Notice the <code>display=swap</code> at the end of the import-line? That will be replaced with:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">font-display</span><span class="o">:</span> <span class="nt">swap</span><span class="o">;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>There are other <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/@font-face/font-display" target="_blank" rel="noopener noreferrer">font-display-options</a>, the <code>swap</code>-option:</p>

<blockquote>
<p>... gives the font face an extremely small block period and an infinite swap period.</p>
</blockquote>

<p>You can, however, experience <em>Layout Shifts</em> when the correct font has downloaded — which results in a poorer PageSpeed Index.</p>

<p>This is because fonts have different x-heights (the height of the lower-case "x"), ascenders, descenders and more:</p>

<p><a href="assets/606234/c5696339.jpg" class="article-body-image-wrapper"><img src="assets/606234/c5696339.jpg" alt="image" loading="lazy" width="616" height="211"></a></p>

<p>To overcome this, you can use something called <em>font metric override descriptors</em> in CSS to change the properties of the fallback-font to match the swapped font:</p>

<p><a href="assets/606234/9309b505.jpg" class="article-body-image-wrapper"><img src="assets/606234/9309b505.jpg" alt="image" loading="lazy" width="800" height="447"></a></p>

<p>This is currently only in <em>Chrome</em> and <em>Edge</em>, but hopefully the other browsers will catch on soon. </p>

<p>Jake Archibald has made a <a href="https://www.youtube.com/watch?v=Z6wjUOSh9Tk" target="_blank" rel="noopener noreferrer">video about performance</a>, where he talks about <em>font metric override descriptors</em>.</p>

<p>In his example, he's able to mimic the descriptors of the fallback-font to match the replaced font:</p>

<p><a href="assets/606234/ce6562a6.jpg" class="article-body-image-wrapper"><img src="assets/606234/ce6562a6.jpg" alt="image" loading="lazy" width="800" height="446"></a></p>


<hr>

<h2>
  <a name="next-steps" href="#next-steps">
  </a>
  Next Steps
</h2>

<p>When you've picked your font, there are only a few more things left to consider: <strong>line-length</strong>, <strong>hyphenation</strong> and <strong>text-direction</strong>.</p>


<hr>

<h2>
  <a name="linelength-and-fontlength-units" href="#linelength-and-fontlength-units">
  </a>
  Line-length and font-length units
</h2>

<p>In typography, the ideal number of characters on a line is between 60 and 70.</p>

<p>If a line of text is <strong>too wide</strong>, the reader's eyes will have a hard time focusing on the text, while if it's <strong>too narrow</strong>, the eyes will have to travel back too often, breaking the rhythm.</p>

<p>CSS provides a lot of <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/length" target="_blank" rel="noopener noreferrer">font-relative lengths</a>:</p>

<ul>
<li>
<code>cap</code> (cap-height)</li>
<li>
<code>ch</code> (width of the glyph '0' zero)</li>
<li>
<code>em</code> (calculated font-size)</li>
<li>
<code>ex</code> (x-height of the font)</li>
<li>
<code>ic</code> (measure of the "水" glyph)</li>
<li>
<code>lh</code> (computed value of the line-height)</li>
<li>
<code>rem</code> (font-size of the root element)</li>
<li>
<code>rlh</code> ( computed value of the root line-height)
</li>
</ul>

<p><em>Example, using ch:</em><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.class</span> <span class="p">{</span>
  <span class="nl">width</span><span class="p">:</span> <span class="m">60ch</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

<h2>
  <a name="hyphenation" href="#hyphenation">
  </a>
  Hyphenation
</h2>

<p>Browsers do not support hyphenation for <strong>all</strong> languages.<br><br>
If your language is supported, just add this to your CSS:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.class</span> <span class="p">{</span>
  <span class="nl">hyphens</span><span class="p">:</span> <span class="nb">auto</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>However, languages like Japanese, Thai and Korean can have sentences that <em>seem</em> to be one long string to the untrained eye. In cases like these, where the browser cannot hyphenate correctly, it's recommended to suggest a "word-break opportunity" using the "soft hyphen": <code>&amp;shy;</code></p>

<p>Unfortunately, in most CMS-based systems, an editor <strong>cannot</strong> type in html-code.<br><br>
I've worked on projects, where an editor will type in the pipe character <code>|</code> for "word-break opportunities" instead:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code>De|oxy|ribo|nuclease
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Which at render, will be replaced with:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code>De<span class="ni">&amp;shy;</span>oxy<span class="ni">&amp;shy;</span>ribo<span class="ni">&amp;shy;</span>nuclease
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>For Thai, which do not use spaces between words, it can be <em>really</em> difficult:</p>

<blockquote>
<p><em>Thai line breaking and word breaking, unlike western languages, is still considered an unsolved problem and is still actively tackled by many linguistics researchers. Currently there is no implementation that could perfectly break a sentence to Thai words. <br>
Many times, it has something to do with the context. For example, the phrase "ตากลม" can be correctly broken to "ตา","กลม" or "ตาก","ลม". Each way says totally different thing but Thai readers can still perfectly understand the intended meaning, given the context.</em></p>
</blockquote>

<p>In problematic cases, you can use the:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.class</span> <span class="p">{</span>
  <span class="nl">word-break</span><span class="p">:</span> <span class="n">break-all</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>— but the result is not pretty.</p>


<hr>

<h2>
  <a name="righttoleft" href="#righttoleft">
  </a>
  Right-To-Left
</h2>

<p>When working with <code>[dir="rtl"]</code>-sites, it's recommended to use <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Logical_Properties" target="_blank" rel="noopener noreferrer">CSS Logical Properties</a>.</p>

<p>This takes some "getting-used-to" for frontend-developers, who've previously only worked with english/latin-based text.</p>

<p><em>Before:</em><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.class</span> <span class="p">{</span>
  <span class="nl">text-align</span><span class="p">:</span> <span class="nb">left</span><span class="p">;</span>
  <span class="nl">padding-right</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>
  <span class="nl">margin-top</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><em>After:</em><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.class</span> <span class="p">{</span>
  <span class="nl">text-align</span><span class="p">:</span> <span class="n">start</span><span class="p">;</span>
  <span class="py">padding-inline-end</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>
  <span class="py">margin-block-start</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Safari has some issues with some of the CSS Logical Properties, one of them being <code>inset-inline-end</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.class</span> <span class="p">{</span>
  <span class="py">inset-inline-end</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>
  <span class="nl">position</span><span class="p">:</span> <span class="nb">absolute</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>For now, you need to write a hack:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="k">@media</span> <span class="n">not</span> <span class="n">all</span> <span class="n">and</span> <span class="p">(</span><span class="n">min-resolution</span><span class="p">:</span><span class="m">.001dpcm</span><span class="p">)</span> <span class="p">{</span> <span class="k">@supports</span> <span class="p">(</span><span class="n">-webkit-appearance</span><span class="p">:</span><span class="nb">none</span><span class="p">)</span> <span class="n">and</span> <span class="p">(</span><span class="n">stroke-color</span><span class="p">:</span><span class="nb">transparent</span><span class="p">)</span> <span class="p">{</span> 
  <span class="nc">.class</span> <span class="p">{</span>
    <span class="nl">right</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>
  <span class="p">}</span>
<span class="p">}}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<h2>
  <a name="final-thoughts" href="#final-thoughts">
  </a>
  Final Thoughts
</h2>

<p>There are many "experimental features" or feautures that require <em>vendor prefixes</em>, when it comes to typography. On OSX you have the popular <code>-webkit-font-smoothing</code>-property, for instance. </p>

<p>For <em>Variable Fonts</em> there are a number of settings, beyond the scope of this article. </p>

<p>The best place for documentation is, as always, <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_Fonts" target="_blank" rel="noopener noreferrer">MDN</a>.</p>


<hr>

<p>Thanks for reading!</p>
