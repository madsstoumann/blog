		<article>
			<h1>The Periodic Table in CSS</h1>
			<p>Like <a href="https://dev.to/madsstoumann/the-solar-system-in-css-51bo">the Solar System</a>, <em>The Periodic Table</em> has been done in CSS a lot of times … but it has never been done as simply, as I'm about to show you.</p>

<p>Let's start with some basic, semantic markup:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;ol&gt;</span>
  <span class="nt">&lt;li</span> <span class="na">data-mass=</span><span class="s">"1.0078"</span><span class="nt">&gt;</span>
    <span class="nt">&lt;abbr</span> <span class="na">title=</span><span class="s">"Hydrogen"</span><span class="nt">&gt;</span>H<span class="nt">&lt;/abbr&gt;</span>
  <span class="nt">&lt;/li&gt;</span>
<span class="nt">&lt;/ol&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>We use an <strong>ordered list</strong>, <code>&lt;ol&gt;</code>, as this is an ordered system of elements.</p>

<p>We then have a <code>&lt;li&gt;</code> tag for each element, and an <code>&lt;abbr&gt;</code> tag.</p>

<blockquote>
<p>The name of the <code>&lt;abbr&gt;</code> element is an abbreviation for the word “abbreviation”, which is cute.<br>
— Heydon Pickering.</p>
</blockquote>

<p>Now, instead of Googling the atomic mass of each element, we just ask ChatGPT to fill out the rest of the markup. We also ask it to add a 3-letter class to each element, indicating which <em>type</em> the element is, ie. a "noble gas" (<code>class="nbl"</code>) etc. — and we get 118 elements:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;ol&gt;</span>
  <span class="nt">&lt;li</span> <span class="na">data-mass=</span><span class="s">"1.0078"</span> <span class="na">class=</span><span class="s">"rnm"</span><span class="nt">&gt;</span>
    <span class="nt">&lt;abbr</span> <span class="na">title=</span><span class="s">"Hydrogen"</span><span class="nt">&gt;</span>H<span class="nt">&lt;/abbr&gt;</span>
  <span class="nt">&lt;/li&gt;</span>
  <span class="nt">&lt;li</span> <span class="na">data-mass=</span><span class="s">"4.0026"</span> <span class="na">class=</span><span class="s">"nbl"</span><span class="nt">&gt;</span>
    <span class="nt">&lt;abbr</span> <span class="na">title=</span><span class="s">"Helium"</span><span class="nt">&gt;</span>He<span class="nt">&lt;/abbr&gt;</span>
  <span class="nt">&lt;/li&gt;</span>
  <span class="nt">&lt;li</span> <span class="na">data-mass=</span><span class="s">"6.941"</span> <span class="na">class=</span><span class="s">"alk"</span><span class="nt">&gt;</span>
    <span class="nt">&lt;abbr</span> <span class="na">title=</span><span class="s">"Lithium"</span><span class="nt">&gt;</span>Li<span class="nt">&lt;/abbr&gt;</span>
  <span class="nt">&lt;/li&gt;</span> 
  <span class="c">&lt;!-- etc. --&gt;</span>
<span class="nt">&lt;/ol&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

</svg>

    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>It doesn't look great yet; it's just a numbered list with abbreviations for the elements.<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight plaintext"><code>1. H
2. He
3. Li
etc.
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Let's turn the list into a 18x10 grid:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">ol</span> <span class="p">{</span>
  <span class="nl">all</span><span class="p">:</span> <span class="n">unset</span><span class="p">;</span>
  <span class="py">container-type</span><span class="p">:</span> <span class="n">inline-size</span><span class="p">;</span>
  <span class="nl">counter-reset</span><span class="p">:</span> <span class="n">element</span><span class="p">;</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">grid</span><span class="p">;</span> 
  <span class="nl">font-size</span><span class="p">:</span> <span class="m">2</span><span class="n">cqi</span><span class="p">;</span>
  <span class="py">gap</span><span class="p">:</span> <span class="m">1px</span><span class="p">;</span>
  <span class="py">grid-template-columns</span><span class="p">:</span> <span class="nb">repeat</span><span class="p">(</span><span class="m">18</span><span class="p">,</span> <span class="m">1</span><span class="n">fr</span><span class="p">);</span>
  <span class="py">grid-template-rows</span><span class="p">:</span> <span class="nb">repeat</span><span class="p">(</span><span class="m">10</span><span class="p">,</span> <span class="m">1</span><span class="n">fr</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Now, we set each <code>&lt;li&gt;</code> to be a square box and create an internal grid to place the atomic number top-left, the mass (<code>data-mass</code>) in the top-right, and the <code>&lt;abbr&gt;</code> tag below:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">li</span> <span class="p">{</span>
  <span class="py">aspect-ratio</span><span class="p">:</span> <span class="m">1</span> <span class="p">/</span> <span class="m">1</span><span class="p">;</span>
  <span class="nl">background</span><span class="p">:</span> <span class="m">#EEEEEE</span><span class="p">;</span>
  <span class="nl">counter-increment</span><span class="p">:</span> <span class="n">element</span><span class="p">;</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">grid</span><span class="p">;</span>
  <span class="py">grid-template-columns</span><span class="p">:</span> <span class="m">1</span><span class="n">fr</span> <span class="m">1</span><span class="n">fr</span><span class="p">;</span>
  <span class="py">grid-template-rows</span><span class="p">:</span> <span class="m">1</span><span class="n">fr</span> <span class="m">1</span><span class="n">fr</span> <span class="m">1</span><span class="n">fr</span><span class="p">;</span>
  <span class="nl">padding</span><span class="p">:</span> <span class="m">.25ch</span><span class="p">;</span>
  <span class="nl">transition</span><span class="p">:</span> <span class="n">scale</span> <span class="m">.125s</span> <span class="n">ease-in</span><span class="p">;</span>
  <span class="err">&amp;::before</span> <span class="err">{</span>
    <span class="nl">content</span><span class="p">:</span> <span class="n">counter</span><span class="p">(</span><span class="n">element</span><span class="p">);</span>
  <span class="p">}</span>
  <span class="o">&amp;</span><span class="nd">::after</span> <span class="p">{</span>
    <span class="nl">content</span><span class="p">:</span> <span class="n">attr</span><span class="p">(</span><span class="n">data-mass</span><span class="p">);</span>
    <span class="py">grid-area</span><span class="p">:</span> <span class="m">1</span> <span class="p">/</span> <span class="m">2</span> <span class="p">/</span> <span class="m">2</span> <span class="p">/</span> <span class="m">2</span><span class="p">;</span>
    <span class="py">justify-self</span><span class="p">:</span> <span class="n">end</span><span class="p">;</span>
  <span class="p">}</span>
  <span class="o">&amp;</span><span class="nd">::before</span><span class="o">,</span> <span class="o">&amp;</span><span class="nd">::after</span> <span class="p">{</span>
    <span class="nl">font-size</span><span class="p">:</span> <span class="m">.33em</span><span class="p">;</span>
  <span class="p">}</span>
<span class="err">}</span>
</code></pre>

<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>

<p>Before we see what we've accomplished, let's ask ChatGPT to add some colors to the "element-type"-classes it added earlier. Now we get:</p>

<p><a href="assets/1991736/86787389.jpg" class="article-body-image-wrapper"><img src="assets/1991736/86787389.jpg" alt="Raw table" loading="lazy" width="800" height="310"></a></p>

<p>Looks great, but not exactly like the periodic table we learned in school. Let's add some grid-magic. </p>

<p>For <em>Helium</em>, we want it to be pushed to the last column. As we know the grid is 18 columns wide, we simply add:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">li</span> <span class="p">{</span>
  <span class="err">&amp;:nth-of-type(2)</span> <span class="err">{</span> <span class="nl">grid-column</span><span class="p">:</span> <span class="m">18</span><span class="p">;</span> <span class="p">}</span>
<span class="err">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Since this is an <em>ordered list</em>, the <code>nth-of-type</code>  value will always correspond to the atomic number of each element. We want to move <em>Boron</em> and <em>Aluminum</em> to column 13:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">li</span> <span class="p">{</span>
  <span class="err">&amp;:nth-of-type(5),</span> <span class="err">&amp;:nth-of-type(13)</span> <span class="err">{</span> <span class="nl">grid-column</span><span class="p">:</span> <span class="m">13</span><span class="p">;</span> <span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

<p>Let's check it out:</p>

<p><a href="assets/1991736/b84db92e.jpg" class="article-body-image-wrapper"><img src="assets/1991736/b84db92e.jpg" alt="Raw table 2" loading="lazy" width="800" height="399"></a></p>

<p>An improvement, for sure, but since <code>grid-column</code> just pushes the grid forward, how can we take elements 58-71 and 90-103 (the lathenides and actinides) completely <strong>out of their grid-flow</strong> and add them to those 2 rows below the main grid?</p>

<p>For that, we can use <code>grid-area</code>, where we define:</p>

<p><code>row-start / col-start / row-end / col-end</code></p>

<p>In our case, that'll be:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">li</span> <span class="p">{</span>
   <span class="c">/* Lanthenides */</span>
  <span class="err">&amp;:nth-of-type(58)</span> <span class="err">{</span> <span class="py">grid-area</span><span class="p">:</span> <span class="m">9</span> <span class="p">/</span> <span class="m">4</span> <span class="p">/</span> <span class="m">9</span><span class="p">/</span> <span class="m">4</span><span class="p">;</span> <span class="p">}</span>
  <span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">59</span><span class="o">)</span> <span class="p">{</span> <span class="py">grid-area</span><span class="p">:</span> <span class="m">9</span> <span class="p">/</span> <span class="m">5</span> <span class="p">/</span> <span class="m">9</span><span class="p">/</span> <span class="m">5</span><span class="p">;</span> <span class="p">}</span>
  <span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">60</span><span class="o">)</span> <span class="p">{</span> <span class="py">grid-area</span><span class="p">:</span> <span class="m">9</span> <span class="p">/</span> <span class="m">6</span> <span class="p">/</span> <span class="m">9</span><span class="p">/</span> <span class="m">6</span><span class="p">;</span> <span class="p">}</span>
  <span class="c">/* etc. */</span>

  <span class="c">/* Actinides */</span>
  <span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">90</span><span class="o">)</span> <span class="p">{</span> <span class="py">grid-area</span><span class="p">:</span> <span class="m">10</span> <span class="p">/</span> <span class="m">4</span> <span class="p">/</span> <span class="m">10</span> <span class="p">/</span> <span class="m">4</span><span class="p">;</span> <span class="p">}</span>
  <span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">91</span><span class="o">)</span> <span class="p">{</span> <span class="py">grid-area</span><span class="p">:</span> <span class="m">10</span> <span class="p">/</span> <span class="m">5</span> <span class="p">/</span> <span class="m">10</span> <span class="p">/</span> <span class="m">5</span><span class="p">;</span> <span class="p">}</span>
  <span class="o">&amp;</span><span class="nd">:nth-of-type</span><span class="o">(</span><span class="err">92</span><span class="o">)</span> <span class="p">{</span> <span class="py">grid-area</span><span class="p">:</span> <span class="m">10</span> <span class="p">/</span> <span class="m">6</span> <span class="p">/</span> <span class="m">10</span> <span class="p">/</span> <span class="m">6</span><span class="p">;</span> <span class="p">}</span>
  <span class="o">/</span> <span class="nt">etc</span><span class="o">.</span> <span class="o">*/</span>
<span class="err">}</span>
</code></pre>

<p>And <em>now</em> we get (for clarity, I've enabled <em>Dev Tools'</em> grid-visualizer):</p>

<p><a href="assets/1991736/f48b0b57.jpg" class="article-body-image-wrapper"><img src="assets/1991736/f48b0b57.jpg" alt="Periodic table with grid-preview" loading="lazy" width="800" height="447"></a></p>

<p>Notice how the grid-elements <em>after</em> the element we've moved out of the flow, continue in the main flow!</p>


<hr>

<h2>
  <a name="filtering" href="#filtering">
  </a>
  Filtering
</h2>

<p>Now, let's use these "element type"-classes, we had ChatGPT generate earlier, to <strong>filter</strong> the periodic table.</p>

<p>First, let's add some basic HTML:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;fieldset&gt;</span>
  <span class="nt">&lt;legend&gt;</span>Filter<span class="nt">&lt;/legend&gt;</span>
  <span class="nt">&lt;label&gt;</span>
    <span class="nt">&lt;input</span> <span class="na">type=</span><span class="s">"radio"</span> <span class="na">id=</span><span class="s">"alk"</span> <span class="na">name=</span><span class="s">"filter"</span><span class="nt">&gt;</span>
    Alkali Metals
  <span class="nt">&lt;/label&gt;</span>
<span class="nt">&lt;/fieldset&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Then, we ask chatGPT to fill out the rest, and add an "All"-option with no <code>id</code>:</p>

<p><a href="assets/1991736/1c5a0782.jpg" class="article-body-image-wrapper"><img src="assets/1991736/1c5a0782.jpg" alt="Filter" loading="lazy" width="800" height="265"></a></p>

<p>We need a bunch of JavaScript to filter, right? No, we can do this in plain CSS:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">body</span><span class="nd">:has</span><span class="o">(</span><span class="nf">#alk</span><span class="nd">:checked</span><span class="o">)</span> <span class="nt">li</span><span class="nd">:not</span><span class="o">(</span><span class="nc">.alk</span><span class="o">)</span> <span class="p">{</span> 
  <span class="nl">opacity</span><span class="p">:</span> <span class="m">0.2</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The logic works like this: If the <code>body</code> contains a checkbox with the <code>id="alk"</code> and it's checked, the styles will be applied to all <code>&lt;li&gt;</code> elements that <strong>don’t</strong> have the <code>.alk</code> class.</p>

<p>Repeat for all the types and classes.</p>

<p>Let's click on "metalloids":</p>

<p><a href="assets/1991736/c02c3918.jpg" class="article-body-image-wrapper"><img src="assets/1991736/c02c3918.jpg" alt="Metalloids" loading="lazy" width="800" height="444"></a></p>

<p>How cool is that?</p>


<hr>

<p>That concludes this tutorial … but wait … what does that Heisenberg filter do? It wasn't in the list of filters from ChatGPT?</p>

<p>Let's click it:</p>

<p><a href="assets/1991736/82585467.jpg" class="article-body-image-wrapper"><img src="assets/1991736/82585467.jpg" alt="Heisenberg" loading="lazy" width="800" height="445"></a></p>
