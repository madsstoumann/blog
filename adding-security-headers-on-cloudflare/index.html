			<h1>Adding Security Headers on Cloudflare</h1>
			<p>Four years ago, I wrote a posts about <a href="https://dev.to/madsstoumann/frontend-security-security-headers-517p">Security Headers</a>. In that post, I mentioned how to set up Security Headers on Cloudflare using a Worker.</p>

<p>Since then, a lot has happened. Nowadays, you can add <code>Transform Rules</code>, which will save you Worker Requests. So — to keep this short — this is how I handle Security Headers in Cloudflare now:</p>

<ol>
<li>Got to <code>Rules</code> &gt; <code>Overview</code>
</li>
<li>Click on "Create Rule"</li>
<li>Select <code>Response Header Transform Rule</code>
</li>
<li>Fill out <code>Rule name</code> — I simply call it "Security Headers"</li>
<li>Select <code>All incoming requests</code>
</li>
<li>Then, from <code>Select item</code>, chose <code>Set static</code>
</li>
</ol>

<p>Next, set <code>Header name</code> and <code>value</code> for the headers you want to add.</p>

<p>In my case, it's:</p>

<div class="table-wrapper-paragraph"><table>
<thead>
<tr>
<th>Header Name</th>
<th>Value</th>
</tr>
</thead>
<tbody>
<tr>
<td>Content-Security-Policy</td>
<td>upgrade-insecure-requests</td>
</tr>
<tr>
<td>Pemissions-Policy</td>
<td>geolocation=(), microphone=(self)</td>
</tr>
<tr>
<td>Referrer-Policy</td>
<td>strict-origin-when-cross-origin</td>
</tr>
<tr>
<td>X-Frame-Options</td>
<td>DENY</td>
</tr>
</tbody>
</table></div>

<p><strong>A Note on Content Security Policy (CSP)</strong></p>

<p>You might notice my global CSP is quite minimal - it only includes <code>upgrade-insecure-requests</code>. This is intentional. Since my site, browser.style, is a code-sharing platform where different pages have different security requirements, I handle Content Security Policy on a <strong>per-page basis</strong> using the <code>&lt;meta&gt;</code> tag in the HTML <code>&lt;head&gt;</code>.</p>


<hr>

<h2>
  <a name="remove-headers" href="#remove-headers">
  </a>
  Remove Headers
</h2>

<p>Now, there's also a lot of headers you want to <em>remove</em>. These headers leak information about your infrastructure and internal systems, which isn't necessarily a security vulnerability, but follows the principle of "don't advertise what you don't need to." For these, I've created <em>another</em> Transform Rule. Instead of <code>Set static</code>, select <code>Remove</code>, and repeat for each of these:</p>

<p><strong>Headers to Remove:</strong></p>

<ul>
<li><p><strong><code>via</code></strong> - Reveals intermediary proxy servers and CDN infrastructure in your request chain (e.g., "1.1 varnish"). This tells attackers which proxy software you're using and potential version information.</p></li>
<li><p><strong><code>x-cache-hits</code></strong> - Shows cache statistics, revealing how many times content was served from cache. This is internal performance data that visitors don't need to see.</p></li>
<li><p><strong><code>x-fastly-request-id</code></strong> - Exposes that you're using Fastly CDN and provides an internal request tracking ID. While not directly exploitable, it reveals your infrastructure stack.</p></li>
<li><p><strong><code>x-github-request-id</code></strong> - If you're using GitHub Pages (like I am), this header reveals both that fact and GitHub's internal request tracking ID.</p></li>
<li><p><strong><code>x-origin-cache</code></strong> - Reveals your origin server's caching status (HIT/MISS), which is internal infrastructure information.</p></li>
<li><p><strong><code>x-proxy-cache</code></strong> - Similar to above, shows proxy layer caching behavior (HIT/MISS/BYPASS), revealing details about your caching architecture.</p></li>
<li><p><strong><code>x-timer</code></strong> - Contains internal timing and performance metrics from your CDN, formatted as <code>S{timestamp},{metrics}</code>. This is debugging information that shouldn't be public.</p></li>
</ul>

<p><strong>Why remove these?</strong> While these headers aren't direct security vulnerabilities, they provide reconnaissance information that attackers can use to fingerprint your infrastructure. Security through obscurity isn't a primary defense, but there's no reason to advertise your complete technology stack to everyone who makes a request.</p>

<p>Give the rule a name, I simply call it "Remove Headers".</p>

<p><strong>Note:</strong> Cloudflare may prevent you from removing certain headers like <code>x-cache</code> and <code>x-served-by</code> as they're protected for debugging purposes. That's normal and expected.</p>


<hr>

<p>Finally, check your headers via <code>curl -I https://your.domain</code> or go to <a href="https://securityheaders.com/" target="_blank" rel="noopener noreferrer">securityheaders.com</a> — Go for <strong>A+</strong> ;-)</p>
