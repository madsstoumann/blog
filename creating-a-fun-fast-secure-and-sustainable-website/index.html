			<h1>Creating a fun, fast, secure and sustainable website</h1>
			<p>In the last couple of months, I've been writing (some would say preaching!) about security, performance, accessibilty and other aspects of frontend development. </p>

<p>Then I discovered, that my <em>own</em> website hadn't been updated in almost 10 years, and didn't really live up to my current standards! </p>

<p>In this post, I'll show you how I re-wrote my site, and achieved the perfect Lighthouse score: </p>

<p><a href="assets/612806/8c172e96.jpg" class="article-body-image-wrapper"><img src="assets/612806/8c172e96.jpg" alt="lighthouse" loading="lazy" width="800" height="223"></a></p>


<hr>

<p>Before I started out, I set some goals for the site:</p>

<h2>
  <a name="playful" href="#playful">
  </a>
  Playful
</h2>

<p>I wanted the site to be engaging and playful. The content is very simple, so I wanted to present it in an alternate way. I ended up with a circular navigation:</p>

<p><a href="assets/612806/5d759d3b.jpg" class="article-body-image-wrapper"><img src="assets/612806/5d759d3b.jpg" alt="default" loading="lazy" width="800" height="626"></a></p>

<p>On mobile, I show a part of the circle:</p>

<p><a href="assets/612806/86c456e7.jpg" class="article-body-image-wrapper"><img src="assets/612806/86c456e7.jpg" alt="mobile" loading="lazy" width="800" height="1629"></a></p>

<p>The <em>playfulness</em> is achieved with two tools.<br>
The first is a color tool (toggle it by clicking on the colorful square-icon top right) with <em>hue-</em>, <em>saturation-</em> and <em>lightness</em>-sliders - and an option to download the CSS for the theme, you create:</p>

<p><a href="assets/612806/c76f1b50.jpg" class="article-body-image-wrapper"><img src="assets/612806/c76f1b50.jpg" alt="colortool" loading="lazy" width="800" height="626"></a></p>

<p>The other tool is a <em>polygon</em>-tool (toggle it by clicking the hexagon-icon top left).<br>
This tool has two sliders: one for adding sides to the polygons, and one for midpoints:</p>

<p><a href="assets/612806/9eb28496.jpg" class="article-body-image-wrapper"><img src="assets/612806/9eb28496.jpg" alt="polygon" loading="lazy" width="800" height="626"></a></p>

<p>Combining the two tools, you can create crazy results like this:</p>

<p><a href="assets/612806/b6235b55.jpg" class="article-body-image-wrapper"><img src="assets/612806/b6235b55.jpg" alt="polygon2" loading="lazy" width="800" height="626"></a></p>

<p>In the bottom left corner, there's a <em>color-palette</em>-icon, that'll enable a <em>high-contrast black-and-white mode:</em></p>

<p><a href="assets/612806/600ae80a.jpg" class="article-body-image-wrapper"><img src="assets/612806/600ae80a.jpg" alt="bw" loading="lazy" width="800" height="626"></a></p>

<p>And finally, in the bottom right corner, there's a button where you can toggle on/off transitions and animations. Why? <a href="https://css-tricks.com/how-to-play-and-pause-css-animations-with-css-custom-properties/" target="_blank" rel="noopener noreferrer">I've written about it here.</a></p>

<hr>
<h2>
  <a name="valid" href="#valid">
  </a>
  Valid
</h2>

<p>Many sites these days don't have valid markup. This is bad. Most browsers will try to "figure out" what's going on, and "auto-correct" markup mistakes. This requires extra "calculations" for the browser, and it might prevent a <em>crawler</em> from indexing the page correctly. I use <a href="https://www.validity.org.uk/" target="_blank" rel="noopener noreferrer">Validity</a> for testing the validity of my markup.</p>

<hr>
<h2>
  <a name="accessible" href="#accessible">
  </a>
  Accessible
</h2>

<p>I haven't tested the site with a <em>real</em> screen-reader, only with the one you get with Windows. Additionally, I've taken multiple actions in order to make it more accessible:</p>
<h3>
  <a name="document-outline" href="#document-outline">
  </a>
  Document Outline
</h3>

<p>I use <a href="https://chrome.google.com/webstore/detail/html5-outliner/afoibpobokebhgfnknfndkgemglggomo" target="_blank" rel="noopener noreferrer">HTML5 Outliner</a> to test the outline of a page:</p>

<p><a href="assets/612806/82085ff0.jpg" class="article-body-image-wrapper"><img src="assets/612806/82085ff0.jpg" alt="Document outline" loading="lazy" width="564" height="300"></a></p>
<h3>
  <a name="keyboardfriendly" href="#keyboardfriendly">
  </a>
  Keyboard-friendly
</h3>

<p>You can navigate the site without a pointer-device. I use <code>focus-visible</code> and custom styles for outlines (even on the circular navigation), when you're using a keyboard. You "open" an article with <code>Enter</code>, close it with <code>Escape</code> - and I've included <em>focus-trapping</em>, so you can cycle the links within an article.</p>

<p>The tools use <code>&lt;input type="range"&gt;</code>, which can be updated with the arrow keys.</p>
<h3>
  <a name="disable-animations" href="#disable-animations">
  </a>
  Disable animations
</h3>

<p>As mentioned earlier, you can disable animations and transitions.</p>
<h3>
  <a name="visual-deficiencies" href="#visual-deficiencies">
  </a>
  Visual deficiencies
</h3>

<p>In the <em>Rendering</em>-tab of <em>Chrome Dev Tools</em>, you can emulate visual deficiencies.</p>

<p>Test all of them, one by one, to see if any of them is unreadable.</p>

<p><em>Here's deuteranopia:</em><br>
<a href="assets/612806/847ae1ec.jpg" class="article-body-image-wrapper"><img src="assets/612806/847ae1ec.jpg" alt="deuteranopia" loading="lazy" width="800" height="389"></a></p>

<p>The reason why I've included the <em>hue</em>-slider as part of the main design, is for people with visual deficiencies. Hopefully, no matter which visual deficiency a user has, s/he can choose a color-palette of their own choice.</p>

<p>The main navigation is readable with <em>blurred vision:</em></p>

<p><a href="assets/612806/632232d9.jpg" class="article-body-image-wrapper"><img src="assets/612806/632232d9.jpg" alt="blurred" loading="lazy" width="800" height="447"></a></p>

<p>Zooming-in, the text should be readable as well:</p>

<p><a href="assets/612806/c0a5c9dc.jpg" class="article-body-image-wrapper"><img src="assets/612806/c0a5c9dc.jpg" alt="blurred_text" loading="lazy" width="800" height="425"></a></p>

<hr>
<h2>
  <a name="fast" href="#fast">
  </a>
  Fast
</h2>

<p>The combined size of the minified HTML, CSS and JavaScript of the entire website is <strong>approx. 11kb</strong>. </p>

<p>I've not used a build-tool, it's all hardcoded.</p>

<p>Most logic is in <em>CSS Custom Properties</em>. </p>

<p>All the colors in the color tool, for instance, are auto-generated colors using <code>calc()</code> in CSS, based on values from the <em>hue-</em>, <em>saturation-</em> and <em>lightness</em>-sliders.</p>

<p>I use the <em>Montserrat</em>-typeface, but host the font-files on my own server, avoiding a round-trip to <em>Google Fonts</em>. The font is <em>preloaded</em>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;link</span> <span class="na">rel=</span><span class="s">"preload"</span> <span class="na">href=</span><span class="s">"assets/fonts/montserrat-v15-latin-regular.woff2"</span> <span class="na">crossorigin=</span><span class="s">"anonymous"</span> <span class="na">as=</span><span class="s">"font"</span> <span class="na">type=</span><span class="s">"font/woff2"</span><span class="nt">&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">

</svg>

</div>

<hr>

<h2>
  <a name="secure" href="#secure">
  </a>
  Secure
</h2>

<p>I use a <a href="https://dev.to/madsstoumann/frontend-security-content-security-policy-17dl">Content-Security-Policy</a>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;meta</span> <span class="na">http-equiv=</span><span class="s">"Content-Security-Policy"</span> <span class="na">content=</span><span class="s">"
  default-src;
  script-src 'self';
  style-src 'self';
  img-src 'self' data:;
  font-src 'self';
  connect-src 'self';
  media-src 'self';
  object-src 'none';
  frame-src;
  form-action;
  base-uri;
  manifest-src 'self';
"</span><span class="nt">&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>

<p>... and I've set up <a href="https://dev.to/madsstoumann/frontend-security-security-headers-517p">Security Headers</a>:</p>

<p><a href="assets/612806/c8de5564.jpg" class="article-body-image-wrapper"><img src="assets/612806/c8de5564.jpg" alt="securityheaders" loading="lazy" width="800" height="217"></a></p>

<p><em>Mozilla Observatory:</em><br>
<a href="assets/612806/4b840351.jpg" class="article-body-image-wrapper"><img src="assets/612806/4b840351.jpg" alt="StoumannDKSecurity" loading="lazy" width="800" height="244"></a></p>


<hr>

<h2>
  <a name="sustainable" href="#sustainable">
  </a>
  Sustainable
</h2>

<p>Because I use a green CDN (Cloudflare) - and because of the low page-weight, it's very easy to achieve a good sustainability-score:</p>

<p><a href="assets/612806/dde95cda.jpg" class="article-body-image-wrapper"><img src="assets/612806/dde95cda.jpg" alt="Energy" loading="lazy" width="800" height="717"></a></p>

<p>In web-development, sustainability equals performance, so <em>PageSpeed</em> is happy as well: </p>

<p><a href="assets/612806/3e746ba6.jpg" class="article-body-image-wrapper"><img src="assets/612806/3e746ba6.jpg" alt="PageSpeed" loading="lazy" width="800" height="439"></a> </p>

<p>I've used my favourite nuances of blue on the site, although <a href="https://www.zdnet.com/article/google-heres-why-dark-mode-massively-extends-your-oled-phones-battery-life/" target="_blank" rel="noopener noreferrer">blue pixels use more electricity</a> than <a href="https://commons.wikimedia.org/wiki/File:Colors_in_eV.svg" target="_blank" rel="noopener noreferrer">red or green</a> pixels. </p>


<hr>

<h2>
  <a name="pwa-and-offline" href="#pwa-and-offline">
  </a>
  PWA and offline
</h2>

<p>I've added a <em>site.manifest</em> and a <em>ServiceWorker</em> with caching, so the site works offline. </p>

<p>Google are <a href="https://developer.chrome.com/blog/improved-pwa-offline-detection/" target="_blank" rel="noopener noreferrer">improving Progressive Web App offline support detection</a>, so I'll have to make some updates before August 2021!</p>


<hr>

<h2>
  <a name="final-thoughts" href="#final-thoughts">
  </a>
  Final thoughts
</h2>

<p>Hope you liked this walkthrough of my new site. Remember, nothing lasts forever in the world of web! The perfect scores will most likely change soon, as the web and what we expect of it, change as well.</p>

<p>Go check it out: <a href="https://stoumann.dk" target="_blank" rel="noopener noreferrer">stoumann.dk</a></p>

<p>Thanks for reading!</p>
