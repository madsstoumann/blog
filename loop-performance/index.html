			<h1>Loop performance</h1>
			<p>What is the fastest way to iterate over an array in JavaScript?<br />
In the book &#8220;High Performance JavaScript&#8221; from 2010, Nicholas Zakas has a section on <em>Loop Performance</em>, where the four loop-types in JavaScript are compared.<br />
According to Zakas, just two factors contribute to loop performance:</p>
<ul>
<li>Work done per iteration</li>
<li>Number of iterations</li>
</ul>
<p>He then shows a typical array-processing loop:</p>
<pre class="brush: jscript; title: ; notranslate" title="">
for (var i=0; i &lt; items.length; i++){
  process(items[i]);
}
</pre>
<p>The JavaScript engine need to perform these 6 tasks for every loop:</p>
<ol>
<li>One property lookup (items.length)</li>
<li>One comparison (i &lt; items.length)</li>
<li>One comparison to see whether the control condition evaluates to &#8220;true&#8221; (i &lt; items.length)</li>
<li>One increment operation (i++)</li>
<li>One array lookup (items[i])</li>
<li>One function call (process(items[i])</li>
</ol>
<p>To avoid looking up the length for each iteration, it can be stored as a variable:</p>
<pre class="brush: jscript; title: ; notranslate" title="">
for (var i=0, len=items.length; i &lt; len; i++)
etc.
</pre>
<p>And to further avoid unnecessary work for the JavaScript engine, we can hoist the variables to the beginning of the function, use a negative iterator for <em>both</em> iteration and condition (0 is false, so the loop ends when i&#8211; equals 0):</p>
<pre class="brush: jscript; title: ; notranslate" title="">
var i, len = items.length;
for (i = len; i--;) 
etc
</pre>
<p>Or even:</p>
<pre class="brush: jscript; title: ; notranslate" title="">
var i = items.length;
for (; i--;) 
etc
</pre>
<p>For the <em>while-loop</em> it&#8217;s even more simple and readable:</p>
<pre class="brush: jscript; title: ; notranslate" title="">
var i = items.length;
while(i--) { ...
etc.
</pre>
<p>The &#8220;todo-list&#8221; for the JavaScript-engine has now been reduced from 6 items to 3:</p>
<ol>
<li>One comparison / decrement operation (i&#8211;). This is <em>both</em> iteration and condition (0 is false)</li>
<li>One array lookup</li>
<li>One function call</li>
</ol>
<p>While I personally really like this syntax and while this syntax logically should be <em>way</em> faster than a &#8220;regular&#8221; for-loop, recent performance studies indicate the opposite.</p>
<p><strong>Why is that?</strong><br />
Because browsers have optimized their engines for the most common loop-type, even though it&#8217;s &#8220;more work&#8221;. That&#8217;s my best guess.</p>
<p>I&#8217;ve created a test-case on jsPerf: <a href="http://jsperf.com/for-or-while/23" target="_blank">For or while</a>, and the results were completely unexpected:</p>
<p><a href="https://madsstoumann.wordpress.com/wp-content/uploads/2016/01/looptest.png" rel="attachment wp-att-512"><img loading="lazy" data-attachment-id="512" data-permalink="https://madsstoumann.wordpress.com/2016/01/03/loop-performance/looptest/" data-orig-file="https://madsstoumann.wordpress.com/wp-content/uploads/2016/01/looptest.png" data-orig-size="958,777" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="LoopTest" data-image-description="" data-image-caption="" data-medium-file="https://madsstoumann.wordpress.com/wp-content/uploads/2016/01/looptest.png?w=300" data-large-file="https://madsstoumann.wordpress.com/wp-content/uploads/2016/01/looptest.png?w=958" class="alignnone size-full wp-image-512" src="assets/wp-508/a909765b.png" alt="LoopTest" width="615" height="499" srcset="https://madsstoumann.wordpress.com/wp-content/uploads/2016/01/looptest.png?w=615&amp;h=499 615w, https://madsstoumann.wordpress.com/wp-content/uploads/2016/01/looptest.png?w=150&amp;h=122 150w, https://madsstoumann.wordpress.com/wp-content/uploads/2016/01/looptest.png?w=300&amp;h=243 300w, https://madsstoumann.wordpress.com/wp-content/uploads/2016/01/looptest.png?w=768&amp;h=623 768w, https://madsstoumann.wordpress.com/wp-content/uploads/2016/01/looptest.png 958w" sizes="(max-width: 615px) 100vw, 615px" /></a></p>
<p>In Chrome, Edge, Firefox <em>and</em> mobile Safari, the classic for-loop with unhoisted variables is the fastest.</p>
<p>The ES5 Array-methods like &#8220;forEach&#8221;, &#8220;reduce&#8221;, &#8220;map&#8221; etc. are in general <em>much slower</em> than a classic for-loop. </p>
<p>That&#8217;s been mentioned before, I read it on <a href="http://bonsaiden.github.io/JavaScript-Garden/#array.general" target="_blank">JavaScript Garden</a> some time ago:</p>
<blockquote><p>For the best performance, it is recommended to always use the plain for loop and cache the length property.</p></blockquote>
<p>While the &#8220;and cache the length property&#8221;-part isn&#8217;t entirely true anymore, the main statement is.</p>
<p>On the other hand, the ES5 Array-methods provide better readability &mdash; and if you&#8217;re into <em>functional programming</em>, these methods are for you.</p>
<p>In his <a href="http://benhollis.net/blog/2009/12/13/investigating-javascript-array-iteration-performance/" target="_blank">blog-post</a> on the same topic, Ben Hollis concludes &mdash; and so will I:</p>
<blockquote><p>It’s worth noting that, as usual, this sort of performance information only matters if you’re actually seeing performance problems.</p></blockquote>
<p>Happy coding!</p>
