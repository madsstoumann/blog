		<article>
			<h1>Implementing Icons</h1>
			<p>Icons have played an important role since the birth of the <em>Graphical User Interface</em> (GUI). They can either be <em>informative</em> — like icons next to form fields, providing additional visual clues — or <em>actionable</em>, like the infamous “hamburger”-icon, triggering a mobile navigation.</p>


<hr>

<h2>
  <a name="user-experience-and-accessibility" href="#user-experience-and-accessibility">
  </a>
  User experience and accessibility
</h2>

<p>The <a href="https://www.nngroup.com/articles/icon-usability" target="_blank" rel="noopener noreferrer">Nielsen Norman Group</a> summarizes the use of icons like this:<br>
<em>A user’s understanding of an icon is based on previous experience. Due to the absence of a standard usage for most icons, text labels are necessary to communicate the meaning and reduce ambiguity.</em></p>

<p>Designers will most likely disagree with this, since they often use icons to <em><em>save</em></em> space, thus ditching the text labels, and relying on the user recognizing the [meaning of the] icon.<br>
So, designers — <em>if possible</em> — please use icons in conjunction with a descriptive text that's crisp and clear.</p>

<p>An icon should — if it's <em>actionable</em> — always be wrapped in either a <code>&lt;button&gt;</code> , <code>&lt;label&gt;</code> , <code>&lt;details&gt;</code> or an <code>&lt;a&gt;</code>nchor. The wrapping element should contain a textual explanation of what is does, either as visual text, or using the <code>aria-label</code>-attribute. The icon itself should have the <code>aria-hidden</code>-attribute set to <code>true</code>.</p>

<p>As you typically add <code>eventListeners</code> to the wrapping-element, set <code>pointer-events</code> to <code>none</code> for the icon in CSS.</p>

<p>If an icon is <em>informative</em>, add either an <code>aria-label</code>-attribute, or use the <code>&lt;title&gt;</code>-tag in an <code>&lt;svg&gt;</code>.<br><br>
For longer descriptions, <code>&lt;svg&gt;</code> also has a <code>&lt;desc&gt;</code>-tag</p>

<hr>
<h2>
  <a name="implementations-svg" href="#implementations-svg">
  </a>
  Implementations: SVG
</h2>

<p>There are <em>many</em> ways of implementing icons.<br><br>
Nowadays, <strong>avoid bitmap formats like PNG or JPG</strong>, since these are not crisp and <em>scalable</em>.<br><br>
Instead, use <em>Scalable Vector Graphics</em>: <code>&lt;svg&gt;</code>.</p>

<p>An <code>&lt;svg&gt;</code> can either be:<br>
<em>- A physical file, you can reference as:</em></p>

<ul>
<li>The <code>src</code> of an <code>&lt;img&gt;</code>-tag in HTML</li>
<li>The <code>xlink:href</code>-attribute of a <code>&lt;use&gt;</code>-tag in HTML</li>
<li>The <code>url</code> of a <code>background-image</code> in CSS</li>
<li>The <code>url</code> of a <code>mask-image</code> in CSS</li>
<li>The <code>data</code>-attribute of an <code>&lt;object&gt;</code>-tag (don't)</li>
<li>The <code>src</code>-attribute of an <code>&lt;iframe&gt;</code>-tag  (don't)</li>
</ul>

<p><em>- Inline markup, that you can use:</em></p>

<ul>
<li> Directly in HTML</li>
<li> As an encoded string in CSS, which can then be used as:

<ul>
<li><code>background-image</code></li>
<li>
<code>content</code> in a pseudo-element</li>
<li><code>mask-image</code></li>
</ul>
</li>
</ul>

<p><strong>Note:</strong> Your <code>&lt;svg&gt;</code>-files should be as <em>neutral</em> as possible, so they can be used in multiple scenarios.<br><br>
Remove attributes such as <code>stroke</code> and <code>fill</code> — these will be applied through CSS.<br>
Let's look at the various options.</p>

<hr>
<h2>
  <a name="the-least-flexible-in-an-raw-ltimggt-endraw-tag" href="#the-least-flexible-in-an-raw-ltimggt-endraw-tag">
  </a>
  The least flexible: In an <code>&lt;img&gt;</code> tag
</h2>

<p>You should already know this:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;img</span> <span class="na">src=</span><span class="s">"../assets/svg/check.svg"</span> <span class="na">alt=</span><span class="s">"Check"</span> <span class="na">class=</span><span class="s">"c-ico"</span> <span class="nt">/&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>This works fine — you can control the size from CSS, but that's about it.<br><br>
<code>fill</code> and <code>stroke</code> will have to be hardcoded in the svg-file — not very flexible.</p>

<hr>
<h2>
  <a name="the-most-flexible-inline-markup" href="#the-most-flexible-inline-markup">
  </a>
  The most flexible: inline markup
</h2>

<p>If you want <em>full control</em>, the best way to add an <code>&lt;svg&gt;</code>-icon, is to inline it in your HTML-markup, like this:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight xml"><code><span class="nt">&lt;svg</span> <span class="na">viewBox=</span><span class="s">"0 0 16 16"</span> <span class="na">class=</span><span class="s">"c-ico"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;path</span> <span class="na">d=</span><span class="s">"M14 2.5l-8.5 8.5-3.5-3.5-1.5 1.5 5 5 10-10z"</span><span class="nt">&gt;&lt;/path&gt;</span>
<span class="nt">&lt;/svg&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>You can style it in CSS, like in this example:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.c-ico</span> <span class="p">{</span>
  <span class="py">fill</span><span class="p">:</span> <span class="no">tomato</span><span class="p">;</span>
  <span class="nl">height</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>
  <span class="nl">width</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>— But you can also add <em>CSS classes</em> to individual SVG elements:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight xml"><code><span class="nt">&lt;path</span> <span class="na">d=</span><span class="s">"..."</span> <span class="na">class=</span><span class="s">"c-ico--custom"</span> <span class="nt">/&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>— And you can use all the usual CSS-tricks:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.c-ico</span><span class="nd">:hover</span> <span class="p">{</span>
  <span class="py">fill</span><span class="p">:</span> <span class="no">darkred</span><span class="p">;</span>
  <span class="nl">transform</span><span class="p">:</span> <span class="n">scale</span><span class="p">(</span><span class="m">2</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>




<hr>

<h2>
  <a name="still-flexible-spritemap-using-raw-ltusegt-endraw-and-raw-ltsymbolgt-endraw-" href="#still-flexible-spritemap-using-raw-ltusegt-endraw-and-raw-ltsymbolgt-endraw-">
  </a>
  Still flexible: Spritemap using <code>&lt;use&gt;</code> and <code>&lt;symbol&gt;</code>
</h2>

<p>If you're going to use the icon in many places though, a more practical solution is a <em>spritemap</em>, using <code>&lt;use&gt;</code>- and <code>&lt;symbol&gt;</code>-tags.<br>
You don't have full control, as when using <em>inline</em>, but it's good enough for most icon-use-cases.<br>
You basically move all your <code>&lt;svg&gt;</code>-icons to one central <em>spritemap.svg</em>-file, and link to them, using <code>&lt;use&gt;</code>.</p>

<p>Change the <code>&lt;svg&gt;</code>-tag to <code>&lt;symbol&gt;</code>, add an <code>id</code>-attribute with a unique value, and place it in the <code>&lt;defs&gt;</code>-section as in the example below:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight xml"><code><span class="nt">&lt;svg</span> <span class="na">aria-hidden=</span><span class="s">"true"</span>
  <span class="na">style=</span><span class="s">"position: absolute; width: 0; height: 0; overflow: hidden"</span>
  <span class="na">xmlns=</span><span class="s">"http://www.w3.org/2000/svg"</span>
  <span class="na">xmlns:xlink=</span><span class="s">"http://www.w3.org/1999/xlink"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;defs&gt;</span>
    <span class="nt">&lt;symbol</span> <span class="na">id=</span><span class="s">"icon-check"</span> <span class="na">viewBox=</span><span class="s">"0 0 16 16"</span><span class="nt">&gt;</span>
      <span class="nt">&lt;path</span> <span class="na">d=</span><span class="s">"M14 2.5l-8.5 8.5-3.5-3.5-1.5 1.5 5 5 10-10z"</span><span class="nt">&gt;&lt;/path&gt;</span>
    <span class="nt">&lt;/symbol&gt;</span>
    <span class="nt">&lt;symbol</span> <span class="na">id=</span><span class="s">"icon-search"</span> <span class="na">viewBox=</span><span class="s">"0 0 16 16"</span><span class="nt">&gt;</span>
      ... etc.
    <span class="nt">&lt;/symbol&gt;</span>
  <span class="nt">&lt;/defs&gt;</span>
<span class="nt">&lt;/svg&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Then, to use it:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight xml"><code><span class="nt">&lt;svg</span> <span class="na">class=</span><span class="s">"c-ico"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;use</span> <span class="na">xlink:href=</span><span class="s">"../assets/svg/spritemap.svg#icon-check"</span> <span class="nt">/&gt;</span>
<span class="nt">&lt;/svg&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Where <code>xlink:href</code> is the path and name of the SVG-file, and the <code>#fragment</code> identifier is the <code>id</code> of the <code>&lt;symbol&gt;</code> you want to use.</p>


<hr>

<h2>
  <a name="as-an-encoded-string-in-css" href="#as-an-encoded-string-in-css">
  </a>
  As an encoded string in CSS
</h2>

<p>It is also possible to store an <code>&lt;svg&gt;</code> directly as an encoded string in CSS.<br><br>
You might have seen examples of an <code>&lt;svg&gt;</code>, encoded with <code>base64</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">background-image</span><span class="o">:</span> <span class="nt">url</span><span class="o">(</span><span class="err">'</span><span class="nt">data</span><span class="nd">:image</span><span class="o">/</span><span class="nt">svg</span><span class="o">+</span><span class="nt">xml</span><span class="o">;</span><span class="nt">base64</span><span class="o">,</span><span class="nt">PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZG</span><span class="o">...</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><a href="https://stackoverflow.com/questions/201479/what-is-base-64-encoding-used-for" target="_blank" rel="noopener noreferrer">It comes at a price</a>, though:<br>
<em>It takes 4 characters per 3 bytes of data, plus potentially a bit of padding at the end.</em></p>

<p>A better and more readable way, is to <code>utf-8</code>-encode it, allowing you to basically “dump” a regular <code>&lt;svg&gt;</code> with line-breaks and spaces removed.  </p>

<p>Since <code>utf-8</code> is the default encoding, it's not even necessary to specify it:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">background-image</span><span class="o">:</span> <span class="nt">url</span><span class="o">(</span><span class="s2">'data:image/svg+xml,&lt;svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"&gt;&lt;path d="M14 2.5l-8.5 8.5-3.5-3.5-1.5 1.5 5 5 10-10z"&gt;&lt;/path&gt;&lt;/svg&gt;'</span><span class="o">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>If you want it more readable, escape each line with a backslash: <code>\</code><br>
The disadvantage of storing the encoded <code>&lt;svg&gt;</code> directly as a <code>background-image</code>, <code>mask-image</code> or <code>content</code>-property is duplication. You need to “dump” the <code>&lt;svg&gt;</code> for each use. A much smarter way is to store all your most used icons as <em>CSS Custom Properties:</em><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">--ico-check</span><span class="o">:</span> <span class="nt">url</span><span class="o">(</span><span class="s2">'data:image/svg+xml,&lt;svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"&gt;&lt;path d="M14 2.5l-8.5 8.5-3.5-3.5-1.5 1.5 5 5 10-10z"&gt;&lt;/path&gt;&lt;/svg&gt;'</span><span class="o">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>This way, you can re-use the <code>&lt;svg&gt;</code>-data in as many places as you want:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.c-ico--check</span> <span class="p">{</span>
  <span class="nl">background-image</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--ico-check</span><span class="p">);</span>
<span class="p">}</span>
<span class="nc">.c-ico--checkmask</span> <span class="p">{</span>
  <span class="py">mask-image</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--ico-check</span><span class="p">);</span>
<span class="p">}</span>
<span class="nc">.selector</span><span class="nd">::before</span> <span class="p">{</span>
  <span class="nl">content</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--ico-check</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>You can also <em>dynamically</em> change an icon by using this method with <code>background-image</code>.  </p>

<p>Consider this example:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.c-ico</span> <span class="p">{</span>
  <span class="c">/* excerpt */</span>
  <span class="py">--ico</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--ico-empty</span><span class="p">);</span>
  <span class="nl">background-image</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--ico</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>It creates a <code>background-image</code>, which by default is set to an empty <code>&lt;svg&gt;</code>. </p>

<p>Change the icon with a modifier-class:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.c-ico--check</span> <span class="p">{</span>
  <span class="py">--ico</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--ico-check</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>No new CSS required — just an update of a variable.</p>


<hr>

<h2>
  <a name="coloring-an-raw-ltsvggt-endraw-icon" href="#coloring-an-raw-ltsvggt-endraw-icon">
  </a>
  Coloring an <code>&lt;svg&gt;</code>-icon
</h2>

<p>All of the <code>&lt;svg&gt;</code> <a href="https://css-tricks.com/svg-properties-and-css/" target="_blank" rel="noopener noreferrer">presentation attributes</a> can be used as CSS properties, so if you're in-lining your <code>&lt;svg&gt;</code>, you have all presentation options either as <code>attributes</code> in the markup, or as <code>properties</code> in CSS.<br><br>
Just remember, that <code>background-color</code> is called <code>fill</code> in <code>&lt;svg&gt;</code>!<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.custom-svg</span> <span class="p">{</span>
  <span class="py">fill</span><span class="p">:</span> <span class="no">red</span><span class="p">;</span>
  <span class="py">stroke</span><span class="p">:</span> <span class="no">green</span><span class="p">;</span>
  <span class="py">stroke-width</span><span class="p">:</span> <span class="m">3px</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><strong>Note:</strong> In <code>&lt;svg&gt;</code>, the value of the <code>stroke-width</code>-attribute is <em>relative</em> to the <code>viewBox</code>.<br><br>
In CSS, use a unit, like <code>px</code> or <code>em</code> etc.</p>

<hr>
<h2>
  <a name="duotone" href="#duotone">
  </a>
  Duo-tone
</h2>

<p>You can style attributes like <code>stroke</code> and <code>fill</code> from CSS, but if you're using a <em>sprite-map</em>, all the <code>&lt;svg&gt;</code>-icons (or: the elements within them, like <code>path</code> or <code>line</code>) will have the same styling.<br><br>
Maybe that's what you want, but there's one extra option:</p>

<p><code>currentColor</code> is a reserved CSS-keyword (value), inheriting the current color (following the cascade). If you have an icon with more than one element and want some of the elements to have a different <code>stroke</code> or <code>fill</code>, do this:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight xml"><code><span class="nt">&lt;line</span> <span class="na">x1=</span><span class="s">"25"</span> <span class="na">y1=</span><span class="s">"25"</span> <span class="na">x2=</span><span class="s">"75"</span> <span class="na">y2=</span><span class="s">"75"</span> <span class="nt">/&gt;</span>
<span class="nt">&lt;line</span> <span class="na">x1=</span><span class="s">"75"</span> <span class="na">y1=</span><span class="s">"25"</span> <span class="na">x2=</span><span class="s">"25"</span> <span class="na">y2=</span><span class="s">"75"</span> <span class="na">stroke=</span><span class="s">"currentColor</span> <span class="nt">/&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And in the CSS:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.c-ico</span> <span class="p">{</span>
  <span class="nl">color</span><span class="p">:</span> <span class="no">red</span><span class="p">;</span>
  <span class="py">stroke</span><span class="p">:</span> <span class="no">tomato</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The first <code>line</code>-element will use the <code>stroke</code>-property, the second one will use the <code>color</code>-property.  </p>


<hr>

<h2>
  <a name="coloring-a-raw-backgroundimage-endraw-" href="#coloring-a-raw-backgroundimage-endraw-">
  </a>
  Coloring a <code>background-image</code>.
</h2>

<p>It is also <a href="https://css-tricks.com/solved-with-css-colorizing-svg-backgrounds/" target="_blank" rel="noopener noreferrer">possible to color</a> an <code>&lt;svg&gt;</code> as a <code>background-image</code> — but it ain't pretty!<br><br>
You need to set an initial <code>fill</code>-value in either the physical <code>&lt;svg&gt;</code>-file or in the CSS Custom property — and you need to set it to one of the allowed values for: <strong>white</strong> (<code>#FFF</code>, <code>white</code> etc).<br><br>
In <code>hsl</code>, the value for “white” is: <code>hsl(0, 0%, 100%)</code>, so that's the <em>starting point</em>. <br>
You could also use “black” as your starting point, but for these examples it's “white”.<br>
Now, you can use a CSS filter to <em>change</em> the <code>hue</code>, <code>saturation</code> or <code>lightness</code> from the <em>starting point</em> of <code>hsl(0, 0%, 100%)</code>, for example:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.c-ico--pink</span> <span class="p">{</span>
  <span class="nl">filter</span><span class="p">:</span> <span class="n">brightness</span><span class="p">(</span><span class="m">0.5</span><span class="p">)</span> <span class="n">sepia</span><span class="p">(</span><span class="m">1</span><span class="p">)</span> <span class="n">hue-rotate</span><span class="p">(</span><span class="m">-70deg</span><span class="p">)</span> <span class="n">saturate</span><span class="p">(</span><span class="m">5</span><span class="p">);</span>
<span class="p">}</span>
<span class="nc">.c-ico--blue</span> <span class="p">{</span>
  <span class="nl">filter</span><span class="p">:</span> <span class="n">brightness</span><span class="p">(</span><span class="m">0.5</span><span class="p">)</span> <span class="n">sepia</span><span class="p">(</span><span class="m">1</span><span class="p">)</span> <span class="n">hue-rotate</span><span class="p">(</span><span class="m">140deg</span><span class="p">)</span> <span class="n">saturate</span><span class="p">(</span><span class="m">6</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>




<hr>

<h2>
  <a name="coloring-a-raw-maskimage-endraw-" href="#coloring-a-raw-maskimage-endraw-">
  </a>
  Coloring a <code>mask-image</code>
</h2>

<p>It's much easier to color a <code>mask-image</code> — and if you store your icons as <em>CSS Custom Properties</em> as mentioned above, you have a very flexible combination.<br>
Place an <code>&lt;svg&gt;</code> as the <code>url()</code> of a <code>mask-image</code>-property on an element that also has  a <code>background-color</code>.  </p>

<p>The <code>&lt;svg&gt;</code> will be “masked” with that color:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.c-ico</span> <span class="p">{</span>
  <span class="c">/* excerpt */</span>
  <span class="py">--ico</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--ico-empty</span><span class="p">);</span>
  <span class="py">--ico-bgc</span><span class="p">:</span> <span class="n">currentColor</span><span class="p">;</span>
  <span class="py">--ico-h</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>
  <span class="py">--ico-w</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>
  <span class="nl">background-color</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--ico-bgc</span><span class="p">);</span>
  <span class="nl">height</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--ico-h</span><span class="p">);</span>
  <span class="nl">mask</span><span class="p">:</span> <span class="nb">no-repeat</span> <span class="nb">center</span><span class="p">/</span><span class="n">var</span><span class="p">(</span><span class="n">--ico-w</span><span class="p">)</span> <span class="n">var</span><span class="p">(</span><span class="n">--ico</span><span class="p">);</span>
  <span class="nl">width</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--ico-w</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>It's super-easy to change the icon <em>and</em> it's color with a modifier-class:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.c-ico--check</span> <span class="p">{</span>
  <span class="py">--ico</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--ico-check</span><span class="p">);</span>
  <span class="py">--ico-bgc</span><span class="p">:</span> <span class="no">tomato</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>As the icon here has it's own element (<code>&lt;i&gt;</code> in this example):<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;i</span> <span class="na">class=</span><span class="s">"c-ico c-ico--check"</span> <span class="na">aria-hidden=</span><span class="s">"true"</span><span class="nt">&gt;&lt;/i&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>— all the usual CSS-tricks can be applied as well: <code>transform</code>, for example.</p>


<hr>

<h2>
  <a name="converting-existing-svgs-to-raw-url-endraw-" href="#converting-existing-svgs-to-raw-url-endraw-">
  </a>
  Converting existing SVGs to <code>url()</code>
</h2>

<p>I’ve created a tool, that can convert your existing SVG icons to a CSS <code>url()</code>, so they can be used with <code>background-image</code> or <code>mask-image</code>:</p>

<p><iframe height="600" src="https://codepen.io/stoumann/embed/ZEpERMp?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
<br>
<a href="https://codepen.io/stoumann/pen/ZEpERMp" target="_blank" rel="noopener noreferrer">https://codepen.io/stoumann/pen/ZEpERMp</a></p>

<p>You just drag and drop an SVG-file to the preview-area. If an icon looks weird, try another import option. By default, the option “deep: remove as much” is selected. This option will try to remove as much “clutter” from the SVG as possible (unnecessary tags, comments etc.).</p>

<hr>
<h2>
  <a name="usage-examples" href="#usage-examples">
  </a>
  Usage Examples
</h2>

<p>In the examples below, I've visualized why inline svg, <code>&lt;use&gt;</code> or <code>mask-image</code> are my preferred methods when implementing <code>&lt;svg&gt;</code>-icons (the “checkmark” in the examples).<br>
If you change the text-color, as in the “dark mode” -example, the <code>&lt;svg&gt;</code>'s used as <code>&lt;img&gt;</code> or <code>background-image</code> will not change color.</p>

<h2>
  <a name="security-and-raw-ltsvggt-endraw-" href="#security-and-raw-ltsvggt-endraw-">
  </a>
  Security and <code>&lt;svg&gt;</code>
</h2>

<p><em>[...] Because of this ability to contain JavaScript, they are a perfect attack vector for Cross-Site Scripting on sites which allow either arbitrary file uploads or limit the file types to images and accept SVGs.</em></p>

<p>The quote above is from a blog-post entitled <a href="https://digi.ninja/blog/svg_xss.php" target="_blank" rel="noopener noreferrer">Protecting against XSS in SVG</a>, outlining the security issues related to using <code>&lt;svg&gt;</code>.</p>

<p><code>&lt;svg&gt;</code> is <code>&lt;xml&gt;</code>, and thus it can contain a regular <code>&lt;script&gt;</code>-block.<br><br>
If you have an <em>Icon System</em> that automatically in-lines <code>&lt;svg&gt;</code>'s in your final markup, thread carefully, if content-editors are allowed to upload <code>&lt;svg&gt;</code>'s directly.</p>

<p><em>Example:</em><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight xml"><code><span class="nt">&lt;svg</span> <span class="na">viewBox=</span><span class="s">"0 0 100 100"</span> <span class="na">class=</span><span class="s">"c-ico--stroke"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;path</span> <span class="na">d=</span><span class="s">"M25,25 L75,75 M75,25 L25,75"</span><span class="nt">&gt;&lt;/path&gt;</span>
  <span class="nt">&lt;script&gt;</span>console.log('Evil script running...');<span class="nt">&lt;/script&gt;</span>
<span class="nt">&lt;/svg&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>When in-lined, the script will run, check the <code>console</code>.<br>
In newer browsers, scripts will not run if the <code>&lt;svg&gt;</code> is used from either <code>&lt;img&gt;</code>-tags or via <code>&lt;use&gt;</code>.</p>

<hr>
<h2>
  <a name="svgspritemapwebpackplugin" href="#svgspritemapwebpackplugin">
  </a>
  SvgSpritemapWebpackPlugin
</h2>

<p>This webpack-plugin generates a single SVG spritemap containing multiple  elements from all .svg files in a directory. In addition, it can optimize the output and can also generate a stylesheet containing the sprites to be used directly from CSS. </p>

<p>Download <a href="https://github.com/cascornelissen/svg-spritemap-webpack-plugin" target="_blank" rel="noopener noreferrer">SvgSpritemapWebpackPlugin</a> if you're looking for an easy way to convert a folder of <code>.svg</code>-files to a single <em>spritemap</em>. While the current version cannot generate <em>CSS Custom Properties</em> from the <code>.svg</code>-files, there are <code>.scss</code> and <code>.less</code> mixin/variables that will let you use them from CSS.<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.example</span> <span class="p">{</span>
  <span class="c">/* Using the included sprite() mixin */</span>
  <span class="err">@include</span> <span class="err">sprite('check');</span>
  <span class="c">/* Using the SVG from the map directly */</span>
  <span class="nl">background-image</span><span class="p">:</span> <span class="sx">url(map-get($sprites, 'check')</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>

<h2>
  <a name="polyfill-for-using-raw-ltusegt-endraw-" href="#polyfill-for-using-raw-ltusegt-endraw-">
  </a>
  Polyfill for using <code>&lt;use&gt;</code>
</h2>

<p>IE 11 doesn't support <code>&lt;use&gt;</code>, so you'll need a poly-fill (if you still need to support IE11!).<br>
<a href="https://github.com/jonathantneal/svg4everybody" target="_blank" rel="noopener noreferrer">svg4everybody</a> is a popular poly-fill for using <code>&lt;use&gt;</code> in <em>Internet Explorer</em>, and is highly recommended.</p>

<p>Below is a simple example of conditionally loading <em>svg4everybody</em>, if the browser is IE11:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">isIE11</span> <span class="o">=</span> <span class="o">!!</span><span class="nb">window</span><span class="p">.</span><span class="nx">MSInputMethodContext</span> <span class="o">&amp;&amp;</span> <span class="o">!!</span><span class="nb">document</span><span class="p">.</span><span class="nx">documentMode</span><span class="p">;</span>
<span class="k">if </span><span class="p">(</span><span class="nx">isIE11</span><span class="p">)</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">s4e</span> <span class="o">=</span> <span class="nb">document</span><span class="p">.</span><span class="nf">createElement</span><span class="p">(</span><span class="dl">'</span><span class="s1">script</span><span class="dl">'</span><span class="p">);</span>
  <span class="kd">const</span> <span class="nx">s4eUrl</span> <span class="o">=</span> <span class="dl">'</span><span class="s1">svg4everybody.min.js</span><span class="dl">'</span>
  <span class="nx">s4e</span><span class="p">.</span><span class="nf">setAttribute</span><span class="p">(</span><span class="dl">'</span><span class="s1">src</span><span class="dl">'</span><span class="p">,</span> <span class="nx">s4eUrl</span><span class="p">);</span>
  <span class="nx">s4e</span><span class="p">.</span><span class="nx">onload</span> <span class="o">=</span> <span class="kd">function</span><span class="p">()</span> <span class="p">{</span> <span class="nf">svg4everybody</span><span class="p">();</span> <span class="p">}</span>
  <span class="nb">document</span><span class="p">.</span><span class="nx">head</span><span class="p">.</span><span class="nf">appendChild</span><span class="p">(</span><span class="nx">s4e</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>

<p>Download the script from <em>svg4everybody</em>'s GitHub-repo, and replace <em>s4eUrl</em> with the correct path.<br>
Or link to it directly from <a href="https://cdnjs.cloudflare.com/ajax/libs/svg4everybody/2.1.9/svg4everybody.min.js" target="_blank" rel="noopener noreferrer">Cloudflare</a> or a similar CDN-service.</p>

<p>While <em>svg4everybody</em> works in most cases, I had a project where <code>&lt;text&gt;</code>-elements were being added dynamically to an <code>&lt;svg&gt;</code>-shape, so editors could modify text-lines in an <code>&lt;svg&gt;</code>-shape (custom svg-splashes with product-offers) from a CMS:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight xml"><code><span class="nt">&lt;svg</span> <span class="na">viewBox=</span><span class="s">"0 0 100 100"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;use</span> <span class="na">xlink:href=</span><span class="s">"file.svg#name"</span> <span class="nt">/&gt;</span>
  Dynamic <span class="nt">&lt;text&gt;</span>content<span class="nt">&lt;/text&gt;</span> here ...
<span class="nt">&lt;/svg&gt;</span>
</code></pre>

<span class="nt">&lt;/svg&gt;</span>
</code></pre>

<p>Thus, the <code>&lt;svg&gt;</code>-shape ended up <em>after</em> the <code>&lt;text&gt;</code>-lines. 😞 <br>
As the project was already running Babel, I could write a poly-fill in ES6:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="cm">/**
* @function svgUse
* @description Looks up &lt;symbol&gt; in external &lt;svg&gt;, adds content of &lt;symbol&gt; to local &lt;svg&gt;
* @param {Node} scope
*/</span>
<span class="k">export</span> <span class="kd">function</span> <span class="nf">svgUse</span><span class="p">(</span><span class="nx">scope</span> <span class="o">=</span> <span class="nb">document</span><span class="p">)</span> <span class="p">{</span>
<span class="kd">const</span> <span class="nx">use</span> <span class="o">=</span> <span class="nx">scope</span><span class="p">.</span><span class="nf">querySelectorAll</span><span class="p">(</span><span class="dl">'</span><span class="s1">use</span><span class="dl">'</span><span class="p">);</span>
<span class="k">if </span><span class="p">(</span><span class="nx">use</span><span class="p">)</span> <span class="p">{</span>
  <span class="kd">let</span> <span class="nx">symbols</span> <span class="o">=</span> <span class="p">{};</span>
  <span class="kd">let</span> <span class="nx">svgs</span> <span class="o">=</span> <span class="p">{};</span>
  <span class="cm">/* Build Set of unique url's */</span>
  <span class="kd">const</span> <span class="nx">urls</span> <span class="o">=</span> <span class="p">[];</span>
  <span class="nx">use</span><span class="p">.</span><span class="nf">forEach</span><span class="p">(</span><span class="nx">elm</span> <span class="o">=&gt;</span> <span class="p">{</span>
    <span class="kd">const</span> <span class="nx">url</span> <span class="o">=</span> <span class="nx">elm</span><span class="p">.</span><span class="nf">getAttribute</span><span class="p">(</span><span class="dl">"</span><span class="s2">xlink:href</span><span class="dl">"</span><span class="p">).</span><span class="nf">split</span><span class="p">(</span><span class="dl">'</span><span class="s1">#</span><span class="dl">'</span><span class="p">)[</span><span class="mi">0</span><span class="p">];</span>
    <span class="k">if </span><span class="p">(</span><span class="nx">url</span> <span class="o">&amp;&amp;</span> <span class="nx">urls</span><span class="p">.</span><span class="nf">indexOf</span><span class="p">(</span><span class="nx">url</span><span class="p">)</span> <span class="o">===</span> <span class="o">-</span><span class="mi">1</span><span class="p">)</span> <span class="p">{</span>
      <span class="nx">urls</span><span class="p">.</span><span class="nf">push</span><span class="p">(</span><span class="nx">url</span><span class="p">);</span>
    <span class="p">}</span>
  <span class="p">});</span>
  <span class="cm">/* Fetch all unique URL's, push to
  svgs-object with the url as key */</span>
  <span class="nb">Promise</span><span class="p">.</span><span class="nf">all</span><span class="p">(</span><span class="nx">urls</span><span class="p">.</span><span class="nf">map</span><span class="p">(</span><span class="k">async</span> <span class="nx">url</span> <span class="o">=&gt;</span> <span class="p">{</span>
    <span class="kd">const</span> <span class="nx">data</span> <span class="o">=</span> <span class="k">await</span> <span class="nf">fetch</span><span class="p">(</span><span class="nx">url</span><span class="p">);</span>
    <span class="kd">const</span> <span class="nx">text</span> <span class="o">=</span> <span class="k">await</span> <span class="nx">data</span><span class="p">.</span><span class="nf">text</span><span class="p">();</span>
    <span class="nx">svgs</span><span class="p">[</span><span class="s2">`"</span><span class="p">${</span><span class="nx">url</span><span class="p">}</span><span class="s2">"`</span><span class="p">]</span> <span class="o">=</span> <span class="nx">text</span><span class="p">;</span>
  <span class="p">})).</span><span class="nf">then</span><span class="p">(()</span> <span class="o">=&gt;</span> <span class="p">{</span>
    <span class="cm">/* Process each &lt;use&gt;-element, lookup content in `svgs` */</span>
    <span class="nx">use</span><span class="p">.</span><span class="nf">forEach</span><span class="p">(</span><span class="nx">elm</span> <span class="o">=&gt;</span> <span class="p">{</span>
      <span class="kd">const</span> <span class="p">[</span><span class="nx">url</span><span class="p">,</span> <span class="nx">id</span><span class="p">]</span> <span class="o">=</span> <span class="nx">elm</span><span class="p">.</span><span class="nf">getAttribute</span><span class="p">(</span><span class="dl">"</span><span class="s2">xlink:href</span><span class="dl">"</span><span class="p">).</span><span class="nf">split</span><span class="p">(</span><span class="dl">'</span><span class="s1">#</span><span class="dl">'</span><span class="p">);</span>
      <span class="kd">const</span> <span class="nx">exists</span> <span class="o">=</span> <span class="nx">symbols</span><span class="p">.</span><span class="nf">hasOwnProperty</span><span class="p">(</span><span class="nx">id</span><span class="p">);</span>
      <span class="cm">/* Check if `id` is already created as a (data)-
      fragment in `symbols`, set fragment */</span>
      <span class="kd">let</span> <span class="nx">fragment</span> <span class="o">=</span> <span class="nx">exists</span> <span class="p">?</span> <span class="nx">symbols</span><span class="p">[</span><span class="nx">id</span><span class="p">].</span><span class="nx">data</span> <span class="p">:</span> <span class="nb">document</span><span class="p">.</span><span class="nf">createDocumentFragment</span><span class="p">();</span>
      <span class="cm">/* If `id` does not exist, look it up in svgs using `url`, 
      parse it and extract childNodes */</span>
      <span class="k">if </span><span class="p">(</span><span class="o">!</span><span class="nx">exists</span><span class="p">)</span> <span class="p">{</span>
        <span class="kd">const</span> <span class="nx">parser</span> <span class="o">=</span> <span class="k">new</span> <span class="nx">DOMParser</span><span class="p">;</span>
        <span class="kd">const</span> <span class="nx">doc</span> <span class="o">=</span> <span class="nx">parser</span><span class="p">.</span><span class="nf">parseFromString</span><span class="p">(</span><span class="nx">svgs</span><span class="p">[</span><span class="s2">`"</span><span class="p">${</span><span class="nx">url</span><span class="p">}</span><span class="s2">"`</span><span class="p">],</span> <span class="dl">'</span><span class="s1">text/xml</span><span class="dl">'</span><span class="p">);</span>
        <span class="kd">const</span> <span class="nx">svg</span> <span class="o">=</span> <span class="nx">doc</span><span class="p">.</span><span class="nf">getElementById</span><span class="p">(</span><span class="nx">id</span><span class="p">);</span>
        <span class="nb">Array</span><span class="p">.</span><span class="k">from</span><span class="p">(</span><span class="nx">svg</span><span class="p">.</span><span class="nx">childNodes</span><span class="p">).</span><span class="nf">forEach</span><span class="p">(</span><span class="nx">node</span> <span class="o">=&gt;</span> <span class="p">{</span><span class="k">return</span> <span class="nx">fragment</span><span class="p">.</span><span class="nf">appendChild</span><span class="p">(</span><span class="nx">node</span><span class="p">)});</span>
        <span class="cm">/* Push fragment and viewBox to `symbols` */</span>
        <span class="nx">symbols</span><span class="p">[</span><span class="nx">id</span><span class="p">]</span> <span class="o">=</span> <span class="p">{</span> <span class="na">data</span><span class="p">:</span> <span class="nx">fragment</span><span class="p">,</span> <span class="na">viewBox</span> <span class="p">:</span> <span class="nx">svg</span><span class="p">.</span><span class="nf">getAttribute</span><span class="p">(</span><span class="dl">'</span><span class="s1">viewBox</span><span class="dl">'</span><span class="p">)</span> <span class="p">};</span>
      <span class="p">}</span>
      <span class="cm">/* If parent-&lt;svg&gt; does not have a viewBox-
      attribute, add it from &lt;symbol&gt; */</span>
      <span class="k">if </span><span class="p">(</span><span class="o">!</span><span class="nx">elm</span><span class="p">.</span><span class="nx">parentNode</span><span class="p">.</span><span class="nf">hasAttribute</span><span class="p">(</span><span class="dl">"</span><span class="s2">viewBox</span><span class="dl">"</span><span class="p">))</span> <span class="p">{</span>
        <span class="nx">elm</span><span class="p">.</span><span class="nx">parentNode</span><span class="p">.</span><span class="nf">setAttribute</span><span class="p">(</span><span class="dl">'</span><span class="s1">viewBox</span><span class="dl">'</span><span class="p">,</span> <span class="nx">symbols</span><span class="p">[</span><span class="nx">id</span><span class="p">].</span><span class="nx">viewBox</span><span class="p">);</span>
      <span class="p">}</span>
      <span class="nx">elm</span><span class="p">.</span><span class="nx">parentNode</span><span class="p">.</span><span class="nf">replaceChild</span><span class="p">(</span><span class="nx">fragment</span><span class="p">.</span><span class="nf">cloneNode</span><span class="p">(</span><span class="kc">true</span><span class="p">),</span> <span class="nx">elm</span><span class="p">);</span>
    <span class="p">})</span>
  <span class="p">}).</span><span class="k">catch</span><span class="p">(</span><span class="kd">function</span><span class="p">(</span><span class="nx">err</span><span class="p">)</span> <span class="p">{</span>
    <span class="nx">console</span><span class="p">.</span><span class="nf">error</span><span class="p">(</span><span class="nx">err</span><span class="p">);</span>
  <span class="p">});</span>
<span class="p">}</span>
</code></pre>

<h2>
  <a name="implementations-css-icons" href="#implementations-css-icons">
  </a>
  Implementations: CSS Icons
</h2>

<p>Sometimes a huge SVG-based <em>Icon System</em> might be unnecessary, if you just need a few arrows, a “close-icon” etc. There’s a classic article on css-tricks about the <a href="https://css-tricks.com/the-shapes-of-css/" target="_blank" rel="noopener noreferrer">shapes of CSS</a>. <br>
I thought it could be a fun project to create a small library of <em>CSS Icons,</em> using some of these classic techniques, but also adding newer features like <code>clip-path</code> for creating even more icons using pure CSS:</p>

<p><iframe height="600" src="https://codepen.io/stoumann/embed/eYzPVqe?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
<br>
<a href="https://codepen.io/stoumann/pen/eYzPVqe" target="_blank" rel="noopener noreferrer">https://codepen.io/stoumann/pen/eYzPVqe</a></p>

<p><code>clip-path</code> is — like <code>svg</code> — vector-based. <code>path</code> is not supported for <code>clip-path</code> yet, but when it is, you’ll have nearly as many possibilities for creating shapes and icons as in <code>svg</code>. </p>

<p>If you want to create your own icons using <code>clip-path</code>, I’ve made a small tool for that:</p>

<h2>
  <a name="implementations-icon-fonts" href="#implementations-icon-fonts">
  </a>
  Implementations: Icon Fonts
</h2>

<p>I think we've all encountered a slow-loading website, where strange letters or symbols were shown instead of an icon — until the <em>Icon Font</em> finished loading.</p>

<p>That's just <em>one</em> of the downsides of using an <em>Icon font</em>.<br>
In the blog-post <a href="https://www.lambdatest.com/blog/its-2019-lets-end-the-debate-on-icon-fonts-vs-svg-icons/" target="_blank" rel="noopener noreferrer">“It's 2019! Let's End The Debate On Icon Fonts vs SVG Icons”</a>, <code>&lt;svg&gt;</code> is the clear winner when it comes to:</p>

<ul>
<li>
<strong>Accessibility</strong>. An <code>&lt;svg&gt;</code> is treated like an image, not as text, that will be read aloud by a screen-reader.</li>
<li>
<strong>Scalability</strong>. This is the main reason why I switched to using <code>&lt;svg&gt;</code>. Also, they're easier to modify <em>on-the-fly</em>.</li>
<li>
<strong>Animation</strong>. You can animate each <code>path</code>, <code>line</code> etc. in an <code>&lt;svg&gt;</code>
</li>
</ul>

<p>Google provides an <em>Icon font</em> for their <a href="https://google.github.io/material-design-icons/" target="_blank" rel="noopener noreferrer">Material Design</a>, so the format is not completely dead — yet.</p>

<p>Thank you for reading!</p>
