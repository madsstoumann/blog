			<h1>Deconstructing Art: Learning From Constraints</h1>
			<p>Artists have always worked with a lot of constraints. </p>

<p>Today, we can make <em>any</em> color we want chemically (with very few exceptions, such as <em>vantablack</em>), but earlier on, artists had to rely on <em>much</em> fewer colors.</p>

<ul>
<li>Some colors weren't possible to make with the available pigments</li>
<li>Some colors made them sick (containing arsenic!) </li>
<li>Some colors reacted too much with air</li>
<li>Some colors were simply too expensive</li>
</ul>

<p>Another constraint was the way colors reacted with <em>each other</em>, how they had to be layered etc. I'm <em>deeply in awe</em> of the sheer knowledge these artist must have had about colors and pigments.</p>

<p>Nowadays we can paint digitally, and there are <em>no</em> constraints besides the limitation of our imagination. But what if we remove that constraint, and let the power of <em>randomness</em> guide us to new visual ideas? Do we then need to <em>add</em> constraints, in order to keep it human?</p>


<hr>

<p>I recently went to the National Art Gallery in Copenhagen, Denmark, and stumbled upon this beautiful painting, <em>Cirkler og vertikaler (Circles and verticals) 1930</em>, by Fransiska Clausen:</p>

<p><a href="assets/706998/cf68146a.jpg" class="article-body-image-wrapper"><img src="assets/706998/cf68146a.jpg" alt="franciska-clausen-cirkler-og-vertikaler" loading="lazy" width="364" height="470"></a></p>

<p>There are clearly <em>a lot of constraints</em> in that painting. The color palette is limited, almost grayscale — with a dominant red as a contrast.</p>

<p>Every “object” is a rectangle with two circles. The radii of the circles are half the width of the rectangles, and the vertical start-position of a rectangle (it's <em>y</em>-coordinate) is equal to the radius.</p>

<p>In dummy <code>svg</code>-code, this is how a single object is constructed:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight xml"><code><span class="nt">&lt;rect</span> <span class="na">y=</span><span class="s">"{width/2}"</span> <span class="na">width=</span><span class="s">"{width}"</span> <span class="na">height=</span><span class="s">"{height-width}"</span> <span class="nt">/&gt;</span>
<span class="nt">&lt;circle</span> <span class="na">r=</span><span class="s">"{width/2}"</span> <span class="na">cx=</span><span class="s">"{width/2}"</span> <span class="na">cy=</span><span class="s">"{width/2}"</span> <span class="nt">/&gt;</span>
<span class="nt">&lt;circle</span> <span class="na">r=</span><span class="s">"{width/2}"</span> <span class="na">cx=</span><span class="s">"${width/2}"</span> <span class="na">cy=</span><span class="s">"{height-(width/2)}"</span> <span class="nt">/&gt;</span>
</code></pre>

</div>
</div>
</div>



<p>And now for the fun parts: Let's <em>keep</em> the shape and the color-palette, but <em>randomize</em> the height, width, position, and how the colors are used:</p>

<p><a href="assets/706998/03024988.jpg" class="article-body-image-wrapper"><img src="assets/706998/03024988.jpg" alt="circlesverticals" loading="lazy" width="800" height="795"></a></p>

<p>Now, let's randomize the <em>amount of shapes</em>, as well as <em>rotation:</em> </p>

<p><a href="assets/706998/f5bf4d22.jpg" class="article-body-image-wrapper"><img src="assets/706998/f5bf4d22.jpg" alt="image_ (41)" loading="lazy" width="800" height="768"></a></p>

<p>So far, so good! It still resembles a piece of art. What happens if we loosen the constraints and randomize everything (except the shape)? </p>

<p>We end up with something like this:</p>

<p><a href="assets/706998/fde3fa10.jpg" class="article-body-image-wrapper"><img src="assets/706998/fde3fa10.jpg" alt="image_ (43)" loading="lazy" width="800" height="803"></a></p>

<p>While this is fun, it's a bit <em>too chaotic</em> for my taste! Let's <em>add</em> a constraint, still randomizing the colors, but only picking random colors <em>between</em> two hues:</p>

<p><a href="assets/706998/c9ffa26b.jpg" class="article-body-image-wrapper"><img src="assets/706998/c9ffa26b.jpg" alt="image_ (36)" loading="lazy" width="800" height="744"></a></p>

<p>Let's add <em>another</em> constraint, forcing the rotation to a single angle:</p>

<p><a href="assets/706998/cfef8981.jpg" class="article-body-image-wrapper"><img src="assets/706998/cfef8981.jpg" alt="image_ (39)" loading="lazy" width="800" height="812"></a></p>

<p>We can also add a constraint limiting the width of the shape:</p>

<p><a href="assets/706998/a2c5cf06.jpg" class="article-body-image-wrapper"><img src="assets/706998/a2c5cf06.jpg" alt="image_ (40)" loading="lazy" width="800" height="719"></a></p>

<p>Now, <em>that's</em> a bit boring for my taste!</p>

<p>I think the secret to good art – and maybe even webdesign – is <em>unpredictability</em> mixed with ... well, <em>predictability</em>! </p>

<p>And while we can seek inspiration in <em>randomness</em> (and AI-art), we should add just enough constraints to make it predictable and human.</p>

<p>Thanks for reading! </p>


<hr>

<p>PS! The JavaScript for these examples simply iterate an array of random coordinates (snippet):<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nx">svg</span><span class="p">.</span><span class="nx">innerHTML</span> <span class="o">=</span> <span class="nx">coords</span><span class="p">.</span><span class="nf">map</span><span class="p">(</span><span class="nx">coord</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="p">[</span><span class="nx">x</span><span class="p">,</span> <span class="nx">y</span><span class="p">]</span> <span class="o">=</span> <span class="p">[...</span><span class="nx">coord</span><span class="p">];</span>
  <span class="kd">const</span> <span class="nx">width</span> <span class="o">=</span> <span class="nc">R</span><span class="p">(</span><span class="mi">10</span><span class="p">,</span><span class="mi">100</span><span class="p">);</span>
  <span class="kd">const</span> <span class="nx">height</span> <span class="o">=</span> <span class="nc">R</span><span class="p">(</span><span class="mi">25</span><span class="p">,</span><span class="mi">400</span><span class="p">);</span>
  <span class="k">return</span> <span class="s2">`
    &lt;g transform="translate(</span><span class="p">${</span><span class="nx">x</span><span class="p">}</span><span class="s2">,</span><span class="p">${</span><span class="nx">y</span><span class="p">}</span><span class="s2">) rotate(</span><span class="p">${</span><span class="nc">R</span><span class="p">(</span><span class="mi">0</span><span class="p">,</span><span class="mi">360</span><span class="p">)}</span><span class="s2">)"&gt;
      &lt;rect y="</span><span class="p">${</span><span class="nx">width</span> <span class="o">/</span> <span class="mi">2</span><span class="p">}</span><span class="s2">" width="</span><span class="p">${</span><span class="nx">width</span><span class="p">}</span><span class="s2">" height="</span><span class="p">${</span><span class="nx">height</span> <span class="o">-</span> <span class="nx">width</span><span class="p">}</span><span class="s2">" fill="</span><span class="p">${</span><span class="nf">randomColor</span><span class="p">()}</span><span class="s2">" /&gt;
      &lt;circle r="</span><span class="p">${</span><span class="nx">width</span> <span class="o">/</span> <span class="mi">2</span><span class="p">}</span><span class="s2">" cx="</span><span class="p">${</span><span class="nx">width</span> <span class="o">/</span> <span class="mi">2</span><span class="p">}</span><span class="s2">" cy="</span><span class="p">${</span><span class="nx">width</span> <span class="o">/</span> <span class="mi">2</span><span class="p">}</span><span class="s2">" fill="</span><span class="p">${</span><span class="nf">randomColor</span><span class="p">()}</span><span class="s2">" /&gt;
      &lt;circle r="</span><span class="p">${</span><span class="nx">width</span> <span class="o">/</span> <span class="mi">2</span><span class="p">}</span><span class="s2">" cx="</span><span class="p">${</span><span class="nx">width</span> <span class="o">/</span> <span class="mi">2</span><span class="p">}</span><span class="s2">" cy="</span><span class="p">${</span><span class="nx">height</span> <span class="o">-</span> <span class="p">(</span><span class="nx">width</span> <span class="o">/</span> <span class="mi">2</span><span class="p">)}</span><span class="s2">" fill="</span><span class="p">${</span><span class="nf">randomColor</span><span class="p">()}</span><span class="s2">" /&gt;
    &lt;/g&gt;    
  `</span><span class="p">;</span>
<span class="p">}).</span><span class="nf">join</span><span class="p">(</span><span class="dl">''</span><span class="p">);</span>
</code></pre>

<p>The <code>R()</code>-function returns a random number between a min- and a max-value, whereas the <code>randomColor()</code>-function returns a <code>hsl()</code>-color with random hue, saturation and lightness-values.</p>

<p>The added constraints then limit these.</p>
