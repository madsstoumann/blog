		<article>
			<h1>Building a Reaction Component</h1>
			<p>We're all familiar with dev.to's “Reaction Component” (although I'm still not sure, what the unicorn is for!) Here's a short tutorial on how to create a “Reaction Component” – both with <em>and</em> without JavaScipt.</p>

<p>Let's start with the CSS version!</p>


<hr>

<h2>
  <a name="markup" href="#markup">
  </a>
  Markup
</h2>

<p>We're going to wrap each <em>reaction</em> in a <code>&lt;label&gt;</code>, and add the <code>&lt;svg&gt;</code> and an empty <code>&lt;span&gt;</code> after a <code>&lt;input type="checkbox"&gt;</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;label</span> <span class="na">aria-label=</span><span class="s">"React with heart"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;input</span> <span class="na">type=</span><span class="s">"checkbox"</span> <span class="na">name=</span><span class="s">"reaction-heart"</span> <span class="na">value=</span><span class="s">"75"</span> <span class="na">style=</span><span class="s">"--c:75"</span> <span class="nt">/&gt;</span>
  <span class="nt">&lt;svg&gt;&lt;/svg&gt;</span>
  <span class="nt">&lt;span&gt;&lt;/span&gt;</span>
<span class="nt">&lt;/label&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The <code>&lt;input type="checkbox"&gt;</code> is what we'll use to control both <code>state</code> <strong>and</strong> <code>value</code>. </p>


<hr>

<h2>
  <a name="icon" href="#icon">
  </a>
  Icon
</h2>

<p>On dev.to, two different icons are used, when you “react” to something. For the “like“-action, there's an <em>unfilled</em> heart and a <em>filled</em> heart. Same story for the “unicorn” and “bookmark”-reactions. </p>

<p>One could argue, that with slight design changes, the icons could simply toggle SVG's <code>fill</code>, <code>stroke</code> or <code>stroke-width</code> – but let's leave it at two icons. We'll <code>&lt;g&gt;</code>roup them within a single SVG:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight xml"><code><span class="nt">&lt;svg</span> <span class="na">viewBox=</span><span class="s">"0 0 24 24"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;g&gt;&lt;path</span> <span class="na">d=</span><span class="s">"M21.179 12.794l.013.014L12 22l-9.192-9.192.013-.014A6.5 6.5 0 0112 3.64a6.5 6.5 0 019.179 9.154zM4.575 5.383a4.5 4.5 0 000 6.364L12 19.172l7.425-7.425a4.5 4.5 0 10-6.364-6.364L8.818 9.626 7.404 8.21l3.162-3.162a4.5 4.5 0 00-5.99.334l-.001.001z"</span><span class="nt">&gt;&lt;/path&gt;&lt;/g&gt;</span>
  <span class="nt">&lt;g&gt;&lt;path</span> <span class="na">d=</span><span class="s">"M2.821 12.794a6.5 6.5 0 017.413-10.24h-.002L5.99 6.798l1.414 1.414 4.242-4.242a6.5 6.5 0 019.193 9.192L12 22l-9.192-9.192.013-.014z"</span><span class="nt">&gt;&lt;/path&gt;&lt;/g&gt;</span>
<span class="nt">&lt;/svg&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>In CSS, we an use the <code>:checked</code> pseudo-selector to toggle between the two icons (in <code>&lt;g&gt;</code>-tags):<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">[</span><span class="nt">name</span><span class="o">*=</span><span class="s1">"reaction-"</span><span class="o">]</span><span class="nd">:checked</span> <span class="o">+</span> <span class="nt">svg</span> <span class="nt">g</span><span class="nd">:first-of-type</span><span class="o">,</span>
<span class="o">[</span><span class="nt">name</span><span class="o">*=</span><span class="s1">"reaction-"</span><span class="o">]</span><span class="nd">:not</span><span class="o">(</span><span class="nd">:checked</span><span class="o">)</span> <span class="o">+</span> <span class="nt">svg</span> <span class="nt">g</span><span class="nd">:last-of-type</span> <span class="p">{</span>
  <span class="nl">opacity</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
<span class="p">}</span>
<span class="o">[</span><span class="nt">name</span><span class="o">*=</span><span class="s1">"reaction-"</span><span class="o">]</span><span class="nd">:checked</span> <span class="o">+</span> <span class="nt">svg</span> <span class="nt">g</span><span class="nd">:last-of-type</span> <span class="p">{</span>
  <span class="nl">opacity</span><span class="p">:</span> <span class="m">1</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Cool, now we can toggle between the two icons using the checkbox, let's add a counter! Did you notice the <code>style="--c:75"</code> in the markup?</p>

<p>We'll use that for a CSS counter:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">counter-reset</span><span class="o">:</span> <span class="nt">reaction</span> <span class="nt">var</span><span class="o">(</span><span class="nt">--c</span><span class="o">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Unfortunately, we can't use the <code>value</code>-attribute, as in:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">counter-reset</span><span class="o">:</span> <span class="nt">reaction</span> <span class="nt">attr</span><span class="o">(</span><span class="nt">value</span><span class="o">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>– so we have to use that extra custom property, <code>--c</code>, for the initial value.</p>

<p>Then, we'll hook into the <code>:checked</code>-selector again:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">[</span><span class="nt">name</span><span class="o">*=</span><span class="s1">"reaction-"</span><span class="o">]</span><span class="nd">:checked</span> <span class="p">{</span>
  <span class="nl">counter-increment</span><span class="p">:</span> <span class="n">reaction</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And that empty <code>&lt;span&gt;</code> in the markup will now play it's part:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">span</span><span class="nd">::after</span> <span class="p">{</span>
  <span class="nl">content</span><span class="p">:</span> <span class="n">counter</span><span class="p">(</span><span class="n">reaction</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>But why the <strong>empty</strong> <code>&lt;span&gt;</code>? That's because we have to add the counter as pseudo-element content (<code>::before</code> or <code>::after</code>).</p>

<p>Unfortunately, we can't add a pseudo-element to the <code>&lt;input type="checkbox"&gt;</code>, as <code>&lt;input&gt;</code>-tags are part of the group of tags, that can't have children (aka “self-closing” tags) or pseudo-content (actually they <em>can</em> in Chrome and Safari, but it's not part of the spec!).</p>

<p>The rest is just bits of styling. Here's the CSS-only example on Codepen:</p>

<p><iframe height="600" src="https://codepen.io/stoumann/embed/JjNWbbe?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
</p>


<hr>

<h2>
  <a name="javascript" href="#javascript">
  </a>
  JavaScript
</h2>

<p>Even though the CSS-only version is cool, it's not very practical. You'll probably want to <em>store</em> the reaction somewhere!</p>

<p>Let's remove the counter-related stuff from the CSS, and the <code>style="--c"</code>-part from the markup. We'll wrap the reactions in a <code>&lt;form id="react"&gt;</code>, and listen for changes using the <code>onchange</code>-eventListener:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nx">react</span><span class="p">.</span><span class="nf">addEventListener</span><span class="p">(</span><span class="dl">'</span><span class="s1">change</span><span class="dl">'</span><span class="p">,</span> <span class="p">(</span><span class="nx">e</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">t</span> <span class="o">=</span> <span class="nx">e</span><span class="p">.</span><span class="nx">target</span><span class="p">;</span>
  <span class="nx">t</span><span class="p">.</span><span class="nx">parentNode</span><span class="p">.</span><span class="nx">lastElementChild</span><span class="p">.</span><span class="nx">innerText</span> <span class="o">=</span> <span class="nx">t</span><span class="p">.</span><span class="nx">value</span> <span class="o">=</span> <span class="nx">t</span><span class="p">.</span><span class="nx">value</span> <span class="o">-</span> <span class="mi">0</span> <span class="o">+</span> <span class="p">(</span><span class="nx">t</span><span class="p">.</span><span class="nx">checked</span> <span class="p">?</span> <span class="mi">1</span> <span class="p">:</span> <span class="o">-</span><span class="mi">1</span><span class="p">);</span>
<span class="p">});</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>This small snippet will <em>add</em> or <em>subtract</em> <code>1</code>(one) from the <code>value</code> of the current reaction, then set the <code>innerText</code> of the <code>&lt;span&gt;</code> to that.</p>

<p>It's within this snippet, you can add a <code>fetch()</code> (with <code>POST</code>) to store the current reaction.</p>

<p>On dev.to, for instance, a small <code>JSON</code>-object is <code>POST</code>ed:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight json"><code><span class="p">{</span><span class="w">
  </span><span class="err">result:</span><span class="w"> </span><span class="s2">"create"</span><span class="p">,</span><span class="w">
  </span><span class="err">category:</span><span class="w"> </span><span class="s2">"like"</span><span class="w">
</span><span class="p">}</span><span class="w">
</span></code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><em>Example, using JavaScript:</em><br>
<iframe height="600" src="https://codepen.io/stoumann/embed/qBmRLap?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
</p>

<p>If you want to set the text of all the <code>&lt;span&gt;</code>-elements to the <code>value</code> of the <code>&lt;input&gt;</code>s, use this small snippet to iterate the <code>elements</code>-collection of the <code>&lt;form&gt;</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="p">[...</span><span class="nx">react</span><span class="p">.</span><span class="nx">elements</span><span class="p">].</span><span class="nf">forEach</span><span class="p">(</span><span class="nx">t</span> <span class="o">=&gt;</span> <span class="nx">t</span><span class="p">.</span><span class="nx">parentNode</span><span class="p">.</span><span class="nx">lastElementChild</span><span class="p">.</span><span class="nx">innerText</span> <span class="o">=</span> <span class="nx">t</span><span class="p">.</span><span class="nx">value</span><span class="p">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
