			<h1>Performance: Optimizing existing content</h1>
			<p>This post is about <em>optimizing existing content for better performance</em>.<br />
As an example, I&#8217;ll use the Demo UI for LogiFront 2.0, available at <a href="http://demo.logifront.com" target="_blank">demo.logifront.com</a>.</p>
<p><strong>Note:</strong> The demo is <strong>not</strong> a working app, just HTML and CSS for demo-purposes.</p>
<p>The initial size of the index.html-file is <strong>175kb</strong>. This isn&#8217;t so bad, since the file contains the html for all the various dialogs and templates that is used in the complete app &mdash; but we can do better!</p>
<h3>Minifying</h3>
<p>First, I minified the html using <a href="http://www.willpeavy.com/minifier/" target="_blank">HTML Minifier</a>.<br />
This reduced the size to <strong>70kb!</strong></p>
<p>In the regular, un-minified version of index.html, the amount of DOM-nodes is <strong>4254</strong>.</p>
<p>Now, let&#8217;s count*) the amount of DOM-nodes in the minified version:<br />
<strong>2463!</strong><br />
That&#8217;s <strong>1791 </strong>less DOM-nodes to parse.<br />
Why is that?<br />
Because all line-breaks create empty text-nodes, and because HTML Minifier removes comment-tags.</p>
<h3>Gzipping</h3>
<p>Gzip is the web-equivalent of zip, rar or stuffIt. It can either be dynamic (see your web-server documentation) or static/manual.<br />
In this example, since the html for the main app won&#8217;t change that much, let&#8217;s use static/manual gzip, so the server won&#8217;t waste processing time gzipping the file, every time a user request it.</p>
<p>I used <a href="http://www.7-zip.org/" target="_blank">7-Zip</a> to gzip the file (now <strong>index.html.gz</strong>) to <strong>9.8kb</strong>!<br />
That&#8217;s less than 6% of the original file-size.</p>
<h3>Content Headers</h3>
<p>A web-server or Content Delivery Network (CDN) won&#8217;t know that the gzipped file is actually a html-file. I use Amazon S3 CDN;<br />
Here&#8217;s how to &#8220;tell&#8221; S3 what the file is:</p>
<p>1. Rename the file from &#8220;index.html.gz&#8221; to &#8220;index.html&#8221;.<br />
2. Change the Content-Type-header, and add a Content-Encoding-header:</p>
<pre class="brush: jscript; title: ; notranslate" title="">
Content-Type : text/html
Content-Encoding: gzip
</pre>
<p>The &#8220;Content-Type&#8221; tells the browser it&#8217;s an html-file, although it&#8217;s actually a gzip-file.<br />
The &#8220;Content-Encoding&#8221; tells the browser that the file is encoded with gzip.</p>
<p>We can also tell S3 to use Cache-Control by adding this header:</p>
<pre class="brush: jscript; title: ; notranslate" title="">
Cache-Control: max-age=31536000
</pre>
<h3>Other types</h3>
<p>This method can also be used for other file-types: CSS, JavaScript, SVG, Fonts etc., with small modifications:</p>
<h5>CSS</h5>
<pre class="brush: jscript; title: ; notranslate" title="">
Content-Type : text/css
</pre>
<h5>JavaScript</h5>
<pre class="brush: jscript; title: ; notranslate" title="">
Content-Type : application/x-javascript
</pre>
<h5>EOT, TTF &amp; WOFF</h5>
<pre class="brush: jscript; title: ; notranslate" title="">
Content-Type : application/octet-stream
</pre>
<h5>SVG</h5>
<pre class="brush: jscript; title: ; notranslate" title="">
Content-Type : image/svg+xml
</pre>
<p>Is you&#8217;re using a CSS-pre-processor like SASS or LESS, set it to output the CSS as <em>Compressed</em>.<br />
Otherwise, use a dedicated minifier like <a href="http://cssminifier.com/" target="_blank">cssminifier.com</a>.</p>
<p>For JavaScript, I use <a href="http://closure-compiler.appspot.com/" target="_blank">Google Closure (Advanced)</a> &mdash; but most pre-processors have a minifier-option for JavaScript as well.</p>
<h3>Result</h3>
<p>So, without changing a single line of code, we ended up with this:<br />
1. HTML went from 175kb to 9.8kb.<br />
2. CSS-files went from 67kb (combined) to 14.7kb (combined).<br />
3. Font-files went from 105kb (combined) to 40kb (combined).</p>
<p>The total amount of kilobytes went from <strong>347kb</strong> to <strong>64.5kb</strong> = <strong>18.62%</strong> of the original size, more than <strong>5 times faster</strong> to download &mdash; and with <strong>1791</strong> fewer nodes to parse.</p>
<h3>Who should do this?</h3>
<p>So &mdash; who should complete these performance-tasks? It doesn&#8217;t have to be a front- or backend-developer, since these changes don&#8217;t require any programming skills. Maybe, as Ilya Grigorik suggests in his new book, <a href="http://shop.oreilly.com/product/0636920028048.do" target="_blank">High Performance Browser Networking</a>, it&#8217;s time to add a new member to the web-team:<br />
<em>The performance engineer</em>.</p>
<p>A performance engineer could/should:</p>
<ol>
<li>Work closely with both front- and backend-developers, analyzing load-times, reviewing load-waterfalls, reviewing a site with both ySlow and Page Speed.</li>
<li>Optimize the web-server: remove unnecessary headers, setting up cache-control, content-headers, gzip etc.</li>
<li>Optimize network-performance &mdash; start by reading <a href="http://shop.oreilly.com/product/0636920028048.do" target="_blank">High Performance Browser Networking</a>.</li>
</ol>
<p><strong>*) </strong>I used a snippet for counting the DOM-nodes.<br />
If you haven&#8217;t used snippets before, read <a href="http://www.briangrinstead.com/blog/devtools-snippets" target="_blank">this article</a>.</p>
<pre class="brush: jscript; title: ; notranslate" title="">
Node.prototype.countChildNodes = function() {
  return this.hasChildNodes()
    ? Array.prototype.slice.apply(this.childNodes).map(function(el) {
        return 1 + el.countChildNodes();
      }).reduce(function(previousValue, currentValue, index, array){
        return previousValue + currentValue;
      })
    : 0;
};
document.countChildNodes();
</pre>
<p>Run the snippet with CTRL+ENTER.</p>
