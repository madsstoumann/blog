		<article>
			<h1>Digital Clocks in CSS</h1>
			<p>In my previous post, I looked into <a href="https://dev.to/madsstoumann/clocks-and-watches-in-css-36mm">clocks and watches</a>, mimicking classic, analog watches. Now, how about <em>digital</em> watches in CSS? The JavaScript initialization is identical, but that’s where the similarities stop.</p>

<p>Let’s look into how we can animate numbers, automatically switch between “am” and “pm” for 12-hour clocks — and much, much more, using only CSS!</p>

<h2>
  <a name="initial" href="#initial">
  </a>
  Initial
</h2>

<p>First, we’ll create a web component to keep all logic wrapped up in a single instance. Feel free to simplify it later!<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;digital-clock</span> <span class="na">timezone=</span><span class="s">"+1"</span><span class="nt">&gt;&lt;/digital-clock&gt;</span>
</code></pre>

<p>In the web component, we’ll later add logic <em>not</em> to render specific elements.</p>

<p>For now, let’s focus on the CSS. First, we set 3 custom properties, set with <code>@property</code>, allowing us to animate them:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="k">@property</span> <span class="n">--seconds</span> <span class="p">{</span>
  <span class="py">syntax</span><span class="p">:</span> <span class="s1">"&lt;integer&gt;"</span><span class="p">;</span>
  <span class="py">initial-value</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="py">inherits</span><span class="p">:</span> <span class="n">false</span><span class="p">;</span>
<span class="p">}</span>
<span class="k">@property</span> <span class="n">--minutes</span> <span class="p">{</span>
  <span class="py">syntax</span><span class="p">:</span> <span class="s1">"&lt;integer&gt;"</span><span class="p">;</span>
  <span class="py">initial-value</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="py">inherits</span><span class="p">:</span> <span class="n">false</span><span class="p">;</span>
<span class="p">}</span>
<span class="k">@property</span> <span class="n">--hours</span> <span class="p">{</span>
  <span class="py">syntax</span><span class="p">:</span> <span class="s1">"&lt;integer&gt;"</span><span class="p">;</span>
  <span class="py">initial-value</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="py">inherits</span><span class="p">:</span> <span class="n">false</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>

<p>Next, we calculate — in JavaScript, from the current time and timezone — animation delays for these:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="err">#</span><span class="nf">updateClock</span><span class="p">()</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">time</span> <span class="o">=</span> <span class="k">new</span> <span class="nc">Date</span><span class="p">();</span>
  <span class="kd">const</span> <span class="nx">tzOffset</span> <span class="o">=</span> <span class="k">this</span><span class="p">.</span><span class="err">#</span><span class="nf">roundTzOffset</span><span class="p">(</span><span class="k">this</span><span class="p">.</span><span class="nf">getAttribute</span><span class="p">(</span><span class="dl">'</span><span class="s1">timezone</span><span class="dl">'</span><span class="p">)</span> <span class="o">||</span> <span class="dl">'</span><span class="s1">0</span><span class="dl">'</span><span class="p">);</span>
  <span class="kd">const</span> <span class="nx">utc</span> <span class="o">=</span> <span class="nx">time</span><span class="p">.</span><span class="nf">getTime</span><span class="p">()</span> <span class="o">+</span> <span class="p">(</span><span class="nx">time</span><span class="p">.</span><span class="nf">getTimezoneOffset</span><span class="p">()</span> <span class="o">*</span> <span class="mi">60000</span><span class="p">);</span>
  <span class="kd">const</span> <span class="nx">tzTime</span> <span class="o">=</span> <span class="k">new</span> <span class="nc">Date</span><span class="p">(</span><span class="nx">utc</span> <span class="o">+</span> <span class="p">(</span><span class="mi">3600000</span> <span class="o">*</span> <span class="nx">tzOffset</span><span class="p">));</span>

  <span class="kd">const</span> <span class="nx">hours</span> <span class="o">=</span> <span class="nx">tzTime</span><span class="p">.</span><span class="nf">getHours</span><span class="p">()</span> <span class="o">*</span> <span class="mi">3600</span><span class="p">;</span>
  <span class="kd">const</span> <span class="nx">minutes</span> <span class="o">=</span> <span class="nx">tzTime</span><span class="p">.</span><span class="nf">getMinutes</span><span class="p">()</span> <span class="o">*</span> <span class="mi">60</span><span class="p">;</span>
  <span class="kd">const</span> <span class="nx">seconds</span> <span class="o">=</span> <span class="nx">tzTime</span><span class="p">.</span><span class="nf">getSeconds</span><span class="p">();</span>

  <span class="k">this</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nf">setProperty</span><span class="p">(</span><span class="dl">'</span><span class="s1">--delay-hours</span><span class="dl">'</span><span class="p">,</span> <span class="s2">`-</span><span class="p">${</span><span class="nx">hours</span> <span class="o">+</span> <span class="nx">minutes</span> <span class="o">+</span> <span class="nx">seconds</span><span class="p">}</span><span class="s2">s`</span><span class="p">);</span>
  <span class="k">this</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nf">setProperty</span><span class="p">(</span><span class="dl">'</span><span class="s1">--delay-minutes</span><span class="dl">'</span><span class="p">,</span> <span class="s2">`-</span><span class="p">${</span><span class="nx">minutes</span> <span class="o">+</span> <span class="nx">seconds</span><span class="p">}</span><span class="s2">s`</span><span class="p">);</span>
  <span class="k">this</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nf">setProperty</span><span class="p">(</span><span class="dl">'</span><span class="s1">--delay-seconds</span><span class="dl">'</span><span class="p">,</span> <span class="s2">`-</span><span class="p">${</span><span class="nx">seconds</span><span class="p">}</span><span class="s2">s`</span><span class="p">);</span>
  <span class="k">this</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nf">setProperty</span><span class="p">(</span><span class="dl">'</span><span class="s1">--number-system</span><span class="dl">'</span><span class="p">,</span> <span class="k">this</span><span class="p">.</span><span class="nf">getAttribute</span><span class="p">(</span><span class="dl">'</span><span class="s1">number-system</span><span class="dl">'</span><span class="p">)</span> <span class="o">||</span> <span class="dl">'</span><span class="s1">decimal-leading-zero</span><span class="dl">'</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>

<p>The animations are simple enough — we go from 0 to 24 hours, and 0 to 60 minutes (and seconds):<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="k">@keyframes</span> <span class="n">hours</span> <span class="p">{</span>
  <span class="nt">from</span> <span class="p">{</span> <span class="py">--hours</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span> <span class="p">}</span>
  <span class="nt">to</span> <span class="p">{</span> <span class="py">--hours</span><span class="p">:</span> <span class="m">24</span><span class="p">;</span> <span class="p">}</span> 
<span class="p">}</span>
<span class="k">@keyframes</span> <span class="n">minutes</span> <span class="p">{</span> 
  <span class="nt">from</span> <span class="p">{</span> <span class="py">--minutes</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span> <span class="p">}</span>
  <span class="nt">to</span> <span class="p">{</span> <span class="py">--minutes</span><span class="p">:</span> <span class="m">60</span><span class="p">;</span> <span class="p">}</span> 
<span class="p">}</span>
<span class="k">@keyframes</span> <span class="n">seconds</span> <span class="p">{</span> 
  <span class="nt">from</span> <span class="p">{</span> <span class="py">--seconds</span><span class="p">:</span> <span class="m">0</span><span class="p">;}</span>
  <span class="nt">to</span> <span class="p">{</span> <span class="py">--seconds</span><span class="p">:</span> <span class="m">60</span><span class="p">;</span> <span class="p">}</span>
<span class="p">}</span>
</code></pre>

<h2>
  <a name="animating-numbers" href="#animating-numbers">
  </a>
  Animating numbers
</h2>

<p>And now for the tricky part! To animate numbers we’re going to use CSS <strong>counters.</strong> For <code>hours</code>, <code>minutes</code> and <code>seconds</code> we create a custom counter, and then <em>re-set</em> them with the values we get from the keyframe animations.</p>

<p>For seconds, that’s:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:host::part</span><span class="o">(</span><span class="nt">seconds</span><span class="o">)</span> <span class="p">{</span>
  <span class="nl">animation</span><span class="p">:</span> <span class="n">seconds</span> <span class="m">60s</span> <span class="n">steps</span><span class="p">(</span><span class="m">60</span><span class="p">,</span> <span class="n">end</span><span class="p">)</span> <span class="n">infinite</span><span class="p">;</span>
  <span class="nl">animation-delay</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--delay-seconds</span><span class="p">,</span> <span class="m">0s</span><span class="p">);</span>
  <span class="nl">counter-reset</span><span class="p">:</span> <span class="n">seconds</span> <span class="n">var</span><span class="p">(</span><span class="n">--seconds</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>So what’s going on here? Let’s break it down:</p>

<ol>
<li>The keyframe animation increments the <code>--seconds</code> custom property from 0 to 60 over exactly 60 seconds</li>
<li>The <code>steps(60, end)</code> timing function creates 60 discrete jumps (one per second) rather than a smooth transition</li>
<li>Each time <code>--seconds</code> changes, the <code>counter-reset</code> property immediately updates the CSS counter named "seconds"</li>
<li>The counter is displayed using a pseudo-element:
</li>
</ol>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:host::part</span><span class="o">(</span><span class="nt">seconds</span><span class="o">)</span><span class="nd">::after</span> <span class="p">{</span>
  <span class="nl">content</span><span class="p">:</span> <span class="n">counter</span><span class="p">(</span><span class="n">seconds</span><span class="p">,</span> <span class="n">var</span><span class="p">(</span><span class="n">--number-system</span><span class="p">,</span> <span class="nb">decimal-leading-zero</span><span class="p">))</span> <span class="s2">' '</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The <code>animation-delay</code> with a negative value (calculated in JavaScript) synchronizes the animation with the current time, so when the animation shows “42”, it matches the actual 42nd second of the current minute.</p>

<p>This approach ensures the clock runs entirely through the browser’s animation engine with no further JavaScript needed. This eliminates timing drift that can occur with <code>setInterval()</code> or <code>setTimeout()</code> and requires no ongoing DOM manipulation.</p>

<p>The same principle applies to minutes and hours, each with appropriate durations and step counts. For hours, the animation runs for 24 hours (86,400 seconds) with 24 steps; for minutes, it’s 60 minutes (3,600 seconds) with 60 steps.</p>

<p>The <code>counter()</code> method’s second parameter defines the <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/list-style-type" target="_blank" rel="noopener noreferrer">list-style-type</a> or “number system” used to display the values. We default to <code>decimal-leading-zero</code>, but this can be customized through the <code>number-system</code> <br>
attribute.</p>
<h2>
  <a name="12hour-clocks-am-and-pm" href="#12hour-clocks-am-and-pm">
  </a>
  12-hour clocks: am and pm
</h2>

<p>To display time in 12-hour-format, we can use a few CSS tricks! To tell the clock we want 12-hour-format, we add the string “12hour” to the <code>time</code>-attribute of the web component. </p>

<p>Next, we use the existing <code>hours</code> counter for the <code>counter-reset</code>, as we only want to update this when the hour change.</p>

<p>To convert 24-hour time to 12-hour format, we use modulus. Modern CSS makes this easy with the <code>mod()</code> function:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:host</span><span class="o">([</span><span class="nt">time</span><span class="o">*=</span><span class="s1">"12hour"</span><span class="o">])</span><span class="nd">::part</span><span class="o">(</span><span class="nt">hours</span><span class="o">)</span> <span class="p">{</span>
  <span class="nl">counter-reset</span><span class="p">:</span> <span class="n">hours</span> <span class="n">calc</span><span class="p">(</span><span class="n">mod</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--hours</span><span class="p">)</span> <span class="n">-</span> <span class="m">1</span><span class="p">,</span> <span class="m">12</span><span class="p">)</span> <span class="err">+</span> <span class="m">1</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<ol>
<li>We subtract 1 from the hour (shifting 1-24 to 0-23)</li>
<li>Apply modulo 12 (giving us 0-11)</li>
<li>Add 1 back (giving us 1-12)</li>
</ol>

<p>This ensures that 0 becomes 12, 13 becomes 1, 23 becomes 11, etc.</p>

<p>To show ”am” or ”pm” after the time, we create a custom counter:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="k">@counter-style</span> <span class="n">am-pm</span> <span class="p">{</span>
  <span class="py">system</span><span class="p">:</span> <span class="n">cyclic</span><span class="p">;</span>
  <span class="py">symbols</span><span class="p">:</span> <span class="s1">"am"</span> <span class="s1">"am"</span> <span class="s1">"am"</span> <span class="s1">"am"</span> <span class="s1">"am"</span> <span class="s1">"am"</span> <span class="s1">"am"</span> <span class="s1">"am"</span> <span class="s1">"am"</span> <span class="s1">"am"</span> <span class="s1">"am"</span> <span class="s1">"pm"</span> 
           <span class="s1">"pm"</span> <span class="s1">"pm"</span> <span class="s1">"pm"</span> <span class="s1">"pm"</span> <span class="s1">"pm"</span> <span class="s1">"pm"</span> <span class="s1">"pm"</span> <span class="s1">"pm"</span> <span class="s1">"pm"</span> <span class="s1">"pm"</span> <span class="s1">"pm"</span> <span class="s1">"am"</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The <code>cyclic</code> system cycles through these values as hours increment, ensuring the correct am/pm indicator is shown for each hour of the day. Note that the 12th string is <code>pm</code> and 24th is <code>am</code>, so 12 (noon) becomes <code>12pm</code> and 12 (midnight) becomes <code>12am</code>.</p>

<p>To show it:<br>

  <span class="nl">content</span><span class="p">:</span> <span class="n">counter</span><span class="p">(</span><span class="n">hours</span><span class="p">,</span> <span class="n">am-pm</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>

<p>The DigitalClock component offers several attributes for customization:</p>

<h3>
  <a name="available-attributes" href="#available-attributes">
  </a>
  Available Attributes
</h3>

<ol>
<li>
<strong>timezone</strong>: Sets the timezone offset (e.g., "+1", "-4")</li>
<li>
<strong>label</strong>: Adds a text label before the clock (e.g., "Berlin,")</li>
<li>
<strong>date</strong>: Shows the date in different formats: "full", "short", or "narrow"</li>
<li>
<strong>lang</strong>: Sets the language for date formatting (e.g., "en-US", "ja-JP")</li>
<li>
<strong>time</strong>: Configures time display format, options include "12hour" and "short" (no seconds)</li>
<li>
<strong>number-system</strong>: Changes number display format (e.g., "decimal-leading-zero", "arabic-indic", "hiragana")</li>
</ol>

<h3>
  <a name="styling" href="#styling">

  Styling
</h3>

<p>The component exposes several CSS custom properties for styling — I might add more later (let me know if you need more control):</p>

<ul>
<li>
<code>--digital-clock-bg</code>: Background color</li>
<li>
<code>--digital-clock-bdrs</code>: Border radius</li>
<li>
<code>--digital-clock-gap</code>: Gap between elements</li>
<li>
<code>--digital-clock-p</code>: Padding</li>
<li>
<code>--digital-clock-fs</code>: Font size</li>
<li>
<code>--digital-clock-fw</code>: Font weight</li>
<li>
<code>--digital-clock-date-ff/fs/fw</code>: Font properties for the date</li>
<li>
<code>--digital-clock-label-ff/fs/fw</code>: Font properties for the label</li>
</ul>

<p>All the parts (pun intended) of the clock have <code>::part</code>s, so you can easily style the shadow parts from outside:<br>

  <span class="nl">color</span><span class="p">:</span> <span class="m">#ff1a1a</span><span class="p">;</span>
  <span class="nl">font-family</span><span class="p">:</span> <span class="n">ui-sans-serif</span><span class="p">,</span> <span class="n">system-ui</span><span class="p">;</span>
  <span class="nl">width</span><span class="p">:</span> <span class="m">300px</span><span class="p">;</span>
  <span class="err">&amp;::part(time)</span> <span class="err">{</span> 
    <span class="nl">text-shadow</span><span class="p">:</span> <span class="m">0</span> <span class="m">0</span> <span class="m">5px</span> <span class="n">rgba</span><span class="p">(</span><span class="m">255</span><span class="p">,</span> <span class="m">26</span><span class="p">,</span> <span class="m">26</span><span class="p">,</span> <span class="m">0.7</span><span class="p">);</span>
  <span class="p">}</span>
<span class="err">}</span>
</code></pre>
