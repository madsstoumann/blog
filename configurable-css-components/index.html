		<article>
			<h1>Configurable CSS Components</h1>
			<p>The CSS <code>attr()</code> function is <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/attr()" target="_blank" rel="noopener noreferrer">getting updated</a> to support <strong>any</strong> property. </p>

<p>This enables the creation of configurable CSS components, which allow content creators to specify properties directly,  using custom tags and attributes. </p>

<p>This article showcases three examples: a gradient text, an underline, and a fade-out component. While the new <code>attr()</code> syntax is not yet supported in browsers, custom properties can be used as a fallback.</p>


<hr>

<p>With the current implementation, the <code>attr()</code>-function can set the <code>content</code>-attribute of a pseudo-element (<code>::before</code> or <code>::after</code>) from a HTML-attribute.</p>

<p>After the update, <code>attr()</code> works with all properties, not just <code>content</code>.</p>

<p>It will also support types and fallbacks, so you can define a property as, let's say, a <em>color</em>, and specify the fallback-color, if the property is empty:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">color</span><span class="o">:</span> <span class="nt">attr</span><span class="o">(</span><span class="nt">data-cl</span> <span class="nt">color</span><span class="o">,</span> <span class="nf">#DC143C</span><span class="o">);</span>
</code></pre>

</svg>

    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>

<hr>

<h2>
  <a name="what-does-that-mean" href="#what-does-that-mean">
  </a>
  What does that mean?
</h2>

<p>While this may not seem like a groundbreaking change, it <strong>is</strong> (at least for for me!)</p>

<p>Imagine a headline like this:</p>

<p><a href="assets/1460043/a35ed1b6.jpg" class="article-body-image-wrapper"><img src="assets/1460043/a35ed1b6.jpg" alt="Headline" loading="lazy" width="800" height="417"></a></p>

<p>It consists of a <em>gradient text</em>, a custom <em>underline</em> and a <em>fadeout</em>.</p>

<p>To allow a content-creator to specify the gradient-text colors, the height or color of the underline — or the angle of the fade-out, would require <strong>loads</strong> of modifier-classes and extra CSS to maintain.</p>

<p>But with the ability to set a property <strong>directly</strong> (with failsafe types) using <code>attr()</code>, we can create <strong>configurable CSS components</strong>.</p>

<p>Let's create a bunch — starting with <code>&lt;gradient-text&gt;</code>:</p>


<hr>

<h2>
  <a name="gradient-text" href="#gradient-text">
  </a>
  Gradient Text
</h2>

<p>First, we create a <em>custom tag</em>, <code>&lt;gradient-text&gt;</code> with two attributes, <code>from</code> and <code>to</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;gradient-text</span> <span class="na">from=</span><span class="s">"#06d"</span> <span class="na">to=</span><span class="s">"#0fd"</span><span class="nt">&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>For the CSS, it's simply:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">gradient-text</span> <span class="p">{</span>
  <span class="nl">background</span><span class="p">:</span> <span class="n">linear-gradient</span><span class="p">(</span>
    <span class="n">attr</span><span class="p">(</span><span class="n">angle</span> <span class="n">angle</span><span class="p">,</span> <span class="m">135deg</span><span class="p">),</span> 
    <span class="n">attr</span><span class="p">(</span><span class="n">from</span> <span class="n">color</span><span class="p">,</span> <span class="m">#8E6BC8</span><span class="p">),</span> 
    <span class="n">attr</span><span class="p">(</span><span class="n">to</span> <span class="n">color</span><span class="p">,</span> <span class="m">#00E9EE</span><span class="p">)</span>
  <span class="p">);</span>
  <span class="nl">background-clip</span><span class="p">:</span> <span class="nb">text</span><span class="p">;</span>
  <span class="nl">-webkit-background-clip</span><span class="p">:</span> <span class="nb">text</span><span class="p">;</span>
  <span class="nl">box-decoration-break</span><span class="p">:</span> <span class="n">clone</span><span class="p">;</span>
  <span class="nl">-webkit-box-decoration-break</span><span class="p">:</span> <span class="n">clone</span><span class="p">;</span>
  <span class="nl">color</span><span class="p">:</span> <span class="nb">transparent</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>You can use the custom tag today, but it <strong>won't work</strong> with the new <code>attr()</code>, as it's not supported in <strong>any</strong> browsers yet.</p>

<p>We need a fallback, using <code>@supports</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">gradient-text</span> <span class="p">{</span>
<span class="err">@supports(</span> <span class="nl">color</span><span class="p">:</span> <span class="n">attr</span><span class="p">(</span><span class="n">data-c</span> <span class="n">color</span><span class="p">,</span> <span class="no">red</span><span class="p">))</span> <span class="err">{</span>
  <span class="n">--angle</span><span class="p">:</span> <span class="n">attr</span><span class="p">(</span><span class="n">angle</span> <span class="n">angle</span><span class="p">,</span> <span class="m">135deg</span><span class="p">);</span>
  <span class="py">--from</span><span class="p">:</span> <span class="n">attr</span><span class="p">(</span><span class="n">from</span> <span class="n">color</span><span class="p">,</span> <span class="m">#8E6BC8</span><span class="p">);</span>
  <span class="py">--to</span><span class="p">:</span> <span class="n">attr</span><span class="p">(</span><span class="n">to</span> <span class="n">color</span><span class="p">,</span> <span class="m">#00E9EE</span><span class="p">);</span>
<span class="p">}</span>
  <span class="nt">background</span><span class="o">:</span> <span class="nt">linear-gradient</span><span class="o">(</span>
    <span class="nt">var</span><span class="o">(</span><span class="nt">--angle</span><span class="o">,</span> <span class="err">135</span><span class="nt">deg</span><span class="o">),</span>
    <span class="nt">var</span><span class="o">(</span><span class="nt">--from</span><span class="o">,</span> <span class="err">#8</span><span class="nt">E6BC8</span><span class="o">),</span>
    <span class="nt">var</span><span class="o">(</span><span class="nt">--to</span><span class="o">,</span> <span class="err">#00</span><span class="nt">E9EE</span><span class="o">)</span>
  <span class="o">);</span>
  <span class="c">/* ... */</span>
<span class="err">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>First, we check whether the new <code>attr()</code>-syntax is supported. If it <em>is</em>, we're setting a bunch of <em>custom properties</em> to the attribute-values. Then, <em>outside</em> the fallback, we'll use these properties for the gradient. </p>

<p><em>Examples:</em><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;gradient-text</span> <span class="na">from=</span><span class="s">"#06d"</span> <span class="na">to=</span><span class="s">"#0fd"</span><span class="nt">&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><a href="assets/1460043/3a24a9a6.jpg" class="article-body-image-wrapper"><img src="assets/1460043/3a24a9a6.jpg" alt="Custom tag gradient-text" loading="lazy" width="800" height="159"></a></p>

<p>— and with the optional <code>angle</code>-attribute:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;gradient-text</span> <span class="na">from=</span><span class="s">"#06d"</span> <span class="na">to=</span><span class="s">"#0fd"</span> <span class="na">angle=</span><span class="s">"190deg"</span><span class="nt">&gt;</span>

<p><a href="assets/1460043/0e1218bc.jpg" class="article-body-image-wrapper"><img src="assets/1460043/0e1218bc.jpg" alt="gradient-text with angle" loading="lazy" width="800" height="169"></a></p>

<h2>
  <a name="underline" href="#underline">
  </a>
  Underline
</h2>

<p>The <code>&lt;under-line&gt;</code>-component is almost identical to the <code>&lt;gradient-text&gt;</code>-component. It has a <code>from</code> and a <code>to</code>-attribute, but if you don't specify <code>to</code>, it's set to <code>from</code>. Instead of <code>angle</code>, it has a <code>height</code>-attribute.</p>

<p><em>Examples:</em><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;under-line</span> <span class="na">from=</span><span class="s">"#27D2C6"</span> <span class="na">to=</span><span class="s">"#9FFFF9"</span><span class="nt">&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>— and —<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;under-line</span> <span class="na">from=</span><span class="s">"#fcd4ff"</span> <span class="na">height=</span><span class="s">"10%"</span><span class="nt">&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>

</svg>

</div>
</div>
</div>



<p>Which gets us:</p>

<p><a href="assets/1460043/dfbf6711.jpg" class="article-body-image-wrapper"><img src="assets/1460043/dfbf6711.jpg" alt="Underline" loading="lazy" width="740" height="320"></a></p>

<p>The CSS follows the same structure as before, with a <code>@supports</code>-fallback first:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">under-line</span> <span class="p">{</span>
<span class="err">@supports(</span> <span class="nl">color</span><span class="p">:</span> <span class="n">attr</span><span class="p">(</span><span class="n">data-c</span> <span class="n">color</span><span class="p">,</span> <span class="no">red</span><span class="p">))</span> <span class="err">{</span>
  <span class="n">--from</span><span class="p">:</span> <span class="n">attr</span><span class="p">(</span><span class="n">from</span> <span class="n">color</span><span class="p">,</span> <span class="m">#FCD4FF</span><span class="p">);</span>
  <span class="py">--to</span><span class="p">:</span> <span class="n">attr</span><span class="p">(</span><span class="n">to</span> <span class="n">color</span><span class="p">,</span> <span class="m">#FCD4FF</span><span class="p">);</span>
  <span class="py">--height</span><span class="p">:</span> <span class="n">attr</span><span class="p">(</span><span class="n">height</span> <span class="n">length</span><span class="p">,</span> <span class="m">25%</span><span class="p">);</span>
<span class="p">}</span>
  <span class="nt">background-image</span><span class="o">:</span> <span class="nt">linear-gradient</span><span class="o">(</span>
    <span class="err">90</span><span class="nt">deg</span><span class="o">,</span>
    <span class="nt">var</span><span class="o">(</span><span class="nt">--from</span><span class="o">,</span> <span class="nf">#FCD4FF</span><span class="o">),</span> 
    <span class="nt">var</span><span class="o">(</span><span class="nt">--to</span><span class="o">,</span> <span class="nt">var</span><span class="o">(</span><span class="nt">--from</span><span class="o">,</span> <span class="nf">#FCD4FF</span><span class="o">))</span>
  <span class="o">);</span>
  <span class="nt">background-position</span><span class="o">:</span> <span class="nt">left</span> <span class="nt">bottom</span><span class="o">;</span>
  <span class="nt">background-repeat</span><span class="o">:</span> <span class="nt">no-repeat</span><span class="o">;</span>
  <span class="nt">background-size</span><span class="o">:</span> <span class="err">100</span><span class="o">%</span> <span class="nt">var</span><span class="o">(</span><span class="nt">--height</span><span class="o">,</span> <span class="err">25</span><span class="o">%);</span>
<span class="err">}</span>
</code></pre>

<h1>
  <a name="fadeout" href="#fadeout">
  </a>
  Fadeout
</h1>

<p>Like the previous components, the <code>&lt;fade-out&gt;</code>-component have a <code>from</code> and a <code>to</code>-attribute.<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">fade-out</span> <span class="p">{</span>

<span class="p">}</span>
  <span class="nt">--mask</span><span class="o">:</span> <span class="nt">linear-gradient</span><span class="o">(</span>

<h2>
  <a name="conclusion" href="#conclusion">
  </a>
  Conclusion
</h2>

<p>In conclusion, the introduction of the updated <code>attr()</code>-function in CSS, opens up new possibilities for creating configurable CSS components. </p>

<p>As we've seen in the examples, content creators can easily specify properties such as colors, heights, and angles without the need for extra CSS or modifier classes. </p>

<p>Although the new <code>attr()</code> syntax is not yet supported in <strong>any</strong> browsers, we can use custom tags with fallbacks using the <code>@supports</code> rule to achieve similar effects. </p>

<p>If you want to use the custom tags from the examples today, you need to update the custom properties (<code>--to</code>, <code>--from</code> etc.) instead of using attributes.</p>

<p>You can do this with modifier-classes, or  write a small JavaScript-snippet, that'll set the custom properties from the attributes, so:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;gradient-text</span> <span class="na">from=</span><span class="s">"#06d"</span> <span class="na">to=</span><span class="s">"#0fd"</span><span class="nt">&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

</svg>
