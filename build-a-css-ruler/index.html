		<article>
			<h1>Build a CSS Ruler</h1>
			<p>I'm currently working on a project, where an editor can easily edit breakpoints, using a group of color-coded, stacked <code>&lt;input type="range"&gt;</code>-controls, and a bit of JavaScript:</p>

<p><a href="assets/842066/f50dbcc2.jpg" class="article-body-image-wrapper"><img src="assets/842066/f50dbcc2.jpg" alt="noruler" loading="lazy" width="800" height="45"></a></p>

<p>While this works, it's easier to visualize the breakpoints, if combined with a ruler:</p>

<p><a href="assets/842066/67e389a5.jpg" class="article-body-image-wrapper"><img src="assets/842066/67e389a5.jpg" alt="breakpoints" loading="lazy" width="800" height="43"></a></p>

<p>At first, I hardcoded a ruler, using pixels — but then I thought: “What if the editor wants to define the breakpoints in <code>em</code> or <code>ch</code> — or some other unit?”</p>


<hr>

<p>Let's look into how we can create a configurable ruler, using CSS <code>backround-image</code>, a bunch of variables — and only a tiny bit of JavaScript for a visual editor.</p>

<p>Our ruler will have two sets of “ticks” — low and tall (we'll look into the numbers later):</p>

<p><a href="assets/842066/26626bd2.jpg" class="article-body-image-wrapper"><img src="assets/842066/26626bd2.jpg" alt="ruler-num" loading="lazy" width="472" height="50"></a> </p>

<p>Both sets of ticks have some initial <em>Custom Properties:</em><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.ruler</span> <span class="p">{</span>
  <span class="c">/* Low ticks */</span>
  <span class="py">--ruler1-bdw</span><span class="p">:</span> <span class="m">1px</span><span class="p">;</span>
  <span class="py">--ruler1-c</span><span class="p">:</span>  <span class="m">#BBB</span><span class="p">;</span>
  <span class="py">--ruler1-h</span><span class="p">:</span> <span class="m">8px</span><span class="p">;</span>
  <span class="py">--ruler1-space</span><span class="p">:</span> <span class="m">5</span><span class="p">;</span>

  <span class="c">/* Tall ticks */</span>
  <span class="py">--ruler2-bdw</span><span class="p">:</span> <span class="m">1px</span><span class="p">;</span>
  <span class="py">--ruler2-c</span><span class="p">:</span>  <span class="m">#BBB</span><span class="p">;</span>
  <span class="py">--ruler2-h</span><span class="p">:</span> <span class="m">20px</span><span class="p">;</span>
  <span class="py">--ruler2-space</span><span class="p">:</span> <span class="m">50</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>With these properties, we can create a dynamic <code>background-image</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.ruler</span> <span class="p">{</span>
  <span class="nl">background-image</span><span class="p">:</span>
    <span class="n">linear-gradient</span><span class="p">(</span><span class="m">90deg</span><span class="p">,</span> <span class="n">var</span><span class="p">(</span><span class="n">--ruler1-c</span><span class="p">)</span> <span class="m">0</span> <span class="n">var</span><span class="p">(</span><span class="n">--ruler1-bdw</span><span class="p">),</span> <span class="nb">transparent</span> <span class="m">0</span><span class="p">),</span>
    <span class="n">linear-gradient</span><span class="p">(</span><span class="m">90deg</span><span class="p">,</span> <span class="n">var</span><span class="p">(</span><span class="n">--ruler2-c</span><span class="p">)</span> <span class="m">0</span> <span class="n">var</span><span class="p">(</span><span class="n">--ruler2-bdw</span><span class="p">),</span> <span class="nb">transparent</span> <span class="m">0</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>However, without <code>background-repeat</code> and <code>background-size</code>, we're not seeing anything that resembles a ruler!<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.ruler</span> <span class="p">{</span>
  <span class="nl">background-repeat</span><span class="p">:</span> <span class="nb">repeat-x</span><span class="p">;</span>
  <span class="nl">background-size</span><span class="p">:</span>
    <span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--ruler-unit</span><span class="p">)</span> <span class="err">*</span> <span class="n">var</span><span class="p">(</span><span class="n">--ruler1-space</span><span class="p">))</span> <span class="n">var</span><span class="p">(</span><span class="n">--ruler1-h</span><span class="p">),</span>
    <span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--ruler-unit</span><span class="p">)</span> <span class="err">*</span> <span class="n">var</span><span class="p">(</span><span class="n">--ruler2-space</span><span class="p">))</span> <span class="n">var</span><span class="p">(</span><span class="n">--ruler2-h</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And that's almost it! We just need to add <code>background-attachment: fixed</code>, so the ruler will stay in place, when we're scrolling!</p>


<hr>

<h2>
  <a name="adding-numbers" href="#adding-numbers">
  </a>
  Adding numbers:
</h2>

<p>For the numbers, we'll create a list:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;ul</span> <span class="na">class=</span><span class="s">"ruler-x"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;li&gt;&lt;/li&gt;&lt;li&gt;&lt;/li&gt;</span> <span class="c">&lt;!-- repeat --&gt;</span>
<span class="nt">&lt;/ul&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Each blank <code>&lt;li&gt;&lt;/li&gt;</code> will be a number in our ruler. The number will be aligned to the bottom of the <em>tall</em> “ticks”:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.ruler-x</span> <span class="p">{</span>
  <span class="nl">color</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--ruler-num-c</span><span class="p">);</span>
  <span class="nl">counter-reset</span><span class="p">:</span> <span class="n">d</span> <span class="m">0</span><span class="p">;</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">flex</span><span class="p">;</span>
  <span class="nl">font-size</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--ruler-num-fz</span><span class="p">);</span>
  <span class="nl">height</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--ruler2-h</span><span class="p">);</span>
  <span class="py">inset-block-start</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="py">inset-inline-start</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--ruler-unit</span><span class="p">)</span> <span class="err">*</span> <span class="n">var</span><span class="p">(</span><span class="n">--ruler2-space</span><span class="p">));</span>
  <span class="nl">line-height</span><span class="p">:</span> <span class="m">1</span><span class="p">;</span>
  <span class="nl">list-style</span><span class="p">:</span> <span class="nb">none</span><span class="p">;</span>
  <span class="nl">margin</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="nl">opacity</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--ruler-x</span><span class="p">);</span>
  <span class="nl">overflow</span><span class="p">:</span> <span class="nb">hidden</span><span class="p">;</span>
  <span class="nl">padding</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="nl">position</span><span class="p">:</span> <span class="nb">fixed</span><span class="p">;</span>
  <span class="nl">width</span><span class="p">:</span> <span class="m">100%</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>We'll use a CSS <code>counter</code> to fill out the numbers, based on the <code>--ruler2-space</code>-property:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.ruler-x</span> <span class="nt">li</span> <span class="p">{</span>
  <span class="nl">align-self</span><span class="p">:</span> <span class="n">flex-end</span><span class="p">;</span>
  <span class="nl">counter-increment</span><span class="p">:</span> <span class="n">d</span> <span class="n">var</span><span class="p">(</span><span class="n">--ruler2-space</span><span class="p">);</span>
  <span class="nl">flex</span><span class="p">:</span> <span class="m">0</span> <span class="m">0</span> <span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--ruler-unit</span><span class="p">)</span> <span class="err">*</span> <span class="n">var</span><span class="p">(</span><span class="n">--ruler2-space</span><span class="p">));</span>
<span class="p">}</span>
<span class="nc">.ruler-x</span> <span class="nt">li</span><span class="nd">::after</span> <span class="p">{</span>
  <span class="nl">content</span><span class="p">:</span> <span class="n">counter</span><span class="p">(</span><span class="n">d</span><span class="p">);</span>
  <span class="nl">line-height</span><span class="p">:</span> <span class="m">1</span><span class="p">;</span>
  <span class="py">padding-inline-start</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--ruler-num-pi</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>




<hr>

<h2>
  <a name="creating-an-editor" href="#creating-an-editor">
  </a>
  Creating an Editor
</h2>

<p>Now, let's create a small editor for our ruler. </p>

<p>We'll use a small JavaScript to update the <em>Custom Properties:</em><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nx">app</span><span class="p">.</span><span class="nf">addEventListener</span><span class="p">(</span><span class="dl">'</span><span class="s1">input</span><span class="dl">'</span><span class="p">,</span> <span class="p">(</span><span class="nx">e</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">input</span> <span class="o">=</span> <span class="nx">e</span><span class="p">.</span><span class="nx">target</span><span class="p">;</span>
  <span class="kd">const</span> <span class="nx">value</span> <span class="o">=</span> <span class="nx">input</span><span class="p">.</span><span class="nx">type</span> <span class="o">===</span> <span class="dl">'</span><span class="s1">checkbox</span><span class="dl">'</span> <span class="p">?</span> <span class="p">(</span><span class="nx">input</span><span class="p">.</span><span class="nx">checked</span> <span class="p">?</span> <span class="mi">1</span> <span class="p">:</span> <span class="mi">0</span><span class="p">)</span> <span class="p">:</span> <span class="nx">input</span><span class="p">.</span><span class="nx">value</span><span class="p">;</span>
  <span class="nb">document</span><span class="p">.</span><span class="nx">body</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nf">setProperty</span><span class="p">(</span><span class="nx">input</span><span class="p">.</span><span class="nx">name</span><span class="p">,</span> <span class="nx">value</span><span class="o">+</span><span class="p">(</span><span class="nx">input</span><span class="p">.</span><span class="nx">dataset</span><span class="p">.</span><span class="nx">suffix</span><span class="o">||</span><span class="dl">''</span><span class="p">));</span>
<span class="p">})</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>




<hr>

<p>In HTML, add <code>&lt;input&gt;</code>s to <code>&lt;form id="app"&gt;</code>, using <code>name</code> for the property to set, <code>value</code> for the value (surprise!) and <code>data-suffix</code> to add any suffix to the value:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;input</span> <span class="na">type=</span><span class="s">"range"</span> <span class="na">name=</span><span class="s">"--ruler1-h"</span> <span class="na">value=</span><span class="s">"8"</span> <span class="na">data-suffix=</span><span class="s">"px"</span><span class="nt">&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Repeat for all the properties, you want to be editable.</p>


<hr>

<h2>
  <a name="demo" href="#demo">
  </a>
  Demo
