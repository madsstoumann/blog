		<article>
			<h1>Clocks and Watches in CSS</h1>
			<p>A couple of years ago, when CSS trigonometry functions became baseline, I <a href="https://css-tricks.com/creating-a-clock-with-the-new-css-sin-and-cos-trigonometry-functions/" target="_blank" rel="noopener noreferrer">wrote an article</a> about them. One of the examples I did, was a CSS-only analog clock:</p>

<p><iframe height="600" src="https://codepen.io/stoumann/embed/wvxOQKo?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
</p>

<p>Since then, CSS has introduced a <em>bunch</em> of new features — one being <code>offset-path</code>, which is perfect for creating indices on a clock (I sound like an horology expert, but I Googled that).</p>

<p>So, without further ado, let's expand my old example with some more, cool features! We'll wrap it within a Web Component for easier customization, but you can stick with CSS-only, if you want.</p>


<hr>

<p>First, we set up a simple grid, divided into 3 rows:</p>

<p><a href="assets/2263002/e404d30a.jpg" class="article-body-image-wrapper"><img src="assets/2263002/e404d30a.jpg" alt="Main Grid" loading="lazy" width="564" height="562"></a><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:host</span> <span class="p">{</span>
  <span class="py">aspect-ratio</span><span class="p">:</span> <span class="m">1</span><span class="p">;</span>
  <span class="nl">background</span><span class="p">:</span> <span class="m">#f2f2f2</span><span class="p">;</span>
  <span class="nl">border-radius</span><span class="p">:</span> <span class="m">50%</span><span class="p">;</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">grid</span><span class="p">;</span>
  <span class="py">grid-template-rows</span><span class="p">:</span> <span class="nb">repeat</span><span class="p">(</span><span class="m">3</span><span class="p">,</span> <span class="m">1</span><span class="n">fr</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The indices are a bunch of <code>&lt;li&gt;</code> elements within a <code>&lt;ul&gt;</code>, using <code>offset-distance / path</code> to place them around the circle:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">li</span> <span class="p">{</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">inline-block</span><span class="p">;</span>
  <span class="nl">list-style</span><span class="p">:</span> <span class="nb">none</span><span class="p">;</span>
  <span class="py">offset-distance</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--_d</span><span class="p">);</span>
  <span class="py">offset-path</span><span class="p">:</span> <span class="n">content-box</span><span class="p">;</span>
  <span class="nl">width</span><span class="p">:</span> <span class="n">fit-content</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Each <code>&lt;li&gt;</code> has a degree (actually a percentage), defined  in the <code>--_d</code> custom property:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;li</span> <span class="na">style=</span><span class="s">"--_d:0%"</span><span class="nt">&gt;</span>|<span class="nt">&lt;/li&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>This gets us:</p>

<p><a href="assets/2263002/37a74b06.jpg" class="article-body-image-wrapper"><img src="assets/2263002/37a74b06.jpg" alt="Indices" loading="lazy" width="554" height="562"></a></p>

<blockquote>
<p>By default, <code>offset-rotate</code> automatically rotates elements to follow the path direction. This behavior is exactly what we need for the indices, so we don't need to set any additional rotation.</p>
</blockquote>

<p>Now, for the numerals, we'll also use <code>&lt;li&gt;</code>, but this time within an <em>ordered</em> list, <code>&lt;ol&gt;</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;ol&gt;</span>
  <span class="nt">&lt;li</span> <span class="na">style=</span><span class="s">"--_d:300deg"</span><span class="nt">&gt;</span>1<span class="nt">&lt;/li&gt;</span>
<span class="nt">&lt;/ol&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>We'll use <code>cos()</code> and <code>sin()</code> to place the numerals, like in my original example.<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">li</span> <span class="p">{</span>
  <span class="py">--_r</span><span class="p">:</span> <span class="n">calc</span><span class="p">((</span><span class="m">100%</span> <span class="n">-</span> <span class="m">15</span><span class="n">cqi</span><span class="p">)</span> <span class="p">/</span> <span class="m">2</span><span class="p">);</span>
  <span class="py">--_x</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--_r</span><span class="p">)</span> <span class="err">+</span> <span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--_r</span><span class="p">)</span> <span class="err">*</span> <span class="n">cos</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--_d</span><span class="p">))));</span>
  <span class="py">--_y</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--_r</span><span class="p">)</span> <span class="err">+</span> <span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--_r</span><span class="p">)</span> <span class="err">*</span> <span class="n">sin</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--_d</span><span class="p">))));</span>
  <span class="py">aspect-ratio</span><span class="p">:</span> <span class="m">1</span><span class="p">;</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">grid</span><span class="p">;</span>
  <span class="nl">left</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--_x</span><span class="p">);</span>
  <span class="py">place-content</span><span class="p">:</span> <span class="nb">center</span><span class="p">;</span>
  <span class="nl">position</span><span class="p">:</span> <span class="nb">absolute</span><span class="p">;</span>
  <span class="nl">top</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--_y</span><span class="p">);</span>
  <span class="nl">width</span><span class="p">:</span> <span class="m">15</span><span class="n">cqi</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And we get:</p>

<p><a href="assets/2263002/d86dcfed.jpg" class="article-body-image-wrapper"><img src="assets/2263002/d86dcfed.jpg" alt="Numerals" loading="lazy" width="562" height="568"></a></p>

<p>Now, let's create the markup for the hands and date. The cap will be added as a pseudo-element. I had a hard time trying to wrap my head around what good, semantic markup would be here? I gave up, and just used a bunch of <code>&lt;div&gt;</code>s 😄<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;nav</span> <span class="na">part=</span><span class="s">"hands"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;div</span> <span class="na">part=</span><span class="s">"seconds"</span><span class="nt">&gt;&lt;/div&gt;</span>
  <span class="nt">&lt;div</span> <span class="na">part=</span><span class="s">"minutes"</span><span class="nt">&gt;&lt;/div&gt;</span>
  <span class="nt">&lt;div</span> <span class="na">part=</span><span class="s">"hours"</span><span class="nt">&gt;&lt;/div&gt;</span>
  <span class="nt">&lt;time</span> <span class="na">part=</span><span class="s">"date"</span><span class="nt">&gt;&lt;/time&gt;</span>
<span class="nt">&lt;/nav&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>We position the <code>&lt;nav&gt;</code> in the middle row of the main grid, and create a 3-column grid:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:host::part</span><span class="o">(</span><span class="nt">hands</span><span class="o">)</span> <span class="p">{</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">grid</span><span class="p">;</span>
  <span class="py">grid-area</span><span class="p">:</span> <span class="m">2</span> <span class="p">/</span> <span class="m">1</span> <span class="p">/</span> <span class="m">3</span> <span class="p">/</span> <span class="m">1</span><span class="p">;</span>
  <span class="py">grid-template-columns</span><span class="p">:</span> <span class="nb">repeat</span><span class="p">(</span><span class="m">3</span><span class="p">,</span> <span class="m">1</span><span class="n">fr</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>

<p>This gives us:<br>
<a href="assets/2263002/3e2e5bfc.jpg" class="article-body-image-wrapper"><img src="assets/2263002/3e2e5bfc.jpg" alt="Hands" loading="lazy" width="560" height="566"></a></p>

<p>Finally, we place the label at the top center of the last row of the main grid:</p>

<p><a href="assets/2263002/116f71a7.jpg" class="article-body-image-wrapper"><img src="assets/2263002/116f71a7.jpg" alt="Label" loading="lazy" width="564" height="562"></a></p>

<hr>
<h2>
  <a name="animating-the-hands" href="#animating-the-hands">
  </a>
  Animating the hands
</h2>

<p>To animate the hands, we just need a single animation:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="k">@keyframes</span> <span class="n">turn</span> <span class="p">{</span>
  <span class="nt">to</span> <span class="p">{</span> <span class="nl">transform</span><span class="p">:</span> <span class="n">rotate</span><span class="p">(</span><span class="m">1turn</span><span class="p">);</span> <span class="p">}</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>However, it needs to be <strong>called</strong> in 3 very distinct ways:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:host::part</span><span class="o">(</span><span class="nt">hours</span><span class="o">)</span> <span class="p">{</span>
  <span class="nl">animation</span><span class="p">:</span> <span class="n">turn</span> <span class="m">43200s</span> <span class="n">linear</span> <span class="n">infinite</span><span class="p">;</span>
  <span class="nl">animation-delay</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--_dh</span><span class="p">,</span> <span class="m">0ms</span><span class="p">);</span>
<span class="p">}</span>
<span class="nd">:host::part</span><span class="o">(</span><span class="nt">minutes</span><span class="o">)</span> <span class="p">{</span>
  <span class="nl">animation</span><span class="p">:</span> <span class="n">turn</span> <span class="m">3600s</span> <span class="n">steps</span><span class="p">(</span><span class="m">60</span><span class="p">,</span> <span class="n">end</span><span class="p">)</span> <span class="n">infinite</span><span class="p">;</span>
  <span class="nl">animation-delay</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--_dm</span><span class="p">,</span> <span class="m">0ms</span><span class="p">);</span>
<span class="p">}</span>
<span class="nd">:host::part</span><span class="o">(</span><span class="nt">seconds</span><span class="o">)</span> <span class="p">{</span>
  <span class="nl">animation</span><span class="p">:</span> <span class="n">turn</span> <span class="m">60s</span> <span class="n">linear</span> <span class="n">infinite</span><span class="p">;</span>
  <span class="nl">animation-delay</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--_ds</span><span class="p">,</span> <span class="m">0ms</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>

<p>And that's it! ... if you don't mind the clock always starting at noon!</p>

<p>To initialize the clock with the <em>actual</em> time, we need to update the delay properties: <code>--_dh</code>, <code>--_dm</code> and <code>--_ds</code> — and for that, we need a small snippet of JavaScript:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">time</span> <span class="o">=</span> <span class="k">new</span> <span class="nc">Date</span><span class="p">();</span>
<span class="kd">const</span> <span class="nx">hour</span> <span class="o">=</span> <span class="o">-</span><span class="mi">3600</span> <span class="o">*</span> <span class="p">(</span><span class="nx">time</span><span class="p">.</span><span class="nf">getHours</span><span class="p">()</span> <span class="o">%</span> <span class="mi">12</span><span class="p">);</span>
<span class="kd">const</span> <span class="nx">mins</span> <span class="o">=</span> <span class="o">-</span><span class="mi">60</span> <span class="o">*</span> <span class="nx">time</span><span class="p">.</span><span class="nf">getMinutes</span><span class="p">();</span>
<span class="nx">app</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nf">setProperty</span><span class="p">(</span><span class="dl">'</span><span class="s1">--_dm</span><span class="dl">'</span><span class="p">,</span> <span class="s2">`</span><span class="p">${</span><span class="nx">mins</span><span class="p">}</span><span class="s2">s`</span><span class="p">);</span>
<span class="nx">app</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nf">setProperty</span><span class="p">(</span><span class="dl">'</span><span class="s1">--_dh</span><span class="dl">'</span><span class="p">,</span> <span class="s2">`</span><span class="p">${(</span><span class="nx">hour</span><span class="o">+</span><span class="nx">mins</span><span class="p">)}</span><span class="s2">s`</span><span class="p">);</span>
</code></pre>

<h2>

</h2>

<p>Wrapping the code in a <code>&lt;analog-clock&gt;</code> web component offers a simple way to add an analog clock to your web projects. It's  customizable through various attributes and CSS custom properties.</p>

<h2>
  <a name="attributes" href="#attributes">
  </a>
  Attributes
</h2>

<ul>
<li>
<code>date</code>: Display date. Values: "day", "month", "year" or any combination</li>
<li>
<code>indices</code>: Show tick marks. Values: empty (60 marks) or "hours" (12 marks)</li>
<li>
<code>label</code>: Text label below the clock</li>
<li>
<code>marker</code>: Character used for indices (default: "|")</li>
<li>
<code>marker-hour</code>: Character used for hour indices (defaults to marker value)</li>
<li>
<code>numerals</code>: Number of numerals to display (1-12, default: 12)</li>
<li>
<code>steps</code>: Use stepping animation for seconds hand</li>
<li>
<code>system</code>: Number system. Values: "roman", "romanlow", or any valid <a href="https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Intl/NumberFormat/NumberFormat#numberingsystem" target="_blank" rel="noopener noreferrer">Intl numberingSystem</a>
</li>
<li>
<code>timezone</code>: UTC offset in hours (e.g., "-4", "+1", "+5.5")</li>
</ul>
