		<article>
			<h1>Building A Minimal AutoSuggest</h1>
			<p>It took the Web a lot of years to introduce the <code>&lt;datalist&gt;</code>-tag, essential in creating one of the most widely used UI-components: the “AutoSuggest”. In this tutorial we'll be building a minimal “AutoSuggest”, both <em>with</em> and <em>without</em> JavaScript.</p>


<hr>

<p>In one of the first books I read about UI-design, “The Windows Interface Guidelines for Software Design” from 1995, it was called <em>a Combobox</em> — because it's a <em>combination</em> of a <em>drop-down list</em> and a <em>text-input</em>. I personally think that term makes more sense than “AutoSuggest” or “Type Ahead”, but it seems the world has chosen “AutoSuggest” — so let's stick with that!</p>

<p>jQueryUI has the “AutoComplete”-plugin, incorrectly named, as “autocomplete” is a slightly different thing, as seen in this image from a <a href="https://ux.stackexchange.com/questions/40104/how-to-provide-autocomplete-and-autosuggest-on-the-same-search-box-at-the-same-t" target="_blank" rel="noopener noreferrer">UX Stackexchange</a> post:</p>

<p><a href="assets/741580/b8cbbf42.jpg" class="article-body-image-wrapper"><img src="assets/741580/b8cbbf42.jpg" alt="nXHX2" loading="lazy" width="521" height="218"></a></p>


<hr>

<h2>
  <a name="basic-structure" href="#basic-structure">
  </a>
  Basic Structure
</h2>

<p>In most of the examples you'll see online, a <code>&lt;datalist&gt;</code> is used with the <code>&lt;input type="text"&gt;</code>. I prefer to use <code>&lt;input type="search"&gt;</code>. Why? Because this type adds some nice, extra, accessibility-friendly features out-of-the-box:</p>

<ul>
<li><p>The <code>Escape</code>-key clears the list-selection, a second press clears the input altogether.</p></li>
<li><p>In Chrome and Safari, an event — <a href="https://developer.mozilla.org/en-US/docs/Web/API/HTMLInputElement/search_event" target="_blank" rel="noopener noreferrer">onsearch</a> — is triggered when you press <code>Escape</code> or <code>Enter</code>, or when you click the little “reset cross”.</p></li>
</ul>


<hr>

<h2>
  <a name="the-markup" href="#the-markup">
  </a>
  The markup
</h2>

<p>The suggestions themselves are <code>&lt;option&gt;</code>s in a <code>&lt;datalist&gt;</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;datalist</span> <span class="na">id=</span><span class="s">"browsers"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;option</span> <span class="na">value=</span><span class="s">"Edge"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;option</span> <span class="na">value=</span><span class="s">"Firefox"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;option</span> <span class="na">value=</span><span class="s">"Chrome"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;option</span> <span class="na">value=</span><span class="s">"Opera"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;option</span> <span class="na">value=</span><span class="s">"Safari"</span><span class="nt">&gt;</span>
<span class="nt">&lt;/datalist&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>In Chrome, this format is also supported:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;option</span> <span class="na">value=</span><span class="s">"MSE"</span><span class="nt">&gt;</span>Microsoft Edge<span class="nt">&lt;/option&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Both <code>value</code> and <code>innerText</code> will show up in the list, but only <code>value</code> will be inserted, when you select an item.</p>

<p>To link a <code>&lt;datalist&gt;</code> with an input, just take the <code>id</code> and use as a <code>list</code>-attribute:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;label&gt;</span>
  <span class="nt">&lt;strong&gt;</span>Pick a browser<span class="nt">&lt;/strong&gt;</span>
  <span class="nt">&lt;input</span>
    <span class="na">autocomplete=</span><span class="s">"off"</span>
    <span class="na">autocorrect=</span><span class="s">"off"</span>
    <span class="na">list=</span><span class="s">"browsers"</span>
    <span class="na">spellcheck=</span><span class="s">"false"</span>
    <span class="na">type=</span><span class="s">"search"</span><span class="nt">&gt;</span>
<span class="nt">&lt;/label&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>We don't want <code>autocomplete</code> or <code>spellcheck</code> to interfere, so we set them to <code>off</code> and <code>false</code>. <code>autocorrect</code> is a Safari-only property, that should also be disabled in this case.  </p>


<hr>

<h2>
  <a name="the-css" href="#the-css">
  </a>
  The CSS
</h2>

<p>Not much here. We can use <code>-webkit-appearance: none</code> to clear the default browser-styling, and add our own. Here's an example:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">[</span><span class="nt">type</span><span class="o">=</span><span class="s1">"search"</span><span class="o">]</span> <span class="p">{</span>
  <span class="nl">border</span><span class="p">:</span> <span class="m">1px</span> <span class="nb">solid</span> <span class="m">#AAA</span><span class="p">;</span>
  <span class="nl">font-size</span><span class="p">:</span> <span class="m">1rem</span><span class="p">;</span>
  <span class="py">margin-block</span><span class="p">:</span> <span class="m">0.5rem</span><span class="p">;</span>
  <span class="py">min-inline-size</span><span class="p">:</span> <span class="m">20rem</span><span class="p">;</span>
  <span class="nl">padding</span><span class="p">:</span> <span class="m">0.5rem</span> <span class="m">0.75rem</span><span class="p">;</span>
  <span class="nl">-webkit-appearance</span><span class="p">:</span> <span class="nb">none</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>What you probably <strong>do</strong> want to change, is that little “cross-icon”, that resets the input:</p>

<p><a href="assets/741580/5a288ef1.jpg" class="article-body-image-wrapper"><img src="assets/741580/5a288ef1.jpg" alt="Reset Cross" loading="lazy" width="322" height="44"></a></p>

<p>I use a SVG-icon in a <code>url()</code>, that I store in a <em>CSS Custom Property</em>, so it can be used as both a <code>mask-image</code> and a <code>-webkit-mask-image</code> for browser-compatibility:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">[</span><span class="nt">type</span><span class="o">=</span><span class="s1">"search"</span><span class="o">]</span><span class="nd">::-webkit-search-cancel-button</span> <span class="p">{</span>
  <span class="py">--reset</span><span class="p">:</span> <span class="sx">url('data:image/svg+xml,&lt;svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"&gt;&lt;path d="M17.016 15.609l-3.609-3.609 3.609-3.609-1.406-1.406-3.609 3.609-3.609-3.609-1.406 1.406 3.609 3.609-3.609 3.609 1.406 1.406 3.609-3.609 3.609 3.609zM12 2.016q4.125 0 7.055 2.93t2.93 7.055-2.93 7.055-7.055 2.93-7.055-2.93-2.93-7.055 2.93-7.055 7.055-2.93z"/&gt;&lt;/svg&gt;')</span><span class="p">;</span>
  <span class="nl">background-color</span><span class="p">:</span> <span class="n">currentColor</span><span class="p">;</span>
  <span class="nl">display</span><span class="p">:</span> <span class="nb">block</span><span class="p">;</span>
  <span class="nl">height</span><span class="p">:</span> <span class="m">1rem</span><span class="p">;</span>
  <span class="py">mask-image</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--reset</span><span class="p">);</span>
  <span class="nl">width</span><span class="p">:</span> <span class="m">1rem</span><span class="p">;</span>
  <span class="nl">-webkit-appearance</span><span class="p">:</span> <span class="nb">none</span><span class="p">;</span>
  <span class="nl">-webkit-mask-image</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--reset</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Chrome adds a drop-down-arrow to an <code>&lt;input&gt;</code> with a <code>&lt;datalist&gt;</code>, which we can hide:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="err">}</span>
<span class="o">[</span><span class="nt">list</span><span class="o">]</span><span class="nd">::-webkit-calendar-picker-indicator</span> <span class="p">{</span>
  <span class="nl">display</span><span class="p">:</span> <span class="nb">none</span> <span class="cp">!important</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>There, much better:</p>

<p><a href="assets/741580/1f205ded.jpg" class="article-body-image-wrapper"><img src="assets/741580/1f205ded.jpg" alt="Reset Cross Styled" loading="lazy" width="323" height="40"></a></p>

<p>On mobile devices, the <code>&lt;input type="search"&gt;</code> will trigger a virtual keyboard with a “Search”-button. If you <strong>don't</strong> want that, look into <a href="https://css-tricks.com/everything-you-ever-wanted-to-know-about-inputmode/" target="_blank" rel="noopener noreferrer">inputmode</a>.</p>

<p>On an iPhone, a <code>&lt;datalist&gt;</code> is displayed like this:</p>

<p><a href="assets/741580/81809717.jpg" class="article-body-image-wrapper"><img src="assets/741580/81809717.jpg" alt="iphonedatalist" loading="lazy" width="800" height="297"></a> </p>

<p>Far from perfect, but still much better than many custom solutions, where the virtual keyboard makes the “AutoSuggest” jump up and down!</p>


<hr>

<p>That's the minimalistic, JavaScript-free <em>AutoSuggest!</em></p>

<p>Excellent for things like a <a href="https://madsstoumann.github.io/autosuggest/countries.html" target="_blank" rel="noopener noreferrer">country selector</a> — and <em>much better</em> than the minified <strong>224kb</strong> jQueryUI's “AutoComplete”-plugin consumes (including it's CSS, and jQuery itself).</p>

<p>But what if you want to use an API, creating <code>&lt;option&gt;</code>s dynamically?</p>


<hr>

<h2>
  <a name="adding-an-api" href="#adding-an-api">
  </a>
  Adding an API
</h2>

<p>Before we look at the JavaScript, let's add some extra attributes to the <code>&lt;input type="search"&gt;</code>-markup:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code>data-api="//domain.com?q="
data-api-cache="0"
data-api-key="key"
min-length="3"
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The <code>data-api</code> is for the <code>url</code> we want to <code>fetch()</code>.<br><br>
The search-text will be appended to this.</p>

<p>The <code>data-api-cache</code> can either be <code>0</code> (disabled) or <code>1</code> (enabled). If enabled, the <code>&lt;datalist&gt;</code>-options will not be overwritten after the initial <code>fetch()</code>, and as you type in more text, the native browser-filtering of a <code>&lt;datalist&gt;</code> will be used.</p>

<p><code>data-api-key</code> is the “key / property” in the result-objects, you want to search and display as <code>&lt;option&gt;</code>s.</p>

<p><code>min-length</code> is a standard-attribute. In this case, it indicates how many characters you need to type, before the <code>fetch()</code> is triggered.</p>

<hr>
<h2>
  <a name="javascript" href="#javascript">
  </a>
  JavaScript
</h2>

<p>For the JavaScript, I'm going to explain all the methods I'm using, so you can build your own, customized <em>AutoSuggest</em> with just the features you need.</p>

<p>First, we add a function, <code>autoSuggest(input)</code> with a single parameter: the <code>input</code>.</p>

<p>Next, a boolean indicating whether cache should be used:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">cache</span> <span class="o">=</span> <span class="nx">input</span><span class="p">.</span><span class="nx">dataset</span><span class="p">.</span><span class="nx">apiCache</span> <span class="o">-</span> <span class="mi">0</span> <span class="o">||</span> <span class="mi">0</span><span class="p">;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The returned data, will be stored in:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">let</span> <span class="nx">data</span> <span class="o">=</span> <span class="p">[];</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

<p>In order not to crash the service, we're calling, we need a <em>debounce</em>-method to filter out events:<br>

  <span class="kd">let</span> <span class="nx">timerId</span><span class="p">;</span>
  <span class="k">return</span> <span class="kd">function</span><span class="p">(...</span><span class="nx">args</span><span class="p">)</span> <span class="p">{</span>
    <span class="k">if </span><span class="p">(</span><span class="nx">timerId</span><span class="p">)</span> <span class="nf">clearTimeout</span><span class="p">(</span><span class="nx">timerId</span><span class="p">);</span>
    <span class="nx">timerId</span> <span class="o">=</span> <span class="nf">setTimeout</span><span class="p">(()</span> <span class="o">=&gt;</span> <span class="p">{</span> <span class="nf">fn</span><span class="p">(...</span><span class="nx">args</span><span class="p">);</span> <span class="nx">timerId</span> <span class="o">=</span> <span class="kc">null</span> <span class="p">},</span> <span class="nx">delay</span><span class="p">)</span>
  <span class="p">}</span>

</code></pre>

<p>The <code>200</code> is the delay used in the <code>debounce</code>-method. You can modify this, or add it to a settings-object or similar.</p>

<p>Finally, there's the <code>onentry</code>-method called from within the <code>debounce</code>:<br>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">onentry</span> <span class="o">=</span> <span class="k">async</span> <span class="kd">function</span><span class="p">(</span><span class="nx">event</span><span class="p">)</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">value</span> <span class="o">=</span> <span class="nx">input</span><span class="p">.</span><span class="nx">value</span><span class="p">.</span><span class="nx">length</span> <span class="o">&gt;=</span> <span class="nx">input</span><span class="p">.</span><span class="nx">minLength</span> <span class="o">&amp;&amp;</span> <span class="nx">input</span><span class="p">.</span><span class="nx">value</span><span class="p">.</span><span class="nf">toLowerCase</span><span class="p">();</span>
  <span class="k">if </span><span class="p">(</span><span class="o">!</span><span class="nx">value</span><span class="p">)</span> <span class="k">return</span><span class="p">;</span>
  <span class="k">if </span><span class="p">(</span><span class="o">!</span><span class="nx">data</span><span class="p">.</span><span class="nx">length</span> <span class="o">||</span> <span class="nx">cache</span> <span class="o">===</span> <span class="kc">false</span><span class="p">)</span> <span class="p">{</span>
    <span class="nx">data</span> <span class="o">=</span> <span class="k">await </span><span class="p">(</span><span class="k">await</span> <span class="nf">fetch</span><span class="p">(</span><span class="nx">input</span><span class="p">.</span><span class="nx">dataset</span><span class="p">.</span><span class="nx">api</span> <span class="o">+</span> <span class="nf">encodeURIComponent</span><span class="p">(</span><span class="nx">value</span><span class="p">))).</span><span class="nf">json</span><span class="p">();</span>
    <span class="nx">list</span><span class="p">.</span><span class="nx">innerHTML</span> <span class="o">=</span> <span class="nx">data</span><span class="p">.</span><span class="nf">map</span><span class="p">(</span><span class="nx">obj</span> <span class="o">=&gt;</span> <span class="s2">`&lt;option value="</span><span class="p">${</span><span class="nx">obj</span><span class="p">[</span><span class="nx">input</span><span class="p">.</span><span class="nx">dataset</span><span class="p">.</span><span class="nx">apiKey</span><span class="p">]}</span><span class="s2">"&gt;`</span><span class="p">).</span><span class="nf">join</span><span class="p">(</span><span class="dl">''</span><span class="p">)</span>
  <span class="p">}</span>
<span class="p">}</span>
</code></pre>

<p>It's an async function, that first checks whether the input has the minimal amount of characters. If not, it simply returns.</p>

<p>If no data exists already, or if the cache is set to <code>0: false</code>, a <code>fetch()</code> is triggered, and the <code>&lt;option&gt;</code>s are updated.</p>

<p>Cool, we now have dynamic options, and a minified script, that's just <strong>497 bytes</strong>, approx. <strong>349 bytes gzipped!</strong></p>

<p>But I think it lacks a few features. I want to trigger a <em>Custom Event</em>, when I select an option from the list, and I want the <em>object</em> from the matching search-result in that event.</p>

<p>Let's modify the <code>onentry</code>-method a bit. We can use the <code>event.inputType</code> to detect, when the user clicks on a list item, or selects it using <code>Enter</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="k">if </span><span class="p">(</span><span class="nx">event</span><span class="p">.</span><span class="nx">inputType</span> <span class="o">==</span> <span class="dl">"</span><span class="s2">insertReplacementText</span><span class="dl">"</span> <span class="o">||</span> <span class="nx">event</span><span class="p">.</span><span class="nx">inputType</span> <span class="o">==</span> <span class="kc">null</span><span class="p">)</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">option</span> <span class="o">=</span> <span class="nf">selected</span><span class="p">();</span> 
  <span class="k">if </span><span class="p">(</span><span class="nx">option</span><span class="p">)</span> <span class="nx">input</span><span class="p">.</span><span class="nf">dispatchEvent</span><span class="p">(</span><span class="k">new</span> <span class="nc">CustomEvent</span><span class="p">(</span><span class="dl">'</span><span class="s1">autoSuggestSelect</span><span class="dl">'</span><span class="p">,</span> <span class="p">{</span> <span class="na">detail</span><span class="p">:</span> <span class="nx">JSON</span><span class="p">.</span><span class="nf">parse</span><span class="p">(</span><span class="nx">option</span><span class="p">.</span><span class="nx">dataset</span><span class="p">.</span><span class="nx">obj</span><span class="p">)</span> <span class="p">}));</span>
  <span class="k">return</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>

  <span class="kd">const</span> <span class="nx">option</span> <span class="o">=</span> <span class="p">[...</span><span class="nx">list</span><span class="p">.</span><span class="nx">options</span><span class="p">].</span><span class="nf">filter</span><span class="p">(</span><span class="nx">entry</span> <span class="o">=&gt;</span> <span class="nx">entry</span><span class="p">.</span><span class="nx">value</span> <span class="o">===</span> <span class="nx">input</span><span class="p">.</span><span class="nx">value</span><span class="p">);</span>
  <span class="k">return</span> <span class="nx">option</span><span class="p">.</span><span class="nx">length</span> <span class="o">===</span> <span class="mi">1</span> <span class="p">?</span> <span class="nx">option</span><span class="p">[</span><span class="mi">0</span><span class="p">]</span> <span class="p">:</span> <span class="mi">0</span><span class="p">;</span>

<p>What if we want to <em>reset</em> the list? In Safari and Chrome, there's the <code>onsearch</code>-event, that's triggered on both reset and <code>Enter</code>.<br>
Let's add a <code>reset()</code>-method:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">reset</span> <span class="o">=</span> <span class="p">()</span> <span class="o">=&gt;</span> <span class="p">{</span> <span class="nx">data</span> <span class="o">=</span> <span class="p">[];</span> <span class="nx">list</span><span class="p">.</span><span class="nx">innerHTML</span> <span class="o">=</span> <span class="s2">`&lt;option value=""&gt;`</span> <span class="p">}</span>

<div class="highlight js-code-highlight">

<p>The script is now <strong>544 bytes</strong> gzipped. Is there anything else, we can do?</p>

<p>In Firefox, we can add a small “polyfill” for <code>onsearch</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="k">if </span><span class="p">(</span><span class="o">!</span><span class="p">(</span><span class="dl">'</span><span class="s1">onsearch</span><span class="dl">'</span> <span class="k">in</span> <span class="nx">input</span><span class="p">))</span> <span class="p">{</span>
  <span class="nx">input</span><span class="p">.</span><span class="nf">addEventListener</span><span class="p">(</span><span class="dl">'</span><span class="s1">keydown</span><span class="dl">'</span><span class="p">,</span> <span class="p">(</span><span class="nx">event</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="p">{</span>
    <span class="k">if </span><span class="p">(</span><span class="nx">event</span><span class="p">.</span><span class="nx">key</span> <span class="o">===</span> <span class="dl">'</span><span class="s1">Escape</span><span class="dl">'</span><span class="p">)</span> <span class="p">{</span> <span class="nx">input</span><span class="p">.</span><span class="nx">value</span> <span class="o">=</span> <span class="dl">''</span><span class="p">;</span> <span class="nf">reset</span><span class="p">();</span> <span class="p">}</span>
    <span class="k">if </span><span class="p">(</span><span class="nx">event</span><span class="p">.</span><span class="nx">key</span> <span class="o">===</span> <span class="dl">'</span><span class="s1">Enter</span><span class="dl">'</span><span class="p">)</span> <span class="p">{</span> <span class="p">...</span> <span class="p">}</span>
  <span class="p">})</span>
<span class="p">}</span>
</code></pre>

<h2>
  <a name="what-else" href="#what-else">
  </a>
  What Else?
</h2>

<p>You can continue to add stuff yourself. But before you do that, let's add a <code>settings</code>-object to hold the configuration parameters for what we already have — and whatever you want to add! First, we'll change the main function:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nf">autoSuggest</span><span class="p">(</span><span class="nx">input</span><span class="p">,</span> <span class="nx">args</span><span class="p">)</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Then, we'll merge the <code>args</code> into a settings-object:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">settings</span> <span class="o">=</span> <span class="nb">Object</span><span class="p">.</span><span class="nf">assign</span><span class="p">({</span>
  <span class="na">api</span><span class="p">:</span> <span class="dl">''</span><span class="p">,</span>
  <span class="na">apiCache</span><span class="p">:</span> <span class="kc">false</span><span class="p">,</span>
  <span class="na">apiKey</span><span class="p">:</span> <span class="dl">''</span>
<span class="p">},</span> <span class="nf">datasetToType</span><span class="p">(</span><span class="nx">args</span><span class="p">));</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The <code>datasetToType</code> is a small helper-function, that'll convert dataset-entries to correct types (non-string values prefixed with a <code>:</code>):<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="k">export</span> <span class="k">default</span> <span class="kd">function</span> <span class="nf">datasetToType</span><span class="p">(</span><span class="nx">obj</span><span class="p">)</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">object</span> <span class="o">=</span> <span class="nb">Object</span><span class="p">.</span><span class="nf">assign</span><span class="p">({},</span> <span class="nx">obj</span><span class="p">);</span>
  <span class="nb">Object</span><span class="p">.</span><span class="nf">keys</span><span class="p">(</span><span class="nx">object</span><span class="p">).</span><span class="nf">forEach</span><span class="p">(</span><span class="nx">key</span> <span class="o">=&gt;</span> <span class="p">{</span>
    <span class="k">if </span><span class="p">(</span><span class="k">typeof</span> <span class="nx">object</span><span class="p">[</span><span class="nx">key</span><span class="p">]</span> <span class="o">===</span> <span class="dl">'</span><span class="s1">string</span><span class="dl">'</span> <span class="o">&amp;&amp;</span> <span class="nx">object</span><span class="p">[</span><span class="nx">key</span><span class="p">].</span><span class="nf">charAt</span><span class="p">(</span><span class="mi">0</span><span class="p">)</span> <span class="o">===</span> <span class="dl">'</span><span class="s1">:</span><span class="dl">'</span><span class="p">)</span> <span class="p">{</span>
      <span class="nx">object</span><span class="p">[</span><span class="nx">key</span><span class="p">]</span> <span class="o">=</span> <span class="nx">JSON</span><span class="p">.</span><span class="nf">parse</span><span class="p">(</span><span class="nx">object</span><span class="p">[</span><span class="nx">key</span><span class="p">].</span><span class="nf">slice</span><span class="p">(</span><span class="mi">1</span><span class="p">));</span>
    <span class="p">}</span>
  <span class="p">});</span>
  <span class="k">return</span> <span class="nx">object</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>This way, we can call the <code>autoSuggest</code>-method with <em>either</em> a standard JavaScript-object:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nf">autoSuggest</span><span class="p">(</span><span class="nx">input</span><span class="p">,</span> <span class="p">{</span> <span class="na">apiCache</span><span class="p">:</span> <span class="kc">false</span> <span class="p">});</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>— or with it's <code>dataset</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nf">autoSuggest</span><span class="p">(</span><span class="nx">input</span><span class="p">,</span> <span class="nx">input</span><span class="p">.</span><span class="nx">dataset</span><span class="p">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>In the markup, we'll replace the <code>0</code>'s with <code>:false</code> and the <code>1</code>'s with <code>:true</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code>data-api-cache=":false"
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>We also need to replace <code>input.dataset.api</code> with <code>settings.api</code>, remove the <code>cache</code> constant, and replace it with <code>settings.cache</code> (and various other places, check the final example!), but we now have a <code>settings</code>-object, we can extend with new features.</p>


<hr>

<h2>
  <a name="limiting-choices" href="#limiting-choices">
  </a>
  Limiting choices
</h2>

<p>Do you want to limit the <code>value</code> to <strong>only</strong> allow values from the list? Let's extend the <code>settings</code>-object:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nx">invalid</span><span class="p">:</span> <span class="dl">'</span><span class="s1">Not a valid selection</span><span class="dl">'</span><span class="p">,</span>
<span class="nx">limit</span><span class="p">:</span> <span class="kc">false</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>We'll add a new method:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">limit</span> <span class="o">=</span> <span class="p">()</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">option</span> <span class="o">=</span> <span class="nf">selected</span><span class="p">();</span>
  <span class="nx">input</span><span class="p">.</span><span class="nf">setCustomValidity</span><span class="p">(</span><span class="nx">option</span> <span class="p">?</span> <span class="dl">''</span> <span class="p">:</span> <span class="nx">settings</span><span class="p">.</span><span class="nx">invalid</span><span class="p">);</span>
  <span class="k">if </span><span class="p">(</span><span class="o">!</span><span class="nx">input</span><span class="p">.</span><span class="nf">checkValidity</span><span class="p">())</span> <span class="p">{</span>
    <span class="nx">input</span><span class="p">.</span><span class="nf">reportValidity</span><span class="p">();</span>
    <span class="nx">console</span><span class="p">.</span><span class="nf">log</span><span class="p">(</span><span class="dl">'</span><span class="s1">invalid</span><span class="dl">'</span><span class="p">);</span>
  <span class="p">}</span>
  <span class="k">else</span> <span class="p">{</span>
    <span class="nx">console</span><span class="p">.</span><span class="nf">log</span><span class="p">(</span><span class="dl">'</span><span class="s1">valid</span><span class="dl">'</span><span class="p">);</span>
  <span class="p">}</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And finally, we'll update the <code>onsearch</code>-event:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nx">input</span><span class="p">.</span><span class="nf">addEventListener</span><span class="p">(</span><span class="dl">'</span><span class="s1">search</span><span class="dl">'</span><span class="p">,</span> <span class="p">()</span> <span class="o">=&gt;</span> <span class="nx">input</span><span class="p">.</span><span class="nx">value</span><span class="p">.</span><span class="nx">length</span> <span class="o">===</span> <span class="mi">0</span> <span class="p">?</span> <span class="nf">reset</span><span class="p">()</span> <span class="p">:</span> <span class="nx">settings</span><span class="p">.</span><span class="nx">limit</span> <span class="p">?</span> <span class="nf">limit</span><span class="p">()</span> <span class="p">:</span> <span class="dl">''</span><span class="p">);</span>
</code></pre>

<div class="highlight__panel-action js-fullscreen-code-action">

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>

<p>This method uses HTML5's default validation api — and currently does <em>nothing</em> (apart from logging to the <code>console</code>!). You can/should tweak it, to use your own way of handling invalid state.</p>

<h2>
  <a name="examples" href="#examples">
  </a>
  Examples
</h2>

<p>The first <a href="https://madsstoumann.github.io/autosuggest/" target="_blank" rel="noopener noreferrer">example</a> is DAWA, a danish service for looking up addresses <em>(try typing “park”):</em><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;label&gt;</span>
  <span class="nt">&lt;strong&gt;</span>DAWA - Danish Address Lookup<span class="nt">&lt;/strong&gt;</span>
  <span class="nt">&lt;input</span>
    <span class="na">autocomplete=</span><span class="s">"off"</span>
    <span class="na">autocorrect=</span><span class="s">"off"</span>
    <span class="na">data-api=</span><span class="s">"//dawa.aws.dk/adresser/autocomplete?side=1&amp;per_side=10&amp;q="</span>
    <span class="na">data-api-cache=</span><span class="s">":false"</span>
    <span class="na">data-api-key=</span><span class="s">"tekst"</span>
    <span class="na">data-limit=</span><span class="s">":true"</span>
    <span class="na">list=</span><span class="s">"dawa"</span>
    <span class="na">minlength=</span><span class="s">"3"</span>
    <span class="na">spellcheck=</span><span class="s">"false"</span>
    <span class="na">type=</span><span class="s">"search"</span><span class="nt">&gt;</span>
<span class="nt">&lt;/label&gt;</span>
<span class="nt">&lt;datalist</span> <span class="na">id=</span><span class="s">"dawa"</span><span class="nt">&gt;&lt;option</span> <span class="na">value=</span><span class="s">""</span><span class="nt">&gt;&lt;/option&gt;&lt;/datalist&gt;</span>
</code></pre>

<p>Below that is JSON placeholder <em>(try typing “lorem”):</em><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;label&gt;</span>
  <span class="nt">&lt;strong&gt;</span>JSON placeholder<span class="nt">&lt;/strong&gt;</span>
  <span class="nt">&lt;input</span>
    <span class="na">autocomplete=</span><span class="s">"off"</span>
    <span class="na">autocorrect=</span><span class="s">"off"</span>
    <span class="na">data-api=</span><span class="s">"//jsonplaceholder.typicode.com/albums/?_limit=10&amp;q="</span>

    <span class="na">list=</span><span class="s">"jsonplaceholder"</span>

<span class="nt">&lt;/label&gt;</span>
<span class="nt">&lt;datalist</span> <span class="na">id=</span><span class="s">"jsonplaceholder"</span><span class="nt">&gt;&lt;option</span> <span class="na">value=</span><span class="s">""</span><span class="nt">&gt;&lt;/option&gt;&lt;/datalist&gt;</span>
</code></pre>

<p>A quick way to run the <code>autoSuggest</code>-method on all elements with an associated <code>&lt;datalist&gt;</code> is:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="k">import</span> <span class="nx">autoSuggest</span> <span class="k">from</span> <span class="dl">'</span><span class="s1">./autosuggest.mjs</span><span class="dl">'</span><span class="p">;</span>
<span class="kd">const</span> <span class="nx">inputs</span> <span class="o">=</span> <span class="nb">document</span><span class="p">.</span><span class="nf">querySelectorAll</span><span class="p">(</span><span class="dl">'</span><span class="s1">[list]</span><span class="dl">'</span><span class="p">);</span>
<span class="nx">inputs</span><span class="p">.</span><span class="nf">forEach</span><span class="p">(</span><span class="nx">input</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="k">if </span><span class="p">(</span><span class="nx">input</span><span class="p">.</span><span class="nx">dataset</span><span class="p">.</span><span class="nx">api</span><span class="p">)</span> <span class="p">{</span>
    <span class="nx">input</span><span class="p">.</span><span class="nf">addEventListener</span><span class="p">(</span><span class="dl">'</span><span class="s1">autoSuggestSelect</span><span class="dl">'</span><span class="p">,</span> <span class="nx">event</span> <span class="o">=&gt;</span> <span class="p">{</span> <span class="nx">console</span><span class="p">.</span><span class="nf">info</span><span class="p">(</span><span class="nx">event</span><span class="p">.</span><span class="nx">detail</span><span class="p">)</span> <span class="p">});</span>
    <span class="nf">autoSuggest</span><span class="p">(</span><span class="nx">input</span><span class="p">,</span> <span class="nx">input</span><span class="p">.</span><span class="nx">dataset</span><span class="p">);</span>
  <span class="p">}</span>
<span class="p">})</span>
</code></pre>

<h2>
  <a name="conclusion" href="#conclusion">
  </a>
  Conclusion
</h2>

<p>This is not meant to be a tried and tested “AutoSuggest”, you can use “as-is” in a project. It's more a set of principles and ideas, so you can go ahead and make your own, customizing it to your needs: minimal or bloated with features!</p>

<p>More importantly, it's meant to show how a “native first”-approach, using built-in tags and their built-in functionality, can often result in much less JavaScript and less overhead.</p>

<p>I've made a <a href="https://github.com/madsstoumann/autosuggest" target="_blank" rel="noopener noreferrer">repository</a>, from where you can grab the demo-files. Open the folder in <em>VS Code</em>, and start it with <em>Live Server</em> or similar. <a href="https://madsstoumann.github.io/autosuggest/" target="_blank" rel="noopener noreferrer">Live demo here</a></p>
