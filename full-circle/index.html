		<article>
			<h1>Full Circle</h1>
			<p>Earlier this year, I helped a colleague setting up a solution, I'd worked on two years ago.</p>

<p>It was a "standard" webpack-setup, but the build failed, and she asked for my help.</p>

<p>I couldn't build the solution either. Many of the webpack-plugins had changed completely, and needed new configuration-code.</p>

<p><code>npm audit fix</code> also made sure some insecure dependencies were updated, which created further build-errors.</p>

<p>It took <strong>four hours</strong> to make the solution "buildable" again. I don't know how long it took her to do the simple CSS-fix, she had to do, but probably <strong>less</strong> than four hours!</p>

<p>This year, for all my own, small "hobby-projects", I ditched "the modern build" and went for something classic, but — in a sense — more modern approach:</p>

<ul>
<li><p>I split my JavaScript into multiple "micro" modules: a bunch of very small mjs-files. I created two folders: one with "common"-functions, and one with "global consts". Example: "isTouch" or "scrollPosition" — small pieces, I use across multiple projects)</p></li>
<li><p>I used <em>CSS Custom Properties</em> for <em>everything</em>, and found out, that in most cases the final output was significantly <strong>smaller</strong> than .scss-files, and "live-updatable" from JavaScript (using <code>.setProperty()</code>). <br>
As an example, look at these range sliders:</p></li>
</ul>

<p><iframe height="600" src="https://codepen.io/stoumann/embed/oNzgWMo?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
</p>

<p>All the properties are defined as <em>CSS Custom Properties</em>, so in order to completely change the look and feel of a slider, I just update a few variables.</p>

<ul>
<li><p>The HTML was either rendered inline or from template literals in JavaScript.</p></li>
<li><p>I setup the free version of Cloudflare for DNS (and caching). Here, I enabled HTTPS, HTTP2/3 as well as <em>minification!</em></p></li>
</ul>

<p>That's right, minified JavaScript, CSS and HTML <em>without</em> a build-tool! But Cloudflare has <em>many</em> more tools up its sleeve: You can set up workers handling cache on a granular level, or setup <em>secure headers</em>, if you want an <strong>A+</strong> in security at <a href="https://securityheaders.com/" target="_blank" rel="noopener noreferrer">securityheaders.com</a>.</p>

<p>Bonus: If I open any of these projects a couple of years from now, they will just <em>work!</em> No need to fix webpack or npm-issues.</p>


<hr>

<h2>
  <a name="and-the-result" href="#and-the-result">
  </a>
  And the result?
</h2>

<p><strong>Super-fast</strong> sites with these beautiful, green "100%" circles in Lighthouse, as you see in the cover-image for this article. The image is from a <em>huge</em> test-page with thousands of DOM-nodes.</p>

<p>I'm fully aware this will <em>never</em> work on a huge project with multiple developers, but I think it's important to know, that the web is <strong>still</strong> just HTML, CSS and JavaScript — and how important it is to know these really well.</p>

<p>Yes, there will be buzzwords and trends like MACH architecture, JamStack etc., but websites are <strong>still</strong> just HTML, CSS and JavaScript beneath it all!</p>

<p>Thanks for reading!</p>
