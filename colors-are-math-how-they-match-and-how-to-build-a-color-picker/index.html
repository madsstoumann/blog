		<article>
			<h1>Colors are Math: How they match — and how to build a Color Picker</h1>
			<p>Why do some color-combinations look better than others? Spoiler: it involves math.</p>

<p>The other day, I wrote about the <em>Color Theme Tool</em> on my <a href="https://dev.to/madsstoumann/creating-a-fun-fast-secure-and-sustainable-website-50nk">new website</a>.</p>

<p>This tool, along with some other color-tools, I'll introduce in this post, are all based on the <strong>HSL</strong> color-format. </p>

<p>HSL stands for <strong>H</strong>ue <strong>S</strong>aturation and <strong>L</strong>ightness.</p>

<p><strong>Hue</strong> is the main color — in degrees. <br>
If you look at the color-wheel, it's a series of colors, in 30° intervals:</p>

<p><a href="assets/634399/eb876882.jpg" class="article-body-image-wrapper"><img src="assets/634399/eb876882.jpg" alt="ColorWheel" loading="lazy" width="800" height="794"></a></p>

<p>In CSS, it's:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.wheel</span> <span class="p">{</span>
  <span class="nl">background</span><span class="p">:</span> <span class="n">conic-gradient</span><span class="p">(</span>
    <span class="n">hsl</span><span class="p">(</span><span class="m">0</span><span class="p">,</span> <span class="m">100%</span><span class="p">,</span> <span class="m">50%</span><span class="p">),</span> 
    <span class="n">hsl</span><span class="p">(</span><span class="m">30</span><span class="p">,</span> <span class="m">100%</span><span class="p">,</span> <span class="m">50%</span><span class="p">),</span> 
    <span class="n">hsl</span><span class="p">(</span><span class="m">60</span><span class="p">,</span> <span class="m">100%</span><span class="p">,</span> <span class="m">50%</span><span class="p">),</span> 
    <span class="n">hsl</span><span class="p">(</span><span class="m">90</span><span class="p">,</span> <span class="m">100%</span><span class="p">,</span> <span class="m">50%</span><span class="p">),</span> 
    <span class="n">hsl</span><span class="p">(</span><span class="m">120</span><span class="p">,</span> <span class="m">100%</span><span class="p">,</span> <span class="m">50%</span><span class="p">),</span> 
    <span class="n">hsl</span><span class="p">(</span><span class="m">150</span><span class="p">,</span> <span class="m">100%</span><span class="p">,</span> <span class="m">50%</span><span class="p">),</span> 
    <span class="n">hsl</span><span class="p">(</span><span class="m">180</span><span class="p">,</span> <span class="m">100%</span><span class="p">,</span> <span class="m">50%</span><span class="p">),</span> 
    <span class="n">hsl</span><span class="p">(</span><span class="m">210</span><span class="p">,</span> <span class="m">100%</span><span class="p">,</span> <span class="m">50%</span><span class="p">),</span> 
    <span class="n">hsl</span><span class="p">(</span><span class="m">240</span><span class="p">,</span> <span class="m">100%</span><span class="p">,</span> <span class="m">50%</span><span class="p">),</span> 
    <span class="n">hsl</span><span class="p">(</span><span class="m">270</span><span class="p">,</span> <span class="m">100%</span><span class="p">,</span> <span class="m">50%</span><span class="p">),</span> 
    <span class="n">hsl</span><span class="p">(</span><span class="m">300</span><span class="p">,</span> <span class="m">100%</span><span class="p">,</span> <span class="m">50%</span><span class="p">),</span> 
    <span class="n">hsl</span><span class="p">(</span><span class="m">330</span><span class="p">,</span> <span class="m">100%</span><span class="p">,</span> <span class="m">50%</span><span class="p">),</span>
    <span class="n">hsl</span><span class="p">(</span><span class="m">360</span><span class="p">,</span> <span class="m">100%</span><span class="p">,</span> <span class="m">50%</span><span class="p">)</span>
  <span class="p">);</span>
  <span class="nl">border-radius</span><span class="p">:</span> <span class="m">50%</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>

<p>To turn it into a horizontal or vertical slider, change the gradient-type to <code>linear-gradient</code>:</p>

<p><a href="assets/634399/6d145066.jpg" class="article-body-image-wrapper"><img src="assets/634399/6d145066.jpg" alt="LinearGradient" loading="lazy" width="800" height="55"></a></p>


<hr>

<h2>
  <a name="matching-colors" href="#matching-colors">
  </a>
  Matching Colors
</h2>

<p>When colors look great together, it's all down to how they <a href="https://www.tigercolor.com/color-lab/color-theory/color-harmonies.htm" target="_blank" rel="noopener noreferrer">relate to eachother</a> in the color-circle. </p>

<p>When you've selected a color (which we'll call the <strong>primary</strong> color), the color directly opposite that color (180° degrees), is called the <a href="https://en.wikipedia.org/wiki/Complementary_colors" target="_blank" rel="noopener noreferrer">complimentary</a> color – and these two colors always look great together.</p>

<p>Let's split our HSL up into 3 CSS Custom Properties:</p>

<p><code>--h</code>, <code>--s</code> and <code>--l</code>.</p>

<p>– and look at how we can use simple math to <code>calc</code> colors, that match our  <strong>primary</strong> color:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.primary</span> <span class="p">{</span>
  <span class="err">hsl(var(--h),</span> <span class="err">var(--s),</span> <span class="err">var(--l));</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

</svg>

</div>
</div>
</div>



<p>The <strong>complimentary</strong> color adds 180° to <code>--h</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.complimentary</span> <span class="p">{</span>
  <span class="err">hsl(calc(var(--h)</span> <span class="err">+</span> <span class="err">180),</span> <span class="err">var(--s),</span> <span class="err">var(--l));</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">

</svg>

</div>
</div>
</div>

<span class="p">}</span>
<span class="nc">.splitcom1</span> <span class="p">{</span>

<p><strong>Analogous colors</strong> are the colors next to the selected color (both sides) – in this case our <strong>primary</strong> color:<br>

  <span class="err">hsl(calc(var(--h)</span> <span class="err">-</span> <span class="err">30),</span> <span class="err">var(--s),</span> <span class="err">var(--l));</span>

<h3>
  <a name="shades" href="#shades">
  </a>
  Shades
</h3>

<p>Shades removes light from the <code>--l</code> – lightness:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.shade10</span> <span class="p">{</span>
  <span class="err">hsl(var(--h),</span> <span class="err">var(--s),</span> <span class="err">calc(var(--l)</span> <span class="err">-</span> <span class="err">((100%</span> <span class="err">-</span> <span class="err">var(--l))</span> <span class="err">/</span> <span class="err">10)</span> <span class="err">*</span> <span class="err">1));</span>
<span class="p">}</span>
<span class="nc">.shade20</span> <span class="p">{</span>
  <span class="py">--c-sh2</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--h</span><span class="p">),</span> <span class="n">var</span><span class="p">(</span><span class="n">--s</span><span class="p">),</span> <span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--l</span><span class="p">)</span> <span class="n">-</span> <span class="p">((</span><span class="m">100%</span> <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--l</span><span class="p">))</span> <span class="p">/</span> <span class="m">10</span><span class="p">)</span> <span class="err">*</span> <span class="m">2</span><span class="p">));</span>
<span class="p">}</span>
<span class="c">/* etc. */</span>
</code></pre>

<p>All these CSS <code>calc</code>ulated -colors, are what I'm using in my <em>CSS Color Theme Tool</em>, based on the <code>--h</code>, <code>--s</code> and <code>--l</code> properties:</p>

<p><a href="assets/634399/98ea681d.jpg" class="article-body-image-wrapper"><img src="assets/634399/98ea681d.jpg" alt="ColorTheme" loading="lazy" width="800" height="762"></a></p>

<p>Now, let's look at how to build a Color Picker.</p>


<hr>

<h2>
  <a name="hsl-color-picker" href="#hsl-color-picker">
  </a>
  HSL Color Picker
</h2>

<p>All it takes to create a simple, HSL-based Color Picker, is three <code>&lt;input type="range"&gt;</code>-controls, one for each of the CSS Custom Properties: <code>--h</code>, <code>--s</code> and <code>--l</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;form</span> <span class="na">id=</span><span class="s">"hsl"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;input</span> <span class="na">type=</span><span class="s">"range"</span> <span class="na">name=</span><span class="s">"--h"</span> <span class="na">min=</span><span class="s">"0"</span> <span class="na">max=</span><span class="s">"360"</span> <span class="na">value=</span><span class="s">"0"</span> <span class="nt">/&gt;</span>
  <span class="nt">&lt;input</span> <span class="na">type=</span><span class="s">"range"</span> <span class="na">name=</span><span class="s">"--s"</span> <span class="na">min=</span><span class="s">"0"</span> <span class="na">max=</span><span class="s">"100"</span> <span class="na">value=</span><span class="s">"100"</span> <span class="na">data-suffix=</span><span class="s">"%"</span> <span class="nt">/&gt;</span>
  <span class="nt">&lt;input</span> <span class="na">type=</span><span class="s">"range"</span> <span class="na">name=</span><span class="s">"--l"</span> <span class="na">min=</span><span class="s">"0"</span> <span class="na">max=</span><span class="s">"100"</span> <span class="na">value=</span><span class="s">"50"</span> <span class="na">data-suffix=</span><span class="s">"%"</span> <span class="nt">/&gt;</span>
  <span class="nt">&lt;div</span> <span class="na">class=</span><span class="s">"hsl"</span><span class="nt">&gt;&lt;/div&gt;</span>
<span class="nt">&lt;/form&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>

</svg>

</div>
</div>
</div>



<p>In CSS, style the sliders as you want, and assign the calculated HSL-color to the <em>color preview</em>, the <code>&lt;div class="hsl"&gt;</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.hsl</span> <span class="p">{</span>
  <span class="py">aspect-ratio</span><span class="p">:</span> <span class="m">1</span><span class="p">/</span><span class="m">1</span><span class="p">;</span>
  <span class="nl">background-color</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--h</span><span class="p">,</span><span class="m">0</span><span class="p">),</span> <span class="n">var</span><span class="p">(</span><span class="n">--s</span><span class="p">,</span><span class="m">100%</span><span class="p">),</span> <span class="n">var</span><span class="p">(</span><span class="n">--l</span><span class="p">,</span> <span class="m">50%</span><span class="p">));</span>
  <span class="nl">width</span><span class="p">:</span> <span class="m">20rem</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Finally, in JavaScript, add a single eventListener on the <em>form</em>, that'll update the CSS Custom Properties:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nx">hsl</span><span class="p">.</span><span class="nf">addEventListener</span><span class="p">(</span><span class="dl">'</span><span class="s1">input</span><span class="dl">'</span><span class="p">,</span> <span class="p">(</span><span class="nx">event</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">input</span> <span class="o">=</span> <span class="nx">event</span><span class="p">.</span><span class="nx">target</span><span class="p">;</span>
<span class="nb">document</span><span class="p">.</span><span class="nx">documentElement</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nf">setProperty</span><span class="p">(</span><span class="nx">input</span><span class="p">.</span><span class="nx">name</span><span class="p">,</span> <span class="s2">`</span><span class="p">${</span><span class="nx">input</span><span class="p">.</span><span class="nx">valueAsNumber</span><span class="p">}${</span><span class="nx">input</span><span class="p">.</span><span class="nx">dataset</span><span class="p">.</span><span class="nx">suffix</span><span class="o">||</span><span class="dl">''</span><span class="p">}</span><span class="s2">`</span><span class="p">)</span>
<span class="p">})</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>

<hr>

<h2>
  <a name="bonus-hsb-color-picker" href="#bonus-hsb-color-picker">
  </a>
  Bonus: HSB Color Picker
</h2>

<p><a href="assets/634399/9914e61a.jpg" class="article-body-image-wrapper"><img src="assets/634399/9914e61a.jpg" alt="Photoshop" loading="lazy" width="800" height="528"></a></p>

<p>The main area in Photoshop's Color Picker, is made of three layers, and is way easier to understand, if you look at the <strong>HSB</strong>-format.</p>

<p>The <strong>B</strong> is for <strong>Brightness</strong>, and use a slightly different algorithm than the <strong>L</strong>ightness of HSL.</p>

<p>If you look at the HSB-area as a coordinate-system, <strong>Saturation</strong> is the <strong>x-axis</strong> (left-ro-right, 0 to 100) and <strong>Brightness</strong> is the <strong>y-axis</strong> (bottom-to-top, 0 to 100).</p>

<p>Thus, the top-right position is <code>100, 100</code> and the bottom-left <code>0, 0</code>.</p>

<p>To re-create this in HTML and CSS, use three layers:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;div</span> <span class="na">class=</span><span class="s">"hue"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;div</span> <span class="na">class=</span><span class="s">"brightness"</span><span class="nt">&gt;&lt;/div&gt;</span>
  <span class="nt">&lt;div</span> <span class="na">class=</span><span class="s">"saturation"</span><span class="nt">&gt;&lt;/div&gt;</span>
<span class="nt">&lt;/div&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>





<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.hue</span> <span class="p">{</span>
  <span class="py">--h</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="nl">background-color</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--h</span><span class="p">),</span> <span class="m">100%</span><span class="p">,</span> <span class="m">50%</span><span class="p">);</span>
<span class="p">}</span>

<span class="nc">.saturation</span> <span class="p">{</span>
  <span class="nl">background-image</span><span class="p">:</span> <span class="n">linear-gradient</span><span class="p">(</span><span class="n">to</span> <span class="nb">bottom</span><span class="p">,</span> <span class="nb">transparent</span><span class="p">,</span> <span class="n">hsl</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--h</span><span class="p">),</span> <span class="m">0%</span><span class="p">,</span> <span class="m">0%</span><span class="p">));</span>
<span class="p">}</span>

<span class="nc">.brightness</span> <span class="p">{</span>
  <span class="nl">background-image</span><span class="p">:</span> <span class="n">linear-gradient</span><span class="p">(</span><span class="n">to</span> <span class="nb">right</span><span class="p">,</span> <span class="n">hsl</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--h</span><span class="p">),</span> <span class="m">100%</span><span class="p">,</span> <span class="m">100%</span><span class="p">),</span> <span class="nb">transparent</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The <code>.saturation</code> and <code>.brightness</code>-layers need to be positioned <code>absolute</code>, relative to the <code>hue</code>-layer. </p>

<p>The CSS does not reflect the <em>actual</em> saturation and brightness, but layered like this, the illusion is complete:</p>

<p><a href="assets/634399/1ec15978.jpg" class="article-body-image-wrapper"><img src="assets/634399/1ec15978.jpg" alt="SaturationBrightness" loading="lazy" width="800" height="800"></a></p>

<p>Try changing the value of <code>--h</code>.</p>

<p>If you want to build a Photoshop-like color-picker in JavaScript, detect the <strong>x</strong> and <strong>y</strong>-position of the pointer-device, use <code>getBoundingClientRect()</code> to get the dimensions of the »picker area«, and convert it, so you'll always get a coordinate between <code>0,0</code> and <code>100,100</code>. </p>

<p>Again: <code>x</code> equals <strong>Saturation</strong> and <code>y</code> equals <strong>Brightness</strong>.</p>

<p>You'll also have to convert HSB to HSL(with JavaScript), as browsers don't understand the HSB-format.</p>

<p>So ... I think HSL-based color-pickers are easier to both code and use!</p>

<p>Thanks for reading!</p>
