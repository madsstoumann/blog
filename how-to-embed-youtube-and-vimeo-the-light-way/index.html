		<article>
			<h1>How to embed YouTube and Vimeo the light way</h1>
			<p>You've probably embedded YouTube and Vimeo-videos dozens of times, using the standard <code>&lt;iframe&gt;</code>-embed-code.</p>

<p>While this works great out-of-the-box, services like Youtube loads <strong>a lot of Javascript</strong>, even if your users do not click on the embedded video.</p>

<p>I did a test with 3 embedded YouTube-videos. In this case, more than <strong>one megabyte</strong> of extra data was loaded. </p>

<p>That's a lot of unnecessary bandwidth. We can do better!</p>


<hr>

<h2>
  <a name="lite-loaders" href="#lite-loaders">
  </a>
  Lite Loaders
</h2>

<p>There are a lot of "lite loaders" out there, like <a href="https://github.com/justinribeiro/lite-youtube" target="_blank" rel="noopener noreferrer">lite-youtube</a> or <a href="https://github.com/paulirish/lite-youtube-embed" target="_blank" rel="noopener noreferrer">lite-youtube-embed</a>.</p>

<p>If you're in a hurry, just <code>npm install</code> one of these. </p>

<p>Otherwise, hang on — it can be even lighter!</p>


<hr>

<h2>
  <a name="the-manual-way" href="#the-manual-way">
  </a>
  The Manual Way
</h2>

<p>We want to prevent YouTube or Vimeo loading <strong>anything</strong>, so we'll add the thumbnail-image for the video manually.</p>

<p>YouTube has an image-service, <code>ytimg.com</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;img</span> <span class="na">loading=</span><span class="s">"lazy"</span> <span class="na">src=</span><span class="s">"https://i.ytimg.com/vi/[VIDEOID]/hqdefault.jpg"</span><span class="nt">&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The important part here is the [VIDEOID]. Replace this with the actual id.</p>


<hr>

<p>Vimeo does not have a service like this, but we can use the (free for now) <a href="https://vumbnail.com" target="_blank" rel="noopener noreferrer">Vumbnail</a>-service:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;img</span> <span class="na">loading=</span><span class="s">"lazy"</span> <span class="na">src=</span><span class="s">"vumbnail.com/[VIDEOID].jpg"</span><span class="nt">&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><a href="https://vumbnail.com" target="_blank" rel="noopener noreferrer">Vumbnail</a> detects the video-provider automatically from the id/src.</p>

<p>Cool! Now, let's add a wrapper around the image, where we'll also add a dummy <code>&lt;iframe&gt;</code> and a play-<code>&lt;button&gt;</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;youtube-embed&gt;</span>
  <span class="nt">&lt;img</span> <span class="na">loading=</span><span class="s">"lazy"</span> <span class="na">src=</span><span class="s">"https://i.ytimg.com/vi/[VIDEOID]/hqdefault.jpg"</span> <span class="na">alt=</span><span class="s">"Video Description"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;iframe</span> <span class="na">allow=</span><span class="s">"autoplay"</span> <span class="na">src=</span><span class="s">""</span> <span class="na">data-src=</span><span class="s">"https://www.youtube.com/embed/[VIDEOID]?autoplay=1"</span><span class="nt">&gt;&lt;/iframe&gt;</span>
  <span class="nt">&lt;button</span> <span class="na">aria-label=</span><span class="s">"Play video"</span><span class="nt">&gt;&lt;/button&gt;</span>
<span class="nt">&lt;/youtube-embed&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>It does not have to be a custom element, it's just a bit more readable, and we can use <code>&lt;vimeo-embed&gt;</code> for Vimeo-videos.</p>


<hr>

<h2>
  <a name="styling" href="#styling">
  </a>
  Styling
</h2>

<p>For styling, we're going to use our custom elements tags directly, instead of <code>class</code>’es:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:is</span><span class="o">(</span><span class="nt">vimeo-embed</span><span class="o">,</span> <span class="nt">youtube-embed</span><span class="o">)</span> <span class="p">{</span>
  <span class="py">aspect-ratio</span><span class="p">:</span> <span class="m">16</span> <span class="p">/</span> <span class="m">9</span><span class="p">;</span>
  <span class="nl">border-radius</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--video-embed-bdrs</span><span class="p">,</span> <span class="m">0.25em</span><span class="p">);</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">grid</span><span class="p">;</span>
  <span class="py">inline-size</span><span class="p">:</span> <span class="m">100%</span><span class="p">;</span>
  <span class="nl">position</span><span class="p">:</span> <span class="nb">relative</span><span class="p">;</span>
<span class="p">}</span>
<span class="nd">:is</span><span class="o">(</span><span class="nt">vimeo-embed</span><span class="o">,</span> <span class="nt">youtube-embed</span><span class="o">)</span> <span class="nd">:is</span><span class="o">(</span><span class="nt">iframe</span><span class="o">,</span> <span class="nt">img</span><span class="o">)</span> <span class="p">{</span> 
  <span class="py">block-size</span><span class="p">:</span> <span class="m">100%</span><span class="p">;</span>
  <span class="nl">border</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="nl">border-radius</span><span class="p">:</span> <span class="nb">inherit</span><span class="p">;</span>
  <span class="py">inline-size</span><span class="p">:</span> <span class="m">100%</span><span class="p">;</span>
  <span class="py">inset</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="nl">object-fit</span><span class="p">:</span> <span class="n">cover</span><span class="p">;</span>
  <span class="nl">position</span><span class="p">:</span> <span class="nb">absolute</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

<p>For the play-button, we'll add a bunch of <em>CSS Custom Properties</em> — allowing us to easily change colors etc:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:is</span><span class="o">(</span><span class="nt">vimeo-embed</span><span class="o">,</span> <span class="nt">youtube-embed</span><span class="o">)</span> <span class="nt">button</span> <span class="p">{</span>
  <span class="nl">background-color</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--button-bgc</span><span class="p">,</span> <span class="m">#F00</span><span class="p">);</span>
  <span class="py">block-size</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--button-h</span><span class="p">,</span> <span class="m">50px</span><span class="p">);</span>
  <span class="nl">border</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="nl">border-radius</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--button-bdrs</span><span class="p">,</span> <span class="m">14%</span><span class="p">);</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">grid</span><span class="p">;</span>
  <span class="py">inline-size</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--button-w</span><span class="p">,</span> <span class="m">75px</span><span class="p">);</span>
  <span class="nl">opacity</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--button-op</span><span class="p">,</span> <span class="m">0.8</span><span class="p">);</span>
  <span class="nl">position</span><span class="p">:</span> <span class="nb">absolute</span><span class="p">;</span>
  <span class="py">place-self</span><span class="p">:</span> <span class="nb">center</span><span class="p">;</span>
  <span class="nl">transition</span><span class="p">:</span> <span class="n">all</span> <span class="m">.2s</span> <span class="n">ease-in</span><span class="p">;</span>
<span class="p">}</span>
<span class="nd">:is</span><span class="o">(</span><span class="nt">vimeo-embed</span><span class="o">,</span> <span class="nt">youtube-embed</span><span class="o">)</span> <span class="nt">button</span><span class="nd">::before</span> <span class="p">{</span>
  <span class="py">aspect-ratio</span><span class="p">:</span> <span class="m">1</span><span class="p">;</span>
  <span class="nl">background</span><span class="p">:</span> <span class="m">#FFF</span><span class="p">;</span>
  <span class="py">block-size</span><span class="p">:</span> <span class="m">1.5em</span><span class="p">;</span>
  <span class="nl">clip-path</span><span class="p">:</span> <span class="n">polygon</span><span class="p">(</span><span class="m">20%</span> <span class="m">0%</span><span class="p">,</span> <span class="m">20%</span> <span class="m">100%</span><span class="p">,</span> <span class="m">100%</span> <span class="m">50%</span><span class="p">);</span>
  <span class="nl">content</span><span class="p">:</span> <span class="s2">''</span><span class="p">;</span>
  <span class="py">place-self</span><span class="p">:</span> <span class="nb">center</span><span class="p">;</span>
<span class="p">}</span>

<span class="nt">vimeo-embed</span> <span class="nt">button</span> <span class="p">{</span> <span class="py">--button-bgc</span><span class="p">:</span> <span class="m">#00adef</span><span class="p">;</span> <span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

<p>To hide the play-button when the <code>&lt;iframe&gt;</code> is loaded, we'll check if the <code>src</code>-attribute contains something else than an empty string:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nd">:is</span><span class="o">(</span><span class="nt">vimeo-embed</span><span class="o">,</span> <span class="nt">youtube-embed</span><span class="o">)</span> <span class="nt">iframe</span><span class="nd">:not</span><span class="o">([</span><span class="nt">src</span><span class="o">=</span><span class="s1">""</span><span class="o">])</span> <span class="o">+</span> <span class="nt">button</span> <span class="p">{</span>
  <span class="nl">display</span><span class="p">:</span> <span class="nb">none</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

<hr>

<p>Now, to load the <strong>real</strong> <code>&lt;iframe&gt;</code>, all we have to do is replace <code>src</code> with <code>data-src</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nb">document</span><span class="p">.</span><span class="nf">querySelectorAll</span><span class="p">(</span><span class="dl">'</span><span class="s1">:is(vimeo-embed, youtube-embed) button</span><span class="dl">'</span><span class="p">).</span><span class="nf">forEach</span><span class="p">(</span><span class="nx">button</span> <span class="o">=&gt;</span> <span class="nx">button</span><span class="p">.</span><span class="nf">addEventListener</span><span class="p">(</span><span class="dl">'</span><span class="s1">click</span><span class="dl">'</span><span class="p">,</span> <span class="p">()</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">video</span> <span class="o">=</span> <span class="nx">button</span><span class="p">.</span><span class="nx">previousElementSibling</span><span class="p">;</span>
  <span class="nx">video</span><span class="p">.</span><span class="nx">src</span> <span class="o">=</span> <span class="nx">video</span><span class="p">.</span><span class="nx">dataset</span><span class="p">.</span><span class="nx">src</span><span class="p">;</span>
<span class="p">}))</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And that's it! We've replaced one megabyte of data with a few bytes.</p>

  <a name="the-javascript-way" href="#the-javascript-way">

</div>
</div>



<p>All we need is the <code>id</code> of the video and a <code>title</code> for the thumbnail <code>alt</code>-attribute. Then in JavaScript, we can create the <code>&lt;img&gt;</code> and <code>&lt;button&gt;</code>-elements:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nb">document</span><span class="p">.</span><span class="nf">querySelectorAll</span><span class="p">(</span><span class="dl">'</span><span class="s1">vimeo-embed, youtube-embed</span><span class="dl">'</span><span class="p">).</span><span class="nf">forEach</span><span class="p">(</span><span class="nx">v</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="p">[</span><span class="nx">poster</span><span class="p">,</span> <span class="nx">src</span><span class="p">]</span> <span class="o">=</span> <span class="nx">v</span><span class="p">.</span><span class="nx">tagName</span> <span class="o">===</span> <span class="dl">'</span><span class="s1">VIMEO-EMBED</span><span class="dl">'</span> <span class="p">?</span>
    <span class="p">[</span><span class="s2">`vumbnail.com/</span><span class="p">${</span><span class="nx">v</span><span class="p">.</span><span class="nx">id</span><span class="p">}</span><span class="s2">.jpg`</span><span class="p">,</span> <span class="dl">'</span><span class="s1">player.vimeo.com/video</span><span class="dl">'</span><span class="p">]</span> <span class="p">:</span>
    <span class="p">[</span><span class="s2">`i.ytimg.com/vi/</span><span class="p">${</span><span class="nx">v</span><span class="p">.</span><span class="nx">id</span><span class="p">}</span><span class="s2">/hqdefault.jpg`</span><span class="p">,</span> <span class="dl">'</span><span class="s1">www.youtube.com/embed</span><span class="dl">'</span><span class="p">];</span>

  <span class="nx">v</span><span class="p">.</span><span class="nx">innerHTML</span> <span class="o">=</span> <span class="s2">`&lt;img loading="lazy" src="https://</span><span class="p">${</span><span class="nx">poster</span><span class="p">}</span><span class="s2">" alt="</span><span class="p">${</span><span class="nx">v</span><span class="p">.</span><span class="nx">title</span><span class="p">}</span><span class="s2">"&gt;&lt;button aria-label="Play"&gt;&lt;/button&gt;`</span><span class="p">;</span>
  <span class="nx">v</span><span class="p">.</span><span class="nx">children</span><span class="p">[</span><span class="mi">1</span><span class="p">].</span><span class="nf">addEventListener</span><span class="p">(</span><span class="dl">'</span><span class="s1">click</span><span class="dl">'</span><span class="p">,</span> <span class="p">()</span> <span class="o">=&gt;</span> <span class="nx">v</span><span class="p">.</span><span class="nx">innerHTML</span> <span class="o">=</span> <span class="s2">`&lt;iframe allow="autoplay" src="https://</span><span class="p">${</span><span class="nx">src</span><span class="p">}</span><span class="s2">/</span><span class="p">${</span><span class="nx">v</span><span class="p">.</span><span class="nx">id</span><span class="p">}</span><span class="s2">?autoplay=1"&gt;&lt;/iframe&gt;`</span><span class="p">)</span>
<span class="p">})</span>
</code></pre>
