			<h1>The Frontend Agency</h1>
			<p>After 7 years working as a <em>Technical Director</em> for Valtech, I've decided to go freelance … again (I was self-employeed for 15 years before Valtech)! </p>

<p>A new role requires … a new company <strong>and</strong> a new website!</p>

<p>I've just returned from my summer holidays, so the website is still <em>work-in-progress</em> and so far it has <strong>no content</strong>, but it <strong>does</strong> have some features, you can have fun playing around with!</p>

<p>Therefore, I've decided to do an “early release”.</p>

<p>Go to <a href="https://thefrontend.agency" target="_blank" rel="noopener noreferrer">thefrontend.agency</a> and click on the spinning cog-wheel at the top left corner:</p>

<p><a href="assets/784934/8f02dff2.jpg" class="article-body-image-wrapper"><img src="assets/784934/8f02dff2.jpg" alt="The Frontend Agency Editor" loading="lazy" width="800" height="534"></a></p>

<ul>
<li>Do you prefer polygons over blobs?</li>
<li>Less or more shapes?</li>
<li>Slow animations, fast animations … or <strong>no</strong> animations?</li>
</ul>

<p>Try to drag the color-slider at the top of the page, and then play arund with <code>saturation</code>, <code>lightness</code> and <code>opacity</code>.</p>

<p>In the upcoming version of Safari, you can specify a <code>theme-color</code> – and you can use <em>CSS Custom Properties</em> with it:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;meta</span> <span class="na">name=</span><span class="s">"theme-color"</span> <span class="na">content=</span><span class="s">"hsl(var(--h, 192), var(--s, 40%), var(--l, 25%))"</span><span class="nt">&gt;</span>
</code></pre>

<p>Notice how the main browser window/address-bar now has the same <code>background-color</code> as the main page:</p>

<p><a href="assets/784934/5492b651.jpg" class="article-body-image-wrapper"><img src="assets/784934/5492b651.jpg" alt="Safari Theme" loading="lazy" width="800" height="366"></a> </p>

<p>Then, if you drag the color-slider, notice how <em>both</em> the <code>background-color</code> <em>and</em> the <code>theme-color</code> change:</p>

<p><a href="assets/784934/2d65798d.jpg" class="article-body-image-wrapper"><img src="assets/784934/2d65798d.jpg" alt="Safari Theme Modified" loading="lazy" width="800" height="370"></a></p>

<p>I think this is pretty cool – let's hope other browser-vendors implements this as well!</p>

<hr>

<p>Now, typically, I'd never release “half-baked” code, but in this case, I had to release <em>something</em> – and I'm really looking forward to your comments, suggestions etc.</p>

<hr>
<h2>
  <a name="the-logo" href="#the-logo">
  </a>
  The Logo
</h2>

<p>The logo is handdrawn by Danish illustrator, Rasmus Meisler. </p>

<p>Last year, he drew one of the most <a href="https://fantask.dk/browse.asp?category=comics&amp;aid=4731" target="_blank" rel="noopener noreferrer">beautiful comic books</a>, I've ever seen:</p>

<p><a href="assets/784934/136ddc62.jpg" class="article-body-image-wrapper"><img src="assets/784934/136ddc62.jpg" alt="den-magiske-spinel-2605502" loading="lazy" width="500" height="669"></a></p>

<p><a href="https://www.rasmusmeisler.dk/weekendavisen" target="_blank" rel="noopener noreferrer">Take a look</a> at some of his amazing illustrations for the danish paper <em>Weekendavisen</em>, too.</p>

<p>Rasmus actually sent me a whole bunch of sketches and ideas for the logo:</p>

<p><a href="assets/784934/04df59e6.jpg" class="article-body-image-wrapper"><img src="assets/784934/04df59e6.jpg" alt="Logo sketches" loading="lazy" width="800" height="292"></a></p>

<p>I like them all, but ended up picking “the agent”, as in “agen(t)-cy”!</p>
