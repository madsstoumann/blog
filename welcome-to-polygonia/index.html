		<article>
			<h1>Welcome to Polygonia</h1>
			<p>Four years ago, for a brief period of time, I went to <em>the dark side</em>.<br />
Yes, I&#8217;m not proud to admit it, but I actually wrote a <em>jQuery-plugin: jPolygon!</em><br />
These days <del>I <em>only</em> write Vanilla JS</del> &#8212; I write whatever I&#8217;m told to write!</p>
<p>Anyway, the old jQuery-plugin has been updated to Vanilla JS. A bunch of new features have been added &#8212; and, most important: I&#8217;ve added the ability to save and view the output as SVG.</p>
<p><img loading="lazy" src="assets/wp-357/3515af1d.jpg" alt="screenshot" width="615" height="557" /></p>
<p>As the plugin/app utilizes a bunch of new(er) HTML5-elements, such as:</p>
<pre class="brush: xml; title: ; notranslate" title="">
&lt;input type=&quot;range&quot;&gt;
&lt;input type=&quot;color&quot;&gt;
&lt;input type=&quot;number&quot;&gt;
&lt;details&gt;&lt;summary&gt;Fold-Out Stuff&lt;/summary&gt;&lt;/details&gt;
</pre>
<p>&#8212;I recommend using Google Chrome.</p>
<p>Kudos must go to my good &#8216;ol friend, Torben, who helped with the math behind the original function for calculating points in a polygon: a beautiful, 10-line function that does all the hard work.</p>
<p>So, go ahead and create some polygons!<br />
If you need &#8220;tactical elements&#8221;, such as a splash like <em>&#8220;Save 10%&#8221;</em>, it looks <em>so much better</em> with SVG than, say PNG, on a retina-display.</p>
<p>If you <em>do want a PNG</em>, however, there&#8217;s also a big green button, &#8220;Generate PNG&#8221;, just for that.</p>
<p><a title="Polygonia" href="http://www.stoumann.dk/examples/polygon/" target="_blank">Click here to see a live demo!</a></p>
<p>To view, edit or fumble with the code, go to the <a href="http://github.com/madsstoumann/vanilla/tree/master/polygonia" target="_blank">Github-page</a>.</p>
