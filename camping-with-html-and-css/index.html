<h2>
  <a name="what-i-built" href="#what-i-built">
  </a>
  What I Built
</h2>

<p>This challenge is about spicing up some markup with styles.</p>

<p>I added a few things to the <code>&lt;select&gt;</code>-element:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;select</span> <span class="na">required</span><span class="nt">&gt;</span>

  <span class="nt">&lt;hr&gt;</span>
<span class="nt">&lt;/select&gt;</span>
</code></pre>

<p>Adding <code>required</code> will trigger the browsers built-in validation, and by setting the default <code>&lt;option&gt;</code> to <code>selected disabled</code> and with an empty <code>value</code>, we make sure that it's selected by default, but not “re-selectable”. </p>

<p>Thus if you try to submit the form, you'll submit an empty value for a <strong>required</strong> field, and trigger the validation.</p>

<p>The <code>&lt;hr&gt;</code> is a recent addition to <code>&lt;select&gt;</code>, allowing us to group stuff in a simpler and nicer way:</p>

<p><a href="assets/1797286/cc89a7ad.jpg" class="article-body-image-wrapper"><img src="assets/1797286/cc89a7ad.jpg" alt="hr" loading="lazy" width="333" height="147"></a></p>

<p>But let's start with a CodePen demo, and then look into the CSS:</p>

<h2>
  <a name="journey" href="#journey">
  </a>
  Journey
</h2>

<p>It's a super-simple design. Both the <code>&lt;section&gt;</code>and the <code>&lt;form&gt;</code> are <em>grids</em>. I added a <code>background-image</code> to the <code>&lt;section&gt;</code> — and because text-on-images can be hard to read, I added <code>text-shadow</code> to the text.</p>

<p>I added <code>text-wrap: pretty</code> to the headline, and <code>text-wrap: balance</code> to labels. This is a relative new addition to CSS, and I <em>love</em> it! No more long-text-wraps-or-breaks woes.</p>

<p>The <code>&lt;select&gt;</code> looks funky in Safari, so I used <code>appearance: none</code> to style it. Unfortunately, the "drop-down-arrow" disappears when you remove the default styling, so I added my own: an SVG-icon as a <code>url()</code>.</p>

<p>I did a small tool a while ago to help you convert SVG's to <code>url()</code>:</p>

<p><iframe height="600" src="https://codepen.io/stoumann/embed/ZEpERMp?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
</p>

<p>Finally, I added <code>:focus-visible</code> and <code>:hover</code>-styles, and a <em>very</em> basic JavaScript to handle submit.</p>
