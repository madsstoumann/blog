			<h1>KAOSS! Fun with Web Audio</h1>
			<p>I used to carry my “Korg Kaossilator” around with me. For those of you who don't know what that is – it's a small, portable synthesizer, with a large, touch-based XY-controller:</p>

<p><a href="assets/811340/3a464af4.jpg" class="article-body-image-wrapper"><img src="assets/811340/3a464af4.jpg" alt="kaossilator" loading="lazy" width="800" height="952"></a></p>

<p>This week, I've been working on a generic XY-controller – for both pointer-devices and keyboards:</p>

<p><a href="assets/811340/68b25f92.jpg" class="article-body-image-wrapper"><img src="assets/811340/68b25f92.jpg" alt="xypad" loading="lazy" width="800" height="834"></a></p>

<p>It was meant to be for a “Color Picker”, but I ended up making <strong>this</strong> instead:</p>

<p><iframe height="600" src="https://codepen.io/stoumann/embed/BaZzyWO?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
</p>

<p>I'm working on a larger article about XY-controllers, where I <strong>will</strong> showcase the “Color Picker” – but for now, please have fun with the simplified, JavaScript-version of “Kaossilator”!</p>

<p>The XY-controller is still <em>work-in-progress</em>, so I haven't added scroll-position-fixes to the script yet. Please <a href="https://codepen.io/stoumann/full/BaZzyWO" target="_blank" rel="noopener noreferrer">open it in fullscreen-mode on Codepen</a>, to avoid scrolling within the iframe.</p>


<hr>

<h2>
  <a name="keyboarduser" href="#keyboarduser">
  </a>
  Keyboard-user?
</h2>

<p>The XY-Controller can also be operated with a keyboard.</p>

<p>When the point-ring has focus, press <code>Space</code> to toggle the sound on or off, and use the <code>Arrow</code>-keys to move around. </p>

<p>Press and hold <code>Shift</code> while using the <code>Arrow</code>-keys, to move the point-ring with a larger increment.</p>


<hr>

<p>Pick the Sine-wave (first) and “allpass”, if you want to play the theme from “Doctor Who” 😁</p>

<p>Happy jamming!</p>
