		<article>
			<h1>A simple Color-Picker using CSS5 color-contrast() and color-mix()</h1>
			<p>Safari is often blamed for being “the new IE of web-browsers”. That's not fair, because Safari has recently been a “first-mover” in a lot of areas. For instance, <em>Safari Technology Preview</em> has implemented a lot of the stuff from the <a href="https://www.w3.org/TR/css-color-5" target="_blank" rel="noopener noreferrer">CSS Color Module Level 5</a> specification – <code>color-contrast()</code> and <code>color-mix()</code> among them.</p>

<p>Let's build a simple <em>Color Picker</em> using these cool new features! We'll add some JavaScript, using <code>CSS.supports</code>, to make it work in other browsers as well.</p>

<p>The markup is a simple <code>fieldset</code> with radio-buttons:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;fieldset</span> <span class="na">class=</span><span class="s">"color-wrapper"</span><span class="nt">&gt;</span>
 <span class="c">&lt;!-- start iterate colors --&gt;</span>
  <span class="nt">&lt;label</span> <span class="na">class=</span><span class="s">"color"</span> <span class="na">style=</span><span class="s">"--bgc:hsl(168, 41%, 65%)"</span><span class="nt">&gt;</span>
    <span class="nt">&lt;input</span> <span class="na">type=</span><span class="s">"radio"</span> <span class="na">name=</span><span class="s">"cp"</span> <span class="na">value=</span><span class="s">"hsl(168, 41%, 65%)"</span><span class="nt">&gt;&lt;i&gt;&lt;/i&gt;</span>
  <span class="nt">&lt;/label&gt;</span>
<span class="c">&lt;!-- end iterate colors --&gt;</span>
<span class="nt">&lt;/fieldset&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>We'll set a custom property, <code>--bgc</code>, for each color, and with a dash of CSS, this it how it renders in Chrome:</p>

<p><a href="assets/800474/9546fb92.jpg" class="article-body-image-wrapper"><img src="assets/800474/9546fb92.jpg" alt="Chrome Basic" loading="lazy" width="636" height="188"></a> </p>


<hr>

<h2>
  <a name="using-a-raw-mask-endraw-for-selected-color" href="#using-a-raw-mask-endraw-for-selected-color">
  </a>
  Using a <code>mask()</code> for selected color
</h2>

<p>We'll add a mask with a checkmark-icon to the <code>&lt;i&gt;&lt;/i&gt;</code>-element:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.color</span> <span class="nt">i</span> <span class="p">{</span>
  <span class="py">aspect-ratio</span><span class="p">:</span> <span class="m">1</span><span class="p">;</span>
  <span class="nl">background-color</span><span class="p">:</span> <span class="nb">transparent</span><span class="p">;</span>
  <span class="nl">display</span><span class="p">:</span> <span class="nb">block</span><span class="p">;</span>
  <span class="nl">mask</span><span class="p">:</span> <span class="nb">no-repeat</span> <span class="nb">center</span> <span class="nb">center</span><span class="p">/</span><span class="n">var</span><span class="p">(</span><span class="n">--ico-w</span><span class="p">)</span> <span class="n">var</span><span class="p">(</span><span class="n">--ico</span><span class="p">);</span>
  <span class="nl">-webkit-mask</span><span class="p">:</span> <span class="nb">no-repeat</span> <span class="nb">center</span> <span class="nb">center</span><span class="p">/</span><span class="n">var</span><span class="p">(</span><span class="n">--ico-w</span><span class="p">)</span> <span class="n">var</span><span class="p">(</span><span class="n">--ico</span><span class="p">);</span>
  <span class="nl">width</span><span class="p">:</span> <span class="m">100%</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>In Chrome, it now looks like this:<br>
<a href="assets/800474/554566ee.jpg" class="article-body-image-wrapper"><img src="assets/800474/554566ee.jpg" alt="Chrome checked" loading="lazy" width="630" height="180"></a></p>

<p>Better – but the icon will have the <strong>same color</strong>, even if the <code>background-color</code> is dark, like the example above. It's also a bit annoying, that the <code>border-color</code> is the same for all colors.</p>

<hr>
<h2>
  <a name="colormix" href="#colormix">
  </a>
  color-mix()
</h2>

<p>With the <code>color-mix</code>-function, we can add a colored border, based on the custom property, <code>--bgc</code>, mixing in 10% of black:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.color</span> <span class="p">{</span>
  <span class="nl">border</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--bdw</span><span class="p">,</span> <span class="m">0.125rem</span><span class="p">)</span> <span class="nb">solid</span> <span class="n">color-mix</span><span class="p">(</span><span class="n">in</span> <span class="n">hsl</span><span class="p">,</span> <span class="m">#000</span> <span class="m">10%</span><span class="p">,</span> <span class="n">var</span><span class="p">(</span><span class="n">--bgc</span><span class="p">));</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>




<hr>

<h2>
  <a name="colorcontrast" href="#colorcontrast">
  </a>
  color-contrast()
</h2>

<p>With the <code>color-contrast</code>-function, we can change the color of the icon, based on the custom property, <code>--bgc</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.color</span> <span class="nt">input</span><span class="nd">:checked</span> <span class="o">+</span> <span class="nt">i</span> <span class="p">{</span>
  <span class="nl">background-color</span><span class="p">:</span> <span class="n">color-contrast</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--bgc</span><span class="p">)</span> <span class="n">vs</span> <span class="no">white</span><span class="p">,</span> <span class="no">black</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>In Safari, it now looks like this:</p>

<p><a href="assets/800474/3ee7ffce.jpg" class="article-body-image-wrapper"><img src="assets/800474/3ee7ffce.jpg" alt="Safari" loading="lazy" width="634" height="184"></a></p>

<p>Cool! See those beautiful, dynamic border-colors! The checkmark-icon is white on dark colors, and black on light colors. </p>

<p>And absolutely <strong>no JavaScript</strong> is required!</p>


<hr>

<h2>
  <a name="fixing-issues-in-chrome-amp-co" href="#fixing-issues-in-chrome-amp-co">
  </a>
  Fixing issues in Chrome &amp; Co.
</h2>

<p>In non-Safari browsers, we'll have to use some JavaScript in order to achieve the same:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="k">if </span><span class="p">(</span><span class="nx">CSS</span><span class="p">.</span><span class="nf">supports</span><span class="p">(</span><span class="dl">'</span><span class="s1">not (color: color-contrast(red vs black, white))</span><span class="dl">'</span><span class="p">))</span> <span class="p">{</span>
<span class="cm">/* code here */</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>We'll add a method that'll iterate the labels of the <code>fieldset</code>, and set a custom property, <code>--ico-c</code>, to either <em>black</em> or <em>white</em>, depending on the brightness of the iterated color:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">function</span> <span class="nf">setLuminance</span><span class="p">(</span><span class="nx">elements</span><span class="p">)</span> <span class="p">{</span>
  <span class="nx">elements</span><span class="p">.</span><span class="nf">forEach</span><span class="p">(</span><span class="nx">element</span> <span class="o">=&gt;</span> <span class="p">{</span>
    <span class="kd">const</span> <span class="nx">rgb</span> <span class="o">=</span> <span class="nb">window</span><span class="p">.</span><span class="nf">getComputedStyle</span><span class="p">(</span><span class="nx">element</span><span class="p">).</span><span class="nf">getPropertyValue</span><span class="p">(</span><span class="dl">'</span><span class="s1">background-color</span><span class="dl">'</span><span class="p">);</span> 
    <span class="k">if </span><span class="p">(</span><span class="nx">rgb</span><span class="p">)</span> <span class="p">{</span>
      <span class="kd">const</span> <span class="p">[</span><span class="nx">r</span><span class="p">,</span><span class="nx">g</span><span class="p">,</span><span class="nx">b</span><span class="p">]</span> <span class="o">=</span> <span class="nx">rgb</span><span class="p">.</span><span class="nf">replace</span><span class="p">(</span><span class="sr">/</span><span class="se">[^\d</span><span class="sr">,</span><span class="se">]</span><span class="sr">/g</span><span class="p">,</span> <span class="dl">''</span><span class="p">).</span><span class="nf">split</span><span class="p">(</span><span class="dl">'</span><span class="s1">,</span><span class="dl">'</span><span class="p">);</span>
      <span class="kd">const</span> <span class="nx">brightness</span> <span class="o">=</span> <span class="p">(</span><span class="mi">299</span> <span class="o">*</span> <span class="nx">r</span> <span class="o">+</span> <span class="mi">587</span> <span class="o">*</span> <span class="nx">g</span> <span class="o">+</span> <span class="mi">114</span> <span class="o">*</span> <span class="nx">b</span><span class="p">)</span> <span class="o">/</span> <span class="mi">1000</span><span class="p">;</span>
      <span class="nx">element</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nf">setProperty</span><span class="p">(</span><span class="dl">'</span><span class="s1">--ico-c</span><span class="dl">'</span><span class="p">,</span> <span class="nx">brightness</span> <span class="o">&lt;=</span> <span class="mi">127</span> <span class="p">?</span> <span class="dl">'</span><span class="s1">#FFF</span><span class="dl">'</span> <span class="p">:</span> <span class="dl">'</span><span class="s1">#111</span><span class="dl">'</span><span class="p">)</span>
    <span class="p">}</span>
  <span class="p">})</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The snippet will return the color of the <code>label</code> as <code>rgb</code>, no matter if it's hex, hsl or rgb to start with, then check it's brightness, and set the <code>--ico-c</code>-property.</p>

<p>In Chrome, it now looks like this:<br>
<a href="assets/800474/dbae022a.jpg" class="article-body-image-wrapper"><img src="assets/800474/dbae022a.jpg" alt="Chrome final" loading="lazy" width="630" height="186"></a></p>

<p>Much better! The border-colors are still a bit dull in “non-Safari”-browsers ... In the <code>setLuminance</code>-method, we can fix that, by deducting <code>20</code> from each chanel (r, g and b):<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nx">element</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nf">setProperty</span><span class="p">(</span><span class="dl">'</span><span class="s1">--bdc</span><span class="dl">'</span><span class="p">,</span> <span class="s2">`rgb(</span><span class="p">${</span><span class="nx">r</span><span class="o">-</span><span class="mi">20</span><span class="p">}</span><span class="s2">,</span><span class="p">${</span><span class="nx">g</span><span class="o">-</span><span class="mi">20</span><span class="p">}</span><span class="s2">,</span><span class="p">${</span><span class="nx">b</span><span class="o">-</span><span class="mi">20</span><span class="p">}</span><span class="s2">)`</span><span class="p">);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>
