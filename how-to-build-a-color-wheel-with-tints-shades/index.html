		<article>
			<h1>How to Build a Color Wheel with Tints &amp; Shades</h1>
			<p>I've built a handful of <a href="https://dev.to/madsstoumann/colors-are-math-how-they-match-and-how-to-build-a-color-picker-4ei8">color pickers</a> through the years, so when I <a href="https://www.amazon.co.uk/Designers-Dictionary-Colour-Sean-Adams/dp/1419726390/?_encoding=UTF8&amp;pd_rd_w=hVrHi&amp;pf_rd_p=511c9d46-9b08-4a49-8274-fd2b88a7304c&amp;pf_rd_r=YN45PC380BHWB986M602&amp;pd_rd_r=d1d239a3-1b36-4095-b612-0012c7a979ee&amp;pd_rd_wg=iVQvL&amp;ref_=pd_gw_ci_mcx_mr_hp_d" target="_blank" rel="noopener noreferrer">in this book</a> stumbled upon a color-wheel with “built-in” shades and tints, I had to code it:</p>

<p><a href="assets/672378/7f490dc3.jpg" class="article-body-image-wrapper"><img src="assets/672378/7f490dc3.jpg" alt="Color Wheel with tints and shades" loading="lazy" width="800" height="803"></a></p>

<p>At first, I thought: “That's easy – it's just a conical gradient with <em>hard stops</em> for the colors, and a radial gradient for the tints and shades”.</p>

<p>But, alas, look at how “un-crisp” the edges in the conical gradient are (Chrome, MacOS):</p>

<p><a href="assets/672378/fc06be09.jpg" class="article-body-image-wrapper"><img src="assets/672378/fc06be09.jpg" alt="Color Wheel, using conical gradient" loading="lazy" width="800" height="800"></a></p>

<p>So – I had to do it in <code>&lt;svg&gt;</code>.</p>

<p>Each “ring” in the circle is built up by 12 circles with different colors and <code>stroke-dasharray</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight xml"><code><span class="nt">&lt;g</span> <span class="na">id=</span><span class="s">"wheel"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;circle</span> <span class="na">class=</span><span class="s">"c3"</span> <span class="na">cx=</span><span class="s">"16"</span> <span class="na">cy=</span><span class="s">"16"</span> <span class="na">r=</span><span class="s">"16"</span><span class="nt">&gt;&lt;/circle&gt;</span>
  <span class="nt">&lt;circle</span> <span class="na">class=</span><span class="s">"c2"</span> <span class="na">cx=</span><span class="s">"16"</span> <span class="na">cy=</span><span class="s">"16"</span> <span class="na">r=</span><span class="s">"16"</span><span class="nt">&gt;&lt;/circle&gt;</span>
  <span class="nt">&lt;circle</span> <span class="na">class=</span><span class="s">"c1"</span> <span class="na">cx=</span><span class="s">"16"</span> <span class="na">cy=</span><span class="s">"16"</span> <span class="na">r=</span><span class="s">"16"</span><span class="nt">&gt;&lt;/circle&gt;</span>
...etc
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And the CSS:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">--u</span><span class="o">:</span> <span class="nt">calc</span><span class="o">(</span><span class="err">100</span> <span class="o">/</span> <span class="err">12</span><span class="o">);</span>

<span class="nc">.c1</span> <span class="p">{</span>
  <span class="py">stroke</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="m">0</span><span class="p">,</span> <span class="n">var</span><span class="p">(</span><span class="n">--s</span><span class="p">),</span> <span class="n">var</span><span class="p">(</span><span class="n">--l</span><span class="p">));</span>
  <span class="py">stroke-dasharray</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--u</span><span class="p">)</span> <span class="m">100</span><span class="p">;</span>
<span class="p">}</span>
<span class="nc">.c2</span> <span class="p">{</span>
  <span class="py">stroke</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="m">30</span><span class="p">,</span> <span class="n">var</span><span class="p">(</span><span class="n">--s</span><span class="p">),</span> <span class="n">var</span><span class="p">(</span><span class="n">--l</span><span class="p">));</span>
  <span class="py">stroke-dasharray</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">2</span> <span class="err">*</span> <span class="n">var</span><span class="p">(</span><span class="n">--u</span><span class="p">))</span> <span class="m">100</span><span class="p">;</span>
<span class="p">}</span>
<span class="nc">.c3</span> <span class="p">{</span>
  <span class="py">stroke</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="m">60</span><span class="p">,</span> <span class="n">var</span><span class="p">(</span><span class="n">--s</span><span class="p">),</span> <span class="n">var</span><span class="p">(</span><span class="n">--l</span><span class="p">));</span>
  <span class="py">stroke-dasharray</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">3</span> <span class="err">*</span> <span class="n">var</span><span class="p">(</span><span class="n">--u</span><span class="p">))</span> <span class="m">100</span><span class="p">;</span>
<span class="p">}</span>
<span class="c">/* ... etc */</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The circles are wrapped in a <code>&lt;g&gt;</code>-tag with <code>id="wheel"</code>, so I can use <code>&lt;use&gt;</code> (pun intended) to clone the rings:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight xml"><code><span class="nt">&lt;use</span> <span class="na">href=</span><span class="s">"#wheel"</span> <span class="na">class=</span><span class="s">"r3"</span> <span class="nt">/&gt;</span>
<span class="nt">&lt;use</span> <span class="na">href=</span><span class="s">"#wheel"</span> <span class="na">class=</span><span class="s">"r2"</span> <span class="nt">/&gt;</span>
<span class="nt">&lt;use</span> <span class="na">href=</span><span class="s">"#wheel"</span> <span class="na">class=</span><span class="s">"r1"</span> <span class="nt">/&gt;</span>
etc...
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Each ring-class then sets a different <code>--l</code> (lightness) and <code>stroke-width</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.r1</span> <span class="p">{</span>
  <span class="py">--l</span><span class="p">:</span> <span class="m">40%</span><span class="p">;</span>
  <span class="py">stroke-width</span><span class="p">:</span> <span class="m">3</span><span class="p">;</span>
<span class="p">}</span>
<span class="nc">.r2</span> <span class="p">{</span>
  <span class="py">--l</span><span class="p">:</span> <span class="m">45%</span><span class="p">;</span>
  <span class="py">stroke-width</span><span class="p">:</span> <span class="m">6</span><span class="p">;</span>
<span class="p">}</span>
<span class="c">/* ... etc */</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>In the final result I've chosen more tints than shades, so it's not as dark as in the book-example. Firefox has issues with setting some svg-attributes in CSS, so check it out in Chrome, Edge or Safari:</p>

<p><iframe height="600" src="https://codepen.io/stoumann/embed/zYNmZMN?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
</p>


<hr>

<h2>
  <a name="lets-have-some-fun" href="#lets-have-some-fun">
  </a>
  Let's have some fun!
</h2>

<p>How about <strong>rotating</strong> those color rings – or changing the <strong>saturation</strong>? Scroll down to see and try the controls, if they're not at the top of the Pen:</p>

<p><iframe height="600" src="https://codepen.io/stoumann/embed/KKaGWJw?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
</p>

<p>To have an <strong>automated animation</strong>, animating the <code>--r</code> custom property, we need to register a Custom Property:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="k">@property</span> <span class="n">--r</span> <span class="p">{</span>
  <span class="py">syntax</span><span class="p">:</span> <span class="s1">"&lt;angle&gt;"</span><span class="p">;</span>
  <span class="py">initial-value</span><span class="p">:</span> <span class="m">0deg</span><span class="p">;</span>
  <span class="py">inherits</span><span class="p">:</span> <span class="n">false</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And the animation:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="k">@keyframes</span> <span class="n">rotate</span> <span class="p">{</span>
  <span class="err">100</span><span class="o">%</span> <span class="p">{</span>
    <span class="py">--r</span><span class="p">:</span> <span class="m">360deg</span><span class="p">;</span>
  <span class="p">}</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>
