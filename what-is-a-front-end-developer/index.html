			<h1>What is a Front-End developer?</h1>
			<p><a href="https://madsstoumann.wordpress.com/wp-content/uploads/2016/11/front-end-development.jpg"><img loading="lazy" data-attachment-id="722" data-permalink="https://madsstoumann.wordpress.com/2016/11/10/what-is-a-front-end-developer/front-end-development/" data-orig-file="https://madsstoumann.wordpress.com/wp-content/uploads/2016/11/front-end-development.jpg" data-orig-size="980,460" data-comments-opened="1" data-image-meta="{&quot;aperture&quot;:&quot;0&quot;,&quot;credit&quot;:&quot;&quot;,&quot;camera&quot;:&quot;&quot;,&quot;caption&quot;:&quot;&quot;,&quot;created_timestamp&quot;:&quot;0&quot;,&quot;copyright&quot;:&quot;&quot;,&quot;focal_length&quot;:&quot;0&quot;,&quot;iso&quot;:&quot;0&quot;,&quot;shutter_speed&quot;:&quot;0&quot;,&quot;title&quot;:&quot;&quot;,&quot;orientation&quot;:&quot;0&quot;}" data-image-title="front-end-development" data-image-description="" data-image-caption="" data-medium-file="https://madsstoumann.wordpress.com/wp-content/uploads/2016/11/front-end-development.jpg?w=300" data-large-file="https://madsstoumann.wordpress.com/wp-content/uploads/2016/11/front-end-development.jpg?w=980" class="alignnone size-full wp-image-722" src="assets/wp-688/4f4df36f.jpg" alt="front-end-development" width="615" height="289" srcset="https://madsstoumann.wordpress.com/wp-content/uploads/2016/11/front-end-development.jpg?w=615&amp;h=289 615w, https://madsstoumann.wordpress.com/wp-content/uploads/2016/11/front-end-development.jpg?w=150&amp;h=70 150w, https://madsstoumann.wordpress.com/wp-content/uploads/2016/11/front-end-development.jpg?w=300&amp;h=141 300w, https://madsstoumann.wordpress.com/wp-content/uploads/2016/11/front-end-development.jpg?w=768&amp;h=360 768w, https://madsstoumann.wordpress.com/wp-content/uploads/2016/11/front-end-development.jpg 980w" sizes="(max-width: 615px) 100vw, 615px" /></a>It used to be simple to describe a Front-End developer — someone that understood:</p>
<ul>
<li>HTML</li>
<li>CSS</li>
<li>JavaScript</li>
</ul>
<p>Today, the landscape has changed tremendously:</p>
<ul>
<li>HTML5, AMP, FIA, PWA</li>
<li>CSS3, BEM, SASS/SCSS, LESS, postCSS</li>
<li>JavaScript, jQuery, MEAN, Webpack, CoffeeScript, AngularJS, Backbone.js, Ember.js, Ext JS, Knockout, Meteor, Mojito, MooTools, Next.js, NodeJS, React.js and … The list goes on. And new, hot frameworks are added each week.</li>
</ul>
<p>But it&#8217;s not only the tools, languages and libraries that have changed. There are now so many <em>aspects</em> to Front-End development, that maybe it&#8217;s time to sub-divide that single role into multiple roles?</p>
<p><strong>Animator</strong><br />
First, a little anecdote:<br />
In 1985, as a 12-year old geek, writing and publishing my own magazine about comics, I visited the studio behind the danish animated movie <em>Valhalla</em>. I noticed everyone was gathered, in awe, around two old men, and asked:</p>
<p>—“Who are they?”.<br />
—“That&#8217;s Frank Thomas and Ollie Johnston!”<br />
—“… And, ahem … who are they?”<br />
—“Don&#8217;t you know who they are? Frank Thomas and Ollie Johnston? They&#8217;re 2/9th of the <em>Nine Old Men </em>AND they&#8217;re the writers of <em>The Illusion of Life</em>”</p>
<p>Sorry … I was young and ignorant and much more interested in comics than animation, so I wasn&#8217;t <em>that</em> impressed. Today, pick up any book on animation, and it will mention Frank Thomas and Ollie Johnston, <em>The Illusion of Life,</em> <strong>and</strong> their 12 <em>Basic Principles for Animation</em>.</p>
<p><strong>These principles haven&#8217;t changed.</strong> They&#8217;re <em>exactly</em> the same for website animations, whether it&#8217;s subtle interface/UI-transitions or full-scale animations.<br />
I wish I&#8217;d paid more attention back then, then maybe I&#8217;d be better at web-animations today!</p>
<p>An animator needs to understand these principles, some basic CSS3 (specifically <em>transitions</em> and <em>keyframe-animations)</em>, but will probably be more familiar with:</p>
<ul>
<li>Animation apps, I&#8217;m not aware of</li>
<li>Adobe Illustrator / Other vector app</li>
<li>GSAP library, for advanced animations with timelines</li>
</ul>
<p><strong>CSS Developer</strong><br />
Knows everything about the cascade, it&#8217;s specificity/selector-weight and BEM-strucure.<br />
<em>Never</em> styles ID&#8217;s or tags (and can argue why!) and is comfortable with:</p>
<ul>
<li>CSS3</li>
<li>CSS4</li>
<li>BEM</li>
<li>SASS/SCSS, or</li>
<li>LESS, and/or</li>
<li>postCSS</li>
<li>Gulp-pipeline with AutoPrefixer, Browserify, minification and …</li>
</ul>
<p><strong>Data Visualisation Developer<br />
</strong>Closely related to animation is <em>data visualisation</em>, the art of presenting large amounts of data in a user-friendly, often interactive (and animated) way. At <em>Fronteers 2016</em>, two presentations were about <em>data visualisation</em>. One of the presenters were a former astrophysicist, the other a former theoretical physicist. In other words: Not your average Front-End-developer! A <em>data visualisation</em>-developer will be familiar with:</p>
<ul>
<li>three.js</li>
<li>Advanced math and algorithms</li>
<li>Basic CSS animations/transitions</li>
</ul>
<p><strong>Email Developer</strong><br />
Knows all the limitations, pitfalls and hacks necessary to create responsive, interactive emails that work in most email clients. Works with:</p>
<ul>
<li>Litmus, to write and test emails that work across various client apps</li>
<li>HTML state + :checked CSS for logic and user-interaction</li>
<li>Schema.org events for user-interaction</li>
</ul>
<p><strong>HTML5 Developer</strong><br />
Has a solid understanding of the semantics of all HTML5&#8217;s tags, what can be done in pure HTML, <em>when</em> to use certain tags, knows even more obscure tags like <em>details</em>, <em>mark</em>, and <em>output </em>(and when to use them!). Writes code that will validate, and thus be parsed faster by both browsers and crawlers.</p>
<p><strong>JavaScript Developer</strong><br />
The JavaScript developer-role can be subdivided into multiple roles:</p>
<ul>
<li>Vanilla JS Developer. Knows the core of the language itself, knows what&#8217;s best for performance, the status of ES6-implementations across browsers etc.</li>
<li>Library developer. Has a solid knowledge of a specific library, could be:
<ul>
<li>React</li>
<li>Angular</li>
</ul>
</li>
<li>MEAN. MongoDB + Express + Angular + Node. Sort of a &#8220;full-stack developer&#8221;, but only using front-end-technologies.</li>
</ul>
<p><strong>Performance Engineer</strong><br />
I <a href="https://madsstoumann.wordpress.com/2014/08/03/performance-optimizing-existing-content/">wrote a blogpost about this</a> a couple of years ago. A Performance Engineer know how to minify and gzip, but also how to limit other resources, HTTP requests, applying correct content-headers for cache etc. Many websites will double in speed, if these kind of optimisations are in place.</p>
<p><strong>Security Expert</strong><br />
I guess, this will be a growing area in the coming years. A <em>Security Expert</em> knows everything about CORS, tries to avoid 3rd-party tracking-scripts or frameworks, applies the correct <em>security HTTP headers</em> to content, knows the dangers of SVG, using <em>target=&#8221;_blank&#8221;</em> etc.<br />
<a href="https://madsstoumann.wordpress.com/2016/08/01/front-end-security/">Here&#8217;s a blog-post</a> I wrote about tracking-scripts and security.</p>
<p><strong>SEO Expert</strong><br />
The <em>SEO Expert-</em>role should be combined with the HTML5-role, as a <em>SEO Expert</em> needs to have a solid HTML5-knowledge, combined with a solid knowledge about <a href="https://madsstoumann.wordpress.com/2014/07/21/better-search-results-with-schemas/">structured markup</a> (see <a href="http://schema.org">schema.org</a>). A <em>SEO Expert</em> will <em>never</em> put a &lt;h2&gt; before a &lt;h1&gt;, knows about all the additional things you can add with &lt;meta&gt;-tags (see <a href="https://madsstoumann.wordpress.com/2015/01/23/front-end-guidelines-html5-seo-and-schemas/">another of my old blog-posts</a>), how to deal with canonical URL&#8217;s etc.</p>
<p><strong>Tracking Expert</strong><br />
A <em>Tracking Expert</em> knows how to set up tracking goals, configuring Google Tag Manager (or other tracking tool), knows enough about JavaScript to add custom tracking-scripts and enough about HTML to add unique classes or data-attributes to target elements.<br />
Knows how to set up and connect Google Analytics with Google Tag Manager, how to create views, funnels, filters etc. <a href="http://www.simoahava.com/">Reads Simo Ahava&#8217;s blog!</a></p>
<p><strong>WCAG 2.0 / Accessibility Expert</strong><br />
The <em>Accessibility Expert</em> knows how to apply best practices for accessibility to HTML5, adding keyboard navigation, WAI-ARIA roles- and states (dynamically via JavaScript), changing colour contrast-ratios, adding subtitles to videos etc. Validates with <a href="http://tenon.io">tenon.io</a> and  <em>Accessibility Audit</em> for Chrome. Some countries have already applied strict accessibility rules to government- and medical sites.</p>
<p><strong>Other roles</strong><br />
Potentially there are <em>many</em> more roles, but a lot of them overlap.<br />
Should a PWA- or AMP-developer have their own roles?<br />
What about a developer, who&#8217;s developing apps, pages or FIA for Facebook?</p>
<h2>Conclusion</h2>
<p>When a company looks for a <em>Front-End Developer</em>, they won&#8217;t get a developer that&#8217;s an expert in <em>all</em> of these areas. I think it should be enough for an applicant to be able to check two or three of the mentioned roles. The company must know this, and change the job description to for instance &#8220;HTML5 + CSS3&#8221;-developer, or &#8220;JavaScript and Tracking-developer&#8221; etc.</p>
<p>For most of these roles, it&#8217;s important to emphasise: If you know the <em>output</em>, ie. HTML5, CSS3 and (Vanilla) JavaScript really well, it shouldn&#8217;t be <em>too</em> difficult to learn any of the roles, I&#8217;ve mentioned in this post.</p>
