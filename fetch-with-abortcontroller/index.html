<h2>
  <a name="additional-context" href="#additional-context">
  </a>
  Additional Context
</h2>

<p><strong>Explain <code>fetch()</code> with return type and <code>AbortController</code> in 256 bytes.</strong></p>

<p>The above is <strong>252 bytes</strong> — the explaination will be longer 😂</p>

<p>The method has 4 parameters:</p>

<ul>
<li>u (URL)</li>
<li>t (return type: 'json', 'text' — or leave blank to get the <code>response</code>)</li>
<li>o (<a href="https://developer.mozilla.org/en-US/docs/Web/API/fetch" target="_blank" rel="noopener noreferrer">options</a>)</li>
<li>s (AbortController.signal)</li>
</ul>


<hr>

  Examples
</h2>

<p>Basic <code>fetch</code>, return <code>response</code><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">data</span> <span class="o">=</span> <span class="k">await</span> <span class="nf">go</span><span class="p">(</span>
  <span class="dl">'</span><span class="s1">https://jsonplaceholder.typicode.com/posts/</span><span class="dl">'</span>
<span class="p">);</span>
</code></pre>

<p>Basic <code>fetch</code>, return <code>response</code> as <code>json</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">data</span> <span class="o">=</span> <span class="k">await</span> <span class="nf">go</span><span class="p">(</span>
  <span class="dl">'</span><span class="s1">https://jsonplaceholder.typicode.com/posts/</span><span class="dl">'</span><span class="p">,</span>
  <span class="dl">'</span><span class="s1">json</span><span class="dl">'</span>
<span class="p">);</span>
</code></pre>

<p>Use it with an <code>AbortController</code>, to cancel the <code>fetch()</code> under certain conditions (timeout being the most common):<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">controller</span> <span class="o">=</span> <span class="k">new</span> <span class="nc">AbortController</span><span class="p">();</span>
<span class="kd">const</span> <span class="nx">signal</span> <span class="o">=</span> <span class="nx">controller</span><span class="p">.</span><span class="nx">signal</span><span class="p">;</span>
<span class="kd">const</span> <span class="nx">data</span> <span class="o">=</span> <span class="k">await</span> <span class="nf">go</span><span class="p">(</span>
  <span class="dl">'</span><span class="s1">https://jsonplaceholder.typicode.com/posts/</span><span class="dl">'</span><span class="p">,</span>
  <span class="dl">'</span><span class="s1">json</span><span class="dl">'</span><span class="p">,</span>
  <span class="p">{},</span>
  <span class="nx">signal</span>
<span class="p">);</span>
</code></pre>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>

</svg>

</div>
</div>
</div>



<p>Then, to abort the <code>fetch()</code>, use <code>controller.abort()</code>. </p>

<p>In this example, after 5 seconds:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nf">setTimeout</span><span class="p">(()</span> <span class="o">=&gt;</span> <span class="nx">controller</span><span class="p">.</span><span class="nf">abort</span><span class="p">(),</span> <span class="mi">5000</span><span class="p">);</span>
</code></pre>
