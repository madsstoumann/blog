			<h1>Better search-results with schemas</h1>
			<p>A couple of years ago I created a small e-commerce solution, with a data-model based on Schema.org’s “Product”-schema.<br />
A <em>lot </em>has happened since then.</p>
<h3>So, what is Schema.org?</h3>
<p>Schema.org was created in 2011 by Google, Microsoft and Yahoo, in order to create a standard for all the various microdata-formats that existed at the time: Microformats, FOAF, OpenSyc, hCard etc.</p>
<blockquote><p>Search engines including Bing, Google, Yahoo! and Yandex rely on this markup to improve the display of search results, making it easier for people to find the right Web pages</p></blockquote>
<p>Schema-based markup basically enriches the html, providing search-engines with more detailed information about for instance a person, a product, a recipe or an event.</p>
<p>When a search-engine displays this enriched markup,  it&#8217;s called <em>rich snippets</em>.</p>
<h3>Schemas</h3>
<p>Visit <a href="http://schema.org/docs/schemas.html">schema.org/docs/schemas.html</a> for a complete list of schemas. New schemas are added often, and the existing schemas extended, so re-visit the site from time to time.</p>
<p>As an example, I&#8217;m going to markup a commercial product (e-commerce) using the following schemas:</p>
<p><a href="http://schema.org/Product">Product</a><br />
<a href="http://schema.org/ImageObject">ImageObject</a><br />
<a href="http://schema.org/AggregateRating">AggregateRating</a><br />
<a href="http://schema.org/Offer">Offer</a><br />
<a href="http://schema.org/itemCondition">itemCondition</a><br />
<a href="http://schema.org/Rating">Rating</a><br />
<a href="http://schema.org/Review">Review</a></p>
<p>The Product-schema alone is rather big, so I&#8217;m going to use only subsets of the various schema&#8217;s features.</p>
<table>
<caption>Model</caption>
<tbody>
<tr>
<td>name</td>
<td>Product name (should also be the title of the page as well as og:title*)</td>
</tr>
<tr>
<td>description</td>
<td>Product description</td>
</tr>
<tr>
<td>productID</td>
<td>A unique product-identifier</td>
</tr>
<tr>
<td>itemCondition</td>
<td>Possible values:<br />
DamagedCondition<br />
NewCondition<br />
RefurbishedCondition<br />
UsedCondition
</td>
</tr>
<tr>
<td>other</td>
<td>color, depth, height, width, weight</td>
</tr>
<tr>
<td>image</td>
<td>ImageObject (should also be og:image*):<br />
contentUrl<br />
name<br />
copyrightHolder<br />
copyrightYear<br />
representativeOfPage</td>
</tr>
<tr>
<td>aggregateRating</td>
<td>Review/rating overview:<br />
ratingValue<br />
reviewCount</td>
</tr>
<tr>
<td>offer</td>
<td>price<br />
availability</td>
</tr>
<tr>
<td>review</td>
<td>
name<br />
author<br />
description<br />
datePublished<br />
reviewRating (Rating schema)<br />
ratingValue
</td>
</tr>
</tbody>
</table>
<p>*) Open Graph meta properties: More on <a href="http://ogp.me">ogp.me</a>.</p>
<p>There are <em>many more itemprops</em> in the schemas, go and have a look at the documentation. For instance, in order to limit your product to a specific gender or age-group, use the <a href="http://schema.org/PeopleAudience">PeopleAudience-schema</a>.</p>
<h3>Example Markup</h3>
<p>The tags can be whatever you want, as long as they are semantically correct!<br />
The important thing here are the <strong>itemtype</strong>, <strong>itemscope</strong> and <strong>itemprop</strong>-attributes.</p>
<pre class="brush: xml; title: ; notranslate" title="">
&lt;article itemscope itemtype=&quot;http://schema.org/Product&quot;&gt;
  &lt;h1 itemprop=&quot;name&quot;&gt;Captain America #425&lt;/h1&gt;
  
  &lt;figure itemprop=&quot;image&quot; itemscope itemtype=&quot;http://schema.org/ImageObject&quot;&gt;
    &lt;img src=&quot;425.jpg&quot; itemprop=&quot;contentUrl&quot; alt=&quot;Captain America #425&quot; /&gt;
    &lt;meta itemprop=&quot;thumbnail&quot; content=&quot;425.jpg&quot; /&gt;
    &lt;figcaption&gt;
      &lt;span itemprop=&quot;name&quot;&gt;Captain America #425&lt;/span&gt;
      &lt;span itemprop=&quot;copyrightHolder&quot;&gt;Marvel Comics&lt;/span&gt;
      &lt;span itemprop=&quot;copyrightYear&quot;&gt;1994&lt;/span&gt;
      &lt;meta itemprop=&quot;representativeOfPage&quot; content=&quot;true&quot;&gt;
    &lt;/figcaption&gt;
  &lt;/figure&gt;
  
  &lt;div itemprop=&quot;aggregateRating&quot; itemscope itemtype=&quot;http://schema.org/AggregateRating&quot;&gt;
   Rated &lt;span itemprop=&quot;ratingValue&quot;&gt;3&lt;/span&gt;/5
   based on &lt;span itemprop=&quot;reviewCount&quot;&gt;11&lt;/span&gt; customer reviews
  &lt;/div&gt;

  &lt;div itemprop=&quot;offers&quot; itemscope itemtype=&quot;http://schema.org/Offer&quot;&gt;
    &lt;span itemprop=&quot;price&quot;&gt;$1.99&lt;/span&gt;
    &lt;link itemprop=&quot;availability&quot; href=&quot;http://schema.org/InStock&quot; /&gt;In stock
  &lt;/div&gt;
  
  &lt;span itemprop=&quot;itemCondition&quot; content=&quot;NewCondition&quot;&gt;New&lt;/span&gt;
    
  &lt;strong&gt;Product description:&lt;/strong&gt;
  &lt;span itemprop=&quot;description&quot;&gt;
    ...
  &lt;/span&gt;

  &lt;h2&gt;Customer reviews:&lt;/h2&gt;
  &lt;div itemprop=&quot;review&quot; itemscope itemtype=&quot;http://schema.org/Review&quot;&gt;
    &lt;span itemprop=&quot;name&quot;&gt;It all starts here!&lt;/span&gt; -
    by &lt;span itemprop=&quot;author&quot;&gt;Avid reader&lt;/span&gt;,
    &lt;meta itemprop=&quot;datePublished&quot; content=&quot;2011-04-01&quot;&gt;April 1, 2011
    &lt;div itemprop=&quot;reviewRating&quot; itemscope itemtype=&quot;http://schema.org/Rating&quot;&gt;
      &lt;span itemprop=&quot;ratingValue&quot;&gt;5&lt;/span&gt;
    &lt;/div&gt;
    &lt;span itemprop=&quot;description&quot;&gt;
      ...
    &lt;/span&gt;
  &lt;/div&gt;
&lt;/article&gt;
</pre>
<h3>Google search-result output</h3>
<p><img loading="lazy" src="assets/wp-9/8d69a389.jpg" alt="schema" width="549" height="117" /><br />
Pretty nifty, huh? Google might even display a thumbnail-image next to the result.</p>
<h3>Tools &amp; Testing</h3>
<p>To verify the markup for your rich snippets, both Google and Microsoft provide online tools:</p>
<p><a href="http://www.google.com/webmasters/tools/richsnippets">Google Rich Snippets Tool</a><br />
<a href="http://www.bing.com/toolbox/markup-validator">Bing Validator</a></p>
<p>Bing&#8217;s Validator is in beta and rather limited compared to Googles.</p>
<p>The above example is available here: <a href="http://www.stoumann.dk/examples/schema/index.html">stoumann.dk/examples/schema/</a></p>
<p><a href="http://www.google.com/webmasters/tools/richsnippets?q=http%3A%2F%2Fwww.stoumann.dk%2Fexamples%2Fschema%2Findex.html">Click here</a> to view all the data, Googles Rich Snippets Tool can extract from the example markup.</p>
<h3>Styling the output</h3>
<p><strong>Bonus-info.</strong> You can use the itemprop-attributes directly for styling &mdash; no need to add additional classes:</p>
<pre class="brush: css; title: ; notranslate" title="">
[itemprop=&quot;availability&quot;] { 
  color: green; 
}

/* Insert a copyright symbol */
[itemprop=&quot;copyrightHolder&quot;]:before { 
  content: &quot;&#092;&#048;0a9&#092;&#048;020&quot;; 
}

[itemprop=&quot;price&quot;] { 
  color: maroon; 
}
etc.
</pre>
<p>Happy coding!</p>
