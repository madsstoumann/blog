		<article>
			<h1>Creating a Scroll Grid</h1>
			<p>The other day I noticed the similarities between <a href="https://tailscale.com/" target="_blank" rel="noopener noreferrer">Tailscale</a> and <a href="https://mubi.com/" target="_blank" rel="noopener noreferrer">MUBI</a> — not the companies, of course, but their logos! It <em>also</em> reminded me of a <a href="https://browser.style/ui/position/" target="_blank" rel="noopener noreferrer">position control</a> I once created. Subconsciously, this must have triggered something, because I woke up today wanting to code a “Scroll Grid.”</p>

<p>So, what is a scroll grid? It’s a scrollable grid in multiple directions, aided with a “scroll spy,” which looks a bit like MUBI’s and Tailscale’s logos:</p>

<p><a href="assets/2131155/7bc60ff9.jpg" class="article-body-image-wrapper"><img src="assets/2131155/7bc60ff9.jpg" alt="Scroll Grid" loading="lazy" width="730" height="966"></a></p>

<p>Enough talking. Let’s code!</p>

<h2>
  <a name="progressive-enhancement" href="#progressive-enhancement">
  </a>
  Progressive Enhancement
</h2>

<blockquote>
<p>Progressive enhancement is a design philosophy that ensures basic functionality works for everyone while adding advanced features for those with modern browsers or JavaScript enabled.</p>
</blockquote>

<h3>
  <a name="html" href="#html">
  </a>
  HTML
</h3>

<p>We’ll start with five ordered lists (<code>&lt;ol&gt;</code>), each containing five <code>&lt;li&gt;</code> items, creating a grid of <code>5×5</code> cells.<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;ol&gt;</span>
  <span class="nt">&lt;li&gt;&lt;ol&gt;</span>...<span class="nt">&lt;/ol&gt;&lt;/li&gt;</span>
  <span class="nt">&lt;li&gt;&lt;ol&gt;</span>...<span class="nt">&lt;/ol&gt;&lt;/li&gt;</span>
  <span class="nt">&lt;li&gt;&lt;ol&gt;</span>...<span class="nt">&lt;/ol&gt;&lt;/li&gt;</span>
  <span class="nt">&lt;li&gt;&lt;ol&gt;</span>...<span class="nt">&lt;/ol&gt;&lt;/li&gt;</span>
  <span class="nt">&lt;li&gt;&lt;ol&gt;</span>...<span class="nt">&lt;/ol&gt;&lt;/li&gt;</span>
<span class="nt">&lt;/ol&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>If—for some reason—CSS or JavaScript fails, this markup will display as a nested ordered list with clear structure:</p>

<p><a href="assets/2131155/ce5f9239.jpg" class="article-body-image-wrapper"><img src="assets/2131155/ce5f9239.jpg" alt="Text Only" loading="lazy" width="648" height="598"></a></p>

<p>Next, let’s add a unique id to each <code>&lt;li&gt;</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;li</span> <span class="na">id=</span><span class="s">"r1-c1"</span><span class="nt">&gt;</span>
<span class="nt">&lt;li</span> <span class="na">id=</span><span class="s">"r1-c2"</span><span class="nt">&gt;</span>
<span class="c">&lt;!-- and so on --&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>We’ll also include a “scroll spy,” which is a set of links pointing to those unique <code>id</code>s:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;nav&gt;</span>
  <span class="nt">&lt;a</span> <span class="na">href=</span><span class="s">"#r1-c1"</span><span class="nt">&gt;&lt;/a&gt;</span>
  <span class="nt">&lt;a</span> <span class="na">href=</span><span class="s">"#r1-c2"</span><span class="nt">&gt;&lt;/a&gt;</span>
  <span class="c">&lt;!-- and so on --&gt;</span>
<span class="nt">&lt;/nav&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>For accessibility, add a description or an <code>aria-label</code> for each link.</p>

<h3>
  <a name="css" href="#css">
  </a>
  CSS
</h3>

<p>The next step in our progressive journey is adding scroll support <em>without</em> JavaScript.</p>

<p>For the main element (the outermost <code>&lt;ol&gt;</code>), we’ll apply the following styles:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.outer</span> <span class="p">{</span>
  <span class="nl">overflow</span><span class="p">:</span> <span class="n">clip</span> <span class="nb">auto</span><span class="p">;</span>
  <span class="py">scroll-behavior</span><span class="p">:</span> <span class="n">smooth</span><span class="p">;</span>
  <span class="py">scroll-snap-type</span><span class="p">:</span> <span class="n">y</span> <span class="n">mandatory</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>This ensures vertical “snapping” for the inner <code>&lt;ol&gt;</code> elements. For those inner lists, we’ll add horizontal snapping:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.inner</span> <span class="p">{</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">flex</span><span class="p">;</span>
  <span class="nl">overflow</span><span class="p">:</span> <span class="nb">auto</span> <span class="n">clip</span><span class="p">;</span>
  <span class="py">scroll-snap-type</span><span class="p">:</span> <span class="n">x</span> <span class="n">mandatory</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>To make each <code>&lt;li&gt;</code> fill the entire screen, we’ll use the following CSS:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">li</span> <span class="p">{</span>
  <span class="nl">flex</span><span class="p">:</span> <span class="m">0</span> <span class="m">0</span> <span class="m">100vw</span><span class="p">;</span>
  <span class="nl">height</span><span class="p">:</span> <span class="m">100</span><span class="n">dvh</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>For the scroll spy, we simply create a fixed grid of 5×5 items:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.spy</span> <span class="p">{</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">grid</span><span class="p">;</span>
  <span class="py">gap</span><span class="p">:</span> <span class="m">.25rem</span><span class="p">;</span>
  <span class="py">grid-template-columns</span><span class="p">:</span> <span class="nb">repeat</span><span class="p">(</span><span class="m">5</span><span class="p">,</span> <span class="m">1</span><span class="n">fr</span><span class="p">);</span>
  <span class="py">inset-block-end</span><span class="p">:</span> <span class="m">2rem</span><span class="p">;</span>
  <span class="py">inset-inline-end</span><span class="p">:</span> <span class="m">2rem</span><span class="p">;</span>
  <span class="nl">position</span><span class="p">:</span> <span class="nb">fixed</span><span class="p">;</span>
  <span class="err">a</span> <span class="err">{</span>
    <span class="py">aspect-ratio</span><span class="p">:</span> <span class="m">1</span><span class="p">;</span>
    <span class="nl">background-color</span><span class="p">:</span> <span class="m">#FFFD</span><span class="p">;</span>
    <span class="nl">border-radius</span><span class="p">:</span> <span class="m">50%</span><span class="p">;</span>
    <span class="nl">display</span><span class="p">:</span> <span class="nb">block</span><span class="p">;</span>
    <span class="nl">width</span><span class="p">:</span> <span class="m">.5rem</span><span class="p">;</span>
  <span class="p">}</span>
<span class="err">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Additional minor styles (available in the final CodePen below) will complete the design. For now, we have all the basics, and we can navigate the grid by <strong>scrolling</strong> or <strong>clicking</strong> the dots:</p>

<p><a href="assets/2131155/4e8ae5d9.jpg" class="article-body-image-wrapper"><img src="assets/2131155/4e8ae5d9.jpg" alt="Basic" loading="lazy" width="644" height="648"></a></p>

<p>If you scroll horizontally and then vertically, you might notice how you don’t land directly below the current item but rather at the <em>first</em> item of the next row. This happens because each row’s <code>scrollLeft</code> position needs to stay in sync. For that—and for highlighting the active dot—we need JavaScript.</p>

<blockquote>
<p><strong>NOTE:</strong> If you only need to highlight dots in a single row (like a carousel), you don’t need JavaScript. CSS scroll-driven animations can handle this. Check out <a href="https://scroll-driven-animations.style/demos/carousel-with-markers/css/" target="_blank" rel="noopener noreferrer">this example</a> by Bramus.</p>
</blockquote>

<h3>
  <a name="javascript" href="#javascript">
  </a>
  JavaScript
</h3>

<p>Now we get to the fun part — adding interactivity that transforms our basic scroll grid into a seamless, intuitive experience. </p>

<p>Our JavaScript will handle three key interactions:</p>

<ol>
<li>Syncing Horizontal Scrolling: Ensure all rows scroll together</li>
<li>Highlighting Active Navigation Dots: Show which cell is currently in view</li>
<li>Keyboard Navigation: Allow users to move around the grid using arrow keys</li>
</ol>

<p>Let’s break down the <code>handleNavigation</code> function and highlight its most crucial bits:</p>

<h4>
  <a name="scroll-synchronization" href="#scroll-synchronization">
  </a>
  Scroll Synchronization
</h4>

<p>The <code>syncScroll</code> function is our scroll synchronization maestro. When a user scrolls one row, it ensures all other rows match that horizontal scroll position:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">syncScroll</span> <span class="o">=</span> <span class="nx">target</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">parent</span> <span class="o">=</span> <span class="nx">target</span><span class="p">.</span><span class="nx">parentNode</span><span class="p">;</span>
  <span class="nx">lists</span><span class="p">.</span><span class="nf">forEach</span><span class="p">(</span><span class="nx">ol</span> <span class="o">=&gt;</span> <span class="nx">ol</span> <span class="o">!==</span> <span class="nx">parent</span> <span class="o">&amp;&amp;</span> <span class="p">(</span><span class="nx">ol</span><span class="p">.</span><span class="nx">scrollLeft</span> <span class="o">=</span> <span class="nx">parent</span><span class="p">.</span><span class="nx">scrollLeft</span><span class="p">));</span>
<span class="p">};</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>It takes the scrolled row’s parent and applies its <code>scrollLeft</code> to all other rows.</p>

<h4>
  <a name="navigation-and-active-state" href="#navigation-and-active-state">
  </a>
  Navigation and Active State
</h4>

<p>The <code>navigateToCell</code> function manages navigation when a dot is clicked or a key is pressed:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">navigateToCell</span> <span class="o">=</span> <span class="p">(</span><span class="nx">row</span><span class="p">,</span> <span class="nx">col</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">targetId</span> <span class="o">=</span> <span class="s2">`r</span><span class="p">${</span><span class="nx">row</span> <span class="o">+</span> <span class="mi">1</span><span class="p">}</span><span class="s2">-c</span><span class="p">${</span><span class="nx">col</span> <span class="o">+</span> <span class="mi">1</span><span class="p">}</span><span class="s2">`</span><span class="p">;</span>
  <span class="kd">const</span> <span class="nx">target</span> <span class="o">=</span> <span class="nb">document</span><span class="p">.</span><span class="nf">getElementById</span><span class="p">(</span><span class="nx">targetId</span><span class="p">);</span>
  <span class="kd">const</span> <span class="nx">link</span> <span class="o">=</span> <span class="p">[...</span><span class="nx">links</span><span class="p">].</span><span class="nf">find</span><span class="p">(</span><span class="nx">link</span> <span class="o">=&gt;</span> <span class="nx">link</span><span class="p">.</span><span class="nx">hash</span> <span class="o">===</span> <span class="s2">`#</span><span class="p">${</span><span class="nx">targetId</span><span class="p">}</span><span class="s2">`</span><span class="p">);</span>

  <span class="k">if </span><span class="p">(</span><span class="nx">target</span> <span class="o">&amp;&amp;</span> <span class="nx">link</span><span class="p">)</span> <span class="p">{</span>
    <span class="nx">linkClicked</span> <span class="o">=</span> <span class="kc">true</span><span class="p">;</span>
    <span class="nx">target</span><span class="p">.</span><span class="nf">scrollIntoView</span><span class="p">({</span> <span class="na">behavior</span><span class="p">:</span> <span class="dl">'</span><span class="s1">smooth</span><span class="dl">'</span> <span class="p">});</span>
    <span class="nx">links</span><span class="p">.</span><span class="nf">forEach</span><span class="p">(</span><span class="nx">l</span> <span class="o">=&gt;</span> <span class="nx">l</span><span class="p">.</span><span class="nx">classList</span><span class="p">.</span><span class="nf">remove</span><span class="p">(</span><span class="nx">activeClass</span><span class="p">));</span>
    <span class="nx">link</span><span class="p">.</span><span class="nx">classList</span><span class="p">.</span><span class="nf">add</span><span class="p">(</span><span class="nx">activeClass</span><span class="p">);</span>

    <span class="nf">requestAnimationFrame</span><span class="p">(()</span> <span class="o">=&gt;</span> <span class="p">{</span>
      <span class="nf">setTimeout</span><span class="p">(()</span> <span class="o">=&gt;</span> <span class="p">{</span>
        <span class="nf">syncScroll</span><span class="p">(</span><span class="nx">target</span><span class="p">);</span>
        <span class="nx">linkClicked</span> <span class="o">=</span> <span class="kc">false</span><span class="p">;</span>
      <span class="p">},</span> <span class="mi">1000</span><span class="p">);</span>
    <span class="p">});</span>
  <span class="p">}</span>
<span class="p">};</span>
</code></pre>

<p>Key highlights:</p>

<ul>
<li>Smoothly scrolls to the target cell</li>
<li>Updates the active navigation dot</li>
<li>Syncs scrolling after a short delay to prevent immediate re-scrolling</li>
</ul>

<h4>
  <a name="intersection-observer" href="#intersection-observer">
  </a>
  Intersection Observer
</h4>

<p>The real magic happens with the <code>Intersection Observer</code>, which tracks which cells are currently visible:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">IO</span> <span class="o">=</span> <span class="k">new</span> <span class="nc">IntersectionObserver</span><span class="p">(</span><span class="nx">entries</span> <span class="o">=&gt;</span> 
  <span class="nx">entries</span><span class="p">.</span><span class="nf">forEach</span><span class="p">(({</span> <span class="nx">isIntersecting</span><span class="p">,</span> <span class="nx">intersectionRatio</span><span class="p">,</span> <span class="nx">target</span> <span class="p">})</span> <span class="o">=&gt;</span> <span class="p">{</span>
    <span class="k">if </span><span class="p">(</span><span class="nx">isIntersecting</span> <span class="o">&amp;&amp;</span> <span class="nx">intersectionRatio</span> <span class="o">&gt;=</span> <span class="mf">0.5</span><span class="p">)</span> <span class="p">{</span>
      <span class="c1">// Update active dot and current position</span>
      <span class="nx">links</span><span class="p">.</span><span class="nf">forEach</span><span class="p">(</span><span class="nx">link</span> <span class="o">=&gt;</span> <span class="nx">link</span><span class="p">.</span><span class="nx">classList</span><span class="p">.</span><span class="nf">remove</span><span class="p">(</span><span class="nx">activeClass</span><span class="p">));</span>
      <span class="kd">const</span> <span class="nx">link</span> <span class="o">=</span> <span class="p">[...</span><span class="nx">links</span><span class="p">].</span><span class="nf">find</span><span class="p">(</span><span class="nx">link</span> <span class="o">=&gt;</span> <span class="nx">link</span><span class="p">.</span><span class="nx">hash</span> <span class="o">===</span> <span class="s2">`#</span><span class="p">${</span><span class="nx">target</span><span class="p">.</span><span class="nx">id</span><span class="p">}</span><span class="s2">`</span><span class="p">);</span>
      <span class="nx">link</span><span class="p">?.</span><span class="nx">classList</span><span class="p">.</span><span class="nf">add</span><span class="p">(</span><span class="nx">activeClass</span><span class="p">);</span>

      <span class="kd">const</span> <span class="p">[</span><span class="nx">_</span><span class="p">,</span> <span class="nx">row</span><span class="p">,</span> <span class="nx">col</span><span class="p">]</span> <span class="o">=</span> <span class="nx">target</span><span class="p">.</span><span class="nx">id</span><span class="p">.</span><span class="nf">match</span><span class="p">(</span><span class="sr">/r</span><span class="se">(\d</span><span class="sr">+</span><span class="se">)</span><span class="sr">-c</span><span class="se">(\d</span><span class="sr">+</span><span class="se">)</span><span class="sr">/</span><span class="p">);</span>
      <span class="nx">currentRow</span> <span class="o">=</span> <span class="nf">parseInt</span><span class="p">(</span><span class="nx">row</span><span class="p">)</span> <span class="o">-</span> <span class="mi">1</span><span class="p">;</span>
      <span class="nx">currentCol</span> <span class="o">=</span> <span class="nf">parseInt</span><span class="p">(</span><span class="nx">col</span><span class="p">)</span> <span class="o">-</span> <span class="mi">1</span><span class="p">;</span>

      <span class="k">if </span><span class="p">(</span><span class="o">!</span><span class="nx">linkClicked</span><span class="p">)</span> <span class="nf">syncScroll</span><span class="p">(</span><span class="nx">target</span><span class="p">);</span>
    <span class="p">}</span>
  <span class="p">}),</span> <span class="p">{</span> 
    <span class="na">threshold</span><span class="p">:</span> <span class="p">[</span><span class="mi">0</span><span class="p">,</span> <span class="mf">0.5</span><span class="p">,</span> <span class="mf">1.0</span><span class="p">]</span> 
  <span class="p">}</span>
<span class="p">);</span>
</code></pre>

<p>This observer:</p>

<ul>
<li>Tracks when a cell is at least 50% in view</li>
<li>Updates the active navigation dot</li>
<li>Tracks the current grid position</li>
<li>Syncs scrolling when manually scrolling (not clicking)</li>
</ul>

<h4>
  <a name="keyboard-navigation" href="#keyboard-navigation">
  </a>
  Keyboard Navigation
</h4>

<p>And finally, keyboard support is added through the <code>handleKeydown</code> event listener:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">handleKeydown</span> <span class="o">=</span> <span class="p">(</span><span class="nx">e</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="k">switch </span><span class="p">(</span><span class="nx">e</span><span class="p">.</span><span class="nx">key</span><span class="p">)</span> <span class="p">{</span>
    <span class="k">case</span> <span class="dl">'</span><span class="s1">ArrowLeft</span><span class="dl">'</span><span class="p">:</span>   <span class="nx">currentCol</span> <span class="o">=</span> <span class="nb">Math</span><span class="p">.</span><span class="nf">max</span><span class="p">(</span><span class="mi">0</span><span class="p">,</span> <span class="nx">currentCol</span> <span class="o">-</span> <span class="mi">1</span><span class="p">);</span> <span class="k">break</span><span class="p">;</span>
    <span class="k">case</span> <span class="dl">'</span><span class="s1">ArrowRight</span><span class="dl">'</span><span class="p">:</span>  <span class="nx">currentCol</span> <span class="o">=</span> <span class="nb">Math</span><span class="p">.</span><span class="nf">min</span><span class="p">(</span><span class="mi">4</span><span class="p">,</span> <span class="nx">currentCol</span> <span class="o">+</span> <span class="mi">1</span><span class="p">);</span> <span class="k">break</span><span class="p">;</span>
    <span class="k">case</span> <span class="dl">'</span><span class="s1">ArrowUp</span><span class="dl">'</span><span class="p">:</span>     <span class="nx">currentRow</span> <span class="o">=</span> <span class="nb">Math</span><span class="p">.</span><span class="nf">max</span><span class="p">(</span><span class="mi">0</span><span class="p">,</span> <span class="nx">currentRow</span> <span class="o">-</span> <span class="mi">1</span><span class="p">);</span> <span class="k">break</span><span class="p">;</span>
    <span class="k">case</span> <span class="dl">'</span><span class="s1">ArrowDown</span><span class="dl">'</span><span class="p">:</span>   <span class="nx">currentRow</span> <span class="o">=</span> <span class="nb">Math</span><span class="p">.</span><span class="nf">min</span><span class="p">(</span><span class="mi">4</span><span class="p">,</span> <span class="nx">currentRow</span> <span class="o">+</span> <span class="mi">1</span><span class="p">);</span> <span class="k">break</span><span class="p">;</span>
    <span class="nl">default</span><span class="p">:</span> <span class="k">return</span><span class="p">;</span>
  <span class="p">}</span>
  <span class="nx">e</span><span class="p">.</span><span class="nf">preventDefault</span><span class="p">();</span>
  <span class="nf">navigateToCell</span><span class="p">(</span><span class="nx">currentRow</span><span class="p">,</span> <span class="nx">currentCol</span><span class="p">);</span>
<span class="p">};</span>
</code></pre>
