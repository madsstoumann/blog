		<article>
			<h1>Introducing the EyeDropper API</h1>
			<p>The <strong>EyeDropper API</strong> has landed in <em>Chrome 95</em>. This API opens up a <em>lot of</em> possiblities. A user can select colors from images, create her/his own color-theme, and much more.</p>

<p>Let's built a simple, ultra-small <em>ColorPicker</em>, using this new API.</p>

<p>First, we need a form with a large selection-area, a hue-slider, and an output:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;form</span> <span class="na">class=</span><span class="s">"picker"</span> <span class="na">id=</span><span class="s">"app"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;fieldset</span> <span class="na">class=</span><span class="s">"background"</span> <span class="na">name=</span><span class="s">"background"</span><span class="nt">&gt;</span>
    <span class="nt">&lt;div</span> <span class="na">class=</span><span class="s">"brightness"</span><span class="nt">&gt;&lt;/div&gt;</span>
    <span class="nt">&lt;div</span> <span class="na">class=</span><span class="s">"saturation"</span><span class="nt">&gt;&lt;/div&gt;</span>
  <span class="nt">&lt;/fieldset&gt;</span>
  <span class="nt">&lt;label</span> <span class="na">aria-label=</span><span class="s">"hue"</span><span class="nt">&gt;</span>
    <span class="nt">&lt;input</span> <span class="na">type=</span><span class="s">"range"</span> <span class="na">name=</span><span class="s">"hue"</span> <span class="na">max=</span><span class="s">"360"</span> <span class="na">value=</span><span class="s">"0"</span> <span class="na">data-blok=</span><span class="s">"range"</span><span class="nt">&gt;</span>
  <span class="nt">&lt;/label&gt;</span>
  <span class="nt">&lt;output</span> <span class="na">name=</span><span class="s">"hex"</span> <span class="na">data-value=</span><span class="s">"#ff0000"</span><span class="nt">&gt;&lt;/output&gt;</span>
<span class="nt">&lt;/form&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The selection-area consists of a <code>background</code> with the main color, as well as <code>saturation</code> and <code>lightness</code> layers, which are gradients <em>on top of</em> that color:</p>

<p><a href="assets/879411/e809159d.jpg" class="article-body-image-wrapper"><img src="assets/879411/e809159d.jpg" alt="Background with saturation and lightness" loading="lazy" width="800" height="800"></a> </p>

<p>The hue-slider is a regular <code>&lt;input type="range"&gt;</code>, styled with 12 color-stops (360 degrees / 12 = a stop every 30 degree): </p>

<p><a href="assets/879411/9f6563d4.jpg" class="article-body-image-wrapper"><img src="assets/879411/9f6563d4.jpg" alt="Hue-slider" loading="lazy" width="800" height="48"></a></p>

<p>To update the hue as we drag the hue-slider, we need a bit of JavaScript, updating a simple custom property, <code>--hue</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nx">app</span><span class="p">.</span><span class="nx">elements</span><span class="p">.</span><span class="nx">hue</span><span class="p">.</span><span class="nf">addEventListener</span><span class="p">(</span><span class="dl">'</span><span class="s1">input</span><span class="dl">'</span><span class="p">,</span> <span class="p">()</span> <span class="o">=&gt;</span> <span class="nx">app</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nf">setProperty</span><span class="p">(</span><span class="dl">'</span><span class="s1">--hue</span><span class="dl">'</span><span class="p">,</span> <span class="nx">app</span><span class="p">.</span><span class="nx">elements</span><span class="p">.</span><span class="nx">hue</span><span class="p">.</span><span class="nx">valueAsNumber</span><span class="p">));</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Next, if the <strong>EyeDropper API</strong> is supported in the browser (currently <strong>only</strong> Chrome 95+), we'll add a click-listener to the selection-area:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="k">if </span><span class="p">(</span><span class="dl">'</span><span class="s1">EyeDropper</span><span class="dl">'</span> <span class="k">in</span> <span class="nb">window</span><span class="p">)</span> <span class="p">{</span>
<span class="nx">app</span><span class="p">.</span><span class="nx">elements</span><span class="p">.</span><span class="nx">background</span><span class="p">.</span><span class="nf">addEventListener</span><span class="p">(</span><span class="dl">'</span><span class="s1">click</span><span class="dl">'</span><span class="p">,</span> <span class="nx">pickColor</span><span class="p">)</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And finally, we'll invoke the <em>EyeDropper API</em> with the <code>pickColor</code>-function:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="k">async</span> <span class="kd">function</span> <span class="nf">pickColor</span><span class="p">()</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">ED</span> <span class="o">=</span> <span class="k">new</span> <span class="nc">EyeDropper</span><span class="p">();</span>
  <span class="kd">const</span> <span class="nx">result</span> <span class="o">=</span> <span class="k">await</span> <span class="nx">ED</span><span class="p">.</span><span class="nf">open</span><span class="p">();</span>
  <span class="nx">app</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nf">setProperty</span><span class="p">(</span><span class="dl">'</span><span class="s1">--hex</span><span class="dl">'</span><span class="p">,</span> <span class="nx">result</span><span class="p">.</span><span class="nx">sRGBHex</span><span class="p">);</span>
  <span class="nx">app</span><span class="p">.</span><span class="nx">elements</span><span class="p">.</span><span class="nx">hex</span><span class="p">.</span><span class="nx">dataset</span><span class="p">.</span><span class="nx">value</span> <span class="o">=</span> <span class="nx">result</span><span class="p">.</span><span class="nx">sRGBHex</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Now, try it out:</p>

<p><a href="assets/879411/c4491522.jpg" class="article-body-image-wrapper"><img src="assets/879411/c4491522.jpg" alt="EyeDropper" loading="lazy" width="800" height="922"></a></p>

<p>And that's it! A <em>ColorPicker</em> with approx <strong>200 bytes</strong> of JavaScript, when minified and gzipped. </p>

<p>In a real-life scenario, you'd probably add a “selection”-circle, listen for <code>pointer-move</code>-events etc., but this should get you started.</p>
