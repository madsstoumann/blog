			<h1>Fetch-22</h1>
			<p>Browsers have supported <code>fetch()</code> for years now (except Internet Explorer), but I still see many developers use classic XHR-based "ajax". </p>

<p>Why is that? I think — partly — it's because <code>fetch()</code> is missing <code>timeout</code> and an easier way of handling errors. Yet, developers <strong>do</strong> want to use it because of its simplicity.<br>
In other words: it's a <strong>fetch-22</strong> situation (bad pun intended!)</p>

<p>I've written a small module, fetch22(), which extends the fetch() init-object with:</p>

<ul>
<li>
<strong>callback(true|false)</strong> : function to call when fetch starts(true) and ends(false)</li>
<li>
<strong>errorHandler(error)</strong> : custom function to run if an error occurs</li>
<li>
<strong>errorList</strong> : Array of status-codes to manually trigger errors</li>
<li>
<strong>parser(response)</strong> : custom function to parse the response, default will use .json() or .text(), depending on response content-type</li>
<li>
<strong>parserArgs</strong> : Array of extra arguments to send to the custom parser after response</li>
<li>
<strong>timeout</strong> : period in milliseconds to allow before a Timeout Error. Default is 9999ms</li>
</ul>

<p>The module itself can be <a href="https://assets.stoumann.dk/js/fetch22.mjs" target="_blank" rel="noopener noreferrer">grabbed here</a>, and a Pen with examples can be seen here (but go to Codepen and see it in full-screen):</p>

<p><iframe height="600" src="https://codepen.io/stoumann/embed/yLaPmaB?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
</p>

<p>Here are some of the examples from the demo:</p>

<h2>
  <a name="custom-callback" href="#custom-callback">
  </a>
  Custom callback
</h2>

<p>The custom callback is called twice, once when the fetch initiates, and then when the fetch is complete done:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">function</span> <span class="nf">startStop</span><span class="p">(</span><span class="nx">bool</span><span class="p">)</span> <span class="p">{</span>
  <span class="k">if </span><span class="p">(</span><span class="nx">bool</span><span class="p">)</span> <span class="p">{</span>
    <span class="nx">console</span><span class="p">.</span><span class="nf">log</span><span class="p">(</span><span class="dl">'</span><span class="s1">START</span><span class="dl">'</span><span class="p">}</span>
  <span class="k">else</span> <span class="p">{</span>
    <span class="nx">console</span><span class="p">.</span><span class="nf">log</span><span class="p">(</span><span class="dl">'</span><span class="s1">STOP</span><span class="dl">'</span><span class="p">);</span>
  <span class="p">}</span>
<span class="p">}</span>
</code></pre>

<h2>
  <a name="custom-errorhandler" href="#custom-errorhandler">
  </a>
  Custom ErrorHandler
</h2>

<p>Receives the error-object as it's only param:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">function</span> <span class="nf">handleError</span><span class="p">(</span><span class="nx">error</span><span class="p">)</span> <span class="p">{</span>
  <span class="nx">console</span><span class="p">.</span><span class="nf">error</span><span class="p">(</span><span class="nx">error</span><span class="p">.</span><span class="nx">name</span><span class="p">,</span> <span class="nx">error</span><span class="p">.</span><span class="nx">message</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>

<h2>
  <a name="custom-parser" href="#custom-parser">
  </a>
  Custom parser
</h2>

<p>The default parser returns json or text, depending on <code>content-type</code>. An example of a custom parser, finding a <code>&lt;symbol&gt;</code> by <code>id</code> in an svg:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="k">async</span> <span class="kd">function</span> <span class="nf">getSymbolFromSVG</span><span class="p">(</span><span class="nx">response</span><span class="p">,</span> <span class="nx">id</span><span class="p">)</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">text</span> <span class="o">=</span> <span class="k">await</span> <span class="nx">response</span><span class="p">.</span><span class="nf">text</span><span class="p">();</span>
  <span class="kd">const</span> <span class="nx">parser</span> <span class="o">=</span> <span class="k">new</span> <span class="nc">DOMParser</span><span class="p">();</span>
  <span class="kd">const</span> <span class="nx">doc</span> <span class="o">=</span> <span class="nx">parser</span><span class="p">.</span><span class="nf">parseFromString</span><span class="p">(</span><span class="nx">text</span><span class="p">,</span> <span class="dl">"</span><span class="s2">text/xml</span><span class="dl">"</span><span class="p">);</span>
  <span class="kd">const</span> <span class="nx">svg</span> <span class="o">=</span> <span class="nx">doc</span><span class="p">.</span><span class="nf">getElementById</span><span class="p">(</span><span class="nx">id</span><span class="p">);</span>
  <span class="k">return</span> <span class="nx">svg</span><span class="p">.</span><span class="nx">outerHTML</span><span class="p">.</span><span class="nf">toString</span><span class="p">();</span>
<span class="p">}</span>
</code></pre>
