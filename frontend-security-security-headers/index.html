			<h1>Frontend Security: Security Headers</h1>
			<p>My previous articles about frontend security focused on <a href="https://dev.to/madsstoumann/frontend-security-npm-audit-and-script-integrity-kl3">script integrity</a> and the <a href="https://dev.to/madsstoumann/frontend-security-content-security-policy-17dl">Content Security Policy</a>.</p>

<p>Now, It's time to look at what can be done server-side.</p>

<p>For these server-fixes, I'm going to use Cloudflare.</p>

<p>Cloudflare has a bunch of services — in their own words:</p>

<blockquote>
<p>Cloudflare secures and ensures the reliability of your external-facing resources such as websites, APIs, and applications. It protects your internal resources such as behind-the-firewall applications, teams, and devices. And it is your platform for developing globally scalable applications.</p>
</blockquote>

<p>They have a super-intuitive user-interface - and for most purposes, it's <em>free!</em>  </p>

<p>You can find guides on their site on how to move your DNS records etc.</p>

<p>But maybe there's no need for you to use Cloudflare? </p>

<p>Before I continue, check your security-headers here: <a href="https://securityheaders.com/" target="_blank" rel="noopener noreferrer">https://securityheaders.com/</a></p>

<p><a href="assets/568401/19372504.jpg" class="article-body-image-wrapper"><img src="assets/568401/19372504.jpg" alt="Security Headers" loading="lazy" width="800" height="110"></a></p>

<p>If you have a red <strong>F</strong>, let's see how we can improve that with Cloudflare.</p>

<p>Now, the first thing to do on <em>any</em> server, is adding <strong>SSL</strong> (HTTPS).</p>

<p>In Cloudflare, go to SSL/TLS, select “Edge Certificates” and check the “Always use HTTPS” box.</p>

<p>Just below that, you'll see the “HTTP Strict Transport Security (HSTS)”-entry.</p>

<p>Click on “Change ”, accept the warnings, check “Enable HSTS”, set “Max Age Header” to (minimum) “1 month”, and check “No-Sniff Header”:</p>

<p><a href="assets/568401/2953221b.jpg" class="article-body-image-wrapper"><img src="assets/568401/2953221b.jpg" alt="Cloudflare HSTS" loading="lazy" width="598" height="716"></a></p>

<blockquote>
<p><strong>UPDATE:</strong> To qualify for <a href="https://hstspreload.org/" target="_blank" rel="noopener noreferrer">HSTS preloading</a>, as mentioned in the comments, set <em>Max-Age Header</em> to "12 Months", and enable both "Apply HSTS policy to subdomains" and "Preload". </p>
</blockquote>

<p>Now, go back to <a href="https://securityheaders.com/" target="_blank" rel="noopener noreferrer">https://securityheaders.com/</a></p>

<p>If you had an <strong>F</strong> before, you should now have a <strong>D</strong>.</p>

<p>Cloudflare doesn't support the other headers <em>out-of-the-box</em>, but luckily they have something called <em>Workers</em>, where you can add them yourself.</p>

<p>Scott Helme has written an excellent article: <a href="https://scotthelme.co.uk/security-headers-cloudflare-worker/" target="_blank" rel="noopener noreferrer">The brand new Security Headers Cloudflare Worker</a></p>

<p>Because the article was written some time ago, you need to manually add the “Permissons-Policy” to Scott's list of “securityHeaders”:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">let</span> <span class="nx">securityHeaders</span> <span class="o">=</span> <span class="p">{</span>
  <span class="dl">"</span><span class="s2">Content-Security-Policy</span><span class="dl">"</span> <span class="p">:</span> <span class="dl">"</span><span class="s2">upgrade-insecure-requests</span><span class="dl">"</span><span class="p">,</span>
  <span class="dl">"</span><span class="s2">Strict-Transport-Security</span><span class="dl">"</span> <span class="p">:</span> <span class="dl">"</span><span class="s2">max-age=1000</span><span class="dl">"</span><span class="p">,</span>
  <span class="dl">"</span><span class="s2">X-Xss-Protection</span><span class="dl">"</span> <span class="p">:</span> <span class="dl">"</span><span class="s2">1; mode=block</span><span class="dl">"</span><span class="p">,</span>
  <span class="dl">"</span><span class="s2">X-Frame-Options</span><span class="dl">"</span> <span class="p">:</span> <span class="dl">"</span><span class="s2">DENY</span><span class="dl">"</span><span class="p">,</span>
  <span class="dl">"</span><span class="s2">X-Content-Type-Options</span><span class="dl">"</span> <span class="p">:</span> <span class="dl">"</span><span class="s2">nosniff</span><span class="dl">"</span><span class="p">,</span>
  <span class="dl">"</span><span class="s2">Referrer-Policy</span><span class="dl">"</span> <span class="p">:</span> <span class="dl">"</span><span class="s2">strict-origin-when-cross-origin</span><span class="dl">"</span><span class="p">,</span>
  <span class="dl">"</span><span class="s2">Permissions-Policy</span><span class="dl">"</span><span class="p">:</span> <span class="dl">"</span><span class="s2">geolocation=(self </span><span class="se">\"</span><span class="s2">https://your.domain</span><span class="se">\"</span><span class="s2">), microphone=()</span><span class="dl">"</span>
<span class="p">}</span>
</code></pre>

<p>When set and done, deploy the worker, and head back to SecurityHeaders:</p>

<p><a href="assets/568401/d1a97f28.jpg" class="article-body-image-wrapper"><img src="assets/568401/d1a97f28.jpg" alt="Security Headers Aplus" loading="lazy" width="800" height="114"></a> </p>

<p>Wow! - from <strong>F</strong> to <strong>A+</strong> in a matter of minutes.</p>


<hr>

<h2>
  <a name="ongoing-maintenance" href="#ongoing-maintenance">
  </a>
  Ongoing maintenance
</h2>

<p>Now, even if you've done all the things I suggest in these posts, you shouldn't rest on your laurels. Security is an ongoing activity — you need to test your site whenever a new script is added, update <code>integrity</code>-attributes, test SecurityHeaders etc. Whenever a new vulnerability is discovered, test again.</p>

<p>You can also use services like <a href="https://probely.com/" target="_blank" rel="noopener noreferrer">Probely</a> or <a href="https://detectify.com/" target="_blank" rel="noopener noreferrer">Detectify</a></p>

<p>These services will deep-scan your site and provide a “todo-list” of things, you potentially need to look into. Here's a screenshot from Detectify:</p>

<p><a href="assets/568401/d6256cf9.jpg" class="article-body-image-wrapper"><img src="assets/568401/d6256cf9.jpg" alt="Detectify" loading="lazy" width="629" height="817"></a> </p>

<p>Starting from EUR 39 (Probely) and USD 50 (Detectify), these services will continuously monitor your site for security vulnerabilities. </p>


<hr>

<h2>
  <a name="conclusion" href="#conclusion">
  </a>
  Conclusion
</h2>

<p>The world of front-end is constantly expanding. It used to be simple enough to define our vocation: HTML, CSS and JavaScript — but does that include animation, email development, accessibility, SEO, tracking, performance engineering or ... security?</p>

<p>I'd argue that it doesn't hurt to know <em>a bit</em> about XSS attacks, Content Security Policy-configuration, or that SVG files can contain (harmful) scripts — but we would probably need a specific role for that, as it's a big and complex topic. </p>

<p>Every website should have a “Security Health-check” at least a couple of times per year. Whether or not it will be a frontend-job ... time will tell!</p>
