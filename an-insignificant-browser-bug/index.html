			<h1>An insignificant browser-bug?</h1>
			<p>Almost 3 years ago, I reported a browser-bug to the Chrome-team:</p>

<p><a href="https://bugs.chromium.org/p/chromium/issues/detail?id=807546" target="_blank" rel="noopener noreferrer">https://bugs.chromium.org/p/chromium/issues/detail?id=807546</a></p>

<p>It is minor for most people, but for typography-geeks, it's ... significant!</p>

<p>In the snippet below, I use 3 fonts:</p>

<p><a href="assets/517453/c2790f6b.jpg" class="article-body-image-wrapper"><img src="assets/517453/c2790f6b.jpg" alt="Chrome" loading="lazy" width="800" height="135"></a></p>

<ul>
<li>
<em>Abhaya Libre Medium</em> for the body-text</li>
<li>
<em>Cormorant SC SemiBold</em> for the first <em>line</em> of a paragraph</li>
<li>
<em>Yeseva One</em> for the first <em>letter</em> of a new paragraph, that's the <code>first-of-type</code> within a section.</li>
</ul>

<p>The quoted entries are within <code>&lt;q&gt;</code>-tags, using the standard <code>open-quote</code> and <code>close-quote</code> as <code>content</code> for the <code>::before</code> and <code>::after</code> pseudo-elements.</p>

<p>Here's the same snippet in <em>Firefox;</em><br>
<a href="assets/517453/5ce1f663.jpg" class="article-body-image-wrapper"><img src="assets/517453/5ce1f663.jpg" alt="Firefox" loading="lazy" width="800" height="136"></a></p>

<p><strong>Can you spot the issue?</strong></p>

<p>Firefox correctly use <em>Cormorant SC SemiBold</em> for the quotes in the first-line, since there's a CSS-rule:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.article__section</span><span class="o">&gt;</span><span class="nt">p</span><span class="nd">:first-of-type::first-line</span> <span class="p">{</span>
  <span class="nl">font-family</span><span class="p">:</span> <span class="s1">"Cormorant SC"</span><span class="p">,</span> <span class="nb">serif</span><span class="p">;</span>
  <span class="nl">font-weight</span><span class="p">:</span> <span class="m">600</span><span class="p">;</span>
  <span class="nl">font-size</span><span class="p">:</span> <span class="m">1.2em</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>But Chrome (and Safari), use the body-font, <em>Abhaya Libre Medium</em>, for the quotes, but the correct font for everything else on the line.</p>

<p>It's not the end of the world, but funny it's not been fixed yet, maybe it <em>is</em> too insignificant after all!?</p>
