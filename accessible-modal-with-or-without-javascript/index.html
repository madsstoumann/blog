		<article>
			<h1>Accessible Modal With Or Without JavaScript</h1>
			<p>At my workplace, we recently discussed the various options we have in our toolbox to create modals <em>without</em> JavaScript. Basically, if we want a modal that works without JavaScript, we need the <code>open/close</code>-state in <code>html</code>, limiting our options to:</p>

<ol>
<li>
<code>:target</code>-selector</li>
<li>
<code>&lt;details&gt;</code>-tag</li>
<li>The <code>checkbox</code>-hack</li>
</ol>

<p>In this post I'm gonna focus on <code>:target</code>, discuss it's pros and cons, and progressively add JavaScript to handle <strong>focus-trap</strong>.</p>

<p>A modal using <code>:target</code> requires the <em>fragment identifier</em>: <code>#</code>. </p>

<p>The basic idea is this:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;a</span> <span class="na">href=</span><span class="s">"#modal"</span><span class="nt">&gt;</span>Open modal<span class="nt">&lt;/a&gt;</span>

<span class="nt">&lt;div</span> <span class="na">class=</span><span class="s">"c-modal"</span> <span class="na">id=</span><span class="s">"modal"</span><span class="nt">&gt;</span>
  Modal content here ...
<span class="nt">&lt;/div&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>

    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>

<p>And in CSS:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.c-modal</span> <span class="p">{</span>
  <span class="nl">display</span><span class="p">:</span> <span class="nb">none</span><span class="p">;</span>
<span class="p">}</span>
<span class="nc">.c-modal</span><span class="nd">:target</span> <span class="p">{</span>
  <span class="nl">display</span><span class="p">:</span> <span class="nb">block</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

<p>This will hide the <code>&lt;div class="c-modal"&gt;</code> by default, but whenever there's a <em>target</em>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight plaintext"><code>https://your.domain#modal
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>

</svg>

</div>
</div>
</div>



<p>The element matching that target, in this case the element with <code>id="modal"</code>, will be shown.</p>

<p>The <em>Close</em>-button is simply a link, that removes the target from the current url:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;a</span> <span class="na">href=</span><span class="s">"#"</span><span class="nt">&gt;</span>Close modal<span class="nt">&lt;/a&gt;</span>
</code></pre>

    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>

<hr>

<h2>
  <a name="pros-and-cons" href="#pros-and-cons">
  </a>
  Pros And Cons
</h2>

<p>We now have a modal that works with HTML/CSS only, but we can <em>progressively enhance</em> it, by adding only a few bits of JavaScript.</p>

<p>But before we do that — let's look at some pros and cons.</p>

<p><strong>Pros</strong></p>

<ul>
<li>Super-easy to code and maintain</li>
<li>Works without JavaScript (but I recommend you add some, read on!)</li>
</ul>

<p><strong>Cons</strong></p>

<ul>
<li>You can't use the fragment identifier for other stuff, such as routing</li>
<li>This works best with <em>root</em>, so: <code>yourdomain.com/#modal</code> instead of <code>yourdomain.com/document.html#modal</code>
</li>
</ul>

<p>Do we need to add <code>role="dialog"</code> and other aria-enhancements?</p>

<p>Normally, “Yes!”, but in the case of <code>:target</code>, I'm tempted to say “No!”.</p>

<p>We're using the fragment identifier <code>#</code> to go to text within the same document, so for the screen-reader it's not really a <em>modal</em>. We simply jump back and forth between content within the same document. Am I wrong? Please let me know in a comment.</p>


<hr>

<h2>
  <a name="adding-focustrap" href="#adding-focustrap">
  </a>
  Adding Focus-trap
</h2>

<p>For the modal to be keyboard-navigable, ie. <em>accessible</em>, we need to "trap" the focus, when the modal is open. Whenever you click on a modal, the focus should be set on the first focusable element in the modal. When you press <code>Tab</code> (with or without <code>Shift</code>), it should cycle between the focusable elements in the modal — until you press <code>Escape</code> (or click on the <code>Cancel/Close</code>-buttons.</p>

<p>Instead of adding <code>eventListeners</code> to all <code>&lt;a&gt;</code>-tags that links to modals, we can use the global <code>window.hashchange</code>-event:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nb">window</span><span class="p">.</span><span class="nf">addEventListener</span><span class="p">(</span><span class="dl">'</span><span class="s1">hashchange</span><span class="dl">'</span><span class="p">,</span> <span class="p">(</span><span class="nx">event</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="p">{</span>
 <span class="c1">// Handle hashchange</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Within this listener, we can look at <code>event.newURL</code>, <code>event.oldURL</code> as well as <code>location.hash</code>. With these, we can easily detect if the current or previous <code>url</code> contains anything that could be interpreted as a modal.</p>

<p>If the current url <em>is</em> a modal, we can query it for focusable elements:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">FOCUSABLE</span> <span class="o">=</span> <span class="dl">'</span><span class="s1">button,[href],select,textarea,input:not([type="hidden"]),[tabindex]:not([tabindex="-1"])</span><span class="dl">'</span><span class="p">;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>I prefer to set this as an <code>Array</code>-property on the modal itself:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nx">modal</span><span class="p">.</span><span class="nx">__f</span> <span class="o">=</span> <span class="p">[...</span><span class="nx">modal</span><span class="p">.</span><span class="nf">querySelectorAll</span><span class="p">(</span><span class="nx">FOCUSABLE</span><span class="p">)];</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>This way, we can access the list from within the <code>keydown</code>-event-handler:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">function</span> <span class="nf">keyHandler</span><span class="p">(</span><span class="nx">event</span><span class="p">)</span> <span class="p">{</span>
<span class="cm">/* We just want to listen to Tab- and Escape-
keystrokes. If Tab, prevent default behaviour. */</span>
<span class="k">if </span><span class="p">(</span><span class="nx">event</span><span class="p">.</span><span class="nx">key</span> <span class="o">===</span> <span class="dl">'</span><span class="s1">Tab</span><span class="dl">'</span><span class="p">)</span> <span class="p">{</span>
  <span class="nx">event</span><span class="p">.</span><span class="nf">preventDefault</span><span class="p">();</span>
  <span class="cm">/* Get array-length of focusable elements */</span>
  <span class="kd">const</span> <span class="nx">len</span> <span class="o">=</span>  <span class="k">this</span><span class="p">.</span><span class="nx">__f</span><span class="p">.</span><span class="nx">length</span> <span class="o">-</span> <span class="mi">1</span><span class="p">;</span>
  <span class="cm">/* Find current elements index in array of
 focusable elements */</span>
  <span class="kd">let</span> <span class="nx">index</span> <span class="o">=</span> <span class="k">this</span><span class="p">.</span><span class="nx">__f</span><span class="p">.</span><span class="nf">indexOf</span><span class="p">(</span><span class="nx">event</span><span class="p">.</span><span class="nx">target</span><span class="p">);</span>
  <span class="cm">/* If shift-key is pressed, decrease index,
 otherwise increase index */</span>
  <span class="nx">index</span> <span class="o">=</span> <span class="nx">event</span><span class="p">.</span><span class="nx">shiftKey</span> <span class="p">?</span> <span class="nx">index</span><span class="o">-</span><span class="mi">1</span> <span class="p">:</span> <span class="nx">index</span><span class="o">+</span><span class="mi">1</span><span class="p">;</span>
  <span class="cm">/* Check boundaries. If index is smaller 
than 0, set it to len, and vice versa, so 
focus "cycles" in modal */</span>
  <span class="k">if </span><span class="p">(</span><span class="nx">index</span> <span class="o">&lt;</span> <span class="mi">0</span><span class="p">)</span> <span class="nx">index</span> <span class="o">=</span> <span class="nx">len</span><span class="p">;</span>
  <span class="k">if </span><span class="p">(</span><span class="nx">index</span> <span class="o">&gt;</span> <span class="nx">len</span><span class="p">)</span> <span class="nx">index</span> <span class="o">=</span> <span class="mi">0</span><span class="p">;</span>
  <span class="cm">/* Set focus on element matching new index */</span>
  <span class="k">this</span><span class="p">.</span><span class="nx">__f</span><span class="p">[</span><span class="nx">index</span><span class="p">].</span><span class="nf">focus</span><span class="p">();</span>
<span class="p">}</span>
<span class="cm">/* Set hash to '#' === "Close Modal", when 
Escape is pressed */</span>
<span class="k">if </span><span class="p">(</span><span class="nx">event</span><span class="p">.</span><span class="nx">key</span> <span class="o">===</span> <span class="dl">'</span><span class="s1">Escape</span><span class="dl">'</span><span class="p">)</span> <span class="nx">location</span><span class="p">.</span><span class="nx">hash</span> <span class="o">=</span> <span class="dl">'</span><span class="s1">#</span><span class="dl">'</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The final <code>hashchange</code>-listener, which restores the focus to the <strong>old id</strong> (the link, that triggered the modal) when the fragment identifier changes to <code>#</code>, looks like this:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="nb">window</span><span class="p">.</span><span class="nf">addEventListener</span><span class="p">(</span><span class="dl">'</span><span class="s1">hashchange</span><span class="dl">'</span><span class="p">,</span> <span class="p">(</span><span class="nx">event</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">hash</span> <span class="o">=</span> <span class="nx">location</span><span class="p">.</span><span class="nx">hash</span><span class="p">;</span>
  <span class="cm">/* '#' is different from just '#' */</span>
  <span class="k">if </span><span class="p">(</span><span class="nx">hash</span><span class="p">.</span><span class="nx">length</span> <span class="o">&gt;</span> <span class="mi">1</span><span class="p">)</span> <span class="p">{</span>
    <span class="kd">const</span> <span class="nx">modal</span> <span class="o">=</span> <span class="nb">document</span><span class="p">.</span><span class="nf">getElementById</span><span class="p">(</span><span class="nx">hash</span><span class="p">.</span><span class="nf">substr</span><span class="p">(</span><span class="mi">1</span><span class="p">));</span>
    <span class="k">if </span><span class="p">(</span><span class="nx">modal</span><span class="p">)</span> <span class="p">{</span>
    <span class="cm">/* If modal exists, add keydown-listener, 
    set __f-property as an array of focusable elements */</span>
      <span class="nx">modal</span><span class="p">.</span><span class="nf">addEventListener</span><span class="p">(</span><span class="dl">'</span><span class="s1">keydown</span><span class="dl">'</span><span class="p">,</span> <span class="nx">keyHandler</span><span class="p">);</span>
      <span class="nx">modal</span><span class="p">.</span><span class="nx">__f</span> <span class="o">=</span> <span class="p">[...</span><span class="nx">modal</span><span class="p">.</span><span class="nf">querySelectorAll</span><span class="p">(</span><span class="nx">FOCUSABLE</span><span class="p">)];</span>
      <span class="cm">/* Set focus on first focusable element */</span>
      <span class="nx">modal</span><span class="p">.</span><span class="nx">__f</span><span class="p">[</span><span class="mi">0</span><span class="p">].</span><span class="nf">focus</span><span class="p">();</span>
    <span class="p">}</span>
  <span class="p">}</span>
  <span class="k">else</span> <span class="p">{</span>
    <span class="cm">/* If hash change to just '#', find previous (old) id, 
    remove event, and focus on link, that triggered the modal */</span>
    <span class="kd">const</span> <span class="p">[</span><span class="nx">o</span><span class="p">,</span> <span class="nx">oldID</span><span class="p">]</span> <span class="o">=</span> <span class="nx">event</span><span class="p">.</span><span class="nx">oldURL</span><span class="p">.</span><span class="nf">split</span><span class="p">(</span><span class="dl">'</span><span class="s1">#</span><span class="dl">'</span><span class="p">);</span>
    <span class="k">if </span><span class="p">(</span><span class="nx">oldID</span><span class="p">)</span> <span class="p">{</span>
      <span class="nb">document</span><span class="p">.</span><span class="nf">getElementById</span><span class="p">(</span><span class="nx">oldID</span><span class="p">).</span><span class="nf">removeEventListener</span><span class="p">(</span><span class="dl">'</span><span class="s1">keydown</span><span class="dl">'</span><span class="p">,</span> <span class="nx">keyHandler</span><span class="p">);</span>
      <span class="nb">document</span><span class="p">.</span><span class="nf">querySelector</span><span class="p">(</span><span class="s2">`[href="#</span><span class="p">${</span><span class="nx">oldID</span><span class="p">}</span><span class="s2">"]`</span><span class="p">).</span><span class="nf">focus</span><span class="p">();</span>
    <span class="p">}</span>
  <span class="p">}</span>
<span class="p">});</span>
</code></pre>
