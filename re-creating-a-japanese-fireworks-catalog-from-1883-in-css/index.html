			<h1>Re-creating a Japanese Fireworks Catalog from 1883 in CSS</h1>
			<p>The other day I received a newsletter from the author Robin Sloan, containing samples of some beautiful old pages from a Japanese fireworks catalog from 1883:</p>

<p><a href="assets/1526706/fbddfc8d.jpg" class="article-body-image-wrapper"><img src="assets/1526706/fbddfc8d.jpg" alt="Fireworks Catalog" loading="lazy" width="800" height="573"></a></p>

<p>This coincided with Codepen's weekly challenge being "Fireworks" — so I just <strong>had</strong> to try to re-create these beauties.</p>

<p>This is what I ended up with — my own interpretation of a mix between item № 66 and item № 67:</p>

<p><a href="assets/1526706/3a4db18a.jpg" class="article-body-image-wrapper"><img src="assets/1526706/3a4db18a.jpg" alt="Fireworks" loading="lazy" width="800" height="1168"></a></p>

<p>It involves a lot of small, interesting stuff, that I'd like to share!</p>


<hr>

<h2>
  <a name="grainy-overlay" href="#grainy-overlay">
  </a>
  Grainy Overlay
</h2>

<p>To get that rough, grainy look, I added an overlay covering the whole page — it's on <code>::after</code> on the <code>&lt;body&gt;</code>-tag, and was made using <a href="https://grainy-gradients.vercel.app/" target="_blank" rel="noopener noreferrer">Grainy Gradients Playground</a>.</p>


<hr>

<h2>
  <a name="small-starsexplosions" href="#small-starsexplosions">
  </a>
  Small Stars/Explosions
</h2>

<p>The smaller stars/explosions are using <code>clip-path</code>, made with my own tool, "Polygon to clip-path and SVG" — you can find it on Codepen:</p>

<p><iframe height="600" src="https://codepen.io/stoumann/embed/MWjBRJv?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
</p>

<blockquote>
<p>This tool has a lot of sentimental value to me, as the original algorithm was coded by a dear friend of mine, who sadly passed away in 2020.</p>
</blockquote>


<hr>

<h2>
  <a name="large-starexplosion" href="#large-starexplosion">
  </a>
  Large Star/Explosion
</h2>

<p>The main explosion consists of a <code>grid</code> with all items being placed center, using <code>grid-column: 1/-1</code> and <code>grid-row: 1/-1</code>. It's the new <code>position: absolute</code> for me, but with added flexibility. Each <code>&lt;b&gt;</code>-sub-node has it's own <code>--deg</code>(degree)-property, a total of 36 with a 10 degree between them.</p>

<p>On top of these, I've placed a mask with a <code>repeating-conic-gradient</code> to "cut out" the inner stacks of <code>&lt;b&gt;</code>s:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">--mask</span><span class="o">:</span> <span class="nt">repeating-conic-gradient</span><span class="o">(</span>
  <span class="nt">from</span> <span class="err">45</span><span class="nt">deg</span> <span class="nt">at</span> <span class="err">50</span><span class="o">%</span> <span class="err">50</span><span class="o">%,</span>
  <span class="nt">var</span><span class="o">(</span><span class="nt">--red</span><span class="o">)</span> <span class="err">0</span><span class="nt">deg</span> <span class="err">7</span><span class="o">.</span><span class="err">5</span><span class="nt">deg</span><span class="o">,</span>
  <span class="nt">transparent</span> <span class="err">7</span><span class="o">.</span><span class="err">5</span><span class="nt">deg</span> <span class="err">10</span><span class="nt">deg</span><span class="o">);</span>
</code></pre>

</div>
</div>

<hr>

<h2>
  <a name="google-fonts-api" href="#google-fonts-api">
  </a>
  Google Fonts API
</h2>

<p>I'm using two fonts, one for the numbers and one for the ampersand. It would be a complete waste of bandwidth to load the entire character-sets, so luckily Google Fonts support specifying only the characters you need, using the <code>text</code>-parameter in the URL:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="c">/* Numero Sign and Numbers */</span>
<span class="k">@import</span> <span class="sx">url('fonts.googleapis.com ... &amp;text=№67')</span><span class="p">;</span>
<span class="c">/* Other font, Ampersand */</span>
<span class="k">@import</span> <span class="sx">url('fonts.googleapis.com ... &amp;text=%26')</span><span class="p">;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">

<hr>

<h2>
  <a name="masks-and-other-stuff" href="#masks-and-other-stuff">
  </a>
  Masks and other stuff
</h2>

<ul>
<li><p>On the black background <em>and</em> on the box with numbers, I use a mask, I found on <a href="https://open-props.style/" target="_blank" rel="noopener noreferrer">Open Props</a>.</p></li>
<li><p>I'm using <code>cqi</code>-units (container-queries), so it's fully responsive.</p></li>
<li><p>I'm using native CSS nesting, so don't preview in Firefox ;-)</p></li>
</ul>
