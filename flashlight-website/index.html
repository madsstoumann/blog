			<h1>Flashlight Website</h1>
			<p>In “How To Avoid a Climate Disaster”, Bill Gates writes about kids, who're doing their homework by candle- or flashlight, either because of unstable electricity — or no electricity at all.</p>

<p>Imagine if you had to browse the web in a similar way — pretty annoying.</p>

<p>To show you just <strong>how</strong> annoying that is, I've made a fun little "flashlight-only"-website here (click on the flash and move it around):</p>

<p><iframe height="600" src="https://codepen.io/stoumann/embed/wvoeVZx?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
</p>

<p>We need to reduce carbon emissions <em>and</em> upgrade the living conditions for millions of people, so nobody have to study by candelight.</p>

<p>Quite a challenge.</p>


<hr>

<h2>
  <a name="how-i-did-it" href="#how-i-did-it">
  </a>
  How I Did It
</h2>

<p>I looked into ways of “cutting a hole” using clipping or masking, but ended up with something much simpler: <strong>a radial gradient</strong>.<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">body</span> <span class="p">{</span>
  <span class="nl">background</span><span class="p">:</span> <span class="n">radial-gradient</span><span class="p">(</span><span class="nb">circle</span> <span class="n">at</span> <span class="n">var</span><span class="p">(</span><span class="n">--x</span><span class="p">)</span> <span class="n">var</span><span class="p">(</span><span class="n">--y</span><span class="p">),</span> <span class="n">rgba</span><span class="p">(</span><span class="m">255</span><span class="p">,</span> <span class="m">255</span><span class="p">,</span> <span class="m">224</span><span class="p">,</span> <span class="m">0.77</span><span class="p">)</span> <span class="n">var</span><span class="p">(</span><span class="n">--w</span><span class="p">),</span> <span class="n">rgba</span><span class="p">(</span><span class="m">0</span><span class="p">,</span> <span class="m">0</span><span class="p">,</span> <span class="m">0</span><span class="p">,</span> <span class="m">0.97</span><span class="p">)</span> <span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--w</span><span class="p">)</span> <span class="err">+</span> <span class="m">1%</span><span class="p">));</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>

</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>

</svg>

</div>
</div>
</div>



<p>The <code>--w</code> is the width of the inner, semi-transparent ring, while the <code>--x</code> and <code>--y</code> are coordinates, set by JavaScript:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">function</span> <span class="nf">move</span><span class="p">(</span><span class="nx">event</span><span class="p">)</span> <span class="p">{</span>
  <span class="nb">document</span><span class="p">.</span><span class="nx">body</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nf">setProperty</span><span class="p">(</span><span class="dl">'</span><span class="s1">--x</span><span class="dl">'</span><span class="p">,</span> <span class="nf">parseInt</span><span class="p">((</span><span class="nx">event</span><span class="p">.</span><span class="nx">pageX</span> <span class="o">/</span> <span class="nb">document</span><span class="p">.</span><span class="nx">documentElement</span><span class="p">.</span><span class="nx">offsetWidth</span><span class="p">)</span> <span class="o">*</span> <span class="mi">100</span><span class="p">,</span> <span class="mi">10</span><span class="p">)</span><span class="o">+</span><span class="dl">'</span><span class="s1">%</span><span class="dl">'</span><span class="p">);</span>
  <span class="nb">document</span><span class="p">.</span><span class="nx">body</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nf">setProperty</span><span class="p">(</span><span class="dl">'</span><span class="s1">--y</span><span class="dl">'</span><span class="p">,</span> <span class="nf">parseInt</span><span class="p">((</span><span class="nx">event</span><span class="p">.</span><span class="nx">pageY</span> <span class="o">/</span> <span class="nb">document</span><span class="p">.</span><span class="nx">documentElement</span><span class="p">.</span><span class="nx">offsetHeight</span><span class="p">)</span> <span class="o">*</span> <span class="mi">100</span><span class="p">,</span> <span class="mi">10</span><span class="p">)</span><span class="o">+</span><span class="dl">'</span><span class="s1">%</span><span class="dl">'</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
