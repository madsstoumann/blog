		<article>
			<h1>Product variants with schemas</h1>
			<p>To create product <em>variants</em> with structured markup — for instance a phone available in different colors — you&#8217;ll need to use the <a href="http://schema.org/Product" target="_blank">Product-schema</a> <em>and</em> the <a href="http://schema.org/ProductModel" target="_blank">Product Model</a>-schema.</p>
<p>In this blog-post I&#8217;ll mark up an <em>iPhone 6 16GB</em> with 3 different variants: <em>gold</em>, <em>silver</em> and <em>spacegray</em>.</p>
<p>As an added bonus, I&#8217;m gonna toggle between the 3 variants <strong>without JavaScript</strong>, using the wonderful <a href="http://css-tricks.com/the-checkbox-hack/" target="_blank">checkbox hack</a>!</p>
<p><a href="http://www.stoumann.dk/examples/variants/" target="_blank"><strong>A working demo of all this is available here</strong></a>.<br />
Open it in a new tab, and read on &hellip;</p>
<p>The basic product-markup, including the data all product-variants have in common: <em>name, description, condition, breadcrumbs</em> and <em>price</em>:</p>
<pre class="brush: xml; title: ; notranslate" title="">
&lt;article itemscope itemtype=&quot;http://schema.org/Product&quot; class=&quot;product&quot;&gt;
  &lt;section class=&quot;product-info&quot;&gt;
    &lt;h1 itemprop=&quot;name&quot;&gt;iPhone 6 - 16GB&lt;/h1&gt;
    &lt;p itemprop=&quot;description&quot;&gt;
      ...
    &lt;/p&gt;
    &lt;meta itemprop=&quot;itemCondition&quot; content=&quot;NewCondition&quot; /&gt;
    &lt;div itemprop=&quot;offers&quot; itemscope itemtype=&quot;http://schema.org/Offer&quot;&gt;
      &lt;meta itemprop=&quot;category&quot; content=&quot;Apple &gt; iPhone &gt; iPhone 6&quot; /&gt;
      &lt;span itemprop=&quot;price&quot;&gt;5799,00&lt;/span&gt;
      &lt;span itemprop=&quot;priceCurrency&quot;&gt;DKK&lt;/span&gt;
    &lt;/div&gt;
    &lt;span itemprop=&quot;image&quot; itemscope itemtype=&quot;http://schema.org/ImageObject&quot;&gt;
      &lt;meta itemprop=&quot;contentUrl&quot; content=&quot;iphone6-gold-select-2014.png&quot; /&gt;
    &lt;/span&gt;
  &lt;/section&gt;
  ...
</pre>
<p>And now for the variants. Each variant is wrapped in a <em>figure</em>-tag, that will hold the <em>product variant</em>-image as well as a caption and some hidden data:</p>
<pre class="brush: xml; title: ; notranslate" title="">
&lt;figure itemscope itemtype=&quot;http://schema.org/ProductModel&quot; itemid=&quot;#gold&quot;&gt;
  &lt;img src=&quot;iphone6-gold-select-2014.png&quot; class=&quot;product-image&quot; /&gt;
  &lt;figcaption&gt;
    &lt;span itemprop=&quot;offers&quot; itemscope itemtype=&quot;http://schema.org/Offer&quot; class=&quot;product-offer&quot;&gt;
      &lt;meta itemprop=&quot;availability&quot; content=&quot;InStock&quot; /&gt;
      &lt;button class=&quot;product-buy-button&quot;&gt;Buy this phone now&lt;/button&gt;
    &lt;/span&gt;
    &lt;link itemprop=&quot;additionalType&quot; href=&quot;/&quot; /&gt;
    &lt;meta itemprop=&quot;name&quot; content=&quot;iPhone 6 - 16GB - Gold&quot; /&gt;
    &lt;meta itemprop=&quot;gtin13&quot; content=&quot;12345678901&quot; /&gt;
  &lt;/figcaption&gt;
&lt;/figure&gt;
</pre>
<p>Each variant has an <em>itemid</em>, which we&#8217;ll use later to target the variant directly &mdash; as well as a unique <em>gtin</em>-number, a <em>variant-name</em> and an Offer.<br />
All these attributes can be unique per variant. </p>
<p>Here&#8217;s a variant that&#8217;s currently sold out:</p>
<pre class="brush: xml; title: ; notranslate" title="">
&lt;figure itemscope itemtype=&quot;http://schema.org/ProductModel&quot; itemid=&quot;#silver&quot;&gt;
  &lt;img src=&quot;iphone6-silver-select-2014.png&quot; class=&quot;product-image&quot; /&gt;
  &lt;figcaption&gt;
    &lt;span itemprop=&quot;offers&quot; itemscope itemtype=&quot;http://schema.org/Offer&quot; class=&quot;product-offer&quot;&gt;
      &lt;meta itemprop=&quot;availability&quot; content=&quot;OutOfStock&quot; /&gt;
      &lt;span class=&quot;product-sold-out&quot;&gt;Out of Stock. Will be back in stock on April 5th.&lt;/span&gt;
    &lt;/span&gt;
    &lt;link itemprop=&quot;additionalType&quot; href=&quot;/&quot; /&gt;
    &lt;meta itemprop=&quot;name&quot; content=&quot;iPhone 6 - 16GB - Silver&quot; /&gt;
    &lt;meta itemprop=&quot;gtin13&quot; content=&quot;12345678902&quot; /&gt;
  &lt;/figcaption&gt;
&lt;/figure&gt;
</pre>
<p>And now for the promised checkbox-hack! Add this before the product variants-wrapper:</p>
<pre class="brush: xml; title: ; notranslate" title="">
&lt;aside class=&quot;product-variant&quot;&gt;
  &lt;h2&gt;Choose a finish:&lt;/h2&gt;
  &lt;input type=&quot;radio&quot; name=&quot;img-select-grp&quot; id=&quot;gold&quot; value=&quot;12345678901&quot; checked /&gt;&lt;label for=&quot;gold&quot; class=&quot;gold&quot;&gt;Gold&lt;/label&gt;
  &lt;input type=&quot;radio&quot; name=&quot;img-select-grp&quot; id=&quot;silver&quot; value=&quot;12345678902&quot; /&gt;&lt;label for=&quot;silver&quot; class=&quot;silver&quot;&gt;Silver&lt;/label&gt;
  &lt;input type=&quot;radio&quot; name=&quot;img-select-grp&quot; id=&quot;spacegray&quot; value=&quot;12345678903&quot; /&gt;&lt;label for=&quot;spacegray&quot; class=&quot;gray&quot;&gt;Gray&lt;/label&gt;
  ...
</pre>
<p>The radiobutton will select the given variant, and using <em>:checked</em> in the CSS, we&#8217;ll show and hide the various variants.</p>
<p><a href="http://www.stoumann.dk/examples/variants/" target="_blank">Go see the demo</a>, and try to paste it&#8217;s source to <a href="http://developers.google.com/structured-data/testing-tool/" target="_blank">Google&#8217;s Structured Data Testing Tool</a>.</p>
<h2>Go directly to a variant</h2>
<p>To directly link to a specific variant, based on the schemas <em>itemid</em> and the <em>id</em> of the selected variant/radiobutton, use a small piece of JavaScript (modify it and embed it in the load-event of your page):</p>
<pre class="brush: jscript; title: ; notranslate" title="">
&lt;script&gt;
  var oSel = document.getElementById(location.hash.slice(1)); 
  if (oSel) oSel.checked = true;
&lt;/script&gt;
</pre>
<p><em>Example:</em><br />
<a href="http://www.stoumann.dk/examples/variants/#silver" target="_blank">Go to the silver-variant directly</a>.</p>
<p>I&#8217;ll soon update my <a href="http://www.stoumann.dk/examples/editor/" target="_blank">Structured Markup Editor</a> to also handle product-variants.</p>
