			<h1>Crisp SVG Icons</h1>
			<p>I&#8217;ve been using icon-fonts for many years. There&#8217;s great browser-support, even IE5.5 is supposed to support them!</p>
<p>But on my newest project, I ditched them, and went for SVG-icons. Why?</p>
<p>First of all, it&#8217;s much easier to edit SVG, it&#8217;s XML-markup. A font needs to be recompiled/rewritten, and for full browser-support, a lot of different formats are needed.</p>
<p>When a font <em>fails to load</em>, the character-value of the font is displayed instead. So, if the character for a <em>Home</em>-icon is &#8220;H&#8221; and the font fails to load, the user will see this:</p>
<p>HHome</p>
<p>Not cool.</p>
<p>Secondly, it&#8217;s possible to create something similar to an <em>image sprite</em> with SVG, using the &lt;symbol&gt;-tag. Using this technique, only <em>one request</em> is needed for all svg-icons on a site.</p>
<h3>SVG &#8220;Sprite&#8221; using &lt;symbol&gt;</h3>
<pre class="brush: xml; title: ; notranslate" title="">
&lt;svg xmlns=&quot;http://www.w3.org/2000/svg&quot; xmlns:xlink=&quot;http://www.w3.org/1999/xlink&quot;&gt;
  &lt;symbol id=&quot;ico_favorites&quot; viewBox=&quot;0 0 48 48&quot;&gt;
    &lt;path d=&quot;M35.1,43L24,36L13,43.1c-1.4,0.9-2.2,0.3-1.8-1.3l3.3-12.7L4.3,20.8c-1.3-1-1-2,0.7-2.1l13.1-0.8l4.8-12.2 c0.6-1.5,1.6-1.5,2.2,0l4.8,12.2L43,18.6c1.7,0.1,2,1,0.7,2.1L33.5,29l3.4,12.7C37.3,43.3,36.5,43.9,35.1,43z&quot; /&gt;
  &lt;/symbol&gt;

  &lt;symbol id=&quot;ico_search&quot; viewBox=&quot;0 0 48 48&quot;&gt;
  ... etc.
  &lt;/symbol&gt;
&lt;/svg&gt;
</pre>
<p>If the code above were to be saved to a file named <em>icons.svg</em> under a folder called <em>svg</em>, the following syntax is used to embed an icon:</p>
<pre class="brush: xml; title: ; notranslate" title="">
&lt;svg&gt;&lt;use xlink:href=&quot;svg/icons.svg#ico_favorites&quot;&gt;&lt;/use&gt;&lt;/svg&gt;
</pre>
<p>There are <em>pros</em> and <em>cons</em> using this method. Mostly pros!<br />
When using inline SVG you can style the individual paths using CSS &mdash; unfortunately, this is not possible using &lt;symbol&gt;, as discussed <a href="https://css-tricks.com/svg-use-with-external-reference-take-2/" target="_blank">here</a>.</p>
<p>However, you can still use <em>fill</em> on &lt;symbol&gt; which was all you could using font-icons, so &hellip;</p>
<p>My favourite icon-font-provider, <a href="http://icomoon.io" target="_blank">IcoMoon</a>, have already added <em>Export to SVG/Symbol</em>-functionality, so the switch from icon-fonts to SVG is easier than ever!</p>
<h3>So sensiTive</h3>
<p><strong>Tip!</strong> SVG is caseSensitive, so it&#8217;s <em>viewBox</em> instead of <em>viewbox</em> &mdash; I learned this the hard way!</p>
<h3>And finally &hellip;</h3>
<p>To make all this work in other browsers than Chrome (for the moment!), you need to add a small JavaScript: <a href="https://github.com/jonathantneal/svg4everybody" target="_blank">Svg4Everybody</a>.</p>
<p>Happy coding!</p>
