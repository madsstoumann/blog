<h2>
  <a name="journey" href="#journey">
  </a>
  Journey
</h2>

<p>Not much CSS required. It's a <code>radial-gradient</code> for the sun and a <code>linear-gradient</code> for the sky. The <code>&lt;main&gt;</code>-element has been styled with a sandy background, and I've removed all the default styling from it's children using <code>all: unset;</code>:<br>
</p>

<div class="highlight js-code-highlight">
