			<h1>The Curse of the Click-delay!</h1>
			<p>There are multiple articles around the Web about what has been dubbed <a href="http://blog.ionic.io/hybrid-apps-and-the-curse-of-the-300ms-delay/" target="_blank">&#8220;The curse of the 300ms delay&#8221;</a>. It&#8217;s a delay, the touch-based browser adds to a user-click-interaction.</p>
<p>When you&#8217;re clicking on an element in a browser, this is what&#8217;s happening:</p>
<blockquote><p>1. The user touches the display, the browser fires off touchstart<br />
2. The user stops touching the display, the browser fires off touchend<br />
3. The browser waits 300ms to see if the user taps again<br />
4. If the user didn’t tap again, the browser fires off click</p></blockquote>
<p>For most use-cases this is OK &#8211; in the example below, a checkbox has been styled like a switch &#8211; using only HTML and CSS:</p>
<div class="embed-codepen"><iframe title="Switch 1 - No JavaScript" id="cp_embed_rOqWQx" src="https://codepen.io/stoumann/embed/preview/rOqWQx?default-tabs=css%2Cresult&amp;height=300&amp;host=https%3A%2F%2Fcodepen.io&amp;slug-hash=rOqWQx" scrolling="no" frameborder="0" height="300" allowtransparency="true" allowfullscreen="true" allowpaymentrequest="true" class="cp_embed_iframe" style="width: 100%; overflow: hidden;"></iframe></div>
<p><strong>You should test this on a touch-device</strong>.</p>
<p>You&#8217;ll notice the grey box around the switch and the label while clicking.<br />
Luckily, this can be disabled with:</p>
<pre class="brush: css; title: ; notranslate" title="">
-webkit-tap-highlight-color: rgba(0, 0, 0, 0);
</pre>
<p>The callout/context-menu can be disabled with:</p>
<pre class="brush: css; title: ; notranslate" title="">
-webkit-touch-callout: none;
</pre>
<p>But the 300ms delay is still there. And when you&#8217;re aware of it — it seems <em>even longer</em> than 300ms!</p>
<p>There are a number of scripts that can remove the delay and fire the events immediately, the most popular being <a href="https://github.com/ftlabs/fastclick" target="_blank">fastClick</a> and <a href="https://github.com/munkychop/swiftclick" target="_blank">swiftClick</a>.</p>
<p>While these are complex scripts that take a long list of scenarios into account, for my use &mdash; the checkbox-hack &mdash; a much simpler solution can be used:</p>
<pre class="brush: jscript; title: ; notranslate" title="">
/**
*	fastcheck.js
*	Fast checkbox/radio-button-check for touch-devices, removing the 300ms delay
*	(c)	Copyright 2015 Mads Stoumann
*/
(function () {
&quot;use strict&quot;;
if(&quot;onorientationchange&quot; in window &amp;&amp; &quot;ontouchstart&quot; in window) {
	document.body.addEventListener(&quot;touchstart&quot;, function(e) {
	  	var 
	  	oTarget = e.target,
	  	sTarget = oTarget.nodeName.toLowerCase();
		if (sTarget === &quot;label&quot;) window.__activeElement = oTarget;
	}, false);
	
	document.body.addEventListener(&quot;touchend&quot;, function(e) {
	  	var 
	  	oInput,
	  	oTarget, 
	  	oTouch = e.changedTouches[0];
    	oTarget = document.elementFromPoint(oTouch.clientX, oTouch.clientY);
	
		if (oTarget === window.__activeElement) oInput = document.querySelector(&quot;#&quot; + oTarget.getAttribute(&quot;for&quot;));
		if (oInput) {
			if (oInput[&quot;type&quot;] === &quot;checkbox&quot;) {
				oInput.checked = !oInput.checked;
			}
			else if (oInput[&quot;type&quot;] === &quot;radio&quot;) {
				/* If a radio-button should be unselectable, add attribute: data-unselect=&quot;true&quot; */
				oInput.getAttribute(&quot;data-unselect&quot;) ? oInput.checked = !oInput.checked : oInput.checked = true;
			}
			e.stopPropagation();
			e.preventDefault();
		}
	}, false);
}
})();
</pre>
<p>The final result can be seen here (if you&#8217;re using a desktop-browser, it will be identical to the first example!):</p>
<div class="embed-codepen"><iframe title="Switch 2 - Custom JavaScript" id="cp_embed_QjZvLx" src="https://codepen.io/stoumann/embed/preview/QjZvLx?default-tabs=css%2Cresult&amp;height=300&amp;host=https%3A%2F%2Fcodepen.io&amp;slug-hash=QjZvLx" scrolling="no" frameborder="0" height="300" allowtransparency="true" allowfullscreen="true" allowpaymentrequest="true" class="cp_embed_iframe" style="width: 100%; overflow: hidden;"></iframe></div>
<p>The gzipped and <a href="http://closure-compiler.appspot.com/home" target="_blank">closure-compressed</a> version is <strong>345 bytes</strong>.</p>
<p>The script &#8220;captures&#8221; the clicked element on <em>touchstart</em>, and compares that to the element captured on <em>touchend</em>.</p>
<p>If the element is a label-element and it&#8217;s associated input is either a radio-button or a checkbox, that element is clicked immediately.<br />
The normal click-event is then cancelled.</p>
<h2>Callback Functions</h2>
<p>I usually assign events/functions via a &#8220;data-fn&#8221;-attribute:</p>
<pre class="brush: xml; title: ; notranslate" title="">
&lt;label for=&quot;switch_2&quot; data-fn=&quot;myTestFunc&quot; data-pr=&quot;My custom parameter&quot;&gt;
</pre>
<p>There&#8217;s also a &#8220;data-tp&#8221;, which defaults to &#8220;click&#8221;.<br />
Multiple functions (and parameters) are split by &#8220;+&#8221;, multiple parameters within a function are split on &#8220;|&#8221;.</p>
<p>If you want to run additional functionality when clicking on a label/checkbox/radio, you can use this slightly longer script (<strong>537 bytes gzipped and compressed</strong>) and the method described above:</p>
<pre class="brush: jscript; title: ; notranslate" title="">
/**
*	fastcheck_fn.js
*	Fast checkbox/radio-button-check for touch-devices, removing the 300ms delay
*	Executes functions in data-fn attributes
*	(c)	Copyright 2015 Mads Stoumann
*/
(function (bRunFunc) { 
&quot;use strict&quot;;
if(&quot;onorientationchange&quot; in window &amp;&amp; &quot;ontouchstart&quot; in window) {
	document.body.addEventListener(&quot;touchstart&quot;, function(e) {
	  	var 
	  	oTarget = e.target,
	  	sTarget = oTarget.nodeName.toLowerCase();
		if (sTarget === &quot;label&quot;) window.__activeElement = oTarget;
	}, false);
	
	document.body.addEventListener(&quot;touchend&quot;, function(e) {
	  	var 
	  	oInput,
	  	oTarget, 
	  	oTouch = e.changedTouches[0];
    	oTarget = document.elementFromPoint(oTouch.clientX, oTouch.clientY);
	
		if (oTarget === window.__activeElement) oInput = document.querySelector(&quot;#&quot; + oTarget.getAttribute(&quot;for&quot;));
		if (oInput) {
			if (oInput[&quot;type&quot;] === &quot;checkbox&quot;) {
				oInput.checked = !oInput.checked;
			}
			else if (oInput[&quot;type&quot;] === &quot;radio&quot;) {
				/* If a radio-button should be unselectable, add attribute: data-unselect=&quot;true&quot; */
				oInput.getAttribute(&quot;data-unselect&quot;) ? oInput.checked = !oInput.checked : oInput.checked = true;
			}
			e.stopPropagation();
			e.preventDefault();
			if (bRunFunc) getFunc(oTarget), getFunc(oInput);
		}
	}, false);
	
	var getFunc = function(oElm) {
		var
		aFunc,
		aFuncPar,
		aParam,
		i,
		oFunc,
		sFunc = (oElm &amp;&amp; oElm.getAttribute(&quot;data-fn&quot;)),
		sFuncPar;
		
		if (sFunc &amp;&amp; !oElm.getAttribute(&quot;data-tp&quot;)) {
            aFunc = sFunc.split(&quot;+&quot;);
            sFuncPar = oElm.getAttribute(&quot;data-pr&quot;);
            aFuncPar = sFuncPar ? sFuncPar.split(&quot;+&quot;) : [];

            for (i = 0; i &lt; aFunc.length; i++) {
                aParam = aFuncPar[i] ? aFuncPar[i].split(&quot;|&quot;) : [];
                aParam.push(oElm);
                oFunc = getScope(aFunc[i]);
                aParam.unshift(oElm);
                oFunc.apply(oElm, aParam);
            }
        }
	};
	
	var getScope = function (sFunc) {
		var
		aFunc = sFunc.split(&quot;.&quot;),
		i,
		oFunc = window[aFunc[0]],
		nLen = aFunc.length;
	
		if (nLen) for (i = 1; i &lt; nLen; i++) oFunc = oFunc[aFunc[i]];
		if (typeof oFunc === &quot;function&quot;) return oFunc;
	};
}
})(true);
</pre>
<p><strong>Disclaimer (!):</strong> All the code above have only been tested on Codepen.io, not in a production-environment.<br />
Now, go remove those annoying delays!</p>
