		<article>
			<h1>Re-creating a Pantone Color Deck in CSS</h1>
			<p>If you’ve ever held a Pantone fan deck — the kind graphic designers used to carry around like a sacred artifact — you know the satisfying way those cards fan out from a single rivet point. Each card swings on its own arc, and you flip through the colors by hand.</p>

<p>I wanted to recreate that experience for this week’s CodePen challenge, which is all about color palettes. </p>

<p>Follow along as we build a fully interactive color fan deck where the spread adapts to the container width, cards know their position among their siblings, and clicking a card to "focus" it is handled entirely by the browser’s native <code>&lt;details&gt;</code> element. </p>

<p>No JavaScript! Let’s dive in!</p>


<hr>

<h2>
  <a name="the-markup" href="#the-markup">
  </a>
  The Markup
</h2>

<p>Our fan deck is a <code>&lt;section&gt;</code> containing a cover card, followed by color cards, each wrapped in a <code>&lt;details&gt;</code> element:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;section&gt;</span>
  <span class="c">&lt;!-- cover card --&gt;</span>
  <span class="nt">&lt;details</span> <span class="na">name=</span><span class="s">"deck"</span><span class="nt">&gt;</span>
    <span class="nt">&lt;summary&gt;</span>Reds <span class="nt">&lt;span&gt;</span>×<span class="nt">&lt;/span&gt;&lt;/summary&gt;</span>
    <span class="nt">&lt;ul&gt;</span>
      <span class="nt">&lt;li</span> <span class="na">style=</span><span class="s">"--c: lab(45% 67 30)"</span><span class="nt">&gt;</span>
        <span class="nt">&lt;strong&gt;</span>Poppy Red<span class="nt">&lt;/strong&gt;</span>
        <span class="nt">&lt;dl&gt;</span>
          <span class="nt">&lt;dt&gt;</span>HEX<span class="nt">&lt;/dt&gt;&lt;dd&gt;</span>#DC3D4C<span class="nt">&lt;/dd&gt;</span>
          <span class="nt">&lt;dt&gt;</span>RGB<span class="nt">&lt;/dt&gt;&lt;dd&gt;</span>220, 61, 76<span class="nt">&lt;/dd&gt;</span>
          <span class="nt">&lt;dt&gt;</span>LAB<span class="nt">&lt;/dt&gt;&lt;dd&gt;</span>45, 56, 25<span class="nt">&lt;/dd&gt;</span>
        <span class="nt">&lt;/dl&gt;</span>
      <span class="nt">&lt;/li&gt;</span>
      <span class="c">&lt;!-- more colors --&gt;</span>
    <span class="nt">&lt;/ul&gt;</span>
  <span class="nt">&lt;/details&gt;</span>

  <span class="nt">&lt;details</span> <span class="na">name=</span><span class="s">"deck"</span><span class="nt">&gt;</span>
    <span class="nt">&lt;summary&gt;</span>Blues <span class="nt">&lt;span&gt;</span>×<span class="nt">&lt;/span&gt;&lt;/summary&gt;</span>
    <span class="c">&lt;!-- ... --&gt;</span>
  <span class="nt">&lt;/details&gt;</span>

  <span class="c">&lt;!-- more cards --&gt;</span>
<span class="nt">&lt;/section&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">

</svg>

</div>
</div>

<p>A few things to note:</p>

<ul>
<li>The <strong>cover card</strong> doesn’t toggle — it just sits at the front of the deck.</li>
<li>Each <strong>color card</strong> is a <code>&lt;details name="deck"&gt;</code> element. The <code>name</code> attribute is the key — it makes them an <em>exclusive accordion</em>. Only one can be open at a time, and clicking the open one closes it.</li>
<li>The <code>&lt;summary&gt;</code> serves as both the card label and the click target.</li>
</ul>

<p>Not much to see yet. Let’s add some CSS:</p>

<p><a href="assets/3248930/428c9f9e.jpg" class="article-body-image-wrapper"><img src="assets/3248930/428c9f9e.jpg" alt="Single Color Card" loading="lazy" width="800" height="1060"></a></p>

<p>I won’t go into the CSS in depth here; it’s simply a <code>&lt;ul&gt;</code> with the color values defined in a <code>&lt;dl&gt;</code> and wrapped up in a grid.</p>


<hr>

<h2>
  <a name="stacking-the-deck" href="#stacking-the-deck">
  </a>
  Stacking the Deck
</h2>

<p>First, we need all cards to occupy the same grid cell, stacked on top of each other:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">section</span> <span class="p">{</span>
  <span class="py">container-type</span><span class="p">:</span> <span class="n">inline-size</span><span class="p">;</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">grid</span><span class="p">;</span>
  <span class="py">place-items</span><span class="p">:</span> <span class="n">end</span> <span class="nb">center</span><span class="p">;</span>
<span class="p">}</span>

<span class="nt">section</span> <span class="o">&gt;</span> <span class="o">*</span> <span class="p">{</span>
  <span class="py">grid-area</span><span class="p">:</span> <span class="m">1</span> <span class="p">/</span> <span class="m">-1</span><span class="p">;</span>
  <span class="nl">z-index</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="n">sibling-count</span><span class="p">()</span> <span class="n">-</span> <span class="n">sibling-index</span><span class="p">());</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Setting <code>container-type: inline-size</code> on the <code>&lt;section&gt;</code> lets us use <strong>container query units</strong> later. Every direct child is placed in the same grid cell with <code>grid-area: 1 / -1</code>, creating a stack.</p>

<p>The <code>z-index</code> line uses two new CSS functions — <code>sibling-count()</code> and <code>sibling-index()</code> — to ensure the first card sits on top. The first child has <code>sibling-index()</code> of 1, so it gets the highest <code>z-index</code>. The last child gets 1. Natural stacking order — no hardcoded values, no counters, no JavaScript.</p>

<p>So, for now, we just see the cover card — the color cards are hidden behind it (the rivet is an <code>::after</code> pseudo-element with a <code>radial-gradient</code>):</p>

<p><a href="assets/3248930/a5c3fe9c.jpg" class="article-body-image-wrapper"><img src="assets/3248930/a5c3fe9c.jpg" alt="Cover Card" loading="lazy" width="800" height="1060"></a></p>


<hr>

<h2>
  <a name="the-fan-spread-with-raw-progress-endraw-" href="#the-fan-spread-with-raw-progress-endraw-">
  </a>
  The Fan Spread with <code>progress()</code>
</h2>

<p>This is where it gets interesting. A real fan deck spreads wider when you have room, and collapses into a tight stack in a narrow space. We want the same behavior — and the new CSS <code>progress()</code> function makes it elegant:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">section</span> <span class="o">&gt;</span> <span class="o">*</span> <span class="p">{</span>
  <span class="py">--spread</span><span class="p">:</span> <span class="n">progress</span><span class="p">(</span><span class="m">100</span><span class="n">cqi</span><span class="p">,</span> <span class="m">300px</span><span class="p">,</span> <span class="m">1440px</span><span class="p">);</span>
  <span class="py">--end-degree</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--spread</span><span class="p">)</span> <span class="err">*</span> <span class="m">45deg</span><span class="p">);</span>
  <span class="py">--start-degree</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--spread</span><span class="p">)</span> <span class="err">*</span> <span class="m">-45deg</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><strong><code>progress()</code></strong> returns a value between <code>0</code> and <code>1</code> based on where a value falls within a range. Here, <code>progress(100cqi, 300px, 1440px)</code> asks: "How far is the container’s inline size between 300px and 1440px?"</p>

<ul>
<li>At 300px or below: <code>--spread</code> is <code>0</code> — no fan, cards stacked flat.</li>
<li>At 1440px or above: <code>--spread</code> is <code>1</code> — full fan, cards spanning from -45° to +45°.</li>
<li>At 870px (midpoint): <code>--spread</code> is <code>0.5</code> — half fan.</li>
</ul>

<p>No <code>@container</code> queries, just one line of CSS, and the spread is <em>continuously responsive</em>.</p>


<hr>

<h2>
  <a name="positioning-each-card-with-raw-siblingindex-endraw-" href="#positioning-each-card-with-raw-siblingindex-endraw-">
  </a>
  Positioning Each Card with <code>sibling-index()</code>
</h2>

<p>Now each card needs its own rotation angle, interpolated between <code>--start-degree</code> and <code>--end-degree</code> based on its position in the deck:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">section</span> <span class="o">&gt;</span> <span class="o">*</span> <span class="p">{</span>
  <span class="py">rotate</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span>
    <span class="n">var</span><span class="p">(</span><span class="n">--start-degree</span><span class="p">)</span> <span class="err">+</span>
    <span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--end-degree</span><span class="p">)</span> <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--start-degree</span><span class="p">))</span> <span class="err">*</span>
    <span class="p">(</span><span class="n">sibling-index</span><span class="p">()</span> <span class="n">-</span> <span class="m">1</span><span class="p">)</span> <span class="p">/</span> <span class="p">(</span><span class="n">sibling-count</span><span class="p">()</span> <span class="n">-</span> <span class="m">1</span><span class="p">)</span>
  <span class="p">);</span>
  <span class="nl">transform-origin</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span><span class="m">100%</span> <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--rivet</span><span class="p">))</span> <span class="n">calc</span><span class="p">(</span><span class="m">100%</span> <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--rivet</span><span class="p">));</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Let’s break it down:</p>

<ol>
<li>
<code>sibling-index() - 1</code> gives us a zero-based position (0 for first card, 1 for second, etc.)</li>
<li>
<code>sibling-count() - 1</code> gives us the total number of "gaps" between cards</li>
<li>Dividing them gives a progress value from <code>0</code> to <code>1</code> for each card’s position</li>
<li>We multiply that by the degree range and add the start offset</li>
</ol>

<p>The <code>transform-origin</code> is set to the bottom-right corner — offset by <code>--rivet</code> — so all cards rotate around the same pivot point, just like a physical fan deck with a rivet pin.</p>

<p>Cool! The cards now fan out from a single point, and the spread adjusts automatically with the container width, but they’re not interactive yet.</p>

<p>Now we have:</p>

<p><a href="assets/3248930/ee491483.jpg" class="article-body-image-wrapper"><img src="assets/3248930/ee491483.jpg" alt="Full spread" loading="lazy" width="800" height="586"></a></p>

<p>Let’s resize the browser:</p>

<p><a href="assets/3248930/f302319d.jpg" class="article-body-image-wrapper"><img src="assets/3248930/f302319d.jpg" alt="Resized Fan Deck" loading="lazy" width="562" height="1080"></a></p>

<p>I find this incredibly satisfying!</p>


<hr>

<h2>
  <a name="clicktofocus-with-exclusive-raw-ltdetailsgt-endraw-" href="#clicktofocus-with-exclusive-raw-ltdetailsgt-endraw-">
  </a>
  Click-to-Focus with Exclusive <code>&lt;details&gt;</code>
</h2>

<p>Here’s where the <code>&lt;details&gt;</code> element earns its place. By giving all color cards <code>name="deck"</code>, the browser enforces <em>exclusive accordion</em> behavior:</p>

<ul>
<li>
<strong>Click a card’s summary</strong> → it opens (gets the <code>[open]</code> attribute), any other open card closes automatically.</li>
<li>
<strong>Click the same summary again</strong> → it closes, returning to the default fan.</li>
</ul>

<p>But the <code>&lt;details&gt;</code> element normally <em>hides</em> its content when closed. We want the color cards to always be visible — the open/closed state should only affect the card’s <em>rotation</em>, not its content visibility. This is where the new <code>::details-content</code> pseudo-element comes in:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">details</span><span class="nd">::details-content</span> <span class="p">{</span>
  <span class="py">content-visibility</span><span class="p">:</span> <span class="nb">visible</span><span class="p">;</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">contents</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The <code>::details-content</code> pseudo-element targets the content slot of a <code>&lt;details&gt;</code> — everything that isn’t the <code>&lt;summary&gt;</code>. By overriding <code>content-visibility</code> to <code>visible</code> and setting <code>display: contents</code>, the card’s color list is always rendered, regardless of the open state.</p>

<p>Let’s see how it looks when we select a card:</p>

<p><a href="assets/3248930/cff5eafb.jpg" class="article-body-image-wrapper"><img src="assets/3248930/cff5eafb.jpg" alt="Selected Color Card" loading="lazy" width="800" height="570"></a></p>


<hr>

<h2>
  <a name="cssonly-state-detection" href="#cssonly-state-detection">
  </a>
  CSS-Only State Detection
</h2>

<p>When a card is open, we want three things to happen:</p>

<ol>
<li>The <strong>active card</strong> rotates to 0° (straight up)</li>
<li>Cards <strong>before</strong> it collapse toward the start</li>
<li>Cards <strong>after</strong> it push toward the end</li>
</ol>

<p>We need boolean-like flags — <code>0</code> or <code>1</code> — that each card can use in its rotation formula. And we can set them entirely with CSS selectors:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="c">/* Any card is active */</span>
<span class="nt">section</span><span class="nd">:has</span><span class="o">(</span><span class="nt">details</span><span class="o">[</span><span class="nt">open</span><span class="o">])</span> <span class="o">&gt;</span> <span class="o">*</span> <span class="p">{</span> <span class="py">--has-active</span><span class="p">:</span> <span class="m">1</span><span class="p">;</span> <span class="p">}</span>

<span class="c">/* Cards before the active one */</span>
<span class="nt">section</span> <span class="o">&gt;</span> <span class="nd">:has</span><span class="o">(~</span> <span class="nt">details</span><span class="o">[</span><span class="nt">open</span><span class="o">])</span> <span class="p">{</span> <span class="py">--is-before</span><span class="p">:</span> <span class="m">1</span><span class="p">;</span> <span class="p">}</span>

<span class="c">/* The active card itself */</span>
<span class="nt">details</span><span class="o">[</span><span class="nt">open</span><span class="o">]</span> <span class="p">{</span> <span class="py">--is-active</span><span class="p">:</span> <span class="m">1</span><span class="p">;</span> <span class="p">}</span>

<span class="c">/* Cards after the active one */</span>
<span class="nt">details</span><span class="o">[</span><span class="nt">open</span><span class="o">]</span> <span class="o">~</span> <span class="o">*</span> <span class="p">{</span> <span class="py">--is-after</span><span class="p">:</span> <span class="m">1</span><span class="p">;</span> <span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>

<p>Four selectors, four flags. Let’s unpack them:</p>

<ul>
<li>
<code>section:has(details[open])</code> matches the section <em>when any details child is open</em>, then sets <code>--has-active: 1</code> on all children.</li>
<li>
<code>:has(~ details[open])</code> matches any element that has a <em>subsequent sibling</em> that is <code>details[open]</code> — i.e., it comes <em>before</em> the active card.</li>
<li>
<code>details[open]</code> matches the active card directly.</li>
<li>
<code>details[open] ~ *</code> matches all <em>subsequent siblings</em> — the cards <em>after</em> the active one.</li>
</ul>

<p>The defaults are all <code>0</code>, set on the base <code>section &gt; *</code> rule. When no card is open, all flags are <code>0</code>, and the cards fan normally.</p>

<h3>
  <a name="the-full-rotation-formula" href="#the-full-rotation-formula">
  </a>
  The Full Rotation Formula
</h3>

<p>With the flags in place, the rotation formula handles all states:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">section</span> <span class="o">&gt;</span> <span class="o">*</span> <span class="p">{</span>
  <span class="py">rotate</span><span class="p">:</span> <span class="n">calc</span><span class="p">(</span>
    <span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--start-degree</span><span class="p">)</span> <span class="err">+</span> <span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--end-degree</span><span class="p">)</span> <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--start-degree</span><span class="p">))</span>
      <span class="err">*</span> <span class="p">(</span><span class="n">sibling-index</span><span class="p">()</span> <span class="n">-</span> <span class="m">1</span><span class="p">)</span> <span class="p">/</span> <span class="p">(</span><span class="n">sibling-count</span><span class="p">()</span> <span class="n">-</span> <span class="m">1</span><span class="p">))</span>
    <span class="err">*</span> <span class="p">(</span><span class="m">1</span> <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--is-active</span><span class="p">))</span>
    <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--is-before</span><span class="p">)</span> <span class="err">*</span> <span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--end-degree</span><span class="p">)</span> <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--start-degree</span><span class="p">))</span>
      <span class="err">*</span> <span class="p">(</span><span class="n">sibling-index</span><span class="p">()</span> <span class="n">-</span> <span class="m">1</span><span class="p">)</span> <span class="p">/</span> <span class="p">(</span><span class="n">sibling-count</span><span class="p">()</span> <span class="n">-</span> <span class="m">1</span><span class="p">)</span> <span class="err">*</span> <span class="m">0.85</span>
    <span class="err">+</span> <span class="n">var</span><span class="p">(</span><span class="n">--is-after</span><span class="p">)</span> <span class="err">*</span> <span class="p">(</span><span class="n">var</span><span class="p">(</span><span class="n">--end-degree</span><span class="p">)</span> <span class="n">-</span> <span class="n">var</span><span class="p">(</span><span class="n">--start-degree</span><span class="p">))</span>
      <span class="err">*</span> <span class="p">(</span><span class="m">1</span> <span class="n">-</span> <span class="p">(</span><span class="n">sibling-index</span><span class="p">()</span> <span class="n">-</span> <span class="m">1</span><span class="p">)</span> <span class="p">/</span> <span class="p">(</span><span class="n">sibling-count</span><span class="p">()</span> <span class="n">-</span> <span class="m">1</span><span class="p">))</span> <span class="err">*</span> <span class="m">0.85</span>
  <span class="p">);</span>
  <span class="nl">transition</span><span class="p">:</span> <span class="n">rotate</span> <span class="m">.25s</span> <span class="n">linear</span><span class="p">;</span>
<span class="p">}</span>

<p>So what’s going on?</p>

<ul>
<li>
<strong>Line 1–2:</strong> The normal fan rotation — the same formula from before.</li>
<li>
<strong><code>* (1 - var(--is-active))</code>:</strong> Multiplying by 0 when active zeroes out the rotation — the card snaps to 0°.</li>
<li>
<strong>Before cards:</strong> Subtract a value that pushes them further toward the start. The <code>0.85</code> factor collapses them tightly but not completely.</li>
<li>
<strong>After cards:</strong> Add a value that pushes them further toward the end, using the <em>inverse</em> position <code>(1 - progress)</code> so they fan toward the opposite edge.</li>
</ul>

<p>The <code>transition</code> gives it a smooth, satisfying swing.</p>


<hr>

<h2>
  <a name="the-new-css-features-a-recap" href="#the-new-css-features-a-recap">
  </a>
  The New CSS Features — a Recap
</h2>

<p>This component leans on several CSS features that are all relatively new — so use a modern browser.</p>

<div class="table-wrapper-paragraph"><table>
<thead>
<tr>
<th>Feature</th>
<th>What It Does Here</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>progress()</code></td>
<td>Returns 0–1 based on container width, driving the fan spread</td>
</tr>
<tr>
<td><code>sibling-index()</code></td>
<td>Each card knows its position — used for rotation and z-index</td>
</tr>
<tr>
<td><code>sibling-count()</code></td>
<td>Total number of cards — used to normalize position to 0–1</td>
</tr>
<tr>
<td><code>&lt;details name=""&gt;</code></td>
<td>Exclusive accordion — click to open/close, only one active</td>
</tr>
<tr>
<td><code>::details-content</code></td>
<td>Override content visibility so cards always show their colors</td>
</tr>
</tbody>
</table></div>


<hr>

<h2>
  <a name="final-thoughts" href="#final-thoughts">
  </a>
  Final Thoughts
</h2>

<p>I’m constantly blown away by how far CSS has progressed — and is progressing. What I find exciting is how these new features <em>compose</em>. None of them alone are revolutionary — but <code>progress()</code> feeding into <code>sibling-index()</code>-driven rotation, toggled by native <code>&lt;details&gt;</code> state detected via <code>:has()</code> selectors, all without a single line of JavaScript.</p>
