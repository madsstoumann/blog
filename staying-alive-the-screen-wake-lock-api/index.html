			<h1>Staying Alive: The Screen Wake Lock API</h1>
			<p>Friday night I was cooking a delicious vegetarian bolognese — but was annoyed that my iPhone kept dimming the screen, and soon after locking the screen. I know that I can change the "time-to-lock" (or whatever it's called!?) in Settings, but wouldn't it be smarter, if we could tell a webpage to "stay alive"?</p>

<p>The <a href="https://developer.mozilla.org/en-US/docs/Web/API/Screen_Wake_Lock_API" target="_blank" rel="noopener noreferrer">Screen Wake Lock API</a> does exactly that — but, at the moment, only in Chrome.</p>

<p>To test it, I used Chrome on my MacBook.</p>

<p>First, I set the <code>Turn display off after</code> to <code>1 min</code>:</p>

<p><a href="assets/574042/4a11f451.jpg" class="article-body-image-wrapper"><img src="assets/574042/4a11f451.jpg" alt="Battery Settings BigSur" loading="lazy" width="800" height="149"></a></p>

<p>Then I added a checkbox for turning on/off the Wake Lock API. The checkbox is hidden and it's label shown as an icon — the crossed-out, grey eye at the top right corner:</p>

<p><a href="assets/574042/45d2a898.jpg" class="article-body-image-wrapper"><img src="assets/574042/45d2a898.jpg" alt="screenWakeLockDisabled" loading="lazy" width="800" height="1533"></a></p>

<p>Then, when pressed, the icon changes to an open, green eye:</p>

<p><a href="assets/574042/a86359c2.jpg" class="article-body-image-wrapper"><img src="assets/574042/a86359c2.jpg" alt="screenWakeLockEnabled" loading="lazy" width="800" height="1533"></a></p>

<p>The JavaScript-code for toggling the <code>Screen Wake Lock</code> is pretty straight-forward:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">wakeLockToggle</span> <span class="o">=</span> <span class="nb">document</span><span class="p">.</span><span class="nf">querySelector</span><span class="p">(</span><span class="dl">'</span><span class="s1">[data-wake-lock] &gt; input</span><span class="dl">'</span><span class="p">);</span>
<span class="k">if </span><span class="p">(</span><span class="nx">wakeLockToggle</span> <span class="o">&amp;&amp;</span> <span class="p">(</span><span class="dl">'</span><span class="s1">wakeLock</span><span class="dl">'</span> <span class="k">in</span> <span class="nb">navigator</span><span class="p">))</span> <span class="p">{</span>
  <span class="kd">let</span> <span class="nx">wakeLock</span> <span class="o">=</span> <span class="kc">null</span><span class="p">;</span>
  <span class="kd">const</span> <span class="nx">wakeLockEnable</span> <span class="o">=</span> <span class="k">async </span><span class="p">()</span> <span class="o">=&gt;</span> <span class="p">{</span> 
    <span class="k">try</span> <span class="p">{</span>
      <span class="nx">wakeLock</span> <span class="o">=</span> <span class="k">await</span> <span class="nb">navigator</span><span class="p">.</span><span class="nx">wakeLock</span><span class="p">.</span><span class="nf">request</span><span class="p">(</span><span class="dl">'</span><span class="s1">screen</span><span class="dl">'</span><span class="p">);</span>
    <span class="p">}</span> <span class="k">catch </span><span class="p">(</span><span class="nx">err</span><span class="p">)</span> <span class="p">{</span>
      <span class="nx">console</span><span class="p">.</span><span class="nf">error</span><span class="p">(</span><span class="s2">`</span><span class="p">${</span><span class="nx">err</span><span class="p">.</span><span class="nx">name</span><span class="p">}</span><span class="s2">, </span><span class="p">${</span><span class="nx">err</span><span class="p">.</span><span class="nx">message</span><span class="p">}</span><span class="s2">`</span><span class="p">);</span>
    <span class="p">}</span>
  <span class="p">}</span>
  <span class="nx">wakeLockToggle</span><span class="p">.</span><span class="nf">addEventListener</span><span class="p">(</span><span class="dl">'</span><span class="s1">click</span><span class="dl">'</span><span class="p">,</span> <span class="p">()</span> <span class="o">=&gt;</span> <span class="p">{</span>
    <span class="k">if </span><span class="p">(</span><span class="nx">wakeLockToggle</span><span class="p">.</span><span class="nx">checked</span><span class="p">)</span> <span class="p">{</span>
      <span class="nf">wakeLockEnable</span><span class="p">();</span>
    <span class="p">}</span>
    <span class="k">else</span> <span class="p">{</span>
      <span class="nx">wakeLock</span><span class="p">.</span><span class="nf">release</span><span class="p">()</span>
      <span class="p">.</span><span class="nf">then</span><span class="p">(()</span> <span class="o">=&gt;</span> <span class="p">{</span>
        <span class="nx">wakeLock</span> <span class="o">=</span> <span class="kc">null</span><span class="p">;</span>
      <span class="p">});</span>
    <span class="p">}</span>
  <span class="p">})</span>
<span class="p">}</span>
</code></pre>

<p>Next, I left the MacBook open, touching nothing. </p>

<p>As predicted, it dimmed the screen after one minute. Then I turned <em>on</em> the <code>Screen Wake Lock</code> — and after 3 minutes the screen hadn't dimmed. Hooray! </p>
