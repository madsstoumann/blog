			<h1>Creating A Button Library</h1>
			<p>All websites need <code>&lt;button&gt;</code>s. With <em>CSS Custom Properties</em> it's easier than ever to maintain complex scenarios. </p>

<p>Because a <code>&lt;button&gt;</code> can be rather complex.</p>

<p>First of all, it has 5 <em>states:</em></p>

<p><a href="assets/550589/1802f391.jpg" class="article-body-image-wrapper"><img src="assets/550589/1802f391.jpg" alt="Button States" loading="lazy" width="800" height="72"></a></p>

<ul>
<li>Default</li>
<li>Active</li>
<li>Disabled</li>
<li>Focus</li>
<li>Hover</li>
</ul>

<p>Each state can — or rather <em>should</em> — have different styling, for example:</p>

<ul>
<li><code>background-color</code></li>
<li><code>border-color</code></li>
<li><code>box-shadow</code></li>
<li><code>color</code></li>
</ul>

<p>You could also add <code>border-width</code> and many more, but with just these 4 properties, we already have 20 variants:</p>

<p><strong>5 states ✕ 4 properties</strong></p>

<p>Let's throw in "dark mode" as well, and we have 40 variants:</p>

<p><a href="assets/550589/488ed27c.jpg" class="article-body-image-wrapper"><img src="assets/550589/488ed27c.jpg" alt="Dark Mode" loading="lazy" width="800" height="86"></a></p>

<p>Adding a simple <em>modifier</em> such as "outline", creates <em>another</em> 40 variants:</p>

<p><a href="assets/550589/a77be93a.jpg" class="article-body-image-wrapper"><img src="assets/550589/a77be93a.jpg" alt="Outline" loading="lazy" width="800" height="72"></a></p>

<p>So far we have <strong>80 variants</strong>, just for a "blue button".</p>

<p>With <em>CSS Custom Properties</em> we can simplify the amount of CSS-code needed to create all these variants.</p>

<p>To start with, we define the 4 properties like this:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">--btn-bdc</span><span class="o">:</span> <span class="nt">hsl</span><span class="o">(</span><span class="err">201</span><span class="o">,</span> <span class="err">79</span><span class="o">%,</span> <span class="err">46</span><span class="o">%);</span>
<span class="nt">--btn-bgc</span><span class="o">:</span> <span class="nt">hsl</span><span class="o">(</span><span class="err">201</span><span class="o">,</span> <span class="err">79</span><span class="o">%,</span> <span class="err">46</span><span class="o">%);</span>
<span class="nt">--btn-bxsh</span><span class="o">:</span> <span class="nt">transparent</span><span class="o">;</span>
<span class="nt">--btn-c</span><span class="o">:</span> <span class="nt">hsl</span><span class="o">(</span><span class="err">195</span><span class="o">,</span> <span class="err">100</span><span class="o">%,</span> <span class="err">100</span><span class="o">%);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And in the CSS for the button:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.c-btn</span> <span class="p">{</span>
  <span class="c">/* Excerpt */</span>
  <span class="nl">background-color</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--btn-bgc</span><span class="p">);</span>
  <span class="nl">border-color</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--btn-bdc</span><span class="p">);</span>
  <span class="nl">box-shadow</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--btn-bxsh--sz</span><span class="p">)</span> <span class="n">var</span><span class="p">(</span><span class="n">--btn-bxsh</span><span class="p">);</span>
  <span class="nl">color</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--btn-c</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>The next step is to create CSS properties for all the other <em>states</em> — we need <strong>20 properties</strong> in total per button color:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="c">/* :active */</span>
<span class="nt">--btn-bdc--act</span><span class="o">:</span> <span class="nt">hsl</span><span class="o">(</span><span class="err">201</span><span class="o">,</span> <span class="err">79</span><span class="o">%,</span> <span class="err">46</span><span class="o">%);</span>
<span class="nt">--btn-bgc--act</span><span class="o">:</span> <span class="nt">hsl</span><span class="o">(</span><span class="err">201</span><span class="o">,</span> <span class="err">79</span><span class="o">%,</span> <span class="err">46</span><span class="o">%);</span>
<span class="nt">--btn-bxsh--act</span><span class="o">:</span> <span class="nt">hsl</span><span class="o">(</span><span class="err">197</span><span class="o">,</span> <span class="err">92</span><span class="o">%,</span> <span class="err">61</span><span class="o">%);</span>
<span class="nt">--btn-c--act</span><span class="o">:</span> <span class="nt">hsl</span><span class="o">(</span><span class="err">195</span><span class="o">,</span> <span class="err">100</span><span class="o">%,</span> <span class="err">100</span><span class="o">%);</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>We also need CSS for all the states, here's "active":<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.c-btn</span><span class="nd">:active</span> <span class="p">{</span>
  <span class="nl">background-color</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--btn-bgc--act</span><span class="p">);</span>
  <span class="nl">border-color</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--btn-bdc--act</span><span class="p">);</span>
  <span class="nl">box-shadow</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--btn-bxsh--act</span><span class="p">);</span>
  <span class="nl">color</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--btn-c--act</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Repeat these for <code>:disabled</code>, <code>:hover</code> and <code>:focus</code>.</p>


<hr>

<h2>
  <a name="putting-it-all-together" href="#putting-it-all-together">
  </a>
  Putting it all together
</h2>

<p>Now to create — let's say — the 20 variants needed for a <em>green</em> button, all we have to do is add a <em>modifier-class</em> with updated properties:</p>

<p><a href="assets/550589/8ace05d6.jpg" class="article-body-image-wrapper"><img src="assets/550589/8ace05d6.jpg" alt="Green Button" loading="lazy" width="800" height="82"></a><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.c-btn--green</span> <span class="p">{</span>
  <span class="py">--btn-bdc</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="m">162</span><span class="p">,</span> <span class="m">63%</span><span class="p">,</span> <span class="m">41%</span><span class="p">);</span>
  <span class="py">--btn-bdc--act</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="m">162</span><span class="p">,</span> <span class="m">63%</span><span class="p">,</span> <span class="m">41%</span><span class="p">);</span>
  <span class="py">--btn-bdc--foc</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="m">162</span><span class="p">,</span> <span class="m">63%</span><span class="p">,</span> <span class="m">41%</span><span class="p">);</span>
  <span class="py">--btn-bgc</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="m">162</span><span class="p">,</span> <span class="m">63%</span><span class="p">,</span> <span class="m">41%</span><span class="p">);</span>
  <span class="py">--btn-bgc--act</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="m">162</span><span class="p">,</span> <span class="m">63%</span><span class="p">,</span> <span class="m">41%</span><span class="p">);</span>
  <span class="py">--btn-bgc--dis</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="m">162</span><span class="p">,</span> <span class="m">50%</span><span class="p">,</span> <span class="m">90%</span><span class="p">);</span>
  <span class="py">--btn-bgc--foc</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="m">162</span><span class="p">,</span> <span class="m">63%</span><span class="p">,</span> <span class="m">41%</span><span class="p">);</span>
  <span class="py">--btn-bgc--hov</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="m">168</span><span class="p">,</span> <span class="m">80%</span><span class="p">,</span> <span class="m">23%</span><span class="p">);</span>
  <span class="py">--btn-bxsh--act</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="m">158</span><span class="p">,</span> <span class="m">58%</span><span class="p">,</span> <span class="m">62%</span><span class="p">);</span>
  <span class="py">--btn-bxsh--foc</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="m">158</span><span class="p">,</span> <span class="m">58%</span><span class="p">,</span> <span class="m">62%</span><span class="p">);</span>
  <span class="py">--btn-c</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="m">152</span><span class="p">,</span> <span class="m">68%</span><span class="p">,</span> <span class="m">100%</span><span class="p">);</span>
  <span class="py">--btn-c--hov</span><span class="p">:</span> <span class="n">hsl</span><span class="p">(</span><span class="m">152</span><span class="p">,</span> <span class="m">68%</span><span class="p">,</span> <span class="m">100%</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
