		<article>
			<h1>The Solar System in CSS</h1>
			<p>The Solar System has been done in CSS <strong>a lot</strong> of times — just search Codepen! So why do it again?</p>

<p>Because things get better and simpler — and we can now do a <strong>responsive</strong> solar system with just a few lines of CSS.</p>

<p>Let's start with some very basic markup:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;ol&gt;</span>
  <span class="nt">&lt;li</span> <span class="na">class=</span><span class="s">"sun"</span><span class="nt">&gt;&lt;/li&gt;</span>
  <span class="nt">&lt;li</span> <span class="na">class=</span><span class="s">"mercury"</span><span class="nt">&gt;&lt;/li&gt;</span>
  <span class="nt">&lt;li</span> <span class="na">class=</span><span class="s">"venus"</span><span class="nt">&gt;&lt;/li&gt;</span>
  <span class="nt">&lt;li</span> <span class="na">class=</span><span class="s">"earth"</span><span class="nt">&gt;&lt;/li&gt;</span>
  <span class="nt">&lt;li</span> <span class="na">class=</span><span class="s">"mars"</span><span class="nt">&gt;&lt;/li&gt;</span>
  <span class="nt">&lt;li</span> <span class="na">class=</span><span class="s">"jupiter"</span><span class="nt">&gt;&lt;/li&gt;</span>
  <span class="nt">&lt;li</span> <span class="na">class=</span><span class="s">"saturn"</span><span class="nt">&gt;&lt;/li&gt;</span>
  <span class="nt">&lt;li</span> <span class="na">class=</span><span class="s">"uranus"</span><span class="nt">&gt;&lt;/li&gt;</span>
  <span class="nt">&lt;li</span> <span class="na">class=</span><span class="s">"neptune"</span><span class="nt">&gt;&lt;/li&gt;</span>
<span class="nt">&lt;/ol&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>We use an <strong>ordered list</strong>, because the planets are in order. </p>

<p>Next, we <code>unset</code> the default <code>&lt;ol&gt;</code>-styles, and style it as a grid:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">ol</span> <span class="p">{</span>
  <span class="nl">all</span><span class="p">:</span> <span class="n">unset</span><span class="p">;</span>
  <span class="py">aspect-ratio</span><span class="p">:</span> <span class="m">1</span> <span class="p">/</span> <span class="m">1</span><span class="p">;</span>
  <span class="py">container-type</span><span class="p">:</span> <span class="n">inline-size</span><span class="p">;</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">grid</span><span class="p">;</span>
  <span class="nl">width</span><span class="p">:</span> <span class="m">100%</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Now, for the planet trajectories, we're going to use a "grid stack". Instead of <code>position: absolute</code>, and a bunch of translations, we can simply <strong>stack</strong> all the grid items with:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">li</span> <span class="p">{</span>
  <span class="py">grid-area</span><span class="p">:</span> <span class="m">1</span> <span class="p">/</span> <span class="m">-1</span><span class="p">;</span>
  <span class="py">place-self</span><span class="p">:</span> <span class="nb">center</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>By setting a <code>--d</code>-variable (for diameter) per planet, using <code>width: var(--d);</code>, we get:</p>

<p><a href="assets/1972652/9cbc9391.jpg" class="article-body-image-wrapper"><img src="assets/1972652/9cbc9391.jpg" alt="Trajectories" loading="lazy" width="800" height="800"></a></p>

<p>Cool! Let's add the planets using an <code>::after</code> pseudo-element:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">li</span><span class="nd">::after</span> <span class="p">{</span>
  <span class="py">aspect-ratio</span><span class="p">:</span> <span class="m">1</span> <span class="p">/</span> <span class="m">1</span><span class="p">;</span>
  <span class="nl">background</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--b</span><span class="p">);</span>
  <span class="nl">border-radius</span><span class="p">:</span> <span class="m">50%</span><span class="p">;</span>
  <span class="nl">content</span><span class="p">:</span> <span class="s2">''</span><span class="p">;</span>
  <span class="nl">display</span><span class="p">:</span> <span class="nb">block</span><span class="p">;</span>
  <span class="nl">width</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--w</span><span class="p">,</span> <span class="m">2</span><span class="n">cqi</span><span class="p">);</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Let's ask ChatGPT to generate some nice <code>radial-gradent</code>s for each planet — and while we're at it, let's tell it we're creating the Solar System and ask for planetary sizes between <code>1</code> and <code>6cqi</code> — not <em>completely</em> accurate, but still maintaining a sizeable, recognizable difference:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nc">.mercury</span> <span class="p">{</span>
  <span class="py">--b</span><span class="p">:</span> <span class="n">radial-gradient</span><span class="p">(</span><span class="nb">circle</span><span class="p">,</span> <span class="m">#c2c2c2</span> <span class="m">0%</span><span class="p">,</span> <span class="m">#8a8a8a</span> <span class="m">100%</span><span class="p">);</span>
  <span class="py">--w</span><span class="p">:</span> <span class="m">2.0526</span><span class="n">cqi</span><span class="p">;</span>
<span class="p">}</span>

<span class="nc">.venus</span> <span class="p">{</span>
  <span class="py">--b</span><span class="p">:</span> <span class="n">radial-gradient</span><span class="p">(</span><span class="nb">circle</span><span class="p">,</span> <span class="m">#f4d03f</span> <span class="m">0%</span><span class="p">,</span> <span class="m">#c39c43</span> <span class="m">100%</span><span class="p">);</span>
  <span class="py">--w</span><span class="p">:</span> <span class="m">2.6053</span><span class="n">cqi</span><span class="p">;</span>
<span class="p">}</span>

<span class="nc">.earth</span> <span class="p">{</span>
  <span class="py">--b</span><span class="p">:</span> <span class="n">radial-gradient</span><span class="p">(</span><span class="nb">circle</span><span class="p">,</span> <span class="m">#3a82f7</span> <span class="m">0%</span><span class="p">,</span> <span class="m">#2f9e44</span> <span class="m">80%</span><span class="p">,</span> <span class="m">#1a5e20</span> <span class="m">100%</span><span class="p">);</span>
  <span class="py">--w</span><span class="p">:</span> <span class="m">3.1579</span><span class="n">cqi</span><span class="p">;</span>
<span class="p">}</span>

<span class="nc">.mars</span> <span class="p">{</span>
  <span class="py">--b</span><span class="p">:</span> <span class="n">radial-gradient</span><span class="p">(</span><span class="nb">circle</span><span class="p">,</span> <span class="m">#e57373</span> <span class="m">0%</span><span class="p">,</span> <span class="m">#af4448</span> <span class="m">100%</span><span class="p">);</span>
  <span class="py">--w</span><span class="p">:</span> <span class="m">3.7105</span><span class="n">cqi</span><span class="p">;</span>
<span class="p">}</span>

<span class="nc">.jupiter</span> <span class="p">{</span>
  <span class="py">--b</span><span class="p">:</span> <span class="n">radial-gradient</span><span class="p">(</span><span class="nb">circle</span><span class="p">,</span> <span class="m">#d4a373</span> <span class="m">0%</span><span class="p">,</span> <span class="m">#b36d32</span> <span class="m">50%</span><span class="p">,</span> <span class="m">#f4e7d3</span> <span class="m">100%</span><span class="p">);</span>
  <span class="py">--w</span><span class="p">:</span> <span class="m">4.8158</span><span class="n">cqi</span><span class="p">;</span>
<span class="p">}</span>

<span class="nc">.saturn</span> <span class="p">{</span>
  <span class="py">--b</span><span class="p">:</span> <span class="n">radial-gradient</span><span class="p">(</span><span class="nb">circle</span><span class="p">,</span> <span class="m">#e6dba0</span> <span class="m">0%</span><span class="p">,</span> <span class="m">#c2a13e</span> <span class="m">100%</span><span class="p">);</span>
  <span class="py">--w</span><span class="p">:</span> <span class="m">5.3684</span><span class="n">cqi</span><span class="p">;</span>
<span class="p">}</span>

<span class="nc">.uranus</span> <span class="p">{</span>
  <span class="py">--b</span><span class="p">:</span> <span class="n">radial-gradient</span><span class="p">(</span><span class="nb">circle</span><span class="p">,</span> <span class="m">#7de3f4</span> <span class="m">0%</span><span class="p">,</span> <span class="m">#3ba0b5</span> <span class="m">100%</span><span class="p">);</span>
  <span class="py">--w</span><span class="p">:</span> <span class="m">4.2632</span><span class="n">cqi</span><span class="p">;</span>
<span class="p">}</span>

<span class="nc">.neptune</span> <span class="p">{</span>
  <span class="py">--b</span><span class="p">:</span> <span class="n">radial-gradient</span><span class="p">(</span><span class="nb">circle</span><span class="p">,</span> <span class="m">#4c6ef5</span> <span class="m">0%</span><span class="p">,</span> <span class="m">#1b3b8c</span> <span class="m">100%</span><span class="p">);</span>
  <span class="py">--w</span><span class="p">:</span> <span class="m">6</span><span class="n">cqi</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And now we have:</p>

<p><a href="assets/1972652/808f14ea.jpg" class="article-body-image-wrapper"><img src="assets/1972652/808f14ea.jpg" alt="Solar System" loading="lazy" width="800" height="800"></a></p>

<p>To <strong>animate</strong> the planets with different trajectory speeds, we add:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="nt">li</span><span class="nd">::after</span> <span class="p">{</span>
  <span class="c">/* previous styles */</span>
  <span class="nl">animation</span><span class="p">:</span> <span class="n">rotate</span> <span class="n">var</span><span class="p">(</span><span class="n">--t</span><span class="p">,</span> <span class="m">3s</span><span class="p">)</span> <span class="n">linear</span> <span class="n">infinite</span><span class="p">;</span>
  <span class="py">offset-path</span><span class="p">:</span> <span class="n">content-box</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Notice the <code>offset-path</code>. That's the <strong>key</strong> to simplifying the trajectory-animations, because all we have to do to move the planet along the shape of the <code>&lt;li&gt;</code> is this:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="k">@keyframes</span> <span class="n">rotate</span> <span class="p">{</span>
  <span class="nt">to</span> <span class="p">{</span>
    <span class="py">offset-distance</span><span class="p">:</span> <span class="m">100%</span><span class="p">;</span>
  <span class="p">}</span>
<span class="p">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>And that's all! I asked ChatGPT to calculate the timings based on "Neptune", with a rotation-speed of <code>20s</code> — and we get:</p>

<p><iframe height="600" src="https://codepen.io/stoumann/embed/XWLqvgN?height=600&amp;default-tab=result&amp;embed-version=2" scrolling="no" frameborder="no" allowtransparency="true" loading="lazy" style="width: 100%;">
</iframe>
</p>


<hr>

<h2>
  <a name="conclusion" href="#conclusion">
  </a>
  Conclusion
</h2>

<p>With just a few rules, we created a simple 2d version of the Solar System in pure CSS. If you want to dive deeper, you can:</p>

<ul>
<li>use real distances and sizes (with <code>calc()</code>)</li>
<li>add a <code>transform: rotateX(angle)</code> to the <code>&lt;ul&gt;</code> to make it pseudo-3D:</li>
</ul>

<p><a href="assets/1972652/38604893.jpg" class="article-body-image-wrapper"><img src="assets/1972652/38604893.jpg" alt="Basic 3D" loading="lazy" width="800" height="508"></a></p>

<p>... and maybe use <code>matrix3d</code> to "re-flatten" the planets?</p>

<p>Happy coding!</p>


<hr>

<blockquote>
<p><strong>UPDATE, 27.08.24</strong>: Some readers have poined out, that the scales and distances are not correct. That is true, and is on purpose. The goal of this article is to show the powers of <code>offset-path</code> and grid-stacks. </p>
</blockquote>

<p>However, if we <em>were</em> to calc the system dimensions with the Sun's width at <code>10cqi</code> and the outer trajectory of Neptune at <code>100cqi</code>, then we have an AU (Astronomical Unit) of <code>2.994cqi</code>, and we get:</p>
