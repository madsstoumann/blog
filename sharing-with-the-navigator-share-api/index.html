			<h1>Sharing with the Navigator Share API</h1>
			<p>Four years ago, I read the article <a href="https://www.moovweb.com/post/anyone-use-social-sharing-buttons-mobile" target="_blank" rel="noopener noreferrer">Does Anyone Use Social Sharing Buttons on Mobile?</a></p>

<p>The result was shocking: <em>Only 0.2% of users ever click on a mobile sharing button!</em> Yet, most clients I've worked for, insist on having sharing buttons on almost all pages.</p>

<p>But, here's the thing: <strong>Users like being in control.</strong> Maybe they don't like Twitter or Facebook, but prefers Instagram, Slack or Teams — or something else entirely.</p>

<p>Why not give them control, and let them decide themselves which platform to share to?</p>

<p>This is where the <a href="https://developer.mozilla.org/en-US/docs/Web/API/Navigator/share" target="_blank" rel="noopener noreferrer">navigator.share</a> api comes in handy. It will use the native sharing of the user's device.</p>

<p>Browser support isn't <em>that</em> great on desktop devices, but on mobile devices, the support is OK:</p>

<p><a href="assets/568411/4b694f4a.jpg" class="article-body-image-wrapper"><img src="assets/568411/4b694f4a.jpg" alt="Webshare api" loading="lazy" width="800" height="382"></a></p>

<p>Let's write our own little "Sharing component", that can use regular, link-based sharing, if native sharing is not supported.</p>

<p>First, the markup:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;div</span>
  <span class="na">data-share=</span><span class="s">"device facebook twitter linkedin"</span>
  <span class="na">data-share-label=</span><span class="s">"Share on"</span>
  <span class="na">data-share-device=</span><span class="s">"Share using device sharing"</span><span class="nt">&gt;</span>
<span class="nt">&lt;/div&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>This tells the script that we want to use <strong>device</strong>-sharing (aka native sharing), but it should fallback to link to Facebook, Twitter and LinkedIn, if native sharing is <strong>not</strong> supported.</p>

<p>The <code>data-share-label</code> will be added as an <code>aria-label</code> to all fallback-links, while the <code>data-share-device</code> will be added to the icon for native sharing.</p>

<p>This is how it looks like on a device supporting native sharing:</p>

<p><a href="assets/568411/981b90c7.jpg" class="article-body-image-wrapper"><img src="assets/568411/981b90c7.jpg" alt="Share API Supported" loading="lazy" width="496" height="233"></a></p>

<p>And this is how it looks like if it doesn't:</p>

<p><a href="assets/568411/4a4eab6d.jpg" class="article-body-image-wrapper"><img src="assets/568411/4a4eab6d.jpg" alt="sharingNoApi" loading="lazy" width="227" height="79"></a></p>

<p><em>JavaScript:</em><br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="k">export</span> <span class="kd">function</span> <span class="nf">Share</span><span class="p">(</span><span class="nx">element</span><span class="p">)</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">canShare</span> <span class="o">=</span> <span class="dl">'</span><span class="s1">share</span><span class="dl">'</span> <span class="k">in</span> <span class="nb">window</span><span class="p">.</span><span class="nb">navigator</span><span class="p">;</span>
  <span class="kd">const</span> <span class="nx">options</span> <span class="o">=</span> <span class="nx">element</span><span class="p">.</span><span class="nx">dataset</span><span class="p">.</span><span class="nx">share</span><span class="p">.</span><span class="nf">split</span><span class="p">(</span><span class="dl">'</span><span class="s1"> </span><span class="dl">'</span><span class="p">);</span>
  <span class="kd">const</span> <span class="nx">shareIndex</span> <span class="o">=</span> <span class="nx">options</span><span class="p">.</span><span class="nf">findIndex</span><span class="p">(</span><span class="nx">option</span> <span class="o">=&gt;</span> <span class="p">{</span> <span class="k">return</span> <span class="nx">option</span> <span class="o">===</span> <span class="dl">'</span><span class="s1">device</span><span class="dl">'</span> <span class="p">});</span>
  <span class="kd">const</span> <span class="nx">shareData</span> <span class="o">=</span> <span class="p">{</span>
    <span class="na">facebook</span><span class="p">:</span> <span class="p">{</span> <span class="na">url</span><span class="p">:</span> <span class="dl">'</span><span class="s1">https://www.facebook.com/share.php?u=</span><span class="dl">'</span> <span class="p">},</span>
    <span class="na">linkedin</span><span class="p">:</span> <span class="p">{</span> <span class="na">url</span><span class="p">:</span> <span class="dl">'</span><span class="s1">https://www.linkedin.com/shareArticle?mini=true&amp;url</span><span class="dl">'</span> <span class="p">},</span>
    <span class="na">twitter</span><span class="p">:</span> <span class="p">{</span> <span class="na">url</span><span class="p">:</span> <span class="dl">'</span><span class="s1">https://www.twitter.com/share?url=</span><span class="dl">'</span> <span class="p">}</span>
  <span class="p">}</span>

  <span class="k">if </span><span class="p">(</span><span class="nx">shareIndex</span> <span class="o">&gt;</span> <span class="o">-</span><span class="mi">1</span> <span class="o">&amp;&amp;</span> <span class="o">!</span><span class="nx">canShare</span><span class="p">)</span> <span class="p">{</span>
    <span class="nx">options</span><span class="p">.</span><span class="nf">splice</span><span class="p">(</span><span class="nx">shareIndex</span><span class="p">,</span> <span class="mi">1</span><span class="p">);</span>
  <span class="p">}</span>

  <span class="k">if </span><span class="p">(</span><span class="nx">shareIndex</span> <span class="o">&gt;</span> <span class="o">-</span><span class="mi">1</span> <span class="o">&amp;&amp;</span> <span class="nx">canShare</span><span class="p">)</span> <span class="p">{</span>
    <span class="kd">const</span> <span class="nx">shareButton</span> <span class="o">=</span> <span class="nf">h</span><span class="p">(</span><span class="dl">'</span><span class="s1">button</span><span class="dl">'</span><span class="p">,</span> <span class="p">{</span>
      <span class="dl">'</span><span class="s1">aria-label</span><span class="dl">'</span><span class="p">:</span> <span class="s2">`</span><span class="p">${</span><span class="nx">element</span><span class="p">.</span><span class="nx">dataset</span><span class="p">.</span><span class="nx">shareDevice</span><span class="p">}</span><span class="s2">`</span><span class="p">,</span>
      <span class="dl">'</span><span class="s1">data-share-item</span><span class="dl">'</span><span class="p">:</span> <span class="dl">''</span>
    <span class="p">},</span> <span class="p">[</span><span class="nf">h</span><span class="p">(</span><span class="dl">'</span><span class="s1">i</span><span class="dl">'</span><span class="p">)]);</span>
    <span class="nx">shareButton</span><span class="p">.</span><span class="nf">addEventListener</span><span class="p">(</span><span class="dl">'</span><span class="s1">click</span><span class="dl">'</span><span class="p">,</span> <span class="p">()</span> <span class="o">=&gt;</span> <span class="p">{</span>
      <span class="nb">navigator</span><span class="p">.</span><span class="nf">share</span><span class="p">({</span>
        <span class="na">title</span><span class="p">:</span> <span class="nb">document</span><span class="p">.</span><span class="nx">title</span><span class="p">,</span>
        <span class="na">url</span><span class="p">:</span> <span class="nx">location</span><span class="p">.</span><span class="nx">href</span>
      <span class="p">}).</span><span class="k">catch</span><span class="p">(()</span> <span class="o">=&gt;</span> <span class="p">{</span> <span class="k">return</span> <span class="p">});</span>
    <span class="p">})</span>
    <span class="nx">element</span><span class="p">.</span><span class="nf">appendChild</span><span class="p">(</span><span class="nx">shareButton</span><span class="p">);</span>
  <span class="p">}</span>
  <span class="k">else</span> <span class="p">{</span>
    <span class="nx">options</span><span class="p">.</span><span class="nf">forEach</span><span class="p">(</span><span class="nx">option</span> <span class="o">=&gt;</span> <span class="p">{</span>
      <span class="kd">const</span> <span class="nx">shareLink</span> <span class="o">=</span> <span class="nf">h</span><span class="p">(</span><span class="dl">'</span><span class="s1">a</span><span class="dl">'</span><span class="p">,</span> <span class="p">{</span>
        <span class="dl">'</span><span class="s1">aria-label</span><span class="dl">'</span><span class="p">:</span> <span class="s2">`</span><span class="p">${</span><span class="nx">element</span><span class="p">.</span><span class="nx">dataset</span><span class="p">.</span><span class="nx">shareLabel</span><span class="p">}</span><span class="s2"> </span><span class="p">${</span><span class="nx">option</span><span class="p">}</span><span class="s2">`</span><span class="p">,</span>
        <span class="dl">'</span><span class="s1">data-share-item</span><span class="dl">'</span><span class="p">:</span> <span class="nx">option</span><span class="p">,</span>
        <span class="na">href</span><span class="p">:</span> <span class="nx">shareData</span><span class="p">[</span><span class="nx">option</span><span class="p">].</span><span class="nx">url</span> <span class="o">+</span> <span class="nf">encodeURIComponent</span><span class="p">(</span><span class="nx">location</span><span class="p">.</span><span class="nx">href</span><span class="p">),</span>
        <span class="na">rel</span><span class="p">:</span> <span class="dl">'</span><span class="s1">noopener noreferrer</span><span class="dl">'</span><span class="p">,</span>
        <span class="na">target</span><span class="p">:</span> <span class="dl">'</span><span class="s1">_blank</span><span class="dl">'</span>
      <span class="p">},</span> <span class="p">[</span><span class="nf">h</span><span class="p">(</span><span class="dl">'</span><span class="s1">i</span><span class="dl">'</span><span class="p">)])</span>
      <span class="nx">element</span><span class="p">.</span><span class="nf">appendChild</span><span class="p">(</span><span class="nx">shareLink</span><span class="p">);</span>
    <span class="p">})</span>
  <span class="p">}</span>
<span class="p">}</span>
</code></pre>

<p>A small helper-function is required:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">function</span> <span class="nf">h</span><span class="p">(</span><span class="nx">type</span><span class="p">,</span> <span class="nx">attributes</span><span class="p">,</span> <span class="nx">children</span> <span class="o">=</span> <span class="p">[])</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">element</span> <span class="o">=</span> <span class="nb">document</span><span class="p">.</span><span class="nf">createElement</span><span class="p">(</span><span class="nx">type</span><span class="p">);</span>
  <span class="k">for </span><span class="p">(</span><span class="kd">let</span> <span class="nx">key</span> <span class="k">in</span> <span class="nx">attributes</span><span class="p">)</span> <span class="p">{</span>
    <span class="nx">element</span><span class="p">.</span><span class="nf">setAttribute</span><span class="p">(</span><span class="nx">key</span><span class="p">,</span> <span class="nx">attributes</span><span class="p">[</span><span class="nx">key</span><span class="p">]);</span>
  <span class="p">}</span>
  <span class="k">if </span><span class="p">(</span><span class="nx">children</span><span class="p">.</span><span class="nx">length</span><span class="p">)</span> <span class="p">{</span>
    <span class="nx">children</span><span class="p">.</span><span class="nf">forEach</span><span class="p">(</span><span class="nx">child</span> <span class="o">=&gt;</span> <span class="p">{</span>
      <span class="k">if </span><span class="p">(</span><span class="k">typeof</span> <span class="nx">child</span> <span class="o">===</span> <span class="dl">'</span><span class="s1">string</span><span class="dl">'</span><span class="p">)</span> <span class="p">{</span>
        <span class="nx">element</span><span class="p">.</span><span class="nf">appendChild</span><span class="p">(</span><span class="nb">document</span><span class="p">.</span><span class="nf">createTextNode</span><span class="p">(</span><span class="nx">child</span><span class="p">));</span>
      <span class="p">}</span> <span class="k">else</span> <span class="p">{</span>
        <span class="nx">element</span><span class="p">.</span><span class="nf">appendChild</span><span class="p">(</span><span class="nx">child</span><span class="p">);</span>
      <span class="p">}</span>
    <span class="p">});</span>
  <span class="p">}</span>
  <span class="k">return</span> <span class="nx">element</span><span class="p">;</span>
<span class="p">}</span>
</code></pre>

<p>And finally, to init the share-component/s:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">shares</span> <span class="o">=</span> <span class="nb">document</span><span class="p">.</span><span class="nf">querySelectorAll</span><span class="p">(</span><span class="s2">`[data-share]`</span><span class="p">);</span>
<span class="nx">shares</span><span class="p">.</span><span class="nf">forEach</span><span class="p">(</span><span class="nx">element</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="nc">Share</span><span class="p">(</span><span class="nx">element</span><span class="p">);</span>
<span class="p">});</span>
</code></pre>
