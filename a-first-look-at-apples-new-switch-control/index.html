		<article>
			<h1>A First Look at Apples New Switch Control</h1>
			<p>Apple have just released <em>Safari Technology Preview 17.4</em>, which introduces a new addition to checkboxes: The <code>switch</code>-attribute:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;input</span> <span class="na">type=</span><span class="s">"checkbox"</span> <span class="na">switch</span><span class="nt">&gt;</span>
<span class="nt">&lt;input</span> <span class="na">type=</span><span class="s">"checkbox"</span> <span class="na">switch</span> <span class="na">checked</span><span class="nt">&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>In all it's glory, this is what you get with the above markup:</p>

<p><a href="assets/1743520/63b07ae4.jpg" class="article-body-image-wrapper"><img src="assets/1743520/63b07ae4.jpg" alt="Checkbox Switch" loading="lazy" width="82" height="110"></a></p>

<p>It's still early days, because when you zoom in, you get this funky result:</p>

<p><a href="assets/1743520/948b25d4.jpg" class="article-body-image-wrapper"><img src="assets/1743520/948b25d4.jpg" alt="Checkbox Switch Zoomed In" loading="lazy" width="224" height="260"></a></p>

<p>Interestingly enough, it's <strong>not</strong> using <a href="https://developer.mozilla.org/en-US/docs/Web/CSS/system-color" target="_blank" rel="noopener noreferrer">system colors</a> for the un-checked state, but for the checked state, it's using <code>AccentColor</code>. </p>

<p>In dark mode, weirdly enough, it doesn't use  <code>AccentColor</code>. </p>

<p>It would be much more consistent, if the system colors <code>ButtonFace</code> and <code>AccentColor</code> were used for the two states, no matter what the <code>color-scheme</code> is.</p>

<blockquote>
<p><strong>NOTE:</strong> At the moment, Safari is actually the <strong>only</strong> browser that supports the system color <code>AccentColor</code>.</p>
</blockquote>


<hr>

<h2>
  <a name="under-the-hood" href="#under-the-hood">
  </a>
  Under the Hood
</h2>

<p>Inspecting the control reveals an <code>aspect-ratio</code> of <code>1.8/1</code> and a relative height of approx. <code>1.1em</code>, so a super-simple fallback could be:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight html"><code><span class="nt">&lt;input</span> <span class="na">type=</span><span class="s">"checkbox"</span> <span class="na">role=</span><span class="s">"switch"</span><span class="nt">&gt;</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>





<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">[</span><span class="nt">role</span><span class="o">=</span><span class="nt">switch</span><span class="o">]</span> <span class="p">{</span>
  <span class="nl">appearance</span><span class="p">:</span> <span class="nb">none</span><span class="p">;</span>
  <span class="py">aspect-ratio</span><span class="p">:</span> <span class="m">1.8</span><span class="p">/</span><span class="m">1</span><span class="p">;</span>
  <span class="nl">background</span><span class="p">:</span> <span class="m">#ddd</span><span class="p">;</span>
  <span class="nl">border-radius</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">grid</span><span class="p">;</span>
  <span class="nl">height</span><span class="p">:</span> <span class="m">1.1em</span><span class="p">;</span>
  <span class="nl">margin</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="nl">padding</span><span class="p">:</span> <span class="m">0.0625em</span><span class="p">;</span>
  <span class="err">&amp;::after</span> <span class="err">{</span>
    <span class="nl">background</span><span class="p">:</span> <span class="m">#fff</span><span class="p">;</span>
    <span class="nl">border-radius</span><span class="p">:</span> <span class="m">50%</span><span class="p">;</span>
    <span class="nl">content</span><span class="p">:</span> <span class="s2">''</span><span class="p">;</span>
    <span class="nl">width</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>
  <span class="p">}</span>
  <span class="o">&amp;</span><span class="nd">:checked</span> <span class="p">{</span>
    <span class="nl">background</span><span class="p">:</span> <span class="m">#16f</span><span class="p">;</span>
    <span class="nl">justify-content</span><span class="p">:</span> <span class="n">end</span><span class="p">;</span>
  <span class="p">}</span>
<span class="err">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p>Using grid here, you can control the border with <code>padding</code> and scale it to any size, by updating <code>font-size</code>:</p>

<p><a href="assets/1743520/df5c3d35.jpg" class="article-body-image-wrapper"><img src="assets/1743520/df5c3d35.jpg" alt="Switch fallback" loading="lazy" width="450" height="448"></a></p>

<p>If you want to fine-control the various parts better, add some CSS custom properties:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight css"><code><span class="o">[</span><span class="nt">role</span><span class="o">=</span><span class="nt">switch</span><span class="o">]</span> <span class="p">{</span>
  <span class="py">--_bg</span><span class="p">:</span> <span class="m">#DEDEDE</span><span class="p">;</span>
  <span class="py">--_bga</span><span class="p">:</span> <span class="m">#FFF</span><span class="p">;</span>
  <span class="nl">appearance</span><span class="p">:</span> <span class="nb">none</span><span class="p">;</span>
  <span class="py">aspect-ratio</span><span class="p">:</span> <span class="m">1.8</span><span class="p">/</span><span class="m">1</span><span class="p">;</span>
  <span class="nl">background</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--_bg</span><span class="p">);</span>
  <span class="nl">border-radius</span><span class="p">:</span> <span class="m">1em</span><span class="p">;</span>
  <span class="nl">display</span><span class="p">:</span> <span class="n">grid</span><span class="p">;</span>
  <span class="nl">height</span><span class="p">:</span> <span class="m">1.1em</span><span class="p">;</span>
  <span class="nl">margin</span><span class="p">:</span> <span class="m">0</span><span class="p">;</span>
  <span class="err">&amp;::after</span> <span class="err">{</span>
    <span class="nl">background</span><span class="p">:</span> <span class="n">var</span><span class="p">(</span><span class="n">--_bga</span><span class="p">);</span>
    <span class="nl">border-radius</span><span class="p">:</span> <span class="m">50%</span><span class="p">;</span>
    <span class="nl">border</span><span class="p">:</span> <span class="m">0.046875em</span> <span class="nb">solid</span> <span class="n">color-mix</span><span class="p">(</span><span class="n">in</span> <span class="n">srgb</span><span class="p">,</span> <span class="n">var</span><span class="p">(</span><span class="n">--_bg</span><span class="p">)</span> <span class="m">95%</span><span class="p">,</span> <span class="m">#000</span><span class="p">);</span>
    <span class="nl">content</span><span class="p">:</span> <span class="s2">''</span><span class="p">;</span>
    <span class="nl">display</span><span class="p">:</span> <span class="nb">block</span><span class="p">;</span>
    <span class="nl">height</span><span class="p">:</span> <span class="m">1.00625em</span><span class="p">;</span>
    <span class="nl">width</span><span class="p">:</span> <span class="m">1.00625em</span><span class="p">;</span>
  <span class="p">}</span>
  <span class="o">&amp;</span><span class="nd">:checked</span> <span class="p">{</span>
    <span class="py">--_bg</span><span class="p">:</span> <span class="m">#0f83ff</span><span class="p">;</span>
    <span class="nl">justify-content</span><span class="p">:</span> <span class="n">end</span><span class="p">;</span>
  <span class="p">}</span>
<span class="err">}</span>
</code></pre>
<div class="highlight__panel js-actions-panel">
<div class="highlight__panel-action js-fullscreen-code-action">
    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-on"><title>Enter fullscreen mode</title>
    <path d="M16 3h6v6h-2V5h-4V3zM2 3h6v2H4v4H2V3zm18 16v-4h2v6h-6v-2h4zM4 19h4v2H2v-6h2v4z"></path>
</svg>

    <svg xmlns="http://www.w3.org/2000/svg" width="20px" height="20px" viewbox="0 0 24 24" class="highlight-action crayons-icon highlight-action--fullscreen-off"><title>Exit fullscreen mode</title>
    <path d="M18 7h4v2h-6V3h2v4zM8 9H2V7h4V3h2v6zm10 8v4h-2v-6h6v2h-4zM8 15v6H6v-4H2v-2h6z"></path>
</svg>

</div>
</div>
</div>



<p><a href="assets/1743520/619cd704.jpg" class="article-body-image-wrapper"><img src="assets/1743520/619cd704.jpg" alt="Finer Control" loading="lazy" width="444" height="446"></a></p>

<p>And if you <strong>really</strong> want to simulate Apple's switch, dive into <code>box-shadow</code>, as they're using very subtle box-shadows for both parts of the switch!</p>


<hr>

<p>It will be interesting to see, if <code>switch</code> will make it into the standard, and if other browsers will adopt it.</p>

<p>Otherwise, stick with <code>role="switch"</code> for now.</p>
