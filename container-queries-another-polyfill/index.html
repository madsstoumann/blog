			<h1>Container Queries: Another Polyfill</h1>
			<p>I <strong>love</strong> container queries — I have been waiting for them for years.</p>

<p>But, alas, until all browsers have implemented them, we have to rely on polyfills to make them work. </p>

<p>While other polyfills work just fine, I needed something that didn't require postCSS or a specific syntax – and more tailored to a project, I'm currently working on. </p>

<p>So I decided to make my own polyfill, and ended up with a script, that's just 502 bytes gzipped:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="k">if</span><span class="p">(</span><span class="o">!</span><span class="p">(</span><span class="dl">"</span><span class="s2">CSSContainerRule</span><span class="dl">"</span><span class="k">in</span> <span class="nb">window</span><span class="p">)){</span><span class="kd">const</span> <span class="nx">e</span><span class="o">=</span><span class="p">(</span><span class="nx">e</span><span class="p">,</span><span class="nx">s</span><span class="p">)</span><span class="o">=&gt;</span><span class="nx">e</span><span class="p">.</span><span class="nf">reduce</span><span class="p">((</span><span class="nx">e</span><span class="p">,</span><span class="nx">t</span><span class="p">,</span><span class="nx">c</span><span class="p">)</span><span class="o">=&gt;</span><span class="nf">s</span><span class="p">(</span><span class="nx">t</span><span class="p">)?</span><span class="nx">c</span><span class="p">:</span><span class="nx">e</span><span class="p">,</span><span class="o">-</span><span class="mi">1</span><span class="p">),</span><span class="nx">s</span><span class="o">=</span><span class="k">new</span> <span class="nc">ResizeObserver</span><span class="p">(</span><span class="nx">s</span><span class="o">=&gt;</span><span class="p">{</span><span class="k">for</span><span class="p">(</span><span class="kd">let</span> <span class="nx">t</span> <span class="k">of</span> <span class="nx">s</span><span class="p">){</span><span class="kd">const</span> <span class="nx">s</span><span class="o">=</span><span class="nx">t</span><span class="p">.</span><span class="nx">target</span><span class="p">,</span><span class="nx">c</span><span class="o">=</span><span class="nx">s</span><span class="p">.</span><span class="nx">__cq</span><span class="p">,</span><span class="nx">n</span><span class="o">=</span><span class="nf">e</span><span class="p">(</span><span class="nx">c</span><span class="p">.</span><span class="nx">bp</span><span class="p">,</span><span class="nx">e</span><span class="o">=&gt;</span><span class="nx">e</span><span class="o">&lt;=</span><span class="nx">t</span><span class="p">.</span><span class="nx">contentRect</span><span class="p">.</span><span class="nx">width</span><span class="p">);</span><span class="nx">n</span><span class="o">!==</span><span class="nx">s</span><span class="p">.</span><span class="nx">index</span><span class="p">?(</span><span class="nx">s</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nx">cssText</span><span class="o">=</span><span class="nx">c</span><span class="p">.</span><span class="nx">css</span><span class="p">.</span><span class="nf">filter</span><span class="p">((</span><span class="nx">e</span><span class="p">,</span><span class="nx">s</span><span class="p">)</span><span class="o">=&gt;</span><span class="nx">s</span><span class="o">&lt;=</span><span class="nx">n</span><span class="p">).</span><span class="nf">join</span><span class="p">(</span><span class="dl">""</span><span class="p">),</span><span class="nx">c</span><span class="p">.</span><span class="nx">index</span><span class="o">=</span><span class="nx">n</span><span class="p">):</span><span class="o">-</span><span class="mi">1</span><span class="o">===</span><span class="nx">n</span><span class="o">&amp;&amp;</span><span class="nx">s</span><span class="p">.</span><span class="nf">removeAttribute</span><span class="p">(</span><span class="dl">"</span><span class="s2">style</span><span class="dl">"</span><span class="p">)}});[...</span><span class="nb">document</span><span class="p">.</span><span class="nx">styleSheets</span><span class="p">].</span><span class="nf">map</span><span class="p">(</span><span class="nx">e</span><span class="o">=&gt;</span><span class="p">{</span><span class="nf">fetch</span><span class="p">(</span><span class="nx">e</span><span class="p">.</span><span class="nx">href</span><span class="p">).</span><span class="nf">then</span><span class="p">(</span><span class="nx">e</span><span class="o">=&gt;</span><span class="nx">e</span><span class="p">.</span><span class="nf">text</span><span class="p">()).</span><span class="nf">then</span><span class="p">(</span><span class="nx">e</span><span class="o">=&gt;</span><span class="p">{</span><span class="kd">let</span> <span class="nx">t</span><span class="p">,</span><span class="nx">c</span><span class="o">=</span><span class="k">new</span> <span class="nb">Set</span><span class="p">;</span><span class="kd">const</span> <span class="nx">n</span><span class="o">=</span><span class="sr">/@container</span><span class="se">\s?\(</span><span class="sr">min-width:</span><span class="se">\s?(?&lt;</span><span class="sr">breakpoint&gt;.*</span><span class="se">)</span><span class="sr">px</span><span class="se">\)\s?\{\s?(?&lt;</span><span class="sr">selector&gt;.*</span><span class="se">)\s?\{\s?(?&lt;</span><span class="sr">css&gt;.*;</span><span class="se">)\s?\}</span><span class="sr">/gm</span><span class="p">;</span><span class="k">for</span><span class="p">(;</span><span class="nx">t</span><span class="o">=</span><span class="nx">n</span><span class="p">.</span><span class="nf">exec</span><span class="p">(</span><span class="nx">e</span><span class="p">);)[...</span><span class="nb">document</span><span class="p">.</span><span class="nf">querySelectorAll</span><span class="p">(</span><span class="nx">t</span><span class="p">.</span><span class="nx">groups</span><span class="p">.</span><span class="nx">selector</span><span class="p">)].</span><span class="nf">forEach</span><span class="p">(</span><span class="nx">e</span><span class="o">=&gt;</span><span class="p">{</span><span class="nx">e</span><span class="p">.</span><span class="nx">__cq</span><span class="o">=</span><span class="nx">e</span><span class="p">.</span><span class="nx">__cq</span><span class="o">||</span><span class="p">{</span><span class="na">bp</span><span class="p">:[],</span><span class="na">css</span><span class="p">:[],</span><span class="na">index</span><span class="p">:</span><span class="o">-</span><span class="mi">1</span><span class="p">};</span><span class="kd">const</span> <span class="nx">s</span><span class="o">=</span><span class="nx">t</span><span class="p">.</span><span class="nx">groups</span><span class="p">.</span><span class="nx">breakpoint</span><span class="o">-</span><span class="mi">0</span><span class="p">,</span><span class="nx">n</span><span class="o">=</span><span class="nx">t</span><span class="p">.</span><span class="nx">groups</span><span class="p">.</span><span class="nx">css</span><span class="p">,</span><span class="nx">o</span><span class="o">=</span><span class="nx">e</span><span class="p">.</span><span class="nx">__cq</span><span class="p">.</span><span class="nx">bp</span><span class="p">.</span><span class="nf">findIndex</span><span class="p">(</span><span class="nx">e</span><span class="o">=&gt;</span><span class="nx">e</span><span class="o">===</span><span class="nx">s</span><span class="p">);</span><span class="nx">o</span><span class="o">&lt;</span><span class="mi">0</span><span class="p">?(</span><span class="nx">e</span><span class="p">.</span><span class="nx">__cq</span><span class="p">.</span><span class="nx">bp</span><span class="p">.</span><span class="nf">push</span><span class="p">(</span><span class="nx">s</span><span class="p">),</span><span class="nx">e</span><span class="p">.</span><span class="nx">__cq</span><span class="p">.</span><span class="nx">css</span><span class="p">.</span><span class="nf">push</span><span class="p">(</span><span class="nx">n</span><span class="p">)):</span><span class="nx">e</span><span class="p">.</span><span class="nx">__cq</span><span class="p">.</span><span class="nx">css</span><span class="p">[</span><span class="nx">o</span><span class="p">]</span><span class="o">=</span><span class="nx">e</span><span class="p">.</span><span class="nx">__cq</span><span class="p">.</span><span class="nx">css</span><span class="p">[</span><span class="nx">o</span><span class="p">].</span><span class="nf">concat</span><span class="p">(</span><span class="nx">n</span><span class="p">),</span><span class="nx">c</span><span class="p">.</span><span class="nf">add</span><span class="p">(</span><span class="nx">e</span><span class="p">)});</span><span class="k">for</span><span class="p">(</span><span class="kd">let</span> <span class="nx">e</span> <span class="k">of</span> <span class="nx">c</span><span class="p">)</span><span class="nx">s</span><span class="p">.</span><span class="nf">observe</span><span class="p">(</span><span class="nx">e</span><span class="p">)})})}</span>
</code></pre>

<p>OK, that's <em>completely</em> unreadable, so let's set up the stage with HTML and CSS, before we look at the script!</p>


<hr>

<h2>
  <a name="setting-the-stage" href="#setting-the-stage">
  </a>
  Setting the stage
</h2>

<p>In HTML, add this to a new document:<br>
</p>

<div class="highlight js-code-highlight">

  <span class="nt">&lt;div</span> <span class="na">class=</span><span class="s">"cqw"</span><span class="nt">&gt;&lt;div</span> <span class="na">class=</span><span class="s">"cq cq4"</span><span class="nt">&gt;&lt;/div&gt;&lt;/div&gt;</span>

<h2>
  <a name="the-script" href="#the-script">

  The Script
</h2>

<p>First we need to check whether we need the script or not:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="k">if </span><span class="p">(</span><span class="o">!</span><span class="p">(</span><span class="dl">'</span><span class="s1">CSSContainerRule</span><span class="dl">'</span> <span class="k">in</span> <span class="nb">window</span><span class="p">))</span>
</code></pre>

<p>Next, we'll iterate the stylesheets on the page, grab them (again, but they are cached) with <code>fetch()</code>, convert the result with <code>.text()</code> and return the rules as a string:<br>

<pre class="highlight javascript"><code><span class="p">[...</span><span class="nb">document</span><span class="p">.</span><span class="nx">styleSheets</span><span class="p">].</span><span class="nf">map</span><span class="p">(</span><span class="nx">sheet</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="nf">fetch</span><span class="p">(</span><span class="nx">sheet</span><span class="p">.</span><span class="nx">href</span><span class="p">)</span>
    <span class="p">.</span><span class="nf">then</span><span class="p">(</span><span class="nx">css</span> <span class="o">=&gt;</span> <span class="nx">css</span><span class="p">.</span><span class="nf">text</span><span class="p">())</span>
    <span class="p">.</span><span class="nx">then</span><span class="p">(</span><span class="nx">rules</span> <span class="o">=&gt;</span> <span class="p">{</span> <span class="p">...</span> <span class="p">}</span>
</code></pre>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">re</span> <span class="o">=</span> <span class="sr">/@container</span><span class="se">\s?\(</span><span class="sr">min-width:</span><span class="se">\s?(?&lt;</span><span class="sr">breakpoint&gt;.*</span><span class="se">)</span><span class="sr">px</span><span class="se">\)\s?\{\s?(?&lt;</span><span class="sr">selector&gt;.*</span><span class="se">)\s?\{\s?(?&lt;</span><span class="sr">css&gt;.*;</span><span class="se">)\s?\}</span><span class="sr">/gm</span>
</code></pre>

<blockquote>
<p><strong>NOTE:</strong> A good place to play around with RegEx, is <a href="https://regex101.com/" target="_blank" rel="noopener noreferrer">regex101.com</a></p>

<p>This expression will return groups of matches entitled <code>breakpoint</code>, <code>selector</code> and <code>css</code>.</p>

<p>Now, let's iterate the matches. For each match, we'll use a <code>querySelectorAll</code> to find the elements in the <code>DOM</code> matching the <code>selector</code>.</p>

<p>On each element, we'll create an object, <code>__cq</code> that will contain an array of breakpoints, the css for each breakpoint, and an index. For each iteration, we'll check whether the object already exists:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">let</span> <span class="nx">match</span><span class="p">;</span>
<span class="kd">let</span> <span class="nx">observe</span> <span class="o">=</span> <span class="k">new</span> <span class="nc">Set</span><span class="p">();</span>
<span class="k">while </span><span class="p">(</span><span class="nx">match</span> <span class="o">=</span> <span class="nx">re</span><span class="p">.</span><span class="nf">exec</span><span class="p">(</span><span class="nx">rules</span><span class="p">))</span> <span class="p">{</span>
  <span class="p">[...</span><span class="nb">document</span><span class="p">.</span><span class="nf">querySelectorAll</span><span class="p">(</span><span class="nx">match</span><span class="p">.</span><span class="nx">groups</span><span class="p">.</span><span class="nx">selector</span><span class="p">)].</span><span class="nf">forEach</span><span class="p">(</span><span class="nx">elm</span> <span class="o">=&gt;</span> <span class="p">{</span>
    <span class="nx">elm</span><span class="p">.</span><span class="nx">__cq</span> <span class="o">=</span> <span class="nx">elm</span><span class="p">.</span><span class="nx">__cq</span> <span class="o">||</span> <span class="p">{</span> <span class="na">bp</span><span class="p">:</span> <span class="p">[],</span> <span class="na">css</span><span class="p">:</span> <span class="p">[],</span> <span class="na">index</span><span class="p">:</span> <span class="o">-</span><span class="mi">1</span> <span class="p">}</span>
    <span class="kd">const</span> <span class="nx">bp</span> <span class="o">=</span> <span class="nx">match</span><span class="p">.</span><span class="nx">groups</span><span class="p">.</span><span class="nx">breakpoint</span><span class="o">-</span><span class="mi">0</span><span class="p">;</span>
    <span class="kd">const</span> <span class="nx">css</span> <span class="o">=</span> <span class="nx">match</span><span class="p">.</span><span class="nx">groups</span><span class="p">.</span><span class="nx">css</span><span class="p">;</span>
    <span class="kd">const</span> <span class="nx">index</span> <span class="o">=</span> <span class="nx">elm</span><span class="p">.</span><span class="nx">__cq</span><span class="p">.</span><span class="nx">bp</span><span class="p">.</span><span class="nf">findIndex</span><span class="p">(</span><span class="nx">item</span> <span class="o">=&gt;</span> <span class="nx">item</span> <span class="o">===</span> <span class="nx">bp</span><span class="p">);</span>
    <span class="k">if </span><span class="p">(</span><span class="nx">index</span> <span class="o">&lt;</span> <span class="mi">0</span><span class="p">)</span> <span class="p">{</span>
      <span class="nx">elm</span><span class="p">.</span><span class="nx">__cq</span><span class="p">.</span><span class="nx">bp</span><span class="p">.</span><span class="nf">push</span><span class="p">(</span><span class="nx">bp</span><span class="p">);</span>
      <span class="nx">elm</span><span class="p">.</span><span class="nx">__cq</span><span class="p">.</span><span class="nx">css</span><span class="p">.</span><span class="nf">push</span><span class="p">(</span><span class="nx">css</span><span class="p">);</span>
    <span class="p">}</span>
    <span class="k">else</span> <span class="p">{</span>
      <span class="nx">elm</span><span class="p">.</span><span class="nx">__cq</span><span class="p">.</span><span class="nx">css</span><span class="p">[</span><span class="nx">index</span><span class="p">]</span> <span class="o">=</span> <span class="nx">elm</span><span class="p">.</span><span class="nx">__cq</span><span class="p">.</span><span class="nx">css</span><span class="p">[</span><span class="nx">index</span><span class="p">].</span><span class="nf">concat</span><span class="p">(</span><span class="nx">css</span><span class="p">);</span>
    <span class="p">}</span>
    <span class="nx">observe</span><span class="p">.</span><span class="nf">add</span><span class="p">(</span><span class="nx">elm</span><span class="p">);</span>
  <span class="p">})</span>
<span class="p">}</span>
</code></pre>

</code></pre>

<p><code>RO</code> is a <code>ResizeObserver</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">RO</span> <span class="o">=</span> <span class="k">new</span> <span class="nc">ResizeObserver</span><span class="p">(</span><span class="nx">entries</span> <span class="o">=&gt;</span> <span class="p">{</span>
  <span class="k">for </span><span class="p">(</span><span class="kd">let</span> <span class="nx">entry</span> <span class="k">of</span> <span class="nx">entries</span><span class="p">)</span> <span class="p">{</span>
    <span class="kd">const</span> <span class="nx">elm</span> <span class="o">=</span> <span class="nx">entry</span><span class="p">.</span><span class="nx">target</span><span class="p">;</span>
    <span class="kd">const</span> <span class="nx">cq</span> <span class="o">=</span> <span class="nx">elm</span><span class="p">.</span><span class="nx">__cq</span><span class="p">;</span>
    <span class="kd">const</span> <span class="nx">lastIndex</span> <span class="o">=</span> <span class="nf">findLastIndex</span><span class="p">(</span><span class="nx">cq</span><span class="p">.</span><span class="nx">bp</span><span class="p">,</span> <span class="nx">item</span> <span class="o">=&gt;</span> <span class="nx">item</span> <span class="o">&lt;=</span> <span class="nx">entry</span><span class="p">.</span><span class="nx">contentRect</span><span class="p">.</span><span class="nx">width</span><span class="p">);</span>
    <span class="k">if </span><span class="p">(</span><span class="nx">lastIndex</span> <span class="o">!==</span> <span class="nx">elm</span><span class="p">.</span><span class="nx">index</span><span class="p">)</span> <span class="p">{</span>
      <span class="nx">elm</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nx">cssText</span> <span class="o">=</span> <span class="nx">cq</span><span class="p">.</span><span class="nx">css</span><span class="p">.</span><span class="nf">filter</span><span class="p">((</span><span class="nx">item</span><span class="p">,</span> <span class="nx">index</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="nx">index</span> <span class="o">&lt;=</span> <span class="nx">lastIndex</span><span class="p">).</span><span class="nf">join</span><span class="p">(</span><span class="dl">''</span><span class="p">);</span>
      <span class="nx">cq</span><span class="p">.</span><span class="nx">index</span> <span class="o">=</span> <span class="nx">lastIndex</span><span class="p">;</span>
    <span class="p">}</span>
    <span class="k">else</span> <span class="k">if </span><span class="p">(</span><span class="nx">lastIndex</span> <span class="o">===</span> <span class="o">-</span><span class="mi">1</span><span class="p">)</span> <span class="nx">elm</span><span class="p">.</span><span class="nf">removeAttribute</span><span class="p">(</span><span class="dl">'</span><span class="s1">style</span><span class="dl">'</span><span class="p">);</span>
  <span class="p">}</span>
<span class="p">});</span>

</code></pre>

<p>It's using a small method called <code>findLastIndex</code>:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="kd">const</span> <span class="nx">findLastIndex</span> <span class="o">=</span> <span class="p">(</span><span class="nx">items</span><span class="p">,</span> <span class="nx">callback</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="nx">items</span><span class="p">.</span><span class="nf">reduce</span><span class="p">((</span><span class="nx">acc</span><span class="p">,</span> <span class="nx">curr</span><span class="p">,</span> <span class="nx">index</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="nf">callback</span><span class="p">(</span><span class="nx">curr</span><span class="p">)</span> <span class="p">?</span> <span class="nx">index</span> <span class="p">:</span> <span class="nx">acc</span><span class="p">,</span> <span class="o">-</span><span class="mi">1</span><span class="p">);</span>
</code></pre>

<p>... and use that to determine which <code>breakpoint</code> (bp) is currently needed, and then sets the <code>style&gt;</code>-attribute of the element to the <code>css</code> from the <code>__cq</code>-object.</p>

<p>Here's the complete script — add this or the minified version above to a <code>&lt;script&gt;</code>-tag on your demo-page:<br>
</p>

<div class="highlight js-code-highlight">
<pre class="highlight javascript"><code><span class="k">if </span><span class="p">(</span><span class="o">!</span><span class="p">(</span><span class="dl">'</span><span class="s1">CSSContainerRule</span><span class="dl">'</span> <span class="k">in</span> <span class="nb">window</span><span class="p">))</span> <span class="p">{</span>
  <span class="kd">const</span> <span class="nx">findLastIndex</span> <span class="o">=</span> <span class="p">(</span><span class="nx">items</span><span class="p">,</span> <span class="nx">callback</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="nx">items</span><span class="p">.</span><span class="nf">reduce</span><span class="p">((</span><span class="nx">acc</span><span class="p">,</span> <span class="nx">curr</span><span class="p">,</span> <span class="nx">index</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="nf">callback</span><span class="p">(</span><span class="nx">curr</span><span class="p">)</span> <span class="p">?</span> <span class="nx">index</span> <span class="p">:</span> <span class="nx">acc</span><span class="p">,</span> <span class="o">-</span><span class="mi">1</span><span class="p">);</span>
  <span class="kd">const</span> <span class="nx">RO</span> <span class="o">=</span> <span class="k">new</span> <span class="nc">ResizeObserver</span><span class="p">(</span><span class="nx">entries</span> <span class="o">=&gt;</span> <span class="p">{</span>
    <span class="k">for </span><span class="p">(</span><span class="kd">let</span> <span class="nx">entry</span> <span class="k">of</span> <span class="nx">entries</span><span class="p">)</span> <span class="p">{</span>
      <span class="kd">const</span> <span class="nx">elm</span> <span class="o">=</span> <span class="nx">entry</span><span class="p">.</span><span class="nx">target</span><span class="p">;</span>
      <span class="kd">const</span> <span class="nx">cq</span> <span class="o">=</span> <span class="nx">elm</span><span class="p">.</span><span class="nx">__cq</span><span class="p">;</span>
      <span class="kd">const</span> <span class="nx">lastIndex</span> <span class="o">=</span> <span class="nf">findLastIndex</span><span class="p">(</span><span class="nx">cq</span><span class="p">.</span><span class="nx">bp</span><span class="p">,</span> <span class="nx">item</span> <span class="o">=&gt;</span> <span class="nx">item</span> <span class="o">&lt;=</span> <span class="nx">entry</span><span class="p">.</span><span class="nx">contentRect</span><span class="p">.</span><span class="nx">width</span><span class="p">);</span>
      <span class="k">if </span><span class="p">(</span><span class="nx">lastIndex</span> <span class="o">!==</span> <span class="nx">elm</span><span class="p">.</span><span class="nx">index</span><span class="p">)</span> <span class="p">{</span>
        <span class="nx">elm</span><span class="p">.</span><span class="nx">style</span><span class="p">.</span><span class="nx">cssText</span> <span class="o">=</span> <span class="nx">cq</span><span class="p">.</span><span class="nx">css</span><span class="p">.</span><span class="nf">filter</span><span class="p">((</span><span class="nx">item</span><span class="p">,</span> <span class="nx">index</span><span class="p">)</span> <span class="o">=&gt;</span> <span class="nx">index</span> <span class="o">&lt;=</span> <span class="nx">lastIndex</span><span class="p">).</span><span class="nf">join</span><span class="p">(</span><span class="dl">''</span><span class="p">);</span>
        <span class="nx">cq</span><span class="p">.</span><span class="nx">index</span> <span class="o">=</span> <span class="nx">lastIndex</span><span class="p">;</span>
      <span class="p">}</span>
      <span class="k">else</span> <span class="k">if </span><span class="p">(</span><span class="nx">lastIndex</span> <span class="o">===</span> <span class="o">-</span><span class="mi">1</span><span class="p">)</span> <span class="nx">elm</span><span class="p">.</span><span class="nf">removeAttribute</span><span class="p">(</span><span class="dl">'</span><span class="s1">style</span><span class="dl">'</span><span class="p">);</span>
    <span class="p">}</span>
  <span class="p">});</span>

      <span class="p">.</span><span class="nf">then</span><span class="p">(</span><span class="nx">rules</span> <span class="o">=&gt;</span> <span class="p">{</span>
        <span class="kd">let</span> <span class="nx">match</span><span class="p">;</span>
        <span class="kd">let</span> <span class="nx">observe</span> <span class="o">=</span> <span class="k">new</span> <span class="nc">Set</span><span class="p">();</span>
        <span class="kd">const</span> <span class="nx">re</span> <span class="o">=</span> <span class="sr">/@container</span><span class="se">\s?\(</span><span class="sr">min-width:</span><span class="se">\s?(?&lt;</span><span class="sr">breakpoint&gt;.*</span><span class="se">)</span><span class="sr">px</span><span class="se">\)\s?\{\s?(?&lt;</span><span class="sr">selector&gt;.*</span><span class="se">)\s?\{\s?(?&lt;</span><span class="sr">css&gt;.*;</span><span class="se">)\s?\}</span><span class="sr">/gm</span>
        <span class="k">while </span><span class="p">(</span><span class="nx">match</span> <span class="o">=</span> <span class="nx">re</span><span class="p">.</span><span class="nf">exec</span><span class="p">(</span><span class="nx">rules</span><span class="p">))</span> <span class="p">{</span>
          <span class="p">[...</span><span class="nb">document</span><span class="p">.</span><span class="nf">querySelectorAll</span><span class="p">(</span><span class="nx">match</span><span class="p">.</span><span class="nx">groups</span><span class="p">.</span><span class="nx">selector</span><span class="p">)].</span><span class="nf">forEach</span><span class="p">(</span><span class="nx">elm</span> <span class="o">=&gt;</span> <span class="p">{</span>
            <span class="nx">elm</span><span class="p">.</span><span class="nx">__cq</span> <span class="o">=</span> <span class="nx">elm</span><span class="p">.</span><span class="nx">__cq</span> <span class="o">||</span> <span class="p">{</span> <span class="na">bp</span><span class="p">:</span> <span class="p">[],</span> <span class="na">css</span><span class="p">:</span> <span class="p">[],</span> <span class="na">index</span><span class="p">:</span> <span class="o">-</span><span class="mi">1</span> <span class="p">}</span>
            <span class="kd">const</span> <span class="nx">bp</span> <span class="o">=</span> <span class="nx">match</span><span class="p">.</span><span class="nx">groups</span><span class="p">.</span><span class="nx">breakpoint</span><span class="o">-</span><span class="mi">0</span><span class="p">;</span>

            <span class="kd">const</span> <span class="nx">index</span> <span class="o">=</span> <span class="nx">elm</span><span class="p">.</span><span class="nx">__cq</span><span class="p">.</span><span class="nx">bp</span><span class="p">.</span><span class="nf">findIndex</span><span class="p">(</span><span class="nx">item</span> <span class="o">=&gt;</span> <span class="nx">item</span> <span class="o">===</span> <span class="nx">bp</span><span class="p">);</span>

<p>Now, when you resize your page, the boxes change <code>aspect-ratio</code> and <code>background-color</code>:</p>

<p><a href="assets/709018/398c4645.jpg" class="article-body-image-wrapper"><img src="assets/709018/398c4645.jpg" alt="CQ example 2" loading="lazy" width="712" height="356"></a></p>

<p>At <code>900px</code> the layout returns to it's initial values, and then at <code>1200px</code> it's back to the updated values.</p>

<blockquote>
<p><strong>NOTE:</strong> It's <em>mobile first</em>, thus only <code>min-width</code> will work, and <strong>only</strong> with pixels as it's value, since the <code>contentRect.width</code> of the <code>ResizeObserver</code> returns a value in pixels.</p>
</blockquote>
